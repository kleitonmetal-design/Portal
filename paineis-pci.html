<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painéis PCI DSS - Gestão de Conformidade</title>
    <style>
        :root {
            --primary: #7c3aed;
            --primary-dark: #6d28d9;
            --accent: #a78bfa;
            --accent-light: #c4b5fd;
            --text-white: #ffffff;
            --text-dark: #1a1a1a;
            --text-gray: #e0e0e0;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.15);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #6d28d9 0%, #5b21b6 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-gray);
            line-height: 1.6;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(124, 58, 237, 0.1), transparent),
                        radial-gradient(circle at 80% 80%, rgba(124, 58, 237, 0.1), transparent);
            pointer-events: none;
            z-index: 0;
        }

        main, header, footer, .hero-section, .main-container {
            position: relative;
            z-index: 1;
        }

        .site-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(42, 42, 42, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 2px solid var(--primary);
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            gap: 20px;
        }

        .logo-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.3em;
            color: var(--primary);
            white-space: nowrap;
            text-shadow: 0 2px 8px rgba(124, 58, 237, 0.3);
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(124, 58, 237, 0.15);
            color: var(--primary);
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95em;
            transition: all 0.3s ease;
            margin-left: auto;
        }

        .back-button:hover {
            background: var(--primary);
            color: #1a1a1a;
            transform: translateX(-4px);
        }

        .hero-section {
            text-align: center;
            padding: 80px 24px 60px;
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .hero-title {
            font-size: clamp(2.2em, 8vw, 3.5em);
            font-weight: 800;
            color: white;
            margin-bottom: 16px;
            letter-spacing: -1px;
            text-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
        }

        .hero-subtitle {
            font-size: clamp(1em, 4vw, 1.3em);
            color: var(--accent-light);
            margin-bottom: 32px;
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(124, 58, 237, 0.2);
        }

        .hero-description {
            font-size: 1.05em;
            color: var(--text-gray);
            margin-bottom: 40px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px 60px;
        }

        .portal-section {
            margin-bottom: 80px;
            scroll-margin-top: 100px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 2.2em;
            font-weight: 700;
            color: white;
            margin: 0;
            text-shadow: 0 2px 10px rgba(124, 58, 237, 0.2);
        }

        .section-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--primary);
            color: #1a1a1a;
            font-weight: 700;
            font-size: 0.95em;
            min-width: 48px;
            height: 48px;
            border-radius: 12px;
            padding: 0 12px;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
        }

        .section-underline {
            height: 4px;
            width: 60px;
            background: linear-gradient(90deg, var(--primary), rgba(124, 58, 237, 0.4));
            border-radius: 2px;
            margin-top: 16px;
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.3);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 28px;
            margin-top: 20px;
        }

        .service-card {
            background: rgba(60, 60, 60, 0.9);
            border-radius: 16px;
            padding: 32px;
            text-decoration: none;
            color: white;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(124, 58, 237, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-dark), var(--primary));
            transform: scaleX(0);
            transition: transform 0.4s ease;
            transform-origin: left;
        }

        .service-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 50px rgba(124, 58, 237, 0.2);
            background: rgba(60, 60, 60, 0.95);
            border-color: rgba(124, 58, 237, 0.4);
        }

        .service-card:hover::before {
            transform: scaleX(1);
        }

        .card-icon {
            font-size: 3.2em;
            margin-bottom: 20px;
            display: inline-block;
        }

        .card-title {
            font-size: 1.4em;
            font-weight: 700;
            margin-bottom: 12px;
            color: white;
            line-height: 1.3;
        }

        .card-description {
            font-size: 0.95em;
            color: #c0c0c0;
            margin-bottom: 24px;
            flex-grow: 1;
            line-height: 1.6;
        }

        .card-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95em;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            align-self: flex-start;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
        }

        .card-action:hover {
            transform: translateX(6px);
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4);
        }

        footer {
            text-align: center;
            color: var(--text-gray);
            font-size: 0.95em;
            padding: 60px 24px;
            border-top: 2px solid var(--primary);
            background: linear-gradient(to top, rgba(0, 0, 0, 0.3), transparent);
        }

        footer p {
            margin: 0;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .site-header {
                flex-wrap: wrap;
                padding: 12px 16px;
            }

            .logo-brand {
                font-size: 1.1em;
                order: 1;
            }

            .back-button {
                order: 2;
                margin-left: auto;
                width: 100%;
                justify-content: center;
                margin-top: 8px;
            }

            .hero-section {
                padding: 60px 16px 40px;
            }

            .hero-title {
                font-size: 1.8em;
            }

            .section-title {
                font-size: 1.5em;
            }

            .main-container {
                padding: 0 16px 40px;
            }

            .services-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .service-card {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a href="./index.html" class="logo-brand">📊 Painéis PCI DSS</a>
        <a href="./index.html" class="back-button">← Voltar ao Portal</a>
    </header>

    <section class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title">Painéis PCI DSS</h1>
            <p class="hero-subtitle">Gestão de Conformidade</p>
            <p class="hero-description">Dashboards e ferramentas de gestão para conformidade e relatórios de compliance.</p>
        </div>
    </section>

    <div class="main-container">
        <div id="pci-content">
            <div style="text-align: center; color: var(--text-gray); padding: 60px 24px;">
                ⏳ Carregando ferramentas...
            </div>
        </div>

        <footer>
            <p>&copy; 2026 GuardianTech Consultoria. Todos os direitos reservados.</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        const SUPABASE_URL = 'https://zprzmhavbjiggqfzzzbt.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_zucE5w9pyxnkXU0r3A8LYQ_ERuwax9r';

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        function safeUrl(url) {
            return /^(https?:|\.\/|\/)/i.test(url) ? url : '#';
        }

        function cardHtml(link) {
            const url = safeUrl(link.url);
            const target = url.startsWith('http') ? ' target="_blank"' : '';
            return `
                <a href="${escapeHtml(url)}"${target} class="service-card">
                    <div>
                        <div class="card-icon">${escapeHtml(link.icone) || '🔗'}</div>
                        <h3 class="card-title">${escapeHtml(link.titulo)}</h3>
                        <p class="card-description">${escapeHtml(link.descricao)}</p>
                    </div>
                    <span class="card-action">Acessar →</span>
                </a>`;
        }

        function renderTools(links) {
            const container = document.getElementById('pci-content');

            if (!links || links.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-gray); padding: 60px 24px;">Nenhuma ferramenta disponível.</div>';
                return;
            }

            container.innerHTML = `
                <section class="portal-section">
                    <div class="section-header">
                        <div>
                            <h2 class="section-title">Ferramentas Disponíveis</h2>
                            <div class="section-underline"></div>
                        </div>
                        <span class="section-badge">${links.length}</span>
                    </div>
                    <div class="services-grid">
                        ${links.map(cardHtml).join('')}
                    </div>
                </section>
            `;
        }

        async function carregarTools() {
            const container = document.getElementById('pci-content');
            try {
                const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                const { data, error } = await client
                    .from('links')
                    .select('*')
                    .eq('categoria', 'Painéis PCI DSS')
                    .eq('ativo', true)
                    .order('ordem', { ascending: true });

                if (error) throw error;
                renderTools(data);
            } catch (err) {
                console.error('Erro ao carregar ferramentas:', err);
                container.innerHTML = '<div style="text-align: center; color: var(--text-gray); padding: 60px 24px;">⚠️ Erro ao carregar as ferramentas. Tente novamente em alguns momentos.</div>';
            }
        }

        carregarTools();
    </script>
</body>
</html>
