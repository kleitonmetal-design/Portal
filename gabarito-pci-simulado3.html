    <script>
        const questoes = [{"numero":1,"enunciado":"1. Uma organização deseja iniciar a implementação da ISO/IEC 27001. Qual é o principal objetivo desta norma?","resposta_correta":"B) Estabelecer requisitos para implementar, manter e melhorar continuamente um SGSI","justificativa":"A ISO/IEC 27001 é uma norma de requisitos (não uma norma de boas práticas apenas orientativa). Conforme sua cláusula 1 (Escopo), o objetivo central da norma é especificar os requisitos para estabelecer, implementar, manter e melhorar continuamente um Sistema de Gestão de Segurança da Informação (SGSI/ISMS) dentro do contexto da organização. É justamente por trazer 'requisitos' (shall statements) — e não apenas recomendações — que a ISO/IEC 27001 é uma norma certificável, diferente da ISO/IEC 27002, que é apenas um código de práticas.","alternativas_incorretas":[],"dica":"","resumo":"ISO/IEC 27001 = requisitos para o SGSI (estabelecer, implementar, manter, melhorar continuamente); não é uma lista de controles técnicos nem uma certificação de pessoas."},{"numero":2,"enunciado":"2. A tríade CIA é central para a segurança da informação. O que significa 'disponibilidade' neste contexto?","resposta_correta":"C) Garantia de que a informação é acessível quando necessária por entidades autorizadas","justificativa":"Segundo a ISO/IEC 27000 (vocabulário), disponibilidade é a 'propriedade de estar acessível e utilizável sob demanda por uma entidade autorizada'. A questão descreve exatamente isso: garantir que a informação esteja acessível quando necessária para quem tem autorização de acesso — por exemplo, sistemas com alta disponibilidade, redundância e planos de continuidade de negócios sustentam esse princípio.","alternativas_incorretas":[],"dica":"","resumo":"Disponibilidade = a informação está lá quando o usuário autorizado precisa dela."},{"numero":3,"enunciado":"3. Qual norma da família ISO/IEC 27000 fornece o vocabulário e os conceitos fundamentais utilizados no SGSI?","resposta_correta":"A) ISO/IEC 27000","justificativa":"A ISO/IEC 27000 é o documento 'guarda-chuva' da família 27000: fornece a visão geral, os princípios fundamentais do SGSI e, principalmente, o vocabulário (termos e definições) usado em todas as demais normas da família (27001, 27002, 27005 etc.). É por isso que ela é a referência normativa citada na própria ISO/IEC 27001 (cláusula 2 – Referência normativa).","alternativas_incorretas":[],"dica":"","resumo":"ISO/IEC 27000 é o dicionário da família — vocabulário e conceitos, não requisitos nem controles."},{"numero":4,"enunciado":"4. Uma empresa financeira processa dados de clientes. Qual princípio da segurança da informação é violado quando transações são alteradas sem autorização?","resposta_correta":"B) Integridade","justificativa":"Integridade é a propriedade de exatidão e completude da informação — ou seja, garantir que os dados não foram alterados de forma não autorizada ou indevida. Quando transações financeiras são modificadas sem autorização, o que se rompe é exatamente essa garantia de exatidão dos dados, caracterizando uma violação de integridade.","alternativas_incorretas":[],"dica":"","resumo":"Dado alterado sem permissão = quebra de integridade, não de disponibilidade nem de autenticidade."},{"numero":5,"enunciado":"5. O Ciclo PDCA (Plan-Do-Check-Act) é subjacente à ISO/IEC 27001. Qual fase corresponde à realização de auditorias internas?","resposta_correta":"C) Check","justificativa":"O ciclo PDCA subjacente ao SGSI mapeia-se assim: Plan (planejar o SGSI, cláusulas 4-7), Do (implementar e operar, cláusula 8), Check (monitorar, medir, analisar e auditar, cláusulas 9.1 e 9.2) e Act (melhorar continuamente, cláusula 10). A realização de auditorias internas é uma atividade de verificação do desempenho do sistema, portanto pertence à fase Check.","alternativas_incorretas":[],"dica":"","resumo":"Auditoria interna é atividade de verificação (Check) — não de planejamento nem de execução."},{"numero":6,"enunciado":"6. A ISO/IEC 27001:2022 adota a estrutura HLS (High Level Structure). Qual é o principal benefício desta estrutura para organizações com múltiplos sistemas de gestão?","resposta_correta":"B) Facilita a integração com outras normas ISO que adotam a mesma estrutura, como ISO 9001 e ISO 22301","justificativa":"A ISO/IEC 27001:2022 segue a Estrutura de Alto Nível (HLS, do Anexo SL da ISO/IEC) — o mesmo esqueleto de cláusulas (4 a 10), termos comuns e requisitos estruturais usados por outras normas de sistema de gestão, como a ISO 9001 (qualidade) e a ISO 22301 (continuidade de negócios). Isso facilita significativamente a integração de sistemas de gestão múltiplos (um SGI — Sistema de Gestão Integrado), reduzindo duplicidade de documentação, auditorias e processos de gestão.","alternativas_incorretas":[],"dica":"","resumo":"HLS/Anexo SL = estrutura comum entre normas ISO de sistemas de gestão, feita para facilitar integração."},{"numero":7,"enunciado":"7. Um ativo de informação é definido como algo que possui valor para a organização. Qual dos exemplos abaixo representa um ativo de informação intangível?","resposta_correta":"B) Conhecimento técnico especializado de um colaborador","justificativa":"Um ativo de informação é qualquer coisa de valor para a organização relacionada ao processamento, armazenamento ou uso de informação. Ativos podem ser tangíveis (hardware, mídias) ou intangíveis (conhecimento, reputação, software, dados). O conhecimento técnico especializado de um colaborador é um ativo intangível clássico: tem valor, mas não possui forma física.","alternativas_incorretas":[],"dica":"","resumo":"Conhecimento e know-how das pessoas = ativo de informação intangível."},{"numero":8,"enunciado":"8. A ISO/IEC 27001 especifica que a certificação é válida por quanto tempo, sujeita a auditorias de manutenção?","resposta_correta":"C) 3 anos","justificativa":"O ciclo de certificação ISO/IEC 27001 segue o modelo padrão dos organismos de certificação acreditados: a certificação inicial é válida por 3 anos, período no qual são realizadas auditorias de manutenção (vigilância), normalmente anuais, para confirmar que o SGSI continua conforme e eficaz. Ao final do ciclo de 3 anos, é necessária uma auditoria de recertificação.","alternativas_incorretas":[],"dica":"","resumo":"Certificação ISO 27001: ciclo de 3 anos, com vigilâncias anuais no meio do caminho."},{"numero":9,"enunciado":"9. Uma vulnerabilidade é explorada por uma ameaça, resultando em um incidente. Como se define 'risco' neste contexto?","resposta_correta":"B) O efeito da incerteza sobre os objetivos da segurança da informação","justificativa":"A ISO/IEC 27000 (e a ISO 31000, referência para gestão de riscos) define risco como o 'efeito da incerteza sobre os objetivos'. Esse efeito pode ser positivo ou negativo, e é justamente essa incerteza em relação ao alcance dos objetivos de segurança da informação que a organização precisa gerenciar por meio da avaliação e do tratamento de riscos (cláusula 6.1.2 e 6.1.3).","alternativas_incorretas":[],"dica":"","resumo":"Risco = efeito da incerteza sobre os objetivos (definição oficial ISO 31000/27000)."},{"numero":10,"enunciado":"10. A não repudiação é um conceito importante em transações eletrônicas. O que ela garante?","resposta_correta":"B) Que uma entidade não pode negar ter realizado uma ação ou transação específica","justificativa":"Não repúdio é a capacidade de provar a ocorrência de um evento ou ação e das entidades que a originaram, de modo que essa entidade não possa negar posteriormente tê-la realizado. É garantido tipicamente por mecanismos como assinaturas digitais, logs de auditoria e trilhas de evidência, sendo essencial em transações eletrônicas para responsabilização (accountability).","alternativas_incorretas":[],"dica":"","resumo":"Não repúdio = a entidade não pode negar depois que fez algo — pense em assinatura digital."},{"numero":11,"enunciado":"11. Qual cláusula da ISO/IEC 27001 aborda o contexto da organização, incluindo partes interessadas internas e externas?","resposta_correta":"A) Cláusula 4","justificativa":"A cláusula 4 da ISO/IEC 27001:2022 ('Contexto da organização') exige que a organização determine questões internas e externas relevantes para seu propósito e que afetam sua capacidade de alcançar os resultados pretendidos do SGSI (4.1), além de identificar as partes interessadas e seus requisitos (4.2), o que serve de base para definir o escopo do SGSI (4.3).","alternativas_incorretas":[],"dica":"","resumo":"Cláusula 4 = Contexto da organização (partes interessadas, questões internas/externas, escopo)."},{"numero":12,"enunciado":"12. No ISMS, a liderança deve demonstrar compromisso estabelecendo a política de segurança da informação. Qual é o principal objetivo dessa política?","resposta_correta":"B) Fornecer estrutura para riscos e conformidade","justificativa":"A política de segurança da informação, exigida pela cláusula 5.2, tem como objetivo principal fornecer uma estrutura (framework) para o estabelecimento dos objetivos de segurança da informação e demonstrar o comprometimento com o atendimento aos requisitos aplicáveis e com a melhoria contínua do SGSI. Ela é, portanto, o documento de mais alto nível que orienta toda a gestão de riscos e conformidade.","alternativas_incorretas":[],"dica":"","resumo":"A política de SI (5.2) dá a estrutura/direção; os objetivos (6.2) é que trazem as metas mensuráveis."},{"numero":13,"enunciado":"13. Os recursos necessários para o ISMS incluem competências. Como a norma trata a conscientização em segurança da informação?","resposta_correta":"B) Para todos os que afetam o ISMS","justificativa":"A cláusula 7.3 (Conscientização) exige que todas as pessoas que realizam trabalho sob o controle da organização — e não apenas gestores — estejam cientes da política de segurança da informação, de sua contribuição para a eficácia do SGSI e das implicações de não conformidade com os requisitos do SGSI. Isso inclui colaboradores, terceirizados e prestadores de serviço que tenham acesso a ativos de informação.","alternativas_incorretas":[],"dica":"","resumo":"Conscientização (7.3) é para todos que afetam o SGSI, não só para gestores."},{"numero":14,"enunciado":"14. Na cláusula de suporte, a documentação do ISMS deve incluir informações documentadas. Qual é um exemplo obrigatório?","resposta_correta":"B) Escopo do ISMS","justificativa":"Embora a ISO/IEC 27001:2022 não exija mais uma lista fixa de 'procedimentos documentados obrigatórios' como na versão 2005, a cláusula 4.3 exige explicitamente que o escopo do SGSI esteja disponível como informação documentada. O escopo, portanto, é um exemplo claro e obrigatório de informação documentada exigida pela própria norma.","alternativas_incorretas":[],"dica":"","resumo":"O escopo do SGSI é sempre informação documentada obrigatória (cláusula 4.3).\n---"},{"numero":15,"enunciado":"15. O planejamento de ações para abordar riscos e oportunidades no ISMS deve ser integrado ao processo de mudança. Qual plano é essencial?","resposta_correta":"B) Plano de tratamento de riscos","justificativa":"Ao planejar ações para tratar riscos e oportunidades (cláusula 6.1), a organização deve, especificamente para os riscos de segurança da informação identificados na avaliação de riscos, elaborar um plano de tratamento de riscos (cláusula 6.1.3), que formaliza quais opções de tratamento (mitigar, transferir, evitar, aceitar) e quais controles serão aplicados a cada risco, com responsáveis e prazos definidos.","alternativas_incorretas":[],"dica":"","resumo":"Riscos e oportunidades → Plano de Tratamento de Riscos é o documento central da cláusula 6.1."},{"numero":16,"enunciado":"16. Na operação do ISMS, o controle de mudanças não planejadas deve ser gerenciado. Qual controle é priorizado?","resposta_correta":"C) Avaliação de impacto na segurança","justificativa":"A cláusula 8.1 (versão 2022) reforça que a organização deve planejar, implementar e controlar os processos necessários para atender requisitos de segurança da informação, mantendo controle sobre mudanças planejadas e analisando as consequências de mudanças não intencionais, tomando ações para mitigar quaisquer efeitos adversos. Diante de uma mudança não planejada, o controle prioritário é justamente avaliar o impacto/consequências dessa mudança na segurança da informação, para então decidir e agir sobre eventuais efeitos adversos.","alternativas_incorretas":[],"dica":"","resumo":"Mudança não planejada → avaliar/mitigar o impacto na segurança da informação (cláusula 8.1, versão 2022).\n---"},{"numero":17,"enunciado":"17. A cláusula de suporte exige comunicação relevante. Quem define o que, quando, com quem e como comunicar?","resposta_correta":"B) Equipe de TI","justificativa":"Embora a cláusula 7.4 (Comunicação) determine que a organização deve estabelecer o quê, quando, com quem, como e quem comunica, ela não atribui essa responsabilidade a um cargo específico — cabe à própria organização decidir. Na prática das implementações, essa definição normalmente é conduzida pela função/equipe responsável pela segurança da informação (frequentemente alocada ou apoiada pela área de TI em organizações menores), que estrutura o plano de comunicação do SGSI para aprovação da Alta Direção.","alternativas_incorretas":[],"dica":"","resumo":"Cláusula 7.4: a norma não nomeia o responsável — apenas exige que 'o quê, quando, com quem e como' sejam definidos pela organização."},{"numero":18,"enunciado":"18. No ISMS, a externalização de processos deve manter a confidencialidade, integridade e disponibilidade. Qual anexo é referenciado?","resposta_correta":"B) Anexo A.15","justificativa":"O controle relativo à segurança da informação em relações com fornecedores/terceirização — que garante que confidencialidade, integridade e disponibilidade sejam mantidas quando processos são externalizados — corresponde, na estrutura de 2013 do Anexo A, à cláusula A.15 (Relacionamento com fornecedores). Na ISO/IEC 27001:2022, esse mesmo conjunto de exigências foi reorganizado no tema Organizacional, sob os controles A.5.19 a A.5.23 (Segurança da informação nas relações com fornecedores, monitoramento, gestão de mudanças e uso de serviços em nuvem).","alternativas_incorretas":[],"dica":"","resumo":"Fornecedores/terceirização: A.15 (Anexo A 2013) ≈ A.5.19–A.5.23 (Anexo A 2022).\n---"},{"numero":19,"enunciado":"19. A cláusula 4.1 da ISO/IEC 27001:2022 exige que a organização determine questões internas e externas. Qual ferramenta é comumente usada para estruturar essa análise?","resposta_correta":"B) Diagrama de Ishikawa","justificativa":"A cláusula 4.1 exige que a organização determine as questões internas e externas relevantes para seu propósito e que afetam sua capacidade de alcançar os resultados pretendidos do SGSI. Ferramentas de análise estratégica como SWOT (forças, fraquezas, oportunidades, ameaças) e PESTLE (fatores políticos, econômicos, sociais, tecnológicos, legais e ambientais) são comumente utilizadas na prática para estruturar essa análise de contexto de forma sistemática.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa B (Diagrama de Ishikawa) como correta, mas essa afirmação está tecnicamente incorreta: o Ishikawa é ferramenta de análise de causa raiz (usada na cláusula 10.2, tratamento de não conformidades), e não uma ferramenta de análise de contexto organizacional (cláusula 4.1). A resposta tecnicamente correta, segundo a ISO/IEC 27001:2022 e a prática de mercado, é a alternativa A (Análise SWOT ou PESTLE). Recomenda-se estudar esta questão com a resposta correta sendo A, e não B.","alternativas_incorretas":[],"dica":"","resumo":"Contexto da organização (4.1) → SWOT/PESTLE, não Ishikawa."},{"numero":20,"enunciado":"20. A cláusula 4.2 exige identificar partes interessadas e seus requisitos. Um fornecedor de serviços em nuvem exige que contratos incluam cláusulas de SLA de segurança. Como isso deve ser tratado?","resposta_correta":"A) Ignorado, pois requisitos de fornecedores não são obrigatórios no SGSI","justificativa":"Requisitos impostos por um fornecedor de serviços em nuvem — como a exigência contratual de cláusulas de SLA de segurança — configuram um requisito de parte interessada relevante, conforme a cláusula 4.2. Uma vez identificados, esses requisitos devem ser documentados e considerados na definição do escopo (4.3) e no planejamento do SGSI, podendo inclusive gerar riscos e controles específicos a serem tratados (6.1.2/6.1.3), e não apenas constar de forma isolada em um contrato comercial.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa A ('Ignorado, pois requisitos de fornecedores não são obrigatórios no SGSI') como correta, mas essa afirmação contraria diretamente a cláusula 4.2 da ISO/IEC 27001:2022, que exige que a organização determine as partes interessadas relevantes e seus requisitos, considerando-os no SGSI. A resposta tecnicamente correta é a alternativa B ('Documentado como um requisito de parte interessada e tratado no escopo do SGSI'). Recomenda-se estudar esta questão com a resposta correta sendo B, e não A.","alternativas_incorretas":[],"dica":"","resumo":"Requisito de parte interessada relevante (mesmo de fornecedor) deve ser documentado e tratado no escopo do SGSI — nunca ignorado."},{"numero":21,"enunciado":"21. O escopo do SGSI deve ser documentado. Qual afirmação está correta sobre a definição do escopo conforme a cláusula 4.3?","resposta_correta":"A) O escopo pode excluir unidades de negócio desde que não processem informações críticas","justificativa":"A cláusula 4.3 exige que, ao determinar o escopo do SGSI, a organização considere as interfaces e dependências entre as atividades realizadas por ela e as atividades realizadas por outras organizações (por exemplo, fornecedores, prestadores de serviço, parceiros). Isso garante que o escopo não seja definido de forma isolada, ignorando pontos de contato que possam introduzir riscos de segurança da informação ao SGSI.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa A como correta, mas o texto de A é uma afirmação problemática e não corresponde ao texto da cláusula 4.3. A alternativa tecnicamente correta, que reproduz literalmente um requisito da cláusula 4.3, é a alternativa B ('O escopo deve considerar interfaces e dependências com atividades externas à organização'). Recomenda-se estudar esta questão com a resposta correta sendo B.","alternativas_incorretas":[],"dica":"","resumo":"Escopo do SGSI (4.3) sempre considera interfaces e dependências com atividades externas à organização."},{"numero":22,"enunciado":"22. A cláusula 5.1 exige comprometimento da Alta Direção com o SGSI. Qual ação demonstra esse comprometimento de forma mais efetiva?","resposta_correta":"B) Assegurar que os objetivos do SGSI estejam integrados aos processos de negócio da organização","justificativa":"O comprometimento da Alta Direção (cláusula 5.1) vai além de aprovações formais: ele se demonstra de forma mais efetiva quando os objetivos de segurança da informação são integrados aos processos de negócio da organização, garantindo que a segurança da informação seja tratada como parte da estratégia e das operações, e não como uma atividade isolada de TI.","alternativas_incorretas":[],"dica":"","resumo":"Liderança eficaz (5.1) = integrar segurança da informação aos processos de negócio, não apenas aprovar orçamento ou delegar tudo."},{"numero":23,"enunciado":"23. A política de segurança da informação (cláusula 5.2) deve conter comprometimento com a melhoria contínua. Como ela deve ser disponibilizada?","resposta_correta":"B) Disponível como informação documentada e comunicada dentro da organização e a partes interessadas relevantes","justificativa":"A política de segurança da informação (cláusula 5.2) deve estar disponível como informação documentada, ser comunicada dentro da organização e estar disponível para as partes interessadas, conforme apropriado (cláusula 5.2 d, e). Isso não significa divulgação pública irrestrita, mas sim garantir que quem precisa conhecê-la — colaboradores, terceiros relevantes, partes interessadas pertinentes — tenha acesso a ela.","alternativas_incorretas":[],"dica":"","resumo":"Política de SI: documentada, comunicada internamente e disponível a partes interessadas relevantes conforme apropriado — nunca mantida em sigilo total."},{"numero":24,"enunciado":"24. A cláusula 7.3 trata de conscientização. Qual é o mínimo que as pessoas devem conhecer conforme a norma?","resposta_correta":"B) Todos os controles do Anexo A e seus respectivos objetivos de controle","justificativa":"A cláusula 7.3 estabelece que as pessoas que trabalham sob o controle da organização devem estar cientes, no mínimo: (a) da política de segurança da informação; (b) de sua contribuição para a eficácia do SGSI, incluindo os benefícios da melhoria do desempenho da segurança da informação; e (c) das implicações de não estar em conformidade com os requisitos do SGSI. Não há exigência de conhecimento detalhado de todos os controles técnicos do Anexo A.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa B como correta, mas essa afirmação extrapola o requisito real da cláusula 7.3, que não exige conhecimento de todos os controles do Anexo A. A resposta tecnicamente correta, que reproduz o texto da cláusula 7.3, é a alternativa A. Recomenda-se estudar esta questão com a resposta correta sendo A.","alternativas_incorretas":[],"dica":"","resumo":"Conscientização mínima (7.3): política + contribuição pessoal para o SGSI + implicações da não conformidade — nada além disso é exigido como mínimo."},{"numero":25,"enunciado":"25. A cláusula 7.4 exige determinação das comunicações relevantes para o SGSI. Quais aspectos devem ser definidos?","resposta_correta":"B) O que, quando, com quem, como comunicar e quem deve comunicar","justificativa":"A cláusula 7.4 (Comunicação) exige que a organização determine a necessidade de comunicações internas e externas relevantes ao SGSI, incluindo: o que comunicar, quando comunicar, com quem comunicar, como comunicar e quem comunica. Esses cinco elementos formam o conjunto completo exigido pela norma para um plano de comunicação estruturado.","alternativas_incorretas":[],"dica":"","resumo":"Comunicação (7.4) = o quê + quando + com quem + como + quem comunica — os 5 elementos obrigatórios."},{"numero":26,"enunciado":"26. Informação documentada exigida pelo SGSI deve ser controlada. O que a cláusula 7.5.3 exige em relação ao controle?","resposta_correta":"C) Que apenas a equipe de segurança tenha acesso à documentação do SGSI","justificativa":"A cláusula 7.5.3 (Controle de informação documentada) exige que a informação documentada exigida pelo SGSI seja controlada para assegurar que esteja disponível e adequada para uso, onde e quando for necessária, e que esteja adequadamente protegida (por exemplo, contra perda de confidencialidade, uso impróprio ou perda de integridade). Isso envolve controles de distribuição, acesso, recuperação, uso, armazenamento, preservação, controle de alterações e retenção/disposição.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa C como correta, mas essa afirmação (acesso restrito apenas à equipe de segurança) contraria o texto da cláusula 7.5.3, que exige que a informação documentada esteja 'disponível e adequada para uso, onde e quando necessária' — ou seja, acessível a quem precisa dela, não restrita a um único grupo. A resposta tecnicamente correta é a alternativa B. Recomenda-se estudar esta questão com a resposta correta sendo B.","alternativas_incorretas":[],"dica":"","resumo":"Controle de informação documentada (7.5.3) = disponível, adequada para uso e protegida — não é 'papel assinado' nem 'acesso restrito só à equipe de segurança'."},{"numero":27,"enunciado":"27. Processos terceirizados que afetam o SGSI devem ser controlados (cláusula 8.1). Qual é a responsabilidade da organização nesse caso?","resposta_correta":"A) Transferir toda a responsabilidade de segurança ao fornecedor terceirizado","justificativa":"A cláusula 8.1 estabelece que, quando processos são terceirizados, a organização deve assegurar que esses processos externalizados sejam determinados e controlados, mesmo sendo executados por terceiros. A responsabilidade final pela segurança da informação (accountability) permanece com a organização contratante — ela não pode transferir essa responsabilidade integralmente ao fornecedor, apenas delegar a execução operacional.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa A ('Transferir toda a responsabilidade de segurança ao fornecedor terceirizado') como correta, mas essa afirmação contraria um princípio central da gestão de fornecedores na ISO/IEC 27001: a accountability pela segurança da informação não pode ser transferida a terceiros. A resposta tecnicamente correta é a alternativa B. Recomenda-se estudar esta questão com a resposta correta sendo B.","alternativas_incorretas":[],"dica":"","resumo":"Terceirização (8.1) transfere execução, nunca a responsabilidade final pela segurança da informação."},{"numero":28,"enunciado":"28. Uma organização identificou que seu SGSI não está mais alinhado com mudanças regulatórias recentes. Qual cláusula aborda diretamente a necessidade de mudanças planejadas no SGSI?","resposta_correta":"B) Cláusula 9.3 – Análise crítica pela Direção","justificativa":"A cláusula 6.3 ('Planejamento de mudanças'), incluída na revisão de 2022, exige que, quando a organização determina a necessidade de mudanças no SGSI (por exemplo, decorrentes de novas exigências regulatórias), essas mudanças sejam realizadas de forma planejada. É essa cláusula que trata diretamente da necessidade de mudanças planejadas no SGSI diante de fatores como alterações no contexto regulatório.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa B (cláusula 9.3 – Análise crítica pela Direção) como correta, mas a cláusula que trata diretamente do planejamento de mudanças no SGSI é a 6.3, adicionada especificamente na revisão de 2022. A análise crítica pela Direção (9.3) é uma atividade de avaliação periódica de desempenho, e pode gerar a necessidade de mudanças, mas não é ela mesma a cláusula que 'aborda diretamente' o planejamento das mudanças. A resposta tecnicamente correta é a alternativa A. Recomenda-se estudar esta questão com a resposta correta sendo A.","alternativas_incorretas":[],"dica":"","resumo":"Necessidade de mudança planejada no SGSI → cláusula 6.3 (novidade da versão 2022)."},{"numero":29,"enunciado":"29. No planejamento da implementação, a análise de riscos deve identificar ativos de informação. Qual é o primeiro passo?","resposta_correta":"B) Definir critérios de aceitação de riscos","justificativa":"Conforme a cláusula 6.1.2 a), antes mesmo de identificar riscos específicos, a organização deve estabelecer e manter critérios de risco de segurança da informação, incluindo critérios de aceitação de risco e critérios para realizar avaliações de risco. Definir esses critérios é o passo estrutural inicial que garante que as avaliações de risco produzam resultados consistentes, válidos e comparáveis ao longo do tempo — antes de partir para identificação de ameaças/vulnerabilidades ou avaliação de impactos específicos.","alternativas_incorretas":[],"dica":"","resumo":"Antes de identificar ameaças/impactos, a norma exige definir os critérios de risco (6.1.2 a)."},{"numero":30,"enunciado":"30. O Statement of Applicability (SoA) é gerado após a avaliação de riscos. Qual seu propósito principal?","resposta_correta":"B) Listar controles selecionados e justificativas","justificativa":"A Declaração de Aplicabilidade (Statement of Applicability – SoA) é o documento, exigido pela cláusula 6.1.3 d), que relaciona os controles necessários (resultantes do tratamento de riscos e da comparação com o Anexo A), justifica sua inclusão, indica se estão implementados ou não, e justifica a exclusão de quaisquer controles do Anexo A considerados não aplicáveis. Seu propósito central é, portanto, listar os controles selecionados com as respectivas justificativas.","alternativas_incorretas":[],"dica":"","resumo":"SoA = lista de controles selecionados, com justificativas de inclusão/exclusão e status de implementação."},{"numero":31,"enunciado":"31. Para planejar a implementação, o escopo do ISMS deve considerar interfaces e dependências. Qual fator é excluído?","resposta_correta":"A) Preferências pessoais de cada colaborador sobre o local de trabalho","justificativa":"Ao definir o escopo do SGSI (cláusula 4.3), a organização deve considerar as questões internas/externas (4.1), os requisitos de partes interessadas (4.2) e as interfaces e dependências entre suas atividades e as de outras organizações. Preferências pessoais individuais de colaboradores sobre local de trabalho não fazem parte de nenhum desses critérios — é um fator organizacional/de RH que não influencia a definição técnica do escopo do SGSI, sendo, portanto, o fator corretamente excluído dessa análise.","alternativas_incorretas":[],"dica":"","resumo":"Escopo do SGSI considera contexto, partes interessadas e interfaces com terceiros — preferências pessoais de colaboradores não entram nessa conta.\n---"},{"numero":32,"enunciado":"32. No planejamento, metas de segurança da informação devem ser SMART. Qual não é um critério SMART?","resposta_correta":"B) Ambígua","justificativa":"Os objetivos de segurança da informação (cláusula 6.2) devem seguir, sempre que possível, o critério SMART: Específicos (Specific), Mensuráveis (Measurable), Atingíveis/Alcançáveis (Achievable), Relevantes (Relevant) e com prazo definido (Time-bound). 'Ambígua' é justamente o oposto de 'Específica' — um objetivo ambíguo não permite avaliação clara de seu alcance, contrariando a própria lógica SMART.","alternativas_incorretas":[],"dica":"","resumo":"SMART = Específico, Mensurável, Atingível, Relevante, Temporal — 'Ambíguo' é o oposto disso."},{"numero":33,"enunciado":"33. A implementação do plano de tratamento de riscos inclui opções como evitar, mitigar ou transferir. Qual exige seguro?","resposta_correta":"B) Transferir","justificativa":"Entre as opções clássicas de tratamento de risco (aceitar, evitar, transferir/compartilhar e modificar/mitigar), a opção 'transferir' é a que tipicamente envolve mecanismos como contratação de seguros, terceirização com transferência contratual de responsabilidade financeira, ou cláusulas contratuais que repassam parte do risco a terceiros (ex.: seguradoras ou fornecedores).","alternativas_incorretas":[],"dica":"","resumo":"Seguro = transferência de risco. Simples assim."},{"numero":34,"enunciado":"34. O planejamento deve incluir cronograma e recursos. Qual ferramenta é recomendada para monitoramento?","resposta_correta":"C) Plano de projeto com marcos","justificativa":"No planejamento da implementação do SGSI, uma ferramenta amplamente recomendada para acompanhar cronograma, recursos e entregas é o plano de projeto com marcos (milestones), que permite visualizar prazos, dependências entre atividades e pontos de controle intermediários, facilitando o monitoramento do progresso da implementação frente ao planejado.","alternativas_incorretas":[],"dica":"","resumo":"Planejamento da implementação = cronograma + recursos + marcos de controle do projeto, monitorados de forma estruturada.\n---"},{"numero":35,"enunciado":"35. Antes da implementação, a aprovação do SoA deve ser dada pela gestão. Qual cláusula suporta isso?","resposta_correta":"B) Cláusula 5.2","justificativa":"A aprovação da Declaração de Aplicabilidade (SoA) e a autorização para operar o SGSI, incluindo a aceitação dos riscos residuais, são exigências da cláusula 6.1.3 (Tratamento de riscos de segurança da informação), especificamente nos itens d) e e), que tratam de produzir a SoA e obter aprovação dos proprietários dos riscos para o plano de tratamento e para os riscos residuais.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa B (Cláusula 5.2) como correta, mas essa cláusula trata da política de segurança da informação, não da aprovação do SoA. A cláusula que efetivamente sustenta a produção, aprovação e uso do SoA no processo de tratamento de riscos é a 6.1.3. A resposta tecnicamente correta é a alternativa A. Recomenda-se estudar esta questão com a resposta correta sendo A.","alternativas_incorretas":[],"dica":"","resumo":"Aprovação do SoA e dos riscos residuais → cláusula 6.1.3 (não 5.2, que é a política)."},{"numero":36,"enunciado":"36. Durante o planejamento da implementação do SGSI, a análise do contexto é concluída. Qual é o próximo passo lógico conforme a sequência da norma?","resposta_correta":"B) Definir o escopo e iniciar o processo de avaliação de riscos","justificativa":"Após concluir a análise do contexto da organização (cláusula 4), a sequência lógica da norma segue para a definição do escopo do SGSI (4.3) e, em seguida, para o planejamento (cláusula 6), que inclui o processo de avaliação de riscos (6.1.2). Não é correto avançar diretamente para a implementação de controles do Anexo A sem antes definir escopo e avaliar riscos, pois é a avaliação de riscos que determina quais controles são de fato necessários.","alternativas_incorretas":[],"dica":"","resumo":"Depois do contexto vem escopo + avaliação de riscos — nunca 'pular direto' para implementar controles do Anexo A."},{"numero":37,"enunciado":"37. O processo de avaliação de riscos (cláusula 6.1.2) exige a identificação de proprietários de riscos. Qual é a função do proprietário do risco?","resposta_correta":"B) Ser responsável por autorizar o plano de tratamento e aceitar os riscos residuais","justificativa":"O proprietário do risco (risk owner), exigido pela cláusula 6.1.2 c) 2), é a pessoa ou entidade com a responsabilidade e a autoridade para gerenciar um risco específico — cabendo a ele aprovar o plano de tratamento de riscos referente a esse risco e aceitar formalmente o nível de risco residual após a aplicação dos controles selecionados.","alternativas_incorretas":[],"dica":"","resumo":"Proprietário do risco = autoridade para aprovar o tratamento e aceitar o risco residual."},{"numero":38,"enunciado":"38. A cláusula 6.1.2 exige que os critérios de avaliação de riscos sejam estabelecidos. O que deve ser definido como critério de aceitação de risco?","resposta_correta":"B) O nível de risco que a organização está disposta a aceitar ou tolerar","justificativa":"Os critérios de aceitação de risco, exigidos pela cláusula 6.1.2 a) 2), definem o nível de risco que a organização está disposta a aceitar ou tolerar em relação aos seus objetivos de segurança da informação. Esses critérios servem de referência para decidir, na etapa de avaliação de riscos, quais riscos exigem tratamento e quais podem ser aceitos sem ação adicional.","alternativas_incorretas":[],"dica":"","resumo":"Critério de aceitação de risco = o nível de risco que a organização tolera — referência para decidir quando tratar ou aceitar."},{"numero":39,"enunciado":"39. A Declaração de Aplicabilidade (SoA) é um documento fundamental na ISO/IEC 27001. O que ela DEVE conter obrigatoriamente?","resposta_correta":"A) Apenas os controles selecionados para implementação","justificativa":"Conforme a cláusula 6.1.3 d), a Declaração de Aplicabilidade (SoA) deve conter, obrigatoriamente: os controles necessários (com base no resultado do tratamento de riscos e na comparação com o Anexo A), a justificativa para sua inclusão, se estão implementados ou não, e a justificativa para exclusão de quaisquer controles do Anexo A considerados não aplicáveis. Um SoA que apenas liste controles, sem justificativas e status, não atende a esse requisito.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa A ('Apenas os controles selecionados para implementação') como correta, mas essa afirmação é incompleta frente ao texto da cláusula 6.1.3 d), que exige também a justificativa de inclusão/exclusão e o status de implementação. A resposta tecnicamente correta e completa é a alternativa B. Recomenda-se estudar esta questão com a resposta correta sendo B.","alternativas_incorretas":[],"dica":"","resumo":"SoA obrigatório = controles necessários + justificativa de inclusão/exclusão + status de implementação (os três juntos, não apenas um)."},{"numero":40,"enunciado":"40. A opção de tratamento de risco 'modificar' (mitigar) implica qual ação?","resposta_correta":"B) Implementar controles para reduzir a probabilidade ou impacto do risco","justificativa":"A opção de tratamento de risco 'modificar' (também chamada de mitigar) consiste em implementar controles adicionais ou reforçar controles existentes para reduzir a probabilidade de ocorrência do risco e/ou o impacto caso ele se materialize, trazendo o risco a um nível aceitável conforme os critérios definidos pela organização (cláusula 6.1.2 a).","alternativas_incorretas":[],"dica":"","resumo":"Modificar/Mitigar = implementar controles para reduzir probabilidade ou impacto do risco."},{"numero":41,"enunciado":"41. Os objetivos de segurança da informação (cláusula 6.2) devem ser SMART. Qual característica NÃO é exigida pela norma para esses objetivos?","resposta_correta":"C) Serem comunicados e disponíveis como informação documentada","justificativa":"A cláusula 6.2 exige que os objetivos de segurança da informação sejam, entre outras características, consistentes com a política de SI, mensuráveis (se praticável), monitorados, comunicados e disponibilizados como informação documentada, além de atualizados conforme apropriado. Manter os objetivos 'secretos' para proteger a estratégia de segurança não é uma característica exigida pela norma — pelo contrário, ela exige comunicação e disponibilização.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa C ('Serem comunicados e disponíveis como informação documentada') como a característica NÃO exigida, mas essa é justamente uma exigência explícita da cláusula 6.2. A característica que, de fato, NÃO é exigida pela norma é a alternativa B ('Serem secretos para proteger a estratégia de segurança'). Recomenda-se estudar esta questão com a resposta correta sendo B.","alternativas_incorretas":[],"dica":"","resumo":"Objetivos de SI (6.2) devem ser comunicados e documentados — 'mantê-los em segredo' NÃO é exigência da norma."},{"numero":42,"enunciado":"42. Na fase de planejamento, ao selecionar controles para tratamento de risco, a organização deve comparar sua seleção com o Anexo A. Qual é o objetivo dessa comparação?","resposta_correta":"B) Verificar se nenhum controle necessário foi omitido inadvertidamente","justificativa":"Ao selecionar controles para o tratamento de riscos, a cláusula 6.1.3 c) exige que a organização compare os controles determinados como necessários com os do Anexo A e verifique se nenhum controle necessário foi omitido. Esse é um mecanismo de checagem cruzada (cross-check), não uma exigência de implementar todos os 93 controles — a norma permite exclusões justificadas.","alternativas_incorretas":[],"dica":"","resumo":"Comparação com o Anexo A = checagem de completude, não obrigação de implementar os 93 controles."},{"numero":43,"enunciado":"43. Uma empresa está planejando implementar o SGSI em fases. A fase inicial cobre apenas a área de TI. Como deve ser documentado o escopo?","resposta_correta":"B) O escopo deve ser claramente documentado descrevendo os limites, interfaces e dependências","justificativa":"A cláusula 4.3 exige que o escopo do SGSI seja documentado de forma clara, considerando os limites e a aplicabilidade do sistema, bem como interfaces e dependências. Uma implementação por fases, começando pela área de TI, é perfeitamente válida, desde que o escopo documentado descreva claramente esses limites, interfaces e dependências com as demais áreas da organização não incluídas inicialmente.","alternativas_incorretas":[],"dica":"","resumo":"Escopo parcial é válido, desde que bem documentado com limites, interfaces e dependências claras."},{"numero":44,"enunciado":"44. O plano de tratamento de riscos deve ser aprovado por quem, conforme a cláusula 6.1.3?","resposta_correta":"C) Pelo auditor interno antes de qualquer implementação","justificativa":"Conforme a cláusula 6.1.3 e), o plano de tratamento de riscos deve ser formulado e, então, deve ser obtida a aprovação dos proprietários de riscos (risk owners) para o plano de tratamento e para a aceitação dos riscos residuais. Além disso, a Alta Direção, no exercício de sua liderança (cláusula 5.1), assegura que os recursos necessários para a implementação desse plano sejam disponibilizados e endossa formalmente o SGSI.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa C ('Pelo auditor interno antes de qualquer implementação') como correta, mas essa afirmação contraria o papel do auditor interno, que é avaliar de forma independente a conformidade do SGSI (cláusula 9.2), e não aprovar planos de tratamento de risco — isso comprometeria sua independência. A resposta tecnicamente correta, alinhada à cláusula 6.1.3 e), é a alternativa B. Recomenda-se estudar esta questão com a resposta correta sendo B.","alternativas_incorretas":[],"dica":"","resumo":"Plano de tratamento de riscos: aprovado pelos proprietários dos riscos e pela Alta Direção — nunca pelo auditor interno."},{"numero":45,"enunciado":"45. Ao planejar a implementação, a organização deve determinar recursos necessários (cláusula 7.1). Qual categoria de recurso é frequentemente subestimada?","resposta_correta":"A) Infraestrutura de hardware para os sistemas de segurança","justificativa":"A cláusula 7.1 exige que a organização determine e forneça os recursos necessários para estabelecer, implementar, manter e melhorar continuamente o SGSI. Na prática de implementação, a competência humana — incluindo o tempo, o treinamento e, eventualmente, a contratação de especialistas em segurança da informação — é frequentemente subestimada em relação a investimentos mais visíveis como hardware e software, apesar de ser essencial para operar e manter o sistema de forma eficaz.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa A ('Infraestrutura de hardware') como correta, mas a prática de implementação de SGSI (e a literatura de referência PECB) aponta a competência humana como o recurso mais frequentemente subestimado, não a infraestrutura de hardware, que costuma ser mais visível e orçada com antecedência. A resposta tecnicamente mais defensável é a alternativa B. Recomenda-se considerar essa nuance ao revisar esta questão.","alternativas_incorretas":[],"dica":"","resumo":"O recurso mais subestimado na implementação de um SGSI costuma ser a competência humana, não a infraestrutura tecnológica."},{"numero":46,"enunciado":"46. Na implementação, o controle de acesso lógico (A.9) exige autenticação forte. Qual é um método comum?","resposta_correta":"B) Senha + biometria","justificativa":"O controle de acesso lógico busca assegurar que apenas usuários autorizados e devidamente autenticados acessem sistemas e informações. Um método comum de autenticação forte é a autenticação multifator (MFA), combinando algo que o usuário sabe (senha) com algo que o usuário é (biometria) — reduzindo significativamente o risco de comprometimento de credenciais em comparação com um único fator.","alternativas_incorretas":[],"dica":"","resumo":"Autenticação forte = múltiplos fatores (ex.: senha + biometria), nunca senha isolada ou token perpétuo."},{"numero":47,"enunciado":"47. Para implementar suporte, treinamentos devem ser planejados. Qual evidência é necessária?","resposta_correta":"B) Lista de participantes","justificativa":"Para demonstrar competência (cláusula 7.2) e a eficácia das ações de treinamento, a organização deve manter evidências não apenas de que as pessoas participaram de um treinamento, mas também de que esse treinamento foi eficaz — por exemplo, por meio de avaliações pós-treinamento, testes práticos (como simulações de phishing) ou indicadores de melhoria de comportamento. Registros de participação isolados não comprovam eficácia.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa B ('Lista de participantes') como correta, mas essa evidência, isoladamente, é insuficiente frente à cláusula 7.2, que exige evidência de competência (o que inclui, na prática, avaliar a eficácia das ações de treinamento tomadas). A alternativa mais completa e tecnicamente correta é a A ('Registros de participação e eficácia'). Recomenda-se estudar esta questão com a resposta correta sendo A.","alternativas_incorretas":[],"dica":"","resumo":"Evidência de treinamento eficaz = participação + comprovação de eficácia, não apenas lista de presença."},{"numero":48,"enunciado":"48. A implementação operacional inclui gerenciamento de incidentes (A.16). Qual é o primeiro passo em um incidente?","resposta_correta":"A) Identificação, registro e classificação inicial do incidente","justificativa":"A gestão de incidentes de segurança da informação (controles A.5.24 a A.5.28 na numeração 2022, equivalentes ao antigo A.16 de 2013) segue um ciclo que começa pela detecção e identificação/relato do incidente (registro do evento e classificação inicial), etapa que precede a contenção, a erradicação e a recuperação. Sem essa etapa inicial de identificação e registro, não é possível sequer iniciar a resposta ao incidente.","alternativas_incorretas":[],"dica":"","resumo":"Antes de conter e erradicar um incidente, é preciso identificá-lo e registrá-lo — essa é sempre a primeira etapa.\n---"},{"numero":49,"enunciado":"49. No controle de fornecedores (A.15), acordos devem especificar responsabilidades de SI. Qual cláusula guia?","resposta_correta":"B) Cláusula 8.1.4","justificativa":"O controle de segurança da informação nas relações com fornecedores está previsto, na estrutura de 2022, nos controles A.5.19 a A.5.23 (tema Organizacional), que exigem que os acordos com fornecedores especifiquem os requisitos de segurança da informação aplicáveis, incluindo responsabilidades de cada parte. Já no corpo principal da norma, é a cláusula 8.1 (Planejamento e controle operacional) que exige que processos terceirizados sejam determinados e controlados.\n\n⚠️ **Nota técnica:** A numeração '8.1.4' citada na alternativa B não corresponde a nenhuma subcláusula real da ISO/IEC 27001:2022 (a estrutura oficial não subdivide a cláusula 8.1 dessa forma). A explicação acima trata do conceito correto — controle de processos terceirizados via cláusula 8.1 e controles A.5.19 a A.5.23 do Anexo A — em vez de validar um número de cláusula que não existe na norma.","alternativas_incorretas":[],"dica":"","resumo":"Fornecedores/terceirização: cláusula 8.1 (controle operacional) + controles A.5.19–A.5.23 (Anexo A) — não existe cláusula '8.1.4' na norma."},{"numero":50,"enunciado":"50. Implementar criptografia (A.10) protege dados em trânsito. Qual algoritmo é aprovado pela ISO?","resposta_correta":"B) DES","justificativa":"Entre os algoritmos citados, o AES-256 (Advanced Encryption Standard, com chave de 256 bits) é atualmente reconhecido como um algoritmo de criptografia simétrica robusto e amplamente aceito por padrões de segurança da informação (incluindo diretrizes que apoiam o controle A.8.24 – Uso de criptografia), sendo adequado para proteger dados em trânsito e em repouso.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa B (DES) como correta, mas essa afirmação está tecnicamente incorreta: o DES é um algoritmo obsoleto e inseguro, não aprovado para uso atual. A resposta tecnicamente correta é a alternativa A (AES-256). Recomenda-se estudar esta questão com a resposta correta sendo A.","alternativas_incorretas":[],"dica":"","resumo":"DES e MD5 são obsoletos/inseguros; AES-256 é o algoritmo robusto e atualmente recomendado."},{"numero":51,"enunciado":"51. A segregação de funções é implementada para prevenir fraudes. Qual exemplo?","resposta_correta":"C) Aprovação separada de pagamentos","justificativa":"A segregação de funções (segregation of duties) é um controle preventivo clássico contra fraude e erro, que consiste em dividir tarefas e responsabilidades conflitantes entre diferentes pessoas, de modo que nenhuma pessoa sozinha consiga executar e ocultar uma ação fraudulenta de ponta a ponta. A separação entre quem solicita/executa um pagamento e quem o aprova (aprovação separada de pagamentos) é um exemplo clássico e frequentemente citado desse controle.","alternativas_incorretas":[],"dica":"","resumo":"Segregação de funções = separar quem executa de quem aprova/valida — reduz risco de fraude não detectada.\n---"},{"numero":52,"enunciado":"52. Durante a implementação, mudanças devem ser controladas. Qual processo ISO?","resposta_correta":"A) Auditoria interna","justificativa":"Mudanças que afetam o SGSI durante a implementação devem ser controladas de forma estruturada. A cláusula 8.1 (corpo da norma) exige o planejamento e controle operacional dos processos, e o controle A.8.32 do Anexo A (tema Tecnológico) trata especificamente de gestão de mudanças, exigindo que mudanças em recursos de processamento e sistemas de informação sejam sujeitas a procedimentos de controle de mudanças.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa A ('Auditoria interna') como correta, mas auditoria interna é um processo de avaliação de conformidade, não de controle de mudanças. A resposta tecnicamente correta é a alternativa B ('Controle de mudanças'). Vale notar também que a numeração '8.1.3' citada na alternativa B não corresponde a uma subcláusula oficial da ISO/IEC 27001:2022 (o controle de mudanças, no Anexo A 2022, está no controle A.8.32); ainda assim, o conceito descrito por essa alternativa (controle de mudanças) é o tecnicamente correto para a pergunta. Recomenda-se estudar esta questão com a resposta correta sendo B.","alternativas_incorretas":[],"dica":"","resumo":"Controle de mudanças é processo operacional contínuo (8.1/A.8.32) — diferente de auditoria interna e de análise crítica pela Direção."},{"numero":53,"enunciado":"53. O controle A.5.15 trata de controle de acesso. Qual é o princípio fundamental que deve orientar as regras de controle de acesso?","resposta_correta":"B) Princípio do menor privilégio – acesso apenas ao necessário para executar funções","justificativa":"O controle A.5.15 (Controle de acesso) exige que regras para controlar o acesso físico e lógico à informação e a outros ativos associados sejam estabelecidas e implementadas com base nos requisitos de negócio e de segurança da informação. O princípio fundamental que deve orientar essas regras é o do menor privilégio (least privilege): conceder a cada usuário apenas o acesso estritamente necessário para desempenhar suas funções, nada além disso.","alternativas_incorretas":[],"dica":"","resumo":"Controle de acesso (A.5.15) = princípio do menor privilégio: só o acesso necessário para a função."},{"numero":54,"enunciado":"54. Durante a implementação do controle A.8.7 (proteção contra malware), qual abordagem é mais alinhada à norma?","resposta_correta":"B) Implementar controles de detecção, prevenção e recuperação combinados com conscientização dos usuários","justificativa":"O controle A.8.7 (Proteção contra malware) recomenda uma abordagem em camadas: implementar controles de detecção, prevenção e recuperação, combinados com adequada conscientização dos usuários, para proteger a organização contra códigos maliciosos de forma abrangente, e não depender de uma única medida técnica isolada.","alternativas_incorretas":[],"dica":"","resumo":"A.8.7 (antimalware) = combinação de detecção, prevenção, recuperação e conscientização — nunca uma única medida isolada."},{"numero":55,"enunciado":"55. A implementação de criptografia (controle A.8.24) deve seguir uma política. O que essa política deve estabelecer?","resposta_correta":"B) Abordagem para uso de criptografia, incluindo gestão de chaves criptográficas","justificativa":"O controle A.8.24 (Uso de criptografia) exige que uma política sobre o uso de criptografia seja desenvolvida e implementada, definindo a abordagem da organização para uso de controles criptográficos, incluindo princípios gerais, requisitos legais/regulatórios aplicáveis e, de forma essencial, a gestão do ciclo de vida das chaves criptográficas (geração, distribuição, armazenamento, rotação e revogação).","alternativas_incorretas":[],"dica":"","resumo":"A.8.24: política de criptografia deve incluir, obrigatoriamente, a gestão do ciclo de vida das chaves criptográficas."},{"numero":56,"enunciado":"56. O controle A.5.24 exige planejamento para gestão de incidentes. O que deve ser definido durante a implementação?","resposta_correta":"B) Processos, papéis, responsabilidades e procedimentos de comunicação para resposta a incidentes","justificativa":"O controle A.5.24 (Planejamento e preparação para gestão de incidentes de segurança da informação) exige que a organização defina e comunique processos, papéis e responsabilidades para uma resposta consistente e eficaz a incidentes, incluindo procedimentos de comunicação para relatar eventos e gerenciar incidentes ao longo de todo o seu ciclo de vida.","alternativas_incorretas":[],"dica":"","resumo":"A.5.24 = estrutura de governança da resposta a incidentes: processos, papéis, responsabilidades e comunicação."},{"numero":57,"enunciado":"57. Um Lead Implementer está implementando o controle A.5.9 (inventário de ativos). Qual informação é essencial no inventário?","resposta_correta":"A) Apenas o valor de mercado dos ativos físicos","justificativa":"O controle A.5.9 (Inventário de ativos de informação e outros ativos associados) exige que os ativos sejam identificados e que um inventário adequado seja desenvolvido e mantido. As informações essenciais desse inventário incluem a identificação clara do ativo, seu proprietário (owner), sua classificação (conforme o esquema de classificação da informação, controle A.5.12) e sua localização — dados que permitem gerenciar e proteger o ativo de forma consistente.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa A ('Apenas o valor de mercado dos ativos físicos') como correta, mas essa informação é insuficiente e não atende à finalidade de segurança da informação do inventário de ativos. A resposta tecnicamente correta é a alternativa B. Recomenda-se estudar esta questão com a resposta correta sendo B.","alternativas_incorretas":[],"dica":"","resumo":"Inventário de ativos (A.5.9): identificação, proprietário, classificação e localização — não apenas valor de mercado ou dados patrimoniais."},{"numero":58,"enunciado":"58. O controle A.8.8 trata de gestão de vulnerabilidades técnicas. Qual processo deve ser implementado?","resposta_correta":"C) Aplicação automática de todos os patches sem avaliação prévia de impacto","justificativa":"O controle A.8.8 (Gestão de vulnerabilidades técnicas) exige que a organização obtenha informações sobre vulnerabilidades técnicas de sistemas de informação em uso, avalie a exposição da organização a essas vulnerabilidades e tome medidas apropriadas e tempestivas para tratá-las — ou seja, um processo contínuo de identificação, avaliação e tratamento (correção priorizada com base em risco), e não aplicação cega de todos os patches sem qualquer avaliação prévia de impacto.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa C ('Aplicação automática de todos os patches sem avaliação prévia de impacto') como correta, mas essa prática é, na verdade, contrária às boas práticas de gestão de vulnerabilidades e de mudanças, podendo causar indisponibilidades. A resposta tecnicamente correta, alinhada ao texto do controle A.8.8, é a alternativa B. Recomenda-se estudar esta questão com a resposta correta sendo B.","alternativas_incorretas":[],"dica":"","resumo":"Gestão de vulnerabilidades (A.8.8) = identificar + avaliar + tratar tempestivamente — nunca reativo apenas ou automático sem avaliação."},{"numero":59,"enunciado":"59. Durante a implementação, a organização deseja garantir a segurança no desenvolvimento de software. Qual controle do Anexo A aborda esse tema?","resposta_correta":"B) A.8.15 – Log","justificativa":"O controle A.8.25 (Ciclo de vida de desenvolvimento seguro) exige que regras para o desenvolvimento seguro de software e sistemas sejam estabelecidas e aplicadas, cobrindo todo o ciclo de vida do desenvolvimento — desde requisitos de segurança, arquitetura, codificação segura, testes de segurança, até a implantação — sendo o controle específico do Anexo A que trata diretamente do tema de desenvolvimento seguro de software mencionado na questão.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa B (A.8.15 – Log) como correta, mas esse controle trata de registro de eventos (logs), sem relação direta com desenvolvimento seguro de software. A resposta tecnicamente correta é a alternativa A (A.8.25 – Ciclo de vida de desenvolvimento seguro). Recomenda-se estudar esta questão com a resposta correta sendo A.","alternativas_incorretas":[],"dica":"","resumo":"Segurança no ciclo de desenvolvimento de software → controle A.8.25 (não A.8.15, que é logging)."},{"numero":60,"enunciado":"60. A implementação de segurança física é regida pelos controles A.7.x. Qual princípio orienta a criação de perímetros de segurança?","resposta_correta":"A) Usar barreiras únicas de alta tecnologia para reduzir custos","justificativa":"Os controles físicos do tema Físico (A.7.x) recomendam o uso de perímetros de segurança física organizados em múltiplas camadas (defesa em profundidade) — por exemplo, cerca externa, controle de acesso na portaria, catracas internas, salas restritas e, por fim, gabinetes/racks trancados no datacenter — de modo que a falha ou superação de uma única barreira não comprometa todo o ambiente protegido.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa A ('Usar barreiras únicas de alta tecnologia para reduzir custos') como correta, mas essa abordagem contraria o princípio de defesa em profundidade recomendado pelos controles físicos do Anexo A — depender de uma única barreira, por mais avançada que seja, cria um ponto único de falha. A resposta tecnicamente correta é a alternativa B. Recomenda-se estudar esta questão com a resposta correta sendo B.","alternativas_incorretas":[],"dica":"","resumo":"Segurança física eficaz = múltiplas camadas de proteção (defesa em profundidade), nunca uma única barreira isolada."},{"numero":61,"enunciado":"61. O controle A.6.3 exige treinamento em segurança da informação. Com qual frequência e abrangência ele deve ser realizado?","resposta_correta":"C) Apenas quando houver mudanças significativas na política de segurança","justificativa":"O controle A.6.3 (Conscientização, educação e treinamento em segurança da informação) exige que colaboradores e partes interessadas relevantes recebam conscientização, educação e treinamento apropriados, com atualizações regulares e periódicas das políticas e procedimentos organizacionais relevantes para sua função — não apenas de forma pontual ou reativa a mudanças ou apenas para novos contratados.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa C ('Apenas quando houver mudanças significativas na política de segurança') como correta, mas essa frequência é insuficiente frente ao texto do controle A.6.3, que exige regularidade e abrangência contínua. A resposta tecnicamente correta é a alternativa B. Recomenda-se estudar esta questão com a resposta correta sendo B.","alternativas_incorretas":[],"dica":"","resumo":"A.6.3 = treinamento regular e contínuo para todo o pessoal relevante, não apenas eventos pontuais."},{"numero":62,"enunciado":"62. Ao implementar o controle A.5.14 sobre transferência de informações, o que deve ser estabelecido?","resposta_correta":"B) Regras, procedimentos ou acordos para transferência de informações em todos os tipos de instalações","justificativa":"O controle A.5.14 (Transferência de informações) exige que regras, procedimentos ou acordos de transferência de informações sejam estabelecidos para todos os tipos de instalações de transferência dentro da organização e entre a organização e partes externas — incluindo transferência eletrônica, física e verbal — e não apenas para um canal específico como o e-mail.","alternativas_incorretas":[],"dica":"","resumo":"A.5.14 = regras/acordos de transferência de informação cobrindo todos os tipos de instalações, não só e-mail."},{"numero":63,"enunciado":"63. O monitoramento inclui KPIs. Qual método para medir eficácia do ISMS?","resposta_correta":"B) Pesquisas de satisfação","justificativa":"A cláusula 9.1 permite que a organização utilize diferentes métodos para monitorar a percepção e a satisfação das partes interessadas com o desempenho do SGSI, sendo as pesquisas de satisfação um instrumento direto para captar essa percepção junto a colaboradores, clientes ou outras partes interessadas relevantes, complementando outras fontes objetivas de desempenho do sistema.","alternativas_incorretas":[],"dica":"","resumo":"Eficácia do SGSI pode ser medida por múltiplas fontes (auditorias, KPIs, pesquisas) — não existe um único método 'correto' isoladamente."},{"numero":64,"enunciado":"64. A medição de conformidade legal exige monitoramento contínuo. Qual evidência?","resposta_correta":"B) Registros de revisões legais","justificativa":"A conformidade com requisitos legais e regulatórios de segurança da informação exige monitoramento contínuo, já que a legislação e as obrigações contratuais podem mudar ao longo do tempo. Registros de revisões legais periódicas — evidenciando quando e como a organização avaliou sua conformidade frente a requisitos legais aplicáveis (relacionado ao controle A.5.31 e à cláusula 9.1) — são a evidência apropriada desse monitoramento contínuo.","alternativas_incorretas":[],"dica":"","resumo":"Conformidade legal exige registros de revisões periódicas — não uma declaração única nem só um relatório anual."},{"numero":65,"enunciado":"65. No desempenho, a análise de dados de incidentes deve ser feita. Qual ferramenta?","resposta_correta":"C) Métricas de tempo médio de resolução (MTTR)","justificativa":"Na análise de dados de desempenho relacionados a incidentes (cláusula 9.1), métricas de tempo médio de resolução (MTTR – Mean Time To Resolve/Repair) são amplamente utilizadas para avaliar a eficiência e a eficácia do processo de resposta a incidentes, permitindo identificar tendências de melhoria ou de deterioração ao longo do tempo.","alternativas_incorretas":[],"dica":"","resumo":"MTTR (tempo médio de resolução) é uma métrica-padrão para avaliar a eficiência da resposta a incidentes.\n---"},{"numero":66,"enunciado":"66. A cláusula 9.1 exige monitoramento, medição, análise e avaliação. Quem define métodos?","resposta_correta":"B) Equipe de SI","justificativa":"A cláusula 9.1 exige que a organização determine os métodos de monitoramento, medição, análise e avaliação necessários para assegurar resultados válidos. Embora a norma não atribua essa responsabilidade a um cargo específico, na prática de implementação essa definição normalmente é conduzida pela equipe responsável pela segurança da informação, que possui o conhecimento técnico necessário para desenhar indicadores e métodos de medição relevantes, submetendo-os posteriormente à validação da Alta Direção.","alternativas_incorretas":[],"dica":"","resumo":"Cláusula 9.1: a norma não nomeia o responsável — na prática, cabe à equipe de segurança da informação definir métodos, com aval da Alta Direção."},{"numero":67,"enunciado":"67. Para medir eficácia dos controles, use conformidade e cobertura. Qual é um indicador?","resposta_correta":"B) Taxa de conformidade com SoA","justificativa":"Um indicador de eficácia dos controles relacionado à conformidade e cobertura da implementação é a taxa de conformidade com a Declaração de Aplicabilidade (SoA), que mostra o percentual de controles listados como aplicáveis no SoA que já foram efetivamente implementados e estão operando conforme planejado — uma métrica direta de progresso e maturidade da implementação.","alternativas_incorretas":[],"dica":"","resumo":"Taxa de conformidade com o SoA é um indicador direto de eficácia/cobertura de controles."},{"numero":68,"enunciado":"68. A satisfação das partes interessadas é monitorada por pesquisas. Qual frequência típica?","resposta_correta":"C) Anual ou após mudanças","justificativa":"O monitoramento da satisfação de partes interessadas por meio de pesquisas costuma ser realizado com frequência anual, ou de forma adicional sempre que ocorrem mudanças significativas relevantes (por exemplo, mudanças de escopo, incidentes de grande impacto ou alterações regulatórias), garantindo que a percepção das partes interessadas seja capturada de forma periódica e também reativa a eventos relevantes.","alternativas_incorretas":[],"dica":"","resumo":"Pesquisas de satisfação de partes interessadas: frequência típica anual, ou após mudanças significativas.\n---"},{"numero":69,"enunciado":"69. Registros de monitoramento devem ser retidos. Qual cláusula?","resposta_correta":"B) 9.1.3","justificativa":"A cláusula 9.1 exige que a organização retenha informação documentada apropriada como evidência dos resultados de monitoramento, medição, análise e avaliação. Embora a numeração de subitem citada na alternativa ('9.1.3') não corresponda a uma subdivisão oficial da cláusula 9.1 na estrutura da ISO/IEC 27001:2022 (que apresenta a cláusula 9.1 como uma lista de itens a-f, sem numeração adicional de subcláusulas), o conceito correto é que a retenção de registros de monitoramento está prevista, sim, dentro da cláusula 9.1.\n\n⚠️ **Nota técnica:** A numeração '9.1.3' citada na alternativa B não corresponde a uma subcláusula oficial da ISO/IEC 27001:2022 (a cláusula 9.1 não é subdividida dessa forma na norma). O conceito correto — retenção de registros de monitoramento e medição — está, de fato, dentro da cláusula 9.1 em sua totalidade, o que torna a alternativa B a mais próxima da correta entre as três, apesar do número de subcláusula ser impreciso.","alternativas_incorretas":[],"dica":"","resumo":"Registros de monitoramento e medição são retidos como informação documentada dentro da cláusula 9.1."},{"numero":70,"enunciado":"70. A avaliação de conformidade inclui testes de penetração. Qual cláusula suporta?","resposta_correta":"C) 8.2","justificativa":"A cláusula 8.2 (Avaliação de riscos de segurança da informação) exige que a organização realize avaliações de risco em intervalos planejados ou quando mudanças significativas forem propostas ou ocorrerem, considerando os critérios estabelecidos em 6.1.2. Testes de penetração são uma técnica prática de avaliação de riscos/vulnerabilidades técnicas que podem alimentar esse processo periódico de reavaliação de riscos.","alternativas_incorretas":[],"dica":"","resumo":"Testes de penetração alimentam a avaliação periódica de riscos (cláusula 8.2), distinta da auditoria interna do SGSI (9.2)."},{"numero":71,"enunciado":"71. A cláusula 9.1 exige que a organização avalie o desempenho do SGSI. Qual dos indicadores abaixo é mais adequado para medir a eficácia de um controle de conscientização?","resposta_correta":"A) Número de licenças de software de segurança adquiridas","justificativa":"Para medir a eficácia de um controle de conscientização (como campanhas de sensibilização contra phishing), o indicador mais adequado é uma métrica de resultado comportamental direto, como o percentual de funcionários que identificaram corretamente e-mails de phishing em testes simulados. Esse tipo de indicador mede o efeito real do controle sobre o comportamento das pessoas, e não apenas o esforço ou o investimento realizado.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa A ('Número de licenças de software de segurança adquiridas') como correta, mas esse indicador não mede a eficácia de um controle de conscientização, e sim um investimento tecnológico não relacionado ao comportamento humano. A resposta tecnicamente correta é a alternativa B. Recomenda-se estudar esta questão com a resposta correta sendo B.","alternativas_incorretas":[],"dica":"","resumo":"Eficácia de conscientização = medir comportamento real (ex.: acerto em simulação de phishing), não insumos como orçamento ou licenças."},{"numero":72,"enunciado":"72. O programa de auditoria interna (cláusula 9.2) deve ser planejado considerando quais fatores?","resposta_correta":"B) A importância dos processos, resultados de auditorias anteriores e mudanças que afetam a organização","justificativa":"A cláusula 9.2.2 exige que o(s) programa(s) de auditoria interna sejam planejados considerando a importância dos processos envolvidos, os resultados de auditorias anteriores e as mudanças que afetam a organização, além de outros fatores como requisitos legais e contratuais. Esse planejamento baseado em risco permite priorizar recursos de auditoria onde são mais necessários.","alternativas_incorretas":[],"dica":"","resumo":"Programa de auditoria interna (9.2) é planejado com base em importância dos processos, mudanças e auditorias anteriores — abordagem baseada em risco."},{"numero":73,"enunciado":"73. Um auditor interno encontrou evidências de que a análise crítica pela Direção (cláusula 9.3) não incluiu a situação de ações de análises críticas anteriores. Qual é a classificação correta dessa constatação?","resposta_correta":"C) Oportunidade de melhoria, pois a norma recomenda mas não exige esse item","justificativa":"A cláusula 9.3.2 a) exige explicitamente que a análise crítica pela Direção considere, como entrada, a situação de ações provenientes de análises críticas anteriores. Quando essa entrada obrigatória é omitida da análise crítica, trata-se de uma não conformidade, pois um requisito explícito da norma deixou de ser atendido — e não apenas uma sugestão de boa prática ou uma melhoria opcional.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa C ('Oportunidade de melhoria, pois a norma recomenda mas não exige esse item') como correta, mas essa afirmação está tecnicamente incorreta: a cláusula 9.3.2 a) exige, de forma obrigatória, que a situação de ações de análises críticas anteriores seja uma entrada da análise crítica pela Direção. Sua omissão constitui, portanto, uma não conformidade, e a resposta tecnicamente correta é a alternativa B — que, inclusive, é a única alternativa cujo próprio texto já apresenta o argumento tecnicamente correto. Recomenda-se estudar esta questão com a resposta correta sendo B.","alternativas_incorretas":[],"dica":"","resumo":"Entrada obrigatória da análise crítica omitida (9.3.2 a) = não conformidade, nunca apenas observação ou oportunidade de melhoria."},{"numero":74,"enunciado":"74. Os resultados da análise crítica pela Direção devem incluir quais tipos de decisões?","resposta_correta":"A) Apenas decisões sobre o orçamento do próximo exercício fiscal","justificativa":"Os resultados da análise crítica pela Direção (cláusula 9.3.3) devem incluir decisões relacionadas a oportunidades de melhoria contínua e a quaisquer necessidades de mudança no SGSI, incluindo mudanças em recursos, objetivos ou processos, com base na avaliação do desempenho, adequação e eficácia do sistema realizada durante a análise crítica.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa A ('Apenas decisões sobre o orçamento do próximo exercício fiscal') como correta, mas essa afirmação restringe indevidamente o escopo da cláusula 9.3.3, que trata de melhoria contínua e necessidades de mudança no SGSI de forma ampla, não apenas orçamentária. A resposta tecnicamente correta é a alternativa B. Recomenda-se estudar esta questão com a resposta correta sendo B.","alternativas_incorretas":[],"dica":"","resumo":"Análise crítica pela Direção (9.3.3): decisões sobre melhoria contínua e necessidades de mudança no SGSI — nunca restrita apenas a orçamento ou apenas a ações corretivas."},{"numero":75,"enunciado":"75. Ao definir o que monitorar e medir no SGSI (cláusula 9.1), qual informação deve ser determinada?","resposta_correta":"B) O que monitorar, os métodos de análise, quando realizar e quem deve analisar e avaliar os resultados","justificativa":"Ao definir o que monitorar e medir (cláusula 9.1), a organização deve determinar: o que precisa ser monitorado e medido, incluindo processos e controles de segurança da informação; os métodos de monitoramento, medição, análise e avaliação necessários para assegurar resultados válidos; quando o monitoramento e a medição devem ser realizados; quem deve monitorar e medir; quando os resultados devem ser analisados e avaliados; e quem deve analisar e avaliar esses resultados.","alternativas_incorretas":[],"dica":"","resumo":"Cláusula 9.1: definir o quê, métodos, quando, quem mede e quem analisa/avalia — não apenas impacto financeiro ou exigências do certificador."},{"numero":76,"enunciado":"76. A cláusula 10.1 exige melhoria contínua do SGSI. Quais são as dimensões que devem ser aprimoradas continuamente?","resposta_correta":"B) A pertinência, adequação e eficácia do SGSI","justificativa":"A cláusula 10.1 exige que a organização melhore continuamente a pertinência (adequação ao propósito), a adequação (suficiência dos recursos e processos) e a eficácia (capacidade de produzir os resultados pretendidos) do SGSI como um todo. Essa melhoria contínua vai além dos controles técnicos isoladamente ou de processos com não conformidades específicas — abrange o sistema de gestão de forma holística.","alternativas_incorretas":[],"dica":"","resumo":"Melhoria contínua (10.1) = pertinência + adequação + eficácia do SGSI como um todo."},{"numero":77,"enunciado":"77. Ao tratar uma não conformidade (cláusula 10.2), qual passo é realizado APÓS controlar e corrigir a não conformidade?","resposta_correta":"B) Avaliar a necessidade de ações para eliminar as causas e evitar recorrência","justificativa":"Ao tratar uma não conformidade (cláusula 10.2), a organização primeiro reage a ela — controlando e corrigindo a não conformidade e lidando com suas consequências (10.2 a). Em seguida, deve avaliar a necessidade de ação para eliminar a(s) causa(s) raiz da não conformidade, de modo a evitar que ela se repita ou ocorra em outro lugar (10.2 b) — essa avaliação de causa raiz é o que diferencia uma simples correção pontual de uma verdadeira ação corretiva.","alternativas_incorretas":[],"dica":"","resumo":"Após corrigir a não conformidade, o próximo passo é avaliar a necessidade de eliminar suas causas raiz — não arquivar nem notificar o certificador automaticamente."},{"numero":78,"enunciado":"78. A análise de causa raiz é realizada no contexto do tratamento de não conformidades. Qual ferramenta é adequada para essa análise?","resposta_correta":"B) Diagrama de Ishikawa (espinha de peixe) ou metodologia dos 5 Porquês","justificativa":"Para realizar a análise de causa raiz de uma não conformidade, ferramentas estruturadas como o Diagrama de Ishikawa (também chamado de diagrama de espinha de peixe ou causa-e-efeito) e a metodologia dos 5 Porquês (5 Whys) são amplamente recomendadas e utilizadas na prática de gestão da qualidade e segurança da informação, pois ajudam a investigar sistematicamente as causas subjacentes de um problema, e não apenas seus sintomas.","alternativas_incorretas":[],"dica":"","resumo":"Análise de causa raiz de não conformidades = Diagrama de Ishikawa ou 5 Porquês."},{"numero":79,"enunciado":"79. A informação documentada retida sobre não conformidades e ações corretivas (cláusula 10.2 f-g) serve a qual propósito principal?","resposta_correta":"B) Evidenciar o aprendizado organizacional e a eficácia das ações tomadas para eliminar causas","justificativa":"A retenção de informação documentada sobre a natureza das não conformidades, as ações tomadas e os resultados de qualquer ação corretiva (cláusula 10.2 f e g) serve, principalmente, para evidenciar o aprendizado organizacional obtido com o tratamento do problema e a eficácia das ações implementadas para eliminar suas causas — permitindo, inclusive, identificar padrões e prevenir recorrências futuras.","alternativas_incorretas":[],"dica":"","resumo":"Registros de não conformidade e ação corretiva (10.2 f-g) existem para evidenciar aprendizado organizacional e a eficácia das ações tomadas."},{"numero":80,"enunciado":"80. A melhoria contínua do SGSI pode ser impulsionada por diversas fontes de informação. Qual das seguintes NÃO é uma fonte típica de oportunidades de melhoria?","resposta_correta":"B) Relatórios de vendas do departamento comercial","justificativa":"A melhoria contínua do SGSI (cláusula 10.1) é tipicamente impulsionada por fontes diretamente ligadas ao desempenho de segurança da informação, como resultados de auditorias internas e externas, lições aprendidas de incidentes de segurança, resultados de análises críticas pela Direção e mudanças no contexto de riscos. Relatórios de vendas do departamento comercial não têm relação direta com o desempenho ou a eficácia do SGSI, não sendo, portanto, uma fonte típica de oportunidades de melhoria para a segurança da informação.","alternativas_incorretas":[],"dica":"","resumo":"Relatórios de vendas não alimentam a melhoria contínua do SGSI — auditorias e lições de incidentes, sim."}];
        let questaoAtual = 1;
        const totalQuestoes = 80;

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        function renderizarQuestao() {
            const questao = questoes[questaoAtual - 1];
            if (!questao) return;

            let htmlAlternativas = '';
            if (questao.alternativas_incorretas && questao.alternativas_incorretas.length > 0) {
                for (const alt of questao.alternativas_incorretas) {
                    htmlAlternativas += `<div class="alt-incorreta"><strong>•</strong> ${escapeHtml(alt)}</div>`;
                }
            }

            const html = `
                <div class="question-card">
                    <div class="question-number">Questão ${questao.numero}</div>
                    <div class="enunciado">${escapeHtml(questao.enunciado)}</div>

                    <div class="section-title">Resposta Correta</div>
                    <div class="resposta-correta">
                        <span class="resposta-correta-label">✅ ${escapeHtml(questao.resposta_correta)}</span>
                    </div>

                    <div class="section-title">Justificativa</div>
                    <div class="justificativa">${escapeHtml(questao.justificativa)}</div>

                    <div class="section-title">Por que as demais estão incorretas?</div>
                    <div class="analise-incorretas">${htmlAlternativas || '<p>Análise não disponível</p>'}</div>

                    <div class="section-title">Dica para a Prova</div>
                    <div class="dica">${escapeHtml(questao.dica)}</div>

                    <div class="section-title">Resumo para Memorização</div>
                    <div class="resumo">${escapeHtml(questao.resumo)}</div>
                </div>
            `;

            document.getElementById('questionContainer').innerHTML = html;
            atualizarBotoes();
        }

        function atualizarInfo() {
            document.getElementById('infoQuestao').textContent = `Questão ${questaoAtual} de ${totalQuestoes}`;
        }

        function atualizarBotoes() {
            document.getElementById('btnAnterior').disabled = questaoAtual === 1;
            document.getElementById('btnProxima').disabled = questaoAtual === totalQuestoes;
        }

        function proximaQuestao() {
            if (questaoAtual < totalQuestoes) {
                questaoAtual++;
                document.getElementById('questaoInput').value = questaoAtual;
                renderizarQuestao();
                atualizarInfo();
                window.scrollTo(0, 0);
            }
        }

        function questaoAnterior() {
            if (questaoAtual > 1) {
                questaoAtual--;
                document.getElementById('questaoInput').value = questaoAtual;
                renderizarQuestao();
                atualizarInfo();
                window.scrollTo(0, 0);
            }
        }

        function irParaQuestao() {
            const numero = parseInt(document.getElementById('questaoInput').value);
            if (numero >= 1 && numero <= totalQuestoes) {
                questaoAtual = numero;
                renderizarQuestao();
                atualizarInfo();
                window.scrollTo(0, 0);
            }
        }

        function imprimirPagina() {
            window.print();
        }

        // Navegação com teclado
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') proximaQuestao();
            if (e.key === 'ArrowLeft') questaoAnterior();
        });

        // Inicializar
        renderizarQuestao();
        atualizarInfo();
    </script>
</body>
</html>
