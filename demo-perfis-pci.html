<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demonstração Multiperfil PCI DSS v4.0.1 — Thyreos Guardian</title>
    <style>
        :root {
            --brand-primary: #ffb366;
            --brand-secondary: #ffc480;
            --brand-dark: #18181b;
            --text-light: #f4f4f5;
            --text-gray: #a1a1aa;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #60a5fa;
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #18181b 0%, #09090b 100%);
            min-height: 100vh;
            color: var(--text-light);
            line-height: 1.6;
            padding: 30px 20px;
        }

        .container { max-width: 1240px; margin: 0 auto; }

        /* Top Simulation Bar */
        .simulator-bar {
            background: linear-gradient(135deg, rgba(255, 179, 102, 0.15) 0%, rgba(39, 39, 42, 0.95) 100%);
            border: 1px solid rgba(255, 179, 102, 0.4);
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 24px;
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow-md);
        }

        .sim-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 16px;
        }

        .sim-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sim-title h2 {
            font-size: 1.3em;
            color: var(--brand-primary);
        }

        .badge-sim {
            background: rgba(255, 179, 102, 0.2);
            color: var(--brand-primary);
            border: 1px solid rgba(255, 179, 102, 0.4);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: 700;
            text-transform: uppercase;
        }

        .sim-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .profile-select-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(24, 24, 27, 0.9);
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 179, 102, 0.3);
        }

        .profile-select-label {
            font-size: 0.85em;
            color: var(--text-gray);
            font-weight: 600;
        }

        select.profile-dropdown {
            background: #18181b;
            color: white;
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.9em;
            cursor: pointer;
            outline: none;
        }
        select.profile-dropdown:focus { border-color: var(--brand-primary); }

        .btn-action-sm {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-action-sm:hover {
            background: rgba(255, 179, 102, 0.2);
            border-color: var(--brand-primary);
            color: var(--brand-primary);
        }

        .btn-reset {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .btn-reset:hover { background: #ef4444; color: white; }

        /* Role Quick Pills */
        .role-pills {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .role-pill {
            padding: 10px 18px;
            border-radius: 10px;
            background: rgba(24, 24, 27, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-gray);
            font-size: 0.88em;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .role-pill:hover {
            background: rgba(255, 179, 102, 0.1);
            color: white;
            border-color: rgba(255, 179, 102, 0.3);
        }

        .role-pill.active {
            background: var(--brand-primary);
            color: #111;
            border-color: var(--brand-primary);
            font-weight: 800;
            box-shadow: 0 4px 12px rgba(255, 179, 102, 0.3);
        }

        /* Profile Banner */
        .profile-banner {
            background: rgba(39, 39, 42, 0.8);
            border-radius: 14px;
            padding: 20px 24px;
            margin-bottom: 24px;
            border-left: 4px solid var(--brand-primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .profile-user-details h1 {
            font-size: 1.6em;
            color: white;
            margin-bottom: 4px;
        }
        .profile-user-details p {
            color: var(--text-gray);
            font-size: 0.9em;
        }

        .user-tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.78em;
            font-weight: 700;
            text-transform: uppercase;
            margin-left: 8px;
        }

        /* KPI Cards Grid */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .kpi-card {
            background: #27272a;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 179, 102, 0.15);
            box-shadow: var(--shadow-md);
        }

        .kpi-title {
            font-size: 0.78em;
            color: var(--text-gray);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .kpi-value {
            font-size: 2em;
            font-weight: 800;
            color: var(--brand-primary);
        }
        .kpi-value.warning { color: var(--warning); }
        .kpi-value.success { color: var(--success); }
        .kpi-value.info { color: var(--info); }
        .kpi-value.error { color: var(--error); }

        /* Filter Tabs & Toolbar */
        .filter-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            background: #27272a;
            padding: 14px 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-gray);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn:hover { background: rgba(255, 179, 102, 0.1); color: white; }
        .tab-btn.active {
            background: var(--brand-primary);
            color: #111;
            font-weight: 800;
            border-color: var(--brand-primary);
        }

        .search-box {
            background: #18181b;
            border: 1px solid #444;
            padding: 8px 14px;
            border-radius: 8px;
            color: white;
            font-size: 0.9em;
            outline: none;
            width: 240px;
        }
        .search-box:focus { border-color: var(--brand-primary); }

        /* Requirements Cards & List */
        .requirements-grid {
            display: grid;
            gap: 16px;
            margin-bottom: 32px;
        }

        .req-card {
            background: #27272a;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 20px;
            box-shadow: var(--shadow-md);
            transition: transform 0.2s, border-color 0.2s;
        }
        .req-card:hover {
            border-color: rgba(255, 179, 102, 0.3);
            transform: translateY(-2px);
        }

        .req-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 12px;
        }

        .req-code {
            font-weight: 800;
            color: var(--brand-primary);
            background: rgba(255, 179, 102, 0.12);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.9em;
            border: 1px solid rgba(255, 179, 102, 0.2);
        }

        .req-title {
            font-size: 1.05em;
            font-weight: 700;
            color: white;
            margin-top: 4px;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.78em;
            font-weight: 700;
            text-transform: uppercase;
        }
        .status-pendente { background: rgba(245, 158, 11, 0.2); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.3); }
        .status-em_revisao { background: rgba(96, 165, 250, 0.2); color: #93c5fd; border: 1px solid rgba(96, 165, 250, 0.3); }
        .status-aceito { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-ajustes { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }

        .req-meta {
            display: flex;
            gap: 16px;
            font-size: 0.85em;
            color: var(--text-gray);
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .meta-item { display: flex; align-items: center; gap: 6px; }

        .evidence-box {
            background: rgba(24, 24, 27, 0.6);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 14px;
            font-size: 0.88em;
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .evidence-hash {
            font-family: monospace;
            font-size: 0.78em;
            color: #34d399;
            word-break: break-all;
            background: rgba(16, 185, 129, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 6px;
            display: block;
        }

        .qsa-comment-box {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 14px;
            font-size: 0.88em;
            color: #fca5a5;
        }

        .req-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-upload {
            background: var(--brand-primary);
            color: #111;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.88em;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-upload:hover { background: var(--brand-secondary); transform: scale(1.02); }

        .btn-evaluate {
            background: rgba(96, 165, 250, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.4);
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.88em;
            cursor: pointer;
        }
        .btn-evaluate:hover { background: #3b82f6; color: white; }

        /* Executive Section Specifics */
        .exec-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }
        @media (max-width: 868px) { .exec-grid { grid-template-columns: 1fr; } }

        .card-panel {
            background: #27272a;
            border-radius: 14px;
            padding: 24px;
            border: 1px solid rgba(255, 179, 102, 0.15);
            box-shadow: var(--shadow-md);
        }

        .card-panel h3 {
            font-size: 1.1em;
            color: var(--brand-primary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 5x5 Matrix Widget */
        .matrix-5x5 {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-top: 12px;
        }
        .matrix-cell {
            aspect-ratio: 1;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.75em;
            font-weight: 800;
            color: white;
            padding: 4px;
            text-align: center;
        }
        .m-low { background: rgba(16, 185, 129, 0.25); border: 1px solid rgba(16, 185, 129, 0.4); color: #6ee7b7; }
        .m-med { background: rgba(245, 158, 11, 0.25); border: 1px solid rgba(245, 158, 11, 0.4); color: #fcd34d; }
        .m-high { background: rgba(239, 68, 68, 0.3); border: 1px solid rgba(239, 68, 68, 0.5); color: #fca5a5; }
        .m-crit { background: rgba(185, 28, 28, 0.6); border: 1px solid rgba(239, 68, 68, 0.8); color: #fff; }

        /* Progress Area Bars */
        .area-progress-item { margin-bottom: 14px; }
        .area-info { display: flex; justify-content: space-between; font-size: 0.85em; margin-bottom: 4px; }
        .progress-bar-bg { background: rgba(255, 255, 255, 0.08); height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }

        /* Admin Table Specifics */
        .table-responsive { overflow-x: auto; }
        table.admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88em;
            text-align: left;
        }
        table.admin-table th, table.admin-table td {
            padding: 12px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        table.admin-table th {
            color: var(--brand-primary);
            text-transform: uppercase;
            font-size: 0.78em;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }

        .modal-card {
            background: #27272a;
            border: 1px solid rgba(255, 179, 102, 0.3);
            border-radius: 16px;
            width: 100%;
            max-width: 540px;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h3 { font-size: 1.2em; color: var(--brand-primary); }
        .btn-close-modal { background: none; border: none; color: #888; font-size: 1.5em; cursor: pointer; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.85em; color: var(--text-gray); margin-bottom: 6px; font-weight: 600; }
        .form-control {
            width: 100%;
            background: #18181b;
            border: 1px solid #444;
            padding: 10px 14px;
            border-radius: 8px;
            color: white;
            font-size: 0.9em;
        }
        .form-control:focus { border-color: var(--brand-primary); outline: none; }
        textarea.form-control { min-height: 90px; resize: vertical; }

        /* Notification Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #10b981;
            color: #111;
            font-weight: 700;
            padding: 12px 20px;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: none;
            z-index: 2000;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Multi-Role Simulation Control Bar -->
        <div class="simulator-bar">
            <div class="sim-header">
                <div class="sim-title">
                    <h2>🛡️ Demonstração Interativa PCI DSS v4.0.1</h2>
                    <span class="badge-sim">Ambiente Simulado</span>
                </div>
                <div class="sim-controls">
                    <div class="profile-select-wrapper">
                        <span class="profile-select-label">Perfil Ativo:</span>
                        <select id="simProfileDropdown" class="profile-dropdown" onchange="switchProfile(this.value)">
                            <option value="operacional">1. Ponto Focal Operacional (Ana Ribeiro)</option>
                            <option value="executivo">2. Ponto Focal Executivo (Mariana Silva)</option>
                            <option value="qsa">3. QSA Auditor Lead (Carlos Costa)</option>
                            <option value="admin">4. Admin / Governança (Kleiton Rodrigues)</option>
                        </select>
                    </div>
                    <button class="btn-action-sm btn-reset" onclick="resetDemoData()">🔄 Resetar Demo</button>
                    <a href="login.html" class="btn-action-sm">🔐 Telas de Login</a>
                </div>
            </div>

            <!-- Profile Switcher Quick Pills -->
            <div class="role-pills">
                <button class="role-pill active" id="pill-operacional" onclick="switchProfile('operacional')">
                    👩‍💻 Operacional (Dev & Eng)
                </button>
                <button class="role-pill" id="pill-executivo" onclick="switchProfile('executivo')">
                    📊 Executivo (Diretoria)
                </button>
                <button class="role-pill" id="pill-qsa" onclick="switchProfile('qsa')">
                    🔍 QSA Auditor Lead
                </button>
                <button class="role-pill" id="pill-admin" onclick="switchProfile('admin')">
                    ⚙️ Admin / Governança
                </button>
            </div>
        </div>

        <!-- Dynamic Profile Header Banner -->
        <div class="profile-banner" id="profileBanner">
            <!-- Rendered by JS -->
        </div>

        <!-- Dynamic Content Body Container -->
        <div id="dynamicRoleView">
            <!-- Rendered by JS based on selected profile -->
        </div>

    </div>

    <!-- Upload Evidence Modal (Operacional) -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalReqCodeTitle">Enviar Evidência - REQ</h3>
                <button class="btn-close-modal" onclick="closeModal('uploadModal')">&times;</button>
            </div>
            <div class="form-group">
                <label>Título do Documento / Evidência</label>
                <input type="text" id="evTitle" class="form-control" placeholder="Ex: Relatório Anual de Análise de Risco 2026.pdf">
            </div>
            <div class="form-group">
                <label>URL / Link do Repositório Seguro</label>
                <input type="text" id="evLink" class="form-control" placeholder="https://drive.google.com/file/d/12345.../view">
            </div>
            <div class="form-group">
                <label>Assinatura SHA-256 (Calculada Automática)</label>
                <input type="text" id="evHash" class="form-control" readonly style="font-family: monospace; color:#34d399; font-size:0.8em;">
            </div>
            <div class="form-group">
                <label>Observação para o Auditor QSA (Opcional)</label>
                <textarea id="evNotes" class="form-control" placeholder="Detalhes sobre a coleta da evidência..."></textarea>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
                <button class="btn-action-sm" onclick="closeModal('uploadModal')">Cancelar</button>
                <button class="btn-upload" onclick="saveEvidenceSubmission()">Enviar para Revisão QSA</button>
            </div>
        </div>
    </div>

    <!-- QSA Evaluation Modal (QSA Auditor) -->
    <div class="modal-overlay" id="qsaModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="qsaModalTitle">Avaliar Evidência QSA</h3>
                <button class="btn-close-modal" onclick="closeModal('qsaModal')">&times;</button>
            </div>
            <div class="form-group">
                <label>Evidência Submetida</label>
                <input type="text" id="qsaEvDoc" class="form-control" readonly>
            </div>
            <div class="form-group">
                <label>Hash de Integridade SHA-256</label>
                <input type="text" id="qsaEvHash" class="form-control" readonly style="font-family: monospace; color:#34d399; font-size:0.8em;">
            </div>
            <div class="form-group">
                <label>Parecer do Auditor QSA Lead</label>
                <textarea id="qsaNotes" class="form-control" placeholder="Insira as observações técnicas do parecer..."></textarea>
            </div>
            <div class="form-group" id="gapGroup">
                <label style="color:#f87171;">Apontamento de GAP (Obrigatório se solicitar ajustes)</label>
                <textarea id="qsaGap" class="form-control" placeholder="Descreva a não conformidade ou GAP identificado..."></textarea>
            </div>
            <div style="display:flex; justify-content:space-between; gap:10px; margin-top:20px;">
                <button class="btn-action-sm" style="border-color:#ef4444; color:#f87171;" onclick="submitQsaOpinion('ajustes')">⚠️ Solicitar Ajustes</button>
                <button class="btn-upload" style="background:#10b981; color:#111;" onclick="submitQsaOpinion('aceito')">✅ Aprovar Evidência</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toastMsg">Alterações salvas com sucesso!</div>

    <script>
        // Baseline 10 Requisitos Dataset
        const initialRequirements = [
            {
                code: "REQ 1.2.1",
                area: "Infraestrutura & Cloud",
                title: "Configuração de Firewalls e Roteadores",
                freq: "Semestral",
                due: "15.03.2026",
                focal: "Marcos Lima",
                status: "aceito",
                overdueDays: 0,
                evidence: "Relatorio_Firewall_Q1_2026.pdf",
                evidenceUrl: "https://drive.google.com/file/d/12345/view",
                hash: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855",
                qsaComment: "Parecer QSA: Evidência revisada e conforme com a norma PCI v4.0.1."
            },
            {
                code: "REQ 2.2.4",
                area: "Infraestrutura & Cloud",
                title: "Remoção de Senhas Padronizadas e Servidores",
                freq: "Anual",
                due: "20.02.2026",
                focal: "Marcos Lima",
                status: "em_revisao",
                overdueDays: 0,
                evidence: "Hardening_Base_v2.docx",
                evidenceUrl: "https://drive.google.com/file/d/67890/view",
                hash: "a591a6d40bf420404a011733cfb7b190d62c65bf0bcda32b57b277d9ad9f146e",
                qsaComment: "Aguardando validação da amostragem de servidores."
            },
            {
                code: "REQ 3.4.1",
                area: "Segurança da Informação",

                                        <td>${r.area}</td>
                                        <td>
                                            <select class="form-control" style="padding:4px 8px; font-size:0.85em;" onchange="reassignFocal('${r.code}', this.value)">
                                                <option value="Ana Ribeiro" ${r.focal==='Ana Ribeiro'?'selected':''}>Ana Ribeiro (Dev)</option>
                                                <option value="Marcos Lima" ${r.focal==='Marcos Lima'?'selected':''}>Marcos Lima (Infra)</option>
                                                <option value="Roberto Alves" ${r.focal==='Roberto Alves'?'selected':''}>Roberto Alves (Facilities)</option>
                                                <option value="Patricia Souza" ${r.focal==='Patricia Souza'?'selected':''}>Patricia Souza (RH)</option>
                                            </select>
                                        </td>
                                        <td><span class="status-badge status-${r.status}">${formatStatus(r.status)}</span></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // Actions & Modals Logic
        function formatStatus(status) {
            if(status === 'pendente') return 'Pendente';
            if(status === 'em_revisao') return 'Em Revisão';
            if(status === 'aceito') return 'Aceito QSA';
            if(status === 'ajustes') return 'Ajustes Solicitados';
            return status;
        }

        function openUploadModal(code) {
            activeReqCode = code;
            document.getElementById('modalReqCodeTitle').innerText = 'Enviar Evidência - ' + code;
            document.getElementById('evTitle').value = '';
            document.getElementById('evLink').value = '';
            document.getElementById('evHash').value = generateMockHash(code);
            document.getElementById('evNotes').value = '';
            document.getElementById('uploadModal').classList.add('active');
        }

        function saveEvidenceSubmission() {
            const title = document.getElementById('evTitle').value || "Documento_Evidencia_" + activeReqCode + ".pdf";
            const link = document.getElementById('evLink').value || "https://drive.google.com/file/d/demo/view";
            const hash = document.getElementById('evHash').value;
            const notes = document.getElementById('evNotes').value;

            const req = requirements.find(r => r.code === activeReqCode);
            if(req) {
                req.evidence = title;
                req.evidenceUrl = link;
                req.hash = hash;
                req.status = 'em_revisao';
                req.qsaComment = notes ? "Observação do Ponto Focal: " + notes : "Evidência submetida. Aguardando análise QSA.";
                saveData();
                closeModal('uploadModal');
                renderView();
                showToast("Evidência enviada para o QSA com sucesso!");
            }
        }

        function openQsaModal(code) {
            activeReqCode = code;
            const req = requirements.find(r => r.code === code);
            if (!req) return;

            document.getElementById('qsaModalTitle').innerText = 'Avaliar Evidência QSA - ' + code;
            document.getElementById('qsaEvDoc').value = req.evidence || 'Nenhuma evidência anexada';
            document.getElementById('qsaEvHash').value = req.hash || 'N/A';
            document.getElementById('qsaNotes').value = '';
            document.getElementById('qsaGap').value = req.gap || '';

            document.getElementById('qsaModal').classList.add('active');
        }

        function submitQsaOpinion(type) {
            const notes = document.getElementById('qsaNotes').value;
            const gap = document.getElementById('qsaGap').value;
            const req = requirements.find(r => r.code === activeReqCode);

            if (!req) return;

            if (type === 'ajustes') {
                if (!gap.trim()) {
                    alert("Atenção: É obrigatório detalhar o apontamento de GAP ao solicitar ajustes.");
                    return;
                }
                req.status = 'ajustes';
                req.qsaComment = "GAP Identificado: " + gap + (notes ? " ("+notes+")" : "");
                req.gap = gap;
            } else if (type === 'aceito') {
                req.status = 'aceito';
                req.qsaComment = "Parecer QSA: Evidência aprovada e conforme com a norma PCI v4.0.1. " + (notes||"");
                req.gap = null;
            }

            saveData();
            closeModal('qsaModal');
            renderView();
            showToast("Parecer QSA registrado com sucesso!");
        }

        function reassignFocal(code, newFocal) {
            const req = requirements.find(r => r.code === code);
            if(req) {
                req.focal = newFocal;
                saveData();
                showToast(`Requisito ${code} reatribuído a ${newFocal}`);
            }
        }

        function generateMockHash(seed) {
            let str = seed + Date.now().toString();
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = (hash << 5) - hash + str.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash).toString(16).padStart(16, '0') + "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855".substring(16);
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function showToast(msg) {
            const t = document.getElementById('toastMsg');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 3000);
        }

        // Initialize on Load
        initData();
        renderView();
    </script>
</body>
</html>
