<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISO/IEC 27001:2022 Lead Implementer Simulator — Simulado 1</title>
    <style>
      :root{
        --bg:#eef1f5; --card:#ffffff; --ink:#1f2937; --muted:#6b7280;
        --border:#e2e5eb; --primary:#2b3a8f; --primary-2:#3b4db8;
        --good:#15803d; --good-bg:#dcfce7; --bad:#b91c1c; --bad-bg:#fee2e2;
        --accent:#2b3a8f; --submit:#1a8a4a; --submit-2:#157a40;
      }
      *{box-sizing:border-box}
      body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
      .shell{max-width:1080px;margin:0 auto;padding:16px 16px 60px}
      .topbar{background:#fff;border:1px solid var(--border);border-radius:12px 12px 0 0;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
      .topbar .examname{font-weight:700}
      .topbar .examname span{color:var(--primary)}
      .loggedas{background:#fde68a;padding:3px 10px;border-radius:6px;font-size:.82rem;font-weight:700}
      .toolbar{background:#fff;border-left:1px solid var(--border);border-right:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
      .navbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center}
      .navbtn:disabled{opacity:.4;cursor:not-allowed}
      .qcounter{font-weight:700;font-size:1.02rem;margin-right:6px}
      .bookmarkbtn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 14px;font-size:.88rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
      .bookmarkbtn.active{background:#fef3c7;border-color:#f59e0b;color:#92400e}
      .spacer{flex:1}
      .timer{font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:6px}
      .timer.low{color:var(--bad)}
      .timer.ok{color:#374151}
      .pausebtn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:9px 14px;font-size:.88rem;font-weight:600;cursor:pointer}
      .submitbtn{background:var(--submit);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:.9rem;font-weight:700;cursor:pointer}
      .submitbtn:hover{background:var(--submit-2)}
      .filterbar{background:#fff;border-left:1px solid var(--border);border-right:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:16px;font-size:.9rem}
      .filterbar label{display:flex;align-items:center;gap:5px;cursor:pointer}
      .gridwrap{background:#fff;border-left:1px solid var(--border);border-right:1px solid var(--border);padding:14px 20px;max-height:150px;overflow-y:auto}
      .grid{display:flex;flex-wrap:wrap;gap:8px}
      .gridnum{width:42px;height:34px;border-radius:6px;border:1px solid var(--border);background:#fff;font-size:.85rem;font-weight:700;cursor:pointer;color:var(--ink);position:relative}
      .gridnum.current{background:var(--primary);color:#fff;border-color:var(--primary)}
      .gridnum.answered:not(.current){background:#e7ebfd;border-color:#c7d0f5}
      .gridnum.locked{opacity:.35;cursor:not-allowed;background:#f3f4f6}
      .gridnum.bookmarked::after{content:'';position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:#f59e0b}
      .main{background:#fff;border:1px solid var(--border);border-top:none;border-radius:0 0 12px 12px;padding:24px 20px 20px}
      .qtext{font-weight:700;font-size:1.05rem;margin-bottom:18px}
      .opt{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px;cursor:pointer}
      .opt:hover{border-color:var(--accent)}
      .opt.answered{background:#eef1ff;border-color:var(--primary)}
      .opt input{margin-top:3px;flex-shrink:0}
      .footer-actions{margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
      .btn{display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:12px 22px;font-size:1rem;font-weight:600;cursor:pointer}
      .btn:hover{background:var(--primary-2)}
      .btn:disabled{background:#9ca3af;cursor:not-allowed}
      .btn.secondary{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
      .btn.secondary:hover{background:#eef2f7}
      .btn.gray{background:#f3f4f6;color:#374151;border:1px solid var(--border)}
      .btn.gray:hover{background:#e5e7eb}
      .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
      h1{font-size:1.4rem;margin:0 0 4px}
      .sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
      .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0 22px}
      .stat-box{border:1px solid var(--border);border-radius:12px;padding:16px}
      .stat-box .num{font-size:1.8rem;font-weight:700}
      .stat-box .label{color:var(--muted);font-size:.85rem}
      .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:700}
      .pill.good{background:var(--good-bg);color:var(--good)}
      .pill.bad{background:var(--bad-bg);color:var(--bad)}
      .review-list{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
      .review-chip{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:#fff}
      .review-chip.ok{background:var(--good)}
      .review-chip.no{background:var(--bad)}
      .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
      .bar-label{width:250px;flex-shrink:0;font-size:.85rem;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .bar-track{flex:1;height:16px;background:var(--border);border-radius:999px;overflow:hidden}
      .bar-fill{height:100%;border-radius:999px}
      .bar-pct{width:110px;flex-shrink:0;font-size:.82rem;color:var(--muted);text-align:right}
      .section-title{font-size:.95rem;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.03em;margin:22px 0 10px}
      ul.plain{margin:0;padding-left:0;list-style:none}
      ul.plain li{padding:8px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;font-size:.92rem}
      ul.plain li:last-child{border-bottom:none}
      .overlay-note{background:#eef1ff;border:1px solid #c7d0f5;color:#2b3a8f;border-radius:10px;padding:10px 14px;font-size:.85rem;margin-bottom:18px}
    </style>
  </head>

    <script type="application/json" id="questions-data">[{"id": 1, "text": "1. Qual é a primeira ação que a InovaTech deve tomar para entender seu contexto, de acordo com a ISO 27001:2022?", "options": [{"id": "a", "text": "a) Realizar uma auditoria interna completa dos sistemas de TI."}, {"id": "b", "text": "b) Determinar as questões internas e externas relevantes para seu propósito e que afetam sua capacidade de alcançar os resultados pretendidos do SGSI."}, {"id": "c", "text": "c) Contratar um profissional de segurança da informação sênior para gerenciar todos os aspectos."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 2, "text": "2. Além de clientes e funcionários, quais outros grupos a DataSecure Corp deve considerar ao determinar as necessidades e expectativas das partes interessadas, conforme a norma?", "options": [{"id": "a", "text": "a) Apenas acionistas e concorrentes diretos."}, {"id": "b", "text": "b) Apenas fornecedores e reguladores."}, {"id": "c", "text": "c) Qualquer parte que possa ser afetada ou que possa afetar o SGSI, incluindo requisitos legais e regulamentares."}], "correct_option": "c", "domain": "", "theme": "organizacional"}, {"id": 3, "text": "3. Ao determinar o escopo do SGSI, o que a GlobalConnect deve considerar, de acordo com a ISO 27001:2022?", "options": [{"id": "a", "text": "a) Apenas as tecnologias de segurança da informação que serão implementadas."}, {"id": "b", "text": "b) As questões internas e externas, os requisitos das partes interessadas, e as interfaces e dependências entre as atividades."}, {"id": "c", "text": "c) Somente o custo de implementação e os benefícios financeiros esperados."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 4, "text": "4. Qual é uma das responsabilidades cruciais da Alta Direção da AlphaBank em relação ao SGSI, conforme a ISO 27001:2022?", "options": [{"id": "a", "text": "a) Apenas fornecer o orçamento para a equipe de TI."}, {"id": "b", "text": "b) Assegurar que a política de segurança da informação e os objetivos sejam estabelecidos e compatíveis com a direção estratégica da organização."}, {"id": "c", "text": "c) Realizar todas as avaliações de risco pessoalmente."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 5, "text": "5. O que a política de segurança da informação da TechSolutions deve incluir para estar em conformidade com a ISO 27001:2022?", "options": [{"id": "a", "text": "a) Apenas uma lista de softwares de segurança a serem utilizados."}, {"id": "b", "text": "b) Os objetivos de segurança da informação ou a estrutura para estabelecê-los, e o comprometimento com a melhoria contínua."}, {"id": "c", "text": "c) Uma descrição detalhada de cada incidente de segurança ocorrido nos últimos cinco anos."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 6, "text": "6. O que a Alta Direção da SecureLogistics deve fazer em relação aos papéis, responsabilidades e autoridades organizacionais para a segurança da informação?", "options": [{"id": "a", "text": "a) Manter as responsabilidades em segredo para evitar sobrecarga de informações."}, {"id": "b", "text": "b) Assegurar que as responsabilidades e autoridades dos papéis relevantes para a segurança da informação sejam atribuídas e comunicadas dentro da organização."}, {"id": "c", "text": "c) Contratar consultores externos para assumir todas as responsabilidades."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 7, "text": "7. Ao planejar ações para abordar riscos e oportunidades, qual é o objetivo da CyberDefenders, de acordo com a ISO 27001:2022?", "options": [{"id": "a", "text": "a) Apenas cumprir os requisitos legais mínimos."}, {"id": "b", "text": "b) Assegurar que o SGSI possa alcançar seus resultados pretendidos, prevenir ou reduzir efeitos indesejados, e alcançar a melhoria contínua."}, {"id": "c", "text": "c) Eliminar completamente todos os riscos de segurança da informação."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 8, "text": "8. O que a InfoGuard deve estabelecer e manter como parte de seu processo de avaliação de riscos de segurança da informação?", "options": [{"id": "a", "text": "a) Apenas uma lista de ferramentas de avaliação de risco."}, {"id": "b", "text": "b) Uma lista de controles de segurança que já estão implementados."}, {"id": "c", "text": "c) Critérios de risco de segurança da informação, incluindo critérios de aceitação do risco."}], "correct_option": "c", "domain": "", "theme": "organizacional"}, {"id": 9, "text": "9. Como a NetProtect deve abordar o tratamento de riscos da segurança da informação, conforme a ISO 27001:2022?", "options": [{"id": "a", "text": "a) Selecionar aleatoriamente controles do Anexo A."}, {"id": "b", "text": "b) Selecionar, de forma apropriada, as opções de tratamento de riscos e determinar todos os controles necessários, comparando-os com o Anexo A."}, {"id": "c", "text": "c) Implementar apenas os controles que não exigem investimento financeiro."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 10, "text": "10. Quais são as características que os objetivos de segurança da informação da SecureData devem ter, de acordo com a ISO 27001:2022?", "options": [{"id": "a", "text": "a) Ser secretos e imutáveis."}, {"id": "b", "text": "b) Ser consistentes com a política, mensuráveis (quando aplicável), levar em conta os requisitos aplicáveis, ser monitorados, comunicados e atualizados."}, {"id": "c", "text": "c) Ser vagos para permitir flexibilidade."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 11, "text": "11. O que a DigitalFortress deve fazer ao determinar a necessidade de mudanças em seu SGSI?", "options": [{"id": "a", "text": "a) Implementar as mudanças imediatamente, sem planejamento formal."}, {"id": "b", "text": "b) Conduzir as mudanças de uma forma planejada."}, {"id": "c", "text": "c) Adiar as mudanças indefinidamente para evitar interrupções."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 12, "text": "12. O que a CyberCorp deve determinar e prover para seu SGSI, de acordo com a ISO 27001:2022?", "options": [{"id": "a", "text": "a) Apenas documentos e registros."}, {"id": "b", "text": "b) Os recursos necessários para estabelecer, implementar, manter e melhorar continuamente o SGSI."}, {"id": "c", "text": "c) Unicamente a política de segurança da informação."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 13, "text": "13. Em relação à competência, o que a SafeSystems deve assegurar para as pessoas que realizam trabalho sob seu controle que afete o desempenho da segurança da informação?", "options": [{"id": "a", "text": "a) Que todos os funcionários sejam especialistas em segurança cibernética."}, {"id": "b", "text": "b) Que essas pessoas são competentes, com base em educação, treinamento ou experiência apropriados, e reter informação documentada como evidência."}, {"id": "c", "text": "c) Apenas que assinem um termo de responsabilidade."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 14, "text": "14. O que a InfoProtect Solutions deve garantir em relação à conscientização das pessoas que realizam trabalho sob o controle da organização?", "options": [{"id": "a", "text": "a) Que apenas a alta direção esteja ciente da política."}, {"id": "b", "text": "b) Que as pessoas estejam cientes da política de segurança da informação, suas contribuições para a eficácia do SGSI e as implicações da não conformidade."}, {"id": "c", "text": "c) Que a conscientização seja um evento anual sem acompanhamento."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 15, "text": "15. O que a SecureComm deve determinar em relação às comunicações internas e externas relevantes para o SGSI?", "options": [{"id": "a", "text": "a) Apenas com quem comunicar."}, {"id": "b", "text": "b) O que, quando, com quem e como comunicar."}, {"id": "c", "text": "c) Apenas que a comunicação seja feita por e-mail."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 16, "text": "16. Ao criar e atualizar a informação documentada, o que a DocuSecure deve assegurar, de acordo com a ISO 27001:2022?", "options": [{"id": "a", "text": "a) Apenas que a informação documentada seja impressa."}, {"id": "b", "text": "b) Identificação e descrição, formato e meio, e análise crítica e aprovação para pertinência e adequação."}, {"id": "c", "text": "c) Que a informação documentada seja acessível apenas por uma pessoa."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 17, "text": "17. O que a ArchivSafe deve fazer para controlar a informação documentada requerida pelo SGSI e pela norma?", "options": [{"id": "a", "text": "a) Apenas arquivar tudo em formato digital sem backups."}, {"id": "b", "text": "b) Assegurar que esteja disponível, adequada para o uso, protegida adequadamente, e considerar atividades como distribuição, armazenamento, controle de mudanças e retenção."}, {"id": "c", "text": "c) Descartar informações antigas sem registro."}], "correct_option": "b", "domain": "", "theme": "tecnologico"}, {"id": 18, "text": "18. O que a ProcesSafe deve fazer ao planejar, implementar e controlar os processos necessários para atender aos requisitos e implementar as ações determinadas na Seção 6?", "options": [{"id": "a", "text": "a) Ignorar os critérios estabelecidos para os processos."}, {"id": "b", "text": "b) Estabelecer critérios para os processos e implementar controles dos processos de acordo com os critérios, disponibilizando informação documentada."}, {"id": "c", "text": "c) Apenas focar na documentação dos procedimentos."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 19, "text": "19. Quando a RiskFlow deve realizar avaliações de riscos da segurança da informação?", "options": [{"id": "a", "text": "a) Apenas uma vez por ano, independentemente das mudanças."}, {"id": "b", "text": "b) A intervalos planejados, ou quando mudanças significativas forem propostas ou ocorrerem, levando em conta os critérios estabelecidos."}, {"id": "c", "text": "c) Somente após a ocorrência de um incidente de segurança."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 20, "text": "20. O que a ActionSecure deve fazer após a elaboração do plano de tratamento de riscos da segurança da informação?", "options": [{"id": "a", "text": "a) Arquivar o plano e esperar por uma auditoria."}, {"id": "b", "text": "b) Implementar o plano de tratamento de riscos da segurança da informação e reter informação documentada dos resultados."}, {"id": "c", "text": "c) Delegar a implementação para uma equipe não envolvida na elaboração do plano."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 21, "text": "21. O que a MeasureUp deve determinar para o monitoramento, medição, análise e avaliação do SGSI?", "options": [{"id": "a", "text": "a) Apenas quem deve monitorar."}, {"id": "b", "text": "b) O que precisa ser monitorado e medido (incluindo controles e processos), os métodos, quando, quem e quando analisar e avaliar os resultados."}, {"id": "c", "text": "c) Métodos de medição baseados em suposições, sem evidências."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 22, "text": "22. O que a AuditGuard deve fazer em relação às auditorias internas, de acordo com a ISO 27001:2022?", "options": [{"id": "a", "text": "a) Conduzir auditorias apenas quando houver não conformidades graves."}, {"id": "b", "text": "b) Planejar, estabelecer, implementar e manter programa(s) de auditoria, incluindo frequência, métodos, responsabilidades, requisitos de planejamento e relato."}, {"id": "c", "text": "c) Contratar auditorias externas para substituir as auditorias internas."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 23, "text": "23. O que a análise crítica pela Direção da ReviewPro deve incluir como entradas, conforme a ISO 27001:2022?", "options": [{"id": "a", "text": "a) Apenas os resultados das auditorias internas bem-sucedidas."}, {"id": "b", "text": "b) A situação das ações de análises críticas anteriores, mudanças nas questões internas/externas, feedback sobre o desempenho da segurança da informação, resultados da avaliação de riscos, e oportunidades para melhoria contínua."}, {"id": "c", "text": "c) Somente informações sobre novas tecnologias no mercado."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 24, "text": "24. O que os resultados da análise crítica pela Direção da ImprovePath devem incluir e como devem ser tratados?", "options": [{"id": "a", "text": "a) Apenas uma lista de problemas identificados."}, {"id": "b", "text": "b) Decisões relativas às oportunidades para melhoria contínua e necessidades de mudanças do SGSI, e devem ser disponibilizadas como informação documentada."}, {"id": "c", "text": "c) Recomendações que não precisam ser documentadas."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 25, "text": "25. O que a ContinuousFlow deve fazer em relação à melhoria de seu SGSI?", "options": [{"id": "a", "text": "a) Considerar o SGSI como um projeto de conclusão única."}, {"id": "b", "text": "b) Melhorar continuamente a pertinência, a adequação e a eficácia do SGSI."}, {"id": "c", "text": "c) Apenas corrigir falhas quando elas ocorrerem."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 26, "text": "26. Quando uma não conformidade ocorre, o que a CorrectiveAction deve fazer, de acordo com a ISO 27001:2022?", "options": [{"id": "a", "text": "a) Apenas documentar a não conformidade e ignorá-la."}, {"id": "b", "text": "b) Reagir à não conformidade, tomar ações para controlá-la e corrigi-la, lidar com as consequências e avaliar a necessidade de ações para eliminar as causas."}, {"id": "c", "text": "c) Atribuir a culpa a um indivíduo."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 27, "text": "27. Em relação às políticas de segurança da informação (Controle A.5.1), o que a PolicyGuard deve fazer?", "options": [{"id": "a", "text": "a) Apenas criar um rascunho da política e armazená-lo."}, {"id": "b", "text": "b) Definir, aprovar pela direção, publicar, comunicar, e analisar criticamente em intervalos planejados e quando ocorrerem mudanças significativas."}, {"id": "c", "text": "c) Delegar a aprovação da política a um estagiário."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 28, "text": "28. O que a RoleClarity deve fazer em relação aos papéis e responsabilidades pela segurança da informação (Controle A.5.2)?", "options": [{"id": "a", "text": "a) Evitar definir papéis específicos para manter a flexibilidade."}, {"id": "b", "text": "b) Definir e alocar papéis e responsabilidades pela segurança da informação de acordo com as necessidades da organização."}, {"id": "c", "text": "c) Permitir que cada funcionário defina suas próprias responsabilidades de segurança."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 29, "text": "29. Para evitar esse risco, o que a FunctionSegregation deve implementar (Controle A.5.3)?", "options": [{"id": "a", "text": "a) Mais treinamento para o funcionário."}, {"id": "b", "text": "b) Segregação de funções, onde funções conflitantes e áreas de responsabilidade devem ser segregadas."}, {"id": "c", "text": "c) Uma auditoria anual focada apenas nos sistemas."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 30, "text": "30. O que a direção da LeadershipCommitment deve fazer para demonstrar sua responsabilidade (Controle A.5.4)?", "options": [{"id": "a", "text": "a) Ignorar o comportamento dos funcionários, pois a segurança é responsabilidade da equipe de TI."}, {"id": "b", "text": "b) Requerer que todo o pessoal aplique a segurança da informação de acordo com a política e os procedimentos da organização."}, {"id": "c", "text": "c) Apenas distribuir a política por e-mail e não cobrar a leitura."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 31, "text": "31. Qual controle organizacional (Controle A.5.5) a AuthorityConnect precisa implementar?", "options": [{"id": "a", "text": "a) Fortalecer os controles internos de firewall."}, {"id": "b", "text": "b) Estabelecer e manter contato com as autoridades relevantes."}, {"id": "c", "text": "c) Aumentar o número de reuniões internas."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 32, "text": "32. Qual é a recomendação da ISO 27001:2022 (Controle A.5.6) para a CommunityEngage?", "options": [{"id": "a", "text": "a) Limitar o contato externo para proteger informações confidenciais."}, {"id": "b", "text": "b) Estabelecer e manter contato com grupos de interesse especial ou com outros fóruns de especialistas em segurança e associações profissionais."}, {"id": "c", "text": "c) Contratar mais consultores externos para todas as necessidades de segurança."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 33, "text": "33. Qual controle a ThreatIntel Corp deve implementar para melhorar sua postura de segurança (Controle A.5.7)?", "options": [{"id": "a", "text": "a) Instalar um antivírus em todas as máquinas."}, {"id": "b", "text": "b) Coletar e analisar informações relacionadas a ameaças à segurança da informação para produzir inteligência de ameaças."}, {"id": "c", "text": "c) Treinar os funcionários para identificar e-mails de phishing."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 34, "text": "34. O que a ProjectSecure deveria ter feito, de acordo com a ISO 27001:2022 (Controle A.5.8)?", "options": [{"id": "a", "text": "a) Adicionar a segurança como uma etapa final do projeto."}, {"id": "b", "text": "b) Integrar a segurança da informação ao gerenciamento de projetos."}, {"id": "c", "text": "c) Contratar uma equipe de testes de penetração apenas no final do ciclo de desenvolvimento."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 35, "text": "35. Qual controle a AssetInventory deve implementar para resolver essa questão (Controle A.5.9)?", "options": [{"id": "a", "text": "a) Comprar mais ativos de TI."}, {"id": "b", "text": "b) Desenvolver e manter um inventário de informações e outros ativos associados, incluindo proprietários."}, {"id": "c", "text": "c) Contar com a memória dos funcionários para saber onde os ativos estão."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 36, "text": "36. O que a AcceptableUse precisa estabelecer para controlar o uso de informações e ativos (Controle A.5.10)?", "options": [{"id": "a", "text": "a) Bloquear todos os sites da internet."}, {"id": "b", "text": "b) Identificar, documentar e implementar regras para o uso aceitável e procedimentos para o manuseio de informações e outros ativos associados."}, {"id": "c", "text": "c) Implementar um sistema de monitoramento constante sem notificar os funcionários."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 37, "text": "37. Qual é a exigência da norma (Controle A.5.11) para a AssetReturn neste caso?", "options": [{"id": "a", "text": "a) Apenas confiar na boa-fé do ex-funcionário."}, {"id": "b", "text": "b) Que o pessoal e outras partes interessadas, conforme apropriado, devolvam todos os ativos da organização em sua posse após a mudança ou o encerramento da contratação ou acordo."}, {"id": "c", "text": "c) Enviar um lembrete por e-mail após um mês."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 38, "text": "38. O que a DataClassification deve fazer em relação às suas informações (Controle A.5.12)?", "options": [{"id": "a", "text": "a) Tratar todas as informações como altamente confidenciais."}, {"id": "b", "text": "b) Classificar as informações de acordo com as necessidades de segurança da informação da organização, com base na confidencialidade, integridade, disponibilidade e requisitos das partes interessadas relevantes."}, {"id": "c", "text": "c) Apenas criptografar todos os dados, independentemente de sua sensibilidade."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 39, "text": "39. O que a LabelingPro deve desenvolver e implementar para suas informações (Controle A.5.13)?", "options": [{"id": "a", "text": "a) Um sistema de controle de acesso complexo."}, {"id": "b", "text": "b) Um conjunto adequado de procedimentos para rotulagem de informações de acordo com o esquema de classificação de informações adotado."}, {"id": "c", "text": "c) Um sistema de auditoria externa para verificar a classificação."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 40, "text": "40. O que a TransferSecure deve implementar para gerenciar a transferência de informações (Controle A.5.14)?", "options": [{"id": "a", "text": "a) Apenas usar e-mail criptografado para todas as transferências."}, {"id": "b", "text": "b) Regras, procedimentos ou acordos de transferência de informações para todos os tipos de recursos de transferência dentro da organização e entre a organização e outras partes."}, {"id": "c", "text": "c) Permitir que cada departamento use seu próprio método de transferência."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 41, "text": "41. O que a AccessControl Corp deve fazer em relação ao controle de acesso (Controle A.5.15)?", "options": [{"id": "a", "text": "a) Remover todos os controles de acesso para facilitar o trabalho."}, {"id": "b", "text": "b) Estabelecer e implementar regras para controlar o acesso físico e lógico às informações e a outros ativos associados com base nos requisitos de segurança da informação e de negócios."}, {"id": "c", "text": "c) Contratar seguranças para monitorar o acesso físico apenas."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 42, "text": "42. O que a IdentityManage deve gerenciar para garantir a segurança (Controle A.5.16)?", "options": [{"id": "a", "text": "a) Apenas a criação de novas identidades."}, {"id": "b", "text": "b) O ciclo de vida completo das identidades."}, {"id": "c", "text": "c) O número total de identidades ativas."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 43, "text": "43. O que a AuthInfo deve controlar em relação às informações de autenticação (Controle A.5.17)?", "options": [{"id": "a", "text": "a) Apenas a complexidade das senhas."}, {"id": "b", "text": "b) A alocação e a gestão de informações de autenticação por uma gestão de processo, incluindo aconselhar o pessoal sobre o manuseio adequado."}, {"id": "c", "text": "c) A frequência de redefinição de senhas para cada funcionário."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 44, "text": "44. O que a RightsAccess deve fazer em relação aos direitos de acesso (Controle A.5.18)?", "options": [{"id": "a", "text": "a) Apenas revogar todos os direitos de acesso anualmente."}, {"id": "b", "text": "b) Provisionar, analisar criticamente, modificar e remover direitos de acesso às informações e a outros ativos associados de acordo com a política e as regras da organização para o controle de acesso."}, {"id": "c", "text": "c) Permitir que os usuários solicitem seus próprios direitos de acesso."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 45, "text": "45. O que a SupplierSecure deve definir e implementar em relação aos fornecedores (Controle A.5.19)?", "options": [{"id": "a", "text": "a) Apenas um contrato padrão para todos os fornecedores."}, {"id": "b", "text": "b) Processos e procedimentos para gerenciar a segurança da informação e os riscos associados com o uso dos produtos ou serviços dos fornecedores."}, {"id": "c", "text": "c) Um processo de auditoria de fornecedores somente após um incidente."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 46, "text": "46. O que a ContractSecure deve fazer em relação aos contratos de fornecedores (Controle A.5.20)?", "options": [{"id": "a", "text": "a) Assumir que os fornecedores já têm seus próprios controles de segurança."}, {"id": "b", "text": "b) Estabelecer e acordar requisitos relevantes de segurança da informação com cada fornecedor, com base no tipo de relacionamento."}, {"id": "c", "text": "c) Apenas incluir uma cláusula genérica de conformidade com a lei."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 47, "text": "47. O que a SupplyChainProtect deve definir e implementar para gerenciar esses riscos (Controle A.5.21)?", "options": [{"id": "a", "text": "a) Um sistema de inventário de hardware."}, {"id": "b", "text": "b) Processos e procedimentos para gerenciar os riscos da segurança da informação associados à cadeia de fornecimento de produtos e serviços de TIC."}, {"id": "c", "text": "c) Limitar o número de fornecedores de TIC."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 48, "text": "48. O que a VendorMonitor deve fazer em relação aos serviços de fornecedores (Controle A.5.22)?", "options": [{"id": "a", "text": "a) Confiar que os fornecedores manterão altos padrões de segurança por conta própria."}, {"id": "b", "text": "b) Monitorar, analisar criticamente, avaliar e gerenciar regularmente a mudança nas práticas da segurança da informação dos fornecedores e na prestação de serviços."}, {"id": "c", "text": "c) Apenas realizar uma avaliação inicial do fornecedor."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 49, "text": "49. O que a CloudSecure deve estabelecer em relação ao uso de serviços em nuvem (Controle A.5.23)?", "options": [{"id": "a", "text": "a) Apenas os custos e benefícios financeiros da migração."}, {"id": "b", "text": "b) Processos de aquisição, uso, gestão e saída de serviços em nuvem de acordo com os requisitos da segurança da informação da organização."}, {"id": "c", "text": "c) Apenas selecionar os maiores provedores de nuvem."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 50, "text": "50. O que a IncidentReady deve fazer para se preparar para incidentes de segurança da informação (Controle A.5.24)?", "options": [{"id": "a", "text": "a) Apenas reagir aos incidentes quando eles ocorrerem."}, {"id": "b", "text": "b) Planejar e se preparar para gerenciar incidentes da segurança da informação, definindo, estabelecendo e comunicando processos, papéis e responsabilidades."}, {"id": "c", "text": "c) Contratar um profissional de resposta a incidentes apenas após um ataque."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 51, "text": "51. O que a EventEvaluate deve fazer em relação aos eventos de segurança da informação (Controle A.5.25)?", "options": [{"id": "a", "text": "a) Considerar todos os eventos como incidentes de segurança."}, {"id": "b", "text": "b) Avaliar os eventos da segurança da informação e decidir se categoriza como incidentes da segurança da informação."}, {"id": "c", "text": "c) Ignorar eventos menores."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 52, "text": "52. Como a ResponseAction deve responder a incidentes da segurança da informação (Controle A.5.26)?", "options": [{"id": "a", "text": "a) De forma ad-hoc, dependendo da situação."}, {"id": "b", "text": "b) De acordo com os procedimentos documentados."}, {"id": "c", "text": "c) Apenas com base na experiência individual dos membros da equipe."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 53, "text": "53. Qual controle (A.5.27) a LessonLearn deve implementar após incidentes de segurança da informação?", "options": [{"id": "a", "text": "a) Apenas documentar o incidente."}, {"id": "b", "text": "b) Usar o conhecimento adquirido com incidentes de segurança da informação para fortalecer e melhorar os controles da segurança da informação."}, {"id": "c", "text": "c) Esquecer o incidente e seguir em frente."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 54, "text": "54. O que a EvidenceCollect deve estabelecer e implementar para lidar com eventos de segurança da informação (Controle A.5.28)?", "options": [{"id": "a", "text": "a) Um sistema de monitoramento de câmeras de segurança."}, {"id": "b", "text": "b) Procedimentos para identificação, coleta, aquisição e preservação de evidências relacionadas a eventos da segurança da informação."}, {"id": "c", "text": "c) Apenas confiar em logs de sistema."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 55, "text": "55. O que a DisruptionSecure deve planejar (Controle A.5.29) para garantir a segurança durante a disrupção?", "options": [{"id": "a", "text": "a) Apenas focar na recuperação de dados."}, {"id": "b", "text": "b) Como manter a segurança da informação em um nível apropriado durante a disrupção."}, {"id": "c", "text": "c) Desligar todos os sistemas para evitar danos adicionais."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 56, "text": "56. O que a TIContReady deve fazer em relação à prontidão de TIC para continuidade de negócios (Controle A.5.30)?", "options": [{"id": "a", "text": "a) Apenas ter um backup de dados."}, {"id": "b", "text": "b) Planejar, implementar, manter e testar a prontidão de TIC com base nos objetivos de continuidade de negócios e nos requisitos de continuidade da TIC."}, {"id": "c", "text": "c) Assumir que o plano de continuidade de negócios funcionará sem testes."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 57, "text": "57. O que a ComplianceCheck deve fazer em relação a esses requisitos (Controle A.5.31)?", "options": [{"id": "a", "text": "a) Apenas cumprir as leis mais óbvias."}, {"id": "b", "text": "b) Identificar, documentar e atualizar os requisitos legais, estatutários, regulamentares e contratuais pertinentes à segurança da informação e à abordagem da organização para atender a esses requisitos."}, {"id": "c", "text": "c) Contratar advogados apenas quando surgir um problema legal."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 58, "text": "58. O que a IPProtect deve implementar (Controle A.5.32) para proteger seus direitos de propriedade intelectual?", "options": [{"id": "a", "text": "a) Apenas registrar patentes."}, {"id": "b", "text": "b) Procedimentos adequados para proteger os direitos de propriedade intelectual."}, {"id": "c", "text": "c) Compartilhar a propriedade intelectual livremente para promover a inovação."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 59, "text": "59. Como a RecordSafe deve proteger seus registros (Controle A.5.33)?", "options": [{"id": "a", "text": "a) Apenas fazer cópias de segurança de todos os registros."}, {"id": "b", "text": "b) Proteger os registros contra perdas, destruição, falsificação, acesso não autorizado e liberação não autorizada."}, {"id": "c", "text": "c) Armazenar todos os registros em papel para evitar ataques cibernéticos."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 60, "text": "60. O que a PrivacyProtect deve fazer em relação à privacidade e proteção de DP (Dados Pessoais) (Controle A.5.34)?", "options": [{"id": "a", "text": "a) Apenas obter o consentimento dos indivíduos."}, {"id": "b", "text": "b) Identificar e atender aos requisitos relativos à preservação da privacidade e à proteção de DP, de acordo com as leis e os regulamentos aplicáveis e requisitos contratuais."}, {"id": "c", "text": "c) Minimizar a coleta de dados pessoais sempre que possível."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 61, "text": "61. O que a ReviewIndep deve fazer em relação à análise crítica independente da segurança da informação (Controle A.5.35)?", "options": [{"id": "a", "text": "a) Apenas realizar auditorias internas."}, {"id": "b", "text": "b) Analisar criticamente, de forma independente, a abordagem da organização para gerenciar a segurança da informação e sua implementação, a intervalos planejados ou quando ocorrerem mudanças significativas."}, {"id": "c", "text": "c) Deixar a análise crítica para a equipe de segurança."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 62, "text": "62. O que a PolicyCompliance deve fazer em relação ao compliance com políticas, regras e normas para segurança da informação (Controle A.5.36)?", "options": [{"id": "a", "text": "a) Assumir que as políticas serão seguidas."}, {"id": "b", "text": "b) Analisar criticamente o compliance da política de segurança da informação da organização, políticas, regras e normas de temas específicos a intervalos regulares."}, {"id": "c", "text": "c) Apenas informar os funcionários sobre as políticas."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 63, "text": "63. O que a DocuProcedures deve fazer para seus procedimentos de operação (Controle A.5.37)?", "options": [{"id": "a", "text": "a) Apenas treinar os funcionários verbalmente."}, {"id": "b", "text": "b) Documentar os procedimentos de operação dos recursos de tratamento da informação e disponibilizá-los para o pessoal que necessite deles."}, {"id": "c", "text": "c) Criar procedimentos apenas para novas funcionalidades."}], "correct_option": "b", "domain": "", "theme": "organizacional"}, {"id": 64, "text": "64. O que a RecruitSecure deve fazer em relação à seleção de pessoal (Controle A.6.1)?", "options": [{"id": "a", "text": "a) Apenas verificar o currículo dos candidatos."}, {"id": "b", "text": "b) Realizar verificações de antecedentes de todos os candidatos a serem contratados antes de ingressarem na organização e de modo contínuo, de acordo com as leis, os regulamentos e a ética aplicáveis."}, {"id": "c", "text": "c) Contratar com base apenas na experiência profissional."}], "correct_option": "b", "domain": "", "theme": "pessoas"}, {"id": 65, "text": "65. O que a ContractTerms deve fazer em relação aos termos e condições de contratação (Controle A.6.2)?", "options": [{"id": "a", "text": "a) Apenas ter um contrato de trabalho genérico."}, {"id": "b", "text": "b) Declarar as responsabilidades do pessoal e da organização para a segurança da informação nos contratos trabalhistas."}, {"id": "c", "text": "c) Confiar em acordos verbais com os funcionários."}], "correct_option": "b", "domain": "", "theme": "pessoas"}, {"id": 66, "text": "66. O que a AwarenessTrain deve garantir em relação à conscientização, educação e treinamento em segurança da informação (Controle A.6.3)?", "options": [{"id": "a", "text": "a) Que o treinamento seja opcional."}, {"id": "b", "text": "b) Que o pessoal da organização e partes interessadas relevantes recebam treinamento, educação e conscientização apropriados e atualizações regulares da política e dos procedimentos, pertinentes para suas funções."}, {"id": "c", "text": "c) Apenas que a equipe de TI participe de treinamentos avançados."}], "correct_option": "b", "domain": "", "theme": "pessoas"}, {"id": 67, "text": "67. O que a DisciplineProcess deve fazer em relação ao processo disciplinar (Controle A.6.4)?", "options": [{"id": "a", "text": "a) Demitir o funcionário imediatamente sem processo."}, {"id": "b", "text": "b) Formalizar e comunicar um processo disciplinar para tomar ações contra pessoal e outras partes interessadas relevantes que tenham cometido uma violação da política da segurança da informação."}, {"id": "c", "text": "c) Ignorar a violação para evitar conflitos."}], "correct_option": "b", "domain": "", "theme": "pessoas"}, {"id": 68, "text": "68. O que a PostEmployment deve definir e comunicar em relação às responsabilidades após encerramento ou mudança da contratação (Controle A.6.5)?", "options": [{"id": "a", "text": "a) Apenas desconectar o acesso do funcionário."}, {"id": "b", "text": "b) As responsabilidades e funções de segurança da informação que permaneçam válidas após o encerramento ou a mudança da contratação devem ser definidas, aplicadas e comunicadas ao pessoal e a outras partes interessadas pertinentes."}, {"id": "c", "text": "c) Deixar para o departamento jurídico lidar com quaisquer problemas futuros."}], "correct_option": "b", "domain": "", "theme": "pessoas"}, {"id": 69, "text": "69. O que a NDAImplement deve fazer em relação aos acordos de confidencialidade ou não divulgação (Controle A.6.6)?", "options": [{"id": "a", "text": "a) Apenas confiar na palavra das partes envolvidas."}, {"id": "b", "text": "b) Identificar, documentar, analisar criticamente em intervalos regulares e assinar acordos de confidencialidade ou não divulgação que reflitam as necessidades da organização para a proteção das informações."}, {"id": "c", "text": "c) Usar NDAs apenas para informações altamente secretas."}], "correct_option": "b", "domain": "", "theme": "pessoas"}, {"id": 70, "text": "70. O que a RemoteWorkSecure deve implementar para o trabalho remoto (Controle A.6.7)?", "options": [{"id": "a", "text": "a) Apenas fornecer laptops corporativos."}, {"id": "b", "text": "b) Medidas de segurança para proteger as informações acessadas, tratadas ou armazenadas fora das instalações da organização."}, {"id": "c", "text": "c) Deixar a segurança do ambiente remoto a cargo do funcionário."}], "correct_option": "b", "domain": "", "theme": "pessoas"}, {"id": 71, "text": "71. O que a EventReport deve fornecer (Controle A.6.8) para o relato de eventos de segurança da informação?", "options": [{"id": "a", "text": "a) Um canal de comunicação apenas para a alta direção."}, {"id": "b", "text": "b) Um mecanismo para que as pessoas relatem eventos da segurança da informação observados ou suspeitos por meio de canais apropriados em tempo hábil."}, {"id": "c", "text": "c) Um sistema de recompensa por relatar incidentes."}], "correct_option": "b", "domain": "", "theme": "pessoas"}, {"id": 72, "text": "72. O que a PhysicalPerimeters deve fazer em relação aos perímetros de segurança física (Controle A.7.1)?", "options": [{"id": "a", "text": "a) Apenas instalar câmeras de segurança na entrada principal."}, {"id": "b", "text": "b) Definir e usar perímetros de segurança para proteger áreas que contenham informações e outros ativos associados."}, {"id": "c", "text": "c) Permitir acesso irrestrito para facilitar a movimentação."}], "correct_option": "b", "domain": "", "theme": "fisico"}, {"id": 73, "text": "73. O que a EntryControl deve fazer em relação à entrada física (Controle A.7.2)?", "options": [{"id": "a", "text": "a) Apenas usar crachás de identificação sem controle de acesso."}, {"id": "b", "text": "b) Proteger as áreas seguras por controles de entrada e pontos de acesso apropriados."}, {"id": "c", "text": "c) Contar com a vigilância manual de seguranças."}], "correct_option": "b", "domain": "", "theme": "fisico"}, {"id": 74, "text": "74. O que a OfficeSecurity deve fazer em relação à segurança de escritórios, salas e instalações (Controle A.7.3)?", "options": [{"id": "a", "text": "a) Apenas trancar as portas ao final do dia."}, {"id": "b", "text": "b) Projetar e implementar segurança física para escritórios, salas e instalações."}, {"id": "c", "text": "c) Instalar alarmes sem um sistema de resposta."}], "correct_option": "b", "domain": "", "theme": "fisico"}, {"id": 75, "text": "75. O que a PhysicalMonitor deve fazer (Controle A.7.4) para proteger suas instalações?", "options": [{"id": "a", "text": "a) Apenas realizar inspeções aleatórias."}, {"id": "b", "text": "b) Monitorar continuamente as instalações para acesso físico não autorizado."}, {"id": "c", "text": "c) Apenas confiar em fechaduras nas portas."}], "correct_option": "b", "domain": "", "theme": "fisico"}, {"id": 76, "text": "76. O que a ThreatProtect deve fazer em relação à proteção contra ameaças físicas e ambientais (Controle A.7.5)?", "options": [{"id": "a", "text": "a) Apenas ter um seguro contra desastres."}, {"id": "b", "text": "b) Projetar e implementar proteção contra ameaças físicas e ambientais, como desastres naturais e outras ameaças físicas intencionais ou não intencionais à infraestrutura."}, {"id": "c", "text": "c) Armazenar os equipamentos em áreas sem proteção especial."}], "correct_option": "b", "domain": "", "theme": "fisico"}, {"id": 77, "text": "77. O que a SecureAreasWork deve fazer em relação ao trabalho em áreas seguras (Controle A.7.6)?", "options": [{"id": "a", "text": "a) Restringir o acesso a essas áreas."}, {"id": "b", "text": "b) Projetar e implementar medidas de segurança para trabalhar em áreas seguras."}, {"id": "c", "text": "c) Apenas confiar na integridade dos funcionários."}], "correct_option": "b", "domain": "", "theme": "fisico"}, {"id": 78, "text": "78. O que a CleanDesk deve definir e aplicar (Controle A.7.7) para evitar isso?", "options": [{"id": "a", "text": "a) Políticas de trabalho remoto."}, {"id": "b", "text": "b) Regras de mesa limpa para documentos impressos e mídia de armazenamento removível e regras de tela limpa para os recursos de tratamento das informações."}, {"id": "c", "text": "c) Um sistema de armários para guardar itens pessoais."}], "correct_option": "b", "domain": "", "theme": "fisico"}, {"id": 79, "text": "79. O que a EquipLocate deve garantir em relação à localização e proteção de equipamentos (Controle A.7.8)?", "options": [{"id": "a", "text": "a) Apenas etiquetar todos os equipamentos."}, {"id": "b", "text": "b) Posicionar os equipamentos com segurança e proteção."}, {"id": "c", "text": "c) Deixar os equipamentos visíveis para facilitar a manutenção."}], "correct_option": "b", "domain": "", "theme": "fisico"}, {"id": 80, "text": "80. A empresa \"OutsideEquip\" descobre que colaboradores levam laptops corporativos para casa sem qualquer orientação ou controle de segurança.", "options": [{"id": "a", "text": "a) Proibir completamente o uso de equipamentos fora das instalações."}, {"id": "b", "text": "b) Aplicar segurança a equipamentos utilizados fora das instalações, como proteção física, criptografia e política de uso aceitável (Controle A.7.9)."}, {"id": "c", "text": "c) Confiar que os colaboradores adotarão boas práticas por conta própria."}], "correct_option": "b", "domain": "", "theme": "fisico"}]</script>
    <script>
      const ALL_QUESTIONS = JSON.parse(document.getElementById('questions-data').textContent);
      const CONFIG = {"examTitle": "ISO/IEC 27001:2022 Lead Implementer Simulator — Simulado 1", "examSubtitle": "Formato em blocos de 10 questões, com pausa e acompanhamento de desempenho.", "totalSeconds": 10800};
      const BLOCK_SIZE = 10;
      const TOTAL = ALL_QUESTIONS.length;
      const TOTAL_BLOCKS = Math.ceil(TOTAL / BLOCK_SIZE);
      const TOTAL_SECONDS = CONFIG.totalSeconds;

      const state = {
        view: 'intro', // intro | exam | pause | confirmSubmit | manualPause | final
        current: 1, // 1-indexed question number
        maxUnlocked: BLOCK_SIZE,
        answers: {}, // qid -> letter
        bookmarks: new Set(),
        filter: 'all', // all | bookmarked | unanswered
        secondsLeft: TOTAL_SECONDS,
        timerId: null,
        pauseBlockIndex: null, // which block the pause screen refers to (0-indexed)
      };

      const byId = (i) => ALL_QUESTIONS[i - 1];

      const THEME_META = {
        organizacional: { label: '📁 Controles Organizacionais', controls: 37, order: 1 },
        pessoas:        { label: '👥 Controles de Pessoas',       controls: 8,  order: 2 },
        fisico:         { label: '🏢 Controles Físicos',          controls: 14, order: 3 },
        tecnologico:    { label: '💻 Controles Tecnológicos',     controls: 34, order: 4 },
      };
      const THEME_ORDER = ['organizacional', 'pessoas', 'fisico', 'tecnologico'];

      function computeStatsForQuestions(qs) {
        let correct = 0;
        const perQuestion = [];
        qs.forEach(q => {
          const chosen = state.answers[q.id];
          const isCorrect = chosen === q.correct_option;
          if (isCorrect) correct++;
          perQuestion.push({ id: q.id, correct: isCorrect, answered: chosen !== undefined });
        });
        return { correct, total: qs.length, perQuestion };
      }

      function computeDomainBreakdown(qs) {
        const byTheme = {};
        THEME_ORDER.forEach(k => { byTheme[k] = { correct: 0, total: 0 }; });
        qs.forEach(q => {
          const key = THEME_META[q.theme] ? q.theme : 'organizacional';
          byTheme[key].total++;
          if (state.answers[q.id] === q.correct_option) byTheme[key].correct++;
        });
        return byTheme;
      }

      function barChartHTML(byDomain) {
        return THEME_ORDER.map(k => {
          const meta = THEME_META[k];
          const d = byDomain[k] || { correct: 0, total: 0 };
          const pct = d.total ? Math.round((d.correct / d.total) * 100) : 0;
          const color = d.total === 0 ? '#cbd5e1' : (pct >= 70 ? '#15803d' : (pct >= 50 ? '#d97706' : '#b91c1c'));
          const countLabel = d.total ? `${d.correct}/${d.total} (${pct}%)` : 'sem dados ainda';
          return `
            <div class="bar-row">
              <div class="bar-label" title="${escapeHtml(meta.label)} · ${meta.controls} controles">${escapeHtml(meta.label)}</div>
              <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
              <div class="bar-pct">${countLabel}</div>
            </div>`;
        }).join('');
      }

      function escapeHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      function fmtTime(totalSec) {
        const s = Math.max(0, totalSec);
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const sec = Math.floor(s % 60);
        const pad = (n) => String(n).padStart(2, '0');
        return `${pad(h)}:${pad(m)}:${pad(sec)}`;
      }

      function startTimer() {
        if (state.timerId) return;
        state.timerId = setInterval(() => {
          if (state.view !== 'exam') return; // ticks only while actively answering
          state.secondsLeft--;
          if (state.secondsLeft <= 0) {
            state.secondsLeft = 0;
            clearInterval(state.timerId);
            state.timerId = null;
            state.view = 'final';
            render();
            return;
          }
          const el = document.getElementById('timer-display');
          if (el) el.textContent = fmtTime(state.secondsLeft);
        }, 1000);
      }

      function render() {
        const app = document.getElementById('app');
        if (state.view === 'intro') app.innerHTML = renderIntro();
        else if (state.view === 'exam') app.innerHTML = renderExamChrome() + renderExamBody();
        else if (state.view === 'pause') app.innerHTML = renderExamChrome(true) + renderPause();
        else if (state.view === 'confirmSubmit') app.innerHTML = renderExamChrome(true) + renderConfirmSubmit();
        else if (state.view === 'manualPause') app.innerHTML = renderExamChrome(true) + renderManualPause();
        else if (state.view === 'final') app.innerHTML = renderFinal();
        attachHandlers();
        window.scrollTo(0, 0);
      }

      function renderIntro() {
        return `
          <div class="card">
            <h1>${escapeHtml(CONFIG.examTitle)}</h1>
            <p class="sub">${escapeHtml(CONFIG.examSubtitle)}</p>
            <ul class="plain">
              <li><span>Total de questões</span><strong>${TOTAL}</strong></li>
              <li><span>Tempo total</span><strong>${fmtTime(TOTAL_SECONDS)}</strong></li>
              <li><span>Nota de aprovação</span><strong>70%</strong></li>
              <li><span>Pausas</span><strong>a cada ${BLOCK_SIZE} questões, com resultado parcial</strong></li>
            </ul>
            <div class="footer-actions" style="justify-content:flex-end">
              <button class="btn" id="start-btn">Iniciar Simulado</button>
            </div>
          </div>`;
      }

      function renderExamChrome(disabled) {
        const pct = TOTAL_SECONDS ? state.secondsLeft / TOTAL_SECONDS : 1;
        const timerCls = pct < 0.1 ? 'timer low' : 'timer ok';
        return `
          <div class="topbar">
            <div class="examname">Exam: <span>${escapeHtml(CONFIG.examTitle)}</span></div>
            <div class="loggedas">Logged in as: Student</div>
          </div>
          <div class="toolbar">
            <button class="navbtn" id="prev-q-btn" ${disabled || state.current <= 1 ? 'disabled' : ''}>&lsaquo;</button>
            <span class="qcounter">Question ${state.current} of ${TOTAL}</span>
            <button class="navbtn" id="next-q-btn-top" ${disabled || state.current >= state.maxUnlocked ? 'disabled' : ''}>&rsaquo;</button>
            <button class="bookmarkbtn ${state.bookmarks.has(state.current) ? 'active' : ''}" id="bookmark-btn" ${disabled ? 'disabled' : ''}>🔖 Bookmark</button>
            <div class="spacer"></div>
            <div class="${timerCls}">🕐 <span id="timer-display">${fmtTime(state.secondsLeft)}</span></div>
            <button class="pausebtn" id="manual-pause-btn" ${disabled ? 'disabled' : ''}>⏸ Pause Exam</button>
            <button class="submitbtn" id="submit-exam-btn" ${disabled ? 'disabled' : ''}>✓ SUBMIT EXAM</button>
          </div>
          <div class="filterbar">
            Show:
            <label><input type="radio" name="filter" value="all" ${state.filter==='all'?'checked':''} ${disabled?'disabled':''}> All</label>
            <label><input type="radio" name="filter" value="bookmarked" ${state.filter==='bookmarked'?'checked':''} ${disabled?'disabled':''}> Bookmarked</label>
            <label><input type="radio" name="filter" value="unanswered" ${state.filter==='unanswered'?'checked':''} ${disabled?'disabled':''}> Unanswered</label>
          </div>
          <div class="gridwrap">
            <div class="grid">${renderGrid(disabled)}</div>
          </div>`;
      }

      function renderGrid(disabled) {
        let nums = [];
        for (let i = 1; i <= TOTAL; i++) nums.push(i);
        if (state.filter === 'bookmarked') nums = nums.filter(i => state.bookmarks.has(i));
        if (state.filter === 'unanswered') nums = nums.filter(i => i <= state.maxUnlocked && state.answers[byId(i).id] === undefined);
        if (nums.length === 0) return `<span class="sub">Nenhuma questão nesse filtro.</span>`;
        return nums.map(i => {
          const locked = i > state.maxUnlocked;
          const answered = state.answers[byId(i).id] !== undefined;
          let cls = 'gridnum';
          if (i === state.current) cls += ' current';
          else if (answered) cls += ' answered';
          if (locked) cls += ' locked';
          if (state.bookmarks.has(i)) cls += ' bookmarked';
          return `<button type="button" class="${cls}" data-goto="${i}" ${locked || disabled ? 'disabled' : ''} title="${locked ? 'Bloqueada até concluir o bloco anterior' : ''}">${i}</button>`;
        }).join('');
      }

      function renderExamBody() {
        const q = byId(state.current);
        const isLastGlobal = state.current === TOTAL;
        const optionsHtml = q.options.map(opt => {
          const checked = state.answers[q.id] === opt.id ? 'checked' : '';
          const cls = state.answers[q.id] === opt.id ? 'opt answered' : 'opt';
          return `
            <label class="${cls}">
              <input type="radio" name="q_${q.id}" value="${opt.id}" ${checked} data-qid="${q.id}" data-opt="${opt.id}">
              <span>${escapeHtml(opt.text)}</span>
            </label>`;
        }).join('');

        const nextControls = isLastGlobal
          ? `<span class="sub" style="margin:0">Última questão — use SUBMIT EXAM para finalizar.</span>`
          : `<button class="btn gray" id="skip-q-btn">Skip Question &rsaquo;</button>
             <button class="btn" id="next-q-btn">Go To Next Question &rsaquo;</button>`;

        const answered = state.answers[q.id] !== undefined;
        const explicacaoHtml = (answered && typeof renderExplicacao === 'function') ? renderExplicacao(q.id) : '';

        return `
          <div class="main">
            <div class="qtext">${escapeHtml(q.text)}</div>
            ${optionsHtml}
            <div class="footer-actions">
              <span></span>
              <div style="display:flex;gap:10px">${nextControls}</div>
            </div>
            ${explicacaoHtml}
          </div>`;
      }

      function renderPause() {
        const blockIndex = state.pauseBlockIndex;
        const start = blockIndex * BLOCK_SIZE;
        const qs = ALL_QUESTIONS.slice(start, start + BLOCK_SIZE);
        const blockStats = computeStatsForQuestions(qs);
        const answeredSoFar = ALL_QUESTIONS.slice(0, start + BLOCK_SIZE);
        const cumStats = computeStatsForQuestions(answeredSoFar);
        const cumPct = Math.round((cumStats.correct / cumStats.total) * 100);
        const byDomain = computeDomainBreakdown(answeredSoFar);
        const isLastBlock = (start + BLOCK_SIZE) >= TOTAL;

        const reviewChips = blockStats.perQuestion.map((p, i) => {
          const num = start + i + 1;
          return `<div class="review-chip ${p.correct ? 'ok' : 'no'}" title="Questão ${num}">${num}</div>`;
        }).join('');

        return `
          <div class="main">
            <h1>Exame Pausado</h1>
            <p class="sub">Bloco ${blockIndex + 1} de ${TOTAL_BLOCKS} concluído (questões ${start+1}–${start+qs.length}).</p>

            <div class="section-title">Resultado provisório · últimas ${qs.length} perguntas</div>
            <div class="stat-grid">
              <div class="stat-box">
                <div class="num">${blockStats.correct}/${blockStats.total}</div>
                <div class="label">Acertos neste bloco</div>
              </div>
              <div class="stat-box">
                <div class="num">${Math.round((blockStats.correct/blockStats.total)*100)}%</div>
                <div class="label">Aproveitamento do bloco</div>
              </div>
            </div>
            <div class="review-list">${reviewChips}</div>

            <div class="section-title">Resultado acumulado · ${cumStats.total} respondidas</div>
            <div class="stat-grid">
              <div class="stat-box">
                <div class="num">${cumStats.correct}/${cumStats.total}</div>
                <div class="label">Acertos no total</div>
              </div>
              <div class="stat-box">
                <div class="num">${cumPct}% <span class="pill ${cumPct>=70?'good':'bad'}">${cumPct>=70?'No caminho da aprovação':'Abaixo de 70%'}</span></div>
                <div class="label">Aproveitamento acumulado</div>
              </div>
            </div>

            <div class="section-title">Acertos por domínio (acumulado)</div>
            ${barChartHTML(byDomain)}

            <div class="footer-actions">
              <span></span>
              ${isLastBlock
                ? `<button class="btn" id="final-btn">Ver Resultado Final</button>`
                : `<button class="btn" id="continue-btn">Continuar (próximas ${Math.min(BLOCK_SIZE, TOTAL - (start+BLOCK_SIZE))} perguntas)</button>`}
            </div>
          </div>`;
      }

      function renderConfirmSubmit() {
        return `
          <div class="main">
            <h1>Finalizar o simulado?</h1>
            <p class="sub">Você respondeu ${Object.keys(state.answers).length} de ${TOTAL} questões. Questões não respondidas contam como erradas no resultado final.</p>
            <div class="footer-actions">
              <button class="btn gray" id="cancel-submit-btn">Voltar ao exame</button>
              <button class="btn" id="confirm-submit-btn">Confirmar e Ver Resultado</button>
            </div>
          </div>`;
      }

      function renderManualPause() {
        return `
          <div class="main">
            <h1>Exame Pausado Manualmente</h1>
            <p class="sub">O cronômetro está parado. Clique em retomar para continuar de onde parou.</p>
            <div class="footer-actions">
              <span></span>
              <button class="btn" id="resume-btn">Retomar Exame</button>
            </div>
          </div>`;
      }

      function renderFinal() {
        const all = ALL_QUESTIONS;
        const stats = computeStatsForQuestions(all.filter(q => state.answers[q.id] !== undefined || true));
        const pct = Math.round((stats.correct / stats.total) * 100);
        const approved = pct >= 70;
        const byDomain = computeDomainBreakdown(all);

        return `
          <div class="card">
            <h1>Resultado Final</h1>
            <p class="sub">${escapeHtml(CONFIG.examTitle)}</p>
            <div class="stat-grid">
              <div class="stat-box">
                <div class="num">${stats.correct}/${stats.total}</div>
                <div class="label">Acertos totais</div>
              </div>
              <div class="stat-box">
                <div class="num">${pct}% <span class="pill ${approved?'good':'bad'}">${approved?'APROVADO':'NÃO APROVADO'}</span></div>
                <div class="label">Nota final (corte: 70%)</div>
              </div>
            </div>

            <div class="section-title">Acertos por domínio</div>
            ${barChartHTML(byDomain)}

            <div class="footer-actions">
              <span></span>
              <button class="btn secondary" id="retake-btn">Refazer Simulado</button>
            </div>
          </div>`;
      }

      function advance() {
        // called from Next/Skip: moves from state.current forward by 1, triggering pause at 10-boundaries
        const leaving = state.current;
        if (leaving % BLOCK_SIZE === 0 && leaving < TOTAL) {
          state.pauseBlockIndex = (leaving / BLOCK_SIZE) - 1;
          state.view = 'pause';
          render();
          return;
        }
        if (leaving < TOTAL) {
          state.current = leaving + 1;
          render();
        }
      }

      function attachHandlers() {
        const startBtn = document.getElementById('start-btn');
        if (startBtn) startBtn.onclick = () => {
          state.view = 'exam'; state.current = 1; state.maxUnlocked = BLOCK_SIZE;
          render(); startTimer();
        };

        document.querySelectorAll('input[type=radio][name^="q_"]').forEach(input => {
          input.onchange = (e) => {
            const qid = Number(e.target.dataset.qid);
            state.answers[qid] = e.target.dataset.opt;
            render();
          };
        });

        document.querySelectorAll('input[type=radio][name="filter"]').forEach(input => {
          input.onchange = (e) => { state.filter = e.target.value; render(); };
        });

        document.querySelectorAll('.gridnum').forEach(btn => {
          btn.onclick = (e) => {
            const n = Number(e.currentTarget.dataset.goto);
            if (n > state.maxUnlocked) return;
            state.current = n;
            render();
          };
        });

        const prevBtn = document.getElementById('prev-q-btn');
        if (prevBtn) prevBtn.onclick = () => { if (state.current > 1) { state.current--; render(); } };

        const nextTopBtn = document.getElementById('next-q-btn-top');
        if (nextTopBtn) nextTopBtn.onclick = () => { if (state.current < state.maxUnlocked) { state.current++; render(); } };

        const nextBtn = document.getElementById('next-q-btn');
        if (nextBtn) nextBtn.onclick = advance;
        const skipBtn = document.getElementById('skip-q-btn');
        if (skipBtn) skipBtn.onclick = advance;

        const bookmarkBtn = document.getElementById('bookmark-btn');
        if (bookmarkBtn) bookmarkBtn.onclick = () => {
          if (state.bookmarks.has(state.current)) state.bookmarks.delete(state.current);
          else state.bookmarks.add(state.current);
          render();
        };

        const manualPauseBtn = document.getElementById('manual-pause-btn');
        if (manualPauseBtn) manualPauseBtn.onclick = () => { state.view = 'manualPause'; render(); };
        const resumeBtn = document.getElementById('resume-btn');
        if (resumeBtn) resumeBtn.onclick = () => { state.view = 'exam'; render(); };

        const submitBtn = document.getElementById('submit-exam-btn');
        if (submitBtn) submitBtn.onclick = () => { state.view = 'confirmSubmit'; render(); };
        const cancelSubmitBtn = document.getElementById('cancel-submit-btn');
        if (cancelSubmitBtn) cancelSubmitBtn.onclick = () => { state.view = 'exam'; render(); };
        const confirmSubmitBtn = document.getElementById('confirm-submit-btn');
        if (confirmSubmitBtn) confirmSubmitBtn.onclick = () => { state.view = 'final'; render(); };

        const continueBtn = document.getElementById('continue-btn');
        if (continueBtn) continueBtn.onclick = () => {
          state.maxUnlocked = Math.min(TOTAL, state.maxUnlocked + BLOCK_SIZE);
          state.current = state.current + 1 > TOTAL ? TOTAL : (state.pauseBlockIndex + 1) * BLOCK_SIZE + 1;
          state.view = 'exam';
          render();
        };

        const finalBtn = document.getElementById('final-btn');
        if (finalBtn) finalBtn.onclick = () => { state.view = 'final'; render(); };

        const retakeBtn = document.getElementById('retake-btn');
        if (retakeBtn) retakeBtn.onclick = () => {
          state.view = 'intro'; state.current = 1; state.maxUnlocked = BLOCK_SIZE;
          state.answers = {}; state.bookmarks = new Set(); state.filter = 'all';
          state.secondsLeft = TOTAL_SECONDS;
          render();
        };
      }

      render();
    </script>
  
    <script>
      const EXPLICACOES = {"1":{"resposta_correta":"b) Determinar as questões internas e externas relevantes para seu propósito e que afetam sua capacidade de alcançar os resultados pretendidos do SGSI.","justificativa":"A cláusula 4.1 (Entendendo a organização e seu contexto) exige que a organização determine as questões externas (ex.: regulatório, tecnológico, concorrencial, mercado, cultural) e internas (ex.: cultura organizacional, valores, capacidades, governança) que são pertinentes ao seu propósito e que afetam sua capacidade de atingir os resultados pretendidos do SGSI. Esse é o ponto de partida de toda a análise de contexto — sem ele não é possível definir escopo, partes interessadas nem riscos de forma coerente.","analisa":"- a) Auditoria interna é uma atividade da cláusula 9.2, ocorre depois que o SGSI já está implementado e operando — não é o passo inicial de entendimento de contexto.\n- c) A norma não exige a contratação de um profissional específico como pré-requisito; liderança e recursos são tratados nas cláusulas 5 e 7, não na determinação do contexto.","dica":"Sempre que a questão mencionar \"primeiro passo\" ou \"ponto de partida\" do SGSI, pense na cláusula 4.1 — contexto vem antes de escopo, política, riscos e objetivos.","resumo":"Contexto (4.1) é a base: sem entender questões internas/externas, não se define escopo nem riscos."},"2":{"resposta_correta":"c) Qualquer parte que possa ser afetada ou que possa afetar o SGSI, incluindo requisitos legais e regulamentares.","justificativa":"A cláusula 4.2 (Entendendo as necessidades e expectativas das partes interessadas) exige que a organização determine as partes interessadas pertinentes ao SGSI e os requisitos delas — o que inclui reguladores, fornecedores, clientes, acionistas, funcionários e qualquer outra parte que afete ou seja afetada pelo sistema, além dos requisitos legais, estatutários, regulamentares e contratuais aplicáveis.","analisa":"- a) A palavra \"apenas\" restringe indevidamente o universo de partes interessadas a dois grupos, deixando de fora reguladores, fornecedores e outros relevantes exigidos pela cláusula.\n- b) Também usa \"apenas\", excluindo partes igualmente relevantes (acionistas, comunidade, clientes) que a norma não permite ignorar.","dica":"Cuidado com alternativas que usam \"apenas\" ou \"somente\" para partes interessadas — a 4.2 é propositalmente ampla e não lista um rol fechado.","resumo":"Partes interessadas = qualquer um que afeta ou é afetado pelo SGSI, sem lista fechada."},"3":{"resposta_correta":"b) As questões internas e externas, os requisitos das partes interessadas, e as interfaces e dependências entre as atividades.","justificativa":"A cláusula 4.3 (Determinando o escopo do SGSI) exige explicitamente que, ao definir os limites e a aplicabilidade do SGSI, a organização considere as questões externas e internas (4.1), os requisitos das partes interessadas (4.2) e as interfaces e dependências entre as atividades realizadas pela organização e as realizadas por outras organizações. O escopo deve ser mantido como informação documentada.","analisa":"- a) Tecnologia é apenas um elemento do escopo, não o critério central exigido pela cláusula 4.3.\n- c) Custo e benefício financeiro não são critérios citados na cláusula 4.3 para definição de escopo.","dica":"Decore o \"trio\" da 4.3: contexto (4.1) + partes interessadas (4.2) + interfaces/dependências. Esse trio aparece com frequência em questões sobre escopo.","resumo":"Escopo = contexto + partes interessadas + interfaces/dependências, tudo documentado."},"4":{"resposta_correta":"b) Assegurar que a política de segurança da informação e os objetivos sejam estabelecidos e compatíveis com a direção estratégica da organização.","justificativa":"A cláusula 5.1 (Liderança e comprometimento) lista uma série de responsabilidades da Alta Direção, entre elas assegurar que a política e os objetivos de segurança da informação sejam estabelecidos e sejam compatíveis com a direção estratégica da organização, além de assegurar a integração dos requisitos do SGSI aos processos de negócio e a disponibilidade de recursos.","analisa":"- a) Fornecer orçamento é apenas uma faceta de \"prover recursos\" (uma das várias responsabilidades listadas), não a responsabilidade central nem exclusiva da liderança.\n- c) A norma não exige que a Alta Direção execute pessoalmente as avaliações de risco; ela deve assegurar que sejam realizadas, podendo delegar a execução técnica.","dica":"Liderança (5.1) é sobre \"assegurar que aconteça\", não sobre \"fazer pessoalmente\" — essa distinção é uma pegadinha clássica de prova.","resumo":"Alta Direção assegura alinhamento estratégico da política/objetivos; não precisa executar tarefas operacionais."},"5":{"resposta_correta":"b) Os objetivos de segurança da informação ou a estrutura para estabelecê-los, e o comprometimento com a melhoria contínua.","justificativa":"A cláusula 5.2 (Política) exige que a política de segurança da informação seja apropriada ao propósito da organização, inclua objetivos de segurança da informação (ou forneça a estrutura para estabelecê-los), inclua o comprometimento em satisfazer requisitos aplicáveis e com a melhoria contínua do SGSI. Ela deve ser documentada, comunicada e disponibilizada às partes interessadas pertinentes.","analisa":"- a) Uma política de alto nível não é uma lista técnica de softwares; isso seria, no máximo, conteúdo de um procedimento técnico, não da política.\n- c) Histórico detalhado de incidentes é registro operacional (ligado a 5.25-5.28 do Anexo A), não conteúdo exigido para a política de segurança da informação.","dica":"Política ≠ procedimento técnico. A política é estratégica e de alto nível; não confunda com documentos operacionais detalhados.","resumo":"Política = objetivos (ou estrutura para defini-los) + compromisso com melhoria contínua, aprovada e comunicada."},"6":{"resposta_correta":"b) Assegurar que as responsabilidades e autoridades dos papéis relevantes para a segurança da informação sejam atribuídas e comunicadas dentro da organização.","justificativa":"A cláusula 5.3 (Papéis, responsabilidades e autoridades organizacionais) determina que a Alta Direção deve assegurar que as responsabilidades e autoridades para papéis relevantes à segurança da informação sejam atribuídas e comunicadas dentro da organização, incluindo quem reporta o desempenho do SGSI e quem assegura sua conformidade com os requisitos da norma.","analisa":"- a) Manter em segredo é diretamente contrário à exigência de comunicação prevista na cláusula 5.3.\n- c) A norma não exige terceirização das responsabilidades de SGSI; a Alta Direção pode delegar tarefas, mas continua responsável por assegurar que os papéis estejam claros dentro da própria organização.","dica":"\"Atribuir e comunicar\" é o par de verbos-chave da cláusula 5.3 — quase sempre aparece assim nas provas.","resumo":"Papéis de segurança da informação devem ser atribuídos E comunicados, nunca mantidos em sigilo."},"7":{"resposta_correta":"b) Assegurar que o SGSI possa alcançar seus resultados pretendidos, prevenir ou reduzir efeitos indesejados, e alcançar a melhoria contínua.","justificativa":"A cláusula 6.1.1 (Ações para abordar riscos e oportunidades - Generalidades) estabelece que, ao planejar o SGSI, a organização deve considerar as questões de 4.1 e os requisitos de 4.2 para determinar riscos e oportunidades que precisam ser abordados, de forma a assegurar que o SGSI possa alcançar seus resultados pretendidos, prevenir ou reduzir efeitos indesejados e alcançar a melhoria contínua.","analisa":"- a) Cumprir requisitos legais mínimos é apenas um subconjunto possível de risco/obrigação; a cláusula 6.1.1 tem um escopo muito mais amplo, envolvendo todo tipo de risco e oportunidade ao SGSI.\n- c) Gestão de risco em segurança da informação não busca eliminação total (risco zero), que é inviável na prática; busca-se levar os riscos a níveis aceitáveis por meio de tratamento.","dica":"Toda vez que uma opção falar em \"eliminar completamente todos os riscos\", desconfie — a gestão de riscos ISO trabalha com aceitação, redução, transferência ou eliminação pontual, nunca com \"risco zero\" absoluto.","resumo":"6.1.1 é sobre alcançar resultados pretendidos e melhoria contínua, não sobre zerar riscos."},"8":{"resposta_correta":"c) Critérios de risco de segurança da informação, incluindo critérios de aceitação do risco.","justificativa":"A cláusula 6.1.2 (Avaliação de riscos de segurança da informação) exige que a organização defina e aplique um processo de avaliação de riscos que estabeleça e mantenha critérios de risco de segurança da informação, incluindo os critérios de aceitação do risco e os critérios para realizar as avaliações de riscos, além de assegurar que avaliações repetidas produzam resultados consistentes, válidos e comparáveis.","analisa":"- a) Uma lista de ferramentas é um meio operacional, não o elemento normativo exigido (critérios de risco) pela cláusula 6.1.2.\n- b) Uma lista de controles já implementados está mais relacionada à Declaração de Aplicabilidade (resultado de 6.1.3), não ao estabelecimento de critérios de avaliação de risco.","dica":"Critérios de risco (incluindo aceitação) é conceito central de 6.1.2 — é o que garante que avaliações futuras sejam comparáveis entre si.","resumo":"Antes de avaliar risco, defina os critérios (inclusive de aceitação) — sem critério não há avaliação consistente."},"9":{"resposta_correta":"b) Selecionar, de forma apropriada, as opções de tratamento de riscos e determinar todos os controles necessários, comparando-os com o Anexo A.","justificativa":"A cláusula 6.1.3 (Tratamento de riscos de segurança da informação) exige que a organização defina e aplique um processo de tratamento de riscos: selecionar opções apropriadas de tratamento (evitar, reduzir, transferir, reter/aceitar), determinar todos os controles necessários para implementar essas opções, comparar os controles determinados com os do Anexo
