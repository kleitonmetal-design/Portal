leatórias e pontuais deixam lacunas temporais significativas de vigilância, não atendendo à exigência de monitoramento contínuo do controle.\n- c) Fechaduras são um controle preventivo/passivo (mais relacionado a A.7.2/A.7.3), mas não constituem monitoramento ativo e contínuo do ambiente, que é o foco específico do A.7.4.","dica":"A.7.4 é um dos 11 controles novos de 2022 — decore que ele fala especificamente de monitoramento contínuo (detecção ativa), diferente dos controles de perímetro/entrada que são preventivos.","resumo":"Não basta trancar a porta: é preciso monitorar continuamente se alguém tenta ou consegue burlar essa proteção."},"76":{"resposta_correta":"b) Projetar e implementar proteção contra ameaças físicas e ambientais, como desastres naturais e outras ameaças físicas intencionais ou não intencionais à infraestrutura.","justificativa":"O controle A.7.5 (Proteção contra ameaças físicas e ambientais) exige que proteção contra ameaças físicas e ambientais — como incêndio, enchente, terremoto, sobrecarga elétrica e ameaças físicas intencionais ou não intencionais — seja projetada e implementada na infraestrutura da organização, com base em avaliação de risco do ambiente onde os ativos estão localizados.","analisa":"- a) Um seguro contra desastres transfere o impacto financeiro do risco, mas não é uma medida de proteção física/preventiva propriamente dita, que é o que o controle exige (ex.: detecção de incêndio, sistemas de climatização, proteção contra enchentes).\n- c) Armazenar equipamentos sem qualquer proteção especial contraria diretamente o propósito do controle, que é justamente proteger a infraestrutura contra esse tipo de ameaça.","dica":"Cuidado com a diferença entre \"transferir risco\" (seguro) e \"mitigar risco\" (proteção física real, como sistemas de supressão de incêndio) — a norma, no A.7.5, exige a mitigação física, não apenas a transferência financeira.","resumo":"Seguro cobre prejuízo financeiro depois do desastre; o controle A.7.5 exige prevenir/mitigar o desastre antes."},"77":{"resposta_correta":"b) Projetar e implementar medidas de segurança para trabalhar em áreas seguras.","justificativa":"O controle A.7.6 (Trabalho em áreas seguras) exige que medidas de segurança para o trabalho em áreas seguras sejam projetadas e implementadas — como supervisão de visitantes, restrição de dispositivos móveis/fotográficos, e procedimentos específicos de conduta dentro dessas áreas — indo além do simples controle de quem entra.","analisa":"- a) Restringir o acesso é o objetivo do controle A.7.2 (Entrada física); o A.7.6 trata especificamente das medidas de segurança durante a permanência e execução de trabalho dentro da área já segura, não apenas de quem pode entrar.\n- c) Confiar apenas na integridade dos funcionários, sem medidas formais de segurança, não constitui um controle verificável nem atende à exigência de medidas projetadas e implementadas.","dica":"Diferencie A.7.2 (quem entra na área) de A.7.6 (o que se faz e como se comporta dentro da área) — são momentos distintos do fluxo de segurança física.","resumo":"Estar dentro da área segura exige regras próprias de conduta, além do simples controle de entrada."},"78":{"resposta_correta":"b) Regras de mesa limpa para documentos impressos e mídia de armazenamento removível e regras de tela limpa para os recursos de tratamento das informações.","justificativa":"O controle A.7.7 (Mesa limpa e tela limpa) exige que sejam definidas e adequadamente aplicadas regras de mesa limpa para documentos em papel e mídias de armazenamento removíveis, e regras de tela limpa para os recursos de tratamento da informação (como bloqueio automático de tela), reduzindo o risco de exposição de informações a pessoas não autorizadas.","analisa":"- a) Política de trabalho remoto é o escopo do controle A.6.7, tema completamente diferente do controle A.7.7, que trata de exposição física de informações no ambiente de trabalho.\n- c) Um sistema de armários pode até apoiar a organização, mas não é o controle em si; o foco do A.7.7 são as regras de conduta quanto a documentos expostos e telas desbloqueadas, não o mobiliário de guarda de pertences pessoais.","dica":"A.7.7 é o clássico \"mesa limpa e tela limpa\" — muito cobrado em cenários de escritório aberto (open space) e visitantes circulando perto de estações de trabalho.","resumo":"Nada de papel sensível à vista nem tela desbloqueada: mesa limpa e tela limpa sempre."},"79":{"resposta_correta":"b) Posicionar os equipamentos com segurança e proteção.","justificativa":"O controle A.7.8 (Localização e proteção de equipamentos) exige que os equipamentos sejam posicionados com segurança e proteção, reduzindo riscos de ameaças ambientais e perigos, além de oportunidades de acesso não autorizado — por exemplo, evitando posicionar telas voltadas para janelas ou áreas de grande circulação de pessoas não autorizadas.","analisa":"- a) Etiquetar equipamentos é uma prática de gestão de ativos (relacionada ao inventário, A.5.9), mas não trata do posicionamento físico seguro exigido especificamente pelo controle A.7.8.\n- c) Deixar equipamentos deliberadamente visíveis e acessíveis, mesmo que para facilitar manutenção, aumenta a exposição a acesso não autorizado, furto ou observação indevida de informações (shoulder surfing), contrariando o propósito do controle.","dica":"A.7.8 é sobre onde e como o equipamento fica fisicamente posicionado — pense em servidores fora de áreas de trânsito, monitores não voltados para janelas ou corredores públicos.","resumo":"Equipamento bem posicionado é aquele protegido de olhares, acidentes e acessos indevidos, não o mais visível ou acessível."},"80":{"resposta_correta":"b) Aplicar segurança a equipamentos utilizados fora das instalações, como proteção física, criptografia e política de uso aceitável (Controle A.7.9).","justificativa":"O controle A.7.9 (Segurança de ativos fora das instalações) exige que segurança seja aplicada a ativos que operam fora das instalações da organização, considerando os diferentes riscos de trabalhar fora do ambiente controlado — o que inclui medidas como proteção física do dispositivo, criptografia de disco, VPN e uma política clara de uso aceitável para equipamentos levados para fora.","analisa":"- a) Proibir completamente o uso externo é uma medida desproporcional que pode inviabilizar a operação do negócio (ex.: trabalho remoto ou viagens corporativas); a norma não exige proibição, e sim gestão adequada do risco.\n- c) Confiar que os colaboradores adotarão boas práticas por conta própria, sem orientação formal, contraria diretamente o cenário descrito (ausência de qualquer orientação ou controle) e o requisito do controle de aplicar medidas de segurança formais.","dica":"A.7.9 fecha a família de controles físicos e é frequentemente citado junto com A.6.7 (trabalho remoto) em cenários de \"levar equipamento para casa\" — a diferença é que A.7.9 foca no ativo em si (proteção física, criptografia), enquanto A.6.7 foca nas condições do trabalho remoto como um todo.","resumo":"Equipamento fora da empresa não é \"terra sem lei\": precisa de proteção física, criptografia e regras claras de uso."}};

      function renderExplicacao(numeroQuestao) {
        const explicacao = EXPLICACOES[numeroQuestao];
        if (!explicacao) return '';
        return `
          <div id="explicacao-container">
            <div style="margin-bottom: 15px;">
              <h3 style="color: #15803d; margin-bottom: 10px;">✅ Resposta Correta</h3>
              <p style="color: #1f2937; font-weight: 500;">${escapeHtml(explicacao.resposta_correta)}</p>
            </div>
            <div style="margin-bottom: 15px;">
              <h3 style="color: #1d4ed8; margin-bottom: 10px;">📝 Justificativa</h3>
              <p style="color: #374151; line-height: 1.6;">${escapeHtml(explicacao.justificativa)}</p>
            </div>
            <div style="margin-bottom: 15px;">
              <h3 style="color: #b91c1c; margin-bottom: 10px;">❌ Por que as demais estão incorretas?</h3>
              <div style="color: #374151; line-height: 1.6; white-space: pre-wrap;">${escapeHtml(explicacao.analisa)}</div>
            </div>
            <div style="margin-bottom: 15px;">
              <h3 style="color: #b45309; margin-bottom: 10px;">💡 Dica para a Prova</h3>
              <p style="color: #374151; background: rgba(251, 191, 36, 0.15); padding: 10px; border-radius: 6px;">${escapeHtml(explicacao.dica)}</p>
            </div>
            <div>
              <h3 style="color: #6d28d9; margin-bottom: 10px;">🎯 Resumo para Memorização</h3>
              <p style="color: #374151; background: rgba(139, 92, 246, 0.12); padding: 10px; border-radius: 6px; font-weight: 500;">${escapeHtml(explicacao.resumo)}</p>
            </div>
          </div>`;
      }
    </script>

    <style>
      #explicacao-container {
        background: rgba(34, 197, 94, 0.08);
        border-left: 3px solid #22c55e;
        padding: 20px;
        margin-top: 20px;
        border-radius: 8px;
        font-size: 0.95em;
        animation: slideIn 0.3s ease;
      }
      #explicacao-container h3 { font-size: 1em; margin-bottom: 8px; }
      #explicacao-container p { margin: 0; }
      @keyframes slideIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
