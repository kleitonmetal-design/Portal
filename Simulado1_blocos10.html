 A para verificar que nenhum controle necessário foi omitido, produzir a Declaração de Aplicabilidade (SoA) e obter a aprovação do plano de tratamento de riscos pelos responsáveis pelos riscos.","analisa":"- a) A seleção de controles não é aleatória; deve ser baseada nos resultados da avaliação de riscos e nas opções de tratamento escolhidas.\n- c) O critério de seleção de controles nunca é \"custo zero\"; deve ser a adequação ao tratamento do risco, considerando viabilidade e proporcionalidade, não apenas ausência de investimento.","dica":"O Anexo A é usado como uma \"lista de verificação de referência\" para checar que nada foi esquecido — os controles não nascem dele, nascem da avaliação/tratamento de riscos.","resumo":"Trate riscos primeiro, depois compare com o Anexo A para garantir completude (nunca o contrário)."},"10":{"resposta_correta":"b) Ser consistentes com a política, mensuráveis (quando aplicável), levar em conta os requisitos aplicáveis, ser monitorados, comunicados e atualizados.","justificativa":"A cláusula 6.2 (Objetivos de segurança da informação e planejamento para alcançá-los) exige que os objetivos sejam consistentes com a política, mensuráveis (se praticável), levem em conta requisitos de segurança da informação aplicáveis e resultados da avaliação/tratamento de risco, sejam monitorados, comunicados, atualizados conforme apropriado e disponíveis como informação documentada.","analisa":"- a) Objetivos secretos e imutáveis contrariam diretamente a exigência de comunicação e de atualização periódica.\n- c) Objetivos vagos vão contra o requisito de mensurabilidade (quando aplicável) e contra a lógica de planejamento SMART aplicada pela norma.","dica":"Lembre do \"mnemônico\" dos objetivos: consistentes, mensuráveis, considerados requisitos, monitorados, comunicados, atualizados — todos citados literalmente na 6.2.","resumo":"Objetivos de segurança precisam ser claros, mensuráveis e vivos (atualizados), nunca secretos ou estáticos."},"11":{"resposta_correta":"b) Conduzir as mudanças de uma forma planejada.","justificativa":"A cláusula 6.3 (Planejamento de mudanças), introduzida na revisão de 2022, exige que, quando a organização determinar a necessidade de mudanças no SGSI, essas mudanças sejam conduzidas de forma planejada — considerando propósito e consequências, integridade do SGSI, disponibilidade de recursos e alocação/realocação de responsabilidades e autoridades.","analisa":"- a) Implementar mudanças sem planejamento contraria diretamente o requisito de \"forma planejada\" da cláusula 6.3.\n- c) Adiar indefinidamente também não atende à norma, pois o SGSI deve responder a mudanças de contexto, riscos e requisitos de forma tempestiva — a inércia gera desalinhamento e não conformidades.","dica":"6.3 é uma cláusula nova de 2022 — questões que citam \"planejamento de mudanças no SGSI\" quase sempre testam esse ponto específico da revisão.","resumo":"Mudança no SGSI: sempre planejada, nunca impulsiva nem eternamente adiada."},"12":{"resposta_correta":"b) Os recursos necessários para estabelecer, implementar, manter e melhorar continuamente o SGSI.","justificativa":"A cláusula 7.1 (Recursos) exige que a organização determine e proveja os recursos necessários para o estabelecimento, implementação, manutenção e melhoria contínua do SGSI — recursos humanos, financeiros, de infraestrutura e tecnológicos, entre outros.","analisa":"- a) Documentos e registros são apenas um tipo de recurso/saída do sistema (tratado com mais profundidade em 7.5); a cláusula 7.1 é muito mais ampla.\n- c) A política é resultado da cláusula 5.2, não o recurso em si que sustenta o SGSI como um todo.","dica":"7.1 \"Recursos\" costuma ser uma cláusula curta, mas ampla — pense em pessoas, infraestrutura, orçamento e tecnologia, não em um item isolado.","resumo":"Sem recursos adequados (pessoas, dinheiro, infraestrutura), o SGSI não se sustenta."},"13":{"resposta_correta":"b) Que essas pessoas são competentes, com base em educação, treinamento ou experiência apropriados, e reter informação documentada como evidência.","justificativa":"A cláusula 7.2 (Competência) exige que a organização determine a competência necessária das pessoas que, sob seu controle, realizam trabalho que afeta o desempenho da segurança da informação; assegure que essas pessoas sejam competentes com base em educação, treinamento ou experiência apropriados; e, onde aplicável, tome ações para adquirir a competência necessária, avaliando sua eficácia, retendo informação documentada como evidência.","analisa":"- a) A norma não exige que todos sejam especialistas em cibersegurança — apenas que tenham a competência adequada ao seu papel específico, o que é proporcional à função.\n- c) Assinar um termo de responsabilidade é, no máximo, uma evidência formal de ciência, mas não substitui a comprovação real de competência exigida pela cláusula.","dica":"Competência (7.2) segue a lógica: determinar → assegurar (educação/treinamento/experiência) → agir se houver gap → reter evidência documentada.","resumo":"Competência não é \"assinar papel\", é comprovar educação, treinamento ou experiência — com evidência guardada."},"14":{"resposta_correta":"b) Que as pessoas estejam cientes da política de segurança da informação, suas contribuições para a eficácia do SGSI e as implicações da não conformidade.","justificativa":"A cláusula 7.3 (Conscientização) exige que as pessoas que realizam trabalho sob o controle da organização estejam cientes da política de segurança da informação, de sua contribuição para a eficácia do SGSI (incluindo os benefícios de um desempenho melhorado) e das implicações de não estar em conformidade com os requisitos do SGSI.","analisa":"- a) A exigência de conscientização abrange todo o pessoal sob controle da organização, não apenas a Alta Direção — que já tem exigências próprias de liderança (5.1).\n- c) A norma pressupõe conscientização contínua e reforçada, não um evento isolado e sem acompanhamento — isso não sustentaria a eficácia exigida.","dica":"Não confunda conscientização (7.3, para todo o pessoal) com competência (7.2, focada em quem afeta o desempenho de segurança) — são cláusulas próximas mas com objetivos distintos.","resumo":"Conscientização é para todos: política, contribuição pessoal e consequências do descumprimento."},"15":{"resposta_correta":"b) O que, quando, com quem e como comunicar.","justificativa":"A cláusula 7.4 (Comunicação) exige que a organização determine a necessidade de comunicações internas e externas pertinentes ao SGSI, incluindo: o que comunicar, quando comunicar, com quem comunicar, como comunicar, e quem comunica.","analisa":"- a) \"Apenas com quem\" cobre só uma das dimensões exigidas pela cláusula, ignorando o quê, quando e como.\n- c) A norma não define nem restringe o meio de comunicação a e-mail; o canal deve ser definido conforme a necessidade, podendo ser qualquer meio apropriado.","dica":"Memorize o \"5W\" reduzido da 7.4: o quê, quando, com quem, como e quem comunica — questões de prova adoram testar se falta algum desses elementos na alternativa.","resumo":"Comunicação eficaz do SGSI define o quê, quando, com quem, como e quem comunica — nunca só um desses itens."},"16":{"resposta_correta":"b) Identificação e descrição, formato e meio, e análise crítica e aprovação para pertinência e adequação.","justificativa":"A cláusula 7.5.2 (Criando e atualizando informação documentada) exige que, ao criar e atualizar informação documentada, a organização assegure identificação e descrição apropriadas (ex.: título, data, autor, número de referência), formato apropriado (idioma, versão do software, gráficos) e meio apropriado (papel, eletrônico), e análise crítica e aprovação quanto à pertinência e adequação.","analisa":"- a) A norma não exige formato impresso; o meio pode ser eletrônico ou físico, conforme apropriado ao contexto da organização.\n- c) Restringir o acesso a uma única pessoa contraria o objetivo de disponibilidade da informação documentada para quem dela precisar (tratado com mais detalhe em 7.5.3, controle de informação documentada).","dica":"7.5.2 tem três elementos-chave: identificação/descrição, formato/meio, e análise crítica/aprovação — decore esse trio para não confundir com 7.5.3 (controle).","resumo":"Criar/atualizar documento = identificar bem, formatar bem e aprovar criticamente antes de usar."},"17":{"resposta_correta":"b) Assegurar que esteja disponível, adequada para o uso, protegida adequadamente, e considerar atividades como distribuição, armazenamento, controle de mudanças e retenção.","justificativa":"A cláusula 7.5.3 (Controle da informação documentada) exige que a informação documentada requerida pelo SGSI e pela norma seja controlada para assegurar que esteja disponível e adequada para uso onde e quando for necessária, e que esteja adequadamente protegida (contra perda de confidencialidade, uso impróprio ou perda de integridade). Para isso, a organização deve abordar distribuição, acesso, recuperação, uso, armazenamento, preservação, controle de mudanças e retenção/disposição.","analisa":"- a) Arquivar apenas em digital sem backup não garante proteção nem disponibilidade contínua — vai contra o requisito de proteção adequada da informação documentada.\n- c) Descartar informações sem registro contraria o requisito de controlar retenção e disposição de forma planejada e rastreável.","dica":"Não confunda 7.5.2 (criar/atualizar: identificação, formato, aprovação) com 7.5.3 (controlar: disponibilidade, proteção, distribuição, retenção) — são etapas sequenciais e complementares.","resumo":"Controlar documento é garantir disponibilidade + proteção + ciclo de vida completo (distribuição a retenção)."},"18":{"resposta_correta":"b) Estabelecer critérios para os processos e implementar controles dos processos de acordo com os critérios, disponibilizando informação documentada.","justificativa":"A cláusula 8.1 (Planejamento operacional e controle) exige que a organização planeje, implemente e controle os processos necessários para atender aos requisitos e implementar as ações determinadas na Seção 6 (riscos, oportunidades, objetivos e mudanças), estabelecendo critérios para esses processos e implementando o controle deles de acordo com esses critérios, mantendo informação documentada na extensão necessária para confiar que os processos foram realizados conforme planejado.","analisa":"- a) Ignorar os critérios contraria diretamente a exigência central da cláusula, que é justamente controlar os processos com base em critérios definidos.\n- c) Documentar sem efetivamente implementar o controle operacional não atende ao requisito, que exige tanto a definição de critérios quanto a implementação real do controle.","dica":"8.1 é a \"execução\" prática de tudo que foi planejado na Seção 6 — pense nela como a ponte entre planejamento (6) e desempenho (9).","resumo":"Operação = critérios definidos + controle real dos processos + evidência documentada de que ocorreu como planejado."},"19":{"resposta_correta":"b) A intervalos planejados, ou quando mudanças significativas forem propostas ou ocorrerem, levando em conta os critérios estabelecidos.","justificativa":"A cláusula 8.2 (Avaliação de riscos de segurança da informação) exige que a organização realize avaliações de riscos de segurança da informação a intervalos planejados, ou quando mudanças significativas forem propostas ou ocorrerem, levando em conta os critérios estabelecidos em 6.1.2. Os resultados devem ser retidos como informação documentada.","analisa":"- a) Uma frequência fixa e anual sem considerar mudanças significativas não atende ao requisito de reavaliar quando o contexto de risco muda, que é tão importante quanto a periodicidade planejada.\n- c) Esperar até a ocorrência de um incidente é uma postura reativa, incompatível com a natureza proativa da gestão de riscos exigida pela cláusula.","dica":"Guarde a fórmula: avaliação de risco = periodicidade planejada + gatilho por mudança significativa. As duas condições coexistem, não se excluem.","resumo":"Reavalie riscos no calendário planejado E sempre que algo relevante mudar — nunca só depois que o problema já aconteceu."},"20":{"resposta_correta":"b) Implementar o plano de tratamento de riscos da segurança da informação e reter informação documentada dos resultados.","justificativa":"A cláusula 8.3 (Tratamento de riscos de segurança da informação) exige que a organização implemente o plano de tratamento de riscos elaborado conforme 6.1.3 e retenha informação documentada dos resultados desse tratamento. Planejar sem executar não gera nenhum benefício real de redução de risco.","analisa":"- a) Simplesmente arquivar o plano sem executá-lo descumpre diretamente a exigência de implementação da cláusula 8.3.\n- c) A norma não determina que a implementação deva ser feita por uma equipe desvinculada de quem elaborou o plano; o importante é que o plano seja efetivamente executado e monitorado, com clareza de responsabilidades.","dica":"8.3 é curta, mas cobrada com frequência: planejamento (6.1.3) sem execução (8.3) não tem valor — a prova gosta de testar essa continuidade.","resumo":"Plano de tratamento de risco só tem valor quando implementado e evidenciado, não quando arquivado."},"21":{"resposta_correta":"b) O que precisa ser monitorado e medido (incluindo controles e processos), os métodos, quando, quem e quando analisar e avaliar os resultados.","justificativa":"A cláusula 9.1 (Monitoramento, medição, análise e avaliação) exige que a organização determine o que precisa ser monitorado e medido (incluindo processos e controles de segurança da informação), os métodos para assegurar resultados válidos, quando o monitoramento/medição deve ser realizado, quem deve monitorar/medir, quando os resultados devem ser analisados/avaliados e quem deve fazer essa análise/avaliação. Os resultados devem ser retidos como evidência documentada.","analisa":"- a) Definir apenas \"quem monitora\" é apenas um dos seis elementos exigidos pela cláusula, deixando de fora o quê, como, quando e a análise dos resultados.\n- c) Métodos baseados em suposições sem evidências contrariam a exigência de que os métodos assegurem resultados válidos e comparáveis.","dica":"9.1 tem uma estrutura de \"perguntas\": o quê, como, quando medir e quando/quem analisa — memorize essa estrutura completa, pois questões costumam testar alternativas incompletas.","resumo":"Monitorar bem exige método, quando, quem mede e quem analisa — tudo evidenciado, nada por suposição."},"22":{"resposta_correta":"b) Planejar, estabelecer, implementar e manter programa(s) de auditoria, incluindo frequência, métodos, responsabilidades, requisitos de planejamento e relato.","justificativa":"A cláusula 9.2 (Auditoria interna) exige que a organização conduza auditorias internas a intervalos planejados para fornecer informação sobre se o SGSI está em conformidade com os requisitos da própria organização e da norma, e está efetivamente implementado e mantido. Para isso, deve planejar, estabelecer, implementar e manter um ou mais programas de auditoria, definindo frequência, métodos, responsabilidades, requisitos de planejamento e relato, selecionando auditores imparciais e objetivos e assegurando que os resultados sejam relatados à direção pertinente.","analisa":"- a) A auditoria interna deve ocorrer em intervalos planejados de forma sistemática, e não apenas ser desencadeada por não conformidades graves já identificadas.\n- c) Auditoria externa (de certificação) não substitui a auditoria interna, que é um requisito próprio do SGSI (cláusula 9.2) independente do processo de certificação por terceira parte.","dica":"Auditoria interna é parte obrigatória do SGSI (9.2), diferente da auditoria de certificação (externa) — não confunda os dois papéis.","resumo":"Auditoria interna é planejada e sistemática, com programa formal — não é \"bombeiro\" só para apagar incêndio."},"23":{"resposta_correta":"b) A situação das ações de análises críticas anteriores, mudanças nas questões internas/externas, feedback sobre o desempenho da segurança da informação, resultados da avaliação de riscos, e oportunidades para melhoria contínua.","justificativa":"A cláusula 9.3.2 (Entradas de análise crítica pela Direção) lista um conjunto específico de entradas obrigatórias: situação de ações de análises críticas anteriores; mudanças em questões externas/internas pertinentes ao SGSI; mudanças nas necessidades/expectativas das partes interessadas; feedback sobre o desempenho da segurança da informação (não conformidades e ações corretivas, resultados de monitoramento/medição, resultados de auditoria, cumprimento de objetivos); feedback de partes interessadas; resultados da avaliação de riscos e situação do plano de tratamento de riscos; e oportunidades para melhoria contínua.","analisa":"- a) Restringir as entradas apenas a auditorias bem-sucedidas exclui itens obrigatórios como não conformidades, resultados de risco e feedback de partes interessadas.\n- c) Novas tecnologias de mercado não são uma entrada formalmente exigida pela cláusula 9.3.2; a análise crítica é orientada ao desempenho e adequação do próprio SGSI.","dica":"9.3.2 tem uma lista longa e específica de entradas — questões de prova costumam testar se alguma alternativa \"corta\" itens dessa lista, tornando-a incompleta.","resumo":"Entradas da análise crítica cobrem passado (ações anteriores), presente (desempenho, riscos, contexto) e futuro (oportunidades de melhoria)."},"24":{"resposta_correta":"b) Decisões relativas às oportunidades para melhoria contínua e necessidades de mudanças do SGSI, e devem ser disponibilizadas como informação documentada.","justificativa":"A cláusula 9.3.3 (Resultados de análise crítica pela Direção) exige que os resultados incluam decisões relacionadas a oportunidades de melhoria contínua e a quaisquer necessidades de mudança no SGSI, e que a organização retenha informação documentada como evidência dos resultados das análises críticas pela Direção.","analisa":"- a) Uma simples lista de problemas não é o mesmo que decisões formais sobre melhoria e mudança, que é o que a cláusula exige como saída da análise crítica.\n- c) A cláusula exige explicitamente que os resultados sejam retidos como informação documentada; recomendações não documentadas não atendem a esse requisito.","dica":"Toda análise crítica pela Direção gera decisões documentadas — não apenas discussões informais.","resumo":"Resultado da análise crítica = decisões sobre melhoria/mudança, sempre documentadas como evidência."},"25":{"resposta_correta":"b) Melhorar continuamente a pertinência, a adequação e a eficácia do SGSI.","justificativa":"A cláusula 10.1 (Melhoria contínua), na estrutura de 2022, exige que a organização melhore continuamente a pertinência, a adequação e a eficácia do SGSI — reforçando a lógica de ciclo PDCA contínuo, e não de um projeto com data de término.","analisa":"- a) Tratar o SGSI como projeto de conclusão única contraria a própria natureza de sistema de gestão, que deve operar de forma cíclica e permanente.\n- c) Corrigir falhas apenas quando ocorrem é uma postura reativa, associada à gestão de não conformidades (10.2); a melhoria contínua (10.1) é proativa e não depende de falhas para acontecer.","dica":"Na versão 2022, a ordem da cláusula 10 mudou: primeiro 10.1 (Melhoria contínua), depois 10.2 (Não conformidade e ação corretiva) — inversão em relação à versão 2013. É um detalhe que a prova gosta de cobrar.","resumo":"SGSI nunca \"termina\": melhoria contínua é regra permanente, não reação a incidentes."},"26":{"resposta_correta":"b) Reagir à não conformidade, tomar ações para controlá-la e corrigi-la, lidar com as consequências e avaliar a necessidade de ações para eliminar as causas.","justificativa":"A cláusula 10.2 (Não conformidade e ação corretiva) exige que, ao ocorrer uma não conformidade, a organização reaja a ela, tomando ação para controlá-la e corrigi-la e lidando com as consequências; avalie a necessidade de ação para eliminar a(s) causa(s) raiz, de forma que não se repita ou ocorra em outro lugar, por meio de análise crítica da não conformidade, determinação das causas e verificação de não conformidades similares; implemente as ações necessárias; analise criticamente a eficácia de qualquer ação corretiva tomada; e faça mudanças no SGSI, se necessário.","analisa":"- a) Documentar e ignorar contraria diretamente a exigência de reação ativa e de tratamento das causas da não conformidade.\n- c) A norma foca em processos e causas raiz, não em atribuição de culpa individual — uma abordagem punitiva não é o objetivo do tratamento de não conformidades no SGSI.","dica":"Ação corretiva ≠ apenas correção pontual. A correção resolve o sintoma imediato; a ação corretiva ataca a causa raiz para evitar recorrência — distinção clássica de prova.","resumo":"Não conformidade: reaja, corrija, trate a causa raiz e verifique a eficácia — nunca apenas registre ou culpe alguém."},"27":{"resposta_correta":"b) Definir, aprovar pela direção, publicar, comunicar, e analisar criticamente em intervalos planejados e quando ocorrerem mudanças significativas.","justificativa":"O controle A.5.1 (Políticas para segurança da informação) do Anexo A exige que a política de segurança da informação e políticas de temas específicos sejam definidas, aprovadas pela direção, publicadas, comunicadas e reconhecidas pelo pessoal pertinente e partes interessadas relevantes, e analisadas criticamente em intervalos planejados e quando ocorrerem mudanças significativas.","analisa":"- a) Um rascunho armazenado sem aprovação, publicação nem comunicação não atende a nenhuma das etapas formais exigidas pelo controle.\n- c) A aprovação deve partir da direção (nível de gestão apropriado), não pode ser delegada a alguém sem autoridade e responsabilidade formal sobre a política.","dica":"A.5.1 tem o mesmo \"ciclo de vida\" da política que aparece na cláusula 5.2, mas no Anexo A é detalhado como controle: definir → aprovar → publicar → comunicar → revisar.","resumo":"Política sem aprovação da direção e sem comunicação formal não é política válida, é rascunho."},"28":{"resposta_correta":"b) Definir e alocar papéis e responsabilidades pela segurança da informação de acordo com as necessidades da organização.","justificativa":"O controle A.5.2 (Papéis e responsabilidades pela segurança da informação) exige que os papéis e responsabilidades pela segurança da informação sejam definidos e alocados de acordo com as necessidades da organização, complementando a exigência de atribuição e comunicação já prevista na cláusula 5.3.","analisa":"- a) A ausência de papéis específicos gera lacunas de responsabilidade e conflitos de governança, sendo o oposto do que o controle busca evitar.\n- c) Permitir que cada funcionário defina suas próprias responsabilidades tira da organização o controle formal sobre a estrutura de governança de segurança da informação, contrariando o controle.","dica":"A.5.2 é o \"braço operacional\" da cláusula 5.3 — a diferença é que a cláusula fala em atribuir/comunicar e o controle detalha definir/alocar conforme as necessidades organizacionais.","resumo":"Papéis de segurança devem ser definidos pela organização, nunca definidos livremente por cada indivíduo."},"29":{"resposta_correta":"b) Segregação de funções, onde funções conflitantes e áreas de responsabilidade devem ser segregadas.","justificativa":"O controle A.5.3 (Segregação de funções) determina que funções e áreas de responsabilidade conflitantes devem ser segregadas, reduzindo o risco de modificação não autorizada ou não intencional, ou de uso indevido dos ativos da organização — um controle preventivo típico contra fraude e erro por acúmulo de poderes em uma única pessoa.","analisa":"- a) Treinamento adicional trata competência e conscientização (7.2/7.3), mas não elimina o risco estrutural de uma mesma pessoa concentrar funções incompatíveis.\n- c) Auditoria anual é um controle de detecção posterior, não de prevenção; ela não resolve o problema estrutural de concentração de funções conflitantes.","dica":"Segregação de funções (SoD) é clássica de auditoria e de controles internos — sempre que a questão descrever alguém acumulando funções incompatíveis (ex.: solicitar e aprovar pagamento), pense em A.5.3.","resumo":"Funções conflitantes juntas = risco de fraude; a solução é segregar, não treinar mais."},"30":{"resposta_correta":"b) Requerer que todo o pessoal aplique a segurança da informação de acordo com a política e os procedimentos da organização.","justificativa":"O controle A.5.4 (Responsabilidades da direção) exige que a direção requeira que todo o pessoal aplique a segurança da informação de acordo com a política de segurança da informação estabelecida, as políticas de temas específicos e os procedimentos da organização, reforçando na prática o \"tone at the top\" (comprometimento visível da liderança).","analisa":"- a) Tratar segurança como responsabilidade exclusiva da TI contraria a visão da norma de que segurança da informação é responsabilidade de toda a organização, capitaneada pela direção.\n- c) Distribuir a política sem cobrar leitura/aplicação não demonstra responsabilidade efetiva da direção, apenas cumprimento formal e superficial.","dica":"A.5.4 reforça que segurança da informação não é \"problema de TI\" — é responsabilidade de gestão em toda a organização, cobrada pela direção.","resumo":"Direção não apenas publica a política — ela exige e cobra sua aplicação por todos."},"31":{"resposta_correta":"b) Estabelecer e manter contato com as autoridades relevantes.","justificativa":"O controle A.5.5 (Contato com autoridades) exige que a organização estabeleça e mantenha contato com autoridades relevantes (ex.: autoridades policiais, órgãos reguladores, autoridades de proteção de dados, corpo de bombeiros), o que apoia respostas a incidentes, conformidade legal e continuidade de negócios.","analisa":"- a) Fortalecer firewall é um controle técnico (Anexo A, tema Tecnológico), não relacionado ao relacionamento institucional com autoridades externas.\n- c) Aumentar reuniões internas trata de comunicação interna, não do relacionamento formal com autoridades externas exigido pelo controle A.5.5.","dica":"Contato com autoridades (A.5.5) costuma ser citado em cenários de resposta a incidentes com necessidade de notificação legal (ex.: LGPD/GDPR) ou investigação policial.","resumo":"A.5.5 = manter \"linha aberta\" com órgãos externos (polícia, reguladores) antes de precisar deles em uma crise."},"32":{"resposta_correta":"b) Estabelecer e manter contato com grupos de interesse especial ou com outros fóruns de especialistas em segurança e associações profissionais.","justificativa":"O controle A.5.6 (Contato com grupos de interesse especial) recomenda que a organização estabeleça e mantenha contato com grupos de interesse especial, fóruns especializados em segurança e associações profissionais, o que ajuda a organização a se manter atualizada sobre boas práticas, tendências de ameaças e mudanças regulatórias.","analisa":"- a) Limitar contato externo é contrário ao propósito do controle, que é justamente incentivar a troca de informações com a comunidade de segurança.\n- c) O controle não trata de terceirização de atividades de segurança via consultoria, e sim de participação em redes de conhecimento e compartilhamento de informações.","dica":"A.5.5 (autoridades) e A.5.6 (grupos de interesse especial) costumam ser confundidos — A.5.5 é institucional/regulatório, A.5.6 é técnico/profissional (comunidade de segurança).","resumo":"A.5.6 é sobre \"rede de contatos\" com especialistas e associações profissionais de segurança, não sobre isolamento."},"33":{"resposta_correta":"b) Coletar e analisar informações relacionadas a ameaças à segurança da informação para produzir inteligência de ameaças.","justificativa":"O controle A.5.7 (Inteligência de ameaças), novo na versão 2022, exige que a organização colete e analise informações relacionadas a ameaças à segurança da informação para produzir inteligência de ameaças (threat intelligence), permitindo ações proativas e informadas de mitigação de riscos, considerando fontes estratégicas, táticas e operacionais.","analisa":"- a) Instalar antivírus é um controle técnico específico (relacionado a proteção contra malware, Anexo A tema Tecnológico), não o controle de inteligência de ameaças.\n- c) Treinar funcionários contra phishing é conscientização (ligado a 7.3 e A.6.3), uma ação de mitigação pontual, não o processo estruturado de coleta e análise de inteligência de ameaças exigido pelo A.5.7.","dica":"A.5.7 é um dos controles \"novos\" de 2022 — questões de certificação adoram testar os 11 controles novos (5.7, 5.23, 5.30, 7.4, 8.9, 8.10, 8.11, 8.12, 8.16, 8.23, 8.28).","resumo":"Threat intelligence = coletar e analisar dados de ameaças para agir de forma proativa, não apenas reativa."},"34":{"resposta_correta":"b) Integrar a segurança da informação ao gerenciamento de projetos.","justificativa":"O controle A.5.8 (Segurança da informação no gerenciamento de projetos) exige que a segurança da informação seja integrada à metodologia de gerenciamento de projetos da organização, para garantir que os riscos de segurança sejam identificados e tratados ao longo de todo o ciclo de vida do projeto — abordagem conhecida como \"security by design\".","analisa":"- a) Tratar segurança como etapa final do projeto é exatamente o antipadrão que o controle busca corrigir — segurança deve ser considerada desde o início (design), não apenas ao final.\n- c) Realizar testes de penetração somente no fim do ciclo é reativo e tardio; problemas estruturais de segurança identificados tarde são muito mais caros e difíceis de corrigir.","dica":"Quando o enunciado descrever um projeto onde a segurança \"só foi lembrada no final\", a resposta quase sempre remete ao A.5.8 e ao conceito de security by design.","resumo":"Segurança da informação entra no projeto desde o dia 1, não como última tarefa antes do go-live."},"35":{"resposta_correta":"b) Desenvolver e manter um inventário de informações e outros ativos associados, incluindo proprietários.","justificativa":"O controle A.5.9 (Inventário de informações e outros ativos associados) exige que a organização desenvolva e mantenha um inventário de informações e outros ativos associados, incluindo os proprietários (owners), como base para todo o processo de classificação, gestão de risco e controle de acesso — não é possível proteger o que não se sabe que existe.","analisa":"- a) Comprar mais ativos não resolve o problema de controle e rastreabilidade; na verdade, sem inventário, mais ativos apenas aumentam a superfície de risco desconhecida.\n- c) Depender da memória informal dos funcionários é o oposto de um inventário formal, documentado e atualizado, indo contra o propósito do controle.","dica":"A.5.9 é o alicerce de vários outros controles (classificação A.5.12, rótulo A.5.13, controle de acesso A.5.15) — sem inventário, esses controles não conseguem ser aplicados de forma consistente.","resumo":"Não dá para proteger o que não está inventariado e sem um dono (owner) claro."},"36":{"resposta_correta":"b) Identificar, documentar e implementar regras para o uso aceitável e procedimentos para o manuseio de informações e outros ativos associados.","justificativa":"O controle A.5.10 (Uso aceitável de informações e outros ativos associados) exige que a organização identifique, documente e implemente regras para o uso aceitável e procedimentos para o manuseio de informações e outros ativos associados, comunicando essas regras a quem usa ou tem acesso a esses ativos.","analisa":"- a) Bloquear indiscriminadamente todos os sites é uma medida técnica desproporcional e não corresponde ao propósito do controle, que é estabelecer regras claras de uso, não uma restrição total.\n- c) Monitoramento constante sem transparência levanta questões legais e éticas (privacidade) e não é o foco do controle, que trata de definição e comunicação de regras de uso aceitável.","dica":"A.5.10 é frequentemente confundido com controles técnicos de bloqueio; lembre-se que ele é sobre regras/política de uso aceitável (governança), não sobre a ferramenta técnica em si.","resumo":"Uso aceitável = regras claras e comunicadas, não bloqueio cego nem vigilância sem transparência."},"37":{"resposta_correta":"b) Que o pessoal e outras partes interessadas, conforme apropriado, devolvam todos os ativos da organização em sua posse após a mudança ou o encerramento da contratação ou acordo.","justificativa":"O controle A.5.11 (Devolução de ativos) exige que o pessoal e outras partes interessadas, conforme apropriado, devolvam todos os ativos da organização em sua posse mediante a mudança ou o encerramento de sua contratação, contrato ou acordo — devendo esse processo estar formalizado, geralmente ligado ao processo de offboarding.","analisa":"- a) Confiar apenas na boa-fé não constitui um controle formal e verificável, deixando a organização exposta ao risco de retenção indevida de ativos e informações.\n- c) Um lembrete tardio (após um mês) não atende à exigência de que a devolução ocorra no momento da mudança/encerramento do vínculo, quando o risco de retenção é maior.","dica":"A.5.11 está diretamente ligado ao processo de offboarding — sempre que a questão citar \"ex-funcionário\" ou \"encerramento de contrato\" e ativos não devolvidos, pense neste controle.","resumo":"Devolução de ativos deve ser parte formal e imediata do desligamento, não um \"favor\" de boa vontade."},"38":{"resposta_correta":"b) Classificar as informações de acordo com as necessidades de segurança da informação da organização, com base na confidencialidade, integridade, disponibilidade e requisitos das partes interessadas relevantes.","justificativa":"O controle A.5.12 (Classificação da informação) exige que a informação seja classificada de acordo com as necessidades de segurança da informação da organização, com base na confidencialidade, integridade, disponibilidade e requisitos relevantes das partes interessadas — permitindo aplicar proteção proporcional ao valor e à sensibilidade de cada informação.","analisa":"- a) Tratar tudo como \"altamente confidencial\" ignora a lógica de proporcionalidade da classificação, gera custo desnecessário e dilui a atenção que deveria ser dada às informações realmente críticas.\n- c) Criptografar tudo indiscriminadamente é uma medida técnica (relacionada a controles como A.8.24), não substitui o processo de classificação, que é a base para decidir qual proteção (incluindo criptografia) é adequada a cada nível.","dica":"Classificação (A.5.12) não é sinônimo de \"tudo secreto\" — é sobre aplicar o nível certo de proteção com base em critérios objetivos (CID) e não em excesso de zelo.","resumo":"Classificar é dosar a proteção conforme o valor real da informação, não tratar tudo como top secret."},"39":{"resposta_correta":"b) Um conjunto adequado de procedimentos para rotulagem de informações de acordo com o esquema de classificação de informações adotado.","justificativa":"O controle A.5.13 (Rotulagem da informação) exige que um conjunto adequado de procedimentos para rotulagem de informações seja desenvolvido e implementado de acordo com o esquema de classificação de informações adotado pela organização (A.5.12), tornando visível e identificável o nível de proteção exigido para cada ativo de informação.","analisa":"- a) Controle de acesso é tratado no A.5.15/A.8.3; embora relacionado, não é o controle específico de rotulagem cobrado nesta questão.\n- c) Auditoria externa é uma atividade de verificação, não de implementação prática do esquema de rotulagem exigido pelo controle.","dica":"A.5.12 (classificar) e A.5.13 (rotular) andam sempre juntos: primeiro classifica-se, depois rotula-se de forma consistente com o esquema adotado.","resumo":"Depois de classificar, é preciso rotular — sem rótulo visível, ninguém sabe como tratar a informação corretamente."},"40":{"resposta_correta":"b) Regras, procedimentos ou acordos de transferência de informações para todos os tipos de recursos de transferência dentro da organização e entre a organização e outras partes.","justificativa":"O controle A.5.14 (Transferência de informação) exige que regras, procedimentos ou acordos de transferência de informações sejam estabelecidos para todos os tipos de recursos de transferência (eletrônicos, físicos, verbais) dentro da organização e entre a organização e outras partes, cobrindo diferentes canais de comunicação.","analisa":"- a) Restringir a solução a apenas um canal (e-mail criptografado) ignora outros meios de transferência (físico, verbal, outras plataformas eletrônicas) que também precisam de regras.\n- c) Permitir que cada departamento adote seu próprio método, sem regras organizacionais unificadas, gera inconsistência e aumenta o risco de vazamento de informações.","dica":"A.5.14 cobre transferência em qualquer meio — eletrônico, físico e verbal — não apenas e-mail; questões de prova gostam de restringir indevidamente essa amplitude.","resumo":"Transferência de informação precisa de regras organizacionais únicas para todo canal, não soluções isoladas por departamento."},"41":{"resposta_correta":"b) Estabelecer e implementar regras para controlar o acesso físico e lógico às informações e a outros ativos associados com base nos requisitos de segurança da informação e de negócios.","justificativa":"O controle A.5.15 (Controle de acesso) exige que regras para controlar o acesso físico e lógico às informações e a outros ativos associados sejam estabelecidas e implementadas com base nos requisitos de segurança da informação e de negócios, incorporando princípios como \"necessidade de conhecer\" e \"necessidade de uso\" (need-to-know/need-to-use).","analisa":"- a) Remover controles de acesso é diretamente contrário ao propósito do controle, que existe justamente para proteger ativos contra acesso não autorizado.\n- c) Focar apenas no acesso físico deixa de fora o acesso lógico (sistemas, redes, dados), que é igualmente exigido pelo controle A.5.15.","dica":"A.5.15 unifica controle de acesso físico E lógico sob uma única política — a norma 2022 tratou isso de forma mais integrada do que a versão 2013.","resumo":"Controle de acesso cobre físico e lógico ao mesmo tempo, baseado em necessidade real de negócio."},"42":{"resposta_correta":"b) O ciclo de vida completo das identidades.","justificativa":"O controle A.5.16 (Gestão de identidade) exige que o ciclo de vida completo das identidades seja gerenciado — desde a criação/provisionamento, passando por alterações (mudança de função, promoção), até a desativação/remoção quando a identidade não é mais necessária, garantindo unicidade e rastreabilidade das identidades atribuídas a pessoas e sistemas.","analisa":"- a) Gerenciar apenas a criação deixa de fora etapas críticas como modificação e, principalmente, desativação de identidades obsoletas, que são fontes comuns de risco (contas órfãs).\n- c) Contar o número total de identidades é apenas uma métrica, não um processo de gestão do ciclo de vida exigido pelo controle.","dica":"\"Ciclo de vida completo\" é a expressão-chave de A.5.16 — sempre que aparecer uma alternativa tratando só de \"criação\" ou só de \"contagem\", ela estará incompleta.","resumo":"Gestão de identidade vai do nascimento à morte da conta — criar, modificar e desativar."},"43":{"resposta_correta":"b) A alocação e a gestão de informações de autenticação por uma gestão de processo, incluindo aconselhar o pessoal sobre o manuseio adequado.","justificativa":"O controle A.5.17 (Informação de autenticação), novo/renomeado na versão 2022, exige que a alocação e a gestão de informações de autenticação (senhas, tokens, chaves, biometria) sejam controladas por um processo de gestão, incluindo o aconselhamento ao pessoal sobre o manuseio adequado dessas informações — abrangendo muito mais do que apenas senhas tradicionais.","analisa":"- a) Complexidade de senha é apenas um parâmetro técnico específico dentro de um universo maior de \"informação de autenticação\", que inclui outros fatores e mecanismos.\n- c) Frequência de redefinição é também apenas um parâmetro operacional isolado, e boas práticas atuais até desaconselham trocas forçadas frequentes sem motivo — o controle é mais amplo, sobre gestão de todo o ciclo de informação de autenticação.","dica":"A.5.17 substituiu e ampliou o antigo controle de \"gestão de senhas\" da versão 2013 — hoje cobre qualquer tipo de informação de autenticação, não só senhas.","resumo":"Autenticação vai além de senha: é um processo de gestão completo, com orientação clara ao usuário."},"44":{"resposta_correta":"b) Provisionar, analisar criticamente, modificar e remover direitos de acesso às informações e a outros ativos associados de acordo com a política e as regras da organização para o controle de acesso.","justificativa":"O controle A.5.18 (Direitos de acesso) exige que os direitos de acesso a informações e outros ativos associados sejam provisionados, analisados criticamente, modificados e removidos de acordo com a política e as regras da organização para controle de acesso (A.5.15) — cobrindo todo o ciclo do direito de acesso, tipicamente alinhado ao fluxo joiner-mover-leaver.","analisa":"- a) Uma revogação genérica anual não substitui um processo contínuo de gestão baseado em eventos (admissão, mudança de cargo, desligamento), que é o que o controle realmente exige.\n- c) Permitir autoatribuição de direitos de acesso pelos próprios usuários contraria o princípio de controle formal e de aprovação baseada em necessidade de negócio.","dica":"Associe A.5.18 ao ciclo \"joiner-mover-leaver\" (admissão-mudança-desligamento) — é o padrão mais cobrado em provas de certificação para esse controle.","resumo":"Direitos de acesso são geridos evento a evento (entrada, mudança, saída), nunca só uma vez por ano."},"45":{"resposta_correta":"b) Processos e procedimentos para gerenciar a segurança da informação e os riscos associados com o uso dos produtos ou serviços dos fornecedores.","justificativa":"O controle A.5.19 (Segurança da informação nas relações com fornecedores) exige que a organização defina e implemente processos e procedimentos para gerenciar os riscos de segurança da informação associados ao uso de produtos ou serviços de fornecedores, considerando o tipo de fornecedor e o nível de acesso a informações da organização.","analisa":"- a) Um contrato genérico e único não considera as diferenças de risco entre tipos de fornecedores (ex.: um fornecedor de nuvem crítica vs. um fornecedor de material de escritório), o que o controle exige que seja diferenciado.\n- c) Auditar fornecedores apenas reativamente, após um incidente, contraria a postura preventiva exigida — a gestão de risco de fornecedores deve ser contínua e proativa.","dica":"A.5.19, A.5.20, A.5.21 e A.5.22 formam a \"família\" de controles de fornecedores — cada um trata de um aspecto diferente (gestão geral, contrato, cadeia de suprimentos de TIC, monitoramento contínuo).","resumo":"Gestão de risco de fornecedor é processo estruturado e diferenciado por tipo de fornecedor, não contrato genérico ou reação a incidente."},"46":{"resposta_correta":"b) Estabelecer e acordar requisitos relevantes de segurança da informação com cada fornecedor, com base no tipo de relacionamento.","justificativa":"O controle A.5.20 (Abordagem da segurança da informação nos acordos com fornecedores) exige que requisitos relevantes de segurança da informação sejam estabelecidos e acordados com cada fornecedor, de acordo com o tipo de relacionamento com o fornecedor (ex.: acesso a dados sensíveis, criticidade do serviço, nível de integração).","analisa":"- a) Assumir que o fornecedor já possui controles adequados, sem formalizar exigências contratuais, expõe a organização a riscos não gerenciados e não é aceito pela norma.\n- c) Uma cláusula genérica de conformidade legal não substitui requisitos técnicos e organizacionais específicos de segurança da informação exigidos pelo controle.","dica":"A.5.20 exige requisitos \"sob medida\" conforme o tipo de relação com o fornecedor — cuidado com alternativas que propõem soluções únicas e genéricas para todos os fornecedores.","resumo":"Cada fornecedor tem seu próprio nível de risco; os requisitos contratuais de segurança devem refletir isso."},"47":{"resposta_correta":"b) Processos e procedimentos para gerenciar os riscos da segurança da informação associados à cadeia de fornecimento de produtos e serviços de TIC.","justificativa":"O controle A.5.21 (Gerenciando a segurança da informação na cadeia de fornecimento de TIC), novo na versão 2022, exige processos e procedimentos para gerenciar os riscos de segurança da informação associados à cadeia de fornecimento (supply chain) de produtos e serviços de TIC — considerando riscos que se propagam por múltiplos níveis de subfornecedores.","analisa":"- a) Um inventário de hardware é útil para gestão de ativos (A.5.9/A.8.1), mas não trata especificamente do risco propagado pela cadeia de fornecimento de TIC.\n- c) Simplesmente reduzir o número de fornecedores não é a exigência do controle, que é gerenciar o risco existente na cadeia (independentemente de sua extensão), não necessariamente diminuí-la numericamente.","dica":"A.5.21 é um dos 11 controles novos de 2022, e reflete preocupações reais com ataques via cadeia de suprimentos (supply chain attacks), tema muito atual em segurança.","resumo":"Risco de TIC não para no fornecedor direto — a cadeia toda (subfornecedores) precisa ser gerenciada."},"48":{"resposta_correta":"b) Monitorar, analisar criticamente, avaliar e gerenciar regularmente a mudança nas práticas da segurança da informação dos fornecedores e na prestação de serviços.","justificativa":"O controle A.5.22 (Monitoramento, análise crítica e gestão de mudanças de serviços de fornecedores) exige que a organização monitore, analise criticamente, avalie e gerencie regularmente a mudança nas práticas de segurança da informação dos fornecedores e na prestação de seus serviços — um processo contínuo, não pontual.","analisa":"- a) Confiar sem verificação contraria a exigência de monitoramento ativo e contínuo do desempenho de segurança do fornecedor ao longo do relacionamento.\n- c) Uma avaliação apenas no início do contrato (due diligence inicial) não é suficiente; o controle exige acompanhamento regular durante toda a vigência do relacionamento, já que as práticas do fornecedor podem mudar com o tempo.","dica":"A relação entre A.5.19 (gestão geral), A.5.20 (contrato) e A.5.22 (monitoramento contínuo) forma o ciclo de vida completo da gestão de fornecedores: antes, durante a contratação e durante toda a execução do serviço.","resumo":"Gerir fornecedor não termina na assinatura do contrato — o monitoramento é contínuo, do início ao fim do serviço."},"49":{"resposta_correta":"b) Processos de aquisição, uso, gestão e saída de serviços em nuvem de acordo com os requisitos da segurança da informação da organização.","justificativa":"O controle A.5.23 (Segurança da informação para uso de serviços em nuvem), novo na versão 2022, exige o estabelecimento de processos para aquisição, uso, gestão e saída (exit strategy) de serviços em nuvem, de acordo com os requisitos de segurança da informação da organização — incluindo cláusulas de reversibilidade e portabilidade dos dados ao final do contrato.","analisa":"- a) Considerar apenas custo e benefício financeiro ignora os requisitos de segurança da informação, que são o foco central do controle.\n- c) Escolher provedores apenas pelo porte não garante que os requisitos de segurança da organização estejam contemplados; o controle exige um processo estruturado de avaliação e gestão, não apenas o critério de tamanho do fornecedor.","dica":"A.5.23 é um dos controles novos de 2022 e enfatiza a \"estratégia de saída\" (exit strategy) da nuvem — item frequentemente esquecido nas contratações, mas exigido pela norma.","resumo":"Nuvem segura cobre todo o ciclo: aquisição, uso, gestão e, principalmente, saída planejada."},"50":{"resposta_correta":"b) Planejar e se preparar para gerenciar incidentes da segurança da informação, definindo, estabelecendo e comunicando processos, papéis e responsabilidades.","justificativa":"O controle A.5.24 (Planejamento e preparação da gestão de incidentes de segurança da informação) exige que a organização planeje e se prepare para gerenciar incidentes de segurança da informação definindo, estabelecendo e comunicando os processos, papéis e responsabilidades de gestão de incidentes, antes que eles efetivamente ocorram.","analisa":"- a) Reagir apenas quando os incidentes ocorrem, sem preparação prévia, é exatamente o cenário que o controle busca evitar — a exigência é de planejamento antecipado.\n- c) Contratar especialista apenas após um ataque é uma resposta tardia; a organização já deveria ter papéis e processos definidos antes do incidente acontecer.","dica":"Toda a sequência de controles A.5.24 a A.5.28 segue a lógica de um ciclo de gestão de incidentes: preparar → avaliar/decidir → responder → aprender → coletar evidências.","resumo":"Gestão de incidentes começa antes do incidente: planejamento e papéis definidos com antecedência."},"51":{"resposta_correta":"b) Avaliar os eventos da segurança da informação e decidir se categoriza como incidentes da segurança da informação.","justificativa":"O controle A.5.25 (Avaliação e decisão sobre eventos de segurança da informação) exige que a organização avalie os eventos de segurança da informação e decida se devem ser categorizados como incidentes de segurança da informação, com base em critérios previamente definidos — nem todo evento é automaticamente um incidente.","analisa":"- a) Tratar todo evento como incidente gera \"fadiga de alarme\" e desperdício de recursos com falsos positivos, indo contra a lógica de triagem exigida pelo controle.\n- c) Ignorar eventos menores sem avaliação contraria o requisito de que todos os eventos relatados devem ser avaliados antes de qualquer decisão sobre sua categorização.","dica":"Diferencie \"evento\" (algo observado que pode ou não ter significado de segurança) de \"incidente\" (evento confirmado, categorizado como violação/ameaça) — essa distinção é a essência do A.5.25.","resumo":"Nem todo evento vira incidente — a triagem (avaliação e decisão) é o que faz essa diferenciação."},"52":{"resposta_correta":"b) De acordo com os procedimentos documentados.","justificativa":"O controle A.5.26 (Resposta a incidentes de segurança da informação) exige que os incidentes de segurança da informação sejam respondidos de acordo com procedimentos documentados, o que assegura consistência, rastreabilidade e conformidade legal/regulatória na resposta, independentemente de quem esteja de plantão.","analisa":"- a) Uma resposta ad-hoc, sem procedimento padronizado, gera inconsistência e aumenta o risco de erros críticos durante situações de crise.\n- c) Depender apenas da experiência individual torna a resposta vulnerável à rotatividade de pessoal e à falta de padronização, o que o controle busca evitar por meio de procedimentos formais.","dica":"Toda vez que a prova opuser \"procedimento documentado\" a \"ad-hoc\"/\"experiência individual\", a resposta correta quase sempre será o procedimento documentado — padrão comum em vários controles do Anexo A.","resumo":"Responder a incidente é seguir o playbook documentado, não improvisar na hora."},"53":{"resposta_correta":"b) Usar o conhecimento adquirido com incidentes de segurança da informação para fortalecer e melhorar os controles da segurança da informação.","justificativa":"O controle A.5.27 (Aprendizado com incidentes de segurança da informação) exige que o conhecimento adquirido a partir de incidentes de segurança da informação seja usado para fortalecer e melhorar os controles de segurança da informação, retroalimentando o ciclo de melhoria contínua do SGSI (ligação direta com a cláusula 10.1).","analisa":"- a) Apenas documentar sem extrair lições e agir sobre elas desperdiça o valor da experiência adquirida com o incidente, não atendendo ao propósito do controle.\n- c) Esquecer o incidente é o oposto do que a norma exige — o objetivo é justamente reter e aplicar o aprendizado para prevenir recorrências.","dica":"A.5.27 é a ponte entre gestão de incidentes (Anexo A) e melhoria contínua (cláusula 10.1) — um exemplo claro de como o Anexo A e o corpo da norma se conectam.","resumo":"Todo incidente deve virar aprendizado que fortalece os controles, nunca deve ser só arquivado ou esquecido."},"54":{"resposta_correta":"b) Procedimentos para identificação, coleta, aquisição e preservação de evidências relacionadas a eventos da segurança da informação.","justificativa":"O controle A.5.28 (Coleta de evidências) exige que a organização estabeleça e implemente procedimentos para identificação, coleta, aquisição e preservação de evidências relacionadas a eventos de segurança da informação, assegurando cadeia de custódia adequada para eventuais ações disciplinares, judiciais ou regulatórias.","analisa":"- a) Câmeras de segurança são um controle físico específico (relacionado à área física), não o processo abrangente de coleta forense de evidências digitais e não digitais exigido pelo controle.\n- c) Confiar apenas em logs de sistema é insuficiente; evidências podem incluir muito mais que registros de log, e sem procedimentos formais de coleta/preservação, a integridade da evidência pode ser questionada.","dica":"A.5.28 remete a conceitos forenses: cadeia de custódia, integridade e admissibilidade legal da evidência — sempre que a prova falar em \"evidência para processo legal/disciplinar\", pense neste controle.","resumo":"Evidência de incidente precisa de procedimento formal de coleta e preservação, não apenas logs soltos."},"55":{"resposta_correta":"b) Como manter a segurança da informação em um nível apropriado durante a disrupção.","justificativa":"O controle A.5.29 (Segurança da informação durante a disrupção) exige que a organização planeje como manter a segurança da informação em um nível apropriado durante uma disrupção (ex.: desastre, pandemia, falha grave), garantindo que os controles essenciais continuem funcionando mesmo em condições adversas.","analisa":"- a) Focar apenas na recuperação de dados ignora outros aspectos da segurança da informação (confidencialidade, controle de acesso, integridade de processos) que também precisam ser mantidos durante a disrupção.\n- c) Desligar todos os sistemas de forma indiscriminada pode comprometer a continuidade do negócio e não corresponde à exigência de manter a segurança em \"nível apropriado\", que pressupõe operação controlada, não paralisação total.","dica":"Não confunda A.5.29 (manter segurança durante a disrupção) com A.5.30 (prontidão de TIC para continuidade) — o primeiro é sobre \"segurança durante a crise\", o segundo é sobre \"capacidade técnica de recuperação\".","resumo":"Mesmo em crise, a segurança da informação não pode ser abandonada — deve ser mantida em nível apropriado."},"56":{"resposta_correta":"b) Planejar, implementar, manter e testar a prontidão de TIC com base nos objetivos de continuidade de negócios e nos requisitos de continuidade da TIC.","justificativa":"O controle A.5.30 (Prontidão de TIC para continuidade de negócios), novo na versão 2022, exige que a prontidão de TIC seja planejada, implementada, mantida e testada com base nos objetivos de continuidade de negócios e nos requisitos de continuidade de TIC, assegurando que a infraestrutura tecnológica suporte a recuperação do negócio dentro dos prazos definidos (RTO/RPO).","analisa":"- a) Ter apenas backup é uma medida técnica pontual, insuficiente para garantir prontidão completa de TIC (que envolve infraestrutura redundante, planos de recuperação, testes etc.).\n- c) Assumir que o plano funcionará sem testá-lo é uma das falhas mais comuns e criticadas em auditorias — o controle exige explicitamente que a prontidão seja testada.","dica":"A.5.30 é outro controle novo de 2022 e reforça que continuidade de negócio sem testes de TIC é apenas \"teoria no papel\" — teste é parte obrigatória do controle.","resumo":"Prontidão de TIC = planejar, implementar, manter E testar — sem teste, não há garantia real de continuidade."},"57":{"resposta_correta":"b) Identificar, documentar e atualizar os requisitos legais, estatutários, regulamentares e contratuais pertinentes à segurança da informação e à abordagem da organização para atender a esses requisitos.","justificativa":"O controle A.5.31 (Requisitos legais, estatutários, regulamentares e contratuais) exige que a organização identifique, documente e mantenha atualizados os requisitos legais, estatutários, regulamentares e contratuais pertinentes à segurança da informação, bem como a abordagem da organização para atender a esses requisitos — geralmente materializado em um registro de requisitos legais.","analisa":"- a) Cumprir apenas as leis \"mais óbvias\" é uma abordagem incompleta e arriscada, pois pode deixar de fora requisitos setoriais, contratuais ou regulatórios específicos igualmente obrigatórios.\n- c) Contratar assessoria jurídica apenas reativamente, após surgir um problema, é uma postura tardia — o controle exige identificação e monitoramento contínuo e proativo dos requisitos aplicáveis.","dica":"A.5.31 costuma ser materializado num \"registro de requisitos legais e regulatórios\" — documento clássico pedido em auditorias e usado como evidência deste controle.","resumo":"Conformidade legal exige identificação, documentação e atualização contínua — nunca reação de última hora."},"58":{"resposta_correta":"b) Procedimentos adequados para proteger os direitos de propriedade intelectual.","justificativa":"O controle A.5.32 (Direitos de propriedade intelectual) exige que a organização implemente procedimentos adequados para proteger os direitos de propriedade intelectual, o que inclui não apenas patentes, mas também direitos autorais, marcas registradas, segredos comerciais e conformidade com licenças de software.","analisa":"- a) Registrar patentes é apenas uma forma específica de proteção de propriedade intelectual; o controle exige uma abordagem mais ampla, incluindo, por exemplo, conformidade com licenciamento de software de terceiros.\n- c) Compartilhar propriedade intelectual livremente é exatamente o oposto do propósito do controle, que visa proteger, e não expor, os ativos intangíveis da organização.","dica":"Cuidado: propriedade intelectual não é só sobre o que a organização cria e protege, mas também sobre respeitar direitos de terceiros (ex.: uso de software licenciado corretamente) — ambos os lados são cobrados pelo A.5.32.","resumo":"Propriedade intelectual vai além de patente: inclui direitos autorais, marcas e conformidade com licenças de terceiros."},"59":{"resposta_correta":"b) Proteger os registros contra perdas, destruição, falsificação, acesso não autorizado e liberação não autorizada.","justificativa":"O controle A.5.33 (Proteção de registros) exige que os registros sejam protegidos contra perda, destruição, falsificação, acesso não autorizado e liberação não autorizada, considerando também os requisitos legais, regulatórios, contratuais e de negócio relacionados à retenção e disposição de registros.","analisa":"- a) Backup trata apenas do risco de perda/destruição; não protege contra falsificação nem contra acesso ou liberação não autorizados, ambos exigidos pelo controle.\n- c) Migrar tudo para papel é impraticável em escala e não elimina riscos como falsificação, extravio físico ou acesso não autorizado — não é a solução proposta pela norma, que é agnóstica quanto ao meio, desde que devidamente protegido.","dica":"A.5.33 tem uma lista de cinco ameaças aos registros (perda, destruição, falsificação, acesso não autorizado, liberação não autorizada) — decore essas cinco dimensões, pois alternativas parciais (como \"apenas backup\") costumam ser a pegadinha.","resumo":"Registro protegido é aquele blindado contra perda, adulteração e acesso/divulgação indevidos — não só contra perda."},"60":{"resposta_correta":"b) Identificar e atender aos requisitos relativos à preservação da privacidade e à proteção de DP, de acordo com as leis e os regulamentos aplicáveis e requisitos contratuais.","justificativa":"O controle A.5.34 (Privacidade e proteção de dados pessoais - DP/PII) exige que a organização identifique e atenda aos requisitos relativos à preservação da privacidade e à proteção de dados pessoais, conforme leis, regulamentos aplicáveis (como LGPD/GDPR) e requisitos contratuais, o que pode envolver a designação de responsável (ex.: DPO/Encarregado) e políticas específicas de tratamento de DP.","analisa":"- a) Consentimento é apenas uma das bases legais possíveis para tratamento de dados pessoais e um item específico de conformidade; o controle exige uma abordagem completa a todos os requisitos legais e contratuais aplicáveis, não apenas o consentimento.\n- c) Minimização de dados é uma boa prática e um princípio de privacidade (data minimization), mas isoladamente não cumpre toda a exigência do controle, que é identificar e atender ao conjunto de requisitos aplicáveis de privacidade e proteção de DP.","dica":"A.5.34 conecta a ISO 27001 a legislações de proteção de dados (LGPD, GDPR) — é comum a prova cruzar este controle com cenários de vazamento de dados pessoais ou exercício de direitos do titular.","resumo":"Proteção de dados pessoais exige atender ao conjunto de exigências legais/contratuais, não só pedir consentimento."},"61":{"resposta_correta":"b) Analisar criticamente, de forma independente, a abordagem da organização para gerenciar a segurança da informação e sua implementação, a intervalos planejados ou quando ocorrerem mudanças significativas.","justificativa":"O controle A.5.35 (Análise crítica independente da segurança da informação) exige que a abordagem da organização para gerenciar a segurança da informação e sua implementação (incluindo pessoas, processos e tecnologias) seja analisada criticamente de forma independente, a intervalos planejados ou quando ocorrerem mudanças significativas — a independência é o elemento central, geralmente exigindo alguém sem responsabilidade direta pela área avaliada.","analisa":"- a) Restringir a apenas \"realizar auditorias internas\" ignora o requisito específico de independência de quem realiza a análise em relação à abordagem geral de gestão de segurança, que pode envolver revisores distintos da função de auditoria interna padrão.\n- c) Deixar a análise crítica a cargo da própria equipe de segurança contraria diretamente o requisito de independência, já que essa equipe é parte interessada direta na gestão avaliada (haveria conflito de interesse/autoavaliação).","dica":"A.5.35 exige \"independência\" no sentido de quem revisa não pode ser quem implementa/gerencia diretamente o que está sendo revisado — não confundir com a auditoria interna do capítulo 9.2, embora possam se complementar.","resumo":"Quem implementa a segurança não deve ser quem avalia de forma independente sua própria implementação."},"62":{"resposta_correta":"b) Analisar criticamente o compliance da política de segurança da informação da organização, políticas, regras e normas de temas específicos a intervalos regulares.","justificativa":"O controle A.5.36 (Compliance com políticas, regras e normas para segurança da informação) exige que a organização analise criticamente, a intervalos regulares, o compliance do tratamento da informação e dos procedimentos em sua área de responsabilidade com a política de segurança da informação, políticas de temas específicos, regras e normas aplicáveis, verificando de fato se o que está definido é praticado.","analisa":"- a) Assumir compliance sem verificação contraria o próprio propósito do controle, que é justamente checar, de forma ativa, se as políticas estão sendo seguidas.\n- c) Apenas informar sobre as políticas é uma ação de comunicação/conscientização (mais próxima de 7.3/A.6.3), não a verificação de conformidade exigida pelo A.5.36.","dica":"Não confunda A.5.35 (análise crítica independente de toda a abordagem de gestão de segurança) com A.5.36 (compliance específico com políticas/regras/normas) — o primeiro é mais estratégico/amplo, o segundo é mais operacional/pontual.","resumo":"Ter política não basta: é preciso verificar regularmente se ela está sendo cumprida na prática."},"63":{"resposta_correta":"b) Documentar os procedimentos de operação dos recursos de tratamento da informação e disponibilizá-los para o pessoal que necessite deles.","justificativa":"O controle A.5.37 (Procedimentos documentados de operação) exige que os procedimentos de operação dos recursos de tratamento da informação sejam documentados e disponibilizados ao pessoal que deles necessite, garantindo consistência e reduzindo a dependência de conhecimento tácito de indivíduos específicos.","analisa":"- a) Treinamento apenas verbal, sem documentação formal, não garante consistência nem rastreabilidade, e o conhecimento se perde facilmente com rotatividade de pessoal.\n- c) Restringir a documentação apenas a novas funcionalidades deixa desatualizados ou inexistentes os procedimentos de operações já existentes, que também precisam estar documentados e disponíveis.","dica":"A.5.37 fecha o bloco organizacional (5.1 a 5.37) — costuma aparecer em cenários de \"conhecimento na cabeça de uma única pessoa\" (bus factor), que é exatamente o risco que este controle mitiga.","resumo":"Procedimento operacional deve estar escrito e acessível a quem precisa, não apenas na cabeça de alguém."},"64":{"resposta_correta":"b) Realizar verificações de antecedentes de todos os candidatos a serem contratados antes de ingressarem na organização e de modo contínuo, de acordo com as leis, os regulamentos e a ética aplicáveis.","justificativa":"O controle A.6.1 (Seleção), primeiro controle do tema Pessoas do Anexo A, exige que verificações de antecedentes de todos os candidatos a serem contratados sejam realizadas antes de seu ingresso na organização e de forma contínua, levando em conta as leis, os regulamentos e a ética aplicáveis, e proporcionais aos requisitos de negócio, à classificação das informações a serem acessadas e aos riscos percebidos.","analisa":"- a) Verificar apenas o currículo (autodeclarado pelo candidato) não constitui uma checagem independente de antecedentes, que é o que o controle exige.\n- c) Selecionar apenas com base em experiência profissional ignora completamente os aspectos de idoneidade e conformidade legal que a checagem de antecedentes visa cobrir.","dica":"A.6.1 exige checagem tanto na admissão quanto \"de modo contínuo\" — muitas provas cobram justamente esse aspecto contínuo, que vai além da checagem única no momento da contratação.","resumo":"Seleção segura é checagem de antecedentes contínua e proporcional ao risco, não apenas leitura de currículo."},"65":{"resposta_correta":"b) Declarar as responsabilidades do pessoal e da organização para a segurança da informação nos contratos trabalhistas.","justificativa":"O controle A.6.2 (Termos e condições de contratação) exige que os acordos contratuais de trabalho declarem as responsabilidades do pessoal e da organização em relação à segurança da informação, formalizando expectativas e obrigações desde o início do vínculo empregatício.","analisa":"- a) Um contrato genérico, sem cláusulas específicas de segurança da informação, não atende à exigência de declarar explicitamente as responsabilidades de ambas as partes nesse tema.\n- c) Acordos verbais não têm força formal nem rastreabilidade, sendo incompatíveis com o requisito de que essas responsabilidades sejam formalmente estabelecidas nos termos contratuais.","dica":"A.6.2 é o ponto de entrada formal das obrigações de segurança da informação na relação de trabalho — geralmente evidenciado por cláusulas específicas no contrato de trabalho ou em anexo/termo assinado.","resumo":"Responsabilidades de segurança da informação devem estar escritas no contrato de trabalho, não em combinado verbal."},"66":{"resposta_correta":"b) Que o pessoal da organização e partes interessadas relevantes recebam treinamento, educação e conscientização apropriados e atualizações regulares da política e dos procedimentos, pertinentes para suas funções.","justificativa":"O controle A.6.3 (Conscientização, educação e treinamento em segurança da informação) exige que o pessoal da organização e as partes interessadas relevantes recebam treinamento, educação e conscientização apropriados em segurança da informação, além de atualizações regulares da política de segurança da informação, políticas de temas específicos e procedimentos, relevantes para suas funções.","analisa":"- a) Tornar o treinamento opcional contraria diretamente a natureza obrigatória do controle, que visa garantir um nível mínimo e uniforme de conscientização em toda a organização.\n- c) Restringir o treinamento à equipe de TI ignora que todo o pessoal, e não apenas a área técnica, lida com informações e riscos de segurança em suas atividades diárias.","dica":"A.6.3 é o controle \"irmão\" da cláusula 7.3 (Conscientização) do corpo da norma — a cláusula estabelece o requisito geral, o controle detalha a prática (treinamento contínuo e atualizado, adaptado à função).","resumo":"Conscientização e treinamento são para todos, contínuos e ajustados à função de cada um — nunca opcionais ou restritos à TI."},"67":{"resposta_correta":"b) Formalizar e comunicar um processo disciplinar para tomar ações contra pessoal e outras partes interessadas relevantes que tenham cometido uma violação da política da segurança da informação.","justificativa":"O controle A.6.4 (Processo disciplinar) exige que um processo disciplinar seja formalizado e comunicado para tomar ações contra pessoal e outras partes interessadas relevantes que tenham cometido uma violação da política de segurança da informação, assegurando tratamento justo, proporcional e consistente das infrações.","analisa":"- a) Demissão sumária sem processo formal desrespeita o requisito de um processo estruturado (que geralmente inclui apuração, direito de defesa e proporcionalidade), além de expor a organização a riscos trabalhistas.\n- c) Ignorar violações mina a eficácia de toda a política de segurança da informação e contraria diretamente a exigência de que ações sejam tomadas diante de infrações comprovadas.","dica":"O processo disciplinar (A.6.4) deve ser formal, comunicado previamente (as pessoas precisam saber que ele existe) e aplicado de forma consistente — não é sobre punir na hora nem sobre \"deixar barato\".","resumo":"Violação de política de segurança gera processo disciplinar formal, nem punição sumária nem impunidade."},"68":{"resposta_correta":"b) As responsabilidades e funções de segurança da informação que permaneçam válidas após o encerramento ou a mudança da contratação devem ser definidas, aplicadas e comunicadas ao pessoal e a outras partes interessadas pertinentes.","justificativa":"O controle A.6.5 (Responsabilidades após encerramento ou mudança da contratação) exige que as responsabilidades e obrigações de segurança da informação que permanecem válidas após o término ou a mudança da relação de trabalho (ex.: obrigações de confidencialidade contínua) sejam definidas, aplicadas e comunicadas de forma clara ao pessoal e a outras partes interessadas pertinentes.","analisa":"- a) Apenas revogar o acesso trata do aspecto técnico de offboarding (relacionado ao A.5.18), mas não cobre a comunicação formal das obrigações que continuam vigentes após o desligamento, como confidencialidade pós-contratual.\n- c) Delegar o tema inteiramente ao jurídico, de forma reativa e apenas se surgir problema, contraria a exigência de que essas obrigações sejam comunicadas proativamente no momento do desligamento ou mudança.","dica":"A.6.5 lembra que segurança da informação \"não acaba no último dia de trabalho\" — obrigações como sigilo podem continuar válidas por tempo determinado após o desligamento.","resumo":"Algumas obrigações de segurança sobrevivem ao fim do contrato; elas devem ser comunicadas claramente no desligamento."},"69":{"resposta_correta":"b) Identificar, documentar, analisar criticamente em intervalos regulares e assinar acordos de confidencialidade ou não divulgação que reflitam as necessidades da organização para a proteção das informações.","justificativa":"O controle A.6.6 (Acordos de confidencialidade ou não divulgação) exige que acordos de confidencialidade ou não divulgação (NDAs) que reflitam as necessidades da organização para a proteção da informação sejam identificados, documentados, analisados criticamente em intervalos regulares e assinados pelo pessoal e demais partes interessadas relevantes.","analisa":"- a) Confiar apenas na palavra das partes não oferece nenhuma proteção legal formal, o que contraria diretamente a exigência de formalização por escrito exigida pelo controle.\n- c) Restringir o uso de NDAs apenas para informações \"altamente secretas\" ignora que o controle recomenda que esses acordos reflitam as necessidades reais de proteção da organização, que podem envolver diferentes níveis de sensibilidade, não apenas o mais alto.","dica":"Repare que o controle exige análise crítica periódica dos NDAs, não apenas a assinatura única no início do relacionamento — os acordos devem ser revisados conforme mudam as necessidades da organização.","resumo":"NDA não é assinado uma vez e esquecido: deve ser revisado periodicamente e refletir as reais necessidades de proteção."},"70":{"resposta_correta":"b) Medidas de segurança para proteger as informações acessadas, tratadas ou armazenadas fora das instalações da organização.","justificativa":"O controle A.6.7 (Trabalho remoto) exige que medidas de segurança sejam implementadas quando o pessoal trabalha remotamente, para proteger as informações acessadas, tratadas ou armazenadas fora das instalações da organização — considerando aspectos como segurança física do ambiente doméstico, conexões seguras, uso de dispositivos e política de trabalho remoto.","analisa":"- a) Fornecer apenas o equipamento (laptop) não garante, por si só, que as informações estejam protegidas — faltam medidas complementares como VPN, criptografia, política de uso e conscientização.\n- c) Deixar a segurança inteiramente a cargo do funcionário, sem diretrizes e controles organizacionais, contraria a exigência de que a organização implemente e assegure medidas de segurança formais para o trabalho remoto.","dica":"A.6.7 ganhou grande relevância após a popularização do home office/trabalho híbrido — é um controle frequentemente cobrado em cenários pós-pandemia nas provas de certificação.","resumo":"Trabalho remoto seguro exige medidas organizacionais formais, não apenas entregar um laptop e torcer."},"71":{"resposta_correta":"b) Um mecanismo para que as pessoas relatem eventos da segurança da informação observados ou suspeitos por meio de canais apropriados em tempo hábil.","justificativa":"O controle A.6.8 (Relato de eventos de segurança da informação) exige que a organização forneça um mecanismo para que o pessoal relate eventos de segurança da informação observados ou suspeitos por meio de canais apropriados em tempo hábil, o que é essencial para que a fase de avaliação/decisão (A.5.25) e resposta a incidentes (A.5.26) funcione de forma eficaz.","analisa":"- a) Restringir o canal de relato apenas à alta direção cria um gargalo e desestimula relatos rápidos por parte de quem primeiro observa o evento, geralmente pessoal operacional.\n- c) Um sistema de recompensa não é o mecanismo central exigido pelo controle; o foco é garantir a existência de um canal claro, acessível e ágil para relato, independentemente de incentivos financeiros.","dica":"A.6.8 é a \"porta de entrada\" de todo o processo de gestão de incidentes do Anexo A — sem um bom mecanismo de relato, os controles A.5.24 a A.5.28 não têm insumo para funcionar.","resumo":"Sem canal simples e rápido de relato, ninguém avisa a tempo sobre um evento de segurança."},"72":{"resposta_correta":"b) Definir e usar perímetros de segurança para proteger áreas que contenham informações e outros ativos associados.","justificativa":"O controle A.7.1 (Perímetros de segurança física), primeiro controle do tema Físico do Anexo A, exige que perímetros de segurança sejam definidos e usados para proteger áreas que contenham informações e outros ativos associados — como paredes, portões controlados ou balcões de recepção com controle de acesso, formando camadas de proteção física (defesa em profundidade).","analisa":"- a) Câmeras na entrada são apenas um elemento de vigilância (mais relacionado ao A.7.4, monitoramento), não a definição estrutural do perímetro físico em si, que envolve barreiras e limites de área.\n- c) Permitir acesso irrestrito contraria diretamente o propósito do controle, que é justamente delimitar e restringir o acesso físico a áreas que contêm ativos de informação.","dica":"Pense em perímetros de segurança física como \"camadas de cebola\": quanto mais crítico o ativo, mais camadas de perímetro devem protegê-lo (defesa em profundidade).","resumo":"Antes de controlar quem entra, é preciso definir onde estão os limites (perímetros) das áreas protegidas."},"73":{"resposta_correta":"b) Proteger as áreas seguras por controles de entrada e pontos de acesso apropriados.","justificativa":"O controle A.7.2 (Entrada física) exige que áreas seguras sejam protegidas por controles de entrada e pontos de acesso apropriados, garantindo que somente pessoal autorizado tenha acesso, através de mecanismos como catracas, leitores de crachá, biometria ou outros meios de controle de entrada.","analisa":"- a) Um crachá que serve apenas como identificação visual, sem um mecanismo efetivo de controle de acesso (como leitura eletrônica com liberação condicionada), não impede fisicamente a entrada não autorizada.\n- c) Depender exclusivamente de vigilância manual, sem controles de entrada sistemáticos (eletrônicos ou mecânicos), é uma medida isolada e sujeita a falhas humanas, insuficiente como controle único.","dica":"A.7.1 define os limites (perímetro); A.7.2 controla quem atravessa esses limites (entrada) — os dois controles são complementares e sequenciais.","resumo":"Não basta ter um perímetro; é preciso controlar ativamente quem entra por ele."},"74":{"resposta_correta":"b) Projetar e implementar segurança física para escritórios, salas e instalações.","justificativa":"O controle A.7.3 (Segurança de escritórios, salas e instalações) exige que a segurança física para escritórios, salas e instalações seja projetada e implementada de forma planejada, considerando a criticidade e sensibilidade das atividades e ativos ali localizados — não uma medida isolada e pontual.","analisa":"- a) Apenas trancar portas ao final do expediente é uma medida isolada e limitada a um horário específico, não uma proteção física projetada e contínua conforme exige o controle.\n- c) Instalar alarmes sem um sistema de resposta associado torna a detecção inútil na prática, pois um alarme disparado sem ação subsequente não impede nem mitiga o incidente.","dica":"A.7.3 exige que a segurança física seja \"projetada\", ou seja, planejada previamente com base em análise de risco do ambiente — não improvisada ou parcial.","resumo":"Segurança de escritório é projeto pensado, não apenas trancar a porta à noite."},"75":{"resposta_correta":"b) Monitorar continuamente as instalações para acesso físico não autorizado.","justificativa":"O controle A.7.4 (Monitoramento de segurança física), novo na versão 2022, exige que as instalações sejam monitoradas continuamente quanto a acesso físico não autorizado, por meio de mecanismos como CFTV, sistemas de detecção de intrusão, guardas ou alarmes integrados a um centro de monitoramento.","analisa":"- a) Inspeções a
