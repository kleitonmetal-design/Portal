<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro da Equipe - CSU Digital PCI DSS 4.0.1</title>
    <style>
        :root {
            --brand-primary: #ffb366;
            --brand-secondary: #ffc480;
            --brand-dark: #2a2a2a;
            --text-dark: #1a1a1a;
            --text-gray: #b0b0b0;
            --text-light: #ffffff;
            --success: #10b981;
            --error: #ef4444;
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1f1f1f 0%, #2d2d2d 100%);
            min-height: 100vh;
            color: var(--text-light);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header-brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .badge-client {
            display: inline-block;
            background: rgba(255, 179, 102, 0.15);
            color: var(--brand-primary);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 179, 102, 0.3);
        }

        h1 {
            font-size: 2em;
            color: var(--text-light);
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--text-gray);
            font-size: 1em;
        }

        .card-form {
            background: rgba(45, 45, 45, 0.95);
            border-radius: 16px;
            padding: 36px;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(255, 179, 102, 0.2);
            backdrop-filter: blur(12px);
            margin-bottom: 40px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 0.9em;
            font-weight: 600;
            color: var(--brand-primary);
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #555;
            background: #222;
            color: white;
            font-size: 0.95em;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(255, 179, 102, 0.2);
        }

        button.btn-submit {
            width: 100%;
            padding: 14px 28px;
            border-radius: 8px;
            border: none;
            background: var(--brand-primary);
            color: #222;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button.btn-submit:hover {
            background: var(--brand-secondary);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 179, 102, 0.3);
        }

        /* Notifications */
        .notification {
            padding: 14px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.95em;
            font-weight: 600;
        }

        .notification.success {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
            display: block;
        }

        .notification.error {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
            display: block;
        }

        /* Registered Members List */
        .members-section {
            background: rgba(35, 35, 35, 0.9);
            border-radius: 16px;
            padding: 28px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .members-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .members-title {
            font-size: 1.2em;
            font-weight: 700;
            color: white;
        }

        .count-badge {
            background: var(--brand-primary);
            color: #222;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9em;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        th {
            color: var(--brand-primary);
            font-weight: 600;
        }

        .role-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .role-coordenador { background: rgba(168, 85, 247, 0.2); color: #c084fc; }
        .role-operacional { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .role-executivo { background: rgba(234, 179, 8, 0.2); color: #fde047; }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--brand-primary);
            text-decoration: none;
            font-size: 0.9em;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="./index.html" class="back-link">← Voltar ao Portal GuardianTech</a>

        <div class="header-brand">
            <span class="badge-client">CSU Digital · PCI DSS v4.0.1</span>
            <h1>Cadastro da Equipe do Projeto</h1>
            <p class="subtitle">Cadastre os integrantes da equipe que participarão da auditoria e entrega de evidências.</p>
        </div>

        <!-- Form Card -->
        <div class="card-form">
            <div id="notification" class="notification"></div>

            <form id="team-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nome">Nome Completo *</label>
                        <input type="text" id="nome" required placeholder="Ex: Marina Souza">
                    </div>

                    <div class="form-group">
                        <label for="email">E-mail Corporativo *</label>
                        <input type="email" id="email" required placeholder="exemplo@csudigital.com.br">
                    </div>

                    <div class="form-group">
                        <label for="area">Área / Departamento *</label>
                        <select id="area" required>
                            <option value="">Selecione a área...</option>
                            <option value="Infraestrutura e Redes">Infraestrutura e Redes</option>
                            <option value="Segurança da Informação">Segurança da Informação</option>
                            <option value="Sistemas e Desenvolvimento">Sistemas e Desenvolvimento</option>
                            <option value="RH e Pessoas">RH e Pessoas</option>
                            <option value="Financeiro / Contabilidade">Financeiro / Contabilidade</option>
                            <option value="Operações / Atendimento">Operações / Atendimento</option>
                            <option value="Compliance e Risco">Compliance e Risco</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="cargo">Cargo / Função</label>
                        <input type="text" id="cargo" placeholder="Ex: Analista de Segurança Senior">
                    </div>

                    <div class="form-group full-width">
                        <label for="perfil">Perfil de Atuação no Projeto *</label>
                        <select id="perfil" required>
                            <option value="operacional">Ponto Focal Operacional (Responsável por enviar evidências dos requisitos)</option>
                            <option value="coordenador">Ponto Focal Coordenador (Gestão geral do projeto e atribuição de equipe)</option>
                            <option value="executivo">Ponto Focal Executivo (Acompanhamento e visualização de relatórios)</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btn-save">
                    <span>Cadastrar Integrante</span> →
                </button>
            </form>
        </div>

        <!-- Registered Team Table -->
        <div class="members-section">
            <div class="members-header">
                <div class="members-title">Equipe Cadastrada no Projeto</div>
                <div class="count-badge" id="member-count">0 integrantes</div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Área</th>
                            <th>Cargo</th>
                            <th>Perfil</th>
                        </tr>
                    </thead>
                    <tbody id="members-list">
                        <tr>
                            <td colspan="5" style="text-align: center; color: var(--text-gray);">Carregando equipe...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        const SUPABASE_URL = 'https://zprzmhavbjiggqfzzzbt.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_zucE5w9pyxnkXU0r3A8LYQ_ERuwax9r';
        const PROJETO_ID = '11111111-1111-1111-1111-111111111111'; // CSU Digital

        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function showNotification(msg, isSuccess = true) {
            const el = document.getElementById('notification');
            el.textContent = msg;
            el.className = `notification ${isSuccess ? 'success' : 'error'}`;
            setTimeout(() => {
                el.className = 'notification';
            }, 5000);
        }

        function getRoleBadge(perfil) {
            switch(perfil) {
                case 'coordenador': return '<span class="role-badge role-coordenador">Coordenador</span>';
                case 'executivo': return '<span class="role-badge role-executivo">Executivo</span>';
                default: return '<span class="role-badge role-operacional">Operacional</span>';
            }
        }

        async function carregarEquipe() {
            const listEl = document.getElementById('members-list');
            const countEl = document.getElementById('member-count');
            
            try {
                const { data, error } = await client
                    .from('usuarios_internos')
                    .select('*')
                    .eq('projeto_id', PROJETO_ID)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    listEl.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-gray);">Nenhum integrante cadastrado ainda.</td></tr>';
                    countEl.textContent = '0 integrantes';
                    return;
                }

                countEl.textContent = `${data.length} integrante${data.length > 1 ? 's' : ''}`;

                listEl.innerHTML = data.map(m => `
                    <tr>
                        <td><strong>${escapeHtml(m.nome)}</strong></td>
                        <td>${escapeHtml(m.email)}</td>
                        <td>${escapeHtml(m.area)}</td>
                        <td>${escapeHtml(m.cargo || '-')}</td>
                        <td>${getRoleBadge(m.perfil)}</td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Erro ao carregar equipe:', err);
                listEl.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--error);">Erro ao carregar lista de integrantes.</td></tr>';
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        document.getElementById('team-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-save');
            btn.disabled = true;
            btn.innerHTML = '<span>Salvando...</span>';

            const payload = {
                projeto_id: PROJETO_ID,
                nome: document.getElementById('nome').value.trim(),
                email: document.getElementById('email').value.trim(),
                area: document.getElementById('area').value,
                cargo: document.getElementById('cargo').value.trim() || null,
                perfil: document.getElementById('perfil').value,
                ativo: true
            };

            try {
                const { data, error } = await client
                    .from('usuarios_internos')
                    .insert([payload]);

                if (error) {
                    if (error.code === '23505') {
                        throw new Error('Este e-mail já está cadastrado no sistema.');
                    }
                    throw error;
                }

                showNotification(`✅ ${payload.nome} cadastrado(a) com sucesso!`);
                document.getElementById('team-form').reset();
                carregarEquipe();
            } catch (err) {
                showNotification(`⚠️ Erro: ${err.message || 'Não foi possível salvar o cadastro.'}`, false);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>Cadastrar Integrante</span> →';
            }
        });

        // Carregar a lista ao abrir a página
        carregarEquipe();
    </script>
</body>
</html>
