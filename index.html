<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuardianTech - Portal de Serviços</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 60px;
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .card-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 1.5em;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        .card-description {
            font-size: 0.95em;
            color: #666;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .card-link {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            align-self: flex-start;
        }

        .card-link:hover {
            opacity: 0.9;
            transform: translateX(3px);
        }

        footer {
            text-align: center;
            color: white;
            opacity: 0.8;
            font-size: 0.9em;
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2em;
            }

            .grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>GuardianTech</h1>
            <p>Central de Serviços e Automações</p>
        </header>

        <div id="portal-content">
            <p style="text-align: center; color: white; opacity: 0.8;">Carregando links...</p>
        </div>

        <footer>
            <p>&copy; 2024 GuardianTech Consultoria. Todos os direitos reservados.</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        const SUPABASE_URL = 'https://zprzmhavbjiggqfzzzbt.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_zucE5w9pyxnkXU0r3A8LYQ_ERuwax9r';
        const CATEGORIA_ORDEM = ['Sistemas', 'Painéis PCI DSS', 'Chilli Beans', 'Simulados ISO 27001'];

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        function safeUrl(url) {
            return /^(https?:|\.\/|\/)/i.test(url) ? url : '#';
        }

        function cardHtml(link) {
            const url = safeUrl(link.url);
            const target = url.startsWith('http') ? ' target="_blank"' : '';
            return `
                <a href="${escapeHtml(url)}"${target} class="card">
                    <div>
                        <div class="card-icon">${escapeHtml(link.icone) || '🔗'}</div>
                        <div class="card-title">${escapeHtml(link.titulo)}</div>
                        <div class="card-description">${escapeHtml(link.descricao)}</div>
                    </div>
                    <div class="card-link">Acessar →</div>
                </a>`;
        }

        function renderPortal(links) {
            const container = document.getElementById('portal-content');
            const porCategoria = {};
            links.forEach(link => {
                if (!porCategoria[link.categoria]) porCategoria[link.categoria] = [];
                porCategoria[link.categoria].push(link);
            });

            const categorias = [
                ...CATEGORIA_ORDEM.filter(c => porCategoria[c]),
                ...Object.keys(porCategoria).filter(c => !CATEGORIA_ORDEM.includes(c))
            ];

            container.innerHTML = categorias.map((categoria, i) => `
                <section${i > 0 ? ' style="margin-top: 80px;"' : ''}>
                    ${i > 0 ? `<h2 style="text-align: center; color: white; font-size: 2.5em; margin-bottom: 50px;">${escapeHtml(categoria)}</h2>` : ''}
                    <div class="grid">
                        ${porCategoria[categoria].map(cardHtml).join('')}
                    </div>
                </section>
            `).join('');
        }

        async function carregarPortal() {
            const container = document.getElementById('portal-content');
            try {
                const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                const { data, error } = await client
                    .from('links')
                    .select('*')
                    .eq('ativo', true)
                    .order('categoria', { ascending: true })
                    .order('ordem', { ascending: true });

                if (error) throw error;
                if (!data || data.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: white;">Nenhum link cadastrado.</p>';
                    return;
                }
                renderPortal(data);
            } catch (err) {
                console.error('Erro ao carregar links do Portal:', err);
                container.innerHTML = '<p style="text-align: center; color: white;">Erro ao carregar os links. Tente novamente mais tarde.</p>';
            }
        }

        carregarPortal();
    </script>
</body>
</html>
