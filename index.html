<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2b2b2b">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>GuardianTech Portal</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
:root{
  --brand:#ffb366; --brand-2:#ffc480; --brand-ink:#2b2b2b;
  --bg:#2f2f2f; --bg-2:#3a3a3a; --surface:#3d3d3d; --surface-2:#474747;
  --text:#f4f4f4; --text-2:#c4c4c4; --border:#5a5a5a;
  --ok:#5bd38a; --shadow:0 8px 24px rgba(0,0,0,.25); --radius:14px;
}
:root[data-theme="light"]{
  --bg:#f6f3ef; --bg-2:#ffffff; --surface:#ffffff; --surface-2:#f1ece6;
  --text:#1f1f1f; --text-2:#4a4a4a; --border:#ddd3c8; --brand-ink:#1f1f1f;
  --brand:#c76a12; --brand-2:#e08a35; --shadow:0 6px 18px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:150px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Verdana,Arial,sans-serif;
  background:linear-gradient(135deg,var(--bg) 0%,var(--bg-2) 100%) fixed;color:var(--text);
  line-height:1.6;min-height:100vh}
body.leitura{font-family:Verdana,Tahoma,sans-serif;letter-spacing:.03em;word-spacing:.12em;line-height:1.8}
a{color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--brand);color:var(--brand-ink);padding:8px 14px;border-radius:8px;z-index:2000}
.skip:focus{left:8px}

/* Cabeçalho */
.site-header{position:sticky;top:0;z-index:1000;background:color-mix(in srgb,var(--bg) 94%,transparent);
  backdrop-filter:blur(12px);border-bottom:2px solid var(--brand);box-shadow:var(--shadow)}
.header-row{max-width:1400px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.2em;color:var(--brand);text-decoration:none;white-space:nowrap}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:10px 70px 10px 14px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:1em}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:.75em;color:var(--text-2);
  border:1px solid var(--border);border-radius:6px;padding:2px 6px;background:var(--surface-2)}
.tools{display:flex;gap:8px}
.icon-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;
  padding:9px 12px;cursor:pointer;font-size:.9em;font-weight:600}
.icon-btn[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.nav{max-width:1400px;margin:0 auto;padding:0 24px 12px;display:flex;flex-wrap:wrap;gap:8px}
.nav a{padding:7px 14px;border-radius:8px;background:color-mix(in srgb,var(--brand) 16%,transparent);color:var(--brand);
  text-decoration:none;font-weight:600;font-size:.92em;border:2px solid transparent}
.nav a:hover,.nav a.active{background:var(--brand);color:var(--brand-ink)}

/* Conteúdo */
main{max-width:1400px;margin:0 auto;padding:24px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 24px;align-items:center}
.filters span{color:var(--text-2);font-size:.9em;margin-right:4px}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 14px;
  cursor:pointer;font-size:.9em}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
section.grupo{margin-bottom:48px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.sec-head h2{font-size:1.5em;color:var(--text)}
.badge{background:var(--brand);color:var(--brand-ink);border-radius:8px;padding:2px 10px;font-weight:700;font-size:.85em}
.sub{color:var(--text-2);font-size:.95em;margin:-8px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{position:relative;display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;text-decoration:none;color:var(--text);transition:transform .2s,box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:var(--shadow)}
.card .ico{font-size:1.7em;line-height:1;flex:0 0 44px;height:44px;display:grid;place-items:center;border-radius:10px;background:var(--surface-2)}
.card h3{font-size:1.02em;line-height:1.35;margin-bottom:4px;padding-right:28px}
.card p{color:var(--text-2);font-size:.9em}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:.78em;color:var(--text-2)}
.tag{border:1px solid var(--border);border-radius:6px;padding:1px 7px}
.tag.novo{border-color:var(--ok);color:var(--ok)}
.fav{position:absolute;top:10px;right:10px;border:0;background:transparent;color:var(--text-2);font-size:1.15em;cursor:pointer;padding:4px;border-radius:6px}
.fav[aria-pressed="true"]{color:var(--brand)}
.empty,.loading{color:var(--text-2);padding:24px;border:1px dashed var(--border);border-radius:var(--radius);text-align:center}
.grafana-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}
.grafana-grid iframe{width:100%;height:280px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
footer{max-width:1400px;margin:0 auto;padding:24px;color:var(--text-2);font-size:.85em;border-top:1px solid var(--border)}

/* Celular: lista compacta */
@media (max-width:600px){
  .header-row,.nav,main{padding-left:16px;padding-right:16px}
  .search{order:3;flex-basis:100%}
  .search kbd{display:none}
  .grid,.grafana-grid{grid-template-columns:1fr;gap:10px}
  .card{padding:12px}
  .card .ico{flex-basis:36px;height:36px;font-size:1.3em}
  .card p{display:none}
  .sec-head h2{font-size:1.25em}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
<!-- Cloudflare Web Analytics -->
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "41d48844df404fe999e4f71e7400a61"}'></script>
</head>
<body>
<a class="skip" href="#conteudo">Pular para o conteúdo</a>
<header class="site-header">
  <div class="header-row">
    <a href="#top" class="logo" id="top">🛡️ GuardianTech Portal</a>
    <div class="search">
      <label for="busca" class="skip">Buscar serviço</label>
      <input id="busca" type="search" placeholder="Buscar serviço, painel ou simulado" autocomplete="off">
      <kbd>Ctrl K</kbd>
    </div>
    <div class="tools">
      <button class="icon-btn" id="btn-leitura" aria-pressed="false" title="Fonte e espaçamento para leitura">Aa</button>
      <button class="icon-btn" id="btn-tema" aria-pressed="false" title="Alternar tema claro ou escuro">☀︎</button>
    </div>
  </div>
  <nav class="nav" id="nav" aria-label="Grupos"></nav>
</header>

<main id="conteudo">
  <div class="filters" id="filtros" role="group" aria-label="Filtrar por tipo"></div>
  <div id="portal"><div class="loading">Carregando serviços...</div></div>
</main>

<footer>© <span id="ano"></span> GuardianTech Consultoria. Acesso restrito.</footer>

<script>
/* ===== Configuração ===== */
const SUPABASE_URL = 'https://zprzmhavbjiggqfzzzbt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_zucE5w9pyxnkXU0r3A8LYQ_ERuwax9r';

/* Ordem das páginas (coluna "grupo" no Supabase) */
const GRUPOS = [
  {nome:'Início', sub:'Destaques e favoritos'},
  {nome:'Infraestrutura', sub:'Servidores, automações e monitoramento'},
  {nome:'Compliance e clientes', sub:'PCI DSS, ROC/AOC e plataforma Thyreos'},
  {nome:'Estudos', sub:'Simulados e materiais ISO 27001 e PCI QSA'},
  {nome:'Negócios', sub:'Chilli Beans: vendas, impostos e boletos'},
  {nome:'Produtividade', sub:'Foco, notícias e ferramentas do dia a dia'}
];
const TIPOS = ['Todos','Sistema','Painel','Ferramenta','Estudo','Planilha','Site'];
const ICONE_TIPO = {Sistema:'🖥️',Painel:'📊',Ferramenta:'🧰',Estudo:'📘',Planilha:'📗',Site:'🌐'};

/* Gráficos do Grafana. Cole aqui o link "Embed" (d-solo) de cada painel.
   Exemplo:
   {titulo:'Requisições Cloudflare', url:'https://grafana.guardiantechit.com.br/d-solo/UID/nome?orgId=1&panelId=2&theme=dark&refresh=1m'} */
const GRAFANA_PAINEIS = [];

/* ===== Utilidades ===== */
const $ = s => document.querySelector(s);
const esc = v => { const d=document.createElement('div'); d.textContent = v==null?'':String(v); return d.innerHTML; };
const safeUrl = u => /^(https?:|\.\/|\/)/i.test(u||'') ? u : '#';
const slug = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
const semEmoji = s => String(s||'').replace(/^[\p{Extended_Pictographic}️‍\s]+/u,'').trim();
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

/* ===== Estado ===== */
let LINKS = [];
let filtroTipo = 'Todos';
let busca = '';
let favoritos = new Set(store.get('gt_favoritos', []));

/* ===== Tema e leitura ===== */
function aplicarPreferencias(){
  const tema = store.get('gt_tema','dark');
  document.documentElement.dataset.theme = tema;
  $('#btn-tema').setAttribute('aria-pressed', tema==='light');
  $('#btn-tema').textContent = tema==='light' ? '☾' : '☀︎';
  const leitura = store.get('gt_leitura', false);
  document.body.classList.toggle('leitura', leitura);
  $('#btn-leitura').setAttribute('aria-pressed', leitura);
}
$('#btn-tema').onclick = () => { store.set('gt_tema', store.get('gt_tema','dark')==='dark'?'light':'dark'); aplicarPreferencias(); };
$('#btn-leitura').onclick = () => { store.set('gt_leitura', !store.get('gt_leitura',false)); aplicarPreferencias(); };

/* ===== Renderização ===== */
function dominio(u){ try{ return new URL(u, location.href).hostname.replace(/^www\./,''); }catch(e){ return ''; } }

function card(l){
  const url = safeUrl(l.url);
  const externo = /^https?:/i.test(url) && dominio(url) !== location.hostname;
  const titulo = semEmoji(l.titulo);
  const icone = l.icone || ICONE_TIPO[l.tipo] || '🔗';
  const dias = l.created_at ? (Date.now() - new Date(l.created_at)) / 864e5 : 999;
  const fav = favoritos.has(l.url);
  return `<a class="card" href="${esc(url)}"${externo?' target="_blank" rel="noopener noreferrer"':''} data-url="${esc(l.url)}">
    <span class="ico" aria-hidden="true">${esc(icone)}</span>
    <span>
      <h3>${esc(titulo)}${externo?' <span aria-label="abre em nova aba">↗</span>':''}</h3>
      <p>${esc(l.descricao)}</p>
      <span class="meta">
        ${l.tipo?`<span class="tag">${esc(l.tipo)}</span>`:''}
        ${externo?`<span class="tag">${esc(dominio(url))}</span>`:''}
        ${dias<14?'<span class="tag novo">Novo</span>':''}
      </span>
    </span>
    <button class="fav" type="button" aria-pressed="${fav}" aria-label="${fav?'Remover dos':'Adicionar aos'} favoritos" data-fav="${esc(l.url)}">${fav?'★':'☆'}</button>
  </a>`;
}

function passaFiltro(l){
  if (filtroTipo !== 'Todos' && l.tipo !== filtroTipo) return false;
  if (!busca) return true;
  const alvo = (l.titulo+' '+l.descricao+' '+l.categoria+' '+l.tipo).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  return busca.split(/\s+/).every(t => alvo.includes(t));
}

function secao(nome, sub, itens){
  if (!itens.length) return '';
  return `<section class="grupo" id="${slug(nome)}">
    <div class="sec-head"><h2>${esc(nome)}</h2><span class="badge">${itens.length}</span></div>
    ${sub?`<p class="sub">${esc(sub)}</p>`:''}
    <div class="grid">${itens.map(card).join('')}</div>
  </section>`;
}

function render(){
  const visiveis = LINKS.filter(passaFiltro);
  let html = '';

  if (!busca && filtroTipo === 'Todos'){
    const inicio = LINKS.filter(l => favoritos.has(l.url) || l.destaque);
    html += secao('Início', 'Seus favoritos (☆) e os destaques', inicio);
    if (GRAFANA_PAINEIS.length){
      html += `<section class="grupo" id="monitoramento"><div class="sec-head"><h2>Monitoramento</h2></div>
        <div class="grafana-grid">${GRAFANA_PAINEIS.map(p=>`<iframe src="${esc(safeUrl(p.url))}" title="${esc(p.titulo)}" loading="lazy"></iframe>`).join('')}</div></section>`;
    }
  }

  const nomes = [...GRUPOS.map(g=>g.nome).filter(n=>n!=='Início'), ...new Set(LINKS.map(l=>l.grupo).filter(g=>g && !GRUPOS.some(x=>x.nome===g)))];
  nomes.forEach(n => {
    const g = GRUPOS.find(x=>x.nome===n);
    html += secao(n, g?g.sub:'', visiveis.filter(l => (l.grupo||'Produtividade') === n));
  });

  $('#portal').innerHTML = html || `<div class="empty">Nada encontrado para "${esc(busca)}". Tente outra palavra.</div>`;

  $('#nav').innerHTML = [...document.querySelectorAll('section.grupo')]
    .map(s => `<a href="#${s.id}">${esc(s.querySelector('h2').textContent)}</a>`).join('');
  observarSecoes();
}

function renderFiltros(){
  $('#filtros').innerHTML = '<span>Tipo:</span>' + TIPOS.map(t =>
    `<button class="chip" type="button" aria-pressed="${t===filtroTipo}" data-tipo="${t}">${t}</button>`).join('');
}

/* ===== Eventos ===== */
$('#filtros').addEventListener('click', e => {
  const b = e.target.closest('[data-tipo]'); if(!b) return;
  filtroTipo = b.dataset.tipo; renderFiltros(); render();
});
$('#portal').addEventListener('click', e => {
  const b = e.target.closest('[data-fav]'); if(!b) return;
  e.preventDefault(); e.stopPropagation();
  const u = b.dataset.fav;
  favoritos.has(u) ? favoritos.delete(u) : favoritos.add(u);
  store.set('gt_favoritos', [...favoritos]); render();
});
let t;
$('#busca').addEventListener('input', e => {
  clearTimeout(t); t = setTimeout(()=>{ busca = e.target.value.trim().normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); render(); }, 120);
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); $('#busca').focus(); $('#busca').select(); }
  if (e.key==='Escape' && document.activeElement===$('#busca')){ $('#busca').value=''; busca=''; render(); }
});

let obs;
function observarSecoes(){
  if (obs) obs.disconnect();
  const links = [...document.querySelectorAll('#nav a')];
  obs = new IntersectionObserver(es => es.forEach(en => {
    if (en.isIntersecting) links.forEach(a => a.classList.toggle('active', a.getAttribute('href')==='#'+en.target.id));
  }), {rootMargin:'-160px 0px -65% 0px'});
  document.querySelectorAll('section.grupo').forEach(s => obs.observe(s));
}

/* ===== Dados ===== */
async function carregar(){
  try{
    const r = await fetch(`${SUPABASE_URL}/rest/v1/links?select=*&ativo=eq.true&order=grupo.asc,ordem.asc`, {
      headers:{apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`}
    });
    if (!r.ok) throw new Error('HTTP '+r.status);
    LINKS = await r.json();
    render();
  }catch(err){
    console.warn('Falha ao carregar links:', err);
    $('#portal').innerHTML = `<div class="empty">Não foi possível carregar os serviços agora.
      <br><button class="icon-btn" type="button" onclick="carregar()" style="margin-top:12px">Tentar de novo</button></div>`;
  }
}

$('#ano').textContent = new Date().getFullYear();
aplicarPreferencias();
renderFiltros();
carregar();
</script>
</body>
</html>
