<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuardianTech - Portal de Serviços</title>
    <style>
        :root {
            --brand-start: #667eea;
            --brand-end: #764ba2;
            --ink: #2b2b3a;
            --ink-soft: #666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--brand-start) 0%, var(--brand-end) 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: white;
        }

        /* Navegação fixa */
        .site-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(30, 25, 60, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.2em;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .nav-links::-webkit-scrollbar {
            display: none;
        }

        .nav-pill {
            flex-shrink: 0;
            display: inline-block;
            padding: 8px 16px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .nav-pill:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .nav-pill.active {
            background: white;
            color: var(--brand-end);
            border-color: white;
        }

        /* Hero */
        .hero {
            text-align: center;
            padding: 50px 20px 30px;
        }

        .hero h1 {
            font-size: 2.4em;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .hero p {
            font-size: 1.05em;
            opacity: 0.85;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 40px;
        }

        section {
            scroll-margin-top: 84px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.7em;
            font-weight: 700;
            margin: 56px 0 24px;
        }

        .section-title:first-of-type {
            margin-top: 0;
        }

        .section-title .count {
            font-size: 0.55em;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.15);
            padding: 3px 12px;
            border-radius: 999px;
            opacity: 0.85;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 24px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 26px;
            text-decoration: none;
            color: var(--ink);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.25);
        }

        .card-icon {
            font-size: 2.6em;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 1.3em;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--ink);
        }

        .card-description {
            font-size: 0.92em;
            color: var(--ink-soft);
            margin-bottom: 18px;
            flex-grow: 1;
            line-height: 1.4;
        }

        .card-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: linear-gradient(135deg, var(--brand-start) 0%, var(--brand-end) 100%);
            color: white;
            padding: 9px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9em;
            transition: opacity 0.2s ease, transform 0.2s ease;
            align-self: flex-start;
        }

        .card:hover .card-link {
            opacity: 0.9;
            transform: translateX(3px);
        }

        footer {
            text-align: center;
            color: white;
            opacity: 0.75;
            font-size: 0.85em;
            padding: 30px 20px 40px;
        }

        .state-msg {
            text-align: center;
            color: white;
            opacity: 0.85;
            padding: 40px 0;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 1.9em;
            }

            .nav-inner {
                gap: 12px;
            }

            .grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
        }
    </style>
</head>
<body>
    <nav class="site-nav">
        <div class="nav-inner">
            <a href="#top" class="brand">🛡️ GuardianTech</a>
            <div id="nav-links" class="nav-links"></div>
        </div>
    </nav>

    <header id="top" class="hero">
        <h1>Portal de Serviços</h1>
        <p>Central de Serviços e Automações</p>
    </header>

    <div class="container">
        <div id="portal-content">
            <p class="state-msg">Carregando links...</p>
        </div>

        <footer>
            <p>&copy; 2024 GuardianTech Consultoria. Todos os direitos reservados.</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        const SUPABASE_URL = 'https://zprzmhavbjiggqfzzzbt.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_zucE5w9pyxnkXU0r3A8LYQ_ERuwax9r';
        const CATEGORIA_ORDEM = ['Sistemas', 'Painéis PCI DSS', 'Chilli Beans', 'Simulados ISO 27001'];

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        function safeUrl(url) {
            return /^(https?:|\.\/|\/)/i.test(url) ? url : '#';
        }

        function slugify(str) {
            return String(str)
                .normalize('NFD').replace(/[̀-ͯ]/g, '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/(^-|-$)/g, '');
        }

        function cardHtml(link) {
            const url = safeUrl(link.url);
            const target = url.startsWith('http') ? ' target="_blank"' : '';
            return `
                <a href="${escapeHtml(url)}"${target} class="card">
                    <div>
                        <div class="card-icon">${escapeHtml(link.icone) || '🔗'}</div>
                        <div class="card-title">${escapeHtml(link.titulo)}</div>
                        <div class="card-description">${escapeHtml(link.descricao)}</div>
                    </div>
                    <div class="card-link">Acessar →</div>
                </a>`;
        }

        function renderPortal(links) {
            const container = document.getElementById('portal-content');
            const navLinks = document.getElementById('nav-links');
            const porCategoria = {};
            links.forEach(link => {
                if (!porCategoria[link.categoria]) porCategoria[link.categoria] = [];
                porCategoria[link.categoria].push(link);
            });

            const categorias = [
                ...CATEGORIA_ORDEM.filter(c => porCategoria[c]),
                ...Object.keys(porCategoria).filter(c => !CATEGORIA_ORDEM.includes(c))
            ];

            navLinks.innerHTML = categorias.map(categoria => `
                <a href="#${slugify(categoria)}" class="nav-pill" data-slug="${slugify(categoria)}">${escapeHtml(categoria)}</a>
            `).join('');

            container.innerHTML = categorias.map(categoria => `
                <section id="${slugify(categoria)}">
                    <h2 class="section-title">${escapeHtml(categoria)} <span class="count">${porCategoria[categoria].length}</span></h2>
                    <div class="grid">
                        ${porCategoria[categoria].map(cardHtml).join('')}
                    </div>
                </section>
            `).join('');

            setupActiveNavTracking();
        }

        function setupActiveNavTracking() {
            const sections = document.querySelectorAll('#portal-content section');
            const pills = document.querySelectorAll('.nav-pill');
            if (!sections.length || !pills.length) return;

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const slug = entry.target.id;
                        pills.forEach(pill => {
                            pill.classList.toggle('active', pill.dataset.slug === slug);
                        });
                    }
                });
            }, { rootMargin: '-100px 0px -70% 0px' });

            sections.forEach(section => observer.observe(section));
        }

        async function carregarPortal() {
            const container = document.getElementById('portal-content');
            try {
                const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                const { data, error } = await client
                    .from('links')
                    .select('*')
                    .eq('ativo', true)
                    .order('categoria', { ascending: true })
                    .order('ordem', { ascending: true });

                if (error) throw error;
                if (!data || data.length === 0) {
                    container.innerHTML = '<p class="state-msg">Nenhum link cadastrado.</p>';
                    return;
                }
                renderPortal(data);
            } catch (err) {
                console.error('Erro ao carregar links do Portal:', err);
                container.innerHTML = '<p class="state-msg">Erro ao carregar os links. Tente novamente mais tarde.</p>';
            }
        }

        carregarPortal();
    </script>
</body>
</html>
