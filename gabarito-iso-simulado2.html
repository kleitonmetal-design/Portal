<body>
    <div class="container">

        <header>
            <h1>📚 Simulado ISO 27001 Nº 2</h1>
            <p class="header-subtitle">Gabarito Comentado com Explicações Detalhadas</p>
        </header>

        <div class="controls">
            <span class="control-label">Questão:</span>
            <input type="number" id="questaoInput" min="1" max="80" value="1" style="width: 70px;">

    <script>
        const questoes = [{"numero":1,"enunciado":"Cenário 1: A empresa \"TechSolution\", especializada em desenvolvimento de software, está começando a entender a ISO 27001 para proteger suas propriedades intelectuais e dados de clientes.","resposta_correta":"b) A preservação da confidencialidade, integridade e disponibilidade da informação.","justificativa":"A ISO/IEC 27000 (norma de vocabulário do conjunto 27k, referenciada normativamente pela ISO/IEC 27001:2022) define segurança da informação exatamente como a preservação da confidencialidade, integridade e disponibilidade da informação (o tradicional \"CID\" ou \"CIA triad\"), podendo ainda envolver outras propriedades como autenticidade, responsabilidade, não repúdio e confiabilidade. Esses três pilares são a base conceitual sobre a qual todo o SGSI (Sistema de Gestão da Segurança da Informação) é construído, independentemente da tecnologia usada.","alternativas_incorretas":["Restringe segurança da informação a hardware/software e a ataques cibernéticos, ignorando que a norma trata da informação em qualquer suporte (papel, conhecimento tácito, nuvem) e de qualquer ameaça (não só ataques, mas erros humanos, falhas de processo, desastres naturais etc.).","Conformidade legal (privacidade, LGPD, GDPR etc.) pode ser uma das entradas do SGSI, mas não é a definição de segurança da informação — é apenas um dos requisitos de partes interessadas que o SGSI pode precisar atender."],"dica":"Sempre que a questão perguntar \"o que é segurança da informação\", a resposta-âncora é CID (confidencialidade, integridade, disponibilidade). Cuidado com alternativas que citam apenas tecnologia ou apenas compliance — a norma é agnóstica de tecnologia e mais ampla que apenas leis.","resumo":"Segurança da informação = CID: Confidencialidade + Integridade + Disponibilidade."},{"numero":2,"enunciado":"Cenário 1: A empresa \"TechSolution\", especializada em desenvolvimento de software, está começando a entender a ISO 27001 para proteger suas propriedades intelectuais e dados de clientes.","resposta_correta":"c) Proteger a informação contra divulgação não autorizada.","justificativa":"Confidencialidade, na ISO/IEC 27000, é a \"propriedade de que a informação não esteja disponível ou revelada a indivíduos, entidades ou processos não autorizados\". Para a TechSolution, isso significa impedir que algoritmos proprietários e código-fonte cheguem a concorrentes ou pessoas sem necessidade de acesso — a essência é o controle de quem pode ver a informação.","alternativas_incorretas":["Essa é a definição de disponibilidade, não de confidencialidade — foca em acesso quando necessário, não em restrição de acesso.","Essa é a definição de integridade — trata de exatidão e completude da informação, não de sigilo."],"dica":"A prova adora trocar as definições dos três pilares entre si. Decore a palavra-chave de cada um: Confidencialidade → sigilo/não divulgação; Integridade → exatidão/não alteração; Disponibilidade → acesso quando necessário.","resumo":"Confidencialidade é sobre \"quem pode ver\", não sobre \"quando pode acessar\" ou \"se está correto\"."},{"numero":3,"enunciado":"Cenário 1: A empresa \"TechSolution\", especializada em desenvolvimento de software, está começando a entender a ISO 27001 para proteger suas propriedades intelectuais e dados de clientes.","resposta_correta":"b) Um processo de gestão de riscos contínuo para a informação.","justificativa":"A Introdução da norma deixa claro que o SGSI compreende políticas, procedimentos, diretrizes e recursos associados, geridos coletivamente por uma organização, na busca por proteger seus ativos de informação, e que essa proteção é alcançada através de um processo de gestão de riscos contínuo. A tecnologia (como antivírus) é apenas um dos controles possíveis resultantes desse processo — não o fundamento do sistema de gestão.","alternativas_incorretas":["Tecnologia é um meio de tratamento de risco, não o fundamento do SGSI; um SGSI eficaz pode incluir controles organizacionais, físicos e de pessoas, não apenas tecnológicos.","Consultoria externa pode apoiar a implementação, mas a norma não estabelece a contratação de terceiros como base do sistema — a responsabilidade e o processo de gestão de riscos são da própria organização."],"dica":"Toda vez que a prova apresentar um \"mito\" (basta comprar ferramenta X), lembre que a ISO 27001 é, no núcleo, uma abordagem baseada em risco e em gestão (pessoas, processos e tecnologia), não uma lista de produtos de segurança.","resumo":"Antivírus não é SGSI: SGSI é gestão de risco contínua, sistemática e documentada."},{"numero":4,"enunciado":"Cenário 2: A \"HealthData Corp.\" gerencia um grande volume de prontuários eletrônicos e está explorando a ISO 27001 para fortalecer a proteção dos dados dos pacientes.","resposta_correta":"b) A implementação do SGSI deve ser alinhada aos objetivos de negócio da empresa e integrada à sua estrutura de administração.","justificativa":"A cláusula 4.4, combinada com a Introdução (0.1), trata a adoção de um SGSI como decisão estratégica para a organização, o que significa que ela deve nascer do nível de liderança (Alta Direção), estar alinhada aos objetivos de negócio e ficar integrada aos processos e à estrutura de gestão já existentes — não é um projeto isolado de TI.","alternativas_incorretas":["Contradiz diretamente o conceito de \"decisão estratégica\": decisões estratégicas são de responsabilidade da Alta Direção, não de um departamento isoladamente, e devem estar conectadas à direção da empresa como um todo (cláusula 5.1).","Subestima o impacto do SGSI: a norma exige que a segurança da informação seja incorporada aos processos de negócio (0.1), afetando a operação diária, e não apenas a imagem/marketing da organização."],"dica":"Questões que citam \"decisão estratégica\", \"liderança\", \"integração aos processos de negócio\" apontam sempre para envolvimento da Alta Direção (cláusula 5) e alinhamento com o contexto/objetivos organizacionais (cláusula 4), nunca para decisões isoladas de TI.","resumo":"SGSI não é projeto de TI: é decisão estratégica da Alta Direção, integrada ao negócio."},{"numero":5,"enunciado":"Cenário 2: A \"HealthData Corp.\" gerencia um grande volume de prontuários eletrônicos e está explorando a ISO 27001 para fortalecer a proteção dos dados dos pacientes.","resposta_correta":"b) A propriedade de que a informação é completa, precisa e protegida contra modificações indevidas.","justificativa":"Integridade, conforme a ISO/IEC 27000, é a propriedade de exatidão (accuracy) e completude da informação. Para prontuários eletrônicos, isso significa que os dados clínicos não podem ser alterados, corrompidos ou destruídos de forma não autorizada ou acidental — um requisito vital, já que uma alteração indevida em um prontuário pode colocar a vida do paciente em risco.","alternativas_incorretas":["Descreve confidencialidade, não integridade.","Descreve disponibilidade, não integridade."],"dica":"Em cenários de saúde (HealthData, hospitais), a banca costuma explorar a integridade porque um erro em um dado clínico é tão grave quanto um vazamento. Não caia na armadilha de associar \"saúde\" automaticamente à confidencialidade.","resumo":"Integridade = dado certo, completo e sem alteração indevida."},{"numero":6,"enunciado":"Cenário 2: A \"HealthData Corp.\" gerencia um grande volume de prontuários eletrônicos e está explorando a ISO 27001 para fortalecer a proteção dos dados dos pacientes.","resposta_correta":"c) Disponibilidade.","justificativa":"Disponibilidade é a propriedade de a informação estar acessível e utilizável sob demanda por uma entidade autorizada. Em um contexto hospitalar, isso significa que o sistema de prontuário eletrônico precisa estar operacional e acessível aos médicos autorizados sempre que necessário, inclusive em situações de emergência.","alternativas_incorretas":["Confidencialidade trataria de impedir acesso de pessoas não autorizadas, não de garantir acesso a quem é autorizado.","Integridade trataria da exatidão do conteúdo do prontuário, não da capacidade de acessá-lo a qualquer momento."],"dica":"Palavras-chave como \"a qualquer momento\", \"quando necessário\", \"sistema no ar\", \"continuidade de acesso\" apontam quase sempre para disponibilidade.","resumo":"Disponibilidade = acesso garantido a quem tem direito, no momento em que precisa."},{"numero":7,"enunciado":"Cenário 3: A \"Educação Online Global\" está implementando a ISO 27001 para proteger dados de estudantes e garantir a continuidade de seus serviços de plataforma.","resposta_correta":"b) Facilita a integração de processos e a gestão de múltiplos sistemas em uma única estrutura, otimizando recursos.","justificativa":"O Anexo SL (também chamado de \"High Level Structure\" ou Estrutura de Alto Nível) padroniza a estrutura de cláusulas (seções 4 a 10), termos e definições comuns entre as normas ISO de sistemas de gestão (9001, 14001, 27001, 22301 etc.). Isso permite que uma organização como a Educação Online Global integre seus sistemas de gestão (por exemplo, em um Sistema de Gestão Integrado), reaproveitando processos comuns como auditoria interna, análise crítica pela Direção, controle de documentos e gestão de não conformidades, otimizando recursos e reduzindo esforço duplicado.","alternativas_incorretas":["Ter a ISO 9001 não substitui nem dispensa a implementação dos requisitos específicos de segurança da informação (avaliação de riscos, Anexo A, SoA etc.) — a estrutura comum facilita a integração, mas não elimina requisitos próprios de cada norma.","A compatibilidade estrutural entre normas não permite \"escolher\" requisitos da ISO 27001 a implementar; a Seção 1 da norma deixa claro que nenhum requisito das cláusulas 4 a 10 pode ser excluído para fins de certificação."],"dica":"Sempre que aparecer \"Anexo SL\" ou \"estrutura de alto nível\", a resposta correta fala em integração/compatibilidade estrutural entre sistemas de gestão — nunca em substituição de requisitos ou \"escolha à la carte\".","resumo":"Anexo SL = mesmo \"esqueleto\" para todas as normas de gestão, facilitando integração — mas cada norma mantém seus requisitos específicos."},{"numero":8,"enunciado":"Cenário 3: A \"Educação Online Global\" está implementando a ISO 27001 para proteger dados de estudantes e garantir a continuidade de seus serviços de plataforma.","resposta_correta":"b) Ele oferece uma referência de controles de segurança da informação que devem ser considerados e tratados na Declaração de Aplicabilidade.","justificativa":"O Anexo A é normativo porque o processo de comparação com ele (cláusula 6.1.3 c) é obrigatório: a organização deve verificar se nenhum controle necessário foi omitido. Porém, os controles listados não são todos de implementação obrigatória — cada um deve ser avaliado quanto à sua aplicabilidade e justificado (incluído ou excluído) na Declaração de Aplicabilidade (SoA), com base no resultado da avaliação e do tratamento de riscos.","alternativas_incorretas":["Errado dizer que todos os controles do Anexo A devem ser seguidos \"ao pé da letra\" — a norma exige apenas que sejam considerados; a implementação depende da análise de riscos de cada organização.","O Anexo A não define metodologia de avaliação de riscos (isso é tratado na cláusula 6.1.2, cuja metodologia é definida pela própria organização); o Anexo A é justamente uma lista de referência de controles."],"dica":"Decore: Anexo A é normativo quanto ao processo de comparação/verificação, mas não é uma lista de implementação obrigatória e universal — é referência de controle a ser justificada no SoA.","resumo":"Anexo A = catálogo de referência de controles; SoA = onde se justifica o que foi incluído/excluído."},{"numero":9,"enunciado":"Cenário 3: A \"Educação Online Global\" está implementando a ISO 27001 para proteger dados de estudantes e garantir a continuidade de seus serviços de plataforma.","resposta_correta":"b) Que os objetivos devem ser registrados em um formato controlável para evidência e rastreamento.","justificativa":"\"Reter informação documentada\" é uma exigência recorrente na norma (cláusula 7.5) que significa manter um registro formal, controlado (com identificação, versão, proteção e disponibilidade adequadas), capaz de servir como evidência objetiva de que um requisito foi cumprido. No caso dos objetivos de segurança da informação (6.2), isso garante rastreabilidade de metas, prazos e responsáveis, permitindo auditoria e análise crítica posteriores.","alternativas_incorretas":["A norma exige registro formal, não memorização — \"informação documentada\" é, por definição, informação que precisa ser controlada e mantida, e memória não atende a esse requisito nem gera evidência auditável.","O acesso à informação documentada deve ser definido conforme a necessidade organizacional (inclusive das partes interessadas internas relevantes), não restrito apenas a auditores externos; isso limitaria indevidamente a gestão interna do próprio SGSI."],"dica":"Toda vez que a norma disser \"reter informação documentada\" ou \"manter informação documentada\", pense em evidência objetiva, controlada e rastreável — é a linguagem-padrão de sistemas de gestão (Anexo SL) para \"isso precisa estar registrado e disponível\".","resumo":"Se não está documentado e controlado, para efeitos de auditoria, não aconteceu."},{"numero":10,"enunciado":"Cenário 4: A \"FinTech Solutions\" está desenvolvendo um novo aplicativo de pagamentos e busca integrar a segurança desde as primeiras fases do projeto.","resposta_correta":"b) Segurança por design.","justificativa":"A Introdução da norma destaca que é importante que a segurança da informação seja considerada no projeto (design) de processos, sistemas de informação e controles — ou seja, incorporada desde a concepção, e não adicionada posteriormente como \"remendo\". Esse conceito é conhecido no mercado como \"security by design\" (segurança desde a concepção), análogo ao conceito de \"privacy by design\" da LGPD/GDPR.","alternativas_incorretas":["Segurança reativa é o oposto do que a norma preconiza: agir somente depois que um incidente ocorre, em vez de prevenir desde o início do projeto.","Segurança por compliance foca apenas em atender exigências legais/regulatórias formalmente, o que não é a mesma coisa que incorporar segurança na arquitetura e no design de processos e sistemas desde o início."],"dica":"Fixe o termo \"security by design\" (ou \"segurança desde a concepção\") — é um conceito frequentemente cobrado em provas de Lead Implementer, especialmente em cenários de desenvolvimento de software e novos produtos (como fintechs e apps).","resumo":"Segurança entra no projeto desde o dia zero — não é um adesivo colado depois de pronto."},{"numero":11,"enunciado":"Cenário 4: A \"FinTech Solutions\" está desenvolvendo um novo aplicativo de pagamentos e busca integrar a segurança desde as primeiras fases do projeto.","resposta_correta":"c) Descrever a visão geral e o vocabulário do sistema de gestão da segurança da informação.","justificativa":"A ISO/IEC 27000 é a norma \"guarda-chuva\" da família 27k: apresenta uma visão geral dos SGSI e define os termos e conceitos usados em todas as demais normas da família (incluindo a 27001), como \"risco\", \"ativo\", \"confidencialidade\", \"parte interessada\" etc. É referência normativa explícita na cláusula 3 (Termos e definições) da ISO/IEC 27001:2022, que remete o leitor à 27000 para o vocabulário.","alternativas_incorretas":["A 27000 não é uma lista de vulnerabilidades — bases de vulnerabilidades são mantidas por outras fontes (como CVE), fora do escopo da família 27k.","Requisitos técnicos detalhados de firewalls e IDS/IPS não são tratados na 27000 nem na 27001; controles técnicos de rede aparecem de forma genérica no Anexo A (ex.: 8.20, 8.21) e orientações mais detalhadas estão em normas complementares como a ISO/IEC 27033."],"dica":"Toda vez que a prova perguntar sobre \"vocabulário\" ou \"visão geral\" do conjunto de normas 27k, a resposta é ISO/IEC 27000. Não confunda com a 27002 (guia de implementação de controles) nem com a 27005 (gestão de riscos).","resumo":"ISO/IEC 27000 = dicionário e mapa da família 27k."},{"numero":12,"enunciado":"Cenário 4: A \"FinTech Solutions\" está desenvolvendo um novo aplicativo de pagamentos e busca integrar a segurança desde as primeiras fases do projeto.","resposta_correta":"b) O efeito da incerteza nos objetivos da segurança da informação.","justificativa":"A ISO/IEC 27000 define risco (alinhado à ISO 31000) como o \"efeito da incerteza nos objetivos\", e risco de segurança da informação como associado ao potencial de ameaças explorarem vulnerabilidades de um ativo de informação, causando dano à organização. É um conceito prospectivo e probabilístico, não um evento já concretizado.","alternativas_incorretas":["Um evento que já ocorreu e causou dano é um incidente de segurança da informação, não um risco — risco é sobre possibilidade futura, incidente é sobre fato consumado.","Isso descreve uma vulnerabilidade, que é apenas um dos componentes do risco (junto com ameaça e impacto), não o risco em si."],"dica":"A prova adora confundir os três conceitos: vulnerabilidade (fraqueza), ameaça (potencial causador de dano) e risco (combinação de probabilidade e impacto de uma ameaça explorar uma vulnerabilidade). Risco ≠ vulnerabilidade ≠ incidente.","resumo":"Risco é o \"e se\" (futuro/incerto); incidente é o \"aconteceu\" (passado/fato)."},{"numero":13,"enunciado":"Cenário 5: A \"Logística Inteligente\" é uma empresa de transporte e armazenamento, implementando a ISO 27001 para proteger seus dados de carga e logística.","resposta_correta":"b) A norma é universalmente adaptável, mas a forma de implementação deve ser adequada ao contexto específico de cada organização.","justificativa":"A Seção 1 (Escopo) afirma que os requisitos são genéricos e aplicáveis a qualquer organização, independentemente de tipo, tamanho e natureza. Isso não significa uniformidade de implementação: a cláusula 4.1 (contexto) e o próprio espírito da norma exigem que cada organização adapte a extensão e a profundidade dos controles ao seu próprio contexto, riscos e complexidade — uma pequena transportadora e uma multinacional terão SGSIs de porte e sofisticação diferentes, mas ambos igualmente válidos e certificáveis.","alternativas_incorretas":["Aplicar \"sem qualquer adaptação\" contraria o princípio de que o SGSI deve ser dimensionado ao contexto de cada organização — não existe um SGSI de \"tamanho único\".","A norma não prevê isenções de requisitos por porte da empresa: a Seção 1 explicitamente proíbe a exclusão de qualquer requisito das cláusulas 4 a 10 para fins de certificação, independentemente do tamanho da organização."],"dica":"\"Aplicável a qualquer organização\" é frequentemente mal interpretado como \"implementação idêntica para todos\". Lembre-se: os requisitos (cláusulas 4-10) são fixos e não podem ser excluídos, mas a forma/profundidade de atendê-los é escalável ao contexto.","resumo":"Requisitos são universais e não excludíveis; a implementação é sempre sob medida."},{"numero":14,"enunciado":"Cenário 5: A \"Logística Inteligente\" é uma empresa de transporte e armazenamento, implementando a ISO 27001 para proteger seus dados de carga e logística.","resposta_correta":"c) Requisitos legais, regulamentares, contratuais e as expectativas de segurança dos stakeholders.","justificativa":"A cláusula 4.2 exige que a organização determine as partes interessadas relevantes para o SGSI e seus requisitos pertinentes. A própria norma traz uma nota esclarecendo que esses requisitos podem incluir requisitos legais e regulamentares e obrigações contratuais — além das expectativas de clientes, fornecedores, reguladores, acionistas e demais stakeholders relacionados à segurança da informação.","alternativas_incorretas":["Restringir a apenas requisitos internos da alta direção ignora a essência da cláusula 4.2, que é justamente identificar requisitos externos (legais, contratuais, de clientes) além dos internos.","A cláusula 4.2 não se limita a requisitos técnicos de TI — trata de partes interessadas em sentido amplo (jurídico, comercial, regulatório, social), muito além da infraestrutura tecnológica."],"dica":"Sempre que aparecer \"partes interessadas\" (cláusula 4.2), lembre da tríade: requisitos legais/regulamentares + obrigações contratuais + expectativas/necessidades das partes interessadas relevantes. Essa cláusula alimenta diretamente o escopo (4.3) e os riscos (6.1).","resumo":"Partes interessadas trazem de tudo: lei, contrato e expectativa — nunca é só \"TI\" ou só \"chefia\"."},{"numero":15,"enunciado":"Cenário 5: A \"Logística Inteligente\" é uma empresa de transporte e armazenamento, implementando a ISO 27001 para proteger seus dados de carga e logística.","resposta_correta":"b) Para verificar se nenhum controle necessário foi omitido.","justificativa":"A cláusula 6.1.3 c) exige que a organização compare os controles determinados no tratamento de riscos com os do Anexo A, com o único propósito de verificar se nenhum controle necessário foi negligenciado ou omitido — funcionando como uma \"checklist de sanidade\" (gap check) sobre o processo de tratamento de riscos conduzido pela organização, e não como uma imposição de controles não relacionados aos riscos identificados.","alternativas_incorretas":["A comparação não obriga a implementação de todos os controles do Anexo A independentemente da relevância — cada controle deve ser justificado com base no risco, podendo ser legitimamente excluído no SoA se não for aplicável.","O Anexo A não substitui controles internos: ele serve como referência de verificação; controles próprios da organização (não listados no Anexo A) também podem e devem ser incluídos no tratamento de riscos, se necessários."],"dica":"A frase \"nenhum controle necessário foi omitido\" é praticamente literal da norma (6.1.3 c) — decore-a, pois é frequentemente cobrada ipsis litteris ou parafraseada.","resumo":"Anexo A funciona como checklist de conferência, não como lista de compras obrigatória."},{"numero":16,"enunciado":"Cenário 6: A \"SmartCity Solutions\" está implementando um SGSI para gerenciar a segurança de sua infraestrutura urbana inteligente.","resposta_correta":"b) Assegurar que o SGSI continue a operar de forma eficaz e que seus controles e processos estejam atualizados e funcionando.","justificativa":"A cláusula 4.4 estabelece quatro verbos-chave: estabelecer, implementar, manter e melhorar continuamente. \"Manter\" significa preservar a operação eficaz do sistema ao longo do tempo — atualizar controles, revisar processos, garantir que o que foi implementado continue funcionando e sendo pertinente, e não apenas ser criado uma vez e esquecido. É a garantia de sustentabilidade operacional do SGSI no dia a dia.","alternativas_incorretas":["Reduzir a manutenção a \"reagir a incidentes\" é uma postura reativa, incompatível com a natureza contínua e proativa da manutenção de um SGSI, que deve ser monitorado e ajustado independentemente de haver incidentes.","Guardar documentação é parte do controle da informação documentada (cláusula 7.5.3), mas não é a definição de \"manter o SGSI\" — manter envolve a operação viva do sistema, não apenas o arquivamento de papéis."],"dica":"Lembre dos quatro verbos da cláusula 4.4 (estabelecer, implementar, manter, melhorar continuamente) — a prova gosta de testar se você sabe diferenciar cada um: estabelecer = criar; implementar = colocar em prática; manter = sustentar a operação; melhorar = evoluir o sistema (cláusula 10).","resumo":"Manter é manter vivo e funcionando — não é guardar na gaveta."},{"numero":17,"enunciado":"Cenário 6: A \"SmartCity Solutions\" está implementando um SGSI para gerenciar a segurança de sua infraestrutura urbana inteligente.","resposta_correta":"b) Assegurar que os recursos necessários para o SGSI estejam disponíveis.","justificativa":"A cláusula 5.1 lista diversas evidências de liderança e comprometimento da Alta Direção, entre elas: assegurar que a política e os objetivos de segurança da informação sejam estabelecidos e compatíveis com a direção estratégica; assegurar a integração dos requisitos do SGSI aos processos de negócio; e, de forma explícita, assegurar que os recursos necessários para o SGSI estejam disponíveis (pessoas, orçamento, infraestrutura, tempo). Sem recursos, o SGSI não sai do papel.","alternativas_incorretas":["Delegar totalmente as decisões de segurança à TI contraria o requisito de liderança ativa: a Alta Direção deve se engajar, orientar e prestar contas pela eficácia do SGSI, não apenas transferir a responsabilidade.","Uma participação pontual (apenas no kickoff) não configura comprometimento contínuo; a norma exige envolvimento sustentado, incluindo a análise crítica periódica (cláusula 9.3) e o apoio constante às funções relevantes."],"dica":"A cláusula 5.1 é uma das mais cobradas em provas de Lead Implementer/Auditor: memorize que ela lista responsabilidades específicas e não delegáveis da Alta Direção (política, objetivos, recursos, integração ao negócio, comunicação da importância, apoio a funções, promoção da melhoria contínua).","resumo":"Sem recursos garantidos pela Alta Direção, não existe comprometimento real — só discurso."},{"numero":18,"enunciado":"Cenário 7: A \"DataGuardians Inc.\" está definindo o escopo de seu SGSI, que inclui diferentes departamentos e serviços.","resposta_correta":"b) Assegurar que o SGSI seja relevante e eficaz para o contexto operacional e estratégico da organização.","justificativa":"A cláusula 4.3 exige que, ao determinar o escopo, a organização considere as questões internas e externas referidas em 4.1 e os requisitos referidos em 4.2, além das interfaces e dependências entre as atividades realizadas pela organização e as realizadas por outras organizações. Isso garante que o escopo não seja definido arbitrariamente, mas reflita o contexto real (mercado, regulação, cultura, tecnologia, partes interessadas) em que a organização opera, tornando o SGSI pertinente e eficaz.","alternativas_incorretas":["Restringir o escopo apenas a questões financeiras ignora a amplitude da cláusula 4.1, que trata de questões internas e externas de qualquer natureza (estratégica, legal, tecnológica, cultural, competitiva), não somente financeira.","Ignorar questões externas contraria diretamente a exigência da cláusula 4.1, que trata questões internas e externas como igualmente relevantes para o contexto da organização."],"dica":"Lembre da cadeia lógica: 4.1 (contexto interno/externo) + 4.2 (partes interessadas) + interfaces e dependências → alimentam 4.3 (escopo). Isso é testado com frequência em formato de \"qual cláusula alimenta qual\".","resumo":"O escopo nasce do contexto — não pode ser definido no vácuo, ignorando o ambiente da organização."},{"numero":19,"enunciado":"Cenário 7: A \"DataGuardians Inc.\" está definindo o escopo de seu SGSI, que inclui diferentes departamentos e serviços.","resposta_correta":"b) Para fornecer clareza e transparência sobre os limites e a aplicabilidade do SGSI, tanto interna quanto externamente.","justificativa":"A cláusula 4.3 exige que o escopo esteja disponível como informação documentada. Isso é essencial porque o escopo define os limites e a aplicabilidade do SGSI: quais unidades de negócio, processos, localidades e ativos estão dentro (ou fora) da certificação. Documentar e comunicar isso com clareza evita ambiguidades para auditores, clientes, parceiros e para o próprio time interno — todos precisam saber exatamente o que está \"coberto\" pelo SGSI certificado.","alternativas_incorretas":["Reduzir a exigência a \"mera formalidade\" ignora o propósito prático de transparência e gestão que a documentação do escopo cumpre, inclusive para evitar declarações enganosas sobre o que está certificado.","A ideia de alteração \"secreta\" contraria o princípio de controle da informação documentada (cláusula 7.5.3), que exige rastreabilidade, versionamento e comunicação adequada de mudanças, especialmente em algo tão sensível quanto o escopo do SGSI."],"dica":"Cuidado com alternativas que usam palavras como \"secretamente\", \"apenas para cumprir tabela\" ou \"sem impacto real\" — normalmente são pegadinhas que subestimam o propósito prático dos requisitos de documentação.","resumo":"Escopo documentado = transparência sobre o que está (e o que não está) dentro do SGSI certificado."},{"numero":20,"enunciado":"Cenário 8: A \"CloudSecure Providers\" está elaborando sua política de segurança da informação e definindo objetivos.","resposta_correta":"b) Ser apropriada ao propósito da organização e incluir o comprometimento com a melhoria contínua do SGSI.","justificativa":"A cláusula 5.2 exige que a política de segurança da informação seja apropriada ao propósito da organização, inclua os objetivos de segurança da informação (ou forneça a estrutura para estabelecê-los), inclua o comprometimento em satisfazer os requisitos aplicáveis e o comprometimento com a melhoria contínua do SGSI. É um documento estratégico e de alto nível, não um manual técnico detalhado.","alternativas_incorretas":["A política não deve ser um documento longo cheio de configurações técnicas — esse nível de detalhe pertence a procedimentos e normas técnicas específicas, não à política, que é declaratória e de alto nível.","A cláusula 5.2 exige que a política esteja disponível como informação documentada, seja comunicada dentro da organização e disponível para as partes interessadas, conforme apropriado — restringi-la apenas à equipe de segurança contraria essa exigência de comunicação ampla."],"dica":"Não confunda política (alto nível, estratégica, cláusula 5.2) com procedimentos e normas técnicas (nível operacional, controles do Anexo A). A política é curta, principiológica e amplamente comunicada.","resumo":"Política é a \"declaração de intenções\" da organização — não um manual técnico."},{"numero":21,"enunciado":"Cenário 8: A \"CloudSecure Providers\" está elaborando sua política de segurança da informação e definindo objetivos.","resposta_correta":"b) Para assegurar que os objetivos estratégicos de segurança estejam alinhados às diretrizes e princípios estabelecidos na política.","justificativa":"A cláusula 6.2 exige que os objetivos de segurança da informação sejam consistentes com a política, mensuráveis (se possível), levem em conta requisitos aplicáveis, resultados de avaliação e tratamento de riscos, sejam comunicados e atualizados. A consistência com a política garante coerência vertical no SGSI: a política define o \"porquê\" e as diretrizes gerais, e os objetivos traduzem isso em metas concretas alinhadas ao mesmo propósito.","alternativas_incorretas":["A norma não exige objetivos \"difíceis\" propositalmente — pelo contrário, objetivos costumam seguir a lógica SMART (específicos, mensuráveis, alcançáveis, relevantes e com prazo), o que exclui metas inatingíveis por design.","Tratar a política como \"mera formalidade\" contraria a essência da cláusula 5.2, que exige uma política com comprometimento real e efeito prático sobre toda a estrutura do SGSI, incluindo os objetivos."],"dica":"Política (5.2) e objetivos (6.2) sempre andam juntos nas provas: política = diretrizes gerais; objetivos = metas específicas derivadas dessas diretrizes. Um não pode contradizer o outro.","resumo":"Objetivos são o desdobramento prático da política — nunca podem contradizê-la."},{"numero":22,"enunciado":"Cenário 9: A \"Analytics Insights Corp.\" está revisando seus processos para integrar melhor a segurança da informação.","resposta_correta":"b) A segurança da informação não pode ser uma iniciativa isolada, mas deve ser incorporada aos processos de negócio e à governança da empresa.","justificativa":"A Introdução (0.1) é enfática ao afirmar que o SGSI deve ser parte de e estar integrado aos processos e à estrutura de gestão geral da organização, e que a segurança da informação deve ser considerada no projeto de processos, sistemas de informação e controles. Isso reforça que segurança não é um \"silo\" isolado, mas uma dimensão transversal da governança corporativa.","alternativas_incorretas":["Tratar segurança como processo totalmente separado (com equipe e budget isolados, sem integração aos demais processos) contraria diretamente o texto da Introdução, que pede integração, não isolamento.","A integração não é apresentada como opcional ou condicionada à maturidade — é um princípio estrutural do SGSI, válido desde o primeiro estágio de implementação, ainda que a profundidade da integração possa evoluir com o tempo."],"dica":"\"Integração ao negócio\" é tema recorrente na Introdução da norma e é frequentemente contrastado com a ideia (errada) de segurança como \"departamento isolado de TI\". Fique atento a esse contraste nas alternativas.","resumo":"Segurança da informação é fio condutor da governança, não um departamento à parte."},{"numero":23,"enunciado":"Cenário 9: A \"Analytics Insights Corp.\" está revisando seus processos para integrar melhor a segurança da informação.","resposta_correta":"b) Que esses requisitos são mandatórios e devem ser endereçados pelo SGSI para garantir a conformidade.","justificativa":"A nota da cláusula 4.2 esclarece que os requisitos das partes interessadas podem incluir requisitos legais, regulamentares e obrigações contratuais. Por sua própria natureza, requisitos legais e contratuais não são opcionais: uma vez identificados como aplicáveis, devem ser endereçados pelo SGSI (frequentemente por meio de controles do tema \"conformidade\" no Anexo A, como o controle 5.31 — requisitos legais, estatutários, regulamentares e contratuais) para que a organização evite sanções, litígios e não conformidades.","alternativas_incorretas":["Limitar-se ao \"já vigente\" ignora que a cláusula 4.2 e o contexto (4.1) exigem monitoramento contínuo de mudanças, incluindo novas leis e regulamentos que possam vir a se aplicar.","Requisitos legais e obrigações contratuais não são \"opções de menu\" — uma vez que se aplicam à organização, seu atendimento é obrigatório; a discricionariedade da organização está em como atendê-los (controles), não em se vai atendê-los."],"dica":"Quando a prova mencionar \"requisitos legais, regulamentares e contratuais\", pense sempre em caráter obrigatório de atendimento — é diferente das \"expectativas\" de partes interessadas, que podem ter caráter mais voluntário/estratégico.","resumo":"Lei e contrato não se \"escolhe seguir\" — se aplicam, o SGSI tem que endereçar."},{"numero":24,"enunciado":"Cenário 10: Uma startup recém-criada, \"ConnectIT\", pretende implementar a ISO 27001.","resposta_correta":"b) Todos os requisitos das Seções 4 a 10 devem ser abordados e implementados para alcançar a certificação, sem exceção.","justificativa":"A Seção 1 (Escopo) da norma estabelece expressamente que, quando uma organização reivindica conformidade com a ISO/IEC 27001, nenhum dos requisitos especificados nas Seções 4 a 10 pode ser excluído. Isso é diferente do Anexo A, cujos controles podem ser excluídos (com justificativa no SoA) se não forem aplicáveis com base na avaliação de riscos — a flexibilidade de exclusão existe apenas para os controles do Anexo A, nunca para as cláusulas do \"corpo\" da norma (o sistema de gestão em si).","alternativas_incorretas":["Contraria diretamente o texto da Seção 1: não há discricionariedade para excluir cláusulas de gestão (4 a 10) por decisão própria da organização.","Inverte o conceito: a possibilidade de exclusão mediante justificativa existe para os controles do Anexo A (via SoA, cláusula 6.1.3), não para as cláusulas do corpo normativo (4 a 10), que são todas obrigatórias."],"dica":"Grave essa distinção fundamental: cláusulas 4-10 = requisitos de gestão, TODOS obrigatórios, sem exclusão. Anexo A = controles de referência, PODEM ser excluídos com justificativa técnica no SoA baseada em risco.","resumo":"Cláusulas 4 a 10 não se negociam; controles do Anexo A, sim (com justificativa)."},{"numero":25,"enunciado":"Cenário 10: Uma startup recém-criada, \"ConnectIT\", pretende implementar a ISO 27001.","resposta_correta":"b) Que o SGSI inclua os processos necessários e suas interações, de acordo com os requisitos da norma.","justificativa":"A cláusula 4.4 determina que a organização deve estabelecer, implementar, manter e melhorar continuamente um SGSI, incluindo os processos necessários e suas interações, de acordo com os requisitos desta norma. Essa visão de \"processos e interações\" reflete a abordagem por processos (process approach), típica das normas de sistema de gestão baseadas no Anexo SL, reconhecendo que os processos do SGSI não existem isoladamente, mas se conectam entre si (por exemplo, avaliação de riscos alimenta o tratamento de riscos, que alimenta o SoA).","alternativas_incorretas":["Criar processos de segurança \"independentemente de outros processos organizacionais\" contraria o princípio de integração destacado na Introdução (0.1) e o conceito de interação de processos da própria cláusula 4.4.","A norma não define um nível \"mínimo\" de documentação em função do porte ou agilidade desejada pela empresa — o nível de documentação necessário decorre da complexidade dos processos e dos riscos envolvidos, não de uma meta de enxugamento burocrático pré-definida."],"dica":"Startups e pequenas empresas aparecem com frequência em provas para testar se você sabe que a norma não abre exceções de \"menos documentação por ser pequena\" — o que existe é proporcionalidade ao contexto, não uma regra fixa de simplificação.","resumo":"SGSI é um sistema de processos interligados, não uma coleção de iniciativas soltas."},{"numero":26,"enunciado":"Cenário 11: A empresa \"TechGrow\" está na fase de planejamento de seu SGSI e a Alta Direção está definindo os papéis e responsabilidades.","resposta_correta":"b) Orientar e apoiar pessoas a contribuir para a eficácia do sistema de gestão da segurança da informação.","justificativa":"Entre as diversas responsabilidades listadas na cláusula 5.1, está a de a Alta Direção dirigir e apoiar pessoas a contribuir para a eficácia do SGSI, além de promover a melhoria contínua e apoiar outras funções gerenciais relevantes a demonstrar sua liderança nas áreas sob sua responsabilidade. Isso caracteriza um papel ativo de patrocínio (sponsorship) e engajamento das pessoas, não apenas assinatura formal de documentos.","alternativas_incorretas":["Reduzir a liderança a \"aprovar documentos finais\" é uma visão passiva e burocrática, incompatível com o conjunto de responsabilidades ativas listadas na cláusula 5.1 (comunicação, garantia de recursos, integração ao negócio, promoção da melhoria contínua etc.).","Delegação total ao gerente de TI descaracteriza a liderança da Alta Direção exigida pela norma — a responsabilidade final pelo SGSI é da Alta Direção, que pode distribuir tarefas operacionais, mas não pode se eximir do papel de liderança e prestação de contas."],"dica":"\"Apoiar\", \"orientar\", \"assegurar\", \"promover\", \"comunicar a importância\" são os verbos típicos da cláusula 5.1 — associe-os sempre a ações ativas da Alta Direção, nunca a delegação passiva total.","resumo":"Liderança é engajamento ativo, não apenas assinatura de papel."},{"numero":27,"enunciado":"Cenário 11: A empresa \"TechGrow\" está na fase de planejamento de seu SGSI e a Alta Direção está definindo os papéis e responsabilidades.","resposta_correta":"b) Que a política deve expressar a intenção da organização em cumprir com as obrigações pertinentes à segurança da informação.","justificativa":"A cláusula 5.2 b) exige que a política inclua o comprometimento em satisfazer os requisitos aplicáveis relacionados com a segurança da informação. Trata-se de uma declaração de intenção e compromisso de alto nível — a política expressa a postura da organização perante suas obrigações (legais, regulatórias, contratuais, de partes interessadas), sem precisar listar cada requisito individualmente, o que seria função de registros e controles operacionais específicos (por exemplo, um inventário de requisitos legais, ligado ao controle 5.31 do Anexo A).","alternativas_incorretas":["Listar exaustivamente todos os requisitos legais e regulamentares não é papel da política (documento de alto nível e conciso), mas de registros de conformidade específicos mantidos separadamente.","A ideia de \"escolher quais requisitos aplicar\" contraria a própria noção de \"requisitos aplicáveis\" — a aplicabilidade decorre da natureza legal/contratual/regulatória do requisito, não de uma escolha discricionária da organização."],"dica":"A política declara compromisso; ela não é o lugar de listas operacionais detalhadas. Fique atento a alternativas que tentam transformar a política em um documento operacional extenso.","resumo":"A política diz \"nos comprometemos a cumprir\" — os registros específicos dizem \"o quê\", exatamente."},{"numero":28,"enunciado":"Cenário 12: A \"DataSafe Analytics\" está avaliando riscos e oportunidades para seu SGSI.","resposta_correta":"b) Assegurar que o SGSI possa alcançar seus resultados pretendidos, prevenir ou reduzir efeitos indesejados e alcançar a melhoria contínua.","justificativa":"A cláusula 6.1.1 estabelece que, ao planejar o SGSI, a organização deve considerar as questões referidas em 4.1 e os requisitos referidos em 4.2, e determinar os riscos e oportunidades que precisam ser abordados para: assegurar que o SGSI possa alcançar seu(s) resultado(s) pretendido(s); prevenir ou reduzir efeitos indesejados; e alcançar a melhoria contínua. Esse é o propósito central do planejamento baseado em risco em toda a estrutura de Anexo SL.","alternativas_incorretas":["Redução de custos pode ser uma consequência de um bom planejamento, mas não é o objetivo estabelecido pela cláusula 6.1.1 — o foco da norma é a eficácia do SGSI e a gestão de riscos, não a economia financeira em si.","A cláusula 6.1.1 trata de riscos e oportunidades de forma ampla (não apenas ameaças) e não se limita a fatores externos — inclui também questões internas (4.1) que podem gerar riscos ou oportunidades."],"dica":"Grave a tríade de objetivos da cláusula 6.1.1: (1) alcançar resultados pretendidos do SGSI; (2) prevenir/reduzir efeitos indesejados; (3) alcançar melhoria contínua. É clássica em provas de certificação.","resumo":"6.1.1 não é só sobre ameaças — é sobre garantir que o SGSI funcione, evite problemas e sempre melhore."},{"numero":29,"enunciado":"Cenário 12: A \"DataSafe Analytics\" está avaliando riscos e oportunidades para seu SGSI.","resposta_correta":"b) Para assegurar que as avaliações de riscos produzam resultados comparáveis, válidos e consistentes.","justificativa":"A cláusula 6.1.2 exige que a organização defina e aplique um processo de avaliação de riscos que estabeleça e mantenha critérios de risco (incluindo critérios de aceitação de risco e critérios para realizar avaliações), e assegure que avaliações de riscos repetidas produzam resultados consistentes, válidos e comparáveis. Sem critérios claros e estáveis, cada avaliação poderia ser feita de forma subjetiva e não comparável ao longo do tempo, comprometendo a gestão de riscos como um processo confiável e contínuo.","alternativas_incorretas":["A definição de critérios não visa tornar o processo \"rápido e informal\" — pelo contrário, visa dar rigor e consistência metodológica, o que normalmente exige formalização (não informalidade).","A norma exige justamente o oposto: reter informação documentada sobre o processo de avaliação de riscos (cláusula 6.1.2, alimentando o 7.5) como evidência de que ele foi executado de forma sistemática."],"dica":"Associe \"critérios de risco\" a consistência, comparabilidade e repetibilidade — são as palavras-chave literais da cláusula 6.1.2 a) 2), muito cobradas em prova.","resumo":"Sem critérios fixos, não há como comparar riscos de um ano para o outro — critério dá consistência à avaliação."},{"numero":30,"enunciado":"Cenário 13: A \"HealthCloud Services\" está elaborando sua Declaração de Aplicabilidade (SoA).","resposta_correta":"b) O status atual de implementação de cada controle selecionado.","justificativa":"A cláusula 6.1.3 d) exige que o SoA contenha os controles necessários (determinados em 6.1.3 b e c), a justificativa para sua inclusão, se estão implementados ou não, e a justificativa para exclusões de controles do Anexo A. A indicação \"implementado ou não\" retrata o status real e atual da implementação de cada controle selecionado, funcionando como uma fotografia do estado do SGSI em um dado momento — essencial para auditorias e para o próprio planejamento de implementação.","alternativas_incorretas":["O SoA não é apenas uma lista de intenções futuras — ele reflete tanto controles já implementados quanto os planejados, com status claro para cada um, não uma lista genérica de planos.","A lista de exclusões com justificativa é apenas uma parte do SoA; o documento completo abrange todos os controles considerados (incluídos e excluídos), com status de implementação para os incluídos — não é restrito apenas ao que foi excluído."],"dica":"Memorize os quatro elementos obrigatórios do SoA (6.1.3 d): (1) controles necessários; (2) justificativa de inclusão; (3) se estão implementados ou não; (4) justificativa de exclusão de controles do Anexo A.","resumo":"SoA é retrato completo: o que foi escolhido, por quê, se já está implementado, e o que ficou de fora e por quê."},{"numero":31,"enunciado":"Cenário 13: A \"HealthCloud Services\" está elaborando sua Declaração de Aplicabilidade (SoA).","resposta_correta":"b) Garante que os riscos residuais sejam aceitos e que o plano de tratamento seja endossado pelos proprietários dos riscos e pela alta direção.","justificativa":"A cláusula 6.1.3 exige que a organização obtenha a aprovação dos proprietários dos riscos quanto ao plano de tratamento de riscos e a aceitação dos riscos residuais de segurança da informação. Isso formaliza uma decisão consciente e com responsabilidade sobre riscos que permanecerão após a aplicação dos controles (risco residual) — não se trata de simples \"informe\", mas de uma aprovação com peso decisório e accountability real dos proprietários dos riscos e, no nível estratégico, da Alta Direção.","alternativas_incorretas":["A aprovação não é passiva (\"apenas informar sem responsabilidade\") — pelo contrário, ela atribui responsabilidade formal pela aceitação do risco residual a quem aprova.","A aprovação formal do risco residual não serve para \"evitar responsabilidade por incidentes futuros\" — ao contrário, ela documenta e reforça a responsabilidade dos proprietários do risco pela decisão tomada, o que pode inclusive ser usado para prestação de contas em caso de incidente."],"dica":"Associe sempre \"proprietário do risco\" (risk owner) a responsabilidade e autoridade para aceitar riscos residuais — esse é um conceito central da cláusula 6.1.2/6.1.3 e aparece com frequência disfarçado em diferentes questões.","resumo":"Aprovar risco residual é assumir responsabilidade por ele — não é \"dar ciência\" apenas."},{"numero":32,"enunciado":"Cenário 14: A \"Sistemas Digitais\" está planejando as mudanças em seu SGSI.","resposta_correta":"b) De uma forma planejada, com controle e consideração de impactos.","justificativa":"A cláusula 6.3 (Planejamento de mudanças), introduzida como novidade na versão 2022 da norma, exige que, quando a organização determinar a necessidade de mudanças no SGSI, essas mudanças sejam realizadas de maneira planejada. Isso implica avaliar propósito e possíveis consequências das mudanças, integridade do SGSI, disponibilidade de recursos e alocação/realocação de responsabilidades e autoridades antes de implementá-las — um processo controlado de gestão de mudanças (change management), evitando impactos negativos não avaliados.","alternativas_incorretas":["Mudanças \"urgentes e sem planejamento\" contrariam diretamente o texto da cláusula 6.3, que exige justamente que as mudanças sejam conduzidas de forma planejada.","Discussões informais entre funcionários impactados não substituem um processo formal e controlado de gestão de mudanças, que deve considerar impactos sistêmicos no SGSI, recursos e responsabilidades — não apenas percepções informais das pessoas diretamente envolvidas."],"dica":"A cláusula 6.3 é uma das principais novidades da versão 2022 em relação à versão 2013 — provas atualizadas adoram testá-la. Decore que ela trata de mudanças planejadas no SGSI, com atenção a propósito, consequências, integridade do sistema, recursos e responsabilidades.","resumo":"Mudança no SGSI não é \"no improviso\" — 6.3 exige planejamento formal, novidade da versão 2022."},{"numero":33,"enunciado":"Cenário 14: A \"Sistemas Digitais\" está planejando as mudanças em seu SGSI.","resposta_correta":"b) A política deve estabelecer as diretrizes e os princípios a partir dos quais os objetivos de segurança serão desenvolvidos.","justificativa":"A cláusula 5.2 a) prevê duas possibilidades alternativas: a política pode incluir os objetivos de segurança da informação diretamente, OU fornecer a estrutura (framework) para o estabelecimento desses objetivos. Quando a segunda opção é adotada, a política funciona como um guia principiológico — estabelece diretrizes gerais que orientarão a definição posterior de objetivos específicos, mensuráveis e alinhados ao contexto (cláusula 6.2), sem necessariamente listar os objetivos em si dentro do próprio texto da política.","alternativas_incorretas":["A norma não exige que a política defina os objetivos de forma explícita e obrigatória — essa é apenas uma das duas alternativas previstas (a outra sendo fornecer a estrutura, que é justamente a opção descrita no enunciado).","Objetivos e política nunca são independentes: a cláusula 6.2 exige explicitamente que os objetivos sejam consistentes com a política, mesmo quando ela apenas fornece a \"estrutura\" (framework) e não os objetivos propriamente ditos."],"dica":"Fique atento à dualidade da cláusula 5.2 a): política pode \"incluir objetivos\" OU \"fornecer estrutura para estabelecê-los\" — são dois caminhos válidos, e a prova gosta de testar se você reconhece essa segunda opção sem confundi-la com ausência de relação.","resumo":"A política pode ser o \"guarda-chuva\" de princípios sob o qual os objetivos específicos nascem."},{"numero":34,"enunciado":"Cenário 15: A \"InfraSecure Tech\" está implementando seu SGSI e focando nos recursos e na competência do pessoal.","resposta_correta":"b) Pessoal competente, infraestrutura, ambiente, tecnologia e recursos financeiros.","justificativa":"A cláusula 7.1 exige que a organização determine e proveja os recursos necessários para o SGSI de forma ampla — a norma não restringe o conceito de \"recursos\" a um único tipo. Na prática (e conforme orientações complementares de implementação), isso abrange pessoas competentes, infraestrutura física e tecnológica, ambiente de trabalho adequado e recursos financeiros/orçamentários, todos necessários para sustentar o ciclo completo de estabelecer, implementar, manter e melhorar o sistema.","alternativas_incorretas":["Restringir recursos a \"software e hardware\" é uma visão estritamente tecnológica, incompatível com a amplitude da cláusula 7.1, que trata de recursos organizacionais em sentido pleno (incluindo pessoas e orçamento).","Um programa de treinamento é um exemplo pontual de ação de competência (cláusula 7.2), não a definição abrangente de \"recursos\" exigida na cláusula 7.1 — é apenas uma manifestação específica, entre muitas outras, do provimento de recursos."],"dica":"A cláusula 7.1 (Recursos) é propositalmente genérica e ampla — desconfie de alternativas que a reduzem a apenas um tipo de recurso (só tecnológico, só treinamento, só financeiro).","resumo":"Recursos = pessoas + infraestrutura + tecnologia + ambiente + dinheiro, tudo junto, não uma coisa só."},{"numero":35,"enunciado":"Cenário 15: A \"InfraSecure Tech\" está implementando seu SGSI e focando nos recursos e na competência do pessoal.","resposta_correta":"b) Assegurar que as pessoas são competentes com base em educação, treinamento ou experiência, e tomar ações para adquirir essa competência.","justificativa":"A cláusula 7.2 exige que a organização determine a competência necessária das pessoas que realizam trabalho sob seu controle e que afeta o desempenho da segurança da informação, assegure que essas pessoas são competentes com base em educação, treinamento ou experiência apropriados, e, quando aplicável, tome ações para adquirir a competência necessária e avalie a eficácia dessas ações, retendo informação documentada como evidência.","alternativas_incorretas":["Exigir certificações formais de segurança da informação para todos é mais restritivo do que a norma pede — a cláusula 7.2 aceita educação, treinamento OU experiência, sem exigir certificações específicas como único caminho válido.","Testes de QI não são um critério previsto pela norma para avaliar competência — a cláusula foca em competência técnica e funcional relacionada às tarefas de segurança da informação, não em aptidão intelectual geral."],"dica":"Decore o \"tripé\" da competência na cláusula 7.2: educação, treinamento ou experiência (não é preciso ter os três — basta uma base apropriada), seguido de ações corretivas quando há lacuna e avaliação da eficácia dessas ações.","resumo":"Competência vem de educação, treinamento OU experiência — e precisa de evidência documentada."},{"numero":36,"enunciado":"Cenário 16: A \"Documenta Fácil Ltda.\" está implementando seu SGSI, com foco na gestão da informação documentada.","resposta_correta":"b) Identificação e descrição (título, data, autor), formato e meio, e análise crítica e aprovação para pertinência e adequação.","justificativa":"A cláusula 7.5.2 estabelece que, ao criar e atualizar a informação documentada, a organização deve assegurar identificação e descrição apropriadas (por exemplo, um título, data, autor ou número de referência), formato apropriado (idioma, versão de software, gráficos) e meio (papel, eletrônico), e análise crítica e aprovação quanto à pertinência (adequação ao propósito) e adequação (suficiência de detalhe). Esses são os três pilares formais de controle na criação/atualização documental.","alternativas_incorretas":["A norma é agnóstica de meio/formato — não exige papel timbrado nem qualquer suporte físico específico; documentos eletrônicos são plenamente aceitos e, na prática, predominantes.","Restringir acesso apenas à Alta Direção contraria o próprio propósito da informação documentada, que deve estar disponível a quem precisa dela para operar o SGSI (cláusula 7.5.3), respeitando controles de confidencialidade apropriados, não uma restrição indiscriminada a um único grupo."],"dica":"Diferencie 7.5.2 (criar/atualizar: identificação, formato, análise crítica/aprovação) de 7.5.3 (controle: disponibilidade, proteção, distribuição, retenção, disposição). São etapas complementares do ciclo de vida documental.","resumo":"Criar/atualizar documento = identificar bem, formatar direito e ser revisado/aprovado antes de valer."},{"numero":37,"enunciado":"Cenário 16: A \"Documenta Fácil Ltda.\" está implementando seu SGSI, com foco na gestão da informação documentada.","resposta_correta":"b) Disponível e adequada para o uso, onde e quando necessário, e protegida adequadamente.","justificativa":"A cláusula 7.5.3 exige que a informação documentada requerida pelo SGSI e pela norma seja controlada para assegurar que esteja disponível e adequada para uso, onde e quando for necessária, e que esteja adequadamente protegida (por exemplo, contra perda de confidencialidade, uso impróprio ou perda de integridade). Isso equilibra dois objetivos aparentemente opostos: acesso facilitado a quem precisa e proteção contra acesso indevido ou perda.","alternativas_incorretas":["Um \"cofre\" com acesso extremamente limitado pode comprometer a disponibilidade exigida — a informação precisa estar acessível a quem dela necessita para operar o SGSI, e não trancada a ponto de inviabilizar seu uso legítimo.","Publicar sem controle de versão ou acesso viola diretamente a exigência de proteção adequada e de controle de distribuição/acesso/recuperação/uso prevista na cláusula 7.5.3 b), abrindo espaço para uso de versões desatualizadas ou acesso indevido."],"dica":"7.5.3 equilibra disponibilidade + proteção — a resposta certa quase sempre contempla os dois lados (acesso adequado E proteção adequada), enquanto distratores pecam por exagerar em um dos extremos (fechado demais ou aberto demais).","resumo":"Documento controlado = acessível a quem precisa, protegido de quem não deve ver ou alterar."},{"numero":38,"enunciado":"Cenário 17: A \"Gestão de Ativos Digitais\" está implementando controles organizacionais do Anexo A.","resposta_correta":"b) Desenvolver e manter um inventário completo de informações e ativos, incluindo seus proprietários.","justificativa":"O controle 5.9 do Anexo A (tema Organizacional) tem como objetivo identificar as informações e outros ativos associados da organização, de modo a preservar sua segurança e atribuir a propriedade adequada. Isso implica desenvolver e manter um inventário abrangente, que cubra ativos de informação de qualquer natureza (dados, sistemas, dispositivos, serviços) e identifique claramente quem é o proprietário responsável por cada um — condição essencial para uma gestão de riscos eficaz, já que não se protege (nem se avalia risco de) o que não se conhece.","alternativas_incorretas":["O inventário do controle 5.9 tem propósito de segurança da informação (base para avaliação de riscos, classificação e controle de acesso), não é um instrumento contábil-fiscal — embora possa haver sobreposição parcial com ativos patrimoniais, esse não é o objetivo do controle.","O controle trata de \"informações e outros ativos associados\" de forma ampla — não apenas hardware, mas também dados, software, serviços e até ativos intangíveis; restringir a hardware contraria explicitamente o escopo do controle."],"dica":"Sempre associe o controle 5.9 a \"inventário + proprietário do ativo\" — esses dois elementos (o quê e quem é responsável) são o núcleo do controle e aparecem com frequência juntos nas provas.","resumo":"Não dá para proteger o que não se sabe que existe: inventário com dono definido é a base de tudo."},{"numero":39,"enunciado":"Cenário 17: A \"Gestão de Ativos Digitais\" está implementando controles organizacionais do Anexo A.","resposta_correta":"b) Regras e procedimentos para o uso aceitável e manuseio de informações e ativos.","justificativa":"O controle 5.10 tem como objetivo assegurar que a informação e outros ativos associados sejam adequadamente protegidos, usados e manuseados. Para isso, exige que regras para o uso aceitável e procedimentos de manuseio de informações e outros ativos associados sejam identificados, documentados e implementados, com base na classificação da informação (ligada ao controle 5.12) e considerando os riscos envolvidos.","alternativas_incorretas":["Uma política \"flexível que permite qualquer uso\" (desde que sem dano intencional) contraria o propósito do controle, que é justamente estabelecer regras claras de uso aceitável, incluindo restrições para usos não intencionais mas arriscados (ex.: uso indevido de dados por descuido, não apenas por má-fé).","A norma não exige proibição total de dispositivos pessoais (BYOD) — o que se exige são regras específicas para o uso aceitável, que podem, dependendo do risco, permitir o uso de ativos pessoais sob condições controladas (não uma proibição categórica e universal)."],"dica":"O controle 5.10 é frequentemente conectado ao 5.9 (inventário) e ao 5.12 (classificação): sem saber o que se tem e como está classificado, não dá para definir regras de uso aceitável coerentes.","resumo":"Uso aceitável = regras claras e documentadas, nem liberdade total, nem proibição total."},{"numero":40,"enunciado":"Cenário 17: A \"Gestão de Ativos Digitais\" está implementando controles organizacionais do Anexo A.","resposta_correta":"b) De acordo com as necessidades de segurança da informação da organização, baseadas na confidencialidade, integridade, disponibilidade e requisitos das partes interessadas relevantes.","justificativa":"O controle 5.12 exige que a informação seja classificada de acordo com as necessidades de segurança da informação da organização, com base em confidencialidade, integridade, disponibilidade e requisitos de partes interessadas relevantes. Não há um esquema fixo imposto pela norma (como apenas \"público/restrito\") — cada organização define seu próprio esquema de classificação (por exemplo, público, interno, confidencial, restrito), proporcional aos riscos e necessidades específicas do negócio.","alternativas_incorretas":["Restringir a apenas duas categorias fixas (\"público\" ou \"restrito\") é uma simplificação que a norma não impõe — o esquema de classificação deve ser definido pela organização conforme suas necessidades reais, podendo (e geralmente devendo) ter mais níveis intermediários.","Classificar pelo \"volume de armazenamento\" não tem relação com o propósito do controle, que é proteger a informação de acordo com sua sensibilidade e criticidade (CID), não com seu tamanho em bytes."],"dica":"Classificação da informação (5.12) sempre remete aos pilares CID + necessidades das partes interessadas — não a critérios técnicos irrelevantes como tamanho de arquivo ou tipo de mídia.","resumo":"Classifica-se pela sensibilidade da informação (CID), não pelo espaço que ela ocupa em disco."},{"numero":41,"enunciado":"Cenário 18: A \"Recursos Humanos Seguros\" está implementando controles de pessoas do Anexo A.","resposta_correta":"b) As responsabilidades do pessoal e da organização para a segurança da informação.","justificativa":"O controle 6.2 (tema Pessoas) exige que os acordos contratuais de trabalho declarem as responsabilidades do pessoal e da organização para a segurança da informação. Isso formaliza, desde o início do vínculo, o compromisso de ambas as partes com práticas de segurança (como confidencialidade, uso aceitável, cumprimento de políticas), servindo de base legal para exigibilidade de condutas e, se necessário, ações disciplinares.","alternativas_incorretas":["Salário e benefícios são cláusulas contratuais trabalhistas comuns, mas não são o foco do controle 6.2, que trata especificamente de responsabilidades relacionadas à segurança da informação.","O controle não exige que o contrato de trabalho traga a \"lista completa\" de controles técnicos de segurança (isso seria função de políticas e procedimentos específicos) — o contrato declara responsabilidades gerais, remetendo a políticas detalhadas à parte."],"dica":"O tema Pessoas do Anexo A (controles 6.1 a 6.8) trata do ciclo de vida do vínculo com colaboradores: antes (6.1 - triagem), durante (6.2, 6.3 conscientização, 6.4 disciplinar) e depois (6.5 - responsabilidades pós-encerramento). Associe cada controle à fase certa desse ciclo.","resumo":"O contrato declara \"quem é responsável por quê\" em segurança — não substitui políticas detalhadas."},{"numero":42,"enunciado":"Cenário 18: A \"Recursos Humanos Seguros\" está implementando controles de pessoas do Anexo A.","resposta_correta":"b) Para tomar ações contra o pessoal e outras partes interessadas que violarem a política da segurança da informação.","justificativa":"O controle 6.4 exige que um processo disciplinar seja formalizado e comunicado, a fim de tomar ações contra o pessoal e outras partes interessadas relevantes que tenham cometido uma violação da política de segurança da informação. Esse processo deve ser justo, proporcional e considerar fatores como natureza e gravidade da violação, seu impacto, se é uma primeira ou repetida ocorrência, entre outros — funcionando como mecanismo de dissuasão e responsabilização (accountability).","alternativas_incorretas":["O controle 6.4 trata de ação disciplinar diante de violações, não de mecanismos de reconhecimento ou premiação por boas práticas — isso seria outro tipo de iniciativa de cultura organizacional, fora do escopo específico deste controle.","O foco do controle não é \"registrar reclamações de funcionários contra as políticas\", mas sim conduzir um processo formal quando o próprio pessoal viola a política de segurança — a direção do processo é inversa à descrita na alternativa."],"dica":"Processo disciplinar (6.4) deve ser formal, comunicado a todos (efeito dissuasório) e aplicado com proporcionalidade e justiça — não é punição arbitrária nem sistema de reclamações.","resumo":"6.4 é o \"e se alguém violar a política?\" — resposta formal, justa e comunicada previamente."},{"numero":43,"enunciado":"Cenário 18: A \"Recursos Humanos Seguros\" está implementando controles de pessoas do Anexo A.","resposta_correta":"b) Definir, aplicar e comunicar as responsabilidades de segurança da informação que permaneçam válidas.","justificativa":"O controle 6.5 exige que as responsabilidades e obrigações de segurança da informação que permaneçam válidas após o encerramento ou a mudança da contratação sejam definidas, aplicadas e comunicadas ao pessoal e a outras partes interessadas relevantes. Exemplos típicos incluem obrigações de confidencialidade que sobrevivem ao fim do contrato, revogação de acessos e devolução de ativos — mas o núcleo do controle é a continuidade de certas obrigações mesmo após o desligamento.","alternativas_incorretas":["Contraria diretamente o propósito do controle: certas responsabilidades de segurança (como sigilo sobre informações confidenciais aprendidas durante o vínculo) permanecem válidas mesmo após o encerramento, não podendo ser simplesmente descartadas.","A devolução de equipamentos é apenas um exemplo de ação prática associada ao offboarding, mas não esgota o escopo do controle, que trata de responsabilidades de segurança em sentido mais amplo (confidencialidade, propriedade intelectual, revogação de acesso etc.), não apenas ativos físicos."],"dica":"6.5 lida com o \"pós-desligamento\": pense em cláusulas de confidencialidade que continuam valendo, revogação de credenciais, e comunicação clara ao ex-colaborador sobre o que ainda se espera dele.","resumo":"Sair da empresa não apaga todas as obrigações de segurança — algumas seguem valendo."},{"numero":44,"enunciado":"Cenário 19: A \"Segurança Física e Lógica\" está implementando controles físicos e tecnológicos do Anexo A.","resposta_correta":"b) Proteger áreas que contenham informações e outros ativos associados contra acessos não autorizados.","justificativa":"O controle 7.1 (tema Físico) exige que perímetros de segurança sejam definidos e usados para proteger áreas que contenham informação e outros ativos associados. O objetivo é prevenir acesso físico não autorizado, dano e interferência às informações e demais ativos da organização dentro das instalações, por meio de barreiras físicas (paredes, portões, catracas, controles de acesso) que delimitam zonas de segurança crescente conforme a criticidade da área.","alternativas_incorretas":["O controle não se restringe a zonas exclusivas da alta direção — perímetros de segurança física protegem qualquer área com ativos críticos (data centers, arquivos, salas de servidores), independentemente de quem os utilize.","O propósito do controle é claramente de segurança (prevenção de acesso não autorizado, dano ou interferência), não estético ou organizacional — embora um ambiente bem organizado possa ser um efeito colateral positivo, não é o objetivo do controle."],"dica":"O tema Físico do Anexo A (controles 7.1 a 7.14) trata de proteção de instalações e equipamentos — associe perímetros (7.1) a \"camadas de defesa física\" (crachá na portaria, catraca no andar, biometria na sala de servidores).","resumo":"Perímetro físico é a \"muralha\" que protege os ativos de quem não deveria chegar perto."},{"numero":45,"enunciado":"Cenário 19: A \"Segurança Física e Lógica\" está implementando controles físicos e tecnológicos do Anexo A.","resposta_correta":"b) Regras de mesa limpa para documentos impressos e mídia removível, e regras de tela limpa para recursos de tratamento de informações.","justificativa":"O controle 7.7 exige que regras de mesa limpa para papéis e mídias de armazenamento removíveis, e regras de tela limpa para os recursos de tratamento da informação, sejam definidas e adequadamente aplicadas. O objetivo é reduzir riscos de acesso não autorizado, perda e dano à informação em estações de trabalho e áreas de circulação, durante e fora do horário normal de trabalho (por exemplo, bloqueio automático de tela e guarda de documentos sensíveis fora da vista).","alternativas_incorretas":["O controle tem impacto direto na segurança da informação (prevenção de exposição visual e furto de dados/documentos) — não é uma regra meramente estética ou de organização do espaço físico.","Permitir deixar documentos confidenciais expostos na mesa é exatamente o oposto do que o controle 7.7 exige — contraria seu propósito central de proteção da informação sensível contra visualização ou acesso não autorizado."],"dica":"\"Mesa limpa e tela limpa\" é um controle clássico e visual — pense em auditor caminhando pelo escritório e encontrando papel confidencial exposto ou tela desbloqueada sem o usuário presente: isso é evidência de não conformidade com o 7.7.","resumo":"Nada de papel sensível à vista ou tela destravada sem ninguém por perto — mesa e tela sempre \"limpas\"."},{"numero":46,"enunciado":"Cenário 19: A \"Segurança Física e Lógica\" está implementando controles físicos e tecnológicos do Anexo A.","resposta_correta":"b) Restringir e gerenciar a atribuição e o uso de direitos de acessos privilegiados.","justificativa":"O controle 8.2 (tema Tecnológico) exige que a atribuição e o uso de direitos de acessos privilegiados sejam restritos e gerenciados. Acessos privilegiados (como administradores de sistema, root, DBA) representam um risco elevado por seu alto poder sobre sistemas e dados, exigindo controles como concessão sob o princípio do menor privilégio, aprovação formal, revisão periódica e uso de contas separadas (privilegiada vs. comum) para o mesmo indivíduo.","alternativas_incorretas":["Conceder privilégios livremente a quem solicitar é exatamente o oposto do princípio de menor privilégio e da gestão restritiva que o controle exige, aumentando desnecessariamente a superfície de risco.","Uma auditoria apenas anual, isolada, não é suficiente nem representa a exigência central do controle, que é a restrição e gestão contínua (concessão, revisão periódica, revogação) — não uma checagem pontual uma vez por ano."],"dica":"Direitos privilegiados (8.2) sempre remetem ao princípio do menor privilégio (least privilege) e à segregação de funções — desconfie de alternativas que falam em conceder acesso amplo \"por conveniência\" ou \"sob demanda sem critério\".","resumo":"Quem tem \"poder de root\" precisa de controle redobrado, não de liberdade total."},{"numero":47,"enunciado":"Cenário 20: A \"CyberProtection Solutions\" está implementando controles tecnológicos do Anexo A, com foco na proteção contra ameaças.","resposta_correta":"b) Implemente proteção contra malware apoiada pela conscientização adequada do usuário.","justificativa":"O controle 8.7 exige que proteção contra malware seja implementada e apoiada por conscientização adequada dos usuários. A norma reconhece que controles puramente técnicos (antivírus, EDR, filtros) não são suficientes isoladamente — o fator humano (reconhecer phishing, evitar downloads suspeitos, seguir boas práticas) é parte essencial da defesa em profundidade contra malware.","alternativas_incorretas":["Confiar \"exclusivamente\" em ferramentas automáticas ignora a exigência explícita do controle de que a proteção técnica seja combinada com conscientização do usuário — uma defesa unicamente tecnológica é insuficiente por si só.","Bloquear completamente o acesso à internet é uma medida extrema e geralmente inviável para a operação do negócio; o controle não exige isolamento total, mas sim uma combinação equilibrada de controles técnicos, procedimentos e conscientização proporcional ao risco."],"dica":"Controles tecnológicos do Anexo A frequentemente exigem complementaridade entre tecnologia e pessoas — \"ferramenta apoiada por conscientização\" é um padrão textual comum em vários controles de tema Tecnológico (ex.: 8.7, phishing, engenharia social).","resumo":"Antivírus sozinho não basta: usuário consciente é parte da defesa contra malware."},{"numero":48,"enunciado":"Cenário 20: A \"CyberProtection Solutions\" está implementando controles tecnológicos do Anexo A, com foco na proteção contra ameaças.","resposta_correta":"b) Estabelecidas, documentadas, implementadas, monitoradas e analisadas criticamente.","justificativa":"O controle 8.9 exige que as configurações, incluindo configurações de segurança, de hardware, software, serviços e redes, sejam estabelecidas, documentadas, implementadas, monitoradas e analisadas criticamente. O objetivo é assegurar que os sistemas operem de forma segura conforme configurações previstas (baseline seguro), detectando e corrigindo desvios não autorizados que possam introduzir vulnerabilidades.","alternativas_incorretas":["Deixar sistemas em configuração padrão de fábrica é uma prática de risco elevado, pois configurações-padrão são amplamente conhecidas (inclusive por atacantes) e geralmente não seguem princípios de hardening — contraria diretamente o propósito do controle.","\"Segredo\" sobre configurações (segurança por obscuridade) não é o mecanismo de proteção previsto pelo controle 8.9 — a segurança vem de configurações robustas, documentadas e monitoradas, não de ocultação, prática amplamente desaconselhada em segurança da informação."],"dica":"O controle 8.9 (gestão de configuração) está ligado ao conceito de baseline de segurança e hardening — associe sempre a documentação e o monitoramento de desvios de configuração, não a \"esconder\" ou \"deixar como veio de fábrica\".","resumo":"Configuração segura é documentada e monitorada — nunca \"padrão de fábrica\" nem \"segredo\"."},{"numero":49,"enunciado":"Cenário 20: A \"CyberProtection Solutions\" está implementando controles tecnológicos do Anexo A, com foco na proteção contra ameaças.","resposta_correta":"b) Aplicar medidas de prevenção de vazamento de dados a sistemas, redes e dispositivos que tratem informações sensíveis.","justificativa":"O controle 8.12 exige que medidas de prevenção de vazamento de dados sejam aplicadas a sistemas, redes e quaisquer outros dispositivos que processem, armazenem ou transmitam informação sensível. Isso inclui, por exemplo, soluções de DLP (Data Loss Prevention), monitoramento de canais de saída de dados (e-mail, USB, upload), classificação prévia da informação e políticas de restrição de transferência de dados sensíveis para fora do ambiente controlado — uma postura preventiva, não apenas reativa.","alternativas_incorretas":["Monitorar apenas a internet em busca de dados já vazados é uma postura reativa (detecção pós-fato), enquanto o controle exige medidas preventivas aplicadas internamente aos sistemas, redes e dispositivos, antes que o vazamento ocorra.","\"Aceitar que vazamentos são inevitáveis\" contraria frontalmente o propósito do controle, cujo nome já indica \"prevenção\" — a norma não endossa uma postura de resignação, mas de mitigação proativa do risco de vazamento."],"dica":"DLP (8.12) é sobre prevenção, aplicada nos pontos de saída de dados sensíveis (endpoints, e-mail, rede, nuvem) — desconfie de alternativas que descrevem apenas monitoramento externo ou resposta a incidente já ocorrido, pois isso caracterizaria outros controles (ex.: 5.24-5.28, gestão de incidentes).","resumo":"DLP é prevenção na saída dos dados sensíveis — não é só \"procurar o que já vazou\"."},{"numero":50,"enunciado":"Cenário 21: A \"Serviços em Nuvem Confiáveis\" está gerenciando a operação do SGSI.","resposta_correta":"b) Estabelecer critérios para os processos e implementar controles de acordo com esses critérios, com informação documentada para gerar confiança.","justificativa":"A cláusula 8.1 (Planejamento e controle operacionais) exige que a organização planeje, implemente e controle os processos necessários para atender aos requisitos de segurança da informação e para implementar as ações determinadas em 6.1 e 6.2, estabelecendo critérios para esses processos e implementando o controle deles de acordo com esses critérios. Também exige manter informação documentada na extensão necessária para ter confiança de que os processos foram realizados conforme planejado.","alternativas_incorretas":["A norma não exige criação de um processo novo a cada nova tecnologia — o que se exige é que os processos existentes (ou adaptados) sejam controlados conforme critérios definidos, e não uma proliferação automática de processos por tecnologia adotada.","A cláusula 8.1 não se limita a \"documentar o que já existe\" sem intervenção — ela exige planejamento, implementação e controle ativos dos processos, com critérios estabelecidos e evidências de execução conforme planejado, o que pode envolver criação de novos controles quando necessário."],"dica":"A cláusula 8.1 é a \"cláusula de execução operacional\" do PDCA — associe-a a: planejar → implementar → controlar → documentar evidências de que tudo ocorreu conforme planejado.","resumo":"Operação (8.1) é colocar o plano em prática, com critérios definidos e evidências de que funcionou como planejado."},{"numero":51,"enunciado":"Cenário 21: A \"Serviços em Nuvem Confiáveis\" está gerenciando a operação do SGSI.","resposta_correta":"b) Para garantir que o SGSI permaneça relevante e eficaz diante de um ambiente de risco em constante mudança.","justificativa":"A cláusula 8.2 exige que a organização realize avaliações de riscos de segurança da informa
