<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2b2b2b">
<title>Texto para Áudio | GuardianTech Portal</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<!-- Motor de voz offline (Piper + ONNX Runtime), executa no navegador. Nenhuma chave é necessária. -->
<script type="importmap">
{"imports":{"onnxruntime-web/wasm":"https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.mjs"}}
</script>
<style>
:root{
  --brand:#ffb366; --brand-2:#ffc480; --brand-ink:#2b2b2b;
  --bg:#2f2f2f; --bg-2:#3a3a3a; --surface:#3d3d3d; --surface-2:#474747;
  --text:#f4f4f4; --text-2:#c4c4c4; --border:#5a5a5a;
  --ok:#5bd38a; --err:#ff8a80; --shadow:0 8px 24px rgba(0,0,0,.25); --radius:14px;
}
:root[data-theme="light"]{
  --bg:#f6f3ef; --bg-2:#ffffff; --surface:#ffffff; --surface-2:#f1ece6;
  --text:#1f1f1f; --text-2:#4a4a4a; --border:#ddd3c8; --brand-ink:#1f1f1f;
  --brand:#c76a12; --brand-2:#e08a35; --err:#b3261e; --shadow:0 6px 18px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Verdana,Arial,sans-serif;
  background:linear-gradient(135deg,var(--bg) 0%,var(--bg-2) 100%) fixed;color:var(--text);line-height:1.6;min-height:100vh}
body.leitura{font-family:Verdana,Tahoma,sans-serif;letter-spacing:.03em;word-spacing:.12em;line-height:1.8}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px;border-radius:6px}
.site-header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 94%,transparent);
  backdrop-filter:blur(12px);border-bottom:2px solid var(--brand);box-shadow:var(--shadow)}
.header-row{max-width:900px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.2em;color:var(--brand);text-decoration:none;margin-right:auto}
.icon-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;
  padding:9px 12px;cursor:pointer;font-size:.9em;font-weight:600;text-decoration:none}
.icon-btn[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
main{max-width:900px;margin:0 auto;padding:24px}
h1{font-size:1.6em;margin-bottom:4px}
.sub{color:var(--text-2);margin-bottom:20px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
label{display:block;font-weight:600;margin-bottom:6px}
textarea{width:100%;min-height:220px;resize:vertical;padding:14px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg-2);color:var(--text);font:inherit;font-size:1.05em}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:12px}
.row.between{justify-content:space-between}
.count{color:var(--text-2);font-size:.9em}
.count.over{color:var(--err);font-weight:700}
select{padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg-2);color:var(--text);font:inherit}
.field{display:flex;flex-direction:column;min-width:170px}
.btn{border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:10px;
  padding:12px 18px;cursor:pointer;font:inherit;font-weight:700}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:not(:disabled):hover{border-color:var(--brand)}
.status{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border)}
.status.erro{border-color:var(--err);color:var(--err)}
.bar{height:8px;border-radius:99px;background:var(--bg-2);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;width:0;background:var(--brand);transition:width .2s}
audio{width:100%;margin-top:6px}
.hidden{display:none!important}
.hint{color:var(--text-2);font-size:.88em;margin-top:8px}
@media (max-width:600px){.header-row,main{padding-left:16px;padding-right:16px}.btn{flex:1 1 auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="site-header">
  <div class="header-row">
    <a href="./index.html" class="logo">🛡️ GuardianTech Portal</a>
    <button class="icon-btn" id="btn-leitura" aria-pressed="false" title="Fonte e espaçamento para leitura">Aa</button>
    <button class="icon-btn" id="btn-tema" aria-pressed="false" title="Alternar tema claro ou escuro">☀︎</button>
  </div>
</header>

<main>
  <h1>🔊 Texto para Áudio</h1>
  <p class="sub">Cole um texto ou envie um arquivo .txt. A voz é gerada no seu navegador, sem enviar nada para servidores.</p>

  <section class="panel">
    <label for="texto">Texto</label>
    <textarea id="texto" placeholder="Cole ou digite o texto aqui" maxlength="20000"></textarea>
    <div class="row between">
      <span class="count" id="contador" aria-live="polite">0 / 20000 caracteres</span>
      <span>
        <input type="file" id="arquivo" accept=".txt,text/plain" class="hidden">
        <button class="btn" id="btn-arquivo" type="button">Enviar arquivo .txt</button>
        <button class="btn" id="btn-limpar" type="button">Limpar</button>
      </span>
    </div>
  </section>

  <section class="panel">
    <div class="row" style="margin-top:0">
      <div class="field">
        <label for="voz">Voz</label>
        <select id="voz">
          <option value="pt_BR-faber-medium">Faber (masculina, qualidade média)</option>
          <option value="pt_BR-edresson-low">Edresson (masculina, mais leve)</option>
        </select>
      </div>
      <div class="field">
        <label for="vel">Velocidade</label>
        <select id="vel">
          <option value="0.75">0,75x</option>
          <option value="1" selected>1x</option>
          <option value="1.25">1,25x</option>
          <option value="1.5">1,5x</option>
          <option value="2">2x</option>
        </select>
      </div>
    </div>
    <div class="row">
      <button class="btn primary" id="btn-gerar" type="button">Gerar áudio</button>
    </div>
    <p class="hint">Na primeira vez, o navegador baixa o modelo de voz (cerca de 60 MB) e guarda para os próximos usos.</p>

    <div class="status hidden" id="status" role="status" aria-live="polite">
      <span id="status-txt"></span>
      <div class="bar"><i id="barra"></i></div>
    </div>
  </section>

  <section class="panel hidden" id="resultado">
    <label for="player">Áudio gerado</label>
    <audio id="player" controls></audio>
    <div class="row">
      <button class="btn" id="btn-wav" type="button">Baixar WAV</button>
      <button class="btn" id="btn-mp3" type="button">Baixar MP3</button>
    </div>
  </section>
</main>

<script>
/* ===== Preferências (mesmas chaves do portal) ===== */
const $ = s => document.querySelector(s);
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
function aplicarPreferencias(){
  const tema = store.get('gt_tema','dark');
  document.documentElement.dataset.theme = tema;
  $('#btn-tema').setAttribute('aria-pressed', tema==='light');
  $('#btn-tema').textContent = tema==='light' ? '☾' : '☀︎';
  const leitura = store.get('gt_leitura', false);
  document.body.classList.toggle('leitura', leitura);
  $('#btn-leitura').setAttribute('aria-pressed', leitura);
}
$('#btn-tema').onclick = () => { store.set('gt_tema', store.get('gt_tema','dark')==='dark'?'light':'dark'); aplicarPreferencias(); };
$('#btn-leitura').onclick = () => { store.set('gt_leitura', !store.get('gt_leitura',false)); aplicarPreferencias(); };
aplicarPreferencias();

/* ===== Texto ===== */
const LIMITE = 20000;
const texto = $('#texto');
function atualizarContador(){
  const n = texto.value.length;
  const el = $('#contador');
  el.textContent = `${n} / ${LIMITE} caracteres`;
  el.classList.toggle('over', n >= LIMITE);
}
texto.addEventListener('input', atualizarContador);
$('#btn-limpar').onclick = () => { texto.value=''; atualizarContador(); texto.focus(); };
$('#btn-arquivo').onclick = () => $('#arquivo').click();
$('#arquivo').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if(!f) return;
  if(f.size > 1024*1024) return mostrarErro('Arquivo grande demais. O limite é 1 MB.');
  const t = (await f.text()).replace(/\r\n?/g,'\n');
  texto.value = t.slice(0, LIMITE);
  atualizarContador();
  if(t.length > LIMITE) mostrarErro(`O arquivo tem ${t.length} caracteres. Só os primeiros ${LIMITE} foram carregados.`);
};

/* ===== Estado e mensagens ===== */
function mostrar(msg, pct){
  const s = $('#status'); s.classList.remove('hidden','erro');
  $('#status-txt').textContent = msg;
  $('.bar').classList.toggle('hidden', pct==null);
  if(pct!=null) $('#barra').style.width = Math.max(0,Math.min(100,pct))+'%';
}
function mostrarErro(msg){
  const s = $('#status'); s.classList.remove('hidden'); s.classList.add('erro');
  $('#status-txt').textContent = msg;
  $('.bar').classList.add('hidden');
}
function esconderStatus(){ $('#status').classList.add('hidden'); }

/* ===== Divisão do texto em trechos curtos (o motor funciona melhor assim) ===== */
function dividir(t){
  const frases = t.replace(/\s+/g,' ').trim().match(/[^.!?;:\n]+[.!?;:]*\s*/g) || [];
  const trechos = []; let atual = '';
  for(const f of frases){
    if((atual+f).length > 220 && atual){ trechos.push(atual.trim()); atual = f; }
    else atual += f;
  }
  if(atual.trim()) trechos.push(atual.trim());
  return trechos.flatMap(c => c.length<=400 ? [c] : c.match(/.{1,380}(\s|$)/g).map(x=>x.trim()));
}

/* ===== WAV: junta os trechos em um único arquivo ===== */
function lerWav(buf){
  const v = new DataView(buf);
  let pos = 12, fmt = null, data = null;
  while(pos+8 <= buf.byteLength){
    const id = String.fromCharCode(v.getUint8(pos),v.getUint8(pos+1),v.getUint8(pos+2),v.getUint8(pos+3));
    const tam = v.getUint32(pos+4,true);
    if(id==='fmt ') fmt = {canais:v.getUint16(pos+10,true), taxa:v.getUint32(pos+12,true), bits:v.getUint16(pos+22,true)};
    if(id==='data'){ data = new Uint8Array(buf, pos+8, Math.min(tam, buf.byteLength-pos-8)); break; }
    pos += 8 + tam + (tam%2);
  }
  if(!fmt || !data) throw new Error('Áudio inválido recebido do motor de voz.');
  return {...fmt, pcm:data};
}
function montarWav(partes){
  const {canais,taxa,bits} = partes[0];
  const total = partes.reduce((a,p)=>a+p.pcm.length,0);
  const out = new ArrayBuffer(44+total), v = new DataView(out);
  const s = (o,t)=>[...t].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  s(0,'RIFF'); v.setUint32(4,36+total,true); s(8,'WAVE'); s(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,canais,true);
  v.setUint32(24,taxa,true); v.setUint32(28,taxa*canais*bits/8,true);
  v.setUint16(32,canais*bits/8,true); v.setUint16(34,bits,true);
  s(36,'data'); v.setUint32(40,total,true);
  let o = 44; for(const p of partes){ new Uint8Array(out,o,p.pcm.length).set(p.pcm); o += p.pcm.length; }
  return {blob:new Blob([out],{type:'audio/wav'}), canais, taxa, pcm16:new Int16Array(out,44,total>>1)};
}

/* ===== Motor de voz (Piper) ===== */
const ONNX_BASE = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/';
let Piper = null, sessao = null, vozSessao = null;
async function obterSessao(voiceId, aoProgresso){
  if(!Piper) Piper = await import('https://cdn.jsdelivr.net/npm/@mintplex-labs/piper-tts-web@1.0.5/dist/piper-tts-web.js');
  if(sessao && vozSessao === voiceId) return sessao;
  sessao = await Piper.TtsSession.create({
    voiceId, progress: aoProgresso,
    wasmPaths: { ...Piper.TtsSession.WASM_LOCATIONS, onnxWasm: ONNX_BASE }
  });
  vozSessao = voiceId;
  return sessao;
}

/* ===== Gerar ===== */
let resultado = null; // {blob, pcm16, taxa, canais}
$('#btn-gerar').onclick = async () => {
  const t = texto.value.trim();
  if(!t) return mostrarErro('Digite ou cole um texto antes de gerar o áudio.');
  const btn = $('#btn-gerar'); btn.disabled = true;
  $('#resultado').classList.add('hidden');
  try{
    mostrar('Carregando o motor de voz...', 0);
    const sess = await obterSessao($('#voz').value, p => {
      if(p && p.total) mostrar(`Baixando modelo de voz: ${Math.round(p.loaded*100/p.total)}%`, p.loaded*100/p.total);
    });
    const trechos = dividir(t), partes = [];
    for(let i=0;i<trechos.length;i++){
      mostrar(`Gerando áudio: trecho ${i+1} de ${trechos.length}`, i*100/trechos.length);
      partes.push(lerWav(await (await sess.predict(trechos[i])).arrayBuffer()));
    }
    resultado = montarWav(partes);
    const player = $('#player');
    if(player.dataset.url) URL.revokeObjectURL(player.dataset.url);
    player.dataset.url = URL.createObjectURL(resultado.blob);
    player.src = player.dataset.url;
    player.playbackRate = parseFloat($('#vel').value);
    $('#resultado').classList.remove('hidden');
    mostrar('Áudio pronto.', 100);
    player.focus();
  }catch(err){
    console.error(err);
    mostrarErro('Não foi possível gerar o áudio. Verifique a conexão com a internet e tente de novo.');
  }finally{
    btn.disabled = false;
  }
};
$('#vel').onchange = () => { $('#player').playbackRate = parseFloat($('#vel').value); };
$('#player').addEventListener('play', () => { $('#player').playbackRate = parseFloat($('#vel').value); });

/* ===== Downloads ===== */
function baixar(blob, nome){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
const nomeArquivo = ext => `texto-para-audio-${new Date().toISOString().slice(0,10)}.${ext}`;
$('#btn-wav').onclick = () => resultado && baixar(resultado.blob, nomeArquivo('wav'));
$('#btn-mp3').onclick = async () => {
  if(!resultado) return;
  const btn = $('#btn-mp3'); btn.disabled = true;
  try{
    mostrar('Convertendo para MP3...', null);
    if(!window.lamejs) await new Promise((ok,no)=>{
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js';
      s.onload = ok; s.onerror = no; document.head.appendChild(s);
    });
    const enc = new lamejs.Mp3Encoder(resultado.canais, resultado.taxa, 128);
    const pcm = resultado.pcm16, blocos = [], passo = 1152;
    for(let i=0;i<pcm.length;i+=passo){
      const b = enc.encodeBuffer(pcm.subarray(i,i+passo));
      if(b.length) blocos.push(new Uint8Array(b));
    }
    const fim = enc.flush(); if(fim.length) blocos.push(new Uint8Array(fim));
    baixar(new Blob(blocos,{type:'audio/mpeg'}), nomeArquivo('mp3'));
    mostrar('MP3 baixado.', null);
  }catch(err){
    console.error(err);
    mostrarErro('Não foi possível converter para MP3. Use o botão Baixar WAV.');
  }finally{ btn.disabled = false; }
};
atualizarContador();
</script>
</body>
</html>
