 é assegurar que a interpretação dos dados seja feita por pessoas com competência adequada (ligação com a cláusula 7.2), gerando conclusões confiáveis que suportem decisões de gestão de riscos, ações corretivas e melhoria contínua com base em informações precisas e bem fundamentadas.","analisa":"- a) A norma não exige que a responsabilidade recaia sobre \"um único indivíduo\" nem dispensa a necessidade de qualificação — pelo contrário, o propósito é assegurar competência adequada de quem analisa, podendo envolver mais de uma pessoa ou função.\n- c) A cláusula 9.1 f) trata de quem realiza a análise dos resultados, não de restrição de acesso aos dados brutos de monitoramento — controle de acesso à informação é tratado por outros controles (por exemplo, do tema Tecnológico do Anexo A), não pela definição de responsáveis pela análise de desempenho.","dica":"Sempre que a norma perguntar \"quem\" em uma cláusula de gestão, a resposta correta normalmente remete a competência e clareza de papéis/responsabilidades — não a restrição de acesso ou centralização arbitrária em uma única pessoa.","resumo":"Definir \"quem analisa\" garante que os dados virem decisão confiável, não só números soltos."},"56":{"resposta_correta":"b) Se o SGSI está em conformidade com os próprios requisitos da organização e os da norma, e se está efetivamente implementado e mantido.","justificativa":"A cláusula 9.2.1 estabelece que a organização deve conduzir auditorias internas a intervalos planejados para prover informação sobre se o SGSI está em conformidade com os requisitos da própria organização para o seu SGSI e com os requisitos da ISO/IEC 27001:2022, e se está efetivamente implementado e mantido. A auditoria interna é, portanto, um mecanismo de verificação dupla: conformidade normativa (a norma) e conformidade interna (o que a própria organização definiu para si).","analisa":"- a) A auditoria interna do SGSI não se limita a \"outras normas\" — seu foco é a própria ISO/IEC 27001 e os requisitos internos definidos pela organização para seu SGSI, não normas externas de terceiros.\n- c) Habilidades de negociação não são objeto de avaliação da auditoria interna do SGSI — o foco é a conformidade e eficácia do sistema de gestão, embora a cláusula 9.2.2 trate de competência e objetividade dos auditores (não de negociação).","dica":"Auditoria interna (9.2) sempre verifica dois níveis de conformidade: (1) requisitos próprios da organização (política, procedimentos internos) e (2) requisitos da norma ISO/IEC 27001 em si — memorize essa dualidade.","resumo":"Auditoria interna checa se o SGSI cumpre a norma E cumpre o que a própria empresa prometeu fazer."},"57":{"resposta_correta":"b) A objetividade e imparcialidade do processo de auditoria.","justificativa":"A cláusula 9.2.2 b) exige que a organização selecione auditores e conduza auditorias que assegurem objetividade e a imparcialidade do processo de auditoria. Isso normalmente é operacionalizado exigindo que o auditor não audite seu próprio trabalho (independência funcional), garantindo uma avaliação isenta e não viesada da conformidade e eficácia do SGSI.","analisa":"- a) Permitir que responsáveis pelo próprio processo o auditem viola diretamente o princípio de imparcialidade exigido pela cláusula — auditar o próprio trabalho compromete a objetividade da avaliação, um erro clássico de auditoria interna.\n- c) A norma não define uma regra de \"treinamento único sem atualização\" — pelo contrário, a manutenção de competência de auditores (relacionada à cláusula 7.2) é um processo contínuo, especialmente considerando que normas e riscos evoluem ao longo do tempo.","dica":"\"Auditor não pode auditar seu próprio trabalho\" é uma regra de ouro em qualquer prova de auditoria (ISO 19011 e ISO 27001). Sempre que uma alternativa sugerir isso, é distrator certo.","resumo":"Quem faz o processo não pode ser quem audita o mesmo processo — objetividade em primeiro lugar."},"58":{"resposta_correta":"b) Situação das ações anteriores, mudanças no contexto, feedback de desempenho (não conformidades, monitoramento, auditorias, objetivos), avaliação de riscos e oportunidades de melhoria.","justificativa":"A cláusula 9.3.2 lista as entradas que a análise crítica pela Direção deve considerar: situação de ações provenientes de análises críticas anteriores; mudanças em questões internas e externas relevantes ao SGSI; mudanças nas necessidades e expectativas das partes interessadas; feedback sobre o desempenho da segurança da informação (não conformidades e ações corretivas, resultados de monitoramento e medição, resultados de auditoria, cumprimento dos objetivos); feedback de partes interessadas; resultados da avaliação de riscos e situação do plano de tratamento de riscos; e oportunidades de melhoria contínua. É um conjunto amplo e multidimensional de entradas.","analisa":"- a) Restringir a \"apenas orçamento de TI\" ignora completamente o rol amplo de entradas exigidas pela cláusula 9.3.2, que abrange desde contexto organizacional até desempenho de segurança e riscos.\n- c) Focar exclusivamente em relatórios de incidentes, sem considerar proatividade, deixa de fora elementos essenciais como mudanças de contexto, feedback de auditoria, cumprimento de objetivos e oportunidades de melhoria — a análise crítica é deliberadamente ampla, não reativa a incidentes apenas.","dica":"A cláusula 9.3.2 (entradas da análise crítica) é extensa e cobrada literalmente em provas — memorize a lógica: \"o que mudou\" (contexto, partes interessadas) + \"como estamos indo\" (desempenho, riscos, auditorias) + \"o que aprendemos antes\" (ações anteriores) + \"para onde podemos melhorar\" (oportunidades).","resumo":"Análise crítica junta passado (ações antigas), presente (desempenho e riscos) e futuro (oportunidades de melhoria) — não é sobre TI ou incidentes isoladamente."},"59":{"resposta_correta":"b) Oportunidades para melhoria contínua e quaisquer necessidades de mudanças do SGSI.","justificativa":"A cláusula 9.3.3 estabelece que os resultados (saídas) da análise crítica pela Direção devem incluir decisões relacionadas a oportunidades de melhoria contínua e a quaisquer necessidades de mudança no SGSI. Essas saídas são, tipicamente, registradas como informação documentada e alimentam o ciclo de melhoria contínua (cláusula 10), fechando o círculo do PDCA no nível estratégico da organização.","analisa":"- a) Decisões sobre contratações não são o foco definido pela norma para as saídas da análise crítica — o foco é estritamente sobre a melhoria contínua e mudanças necessárias no SGSI, ainda que isso possa eventualmente implicar decisões de recursos.\n- c) Se a análise crítica é conduzida corretamente, é esperado que gere pelo menos uma reflexão sobre oportunidades de melhoria ou necessidades de mudança — uma saída de \"nenhuma alteração, sempre\" ao longo do tempo é atipicamente estática e contraria o espírito de melhoria contínua da norma (cláusula 10.1).","dica":"Associe sempre as saídas da análise crítica (9.3.3) à cláusula 10 (Melhoria) — a análise crítica é o \"gatilho formal de alto nível\" que decide sobre mudanças e melhorias no SGSI.","resumo":"Toda análise crítica termina em decisão: melhorar algo ou mudar algo — nunca é só \"reunião pela reunião\"."},"60":{"resposta_correta":"b) Produza, armazene, proteja e analise logs que registrem atividades, exceções, falhas e outros eventos relevantes.","justificativa":"O controle 8.15 exige que logs que registrem atividades, exceções, falhas e outros eventos relevantes sejam produzidos, armazenados, protegidos e analisados. Isso proporciona rastreabilidade de eventos de segurança, é essencial para investigação de incidentes, detecção de comportamentos anômalos e conformidade regulatória — e a proteção dos próprios logs contra alteração ou exclusão indevida é parte fundamental do controle (evitando que um invasor apague seus rastros).","analisa":"- a) Restringir o registro apenas a \"erros graves\" é insuficiente — o controle exige o registro amplo de atividades, exceções, falhas e outros eventos relevantes, não apenas os mais críticos, para permitir análise abrangente e correlação de eventos.\n- c) Apagar logs regularmente contraria diretamente o propósito do controle, que exige armazenamento e proteção dos logs por período apropriado — a exclusão precoce compromete investigações forenses e a capacidade de detecção retroativa de incidentes.","dica":"O controle 8.15 sempre remete aos quatro verbos: produzir, armazenar, proteger e analisar logs — e frequentemente é cobrado junto ao 8.16 (monitoramento), pois logs sem análise/monitoramento têm valor limitado.","resumo":"Log tem que existir, ser guardado, ser protegido contra adulteração e, principalmente, ser analisado."},"61":{"resposta_correta":"b) Redes, sistemas e aplicações por comportamentos anômalos e tome ações apropriadas para avaliar possíveis incidentes de segurança da informação.","justificativa":"O controle 8.16 exige que redes, sistemas e aplicações sejam monitorados quanto a comportamentos anômalos, e que ações apropriadas sejam tomadas para avaliar potenciais incidentes de segurança da informação. Esse monitoramento contínuo (muitas vezes com ferramentas de SIEM, IDS/IPS) é o que permite detecção precoce de atividades suspeitas, complementando o registro de logs (8.15) com a análise ativa em tempo real ou quase real.","analisa":"- a) Restringir o monitoramento à \"performance dos usuários\" desvia do propósito de segurança do controle, que é detectar comportamentos anômalos que possam indicar incidentes, não avaliar produtividade individual.\n- c) Consumo de energia dos equipamentos é uma métrica operacional/de infraestrutura, sem relação com o propósito de detecção de incidentes de segurança que o controle 8.16 estabelece.","dica":"Distinga 8.15 (log = registrar o que aconteceu) de 8.16 (monitoramento = observar ativamente em busca de anomalias e agir). Um é o \"arquivo\", o outro é a \"vigilância ativa\".","resumo":"Monitoramento é vigilância ativa por anomalias — não é medir produtividade nem energia."},"62":{"resposta_correta":"b) Para demonstrar que as atividades de avaliação foram realizadas, os resultados obtidos e as conclusões tiradas, apoiando a tomada de decisões e a melhoria.","justificativa":"A cláusula 9.1 exige que a organização retenha informação documentada apropriada como evidência dos resultados de monitoramento e medição. Essa evidência serve tanto para auditoria (comprovar que a avaliação de desempenho realmente ocorreu) quanto para uso gerencial prático: dar suporte a decisões informadas de gestão de riscos, ações corretivas (cláusula 10.2) e à própria análise crítica pela Direção (cláusula 9.3), fechando o ciclo de avaliação de desempenho com propósito real, não apenas burocrático.","analisa":"- a) A documentação não é \"arquivamento sem uso prático\" — ela serve ativamente à tomada de decisões, à identificação de tendências e à melhoria contínua, sendo insumo direto para outras cláusulas (9.3, 10).\n- c) A retenção de evidências tem o efeito oposto de \"ignorar sem rastreabilidade\": ela justamente cria rastreabilidade e transparência sobre os resultados, inclusive os desfavoráveis, forçando que sejam tratados (e não escondidos).","dica":"Documentação na ISO 27001 nunca é \"burocracia pela burocracia\" — a prova sempre valoriza alternativas que conectam a documentação a um propósito prático (rastreabilidade, evidência, apoio à decisão, melhoria).","resumo":"Evidência documentada existe para ser usada na gestão, não para ficar guardada sem função."},"63":{"resposta_correta":"a) Se o SGSI é relevante para o propósito da organização e seu contexto atual.","justificativa":"A cláusula 9.3.1 exige que a Alta Direção analise criticamente o SGSI da organização, a intervalos planejados, para assegurar sua contínua pertinência, adequação e eficácia. \"Pertinência\" (relevância) refere-se a se o SGSI ainda faz sentido e continua alinhado ao propósito, ao contexto (interno e externo, ligado à cláusula 4.1) e às necessidades atuais da organização — que podem ter mudado desde a implementação original.","analisa":"- b) Pertinência não trata de \"estado da arte tecnológico\" — um SGSI pode ser plenamente pertinente e eficaz usando tecnologias maduras e adequadas ao contexto, sem precisar ser o mais avançado do mercado.\n- c) Aderência orçamentária é uma questão de gestão financeira de projeto, não o conceito de pertinência do SGSI conforme definido pela norma, que se relaciona a relevância estratégica e contextual, não a controle de custos.","dica":"A análise crítica avalia três dimensões clássicas do SGSI: pertinência (ainda faz sentido/é relevante?), adequação (é suficiente para o propósito?) e eficácia (está produzindo os resultados esperados?). Memorize esse trio — é cobrado com frequência.","resumo":"Pertinência = \"isso ainda faz sentido para nós, hoje?\" — não é sobre tecnologia de ponta ou orçamento."},"64":{"resposta_correta":"b) A pertinência, a adequação e a eficácia do sistema de gestão da segurança da informação.","justificativa":"A cláusula 10.1 estabelece que a organização deve melhorar continuamente a pertinência, adequação e eficácia do SGSI — os mesmos três atributos avaliados na análise crítica (9.3.1). A melhoria contínua é o \"fechamento\" do ciclo PDCA: com base no que foi monitorado, auditado e analisado criticamente, a organização atua para tornar o sistema cada vez mais relevante, suficiente e eficaz ao longo do tempo.","analisa":"- a) O número de funcionários dedicados à segurança pode ser um recurso ajustado conforme necessidade (cláusula 7.1), mas não é o foco definido pela cláusula 10.1, que trata da melhoria do sistema de gestão como um todo, não de headcount.\n- c) Resultados financeiros da organização não são o objeto da melhoria contínua exigida por 10.1 — o foco é estritamente sobre o SGSI (pertinência, adequação, eficácia), embora bons resultados de segurança possam ter efeitos financeiros indiretos positivos.","dica":"Conecte sempre 9.3.1 (o que se avalia na análise crítica) com 10.1 (o que se melhora continuamente) — são os mesmos três conceitos: pertinência, adequação, eficácia.","resumo":"10.1 fecha o ciclo: melhorar sempre pertinência, adequação e eficácia do SGSI — não headcount, não finanças da empresa."},"65":{"resposta_correta":"b) Tomar ações para controlá-la e corrigi-la, e lidar com as consequências.","justificativa":"A cláusula 10.2 a) exige que, ao ocorrer uma não conformidade, a organização reaja a ela, tomando ação para controlá-la e corrigi-la, e lidando com as consequências. Essa é a primeira etapa do tratamento de não conformidade, focada na contenção imediata do problema (correção), antes mesmo de investigar e eliminar a causa raiz (etapa tratada na alínea b, que leva à ação corretiva propriamente dita).","analisa":"- a) A norma não permite ignorar não conformidades com base em \"ausência de impacto imediato\" — toda não conformidade identificada deve ser reagida (controlada e corrigida), independentemente da percepção inicial de gravidade, já que impactos podem não ser óbvios de imediato.\n- c) A responsabilidade pelo tratamento da não conformidade é da própria organização que opera o SGSI — não pode ser simplesmente transferida a terceiros, ainda que causas externas possam ter contribuído para o problema.","dica":"Distinga \"correção\" (ação imediata para conter/corrigir o efeito, cláusula 10.2 a) de \"ação corretiva\" (eliminar a causa raiz para evitar recorrência, cláusula 10.2 b-d) — são conceitos e etapas diferentes, frequentemente confundidos em prova.","resumo":"Primeiro contém e corrige o problema; depois (ação corretiva) elimina a causa raiz — são etapas distintas."},"66":{"resposta_correta":"b) Avaliar a necessidade de ações para eliminar as causas da não conformidade, a fim de evitar sua repetição ou ocorrência em outro lugar.","justificativa":"A cláusula 10.2 b) exige que a organização avalie a necessidade de ação para eliminar a(s) causa(s) da não conformidade, a fim de que ela não se repita ou ocorra em outro lugar, o que envolve analisar criticamente a não conformidade, determinar suas causas e determinar se não conformidades similares existem ou poderiam potencialmente ocorrer. Isso é o núcleo da abordagem de causa raiz — vai além do \"remendo\" imediato para tratar a origem do problema.","analisa":"- a) Apenas documentar e arquivar sem investigar a causa raiz contraria a exigência explícita de avaliar a necessidade de ação corretiva sistêmica, deixando a organização vulnerável à recorrência do mesmo problema.\n- c) Restringir a comunicação apenas aos \"envolvidos diretos\" não atende ao propósito de investigar se não conformidades similares podem existir em outras partes da organização — a análise de causa raiz frequentemente exige colaboração mais ampla do que apenas os diretamente afetados.","dica":"A frase \"evitar sua repetição ou ocorrência em outro lugar\" é quase literal da norma (10.2 b) — grife-a. Ela distingue ação corretiva (sistêmica, preventiva de recorrência) de simples correção (pontual).","resumo":"Ação corretiva mira a causa raiz — para não acontecer de novo, nem em outro canto da empresa."},"67":{"resposta_correta":"b) Para assegurar que as ações implementadas resolveram a não conformidade e foram eficazes em prevenir sua recorrência.","justificativa":"A cláusula 10.2 d) exige que a organização analise criticamente a eficácia de quaisquer ações corretivas tomadas. Isso fecha o ciclo PDCA da não conformidade: não basta implementar uma ação corretiva — é preciso verificar, com base em evidências (por exemplo, monitoramento subsequente, ausência de recorrência), se ela de fato resolveu o problema e eliminou (ou reduziu suficientemente) a causa raiz identificada.","analisa":"- a) A análise crítica de eficácia exige evidência de resultados práticos concretos — não é uma validação simbólica ou automática do trabalho realizado, sem comprovação real de que o problema foi resolvido.\n- c) O propósito da cláusula não é atribuir culpa ou responsabilização individual pela não conformidade original, mas sim verificar tecnicamente a eficácia da solução implementada — um enfoque de melhoria de sistema, não de punição de pessoas.","dica":"\"Analisar eficácia\" sempre implica verificação baseada em evidência de que o problema foi realmente resolvido — desconfie de alternativas que tratam isso como formalidade simbólica ou como busca de culpados.","resumo":"Ação corretiva só \"vale\" se comprovadamente funcionou — não basta ter sido implementada."},"68":{"resposta_correta":"b) Fortalecer e melhorar os controles da segurança da informação.","justificativa":"O controle 5.27 exige que o conhecimento obtido a partir de incidentes de segurança da informação seja usado para fortalecer e melhorar os controles de segurança da informação. Isso conecta diretamente a gestão de incidentes (controles 5.24 a 5.28) ao ciclo de melhoria contínua (cláusula 10) — cada incidente é uma oportunidade de aprendizado que retroalimenta a avaliação de riscos, o SoA e os próprios controles implementados, tornando o SGSI mais robusto ao longo do tempo.","analisa":"- a) Excluir controles que falharam, sem investigação e melhoria, é o oposto do propósito do controle 5.27 — a falha de um controle geralmente indica necessidade de reforço ou ajuste, não de eliminação pura e simples.\n- c) O propósito do controle não é meramente cumprir uma formalidade de documentação para fins de seguro — é usar o aprendizado de forma ativa para fortalecer a postura de segurança da organização, com efeito prático sobre os controles futuros.","dica":"5.27 é o \"elo\" entre gestão de incidentes e melhoria contínua — sempre que a prova mencionar \"lições aprendidas\" de incidente, pense em fortalecimento de controles, nunca em exclusão ou mera burocracia.","resumo":"Incidente vira aprendizado; aprendizado vira controle mais forte — nunca vira desculpa para remover proteção."},"69":{"resposta_correta":"b) Para fornecer evidências da aplicação do ciclo de melhoria contínua e facilitar a análise para futuras otimizações.","justificativa":"A cláusula 10.2 exige reter informação documentada como evidência da natureza das não conformidades e quaisquer ações subsequentes tomadas, e dos resultados de qualquer ação corretiva. Essa documentação sustenta a rastreabilidade do processo de melhoria, permite identificar padrões e tendências de não conformidades ao longo do tempo (insumo valioso para futuras análises críticas e avaliações de risco) e comprova, de forma auditável, que o ciclo \"identificar → corrigir → analisar causa → verificar eficácia\" foi efetivamente seguido.","analisa":"- a) Reduzir o propósito a \"apenas para auditoria, sem contribuir para melhoria real\" contraria a essência da exigência, que é justamente alimentar decisões futuras de melhoria com base em dados históricos confiáveis.\n- c) A documentação de não conformidades tem efeito de transparência e rastreabilidade, não de ocultação — pelo contrário, ela impede que problemas sejam \"varridos para debaixo do tapete\", pois ficam registrados e sujeitos a análise crítica e auditoria.","dica":"Toda exigência de \"reter informação documentada\" na cláusula 10.2 serve a um propósito duplo: evidência de conformidade processual E insumo de aprendizado organizacional — nunca é burocracia vazia ou instrumento de ocultação.","resumo":"Registrar não conformidades é abrir os olhos para padrões — não é varrer problemas para debaixo do tapete."},"70":{"resposta_correta":"b) Realizar mudanças no sistema de gestão da segurança da informação, quando necessário, para realinhar os processos.","justificativa":"A cláusula 10.2 e) prevê que, como parte do tratamento de não conformidade, a organização faça mudanças no SGSI, se necessário, com base no resultado da análise de causa raiz e na avaliação de necessidade de ação. Isso reforça que a melhoria contínua não é apenas ajuste pontual de um controle isolado — pode implicar alterações mais amplas no próprio sistema de gestão (processos, políticas, estrutura) quando isso for necessário para restaurar o alinhamento com os objetivos do SGSI.","analisa":"- a) Ignorar um desalinhamento identificado contraria diretamente o princípio de melhoria contínua (cláusula 10.1) e a exigência de reagir a não conformidades (10.2 a), deixando o problema sem tratamento.\n- c) \"Reestruturar completamente toda a organização\" é uma resposta desproporcional — a norma fala em fazer mudanças no SGSI quando necessário, de forma planejada (cláusula 6.3), não em uma reestruturação organizacional total e indiscriminada.","dica":"Desalinhamento de processo não significa \"revolução total\" — a resposta correta é sempre proporcional: ajustar o SGSI (com planejamento, cláusula 6.3) até restaurar o alinhamento necessário.","resumo":"Desalinhamento pede ajuste proporcional no SGSI, não reestruturação da empresa inteira."},"71":{"resposta_correta":"b) A melhoria contínua visa garantir que o SGSI evolua para continuar a alcançar e otimizar os objetivos de segurança da informação.","justificativa":"A cláusula 6.2 já prevê que os objetivos de segurança da informação devem ser monitorados e atualizados conforme apropriado, enquanto a cláusula 10.1 exige a melhoria contínua da pertinência, adequação e eficácia do SGSI. Essas duas cláusulas estão intrinsecamente conectadas: a melhoria contínua é o mecanismo pelo qual a organização garante que os objetivos continuem sendo alcançados de forma eficaz — e, quando necessário, revisados — à medida que o contexto, os riscos e as necessidades do negócio evoluem.","analisa":"- a) Tratar melhoria contínua e objetivos como \"processos separados sem relação direta\" ignora a interdependência estrutural entre planejamento (cláusula 6, que define objetivos) e melhoria (cláusula 10, que os mantém relevantes e evolutivos) dentro do ciclo PDCA do Anexo SL.\n- c) A cláusula 6.2 g) explicitamente exige que os objetivos sejam monitorados e atualizados, o que contraria a ideia de que sejam \"definidos apenas uma vez\" e permaneçam estáticos e imunes à melhoria contínua.","dica":"Cláusulas do Anexo SL nunca são \"ilhas\" isoladas — planejar (6), operar (8), avaliar (9) e melhorar (10) formam um ciclo interligado (PDCA). Questões que testam \"relação entre cláusulas\" quase sempre esperam reconhecimento dessa interdependência.","resumo":"Objetivos não são estátuas: a melhoria contínua os mantém vivos, relevantes e sempre otimizados."},"72":{"resposta_correta":"b) A relevância e adequação do SGSI aos propósitos e contexto da organização.","justificativa":"Como já estabelecido na cláusula 9.3.1, \"pertinência\" refere-se a quão relevante e apropriado o SGSI continua sendo para o propósito e o contexto (interno e externo) da organização. A cláusula 10.1 exige que a organização melhore continuamente essa pertinência (além de adequação e eficácia), o que significa reavaliar e ajustar o SGSI à medida que a organização, seu mercado, sua tecnologia e seus riscos evoluem — mantendo o sistema sempre \"fazendo sentido\" para a realidade atual do negócio.","analisa":"- a) Velocidade de execução dos processos é um atributo possível de eficiência operacional, mas não é o que a norma define como \"pertinência\" — pertinência trata de relevância/adequação ao contexto, não de velocidade.\n- c) O número de pessoas envolvidas na gestão do SGSI é um recurso (cláusula 7.1), não uma medida de pertinência do sistema — um SGSI pode ser plenamente pertinente com uma equipe enxuta, ou irrelevante mesmo com muitas pessoas envolvidas.","dica":"Reforce a associação: pertinência = relevância ao contexto/propósito (não velocidade, não headcount, não tecnologia de ponta) — esse conceito aparece em várias questões do simulado sob diferentes formulações.","resumo":"Pertinência é sobre \"fazer sentido para o contexto atual\", não sobre rapidez ou quantidade de gente envolvida."},"73":{"resposta_correta":"b) Que a política é apropriada ao propósito da organização, documentada, comunicada e inclui o comprometimento com a melhoria contínua.","justificativa":"Em auditoria de certificação, o auditor verifica o cumprimento literal dos requisitos da cláusula 5.2: a política deve ser apropriada ao propósito da organização; incluir objetivos de segurança da informação (ou fornecer a estrutura para estabelecê-los); incluir comprometimento em satisfazer requisitos aplicáveis; incluir comprometimento com a melhoria contínua do SGSI; estar disponível como informação documentada; ser comunicada dentro da organização; e estar disponível para partes interessadas, conforme apropriado. É essa combinação de atributos que o auditor buscará como evidência de conformidade.","analisa":"- a) A autoria da política (interna ou por consultor externo) não é requisito de conformidade da norma — o que importa é o conteúdo e a aderência aos requisitos da cláusula 5.2, não quem a redigiu.\n- c) Complexidade e detalhamento excessivo não são critérios de conformidade — pelo contrário, a política deve ser apropriada ao propósito da organização, o que geralmente favorece objetividade e clareza, não complexidade desnecessária.","dica":"Em qualquer cenário de \"preparação para auditoria de certificação\", a resposta correta tende a listar exatamente os elementos literais exigidos pela cláusula em questão — a prova está testando se você memorizou os requisitos, não interpretações vagas.","resumo":"Auditor de certificação confere aderência literal à cláusula — não estilo de redação nem quem escreveu."},"74":{"resposta_correta":"b) Serve como evidência de que a organização garante que seu pessoal é qualificado para as tarefas relacionadas à segurança da informação.","justificativa":"A cláusula 7.2 exige explicitamente que informação documentada apropriada seja retida como evidência de competência. Em auditoria, essa evidência (certificados, registros de treinamento, currículos, avaliações de desempenho) é o que permite ao auditor verificar objetivamente que a organização cumpriu seu compromisso de assegurar pessoal competente para funções que afetam o desempenho da segurança da informação — sem essa evidência, a afirmação de competência seria apenas uma alegação não verificável.","analisa":"- a) Auditores de certificação não \"ignoram\" esse requisito — pelo contrário, evidência de competência é um dos itens mais frequentemente verificados em auditorias, já que pessoas despreparadas são uma das principais causas de falhas de segurança.\n- c) A informação documentada sobre competência não tem qualquer relação com comparação salarial de mercado — isso seria uma questão de gestão de recursos humanos e remuneração, totalmente fora do escopo do requisito de competência da ISO 27001.","dica":"Sempre que a prova falar em \"evidência para auditoria\", lembre que a ISO 27001 exige documentação como prova objetiva e verificável — nunca uma alegação vaga desprovida de registro.","resumo":"Sem registro de competência, para o auditor, a competência \"não existe\" — é preciso provar, não apenas afirmar."},"75":{"resposta_correta":"b) Evidências de que as avaliações foram realizadas conforme os critérios estabelecidos, os riscos identificados, analisados, avaliados e seus resultados documentados.","justificativa":"A cláusula 8.2 exige que a organização retenha informação documentada dos resultados das avaliações de riscos de segurança da informação. Em auditoria, o auditor busca evidência de que o processo definido em 6.1.2 (identificação, análise e avaliação de riscos, com critérios consistentes) foi de fato aplicado na prática operacional — ou seja, que a metodologia definida não ficou apenas no papel, mas foi efetivamente executada, com riscos identificados, analisados quanto a probabilidade/impacto, avaliados contra os critérios de aceitação, e formalmente registrados.","analisa":"- a) Uma simples lista de riscos, sem análise ou tratamento, não atende ao processo completo exigido pela cláusula 6.1.2/8.2, que envolve identificação, análise, avaliação e — subsequentemente — tratamento (6.1.3/8.3) dos riscos.\n- c) Um resumo apenas dos riscos \"mais importantes\" pode omitir evidências de completude do processo — a norma exige documentação dos resultados da avaliação de riscos como um todo, de forma rastreável e auditável, não um recorte seletivo e informal.","dica":"Em cenários de \"preparação para auditoria\", a resposta correta quase sempre enfatiza evidência completa e rastreável do processo formal (identificação → análise → avaliação → documentação), nunca versões resumidas, informais ou parciais.","resumo":"Auditor quer ver o processo de risco completo documentado — não uma lista solta nem um resumo seletivo."},"76":{"resposta_correta":"b) Informação documentada dos resultados da análise crítica, incluindo decisões sobre oportunidades de melhoria e necessidades de mudanças no SGSI.","justificativa":"A cláusula 9.3.3 exige que a organização retenha informação documentada como evidência dos resultados das análises críticas pela Direção. O auditor buscará essa evidência formal (atas, registros de decisão) que demonstre que as entradas previstas em 9.3.2 foram efetivamente consideradas e que decisões concretas sobre melhoria contínua e necessidades de mudança do SGSI foram tomadas pela Alta Direção — não apenas que uma reunião ocorreu.","analisa":"- a) A mera presença física da Alta Direção na reunião, sem registro formal do conteúdo discutido e das decisões tomadas, não constitui evidência suficiente de conformidade com a cláusula 9.3 — presença sem documentação não é auditável.\n- c) Um plano de ação apresentado antes da análise crítica ter de fato ocorrido não é evidência válida de conformidade — a norma exige que a análise crítica seja realizada (a intervalos planejados) e documentada, e não pode ser \"simulada\" a posteriori ou substituída por um plano genérico e antecipado.","dica":"Auditores buscam sempre registro documentado real das saídas (decisões) da análise crítica, não apenas evidência de que uma reunião aconteceu ou de intenções futuras não fundamentadas em análise real.","resumo":"Não basta a reunião acontecer — precisa haver registro das decisões tomadas nela."},"77":{"resposta_correta":"b) Através da análise de resultados de monitoramento, auditorias, ações corretivas e análises críticas da Direção, mostrando um ciclo de aprimoramento.","justificativa":"A melhor evidência de melhoria contínua não é uma promessa isolada, mas a demonstração de um ciclo vivo e recorrente: resultados de monitoramento e medição (9.1) alimentando auditorias internas (9.2) e análises críticas pela Direção (9.3), que geram ações corretivas (10.2) e decisões de melhoria, que por sua vez são novamente monitoradas — evidenciando, na prática, que o PDCA está em funcionamento contínuo e gerando evolução real e mensurável do SGSI ao longo do tempo.","analisa":"- a) Um plano futuro, ainda não implementado, demonstra intenção, mas não evidencia que a melhoria contínua já está de fato ocorrendo — auditores buscam evidência de histórico e prática recorrente, não apenas promessas.\n- c) Uma declaração verbal, sem registro documentado e sem evidência de ações concretas realizadas, não constitui evidência objetiva de conformidade — auditorias de certificação exigem evidências verificáveis, não apenas discurso.","dica":"\"Melhoria contínua\" comprovada = ciclo demonstrável ao longo do tempo (monitoramento → auditoria → análise crítica → ação corretiva → nova rodada), nunca uma promessa isolada ou declaração sem lastro documental.","resumo":"Melhoria contínua se prova com histórico de ciclo funcionando, não com discurso ou plano futuro isolado."},"78":{"resposta_correta":"b) Porque o auditor precisa ter certeza de que a segurança da informação é mantida mesmo em serviços externos.","justificativa":"Como já discutido na questão 52 (mesma cláusula 8.1), a responsabilidade pela segurança da informação de processos terceirizados relevantes permanece com a organização certificada, que deve demonstrá-la controlando esses processos externos. Em auditoria, isso é fundamental porque um SGSI só é verdadeiramente eficaz se cobrir toda a cadeia relevante de tratamento da informação, incluindo pontos operados por terceiros — uma falha de segurança em um fornecedor crítico pode comprometer diretamente os ativos protegidos pelo SGSI certificado.","analisa":"- a) A transferência de responsabilidade ao terceiro é uma ideia equivocada: a cláusula 8.1 exige que a própria organização assegure o controle desses processos, mantendo sua responsabilidade e accountability, independentemente de quem executa a atividade.\n- c) Exigir apenas a posse de uma certificação ISO 27001 pelo terceiro é insuficiente — a organização deve efetivamente controlar (via contratos, SLAs, auditorias, monitoramento) o processo terceirizado relevante, o que vai além de verificar um certificado formal do fornecedor.","dica":"Esta questão reforça (em contexto de auditoria) o mesmo princípio da Q52: certificação do fornecedor ajuda, mas não substitui o controle ativo e a responsabilidade contínua da organização contratante sobre processos terceirizados relevantes ao SGSI.","resumo":"Certificado do fornecedor é bom sinal, mas não dispensa controle e responsabilidade ativa da organização contratante."},"79":{"resposta_correta":"b) O gerenciamento do ciclo de vida completo das identidades, desde sua criação até a desativação.","justificativa":"O controle 5.16 exige que o ciclo de vida completo das identidades seja gerenciado, cobrindo desde a criação (provisionamento) até a desativação final (desprovisionamento), passando por manutenção e alterações ao longo do tempo (mudanças de cargo, função, status de contratação). Uma gestão de identidade robusta é pré-requisito para o controle de acesso eficaz (ligado diretamente ao controle 5.18, direitos de acesso).","analisa":"- a) Criar uma identidade nova \"para cada novo projeto\" não reflete o conceito de gestão de identidade — o ideal é gerenciar identidades de forma centralizada e vinculada à pessoa/entidade, evitando multiplicação desnecessária e descontrolada de identidades para a mesma pessoa.\n- c) Permitir que usuários gerenciem suas próprias identidades \"de forma autônoma\", sem governança central, contraria o propósito do controle, que exige gestão formal e controlada do ciclo de vida das identidades pela organização, não autogestão sem supervisão.","dica":"5.16 (gestão de identidade) é o \"quem é você no sistema\" — enquanto 5.18 (direitos de acesso) é o \"o que você pode fazer\" — os dois controles trabalham juntos no ciclo de vida do acesso (identidade → autorização → revisão → revogação).","resumo":"Gestão de identidade cobre do \"nascimento\" ao \"fim de vida\" de cada identidade no sistema — não é criar identidade nova a cada projeto."},"80":{"resposta_correta":"b) Provisionar, analisar criticamente, modificar e remover os direitos de acesso de acordo com as políticas e regras da organização.","justificativa":"O controle 5.18 exige que direitos de acesso a informações e outros ativos associados sejam provisionados, analisados criticamente, modificados e removidos de acordo com a política específica do tópico da organização e as regras para controle de acesso. Isso implica um ciclo de gestão ativo: concessão inicial baseada em necessidade real (need-to-know/need-to-use), revisões periódicas (para detectar acessos excessivos ou obsoletos) e revogação tempestiva quando o acesso deixa de ser necessário (por exemplo, mudança de função ou desligamento).","analisa":"- a) Conceder acesso amplo \"por padrão\" viola o princípio do menor privilégio, um dos pilares de controle de acesso da norma — o correto é conceder o mínimo necessário e ampliar apenas mediante justificativa formal, nunca o inverso.\n- c) Documentar sem um processo ativo de análise crítica e revisão periódica é insuficiente — o controle exige explicitamente a análise crítica (revisão) e a modificação/remoção de direitos ao longo do tempo, não apenas um registro estático.","dica":"5.18 é regido pelo princípio do menor privilégio e por um ciclo de vida ativo do acesso: provisionar → revisar periodicamente → modificar → remover. Bancas adoram testar se você lembra da revisão periódica (muitas vezes esquecida na prática das organizações reais).","resumo":"Direito de acesso não é \"para sempre\": é concedido, revisado, ajustado e removido conforme a necessidade real muda."}};

      function mostrarExplicacao(numeroQuestao) {
        const explicacao = EXPLICACOES[numeroQuestao];
        if (!explicacao) return;

        // Encontrar ou criar container de explicação
        let container = document.getElementById('explicacao-container');
        if (!container) {
          container = document.createElement('div');
          container.id = 'explicacao-container';
          container.style.cssText = 'background: rgba(34, 197, 94, 0.1); border-left: 3px solid #22c55e; padding: 20px; margin-top: 20px; border-radius: 8px; animation: slideIn 0.3s ease;';

          const formContainer = document.querySelector('.main') || document.querySelector('main');
          if (formContainer) {
            formContainer.appendChild(container);
          }
        }

        container.innerHTML = `
          <div style="margin-bottom: 15px;">
            <h3 style="color: #4ade80; margin-bottom: 10px;">✅ Resposta Correta</h3>
            <p style="color: #e0e0e0; font-weight: 500;">${escapeHtml(explicacao.resposta_correta)}</p>
          </div>

          <div style="margin-bottom: 15px;">
            <h3 style="color: #3b82f6; margin-bottom: 10px;">📝 Justificativa</h3>
            <p style="color: #c0c0c0; line-height: 1.6;">${escapeHtml(explicacao.justificativa)}</p>
          </div>

          <div style="margin-bottom: 15px;">
            <h3 style="color: #ef4444; margin-bottom: 10px;">❌ Por que as demais estão incorretas?</h3>
            <div style="color: #c0c0c0; line-height: 1.6; white-space: pre-wrap;">${escapeHtml(explicacao.analisa)}</div>
          </div>

          <div style="margin-bottom: 15px;">
            <h3 style="color: #fbbf24; margin-bottom: 10px;">💡 Dica para a Prova</h3>
            <p style="color: #c0c0c0; background: rgba(251, 191, 36, 0.1); padding: 10px; border-radius: 6px;">${escapeHtml(explicacao.dica)}</p>
          </div>

          <div>
            <h3 style="color: #a78bfa; margin-bottom: 10px;">🎯 Resumo para Memorização</h3>
            <p style="color: #c0c0c0; background: rgba(139, 92, 246, 0.1); padding: 10px; border-radius: 6px; font-weight: 500;">${escapeHtml(explicacao.resumo)}</p>
          </div>
        `;

        container.style.display = 'block';
      }

      function escapeHtml(text) {
        const map = {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        };
        return String(text).replace(/[&<>"']/g, m => map[m]);
      }

      // Interceptar envio de resposta
      const originalSetTimeout = window.setTimeout;
      window.setTimeout = function(callback, delay) {
        const wrappedCallback = function() {
          callback.call(this);
          // Tentar mostrar explicação após resposta
          try {
            const qcounter = document.querySelector('.qcounter');
            if (qcounter) {
              const numeroMatch = qcounter.textContent.match(/\d+/);
              if (numeroMatch) {
                mostrarExplicacao(parseInt(numeroMatch[0]));
              }
            }
          } catch (e) {
            console.log('Não foi possível mostrar explicação automática');
          }
        };
        return originalSetTimeout.call(this, wrappedCallback, delay);
      };

      // Adicionar botão para mostrar/ocultar explicação
      document.addEventListener('DOMContentLoaded', function() {
        const toolbar = document.querySelector('.toolbar') || document.querySelector('.main');
        if (toolbar && !document.getElementById('btn-explicacao')) {
          const btn = document.createElement('button');
          btn.id = 'btn-explicacao';
          btn.textContent = '📖 Mostrar Explicação';
          btn.style.cssText = 'background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-left: auto;';
          btn.onclick = function() {
            const qcounter = document.querySelector('.qcounter');
            if (qcounter) {
              const numeroMatch = qcounter.textContent.match(/\d+/);
              if (numeroMatch) {
                mostrarExplicacao(parseInt(numeroMatch[0]));
              }
            }
          };

          // Tentar adicionar ao toolbar
          if (document.querySelector('.toolbar')) {
            document.querySelector('.toolbar').appendChild(btn);
          }
        }
      });
    </script>

    <style>
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      #explicacao-container {
        font-size: 0.95em;
      }

      #explicacao-container h3 {
        font-size: 1em;
        margin-bottom: 8px;
      }

      #explicacao-container p {
        margin: 0;
      }
    </style>
  
</body>
</html>
