"options": [{"id": "a", "text": "a) Exclusivamente como \"dados públicos\" ou \"dados restritos\"."}, {"id": "b", "text": "b) De acordo com as necessidades de segurança da informação da organização, baseadas na confidencialidade, integridade, disponibilidade e requisitos das partes interessadas relevantes."}, {"id": "c", "text": "c) Pelo volume de armazenamento que a informação ocupa."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 17: A \"Gestão de Ativos Digitais\" está implementando controles organizacionais do Anexo A.", "theme": "organizacional"}, {"id": 121, "text": "121. O Controle 6.2 do Anexo A trata dos \"Termos e condições de contratação\". O que deve ser declarado nos contratos de trabalho?", "options": [{"id": "a", "text": "a) Apenas o salário e os benefícios do pessoal."}, {"id": "b", "text": "b) As responsabilidades do pessoal e da organização para a segurança da informação."}, {"id": "c", "text": "c) A lista completa de controles de segurança que o funcionário deve seguir."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 18: A \"Recursos Humanos Seguros\" está implementando controles de pessoas do Anexo A.", "theme": "pessoas"}, {"id": 122, "text": "122. O Controle 6.4 do Anexo A, \"Processo disciplinar\", exige que a \"Recursos Humanos Seguros\" tenha um processo formalizado e comunicado para que finalidade?", "options": [{"id": "a", "text": "a) Para premiar os funcionários que seguem as políticas de segurança."}, {"id": "b", "text": "b) Para tomar ações contra o pessoal e outras partes interessadas que violarem a política da segurança da informação."}, {"id": "c", "text": "c) Para registrar todas as reclamações dos funcionários contra as políticas."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 18: A \"Recursos Humanos Seguros\" está implementando controles de pessoas do Anexo A.", "theme": "organizacional"}, {"id": 123, "text": "123. O Controle 6.5 do Anexo A aborda as \"Responsabilidades após encerramento ou mudança da contratação\". O que a \"Recursos Humanos Seguros\" deve fazer?", "options": [{"id": "a", "text": "a) Desconsiderar as responsabilidades de segurança após o término do vínculo empregatício."}, {"id": "b", "text": "b) Definir, aplicar e comunicar as responsabilidades de segurança da informação que permaneçam válidas."}, {"id": "c", "text": "c) Apenas garantir a devolução de equipamentos da empresa."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 18: A \"Recursos Humanos Seguros\" está implementando controles de pessoas do Anexo A.", "theme": "pessoas"}, {"id": 124, "text": "124. O Controle 7.1 do Anexo A, \"Perímetros de segurança física\", deve ser usado para:", "options": [{"id": "a", "text": "a) Criar zonas de acesso restrito apenas para a alta direção."}, {"id": "b", "text": "b) Proteger áreas que contenham informações e outros ativos associados contra acessos não autorizados."}, {"id": "c", "text": "c) Apenas para fins de estética e organização do ambiente de trabalho."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 19: A \"Segurança Física e Lógica\" está implementando controles físicos e tecnológicos do Anexo A.", "theme": "organizacional"}, {"id": 125, "text": "125. O Controle 7.7 do Anexo A exige \"Mesa limpa e tela limpa\". O que a \"Segurança Física e Lógica\" deve definir e aplicar?", "options": [{"id": "a", "text": "a) Regras de organização geral do ambiente de trabalho, sem impacto na segurança."}, {"id": "b", "text": "b) Regras de mesa limpa para documentos impressos e mídia removível, e regras de tela limpa para recursos de tratamento de informações."}, {"id": "c", "text": "c) Uma política que permite deixar documentos confidenciais na mesa para facilitar o trabalho."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 19: A \"Segurança Física e Lógica\" está implementando controles físicos e tecnológicos do Anexo A.", "theme": "fisico"}, {"id": 126, "text": "126. O Controle 8.2 do Anexo A trata dos \"Direitos de acessos privilegiados\". O que a \"Segurança Física e Lógica\" deve fazer?", "options": [{"id": "a", "text": "a) Conceder direitos privilegiados a todos os usuários que solicitarem."}, {"id": "b", "text": "b) Restringir e gerenciar a atribuição e o uso de direitos de acessos privilegiados."}, {"id": "c", "text": "c) Apenas auditar o uso de acessos privilegiados anualmente."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 19: A \"Segurança Física e Lógica\" está implementando controles físicos e tecnológicos do Anexo A.", "theme": "organizacional"}, {"id": 127, "text": "127. O Controle 8.7 do Anexo A, \"Proteção contra malware\", exige que a \"CyberProtection Solutions\":", "options": [{"id": "a", "text": "a) Confie exclusivamente em sistemas antivírus automáticos."}, {"id": "b", "text": "b) Implemente proteção contra malware apoiada pela conscientização adequada do usuário."}, {"id": "c", "text": "c) Bloqueie completamente o acesso à internet em todos os sistemas para evitar malware."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 20: A \"CyberProtection Solutions\" está implementando controles tecnológicos do Anexo A, com foco na proteção contra ameaças.", "theme": "tecnologico"}, {"id": 128, "text": "128. O Controle 8.9 do Anexo A, \"Gestão de configuração\", exige que as configurações (hardware, software, serviços, redes) sejam:", "options": [{"id": "a", "text": "a) Definidas e deixadas no padrão de fábrica para simplificar."}, {"id": "b", "text": "b) Estabelecidas, documentadas, implementadas, monitoradas e analisadas criticamente."}, {"id": "c", "text": "c) Mantidas secretas para evitar que invasores as explorem."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 20: A \"CyberProtection Solutions\" está implementando controles tecnológicos do Anexo A, com foco na proteção contra ameaças.", "theme": "tecnologico"}, {"id": 129, "text": "129. O Controle 8.12 do Anexo A, \"Prevenção de vazamento de dados\", exige que a \"CyberProtection Solutions\" faça o quê?", "options": [{"id": "a", "text": "a) Apenas monitorar a internet para identificar dados vazados."}, {"id": "b", "text": "b) Aplicar medidas de prevenção de vazamento de dados a sistemas, redes e dispositivos que tratem informações sensíveis."}, {"id": "c", "text": "c) Aceitar que vazamentos são inevitáveis e focar apenas na resposta."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 20: A \"CyberProtection Solutions\" está implementando controles tecnológicos do Anexo A, com foco na proteção contra ameaças.", "theme": "tecnologico"}, {"id": 130, "text": "130. A ABNT NBR ISO/IEC 27001:2022 (Seção 8.1) exige que a \"Serviços em Nuvem Confiáveis\" planeje, implemente e controle os processos necessários. Isso inclui:", "options": [{"id": "a", "text": "a) Criar novos processos para cada nova tecnologia implementada."}, {"id": "b", "text": "b) Estabelecer critérios para os processos e implementar controles de acordo com esses critérios, com informação documentada para gerar confiança."}, {"id": "c", "text": "c) Apenas documentar os processos existentes, sem criar novos controles."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 21: A \"Serviços em Nuvem Confiáveis\" está gerenciando a operação do SGSI.", "theme": "organizacional"}, {"id": 131, "text": "131. A \"Serviços em Nuvem Confiáveis\" deve realizar avaliações de riscos da segurança da informação a intervalos planejados, ou quando mudanças significativas ocorrerem (ABNT NBR ISO/IEC 27001:2022, 8.2). Qual o objetivo principal?", "options": [{"id": "a", "text": "a) Para justificar a compra de novos softwares de segurança."}, {"id": "b", "text": "b) Para garantir que o SGSI permaneça relevante e eficaz diante de um ambiente de risco em constante mudança."}, {"id": "c", "text": "c) Para que a organização não precise documentar as mudanças."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 21: A \"Serviços em Nuvem Confiáveis\" está gerenciando a operação do SGSI.", "theme": "organizacional"}, {"id": 132, "text": "132. A \"Serviços em Nuvem Confiáveis\" terceiriza alguns serviços relevantes para o SGSI. O que a Seção 8.1 exige para esses serviços terceirizados?", "options": [{"id": "a", "text": "a) A responsabilidade pela segurança é inteiramente transferida para o provedor terceirizado."}, {"id": "b", "text": "b) A organização deve assegurar que esses processos, produtos ou serviços terceirizados sejam controlados."}, {"id": "c", "text": "c) A organização pode ignorar a segurança desses serviços, pois não estão em sua infraestrutura."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 21: A \"Serviços em Nuvem Confiáveis\" está gerenciando a operação do SGSI.", "theme": "organizacional"}, {"id": 133, "text": "133. O Controle 5.23 do Anexo A, \"Segurança da informação para uso de serviços em nuvem\", exige que a \"Serviços em Nuvem Confiáveis\" estabeleça processos para:", "options": [{"id": "a", "text": "a) Apenas o uso e o monitoramento dos serviços em nuvem."}, {"id": "b", "text": "b) Aquisição, uso, gestão e saída de serviços em nuvem, de acordo com os requisitos de segurança da informação."}, {"id": "c", "text": "c) Apenas garantir que o contrato com o provedor de nuvem contenha cláusulas de segurança."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 21: A \"Serviços em Nuvem Confiáveis\" está gerenciando a operação do SGSI.", "theme": "organizacional"}, {"id": 134, "text": "134. A ABNT NBR ISO/IEC 27001:2022 (Seção 9.1) exige que a \"DataInsights Monitoramento\" determine \"o que precisa ser monitorado e medido\". Isso inclui:", "options": [{"id": "a", "text": "a) Apenas o número de acessos diários ao sistema."}, {"id": "b", "text": "b) Controles e processos da segurança da informação, com métodos que produzam resultados válidos."}, {"id": "c", "text": "c) Somente o feedback dos funcionários sobre a usabilidade dos sistemas."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 22: A \"DataInsights Monitoramento\" está desenvolvendo seu processo de monitoramento e medição para o SGSI.", "theme": "organizacional"}, {"id": 135, "text": "135. Qual o principal objetivo de determinar \"quem\" deve analisar e avaliar os resultados do monitoramento e medição (Seção 9.1 f))?", "options": [{"id": "a", "text": "a) Atribuir a responsabilidade para um único indivíduo, independentemente de suas qualificações."}, {"id": "b", "text": "b) Assegurar que a análise seja realizada por pessoal qualificado e que as decisões possam ser tomadas com base em informações precisas."}, {"id": "c", "text": "c) Limitar o número de pessoas com acesso aos dados de monitoramento."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 22: A \"DataInsights Monitoramento\" está desenvolvendo seu processo de monitoramento e medição para o SGSI.", "theme": "organizacional"}, {"id": 136, "text": "136. A ABNT NBR ISO/IEC 27001:2022 (Seção 9.2.1) estabelece que o propósito das auditorias internas é prover informações sobre:", "options": [{"id": "a", "text": "a) A conformidade do SGSI apenas com os requisitos de outras normas."}, {"id": "b", "text": "b) Se o SGSI está em conformidade com os próprios requisitos da organização e os da norma, e se está efetivamente implementado e mantido."}, {"id": "c", "text": "c) As habilidades de negociação dos auditores internos."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 23: A \"Auditoria Confiável Ltda.\" está planejando e executando auditorias internas.", "theme": "organizacional"}, {"id": 137, "text": "137. Ao selecionar auditores para as auditorias internas (Seção 9.2.2 b)), a \"Auditoria Confiável Ltda.\" deve assegurar:", "options": [{"id": "a", "text": "a) Que os auditores sejam os próprios responsáveis pelos processos auditados para maior conhecimento."}, {"id": "b", "text": "b) A objetividade e imparcialidade do processo de auditoria."}, {"id": "c", "text": "c) Que os auditores sejam treinados apenas uma vez, sem atualizações."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 23: A \"Auditoria Confiável Ltda.\" está planejando e executando auditorias internas.", "theme": "organizacional"}, {"id": 138, "text": "138. Quais são os principais \"inputs\" que a Alta Direção da \"GovSec Solutions\" deve considerar na análise crítica (Seção 9.3.2)?", "options": [{"id": "a", "text": "a) Apenas o orçamento anual do departamento de TI."}, {"id": "b", "text": "b) Situação das ações anteriores, mudanças no contexto, feedback de desempenho (não conformidades, monitoramento, auditorias, objetivos), avaliação de riscos e oportunidades de melhoria."}, {"id": "c", "text": "c) Exclusivamente os relatórios de incidentes de segurança, sem considerar a proatividade."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 24: A \"GovSec Solutions\" está se preparando para a análise crítica pela Direção de seu SGSI.", "theme": "organizacional"}, {"id": 139, "text": "139. Os \"resultados\" da análise crítica pela Direção (Seção 9.3.3) devem incluir decisões relativas a quê?", "options": [{"id": "a", "text": "a) Apenas as contratações para o próximo ano."}, {"id": "b", "text": "b) Oportunidades para melhoria contínua e quaisquer necessidades de mudanças do SGSI."}, {"id": "c", "text": "c) A manutenção do SGSI exatamente como está, sem alterações."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 24: A \"GovSec Solutions\" está se preparando para a análise crítica pela Direção de seu SGSI.", "theme": "organizacional"}, {"id": 140, "text": "140. O Controle 8.15 do Anexo A, referente a \"Log\", exige que a \"Sistemas Integrados de Segurança\":", "options": [{"id": "a", "text": "a) Registre apenas logs de erros graves."}, {"id": "b", "text": "b) Produza, armazene, proteja e analise logs que registrem atividades, exceções, falhas e outros eventos relevantes."}, {"id": "c", "text": "c) Apague os logs regularmente para evitar o armazenamento excessivo de dados."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 25: A \"Sistemas Integrados de Segurança\" está revisando sua implementação de controles de monitoramento e logs.", "theme": "tecnologico"}, {"id": 141, "text": "141. O Controle 8.16 do Anexo A, \"Atividades de monitoramento\", exige que a \"Sistemas Integrados de Segurança\" monitore:", "options": [{"id": "a", "text": "a) Apenas a performance dos usuários no sistema."}, {"id": "b", "text": "b) Redes, sistemas e aplicações por comportamentos anômalos e tome ações apropriadas para avaliar possíveis incidentes de segurança da informação."}, {"id": "c", "text": "c) Exclusivamente o consumo de energia dos equipamentos de TI."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 25: A \"Sistemas Integrados de Segurança\" está revisando sua implementação de controles de monitoramento e logs.", "theme": "tecnologico"}, {"id": 142, "text": "142. A \"Avaliação de Performance SGSI\" deve reter \"informação documentada\" como evidência dos resultados do monitoramento e medição (ABNT NBR ISO/IEC 27001:2022, 9.1). Por que isso é crucial?", "options": [{"id": "a", "text": "a) Apenas para fins de arquivamento legal, sem uso prático."}, {"id": "b", "text": "b) Para demonstrar que as atividades de avaliação foram realizadas, os resultados obtidos e as conclusões tiradas, apoiando a tomada de decisões e a melhoria."}, {"id": "c", "text": "c) Para que a gerência possa ignorar os resultados desfavoráveis sem rastreabilidade."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 26: A \"Avaliação de Performance SGSI\" está concluindo a avaliação de desempenho de seu SGSI.", "theme": "organizacional"}, {"id": 143, "text": "143. O que significa avaliar a \"pertinência\" do SGSI na análise crítica pela Direção (ABNT NBR ISO/IEC 27001:2022, 9.3.1)?", "options": [{"id": "a", "text": "a) Se o SGSI é relevante para o propósito da organização e seu contexto atual."}, {"id": "b", "text": "b) Se o SGSI é o mais avançado tecnologicamente disponível no mercado."}, {"id": "c", "text": "c) Se o SGSI foi implementado dentro do orçamento previsto."}], "correct_option": "a", "domain": "Simulado 2 — Cenário 26: A \"Avaliação de Performance SGSI\" está concluindo a avaliação de desempenho de seu SGSI.", "theme": "organizacional"}, {"id": 144, "text": "144. De acordo com a ABNT NBR ISO/IEC 27001:2022 (Seção 10.1), o que a \"Evolução Contínua Ltda.\" deve melhorar continuamente?", "options": [{"id": "a", "text": "a) Apenas o número de funcionários dedicados à segurança."}, {"id": "b", "text": "b) A pertinência, a adequação e a eficácia do sistema de gestão da segurança da informação."}, {"id": "c", "text": "c) Apenas os resultados financeiros da organização."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 27: A \"Evolução Contínua Ltda.\" está focada em manter seu SGSI sempre aprimorado.", "theme": "organizacional"}, {"id": 145, "text": "145. Quando uma não conformidade ocorre (ABNT NBR ISO/IEC 27001:2022, 10.2), a \"Evolução Contínua Ltda.\" deve reagir a ela. Qual uma ação obrigatória?", "options": [{"id": "a", "text": "a) Desconsiderar a não conformidade se ela não causar impacto imediato."}, {"id": "b", "text": "b) Tomar ações para controlá-la e corrigi-la, e lidar com as consequências."}, {"id": "c", "text": "c) Transferir a responsabilidade pela não conformidade para um terceiro."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 27: A \"Evolução Contínua Ltda.\" está focada em manter seu SGSI sempre aprimorado.", "theme": "organizacional"}, {"id": 146, "text": "146. Após a não conformidade ter sido controlada e corrigida, a \"Correção Eficaz S.A.\" (ABNT NBR ISO/IEC 27001:2022, 10.2 b)) deve:", "options": [{"id": "a", "text": "a) Apenas documentar a correção e arquivar o caso."}, {"id": "b", "text": "b) Avaliar a necessidade de ações para eliminar as causas da não conformidade, a fim de evitar sua repetição ou ocorrência em outro lugar."}, {"id": "c", "text": "c) Informar apenas os envolvidos diretos sobre a correção."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 28: A \"Correção Eficaz S.A.\" identificou uma não conformidade e está trabalhando para resolvê-la.", "theme": "organizacional"}, {"id": 147, "text": "147. Qual a finalidade de \"analisar criticamente a eficácia de quaisquer ações corretivas tomadas\" (ABNT NBR ISO/IEC 27001:2022, 10.2 d))?", "options": [{"id": "a", "text": "a) Para validar o trabalho da equipe de segurança sem a necessidade de resultados práticos."}, {"id": "b", "text": "b) Para assegurar que as ações implementadas resolveram a não conformidade e foram eficazes em prevenir sua recorrência."}, {"id": "c", "text": "c) Para determinar quem será responsabilizado pela não conformidade inicial."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 28: A \"Correção Eficaz S.A.\" identificou uma não conformidade e está trabalhando para resolvê-la.", "theme": "organizacional"}, {"id": 148, "text": "148. O Controle 5.27 do Anexo A, \"Aprendizado com incidentes de segurança da informação\", exige que o conhecimento adquirido com incidentes seja usado para:", "options": [{"id": "a", "text": "a) Excluir os controles de segurança que falharam no incidente."}, {"id": "b", "text": "b) Fortalecer e melhorar os controles da segurança da informação."}, {"id": "c", "text": "c) Apenas documentar o incidente para fins de seguro."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 29: A \"Aprendizado com Incidentes S.A.\" teve um incidente de segurança e está no processo de aprendizado e melhoria.", "theme": "organizacional"}, {"id": 149, "text": "149. A \"Aprendizado com Incidentes S.A.\" deve reter \"informação documentada\" sobre a natureza das não conformidades e os resultados das ações corretivas (ABNT NBR ISO/IEC 27001:2022, 10.2 f) e g)). Qual o propósito disso?", "options": [{"id": "a", "text": "a) Apenas para fins de auditoria interna, sem contribuir para a melhoria real."}, {"id": "b", "text": "b) Para fornecer evidências da aplicação do ciclo de melhoria contínua e facilitar a análise para futuras otimizações."}, {"id": "c", "text": "c) Para que a gerência possa ocultar os problemas passados."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 29: A \"Aprendizado com Incidentes S.A.\" teve um incidente de segurança e está no processo de aprendizado e melhoria.", "theme": "organizacional"}, {"id": 150, "text": "150. Se a \"Gestão de Mudanças Segura\" identificar que um de seus processos não está mais alinhado com os objetivos do SGSI, o que a ABNT NBR ISO/IEC 27001:2022 (10.2 e)) sugere?", "options": [{"id": "a", "text": "a) Ignorar o desalinhamento e focar em outras áreas."}, {"id": "b", "text": "b) Realizar mudanças no sistema de gestão da segurança da informação, quando necessário, para realinhar os processos."}, {"id": "c", "text": "c) Reestruturar completamente toda a organização."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 30: A \"Gestão de Mudanças Segura\" está revendo seu SGSI.", "theme": "tecnologico"}, {"id": 151, "text": "151. Qual é a relação fundamental entre a \"Melhoria contínua\" (Seção 10.1) e os \"Objetivos da segurança da informação\" (Seção 6.2)?", "options": [{"id": "a", "text": "a) Não há relação direta, pois são processos separados."}, {"id": "b", "text": "b) A melhoria contínua visa garantir que o SGSI evolua para continuar a alcançar e otimizar os objetivos de segurança da informação."}, {"id": "c", "text": "c) Os objetivos da segurança da informação são definidos apenas uma vez e não são afetados pela melhoria contínua."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 30: A \"Gestão de Mudanças Segura\" está revendo seu SGSI.", "theme": "organizacional"}, {"id": 152, "text": "152. O que a \"Melhoria contínua\" (Seção 10.1) do SGSI da \"Gestão de Mudanças Segura\" busca aprimorar em termos de \"pertinência\"?", "options": [{"id": "a", "text": "a) A velocidade de execução dos processos do SGSI."}, {"id": "b", "text": "b) A relevância e adequação do SGSI aos propósitos e contexto da organização."}, {"id": "c", "text": "c) O número de pessoas envolvidas na gestão do SGSI."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 30: A \"Gestão de Mudanças Segura\" está revendo seu SGSI.", "theme": "organizacional"}, {"id": 153, "text": "153. Em uma auditoria de certificação, o que a \"Certificação Final Solutions\" precisará demonstrar em relação à sua política de segurança da informação (ABNT NBR ISO/IEC 27001:2022, 5.2)?", "options": [{"id": "a", "text": "a) Apenas que a política foi redigida por um especialista externo."}, {"id": "b", "text": "b) Que a política é apropriada ao propósito da organização, documentada, comunicada e inclui o comprometimento com a melhoria contínua."}, {"id": "c", "text": "c) Que a política é a mais complexa e detalhada do mercado."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 31: A \"Certificação Final Solutions\" está se preparando para a auditoria externa de certificação ISO 27001.", "theme": "organizacional"}, {"id": 154, "text": "154. Qual a importância da \"informação documentada\" sobre a \"competência\" do pessoal (ABNT NBR ISO/IEC 27001:2022, 7.2) para a auditoria de certificação?", "options": [{"id": "a", "text": "a) É apenas um requisito burocrático que os auditores tendem a ignorar."}, {"id": "b", "text": "b) Serve como evidência de que a organização garante que seu pessoal é qualificado para as tarefas relacionadas à segurança da informação."}, {"id": "c", "text": "c) É utilizada para comparar os salários dos funcionários com os do mercado."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 31: A \"Certificação Final Solutions\" está se preparando para a auditoria externa de certificação ISO 27001.", "theme": "organizacional"}, {"id": 155, "text": "155. O cliente da \"Qualidade e Conformidade Consultoria\" deve apresentar \"informação documentada dos resultados das avaliações de riscos da segurança da informação\" (ABNT NBR ISO/IEC 27001:2022, 8.2). O que o auditor buscará nisso?", "options": [{"id": "a", "text": "a) Uma lista de riscos sem nenhuma análise ou tratamento."}, {"id": "b", "text": "b) Evidências de que as avaliações foram realizadas conforme os critérios estabelecidos, os riscos identificados, analisados, avaliados e seus resultados documentados."}, {"id": "c", "text": "c) Apenas um resumo geral dos riscos mais importantes."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 32: A \"Qualidade e Conformidade Consultoria\" está auxiliando um cliente a preparar-se para a auditoria de certificação.", "theme": "organizacional"}, {"id": 156, "text": "156. Em relação à \"Análise crítica pela Direção\" (ABNT NBR ISO/IEC 27001:2022, 9.3), qual evidência o auditor buscará como parte da preparação para a certificação?", "options": [{"id": "a", "text": "a) Apenas a presença da alta direção na reunião de análise crítica."}, {"id": "b", "text": "b) Informação documentada dos resultados da análise crítica, incluindo decisões sobre oportunidades de melhoria e necessidades de mudanças no SGSI."}, {"id": "c", "text": "c) Um plano de ação futuro, mesmo que a análise crítica ainda não tenha ocorrido."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 32: A \"Qualidade e Conformidade Consultoria\" está auxiliando um cliente a preparar-se para a auditoria de certificação.", "theme": "organizacional"}, {"id": 157, "text": "157. A \"Sistemas Auditáveis Inc.\" deve demonstrar ao auditor que o SGSI é \"melhorado continuamente\" (ABNT NBR ISO/IEC 27001:2022, 10.1). Qual a melhor forma de evidenciar isso?", "options": [{"id": "a", "text": "a) Apresentando um plano de melhoria detalhado que será implementado no futuro."}, {"id": "b", "text": "b) Através da análise de resultados de monitoramento, auditorias, ações corretivas e análises críticas da Direção, mostrando um ciclo de aprimoramento."}, {"id": "c", "text": "c) Uma declaração verbal do CEO sobre o compromisso com a melhoria."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 33: A \"Sistemas Auditáveis Inc.\" está finalizando a preparação para sua auditoria.", "theme": "organizacional"}, {"id": 158, "text": "158. A ABNT NBR ISO/IEC 27001:2022 (Seção 8.1) exige que a organização controle \"processos, produtos ou serviços terceirizados que são relevantes para o sistema de gestão da segurança da informação\". Por que isso é fundamental para uma auditoria de certificação?", "options": [{"id": "a", "text": "a) Porque a organização pode transferir a responsabilidade pela segurança para o terceiro."}, {"id": "b", "text": "b) Porque o auditor precisa ter certeza de que a segurança da informação é mantida mesmo em serviços externos."}, {"id": "c", "text": "c) Porque a organização precisa apenas garantir que o terceiro possua uma ISO 27001."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 33: A \"Sistemas Auditáveis Inc.\" está finalizando a preparação para sua auditoria.", "theme": "organizacional"}, {"id": 159, "text": "159. O Controle 5.16 do Anexo A trata da \"Gestão de identidade\". O que a \"Tecnologia de Controle de Acesso\" deve implementar?", "options": [{"id": "a", "text": "a) Um processo para criar novas identidades para cada novo projeto."}, {"id": "b", "text": "b) O gerenciamento do ciclo de vida completo das identidades, desde sua criação até a desativação."}, {"id": "c", "text": "c) Um sistema que permite aos usuários gerenciar suas próprias identidades de forma autônoma."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 34: A \"Tecnologia de Controle de Acesso\" está implementando controles para gerenciar acesso e identidade.", "theme": "organizacional"}, {"id": 160, "text": "160. O Controle 5.18 do Anexo A aborda os \"Direitos de acesso\". O que a \"Tecnologia de Controle de Acesso\" deve fazer?", "options": [{"id": "a", "text": "a) Conceder direitos de acesso amplos por padrão e restringi-los apenas quando necessário."}, {"id": "b", "text": "b) Provisionar, analisar criticamente, modificar e remover os direitos de acesso de acordo com as políticas e regras da organização."}, {"id": "c", "text": "c) Apenas documentar os direitos de acesso, sem processo de revisão."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 34: A \"Tecnologia de Controle de Acesso\" está implementando controles para gerenciar acesso e identidade.", "theme": "organizacional"}, {"id": 161, "text": "161. Uma organização deseja iniciar a implementação da ISO/IEC 27001. Qual é o principal objetivo desta norma?", "options": [{"id": "a", "text": "A) Certificar profissionais de segurança da informação"}, {"id": "b", "text": "B) Estabelecer requisitos para implementar, manter e melhorar continuamente um SGSI"}, {"id": "c", "text": "C) Definir controles técnicos obrigatórios para proteção de redes corporativas"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 1: Fundamentos e conceitos de segurança da informação e ISO/IEC 27001", "theme": "organizacional"}, {"id": 162, "text": "162. A tríade CIA é central para a segurança da informação. O que significa 'disponibilidade' neste contexto?", "options": [{"id": "a", "text": "A) Garantia de que a informação não é divulgada a pessoas não autorizadas"}, {"id": "b", "text": "B) Propriedade de que a informação é completa e não foi modificada indevidamente"}, {"id": "c", "text": "C) Garantia de que a informação é acessível quando necessária por entidades autorizadas"}], "correct_option": "c", "domain": "Simulado 3 (PECB) — Domínio 1: Fundamentos e conceitos de segurança da informação e ISO/IEC 27001", "theme": "organizacional"}, {"id": 163, "text": "163. Qual norma da família ISO/IEC 27000 fornece o vocabulário e os conceitos fundamentais utilizados no SGSI?", "options": [{"id": "a", "text": "A) ISO/IEC 27000"}, {"id": "b", "text": "B) ISO/IEC 27002"}, {"id": "c", "text": "C) ISO/IEC 27005"}], "correct_option": "a", "domain": "Simulado 3 (PECB) — Domínio 1: Fundamentos e conceitos de segurança da informação e ISO/IEC 27001", "theme": "organizacional"}, {"id": 164, "text": "164. Uma empresa financeira processa dados de clientes. Qual princípio da segurança da informação é violado quando transações são alteradas sem autorização?", "options": [{"id": "a", "text": "A) Disponibilidade"}, {"id": "b", "text": "B) Integridade"}, {"id": "c", "text": "C) Autenticidade"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 1: Fundamentos e conceitos de segurança da informação e ISO/IEC 27001", "theme": "organizacional"}, {"id": 165, "text": "165. O Ciclo PDCA (Plan-Do-Check-Act) é subjacente à ISO/IEC 27001. Qual fase corresponde à realização de auditorias internas?", "options": [{"id": "a", "text": "A) Plan"}, {"id": "b", "text": "B) Do"}, {"id": "c", "text": "C) Check"}], "correct_option": "c", "domain": "Simulado 3 (PECB) — Domínio 1: Fundamentos e conceitos de segurança da informação e ISO/IEC 27001", "theme": "organizacional"}, {"id": 166, "text": "166. A ISO/IEC 27001:2022 adota a estrutura HLS (High Level Structure). Qual é o principal benefício desta estrutura para organizações com múltiplos sistemas de gestão?", "options": [{"id": "a", "text": "A) Reduz o número de controles obrigatórios a serem implementados"}, {"id": "b", "text": "B) Facilita a integração com outras normas ISO que adotam a mesma estrutura, como ISO 9001 e ISO 22301"}, {"id": "c", "text": "C) Elimina a necessidade de auditorias externas para certificação"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 1: Fundamentos e conceitos de segurança da informação e ISO/IEC 27001", "theme": "organizacional"}, {"id": 167, "text": "167. Um ativo de informação é definido como algo que possui valor para a organização. Qual dos exemplos abaixo representa um ativo de informação intangível?", "options": [{"id": "a", "text": "A) Servidor de banco de dados"}, {"id": "b", "text": "B) Conhecimento técnico especializado de um colaborador"}, {"id": "c", "text": "C) Cabo de rede do datacenter"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 1: Fundamentos e conceitos de segurança da informação e ISO/IEC 27001", "theme": "organizacional"}, {"id": 168, "text": "168. A ISO/IEC 27001 especifica que a certificação é válida por quanto tempo, sujeita a auditorias de manutenção?", "options": [{"id": "a", "text": "A) 1 ano"}, {"id": "b", "text": "B) 2 anos"}, {"id": "c", "text": "C) 3 anos"}], "correct_option": "c", "domain": "Simulado 3 (PECB) — Domínio 1: Fundamentos e conceitos de segurança da informação e ISO/IEC 27001", "theme": "organizacional"}, {"id": 169, "text": "169. Uma vulnerabilidade é explorada por uma ameaça, resultando em um incidente. Como se define 'risco' neste contexto?", "options": [{"id": "a", "text": "A) A probabilidade de uma ameaça se materializar independentemente de controles"}, {"id": "b", "text": "B) O efeito da incerteza sobre os objetivos da segurança da informação"}, {"id": "c", "text": "C) O impacto financeiro direto de um incidente de segurança"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 1: Fundamentos e conceitos de segurança da informação e ISO/IEC 27001", "theme": "organizacional"}, {"id": 170, "text": "170. A não repudiação é um conceito importante em transações eletrônicas. O que ela garante?", "options": [{"id": "a", "text": "A) Que a informação não pode ser interceptada em trânsito"}, {"id": "b", "text": "B) Que uma entidade não pode negar ter realizado uma ação ou transação específica"}, {"id": "c", "text": "C) Que apenas usuários autenticados podem acessar sistemas críticos"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 1: Fundamentos e conceitos de segurança da informação e ISO/IEC 27001", "theme": "organizacional"}, {"id": 171, "text": "171. Qual cláusula da ISO/IEC 27001 aborda o contexto da organização, incluindo partes interessadas internas e externas?", "options": [{"id": "a", "text": "A) Cláusula 4"}, {"id": "b", "text": "B) Cláusula 6"}, {"id": "c", "text": "C) Cláusula 9"}], "correct_option": "a", "domain": "Simulado 3 (PECB) — Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 172, "text": "172. No ISMS, a liderança deve demonstrar compromisso estabelecendo a política de segurança da informação. Qual é o principal objetivo dessa política?", "options": [{"id": "a", "text": "A) Definir papéis e responsabilidades"}, {"id": "b", "text": "B) Fornecer estrutura para riscos e conformidade"}, {"id": "c", "text": "C) Estabelecer metas mensuráveis"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 173, "text": "173. Os recursos necessários para o ISMS incluem competências. Como a norma trata a conscientização em segurança da informação?", "options": [{"id": "a", "text": "A) Apenas para gerentes"}, {"id": "b", "text": "B) Para todos os que afetam o ISMS"}, {"id": "c", "text": "C) Somente em treinamentos anuais"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 174, "text": "174. Na cláusula de suporte, a documentação do ISMS deve incluir informações documentadas. Qual é um exemplo obrigatório?", "options": [{"id": "a", "text": "A) Atas de reuniões informais da equipe de TI, sem necessidade de retenção formal"}, {"id": "b", "text": "B) Escopo do ISMS"}, {"id": "c", "text": "C) Registros de auditorias internas"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 175, "text": "175. O planejamento de ações para abordar riscos e oportunidades no ISMS deve ser integrado ao processo de mudança. Qual plano é essencial?", "options": [{"id": "a", "text": "A) Plano de contingência"}, {"id": "b", "text": "B) Plano de tratamento de riscos"}, {"id": "c", "text": "C) Plano de treinamento"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 176, "text": "176. Na operação do ISMS, o controle de mudanças não planejadas deve ser gerenciado. Qual controle é priorizado?", "options": [{"id": "a", "text": "A) Aprovação orçamentária adicional para realizar a mudança"}, {"id": "b", "text": "B) Comunicação da mudança à equipe somente após sua conclusão"}, {"id": "c", "text": "C) Avaliação de impacto na segurança"}], "correct_option": "c", "domain": "Simulado 3 (PECB) — Domínio 2: Information Security Management System", "theme": "tecnologico"}, {"id": 177, "text": "177. A cláusula de suporte exige comunicação relevante. Quem define o que, quando, com quem e como comunicar?", "options": [{"id": "a", "text": "A) Topo da gestão"}, {"id": "b", "text": "B) Equipe de TI"}, {"id": "c", "text": "C) Auditor externo"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 178, "text": "178. No ISMS, a externalização de processos deve manter a confidencialidade, integridade e disponibilidade. Qual anexo é referenciado?", "options": [{"id": "a", "text": "A) Anexo A.12 – Segurança das operações"}, {"id": "b", "text": "B) Anexo A.15"}, {"id": "c", "text": "C) Anexo A.5"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 179, "text": "179. A cláusula 4.1 da ISO/IEC 27001:2022 exige que a organização determine questões internas e externas. Qual ferramenta é comumente usada para estruturar essa análise?", "options": [{"id": "a", "text": "A) Análise SWOT ou PESTLE"}, {"id": "b", "text": "B) Diagrama de Ishikawa"}, {"id": "c", "text": "C) Matriz de Eisenhower"}], "correct_option": "a", "domain": "Simulado 3 (PECB) — Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 180, "text": "180. A cláusula 4.2 exige identificar partes interessadas e seus requisitos. Um fornecedor de serviços em nuvem exige que contratos incluam cláusulas de SLA de segurança. Como isso deve ser tratado?", "options": [{"id": "a", "text": "A) Ignorado, pois requisitos de fornecedores não são obrigatórios no SGSI"}, {"id": "b", "text": "B) Documentado como um requisito de parte interessada e tratado no escopo do SGSI"}, {"id": "c", "text": "C) Incluído apenas no contrato comercial, sem impacto no SGSI"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 181, "text": "181. O escopo do SGSI deve ser documentado. Qual afirmação está correta sobre a definição do escopo conforme a cláusula 4.3?", "options": [{"id": "a", "text": "A) O escopo pode excluir unidades de negócio desde que não processem informações críticas"}, {"id": "b", "text": "B) O escopo deve considerar interfaces e dependências com atividades externas à organização"}, {"id": "c", "text": "C) O escopo é determinado exclusivamente pelo departamento de TI"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 182, "text": "182. A cláusula 5.1 exige comprometimento da Alta Direção com o SGSI. Qual ação demonstra esse comprometimento de forma mais efetiva?", "options": [{"id": "a", "text": "A) Delegar toda a responsabilidade do SGSI ao gerente de TI"}, {"id": "b", "text": "B) Assegurar que os objetivos do SGSI estejam integrados aos processos de negócio da organização"}, {"id": "c", "text": "C) Aprovar o orçamento de TI anualmente sem monitoramento específico do SGSI"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 183, "text": "183. A política de segurança da informação (cláusula 5.2) deve conter comprometimento com a melhoria contínua. Como ela deve ser disponibilizada?", "options": [{"id": "a", "text": "A) Apenas internamente, mantida em sigilo para evitar análise por concorrentes"}, {"id": "b", "text": "B) Disponível como informação documentada e comunicada dentro da organização e a partes interessadas relevantes"}, {"id": "c", "text": "C) Publicada somente no site da empresa sem distribuição interna formal"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 184, "text": "184. A cláusula 7.3 trata de conscientização. Qual é o mínimo que as pessoas devem conhecer conforme a norma?", "options": [{"id": "a", "text": "A) A política de segurança da informação, sua contribuição para o SGSI e as implicações da não conformidade"}, {"id": "b", "text": "B) Todos os controles do Anexo A e seus respectivos objetivos de controle"}, {"id": "c", "text": "C) Os resultados das últimas três auditorias internas realizadas"}], "correct_option": "a", "domain": "Simulado 3 (PECB) — Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 185, "text": "185. A cláusula 7.4 exige determinação das comunicações relevantes para o SGSI. Quais aspectos devem ser definidos?", "options": [{"id": "a", "text": "A) Apenas o canal de comunicação a ser utilizado"}, {"id": "b", "text": "B) O que, quando, com quem, como comunicar e quem deve comunicar"}, {"id": "c", "text": "C) Somente as comunicações externas com reguladores e auditores"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 186, "text": "186. Informação documentada exigida pelo SGSI deve ser controlada. O que a cláusula 7.5.3 exige em relação ao controle?", "options": [{"id": "a", "text": "A) Que toda documentação seja mantida em papel e assinada fisicamente"}, {"id": "b", "text": "B) Que a informação documentada esteja disponível, adequada para uso e protegida apropriadamente"}, {"id": "c", "text": "C) Que apenas a equipe de segurança tenha acesso à documentação do SGSI"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 187, "text": "187. Processos terceirizados que afetam o SGSI devem ser controlados (cláusula 8.1). Qual é a responsabilidade da organização nesse caso?", "options": [{"id": "a", "text": "A) Transferir toda a responsabilidade de segurança ao fornecedor terceirizado"}, {"id": "b", "text": "B) Assegurar que esses processos sejam controlados, mesmo quando executados por terceiros"}, {"id": "c", "text": "C) Exigir apenas que o fornecedor possua certificação ISO 27001 vigente"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 188, "text": "188. Uma organização identificou que seu SGSI não está mais alinhado com mudanças regulatórias recentes. Qual cláusula aborda diretamente a necessidade de mudanças planejadas no SGSI?", "options": [{"id": "a", "text": "A) Cláusula 6.3 – Planejamento de mudanças"}, {"id": "b", "text": "B) Cláusula 9.3 – Análise crítica pela Direção"}, {"id": "c", "text": "C) Cláusula 10.2 – Não conformidade e ação corretiva"}], "correct_option": "a", "domain": "Simulado 3 (PECB) — Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 189, "text": "189. No planejamento da implementação, a análise de riscos deve identificar ativos de informação. Qual é o primeiro passo?", "options": [{"id": "a", "text": "A) Identificar ameaças e vulnerabilidades"}, {"id": "b", "text": "B) Definir critérios de aceitação de riscos"}, {"id": "c", "text": "C) Avaliar impactos potenciais"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 190, "text": "190. O Statement of Applicability (SoA) é gerado após a avaliação de riscos. Qual seu propósito principal?", "options": [{"id": "a", "text": "A) Definir escopo"}, {"id": "b", "text": "B) Listar controles selecionados e justificativas"}, {"id": "c", "text": "C) Estabelecer política"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 191, "text": "191. Para planejar a implementação, o escopo do ISMS deve considerar interfaces e dependências. Qual fator é excluído?", "options": [{"id": "a", "text": "A) Preferências pessoais de cada colaborador sobre o local de trabalho"}, {"id": "b", "text": "B) Interfaces e dependências com atividades realizadas por outras organizações"}, {"id": "c", "text": "C) Localização geográfica irrelevante"}], "correct_option": "a", "domain": "Simulado 3 (PECB) — Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 192, "text": "192. No planejamento, metas de segurança da informação devem ser SMART. Qual não é um critério SMART?", "options": [{"id": "a", "text": "A) Específica"}, {"id": "b", "text": "B) Ambígua"}, {"id": "c", "text": "C) Mensurável"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 193, "text": "193. A implementação do plano de tratamento de riscos inclui opções como evitar, mitigar ou transferir. Qual exige seguro?", "options": [{"id": "a", "text": "A) Aceitar"}, {"id": "b", "text": "B) Transferir"}, {"id": "c", "text": "C) Reduzir"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 194, "text": "194. O planejamento deve incluir cronograma e recursos. Qual ferramenta é recomendada para monitoramento?", "options": [{"id": "a", "text": "A) Planilha de horas trabalhadas sem vínculo com entregas do projeto"}, {"id": "b", "text": "B) Apenas reuniões informais semanais, sem registro formal de progresso"}, {"id": "c", "text": "C) Plano de projeto com marcos"}], "correct_option": "c", "domain": "Simulado 3 (PECB) — Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 195, "text": "195. Antes da implementação, a aprovação do SoA deve ser dada pela gestão. Qual cláusula suporta isso?", "options": [{"id": "a", "text": "A) Cláusula 6.1.3"}, {"id": "b", "text": "B) Cláusula 5.2"}, {"id": "c", "text": "C) Cláusula 7.5"}], "correct_option": "a", "domain": "Simulado 3 (PECB) — Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 196, "text": "196. Durante o planejamento da implementação do SGSI, a análise do contexto é concluída. Qual é o próximo passo lógico conforme a sequência da norma?", "options": [{"id": "a", "text": "A) Implementar imediatamente os controles do Anexo A"}, {"id": "b", "text": "B) Definir o escopo e iniciar o processo de avaliação de riscos"}, {"id": "c", "text": "C) Obter a certificação provisória do SGSI"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 197, "text": "197. O processo de avaliação de riscos (cláusula 6.1.2) exige a identificação de proprietários de riscos. Qual é a função do proprietário do risco?", "options": [{"id": "a", "text": "A) Executar todos os controles relacionados ao risco identificado"}, {"id": "b", "text": "B) Ser responsável por autorizar o plano de tratamento e aceitar os riscos residuais"}, {"id": "c", "text": "C) Reportar todos os riscos identificados diretamente ao auditor externo"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 198, "text": "198. A cláusula 6.1.2 exige que os critérios de avaliação de riscos sejam estabelecidos. O que deve ser definido como critério de aceitação de risco?", "options": [{"id": "a", "text": "A) O valor monetário máximo de perda aceito pela organização"}, {"id": "b", "text": "B) O nível de risco que a organização está disposta a aceitar ou tolerar"}, {"id": "c", "text": "C) A lista de riscos que serão automaticamente transferidos para seguradoras"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 199, "text": "199. A Declaração de Aplicabilidade (SoA) é um documento fundamental na ISO/IEC 27001. O que ela DEVE conter obrigatoriamente?", "options": [{"id": "a", "text": "A) Apenas os controles selecionados para implementação"}, {"id": "b", "text": "B) Os controles necessários, a justificativa para inclusão ou exclusão e o status de implementação"}, {"id": "c", "text": "C) O resultado detalhado de todas as avaliações de risco realizadas"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 200, "text": "200. A opção de tratamento de risco 'modificar' (mitigar) implica qual ação?", "options": [{"id": "a", "text": "A) Encerrar a atividade que deu origem ao risco"}, {"id": "b", "text": "B) Implementar controles para reduzir a probabilidade ou impacto do risco"}, {"id": "c", "text": "C) Transferir o risco para um terceiro via contrato de seguro"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 201, "text": "201. Os objetivos de segurança da informação (cláusula 6.2) devem ser SMART. Qual característica NÃO é exigida pela norma para esses objetivos?", "options": [{"id": "a", "text": "A) Serem monitorados e atualizados"}, {"id": "b", "text": "B) Serem secretos para proteger a estratégia de segurança"}, {"id": "c", "text": "C) Serem comunicados e disponíveis como informação documentada"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 202, "text": "202. Na fase de planejamento, ao selecionar controles para tratamento de risco, a organização deve comparar sua seleção com o Anexo A. Qual é o objetivo dessa comparação?", "options": [{"id": "a", "text": "A) Garantir que todos os 93 controles do Anexo A sejam implementados sem exceção"}, {"id": "b", "text": "B) Verificar se nenhum controle necessário foi omitido inadvertidamente"}, {"id": "c", "text": "C) Confirmar que os controles selecionados estão aprovados pela alta direção"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 203, "text": "203. Uma empresa está planejando implementar o SGSI em fases. A fase inicial cobre apenas a área de TI. Como deve ser documentado o escopo?", "options": [{"id": "a", "text": "A) O escopo deve sempre cobrir toda a organização para ser válido"}, {"id": "b", "text": "B) O escopo deve ser claramente documentado descrevendo os limites, interfaces e dependências"}, {"id": "c", "text": "C) O escopo parcial inviabiliza a certificação ISO 27001"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 204, "text": "204. O plano de tratamento de riscos deve ser aprovado por quem, conforme a cláusula 6.1.3?", "options": [{"id": "a", "text": "A) Apenas pelo gerente de segurança da informação"}, {"id": "b", "text": "B) Pelos proprietários de riscos e pela Alta Direção"}, {"id": "c", "text": "C) Pelo auditor interno antes de qualquer implementação"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 205, "text": "205. Ao planejar a implementação, a organização deve determinar recursos necessários (cláusula 7.1). Qual categoria de recurso é frequentemente subestimada?", "options": [{"id": "a", "text": "A) Infraestrutura de hardware para os sistemas de segurança"}, {"id": "b", "text": "B) Competência humana, incluindo treinamentos e contratação de especialistas"}, {"id": "c", "text": "C) Software de gestão de vulnerabilidades e SIEM"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 206, "text": "206. Na implementação, o controle de acesso lógico (A.9) exige autenticação forte. Qual é um método comum?", "options": [{"id": "a", "text": "A) Apenas senha"}, {"id": "b", "text": "B) Senha + biometria"}, {"id": "c", "text": "C) Token sem expiração"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "tecnologico"}, {"id": 207, "text": "207. Para implementar suporte, treinamentos devem ser planejados. Qual evidência é necessária?", "options": [{"id": "a", "text": "A) Registros de participação e eficácia"}, {"id": "b", "text": "B) Lista de participantes"}, {"id": "c", "text": "C) Certificados genéricos"}], "correct_option": "a", "domain": "Simulado 3 (PECB) — Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 208, "text": "208. A implementação operacional inclui gerenciamento de incidentes (A.16). Qual é o primeiro passo em um incidente?", "options": [{"id": "a", "text": "A) Identificação, registro e classificação inicial do incidente"}, {"id": "b", "text": "B) Divulgação pública do incidente a todas as partes interessadas"}, {"id": "c", "text": "C) Contenção e erradicação"}], "correct_option": "a", "domain": "Simulado 3 (PECB) — Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 209, "text": "209. No controle de fornecedores (A.15), acordos devem especificar responsabilidades de SI. Qual cláusula guia?", "options": [{"id": "a", "text": "A) Cláusula 7.1.2"}, {"id": "b", "text": "B) Cláusula 8.1.4"}, {"id": "c", "text": "C) Cláusula 9.1"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 210, "text": "210. Implementar criptografia (A.10) protege dados em trânsito. Qual algoritmo é aprovado pela ISO?", "options": [{"id": "a", "text": "A) AES-256"}, {"id": "b", "text": "B) DES"}, {"id": "c", "text": "C) MD5"}], "correct_option": "a", "domain": "Simulado 3 (PECB) — Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "tecnologico"}, {"id": 211, "text": "211. A segregação de funções é implementada para prevenir fraudes. Qual exemplo?", "options": [{"id": "a", "text": "A) Uma mesma pessoa solicitar, aprovar e executar o pagamento"}, {"id": "b", "text": "B) Compartilhar as mesmas credenciais de acesso entre toda a equipe financeira"}, {"id": "c", "text": "C) Aprovação separada de pagamentos"}], "correct_option": "c", "domain": "Simulado 3 (PECB) — Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 212, "text": "212. Durante a implementação, mudanças devem ser controladas. Qual processo ISO?", "options": [{"id": "a", "text": "A) Auditoria interna"}, {"id": "b", "text": "B) Controle de mudanças (8.1.3)"}, {"id": "c", "text": "C) Revisão de gestão"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 213, "text": "213. O controle A.5.15 trata de controle de acesso. Qual é o princípio fundamental que deve orientar as regras de controle de acesso?", "options": [{"id": "a", "text": "A) Acesso máximo para garantir produtividade dos usuários"}, {"id": "b", "text": "B) Princípio do menor privilégio – acesso apenas ao necessário para executar funções"}, {"id": "c", "text": "C) Acesso baseado exclusivamente no cargo hierárquico do usuário"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 214, "text": "214. Durante a implementação do controle A.8.7 (proteção contra malware), qual abordagem é mais alinhada à norma?", "options": [{"id": "a", "text": "A) Instalar antivírus apenas em servidores críticos de produção"}, {"id": "b", "text": "B) Implementar controles de detecção, prevenção e recuperação combinados com conscientização dos usuários"}, {"id": "c", "text": "C) Bloquear todos os dispositivos externos sem exceção"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "tecnologico"}, {"id": 215, "text": "215. A implementação de criptografia (controle A.8.24) deve seguir uma política. O que essa política deve estabelecer?", "options": [{"id": "a", "text": "A) Apenas os algoritmos de criptografia aprovados pelo departamento de TI"}, {"id": "b", "text": "B) Abordagem para uso de criptografia, incluindo gestão de chaves criptográficas"}, {"id": "c", "text": "C) A lista de dados que NÃO precisam ser criptografados"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "tecnologico"}, {"id": 216, "text": "216. O controle A.5.24 exige planejamento para gestão de incidentes. O que deve ser definido durante a implementação?", "options": [{"id": "a", "text": "A) Apenas o contato do fornecedor de suporte técnico para situações emergenciais"}, {"id": "b", "text": "B) Processos, papéis, responsabilidades e procedimentos de comunicação para resposta a incidentes"}, {"id": "c", "text": "C) Somente os valores de RTO e RPO para sistemas críticos"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 217, "text": "217. Um Lead Implementer está implementando o controle A.5.9 (inventário de ativos). Qual informação é essencial no inventário?", "options": [{"id": "a", "text": "A) Apenas o valor de mercado dos ativos físicos"}, {"id": "b", "text": "B) Identificação do ativo, proprietário, classificação e localização"}, {"id": "c", "text": "C) Data de compra e número de série de equipamentos de hardware"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 218, "text": "218. O controle A.8.8 trata de gestão de vulnerabilidades técnicas. Qual processo deve ser implementado?", "options": [{"id": "a", "text": "A) Varredura de vulnerabilidades apenas após incidentes confirmados"}, {"id": "b", "text": "B) Identificação, avaliação e tratamento tempestivo de vulnerabilidades técnicas nos sistemas"}, {"id": "c", "text": "C) Aplicação automática de todos os patches sem avaliação prévia de impacto"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "tecnologico"}, {"id": 219, "text": "219. Durante a implementação, a organização deseja garantir a segurança no desenvolvimento de software. Qual controle do Anexo A aborda esse tema?", "options": [{"id": "a", "text": "A) A.8.25 – Ciclo de vida de desenvolvimento seguro"}, {"id": "b", "text": "B) A.8.15 – Log"}, {"id": "c", "text": "C) A.5.31 – Requisitos legais, estatutários, regulamentares e contratuais"}], "correct_option": "a", "domain": "Simulado 3 (PECB) — Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "tecnologico"}, {"id": 220, "text": "220. A implementação de segurança física é regida pelos controles A.7.x. Qual princípio orienta a criação de perímetros de segurança?", "options": [{"id": "a", "text": "A) Usar barreiras únicas de alta tecnologia para reduzir custos"}, {"id": "b", "text": "B) Implementar múltiplas camadas de segurança física (defesa em profundidade)"}, {"id": "c", "text": "C) Restringir acesso físico apenas durante horário comercial"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "fisico"}, {"id": 221, "text": "221. O controle A.6.3 exige treinamento em segurança da informação. Com qual frequência e abrangência ele deve ser realizado?", "options": [{"id": "a", "text": "A) Anualmente, apenas para novos funcionários admitidos no período"}, {"id": "b", "text": "B) Regularmente para todo o pessoal e partes interessadas relevantes, com conteúdo atualizado pertinente às funções"}, {"id": "c", "text": "C) Apenas quando houver mudanças significativas na política de segurança"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "pessoas"}, {"id": 222, "text": "222. Ao implementar o controle A.5.14 sobre transferência de informações, o que deve ser estabelecido?", "options": [{"id": "a", "text": "A) Apenas a política de uso de e-mail corporativo criptografado"}, {"id": "b", "text": "B) Regras, procedimentos ou acordos para transferência de informações em todos os tipos de instalações"}, {"id": "c", "text": "C) Lista de destinatários aprovados para receber informações confidenciais"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 223, "text": "223. O monitoramento inclui KPIs. Qual método para medir eficácia do ISMS?", "options": [{"id": "a", "text": "A) Auditorias internas"}, {"id": "b", "text": "B) Pesquisas de satisfação"}, {"id": "c", "text": "C) Contagem de incidentes"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 5: Monitoring and measurement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 224, "text": "224. A medição de conformidade legal exige monitoramento contínuo. Qual evidência?", "options": [{"id": "a", "text": "A) Declaração única"}, {"id": "b", "text": "B) Registros de revisões legais"}, {"id": "c", "text": "C) Relatório anual"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 5: Monitoring and measurement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 225, "text": "225. No desempenho, a análise de dados de incidentes deve ser feita. Qual ferramenta?", "options": [{"id": "a", "text": "A) Apenas o número total de incidentes registrados, sem qualquer classificação"}, {"id": "b", "text": "B) Planilha de satisfação do cliente, sem relação com os incidentes"}, {"id": "c", "text": "C) Métricas de tempo médio de resolução (MTTR)"}], "correct_option": "c", "domain": "Simulado 3 (PECB) — Domínio 5: Monitoring and measurement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 226, "text": "226. A cláusula 9.1 exige monitoramento, medição, análise e avaliação. Quem define métodos?", "options": [{"id": "a", "text": "A) Topo da gestão"}, {"id": "b", "text": "B) Equipe de SI"}, {"id": "c", "text": "C) Consultor externo"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 5: Monitoring and measurement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 227, "text": "227. Para medir eficácia dos controles, use conformidade e cobertura. Qual é um indicador?", "options": [{"id": "a", "text": "A) Número de funcionários"}, {"id": "b", "text": "B) Taxa de conformidade com SoA"}, {"id": "c", "text": "C) Orçamento de TI"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 5: Monitoring and measurement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 228, "text": "228. A satisfação das partes interessadas é monitorada por pesquisas. Qual frequência típica?", "options": [{"id": "a", "text": "A) A cada cinco anos, independentemente de mudanças no contexto"}, {"id": "b", "text": "B) Apenas uma vez, durante a implementação inicial do SGSI"}, {"id": "c", "text": "C) Anual ou após mudanças"}], "correct_option": "c", "domain": "Simulado 3 (PECB) — Domínio 5: Monitoring and measurement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 229, "text": "229. Registros de monitoramento devem ser retidos. Qual cláusula?", "options": [{"id": "a", "text": "A) 7.5.3"}, {"id": "b", "text": "B) 9.1.3"}, {"id": "c", "text": "C) 10.2"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 5: Monitoring and measurement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 230, "text": "230. A avaliação de conformidade inclui testes de penetração. Qual cláusula suporta?", "options": [{"id": "a", "text": "A) 6.1.2"}, {"id": "b", "text": "B) 9.2.1 (auditoria interna)"}, {"id": "c", "text": "C) 8.2"}], "correct_option": "c", "domain": "Simulado 3 (PECB) — Domínio 5: Monitoring and measurement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 231, "text": "231. A cláusula 9.1 exige que a organização avalie o desempenho do SGSI. Qual dos indicadores abaixo é mais adequado para medir a eficácia de um controle de conscientização?", "options": [{"id": "a", "text": "A) Número de licenças de software de segurança adquiridas"}, {"id": "b", "text": "B) Percentual de funcionários que identificaram corretamente e-mails de phishing em testes simulados"}, {"id": "c", "text": "C) Valor do orçamento investido em treinamentos de segurança"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 5: Monitoring and measurement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 232, "text": "232. O programa de auditoria interna (cláusula 9.2) deve ser planejado considerando quais fatores?", "options": [{"id": "a", "text": "A) Apenas a disponibilidade dos auditores internos e o calendário da organização"}, {"id": "b", "text": "B) A importância dos processos, resultados de auditorias anteriores e mudanças que afetam a organização"}, {"id": "c", "text": "C) Somente os requisitos definidos pelo organismo certificador externo"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 5: Monitoring and measurement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 233, "text": "233. Um auditor interno encontrou evidências de que a análise crítica pela Direção (cláusula 9.3) não incluiu a situação de ações de análises críticas anteriores. Qual é a classificação correta dessa constatação?", "options": [{"id": "a", "text": "A) Observação, pois não compromete a eficácia do SGSI"}, {"id": "b", "text": "B) Não conformidade, pois a cláusula 9.3.2 a) exige explicitamente esse item como entrada"}, {"id": "c", "text": "C) Oportunidade de melhoria, pois a norma recomenda mas não exige esse item"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 5: Monitoring and measurement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 234, "text": "234. Os resultados da análise crítica pela Direção devem incluir quais tipos de decisões?", "options": [{"id": "a", "text": "A) Apenas decisões sobre o orçamento do próximo exercício fiscal"}, {"id": "b", "text": "B) Decisões sobre oportunidades de melhoria contínua e necessidades de mudanças no SGSI"}, {"id": "c", "text": "C) Exclusivamente ações corretivas para não conformidades identificadas em auditorias"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 5: Monitoring and measurement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 235, "text": "235. Ao definir o que monitorar e medir no SGSI (cláusula 9.1), qual informação deve ser determinada?", "options": [{"id": "a", "text": "A) Apenas os resultados financeiros impactados por incidentes de segurança"}, {"id": "b", "text": "B) O que monitorar, os métodos de análise, quando realizar e quem deve analisar e avaliar os resultados"}, {"id": "c", "text": "C) Somente os indicadores exigidos pelo organismo de certificação contratado"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 5: Monitoring and measurement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 236, "text": "236. A cláusula 10.1 exige melhoria contínua do SGSI. Quais são as dimensões que devem ser aprimoradas continuamente?", "options": [{"id": "a", "text": "A) Apenas a eficiência operacional dos controles técnicos implementados"}, {"id": "b", "text": "B) A pertinência, adequação e eficácia do SGSI"}, {"id": "c", "text": "C) Somente os processos com não conformidades identificadas em auditorias"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 6: Continual improvement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 237, "text": "237. Ao tratar uma não conformidade (cláusula 10.2), qual passo é realizado APÓS controlar e corrigir a não conformidade?", "options": [{"id": "a", "text": "A) Notificar imediatamente o organismo certificador sobre a ocorrência"}, {"id": "b", "text": "B) Avaliar a necessidade de ações para eliminar as causas e evitar recorrência"}, {"id": "c", "text": "C) Arquivar a documentação e encerrar o registro da não conformidade"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 6: Continual improvement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 238, "text": "238. A análise de causa raiz é realizada no contexto do tratamento de não conformidades. Qual ferramenta é adequada para essa análise?", "options": [{"id": "a", "text": "A) Apenas análise de custo-benefício dos controles envolvidos"}, {"id": "b", "text": "B) Diagrama de Ishikawa (espinha de peixe) ou metodologia dos 5 Porquês"}, {"id": "c", "text": "C) Exclusivamente testes de penetração técnicos"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 6: Continual improvement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 239, "text": "239. A informação documentada retida sobre não conformidades e ações corretivas (cláusula 10.2 f-g) serve a qual propósito principal?", "options": [{"id": "a", "text": "A) Comprovar ao organismo certificador que a organização seguiu todos os requisitos formais"}, {"id": "b", "text": "B) Evidenciar o aprendizado organizacional e a eficácia das ações tomadas para eliminar causas"}, {"id": "c", "text": "C) Calcular o custo total das não conformidades para reporte à Alta Direção"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 6: Continual improvement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 240, "text": "240. A melhoria contínua do SGSI pode ser impulsionada por diversas fontes de informação. Qual das seguintes NÃO é uma fonte típica de oportunidades de melhoria?", "options": [{"id": "a", "text": "A) Resultados de auditorias internas e externas"}, {"id": "b", "text": "B) Relatórios de vendas do departamento comercial"}, {"id": "c", "text": "C) Lições aprendidas de incidentes de segurança"}], "correct_option": "b", "domain": "Simulado 3 (PECB) — Domínio 6: Continual improvement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}]</script>
    <script>
      const ALL_QUESTIONS = JSON.parse(document.getElementById('questions-data').textContent);
      const CONFIG = {"examTitle": "ISO/IEC 27001 Lead Implementer Simulator — Todos os Simulados", "examSubtitle": "240 questões (Simulados 1, 2 e 3), em blocos de 10, com pausa e acompanhamento de desempenho.", "totalSeconds": 32400};
      const BLOCK_SIZE = 10;
      const TOTAL = ALL_QUESTIONS.length;
      const TOTAL_BLOCKS = Math.ceil(TOTAL / BLOCK_SIZE);
      const TOTAL_SECONDS = CONFIG.totalSeconds;

      const state = {
        view: 'intro', // intro | exam | pause | confirmSubmit | manualPause | final
        current: 1, // 1-indexed question number
        maxUnlocked: BLOCK_SIZE,
        answers: {}, // qid -> letter
        bookmarks: new Set(),
        filter: 'all', // all | bookmarked | unanswered
        secondsLeft: TOTAL_SECONDS,
        timerId: null,
        pauseBlockIndex: null, // which block the pause screen refers to (0-indexed)
      };

      const byId = (i) => ALL_QUESTIONS[i - 1];

      const THEME_META = {
        organizacional: { label: '📁 Controles Organizacionais', controls: 37, order: 1 },
        pessoas:        { label: '👥 Controles de Pessoas',       controls: 8,  order: 2 },
        fisico:         { label: '🏢 Controles Físicos',          controls: 14, order: 3 },
        tecnologico:    { label: '💻 Controles Tecnológicos',     controls: 34, order: 4 },
      };
      const THEME_ORDER = ['organizacional', 'pessoas', 'fisico', 'tecnologico'];

      function computeStatsForQuestions(qs) {
        let correct = 0;
        const perQuestion = [];
        qs.forEach(q => {
          const chosen = state.answers[q.id];
          const isCorrect = chosen === q.correct_option;
          if (isCorrect) correct++;
          perQuestion.push({ id: q.id, correct: isCorrect, answered: chosen !== undefined });
        });
        return { correct, total: qs.length, perQuestion };
      }

      function computeDomainBreakdown(qs) {
        const byTheme = {};
        THEME_ORDER.forEach(k => { byTheme[k] = { correct: 0, total: 0 }; });
        qs.forEach(q => {
          const key = THEME_META[q.theme] ? q.theme : 'organizacional';
          byTheme[key].total++;
          if (state.answers[q.id] === q.correct_option) byTheme[key].correct++;
        });
        return byTheme;
      }

      function barChartHTML(byDomain) {
        return THEME_ORDER.map(k => {
          const meta = THEME_META[k];
          const d = byDomain[k] || { correct: 0, total: 0 };
          const pct = d.total ? Math.round((d.correct / d.total) * 100) : 0;
          const color = d.total === 0 ? '#cbd5e1' : (pct >= 70 ? '#15803d' : (pct >= 50 ? '#d97706' : '#b91c1c'));
          const countLabel = d.total ? `${d.correct}/${d.total} (${pct}%)` : 'sem dados ainda';
          return `
            <div class="bar-row">
              <div class="bar-label" title="${escapeHtml(meta.label)} · ${meta.controls} controles">${escapeHtml(meta.label)}</div>
              <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
              <div class="bar-pct">${countLabel}</div>
            </div>`;
        }).join('');
      }

      function escapeHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      function fmtTime(totalSec) {
        const s = Math.max(0, totalSec);
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const sec = Math.floor(s % 60);
        const pad = (n) => String(n).padStart(2, '0');
        return `${pad(h)}:${pad(m)}:${pad(sec)}`;
      }

      function startTimer() {
        if (state.timerId) return;
        state.timerId = setInterval(() => {
          if (state.view !== 'exam') return; // ticks only while actively answering
          state.secondsLeft--;
          if (state.secondsLeft <= 0) {
            state.secondsLeft = 0;
            clearInterval(state.timerId);
            state.timerId = null;
            state.view = 'final';
            render();
            return;
          }
          const el = document.getElementById('timer-display');
          if (el) el.textContent = fmtTime(state.secondsLeft);
        }, 1000);
      }

      function render() {
        const app = document.getElementById('app');
        if (state.view === 'intro') app.innerHTML = renderIntro();
        else if (state.view === 'exam') app.innerHTML = renderExamChrome() + renderExamBody();
        else if (state.view === 'pause') app.innerHTML = renderExamChrome(true) + renderPause();
        else if (state.view === 'confirmSubmit') app.innerHTML = renderExamChrome(true) + renderConfirmSubmit();
        else if (state.view === 'manualPause') app.innerHTML = renderExamChrome(true) + renderManualPause();
        else if (state.view === 'final') app.innerHTML = renderFinal();
        attachHandlers();
        window.scrollTo(0, 0);
      }

      function renderIntro() {
        return `
          <div class="card">
            <h1>${escapeHtml(CONFIG.examTitle)}</h1>
            <p class="sub">${escapeHtml(CONFIG.examSubtitle)}</p>
            <ul class="plain">
              <li><span>Total de questões</span><strong>${TOTAL}</strong></li>
              <li><span>Tempo total</span><strong>${fmtTime(TOTAL_SECONDS)}</strong></li>
              <li><span>Nota de aprovação</span><strong>70%</strong></li>
              <li><span>Pausas</span><strong>a cada ${BLOCK_SIZE} questões, com resultado parcial</strong></li>
            </ul>
            <div class="footer-actions" style="justify-content:flex-end">
              <button class="btn" id="start-btn">Iniciar Simulado</button>
            </div>
          </div>`;
      }

      function renderExamChrome(disabled) {
        const pct = TOTAL_SECONDS ? state.secondsLeft / TOTAL_SECONDS : 1;
        const timerCls = pct < 0.1 ? 'timer low' : 'timer ok';
        return `
          <div class="topbar">
            <div class="examname">Exam: <span>${escapeHtml(CONFIG.examTitle)}</span></div>
            <div class="loggedas">Logged in as: Student</div>
          </div>
          <div class="toolbar">
            <button class="navbtn" id="prev-q-btn" ${disabled || state.current <= 1 ? 'disabled' : ''}>&lsaquo;</button>
            <span class="qcounter">Question ${state.current} of ${TOTAL}</span>
            <button class="navbtn" id="next-q-btn-top" ${disabled || state.current >= state.maxUnlocked ? 'disabled' : ''}>&rsaquo;</button>
            <button class="bookmarkbtn ${state.bookmarks.has(state.current) ? 'active' : ''}" id="bookmark-btn" ${disabled ? 'disabled' : ''}>🔖 Bookmark</button>
            <div class="spacer"></div>
            <div class="${timerCls}">🕐 <span id="timer-display">${fmtTime(state.secondsLeft)}</span></div>
            <button class="pausebtn" id="manual-pause-btn" ${disabled ? 'disabled' : ''}>⏸ Pause Exam</button>
            <button class="submitbtn" id="submit-exam-btn" ${disabled ? 'disabled' : ''}>✓ SUBMIT EXAM</button>
          </div>
          <div class="filterbar">
            Show:
            <label><input type="radio" name="filter" value="all" ${state.filter==='all'?'checked':''} ${disabled?'disabled':''}> All</label>
            <label><input type="radio" name="filter" value="bookmarked" ${state.filter==='bookmarked'?'checked':''} ${disabled?'disabled':''}> Bookmarked</label>
            <label><input type="radio" name="filter" value="unanswered" ${state.filter==='unanswered'?'checked':''} ${disabled?'disabled':''}> Unanswered</label>
          </div>
          <div class="gridwrap">
            <div class="grid">${renderGrid(disabled)}</div>
          </div>`;
      }

      function renderGrid(disabled) {
        let nums = [];
        for (let i = 1; i <= TOTAL; i++) nums.push(i);
        if (state.filter === 'bookmarked') nums = nums.filter(i => state.bookmarks.has(i));
        if (state.filter === 'unanswered') nums = nums.filter(i => i <= state.maxUnlocked && state.answers[byId(i).id] === undefined);
        if (nums.length === 0) return `<span class="sub">Nenhuma questão nesse filtro.</span>`;
        return nums.map(i => {
          const locked = i > state.maxUnlocked;
          const answered = state.answers[byId(i).id] !== undefined;
          let cls = 'gridnum';
          if (i === state.current) cls += ' current';
          else if (answered) cls += ' answered';
          if (locked) cls += ' locked';
          if (state.bookmarks.has(i)) cls += ' bookmarked';
          return `<button type="button" class="${cls}" data-goto="${i}" ${locked || disabled ? 'disabled' : ''} title="${locked ? 'Bloqueada até concluir o bloco anterior' : ''}">${i}</button>`;
        }).join('');
      }

      function renderExamBody() {
        const q = byId(state.current);
