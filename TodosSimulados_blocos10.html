ontrolada para assegurar que esteja disponível e adequada para uso, onde e quando for necessária, e que esteja adequadamente protegida (por exemplo, contra perda de confidencialidade, uso impróprio ou perda de integridade). Isso equilibra dois objetivos aparentemente opostos: acesso facilitado a quem precisa e proteção contra acesso indevido ou perda.", "analisa": "- a) Um \"cofre\" com acesso extremamente limitado pode comprometer a disponibilidade exigida — a informação precisa estar acessível a quem dela necessita para operar o SGSI, e não trancada a ponto de inviabilizar seu uso legítimo.\n- c) Publicar sem controle de versão ou acesso viola diretamente a exigência de proteção adequada e de controle de distribuição/acesso/recuperação/uso prevista na cláusula 7.5.3 b), abrindo espaço para uso de versões desatualizadas ou acesso indevido.", "dica": "7.5.3 equilibra disponibilidade + proteção — a resposta certa quase sempre contempla os dois lados (acesso adequado E proteção adequada), enquanto distratores pecam por exagerar em um dos extremos (fechado demais ou aberto demais).", "resumo": "Documento controlado = acessível a quem precisa, protegido de quem não deve ver ou alterar."}, "118": {"resposta_correta": "b) Desenvolver e manter um inventário completo de informações e ativos, incluindo seus proprietários.", "justificativa": "O controle 5.9 do Anexo A (tema Organizacional) tem como objetivo identificar as informações e outros ativos associados da organização, de modo a preservar sua segurança e atribuir a propriedade adequada. Isso implica desenvolver e manter um inventário abrangente, que cubra ativos de informação de qualquer natureza (dados, sistemas, dispositivos, serviços) e identifique claramente quem é o proprietário responsável por cada um — condição essencial para uma gestão de riscos eficaz, já que não se protege (nem se avalia risco de) o que não se conhece.", "analisa": "- a) O inventário do controle 5.9 tem propósito de segurança da informação (base para avaliação de riscos, classificação e controle de acesso), não é um instrumento contábil-fiscal — embora possa haver sobreposição parcial com ativos patrimoniais, esse não é o objetivo do controle.\n- c) O controle trata de \"informações e outros ativos associados\" de forma ampla — não apenas hardware, mas também dados, software, serviços e até ativos intangíveis; restringir a hardware contraria explicitamente o escopo do controle.", "dica": "Sempre associe o controle 5.9 a \"inventário + proprietário do ativo\" — esses dois elementos (o quê e quem é responsável) são o núcleo do controle e aparecem com frequência juntos nas provas.", "resumo": "Não dá para proteger o que não se sabe que existe: inventário com dono definido é a base de tudo."}, "119": {"resposta_correta": "b) Regras e procedimentos para o uso aceitável e manuseio de informações e ativos.", "justificativa": "O controle 5.10 tem como objetivo assegurar que a informação e outros ativos associados sejam adequadamente protegidos, usados e manuseados. Para isso, exige que regras para o uso aceitável e procedimentos de manuseio de informações e outros ativos associados sejam identificados, documentados e implementados, com base na classificação da informação (ligada ao controle 5.12) e considerando os riscos envolvidos.", "analisa": "- a) Uma política \"flexível que permite qualquer uso\" (desde que sem dano intencional) contraria o propósito do controle, que é justamente estabelecer regras claras de uso aceitável, incluindo restrições para usos não intencionais mas arriscados (ex.: uso indevido de dados por descuido, não apenas por má-fé).\n- c) A norma não exige proibição total de dispositivos pessoais (BYOD) — o que se exige são regras específicas para o uso aceitável, que podem, dependendo do risco, permitir o uso de ativos pessoais sob condições controladas (não uma proibição categórica e universal).", "dica": "O controle 5.10 é frequentemente conectado ao 5.9 (inventário) e ao 5.12 (classificação): sem saber o que se tem e como está classificado, não dá para definir regras de uso aceitável coerentes.", "resumo": "Uso aceitável = regras claras e documentadas, nem liberdade total, nem proibição total."}, "120": {"resposta_correta": "b) De acordo com as necessidades de segurança da informação da organização, baseadas na confidencialidade, integridade, disponibilidade e requisitos das partes interessadas relevantes.", "justificativa": "O controle 5.12 exige que a informação seja classificada de acordo com as necessidades de segurança da informação da organização, com base em confidencialidade, integridade, disponibilidade e requisitos de partes interessadas relevantes. Não há um esquema fixo imposto pela norma (como apenas \"público/restrito\") — cada organização define seu próprio esquema de classificação (por exemplo, público, interno, confidencial, restrito), proporcional aos riscos e necessidades específicas do negócio.", "analisa": "- a) Restringir a apenas duas categorias fixas (\"público\" ou \"restrito\") é uma simplificação que a norma não impõe — o esquema de classificação deve ser definido pela organização conforme suas necessidades reais, podendo (e geralmente devendo) ter mais níveis intermediários.\n- c) Classificar pelo \"volume de armazenamento\" não tem relação com o propósito do controle, que é proteger a informação de acordo com sua sensibilidade e criticidade (CID), não com seu tamanho em bytes.", "dica": "Classificação da informação (5.12) sempre remete aos pilares CID + necessidades das partes interessadas — não a critérios técnicos irrelevantes como tamanho de arquivo ou tipo de mídia.", "resumo": "Classifica-se pela sensibilidade da informação (CID), não pelo espaço que ela ocupa em disco."}, "121": {"resposta_correta": "b) As responsabilidades do pessoal e da organização para a segurança da informação.", "justificativa": "O controle 6.2 (tema Pessoas) exige que os acordos contratuais de trabalho declarem as responsabilidades do pessoal e da organização para a segurança da informação. Isso formaliza, desde o início do vínculo, o compromisso de ambas as partes com práticas de segurança (como confidencialidade, uso aceitável, cumprimento de políticas), servindo de base legal para exigibilidade de condutas e, se necessário, ações disciplinares.", "analisa": "- a) Salário e benefícios são cláusulas contratuais trabalhistas comuns, mas não são o foco do controle 6.2, que trata especificamente de responsabilidades relacionadas à segurança da informação.\n- c) O controle não exige que o contrato de trabalho traga a \"lista completa\" de controles técnicos de segurança (isso seria função de políticas e procedimentos específicos) — o contrato declara responsabilidades gerais, remetendo a políticas detalhadas à parte.", "dica": "O tema Pessoas do Anexo A (controles 6.1 a 6.8) trata do ciclo de vida do vínculo com colaboradores: antes (6.1 - triagem), durante (6.2, 6.3 conscientização, 6.4 disciplinar) e depois (6.5 - responsabilidades pós-encerramento). Associe cada controle à fase certa desse ciclo.", "resumo": "O contrato declara \"quem é responsável por quê\" em segurança — não substitui políticas detalhadas."}, "122": {"resposta_correta": "b) Para tomar ações contra o pessoal e outras partes interessadas que violarem a política da segurança da informação.", "justificativa": "O controle 6.4 exige que um processo disciplinar seja formalizado e comunicado, a fim de tomar ações contra o pessoal e outras partes interessadas relevantes que tenham cometido uma violação da política de segurança da informação. Esse processo deve ser justo, proporcional e considerar fatores como natureza e gravidade da violação, seu impacto, se é uma primeira ou repetida ocorrência, entre outros — funcionando como mecanismo de dissuasão e responsabilização (accountability).", "analisa": "- a) O controle 6.4 trata de ação disciplinar diante de violações, não de mecanismos de reconhecimento ou premiação por boas práticas — isso seria outro tipo de iniciativa de cultura organizacional, fora do escopo específico deste controle.\n- c) O foco do controle não é \"registrar reclamações de funcionários contra as políticas\", mas sim conduzir um processo formal quando o próprio pessoal viola a política de segurança — a direção do processo é inversa à descrita na alternativa.", "dica": "Processo disciplinar (6.4) deve ser formal, comunicado a todos (efeito dissuasório) e aplicado com proporcionalidade e justiça — não é punição arbitrária nem sistema de reclamações.", "resumo": "6.4 é o \"e se alguém violar a política?\" — resposta formal, justa e comunicada previamente."}, "123": {"resposta_correta": "b) Definir, aplicar e comunicar as responsabilidades de segurança da informação que permaneçam válidas.", "justificativa": "O controle 6.5 exige que as responsabilidades e obrigações de segurança da informação que permaneçam válidas após o encerramento ou a mudança da contratação sejam definidas, aplicadas e comunicadas ao pessoal e a outras partes interessadas relevantes. Exemplos típicos incluem obrigações de confidencialidade que sobrevivem ao fim do contrato, revogação de acessos e devolução de ativos — mas o núcleo do controle é a continuidade de certas obrigações mesmo após o desligamento.", "analisa": "- a) Contraria diretamente o propósito do controle: certas responsabilidades de segurança (como sigilo sobre informações confidenciais aprendidas durante o vínculo) permanecem válidas mesmo após o encerramento, não podendo ser simplesmente descartadas.\n- c) A devolução de equipamentos é apenas um exemplo de ação prática associada ao offboarding, mas não esgota o escopo do controle, que trata de responsabilidades de segurança em sentido mais amplo (confidencialidade, propriedade intelectual, revogação de acesso etc.), não apenas ativos físicos.", "dica": "6.5 lida com o \"pós-desligamento\": pense em cláusulas de confidencialidade que continuam valendo, revogação de credenciais, e comunicação clara ao ex-colaborador sobre o que ainda se espera dele.", "resumo": "Sair da empresa não apaga todas as obrigações de segurança — algumas seguem valendo."}, "124": {"resposta_correta": "b) Proteger áreas que contenham informações e outros ativos associados contra acessos não autorizados.", "justificativa": "O controle 7.1 (tema Físico) exige que perímetros de segurança sejam definidos e usados para proteger áreas que contenham informação e outros ativos associados. O objetivo é prevenir acesso físico não autorizado, dano e interferência às informações e demais ativos da organização dentro das instalações, por meio de barreiras físicas (paredes, portões, catracas, controles de acesso) que delimitam zonas de segurança crescente conforme a criticidade da área.", "analisa": "- a) O controle não se restringe a zonas exclusivas da alta direção — perímetros de segurança física protegem qualquer área com ativos críticos (data centers, arquivos, salas de servidores), independentemente de quem os utilize.\n- c) O propósito do controle é claramente de segurança (prevenção de acesso não autorizado, dano ou interferência), não estético ou organizacional — embora um ambiente bem organizado possa ser um efeito colateral positivo, não é o objetivo do controle.", "dica": "O tema Físico do Anexo A (controles 7.1 a 7.14) trata de proteção de instalações e equipamentos — associe perímetros (7.1) a \"camadas de defesa física\" (crachá na portaria, catraca no andar, biometria na sala de servidores).", "resumo": "Perímetro físico é a \"muralha\" que protege os ativos de quem não deveria chegar perto."}, "125": {"resposta_correta": "b) Regras de mesa limpa para documentos impressos e mídia removível, e regras de tela limpa para recursos de tratamento de informações.", "justificativa": "O controle 7.7 exige que regras de mesa limpa para papéis e mídias de armazenamento removíveis, e regras de tela limpa para os recursos de tratamento da informação, sejam definidas e adequadamente aplicadas. O objetivo é reduzir riscos de acesso não autorizado, perda e dano à informação em estações de trabalho e áreas de circulação, durante e fora do horário normal de trabalho (por exemplo, bloqueio automático de tela e guarda de documentos sensíveis fora da vista).", "analisa": "- a) O controle tem impacto direto na segurança da informação (prevenção de exposição visual e furto de dados/documentos) — não é uma regra meramente estética ou de organização do espaço físico.\n- c) Permitir deixar documentos confidenciais expostos na mesa é exatamente o oposto do que o controle 7.7 exige — contraria seu propósito central de proteção da informação sensível contra visualização ou acesso não autorizado.", "dica": "\"Mesa limpa e tela limpa\" é um controle clássico e visual — pense em auditor caminhando pelo escritório e encontrando papel confidencial exposto ou tela desbloqueada sem o usuário presente: isso é evidência de não conformidade com o 7.7.", "resumo": "Nada de papel sensível à vista ou tela destravada sem ninguém por perto — mesa e tela sempre \"limpas\"."}, "126": {"resposta_correta": "b) Restringir e gerenciar a atribuição e o uso de direitos de acessos privilegiados.", "justificativa": "O controle 8.2 (tema Tecnológico) exige que a atribuição e o uso de direitos de acessos privilegiados sejam restritos e gerenciados. Acessos privilegiados (como administradores de sistema, root, DBA) representam um risco elevado por seu alto poder sobre sistemas e dados, exigindo controles como concessão sob o princípio do menor privilégio, aprovação formal, revisão periódica e uso de contas separadas (privilegiada vs. comum) para o mesmo indivíduo.", "analisa": "- a) Conceder privilégios livremente a quem solicitar é exatamente o oposto do princípio de menor privilégio e da gestão restritiva que o controle exige, aumentando desnecessariamente a superfície de risco.\n- c) Uma auditoria apenas anual, isolada, não é suficiente nem representa a exigência central do controle, que é a restrição e gestão contínua (concessão, revisão periódica, revogação) — não uma checagem pontual uma vez por ano.", "dica": "Direitos privilegiados (8.2) sempre remetem ao princípio do menor privilégio (least privilege) e à segregação de funções — desconfie de alternativas que falam em conceder acesso amplo \"por conveniência\" ou \"sob demanda sem critério\".", "resumo": "Quem tem \"poder de root\" precisa de controle redobrado, não de liberdade total."}, "127": {"resposta_correta": "b) Implemente proteção contra malware apoiada pela conscientização adequada do usuário.", "justificativa": "O controle 8.7 exige que proteção contra malware seja implementada e apoiada por conscientização adequada dos usuários. A norma reconhece que controles puramente técnicos (antivírus, EDR, filtros) não são suficientes isoladamente — o fator humano (reconhecer phishing, evitar downloads suspeitos, seguir boas práticas) é parte essencial da defesa em profundidade contra malware.", "analisa": "- a) Confiar \"exclusivamente\" em ferramentas automáticas ignora a exigência explícita do controle de que a proteção técnica seja combinada com conscientização do usuário — uma defesa unicamente tecnológica é insuficiente por si só.\n- c) Bloquear completamente o acesso à internet é uma medida extrema e geralmente inviável para a operação do negócio; o controle não exige isolamento total, mas sim uma combinação equilibrada de controles técnicos, procedimentos e conscientização proporcional ao risco.", "dica": "Controles tecnológicos do Anexo A frequentemente exigem complementaridade entre tecnologia e pessoas — \"ferramenta apoiada por conscientização\" é um padrão textual comum em vários controles de tema Tecnológico (ex.: 8.7, phishing, engenharia social).", "resumo": "Antivírus sozinho não basta: usuário consciente é parte da defesa contra malware."}, "128": {"resposta_correta": "b) Estabelecidas, documentadas, implementadas, monitoradas e analisadas criticamente.", "justificativa": "O controle 8.9 exige que as configurações, incluindo configurações de segurança, de hardware, software, serviços e redes, sejam estabelecidas, documentadas, implementadas, monitoradas e analisadas criticamente. O objetivo é assegurar que os sistemas operem de forma segura conforme configurações previstas (baseline seguro), detectando e corrigindo desvios não autorizados que possam introduzir vulnerabilidades.", "analisa": "- a) Deixar sistemas em configuração padrão de fábrica é uma prática de risco elevado, pois configurações-padrão são amplamente conhecidas (inclusive por atacantes) e geralmente não seguem princípios de hardening — contraria diretamente o propósito do controle.\n- c) \"Segredo\" sobre configurações (segurança por obscuridade) não é o mecanismo de proteção previsto pelo controle 8.9 — a segurança vem de configurações robustas, documentadas e monitoradas, não de ocultação, prática amplamente desaconselhada em segurança da informação.", "dica": "O controle 8.9 (gestão de configuração) está ligado ao conceito de baseline de segurança e hardening — associe sempre a documentação e o monitoramento de desvios de configuração, não a \"esconder\" ou \"deixar como veio de fábrica\".", "resumo": "Configuração segura é documentada e monitorada — nunca \"padrão de fábrica\" nem \"segredo\"."}, "129": {"resposta_correta": "b) Aplicar medidas de prevenção de vazamento de dados a sistemas, redes e dispositivos que tratem informações sensíveis.", "justificativa": "O controle 8.12 exige que medidas de prevenção de vazamento de dados sejam aplicadas a sistemas, redes e quaisquer outros dispositivos que processem, armazenem ou transmitam informação sensível. Isso inclui, por exemplo, soluções de DLP (Data Loss Prevention), monitoramento de canais de saída de dados (e-mail, USB, upload), classificação prévia da informação e políticas de restrição de transferência de dados sensíveis para fora do ambiente controlado — uma postura preventiva, não apenas reativa.", "analisa": "- a) Monitorar apenas a internet em busca de dados já vazados é uma postura reativa (detecção pós-fato), enquanto o controle exige medidas preventivas aplicadas internamente aos sistemas, redes e dispositivos, antes que o vazamento ocorra.\n- c) \"Aceitar que vazamentos são inevitáveis\" contraria frontalmente o propósito do controle, cujo nome já indica \"prevenção\" — a norma não endossa uma postura de resignação, mas de mitigação proativa do risco de vazamento.", "dica": "DLP (8.12) é sobre prevenção, aplicada nos pontos de saída de dados sensíveis (endpoints, e-mail, rede, nuvem) — desconfie de alternativas que descrevem apenas monitoramento externo ou resposta a incidente já ocorrido, pois isso caracterizaria outros controles (ex.: 5.24-5.28, gestão de incidentes).", "resumo": "DLP é prevenção na saída dos dados sensíveis — não é só \"procurar o que já vazou\"."}, "130": {"resposta_correta": "b) Estabelecer critérios para os processos e implementar controles de acordo com esses critérios, com informação documentada para gerar confiança.", "justificativa": "A cláusula 8.1 (Planejamento e controle operacionais) exige que a organização planeje, implemente e controle os processos necessários para atender aos requisitos de segurança da informação e para implementar as ações determinadas em 6.1 e 6.2, estabelecendo critérios para esses processos e implementando o controle deles de acordo com esses critérios. Também exige manter informação documentada na extensão necessária para ter confiança de que os processos foram realizados conforme planejado.", "analisa": "- a) A norma não exige criação de um processo novo a cada nova tecnologia — o que se exige é que os processos existentes (ou adaptados) sejam controlados conforme critérios definidos, e não uma proliferação automática de processos por tecnologia adotada.\n- c) A cláusula 8.1 não se limita a \"documentar o que já existe\" sem intervenção — ela exige planejamento, implementação e controle ativos dos processos, com critérios estabelecidos e evidências de execução conforme planejado, o que pode envolver criação de novos controles quando necessário.", "dica": "A cláusula 8.1 é a \"cláusula de execução operacional\" do PDCA — associe-a a: planejar → implementar → controlar → documentar evidências de que tudo ocorreu conforme planejado.", "resumo": "Operação (8.1) é colocar o plano em prática, com critérios definidos e evidências de que funcionou como planejado."}, "131": {"resposta_correta": "b) Para garantir que o SGSI permaneça relevante e eficaz diante de um ambiente de risco em constante mudança.", "justificativa": "A cláusula 8.2 exige que a organização realize avaliações de riscos de segurança da informação a intervalos planejados ou quando mudanças significativas forem propostas ou ocorrerem, retendo informação documentada dos resultados. O objetivo é assegurar que o panorama de riscos seja reavaliado periodicamente, já que ameaças, vulnerabilidades e o próprio contexto do negócio mudam continuamente — mantendo o SGSI sempre alinhado à realidade de risco atual, e não apenas à \"fotografia\" do momento da implementação inicial.", "analisa": "- a) A reavaliação de riscos não tem como finalidade justificar compras de software — decisões de investimento podem decorrer de uma avaliação, mas não são o objetivo da cláusula, que é a gestão contínua do risco em si.\n- c) Pelo contrário, a cláusula 8.2 exige reter informação documentada dos resultados das avaliações de riscos — a documentação é obrigatória, não dispensável.", "dica": "Diferencie 6.1.2 (avaliação de riscos no planejamento inicial) de 8.2 (avaliação de riscos operacional/contínua, \"a intervalos planejados ou quando mudanças significativas ocorrerem\") — ambas usam a mesma metodologia definida, mas em momentos diferentes do ciclo de vida do SGSI.", "resumo": "Risco não é estático: reavaliar periodicamente mantém o SGSI vivo e relevante."}, "132": {"resposta_correta": "b) A organização deve assegurar que esses processos, produtos ou serviços terceirizados sejam controlados.", "justificativa": "A cláusula 8.1 determina que a organização deve assegurar que processos, produtos ou serviços terceirizados que sejam relevantes para o SGSI sejam controlados. Isso significa que a responsabilidade final pela segurança da informação permanece com a organização contratante, mesmo quando a execução é delegada a terceiros — o controle pode se dar por meio de contratos, SLAs, cláusulas de segurança, auditorias e monitoramento do desempenho do fornecedor.", "analisa": "- a) A responsabilidade pela segurança da informação nunca é \"inteiramente transferida\" a um terceiro — a organização continua responsável perante seu SGSI, suas partes interessadas e a norma, mesmo terceirizando a execução de um processo.\n- c) Ignorar a segurança de serviços terceirizados apenas porque \"não estão na própria infraestrutura\" contraria diretamente a exigência da cláusula 8.1 de que esses processos sejam controlados, e também os controles de relacionamento com fornecedores do Anexo A (tema 5.19 a 5.23).", "dica": "Terceirização nunca elimina responsabilidade: a organização contratante continua responsável por garantir que o terceiro proteja adequadamente a informação — esse princípio aparece repetidamente em diferentes cláusulas e controles (8.1, 5.19-5.23).", "resumo": "Terceirizar a execução não terceiriza a responsabilidade pela segurança."}, "133": {"resposta_correta": "b) Aquisição, uso, gestão e saída de serviços em nuvem, de acordo com os requisitos de segurança da informação.", "justificativa": "O controle 5.23 (um dos controles novos da versão 2022) exige que processos de aquisição, uso, gestão e saída de serviços em nuvem sejam estabelecidos de acordo com os requisitos de segurança da informação da organização. Isso cobre todo o ciclo de vida do relacionamento com o provedor de nuvem — desde a due diligence na contratação, passando pela operação e monitoramento contínuo, até a estratégia de saída (exit strategy) e portabilidade/eliminação segura dos dados ao encerrar o serviço.", "analisa": "- a) Restringir-se a \"uso e monitoramento\" ignora as fases de aquisição (seleção e contratação segura do provedor) e saída (encerramento seguro do serviço, incluindo devolução ou eliminação de dados), ambas explicitamente exigidas pelo controle.\n- c) Cláusulas contratuais de segurança são um dos elementos possíveis, mas o controle vai além de aspectos meramente contratuais — abrange também controles técnicos e de gestão durante o uso efetivo e no encerramento do serviço.", "dica": "5.23 é um controle \"novo\" da versão 2022 e cobre o ciclo de vida completo do serviço em nuvem: aquisição → uso → gestão → saída. Provas recentes adoram testar exatamente essa cobertura de ciclo de vida completo.", "resumo": "Nuvem segura cobre da contratação até a saída — não só o \"usar no dia a dia\"."}, "134": {"resposta_correta": "b) Controles e processos da segurança da informação, com métodos que produzam resultados válidos.", "justificativa": "A cláusula 9.1 exige que a organização determine o que precisa ser monitorado e medido, incluindo processos e controles de segurança da informação, os métodos de monitoramento, medição, análise e avaliação (assegurando resultados válidos), quando e por quem essas atividades devem ser realizadas, e quando os resultados devem ser analisados e avaliados. É um requisito abrangente de avaliação de desempenho, não restrito a uma única métrica isolada.", "analisa": "- a) O \"número de acessos diários\" é apenas um exemplo pontual de métrica possível, mas não representa a abrangência exigida pela cláusula 9.1, que trata do monitoramento sistemático de controles e processos do SGSI como um todo.\n- c) Feedback de usabilidade dos funcionários pode ser um insumo pontual, mas não é o foco da cláusula 9.1, que trata da eficácia dos controles e processos de segurança da informação, com métodos que assegurem validade dos resultados obtidos.", "dica": "Grave os elementos da cláusula 9.1: o quê monitorar/medir, métodos (com validade garantida), quando, quem, e quando analisar/avaliar os resultados — é basicamente um \"5W\" aplicado à avaliação de desempenho.", "resumo": "9.1 não é sobre uma métrica isolada — é sobre um sistema de monitoramento e medição de todo o SGSI."}, "135": {"resposta_correta": "b) Assegurar que a análise seja realizada por pessoal qualificado e que as decisões possam ser tomadas com base em informações precisas.", "justificativa": "A cláusula 9.1 f) exige que a organização determine quem deve analisar e avaliar os resultados do monitoramento e da medição. O propósito de definir claramente esse papel é assegurar que a interpretação dos dados seja feita por pessoas com competência adequada (ligação com a cláusula 7.2), gerando conclusões confiáveis que suportem decisões de gestão de riscos, ações corretivas e melhoria contínua com base em informações precisas e bem fundamentadas.", "analisa": "- a) A norma não exige que a responsabilidade recaia sobre \"um único indivíduo\" nem dispensa a necessidade de qualificação — pelo contrário, o propósito é assegurar competência adequada de quem analisa, podendo envolver mais de uma pessoa ou função.\n- c) A cláusula 9.1 f) trata de quem realiza a análise dos resultados, não de restrição de acesso aos dados brutos de monitoramento — controle de acesso à informação é tratado por outros controles (por exemplo, do tema Tecnológico do Anexo A), não pela definição de responsáveis pela análise de desempenho.", "dica": "Sempre que a norma perguntar \"quem\" em uma cláusula de gestão, a resposta correta normalmente remete a competência e clareza de papéis/responsabilidades — não a restrição de acesso ou centralização arbitrária em uma única pessoa.", "resumo": "Definir \"quem analisa\" garante que os dados virem decisão confiável, não só números soltos."}, "136": {"resposta_correta": "b) Se o SGSI está em conformidade com os próprios requisitos da organização e os da norma, e se está efetivamente implementado e mantido.", "justificativa": "A cláusula 9.2.1 estabelece que a organização deve conduzir auditorias internas a intervalos planejados para prover informação sobre se o SGSI está em conformidade com os requisitos da própria organização para o seu SGSI e com os requisitos da ISO/IEC 27001:2022, e se está efetivamente implementado e mantido. A auditoria interna é, portanto, um mecanismo de verificação dupla: conformidade normativa (a norma) e conformidade interna (o que a própria organização definiu para si).", "analisa": "- a) A auditoria interna do SGSI não se limita a \"outras normas\" — seu foco é a própria ISO/IEC 27001 e os requisitos internos definidos pela organização para seu SGSI, não normas externas de terceiros.\n- c) Habilidades de negociação não são objeto de avaliação da auditoria interna do SGSI — o foco é a conformidade e eficácia do sistema de gestão, embora a cláusula 9.2.2 trate de competência e objetividade dos auditores (não de negociação).", "dica": "Auditoria interna (9.2) sempre verifica dois níveis de conformidade: (1) requisitos próprios da organização (política, procedimentos internos) e (2) requisitos da norma ISO/IEC 27001 em si — memorize essa dualidade.", "resumo": "Auditoria interna checa se o SGSI cumpre a norma E cumpre o que a própria empresa prometeu fazer."}, "137": {"resposta_correta": "b) A objetividade e imparcialidade do processo de auditoria.", "justificativa": "A cláusula 9.2.2 b) exige que a organização selecione auditores e conduza auditorias que assegurem objetividade e a imparcialidade do processo de auditoria. Isso normalmente é operacionalizado exigindo que o auditor não audite seu próprio trabalho (independência funcional), garantindo uma avaliação isenta e não viesada da conformidade e eficácia do SGSI.", "analisa": "- a) Permitir que responsáveis pelo próprio processo o auditem viola diretamente o princípio de imparcialidade exigido pela cláusula — auditar o próprio trabalho compromete a objetividade da avaliação, um erro clássico de auditoria interna.\n- c) A norma não define uma regra de \"treinamento único sem atualização\" — pelo contrário, a manutenção de competência de auditores (relacionada à cláusula 7.2) é um processo contínuo, especialmente considerando que normas e riscos evoluem ao longo do tempo.", "dica": "\"Auditor não pode auditar seu próprio trabalho\" é uma regra de ouro em qualquer prova de auditoria (ISO 19011 e ISO 27001). Sempre que uma alternativa sugerir isso, é distrator certo.", "resumo": "Quem faz o processo não pode ser quem audita o mesmo processo — objetividade em primeiro lugar."}, "138": {"resposta_correta": "b) Situação das ações anteriores, mudanças no contexto, feedback de desempenho (não conformidades, monitoramento, auditorias, objetivos), avaliação de riscos e oportunidades de melhoria.", "justificativa": "A cláusula 9.3.2 lista as entradas que a análise crítica pela Direção deve considerar: situação de ações provenientes de análises críticas anteriores; mudanças em questões internas e externas relevantes ao SGSI; mudanças nas necessidades e expectativas das partes interessadas; feedback sobre o desempenho da segurança da informação (não conformidades e ações corretivas, resultados de monitoramento e medição, resultados de auditoria, cumprimento dos objetivos); feedback de partes interessadas; resultados da avaliação de riscos e situação do plano de tratamento de riscos; e oportunidades de melhoria contínua. É um conjunto amplo e multidimensional de entradas.", "analisa": "- a) Restringir a \"apenas orçamento de TI\" ignora completamente o rol amplo de entradas exigidas pela cláusula 9.3.2, que abrange desde contexto organizacional até desempenho de segurança e riscos.\n- c) Focar exclusivamente em relatórios de incidentes, sem considerar proatividade, deixa de fora elementos essenciais como mudanças de contexto, feedback de auditoria, cumprimento de objetivos e oportunidades de melhoria — a análise crítica é deliberadamente ampla, não reativa a incidentes apenas.", "dica": "A cláusula 9.3.2 (entradas da análise crítica) é extensa e cobrada literalmente em provas — memorize a lógica: \"o que mudou\" (contexto, partes interessadas) + \"como estamos indo\" (desempenho, riscos, auditorias) + \"o que aprendemos antes\" (ações anteriores) + \"para onde podemos melhorar\" (oportunidades).", "resumo": "Análise crítica junta passado (ações antigas), presente (desempenho e riscos) e futuro (oportunidades de melhoria) — não é sobre TI ou incidentes isoladamente."}, "139": {"resposta_correta": "b) Oportunidades para melhoria contínua e quaisquer necessidades de mudanças do SGSI.", "justificativa": "A cláusula 9.3.3 estabelece que os resultados (saídas) da análise crítica pela Direção devem incluir decisões relacionadas a oportunidades de melhoria contínua e a quaisquer necessidades de mudança no SGSI. Essas saídas são, tipicamente, registradas como informação documentada e alimentam o ciclo de melhoria contínua (cláusula 10), fechando o círculo do PDCA no nível estratégico da organização.", "analisa": "- a) Decisões sobre contratações não são o foco definido pela norma para as saídas da análise crítica — o foco é estritamente sobre a melhoria contínua e mudanças necessárias no SGSI, ainda que isso possa eventualmente implicar decisões de recursos.\n- c) Se a análise crítica é conduzida corretamente, é esperado que gere pelo menos uma reflexão sobre oportunidades de melhoria ou necessidades de mudança — uma saída de \"nenhuma alteração, sempre\" ao longo do tempo é atipicamente estática e contraria o espírito de melhoria contínua da norma (cláusula 10.1).", "dica": "Associe sempre as saídas da análise crítica (9.3.3) à cláusula 10 (Melhoria) — a análise crítica é o \"gatilho formal de alto nível\" que decide sobre mudanças e melhorias no SGSI.", "resumo": "Toda análise crítica termina em decisão: melhorar algo ou mudar algo — nunca é só \"reunião pela reunião\"."}, "140": {"resposta_correta": "b) Produza, armazene, proteja e analise logs que registrem atividades, exceções, falhas e outros eventos relevantes.", "justificativa": "O controle 8.15 exige que logs que registrem atividades, exceções, falhas e outros eventos relevantes sejam produzidos, armazenados, protegidos e analisados. Isso proporciona rastreabilidade de eventos de segurança, é essencial para investigação de incidentes, detecção de comportamentos anômalos e conformidade regulatória — e a proteção dos próprios logs contra alteração ou exclusão indevida é parte fundamental do controle (evitando que um invasor apague seus rastros).", "analisa": "- a) Restringir o registro apenas a \"erros graves\" é insuficiente — o controle exige o registro amplo de atividades, exceções, falhas e outros eventos relevantes, não apenas os mais críticos, para permitir análise abrangente e correlação de eventos.\n- c) Apagar logs regularmente contraria diretamente o propósito do controle, que exige armazenamento e proteção dos logs por período apropriado — a exclusão precoce compromete investigações forenses e a capacidade de detecção retroativa de incidentes.", "dica": "O controle 8.15 sempre remete aos quatro verbos: produzir, armazenar, proteger e analisar logs — e frequentemente é cobrado junto ao 8.16 (monitoramento), pois logs sem análise/monitoramento têm valor limitado.", "resumo": "Log tem que existir, ser guardado, ser protegido contra adulteração e, principalmente, ser analisado."}, "141": {"resposta_correta": "b) Redes, sistemas e aplicações por comportamentos anômalos e tome ações apropriadas para avaliar possíveis incidentes de segurança da informação.", "justificativa": "O controle 8.16 exige que redes, sistemas e aplicações sejam monitorados quanto a comportamentos anômalos, e que ações apropriadas sejam tomadas para avaliar potenciais incidentes de segurança da informação. Esse monitoramento contínuo (muitas vezes com ferramentas de SIEM, IDS/IPS) é o que permite detecção precoce de atividades suspeitas, complementando o registro de logs (8.15) com a análise ativa em tempo real ou quase real.", "analisa": "- a) Restringir o monitoramento à \"performance dos usuários\" desvia do propósito de segurança do controle, que é detectar comportamentos anômalos que possam indicar incidentes, não avaliar produtividade individual.\n- c) Consumo de energia dos equipamentos é uma métrica operacional/de infraestrutura, sem relação com o propósito de detecção de incidentes de segurança que o controle 8.16 estabelece.", "dica": "Distinga 8.15 (log = registrar o que aconteceu) de 8.16 (monitoramento = observar ativamente em busca de anomalias e agir). Um é o \"arquivo\", o outro é a \"vigilância ativa\".", "resumo": "Monitoramento é vigilância ativa por anomalias — não é medir produtividade nem energia."}, "142": {"resposta_correta": "b) Para demonstrar que as atividades de avaliação foram realizadas, os resultados obtidos e as conclusões tiradas, apoiando a tomada de decisões e a melhoria.", "justificativa": "A cláusula 9.1 exige que a organização retenha informação documentada apropriada como evidência dos resultados de monitoramento e medição. Essa evidência serve tanto para auditoria (comprovar que a avaliação de desempenho realmente ocorreu) quanto para uso gerencial prático: dar suporte a decisões informadas de gestão de riscos, ações corretivas (cláusula 10.2) e à própria análise crítica pela Direção (cláusula 9.3), fechando o ciclo de avaliação de desempenho com propósito real, não apenas burocrático.", "analisa": "- a) A documentação não é \"arquivamento sem uso prático\" — ela serve ativamente à tomada de decisões, à identificação de tendências e à melhoria contínua, sendo insumo direto para outras cláusulas (9.3, 10).\n- c) A retenção de evidências tem o efeito oposto de \"ignorar sem rastreabilidade\": ela justamente cria rastreabilidade e transparência sobre os resultados, inclusive os desfavoráveis, forçando que sejam tratados (e não escondidos).", "dica": "Documentação na ISO 27001 nunca é \"burocracia pela burocracia\" — a prova sempre valoriza alternativas que conectam a documentação a um propósito prático (rastreabilidade, evidência, apoio à decisão, melhoria).", "resumo": "Evidência documentada existe para ser usada na gestão, não para ficar guardada sem função."}, "143": {"resposta_correta": "a) Se o SGSI é relevante para o propósito da organização e seu contexto atual.", "justificativa": "A cláusula 9.3.1 exige que a Alta Direção analise criticamente o SGSI da organização, a intervalos planejados, para assegurar sua contínua pertinência, adequação e eficácia. \"Pertinência\" (relevância) refere-se a se o SGSI ainda faz sentido e continua alinhado ao propósito, ao contexto (interno e externo, ligado à cláusula 4.1) e às necessidades atuais da organização — que podem ter mudado desde a implementação original.", "analisa": "- b) Pertinência não trata de \"estado da arte tecnológico\" — um SGSI pode ser plenamente pertinente e eficaz usando tecnologias maduras e adequadas ao contexto, sem precisar ser o mais avançado do mercado.\n- c) Aderência orçamentária é uma questão de gestão financeira de projeto, não o conceito de pertinência do SGSI conforme definido pela norma, que se relaciona a relevância estratégica e contextual, não a controle de custos.", "dica": "A análise crítica avalia três dimensões clássicas do SGSI: pertinência (ainda faz sentido/é relevante?), adequação (é suficiente para o propósito?) e eficácia (está produzindo os resultados esperados?). Memorize esse trio — é cobrado com frequência.", "resumo": "Pertinência = \"isso ainda faz sentido para nós, hoje?\" — não é sobre tecnologia de ponta ou orçamento."}, "144": {"resposta_correta": "b) A pertinência, a adequação e a eficácia do sistema de gestão da segurança da informação.", "justificativa": "A cláusula 10.1 estabelece que a organização deve melhorar continuamente a pertinência, adequação e eficácia do SGSI — os mesmos três atributos avaliados na análise crítica (9.3.1). A melhoria contínua é o \"fechamento\" do ciclo PDCA: com base no que foi monitorado, auditado e analisado criticamente, a organização atua para tornar o sistema cada vez mais relevante, suficiente e eficaz ao longo do tempo.", "analisa": "- a) O número de funcionários dedicados à segurança pode ser um recurso ajustado conforme necessidade (cláusula 7.1), mas não é o foco definido pela cláusula 10.1, que trata da melhoria do sistema de gestão como um todo, não de headcount.\n- c) Resultados financeiros da organização não são o objeto da melhoria contínua exigida por 10.1 — o foco é estritamente sobre o SGSI (pertinência, adequação, eficácia), embora bons resultados de segurança possam ter efeitos financeiros indiretos positivos.", "dica": "Conecte sempre 9.3.1 (o que se avalia na análise crítica) com 10.1 (o que se melhora continuamente) — são os mesmos três conceitos: pertinência, adequação, eficácia.", "resumo": "10.1 fecha o ciclo: melhorar sempre pertinência, adequação e eficácia do SGSI — não headcount, não finanças da empresa."}, "145": {"resposta_correta": "b) Tomar ações para controlá-la e corrigi-la, e lidar com as consequências.", "justificativa": "A cláusula 10.2 a) exige que, ao ocorrer uma não conformidade, a organização reaja a ela, tomando ação para controlá-la e corrigi-la, e lidando com as consequências. Essa é a primeira etapa do tratamento de não conformidade, focada na contenção imediata do problema (correção), antes mesmo de investigar e eliminar a causa raiz (etapa tratada na alínea b, que leva à ação corretiva propriamente dita).", "analisa": "- a) A norma não permite ignorar não conformidades com base em \"ausência de impacto imediato\" — toda não conformidade identificada deve ser reagida (controlada e corrigida), independentemente da percepção inicial de gravidade, já que impactos podem não ser óbvios de imediato.\n- c) A responsabilidade pelo tratamento da não conformidade é da própria organização que opera o SGSI — não pode ser simplesmente transferida a terceiros, ainda que causas externas possam ter contribuído para o problema.", "dica": "Distinga \"correção\" (ação imediata para conter/corrigir o efeito, cláusula 10.2 a) de \"ação corretiva\" (eliminar a causa raiz para evitar recorrência, cláusula 10.2 b-d) — são conceitos e etapas diferentes, frequentemente confundidos em prova.", "resumo": "Primeiro contém e corrige o problema; depois (ação corretiva) elimina a causa raiz — são etapas distintas."}, "146": {"resposta_correta": "b) Avaliar a necessidade de ações para eliminar as causas da não conformidade, a fim de evitar sua repetição ou ocorrência em outro lugar.", "justificativa": "A cláusula 10.2 b) exige que a organização avalie a necessidade de ação para eliminar a(s) causa(s) da não conformidade, a fim de que ela não se repita ou ocorra em outro lugar, o que envolve analisar criticamente a não conformidade, determinar suas causas e determinar se não conformidades similares existem ou poderiam potencialmente ocorrer. Isso é o núcleo da abordagem de causa raiz — vai além do \"remendo\" imediato para tratar a origem do problema.", "analisa": "- a) Apenas documentar e arquivar sem investigar a causa raiz contraria a exigência explícita de avaliar a necessidade de ação corretiva sistêmica, deixando a organização vulnerável à recorrência do mesmo problema.\n- c) Restringir a comunicação apenas aos \"envolvidos diretos\" não atende ao propósito de investigar se não conformidades similares podem existir em outras partes da organização — a análise de causa raiz frequentemente exige colaboração mais ampla do que apenas os diretamente afetados.", "dica": "A frase \"evitar sua repetição ou ocorrência em outro lugar\" é quase literal da norma (10.2 b) — grife-a. Ela distingue ação corretiva (sistêmica, preventiva de recorrência) de simples correção (pontual).", "resumo": "Ação corretiva mira a causa raiz — para não acontecer de novo, nem em outro canto da empresa."}, "147": {"resposta_correta": "b) Para assegurar que as ações implementadas resolveram a não conformidade e foram eficazes em prevenir sua recorrência.", "justificativa": "A cláusula 10.2 d) exige que a organização analise criticamente a eficácia de quaisquer ações corretivas tomadas. Isso fecha o ciclo PDCA da não conformidade: não basta implementar uma ação corretiva — é preciso verificar, com base em evidências (por exemplo, monitoramento subsequente, ausência de recorrência), se ela de fato resolveu o problema e eliminou (ou reduziu suficientemente) a causa raiz identificada.", "analisa": "- a) A análise crítica de eficácia exige evidência de resultados práticos concretos — não é uma validação simbólica ou automática do trabalho realizado, sem comprovação real de que o problema foi resolvido.\n- c) O propósito da cláusula não é atribuir culpa ou responsabilização individual pela não conformidade original, mas sim verificar tecnicamente a eficácia da solução implementada — um enfoque de melhoria de sistema, não de punição de pessoas.", "dica": "\"Analisar eficácia\" sempre implica verificação baseada em evidência de que o problema foi realmente resolvido — desconfie de alternativas que tratam isso como formalidade simbólica ou como busca de culpados.", "resumo": "Ação corretiva só \"vale\" se comprovadamente funcionou — não basta ter sido implementada."}, "148": {"resposta_correta": "b) Fortalecer e melhorar os controles da segurança da informação.", "justificativa": "O controle 5.27 exige que o conhecimento obtido a partir de incidentes de segurança da informação seja usado para fortalecer e melhorar os controles de segurança da informação. Isso conecta diretamente a gestão de incidentes (controles 5.24 a 5.28) ao ciclo de melhoria contínua (cláusula 10) — cada incidente é uma oportunidade de aprendizado que retroalimenta a avaliação de riscos, o SoA e os próprios controles implementados, tornando o SGSI mais robusto ao longo do tempo.", "analisa": "- a) Excluir controles que falharam, sem investigação e melhoria, é o oposto do propósito do controle 5.27 — a falha de um controle geralmente indica necessidade de reforço ou ajuste, não de eliminação pura e simples.\n- c) O propósito do controle não é meramente cumprir uma formalidade de documentação para fins de seguro — é usar o aprendizado de forma ativa para fortalecer a postura de segurança da organização, com efeito prático sobre os controles futuros.", "dica": "5.27 é o \"elo\" entre gestão de incidentes e melhoria contínua — sempre que a prova mencionar \"lições aprendidas\" de incidente, pense em fortalecimento de controles, nunca em exclusão ou mera burocracia.", "resumo": "Incidente vira aprendizado; aprendizado vira controle mais forte — nunca vira desculpa para remover proteção."}, "149": {"resposta_correta": "b) Para fornecer evidências da aplicação do ciclo de melhoria contínua e facilitar a análise para futuras otimizações.", "justificativa": "A cláusula 10.2 exige reter informação documentada como evidência da natureza das não conformidades e quaisquer ações subsequentes tomadas, e dos resultados de qualquer ação corretiva. Essa documentação sustenta a rastreabilidade do processo de melhoria, permite identificar padrões e tendências de não conformidades ao longo do tempo (insumo valioso para futuras análises críticas e avaliações de risco) e comprova, de forma auditável, que o ciclo \"identificar → corrigir → analisar causa → verificar eficácia\" foi efetivamente seguido.", "analisa": "- a) Reduzir o propósito a \"apenas para auditoria, sem contribuir para melhoria real\" contraria a essência da exigência, que é justamente alimentar decisões futuras de melhoria com base em dados históricos confiáveis.\n- c) A documentação de não conformidades tem efeito de transparência e rastreabilidade, não de ocultação — pelo contrário, ela impede que problemas sejam \"varridos para debaixo do tapete\", pois ficam registrados e sujeitos a análise crítica e auditoria.", "dica": "Toda exigência de \"reter informação documentada\" na cláusula 10.2 serve a um propósito duplo: evidência de conformidade processual E insumo de aprendizado organizacional — nunca é burocracia vazia ou instrumento de ocultação.", "resumo": "Registrar não conformidades é abrir os olhos para padrões — não é varrer problemas para debaixo do tapete."}, "150": {"resposta_correta": "b) Realizar mudanças no sistema de gestão da segurança da informação, quando necessário, para realinhar os processos.", "justificativa": "A cláusula 10.2 e) prevê que, como parte do tratamento de não conformidade, a organização faça mudanças no SGSI, se necessário, com base no resultado da análise de causa raiz e na avaliação de necessidade de ação. Isso reforça que a melhoria contínua não é apenas ajuste pontual de um controle isolado — pode implicar alterações mais amplas no próprio sistema de gestão (processos, políticas, estrutura) quando isso for necessário para restaurar o alinhamento com os objetivos do SGSI.", "analisa": "- a) Ignorar um desalinhamento identificado contraria diretamente o princípio de melhoria contínua (cláusula 10.1) e a exigência de reagir a não conformidades (10.2 a), deixando o problema sem tratamento.\n- c) \"Reestruturar completamente toda a organização\" é uma resposta desproporcional — a norma fala em fazer mudanças no SGSI quando necessário, de forma planejada (cláusula 6.3), não em uma reestruturação organizacional total e indiscriminada.", "dica": "Desalinhamento de processo não significa \"revolução total\" — a resposta correta é sempre proporcional: ajustar o SGSI (com planejamento, cláusula 6.3) até restaurar o alinhamento necessário.", "resumo": "Desalinhamento pede ajuste proporcional no SGSI, não reestruturação da empresa inteira."}, "151": {"resposta_correta": "b) A melhoria contínua visa garantir que o SGSI evolua para continuar a alcançar e otimizar os objetivos de segurança da informação.", "justificativa": "A cláusula 6.2 já prevê que os objetivos de segurança da informação devem ser monitorados e atualizados conforme apropriado, enquanto a cláusula 10.1 exige a melhoria contínua da pertinência, adequação e eficácia do SGSI. Essas duas cláusulas estão intrinsecamente conectadas: a melhoria contínua é o mecanismo pelo qual a organização garante que os objetivos continuem sendo alcançados de forma eficaz — e, quando necessário, revisados — à medida que o contexto, os riscos e as necessidades do negócio evoluem.", "analisa": "- a) Tratar melhoria contínua e objetivos como \"processos separados sem relação direta\" ignora a interdependência estrutural entre planejamento (cláusula 6, que define objetivos) e melhoria (cláusula 10, que os mantém relevantes e evolutivos) dentro do ciclo PDCA do Anexo SL.\n- c) A cláusula 6.2 g) explicitamente exige que os objetivos sejam monitorados e atualizados, o que contraria a ideia de que sejam \"definidos apenas uma vez\" e permaneçam estáticos e imunes à melhoria contínua.", "dica": "Cláusulas do Anexo SL nunca são \"ilhas\" isoladas — planejar (6), operar (8), avaliar (9) e melhorar (10) formam um ciclo interligado (PDCA). Questões que testam \"relação entre cláusulas\" quase sempre esperam reconhecimento dessa interdependência.", "resumo": "Objetivos não são estátuas: a melhoria contínua os mantém vivos, relevantes e sempre otimizados."}, "152": {"resposta_correta": "b) A relevância e adequação do SGSI aos propósitos e contexto da organização.", "justificativa": "Como já estabelecido na cláusula 9.3.1, \"pertinência\" refere-se a quão relevante e apropriado o SGSI continua sendo para o propósito e o contexto (interno e externo) da organização. A cláusula 10.1 exige que a organização melhore continuamente essa pertinência (além de adequação e eficácia), o que significa reavaliar e ajustar o SGSI à medida que a organização, seu mercado, sua tecnologia e seus riscos evoluem — mantendo o sistema sempre \"fazendo sentido\" para a realidade atual do negócio.", "analisa": "- a) Velocidade de execução dos processos é um atributo possível de eficiência operacional, mas não é o que a norma define como \"pertinência\" — pertinência trata de relevância/adequação ao contexto, não de velocidade.\n- c) O número de pessoas envolvidas na gestão do SGSI é um recurso (cláusula 7.1), não uma medida de pertinência do sistema — um SGSI pode ser plenamente pertinente com uma equipe enxuta, ou irrelevante mesmo com muitas pessoas envolvidas.", "dica": "Reforce a associação: pertinência = relevância ao contexto/propósito (não velocidade, não headcount, não tecnologia de ponta) — esse conceito aparece em várias questões do simulado sob diferentes formulações.", "resumo": "Pertinência é sobre \"fazer sentido para o contexto atual\", não sobre rapidez ou quantidade de gente envolvida."}, "153": {"resposta_correta": "b) Que a política é apropriada ao propósito da organização, documentada, comunicada e inclui o comprometimento com a melhoria contínua.", "justificativa": "Em auditoria de certificação, o auditor verifica o cumprimento literal dos requisitos da cláusula 5.2: a política deve ser apropriada ao propósito da organização; incluir objetivos de segurança da informação (ou fornecer a estrutura para estabelecê-los); incluir comprometimento em satisfazer requisitos aplicáveis; incluir comprometimento com a melhoria contínua do SGSI; estar disponível como informação documentada; ser comunicada dentro da organização; e estar disponível para partes interessadas, conforme apropriado. É essa combinação de atributos que o auditor buscará como evidência de conformidade.", "analisa": "- a) A autoria da política (interna ou por consultor externo) não é requisito de conformidade da norma — o que importa é o conteúdo e a aderência aos requisitos da cláusula 5.2, não quem a redigiu.\n- c) Complexidade e detalhamento excessivo não são critérios de conformidade — pelo contrário, a política deve ser apropriada ao propósito da organização, o que geralmente favorece objetividade e clareza, não complexidade desnecessária.", "dica": "Em qualquer cenário de \"preparação para auditoria de certificação\", a resposta correta tende a listar exatamente os elementos literais exigidos pela cláusula em questão — a prova está testando se você memorizou os requisitos, não interpretações vagas.", "resumo": "Auditor de certificação confere aderência literal à cláusula — não estilo de redação nem quem escreveu."}, "154": {"resposta_correta": "b) Serve como evidência de que a organização garante que seu pessoal é qualificado para as tarefas relacionadas à segurança da informação.", "justificativa": "A cláusula 7.2 exige explicitamente que informação documentada apropriada seja retida como evidência de competência. Em auditoria, essa evidência (certificados, registros de treinamento, currículos, avaliações de desempenho) é o que permite ao auditor verificar objetivamente que a organização cumpriu seu compromisso de assegurar pessoal competente para funções que afetam o desempenho da segurança da informação — sem essa evidência, a afirmação de competência seria apenas uma alegação não verificável.", "analisa": "- a) Auditores de certificação não \"ignoram\" esse requisito — pelo contrário, evidência de competência é um dos itens mais frequentemente verificados em auditorias, já que pessoas despreparadas são uma das principais causas de falhas de segurança.\n- c) A informação documentada sobre competência não tem qualquer relação com comparação salarial de mercado — isso seria uma questão de gestão de recursos humanos e remuneração, totalmente fora do escopo do requisito de competência da ISO 27001.", "dica": "Sempre que a prova falar em \"evidência para auditoria\", lembre que a ISO 27001 exige documentação como prova objetiva e verificável — nunca uma alegação vaga desprovida de registro.", "resumo": "Sem registro de competência, para o auditor, a competência \"não existe\" — é preciso provar, não apenas afirmar."}, "155": {"resposta_correta": "b) Evidências de que as avaliações foram realizadas conforme os critérios estabelecidos, os riscos identificados, analisados, avaliados e seus resultados documentados.", "justificativa": "A cláusula 8.2 exige que a organização retenha informação documentada dos resultados das avaliações de riscos de segurança da informação. Em auditoria, o auditor busca evidência de que o processo definido em 6.1.2 (identificação, análise e avaliação de riscos, com critérios consistentes) foi de fato aplicado na prática operacional — ou seja, que a metodologia definida não ficou apenas no papel, mas foi efetivamente executada, com riscos identificados, analisados quanto a probabilidade/impacto, avaliados contra os critérios de aceitação, e formalmente registrados.", "analisa": "- a) Uma simples lista de riscos, sem análise ou tratamento, não atende ao processo completo exigido pela cláusula 6.1.2/8.2, que envolve identificação, análise, avaliação e — subsequentemente — tratamento (6.1.3/8.3) dos riscos.\n- c) Um resumo apenas dos riscos \"mais importantes\" pode omitir evidências de completude do processo — a norma exige documentação dos resultados da avaliação de riscos como um todo, de forma rastreável e auditável, não um recorte seletivo e informal.", "dica": "Em cenários de \"preparação para auditoria\", a resposta correta quase sempre enfatiza evidência completa e rastreável do processo formal (identificação → análise → avaliação → documentação), nunca versões resumidas, informais ou parciais.", "resumo": "Auditor quer ver o processo de risco completo documentado — não uma lista solta nem um resumo seletivo."}, "156": {"resposta_correta": "b) Informação documentada dos resultados da análise crítica, incluindo decisões sobre oportunidades de melhoria e necessidades de mudanças no SGSI.", "justificativa": "A cláusula 9.3.3 exige que a organização retenha informação documentada como evidência dos resultados das análises críticas pela Direção. O auditor buscará essa evidência formal (atas, registros de decisão) que demonstre que as entradas previstas em 9.3.2 foram efetivamente consideradas e que decisões concretas sobre melhoria contínua e necessidades de mudança do SGSI foram tomadas pela Alta Direção — não apenas que uma reunião ocorreu.", "analisa": "- a) A mera presença física da Alta Direção na reunião, sem registro formal do conteúdo discutido e das decisões tomadas, não constitui evidência suficiente de conformidade com a cláusula 9.3 — presença sem documentação não é auditável.\n- c) Um plano de ação apresentado antes da análise crítica ter de fato ocorrido não é evidência válida de conformidade — a norma exige que a análise crítica seja realizada (a intervalos planejados) e documentada, e não pode ser \"simulada\" a posteriori ou substituída por um plano genérico e antecipado.", "dica": "Auditores buscam sempre registro documentado real das saídas (decisões) da análise crítica, não apenas evidência de que uma reunião aconteceu ou de intenções futuras não fundamentadas em análise real.", "resumo": "Não basta a reunião acontecer — precisa haver registro das decisões tomadas nela."}, "157": {"resposta_correta": "b) Através da análise de resultados de monitoramento, auditorias, ações corretivas e análises críticas da Direção, mostrando um ciclo de aprimoramento.", "justificativa": "A melhor evidência de melhoria contínua não é uma promessa isolada, mas a demonstração de um ciclo vivo e recorrente: resultados de monitoramento e medição (9.1) alimentando auditorias internas (9.2) e análises críticas pela Direção (9.3), que geram ações corretivas (10.2) e decisões de melhoria, que por sua vez são novamente monitoradas — evidenciando, na prática, que o PDCA está em funcionamento contínuo e gerando evolução real e mensurável do SGSI ao longo do tempo.", "analisa": "- a) Um plano futuro, ainda não implementado, demonstra intenção, mas não evidencia que a melhoria contínua já está de fato ocorrendo — auditores buscam evidência de histórico e prática recorrente, não apenas promessas.\n- c) Uma declaração verbal, sem registro documentado e sem evidência de ações concretas realizadas, não constitui evidência objetiva de conformidade — auditorias de certificação exigem evidências verificáveis, não apenas discurso.", "dica": "\"Melhoria contínua\" comprovada = ciclo demonstrável ao longo do tempo (monitoramento → auditoria → análise crítica → ação corretiva → nova rodada), nunca uma promessa isolada ou declaração sem lastro documental.", "resumo": "Melhoria contínua se prova com histórico de ciclo funcionando, não com discurso ou plano futuro isolado."}, "158": {"resposta_correta": "b) Porque o auditor precisa ter certeza de que a segurança da informação é mantida mesmo em serviços externos.", "justificativa": "Como já discutido na questão 52 (mesma cláusula 8.1), a responsabilidade pela segurança da informação de processos terceirizados relevantes permanece com a organização certificada, que deve demonstrá-la controlando esses processos externos. Em auditoria, isso é fundamental porque um SGSI só é verdadeiramente eficaz se cobrir toda a cadeia relevante de tratamento da informação, incluindo pontos operados por terceiros — uma falha de segurança em um fornecedor crítico pode comprometer diretamente os ativos protegidos pelo SGSI certificado.", "analisa": "- a) A transferência de responsabilidade ao terceiro é uma ideia equivocada: a cláusula 8.1 exige que a própria organização assegure o controle desses processos, mantendo sua responsabilidade e accountability, independentemente de quem executa a atividade.\n- c) Exigir apenas a posse de uma certificação ISO 27001 pelo terceiro é insuficiente — a organização deve efetivamente controlar (via contratos, SLAs, auditorias, monitoramento) o processo terceirizado relevante, o que vai além de verificar um certificado formal do fornecedor.", "dica": "Esta questão reforça (em contexto de auditoria) o mesmo princípio da Q52: certificação do fornecedor ajuda, mas não substitui o controle ativo e a responsabilidade contínua da organização contratante sobre processos terceirizados relevantes ao SGSI.", "resumo": "Certificado do fornecedor é bom sinal, mas não dispensa controle e responsabilidade ativa da organização contratante."}, "159": {"resposta_correta": "b) O gerenciamento do ciclo de vida completo das identidades, desde sua criação até a desativação.", "justificativa": "O controle 5.16 exige que o ciclo de vida completo das identidades seja gerenciado, cobrindo desde a criação (provisionamento) até a desativação final (desprovisionamento), passando por manutenção e alterações ao longo do tempo (mudanças de cargo, função, status de contratação). Uma gestão de identidade robusta é pré-requisito para o controle de acesso eficaz (ligado diretamente ao controle 5.18, direitos de acesso).", "analisa": "- a) Criar uma identidade nova \"para cada novo projeto\" não reflete o conceito de gestão de identidade — o ideal é gerenciar identidades de forma centralizada e vinculada à pessoa/entidade, evitando multiplicação desnecessária e descontrolada de identidades para a mesma pessoa.\n- c) Permitir que usuários gerenciem suas próprias identidades \"de forma autônoma\", sem governança central, contraria o propósito do controle, que exige gestão formal e controlada do ciclo de vida das identidades pela organização, não autogestão sem supervisão.", "dica": "5.16 (gestão de identidade) é o \"quem é você no sistema\" — enquanto 5.18 (direitos de acesso) é o \"o que você pode fazer\" — os dois controles trabalham juntos no ciclo de vida do acesso (identidade → autorização → revisão → revogação).", "resumo": "Gestão de identidade cobre do \"nascimento\" ao \"fim de vida\" de cada identidade no sistema — não é criar identidade nova a cada projeto."}, "160": {"resposta_correta": "b) Provisionar, analisar criticamente, modificar e remover os direitos de acesso de acordo com as políticas e regras da organização.", "justificativa": "O controle 5.18 exige que direitos de acesso a informações e outros ativos associados sejam provisionados, analisados criticamente, modificados e removidos de acordo com a política específica do tópico da organização e as regras para controle de acesso. Isso implica um ciclo de gestão ativo: concessão inicial baseada em necessidade real (need-to-know/need-to-use), revisões periódicas (para detectar acessos excessivos ou obsoletos) e revogação tempestiva quando o acesso deixa de ser necessário (por exemplo, mudança de função ou desligamento).", "analisa": "- a) Conceder acesso amplo \"por padrão\" viola o princípio do menor privilégio, um dos pilares de controle de acesso da norma — o correto é conceder o mínimo necessário e ampliar apenas mediante justificativa formal, nunca o inverso.\n- c) Documentar sem um processo ativo de análise crítica e revisão periódica é insuficiente — o controle exige explicitamente a análise crítica (revisão) e a modificação/remoção de direitos ao longo do tempo, não apenas um registro estático.", "dica": "5.18 é regido pelo princípio do menor privilégio e por um ciclo de vida ativo do acesso: provisionar → revisar periodicamente → modificar → remover. Bancas adoram testar se você lembra da revisão periódica (muitas vezes esquecida na prática das organizações reais).", "resumo": "Direito de acesso não é \"para sempre\": é concedido, revisado, ajustado e removido conforme a necessidade real muda."}, "161": {"resposta_correta": "B) Estabelecer requisitos para implementar, manter e melhorar continuamente um SGSI", "justificativa": "A ISO/IEC 27001 é uma norma de requisitos (não uma norma de boas práticas apenas orientativa). Conforme sua cláusula 1 (Escopo), o objetivo central da norma é especificar os requisitos para estabelecer, implementar, manter e melhorar continuamente um Sistema de Gestão de Segurança da Informação (SGSI/ISMS) dentro do contexto da organização. É justamente por trazer 'requisitos' (shall statements) — e não apenas recomendações — que a ISO/IEC 27001 é uma norma certificável, diferente da ISO/IEC 27002, que é apenas um código de práticas.", "analisa": "- A) Certificar profissionais de segurança da informação — certificar profissionais (como Lead Implementer ou Lead Auditor) é atividade de organismos de certificação de pessoas (ex.: PECB), não o objetivo da norma ISO/IEC 27001 em si, que certifica sistemas de gestão de organizações, não indivíduos.\n- C) Definir controles técnicos obrigatórios para proteção de redes corporativas — a norma não define controles técnicos 'obrigatórios' de forma prescritiva; os controles do Anexo A são selecionados conforme o resultado da avaliação e do tratamento de riscos de cada organização, e podem inclusive ser excluídos (com justificativa) ou complementados por controles adicionais.", "dica": "", "resumo": "ISO/IEC 27001 = requisitos para o SGSI (estabelecer, implementar, manter, melhorar continuamente); não é uma lista de controles técnicos nem uma certificação de pessoas."}, "162": {"resposta_correta": "C) Garantia de que a informação é acessível quando necessária por entidades autorizadas", "justificativa": "Segundo a ISO/IEC 27000 (vocabulário), disponibilidade é a 'propriedade de estar acessível e utilizável sob demanda por uma entidade autorizada'. A questão descreve exatamente isso: garantir que a informação esteja acessível quando necessária para quem tem autorização de acesso — por exemplo, sistemas com alta disponibilidade, redundância e planos de continuidade de negócios sustentam esse princípio.", "analisa": "- A) Garantia de que a informação não é divulgada a pessoas não autorizadas — descreve confidencialidade (não divulgação a pessoas não autorizadas), não disponibilidade.\n- B) Propriedade de que a informação é completa e não foi modificada indevidamente — descreve integridade (completude e ausência de alteração indevida), não disponibilidade.", "dica": "", "resumo": "Disponibilidade = a informação está lá quando o usuário autorizado precisa dela."}, "163": {"resposta_correta": "A) ISO/IEC 27000", "justificativa": "A ISO/IEC 27000 é o documento 'guarda-chuva' da família 27000: fornece a visão geral, os princípios fundamentais do SGSI e, principalmente, o vocabulário (termos e definições) usado em todas as demais normas da família (27001, 27002, 27005 etc.). É por isso que ela é a referência normativa citada na própria ISO/IEC 27001 (cláusula 2 – Referência normativa).", "analisa": "- B) ISO/IEC 27002 — a ISO/IEC 27002 é o código de práticas com orientação de implementação para os controles de segurança da informação (o 'como fazer'), não o documento de vocabulário.\n- C) ISO/IEC 27005 — a ISO/IEC 27005 é a norma de diretrizes para gestão de riscos de segurança da informação, usada para apoiar a cláusula 6.1.2/6.1.3, mas não é o documento de termos e definições.", "dica": "", "resumo": "ISO/IEC 27000 é o dicionário da família — vocabulário e conceitos, não requisitos nem controles."}, "164": {"resposta_correta": "B) Integridade", "justificativa": "Integridade é a propriedade de exatidão e completude da informação — ou seja, garantir que os dados não foram alterados de forma não autorizada ou indevida. Quando transações financeiras são modificadas sem autorização, o que se rompe é exatamente essa garantia de exatidão dos dados, caracterizando uma violação de integridade.", "analisa": "- A) Disponibilidade — disponibilidade trata de acesso à informação quando necessário, e não da exatidão dos dados alterados; o cenário não descreve indisponibilidade do sistema.\n- C) Autenticidade — autenticidade refere-se à garantia de que uma entidade é de fato quem afirma ser (identidade da origem); embora relacionado, o problema central descrito — dado alterado sem autorização — é, por definição, uma quebra de integridade, o princípio mais específico e diretamente testado aqui.", "dica": "", "resumo": "Dado alterado sem permissão = quebra de integridade, não de disponibilidade nem de autenticidade."}, "165": {"resposta_correta": "C) Check", "justificativa": "O ciclo PDCA subjacente ao SGSI mapeia-se assim: Plan (planejar o SGSI, cláusulas 4-7), Do (implementar e operar, cláusula 8), Check (monitorar, medir, analisar e auditar, cláusulas 9.1 e 9.2) e Act (melhorar continuamente, cláusula 10). A realização de auditorias internas é uma atividade de verificação do desempenho do sistema, portanto pertence à fase Check.", "analisa": "- A) Plan — Plan corresponde ao planejamento do SGSI (contexto, escopo, avaliação e tratamento de riscos, objetivos), não à execução de auditorias.\n- B) Do — Do corresponde à implementação e operação dos controles e processos definidos no planejamento, não à verificação por meio de auditoria.", "dica": "", "resumo": "Auditoria interna é atividade de verificação (Check) — não de planejamento nem de execução."}, "166": {"resposta_correta": "B) Facilita a integração com outras normas ISO que adotam a mesma estrutura, como ISO 9001 e ISO 22301", "justificativa": "A ISO/IEC 27001:2022 segue a Estrutura de Alto Nível (HLS, do Anexo SL da ISO/IEC) — o mesmo esqueleto de cláusulas (4 a 10), termos comuns e requisitos estruturais usados por outras normas de sistema de gestão, como a ISO 9001 (qualidade) e a ISO 22301 (continuidade de negócios). Isso facilita significativamente a integração de sistemas de gestão múltiplos (um SGI — Sistema de Gestão Integrado), reduzindo duplicidade de documentação, auditorias e processos de gestão.", "analisa": "- A) Reduz o número de controles obrigatórios a serem implementados — a HLS não reduz o número de controles do Anexo A — ela padroniza a estrutura das cláusulas principais (4-10), não o conteúdo técnico específico de cada norma.\n- C) Elimina a necessidade de auditorias externas para certificação — a HLS não elimina a necessidade de auditorias externas de certificação; ela apenas harmoniza a estrutura documental e processual entre normas, facilitando auditorias integradas, mas não as dispensa.", "dica": "", "resumo": "HLS/Anexo SL = estrutura comum entre normas ISO de sistemas de gestão, feita para facilitar integração."}, "167": {"resposta_correta": "B) Conhecimento técnico especializado de um colaborador", "justificativa": "Um ativo de informação é qualquer coisa de valor para a organização relacionada ao processamento, armazenamento ou uso de informação. Ativos podem ser tangíveis (hardware, mídias) ou intangíveis (conhecimento, reputação, software, dados). O conhecimento técnico especializado de um colaborador é um ativo intangível clássico: tem valor, mas não possui forma física.", "analisa": "- A) Servidor de banco de dados — um servidor de banco de dados é um ativo físico/tangível de infraestrutura de TI (hardware), não intangível.\n- C) Cabo de rede do datacenter — um cabo de rede é um ativo físico de infraestrutura, claramente tangível.", "dica": "", "resumo": "Conhecimento e know-how das pessoas = ativo de informação intangível."}, "168": {"resposta_correta": "C) 3 anos", "justificativa": "O ciclo de certificação ISO/IEC 27001 segue o modelo padrão dos organismos de certificação acreditados: a certificação inicial é válida por 3 anos, período no qual são realizadas auditorias de manutenção (vigilância), normalmente anuais, para confirmar que o SGSI continua conforme e eficaz. Ao final do ciclo de 3 anos, é necessária uma auditoria de recertificação.", "analisa": "- A) 1 ano — 1 ano não é o período de validade do certificado — é, em geral, o intervalo típico entre auditorias de vigilância dentro do ciclo de 3 anos.\n- B) 2 anos — 2 anos não corresponde ao ciclo padrão de certificação adotado pelos organismos acreditados para a ISO/IEC 27001.", "dica": "", "resumo": "Certificação ISO 27001: ciclo de 3 anos, com vigilâncias anuais no meio do caminho."}, "169": {"resposta_correta": "B) O efeito da incerteza sobre os objetivos da segurança da informação", "justificativa": "A ISO/IEC 27000 (e a ISO 31000, referência para gestão de riscos) define risco como o 'efeito da incerteza sobre os objetivos'. Esse efeito pode ser positivo ou negativo, e é justamente essa incerteza em relação ao alcance dos objetivos de segurança da informação que a organização precisa gerenciar por meio da avaliação e do tratamento de riscos (cláusula 6.1.2 e 6.1.3).", "analisa": "- A) A probabilidade de uma ameaça se materializar independentemente de controles — isso descreve mais a probabilidade de uma ameaça se concretizar, um dos componentes do risco, mas não a definição completa de risco, que também envolve impacto e a noção de incerteza sobre objetivos, e não é independente de controles (controles justamente alteram a probabilidade/impacto).\n- C) O impacto financeiro direto de um incidente de segurança — isso descreve o impacto (consequência) de um incidente já materializado, e de forma restrita apenas ao aspecto financeiro — o risco é mais amplo, é uma projeção anterior ao incidente, e a norma não limita seus efeitos apenas a perdas financeiras.", "dica": "", "resumo": "Risco = efeito da incerteza sobre os objetivos (definição oficial ISO 31000/27000)."}, "170": {"resposta_correta": "B) Que uma entidade não pode negar ter realizado uma ação ou transação específica", "justificativa": "Não repúdio é a capacidade de provar a ocorrência de um evento ou ação e das entidades que a originaram, de modo que essa entidade não possa negar posteriormente tê-la realizado. É garantido tipicamente por mecanismos como assinaturas digitais, logs de auditoria e trilhas de evidência, sendo essencial em transações eletrônicas para responsabilização (accountability).", "analisa": "- A) Que a informação não pode ser interceptada em trânsito — isso descreve confidencialidade/proteção em trânsito (ex.: criptografia de canal), não não repúdio, que trata de prova de autoria/ação, não de interceptação.\n- C) Que apenas usuários autenticados podem acessar sistemas críticos — isso descreve controle de acesso/autenticação, um controle preventivo diferente; a autenticação verifica identidade no momento do acesso, enquanto o não repúdio comprova, a posteriori, que uma ação específica foi realizada por determinada entidade.", "dica": "", "resumo": "Não repúdio = a entidade não pode negar depois que fez algo — pense em assinatura digital."}, "171": {"resposta_correta": "A) Cláusula 4", "justificativa": "A cláusula 4 da ISO/IEC 27001:2022 ('Contexto da organização') exige que a organização determine questões internas e externas relevantes para seu propósito e que afetam sua capacidade de alcançar os resultados pretendidos do SGSI (4.1), além de identificar as partes interessadas e seus requisitos (4.2), o que serve de base para definir o escopo do SGSI (4.3).", "analisa": "- B) Cláusula 6 — a cláusula 6 trata de planejamento (riscos, oportunidades, objetivos de segurança da informação e planejamento de mudanças), não da análise do contexto organizacional.\n- C) Cláusula 9 — a cláusula 9 trata de avaliação de desempenho (monitoramento, auditoria interna, análise crítica pela Direção), etapa muito posterior à análise de contexto.", "dica": "", "resumo": "Cláusula 4 = Contexto da organização (partes interessadas, questões internas/externas, escopo)."}, "172": {"resposta_correta": "B) Fornecer estrutura para riscos e conformidade", "justificativa": "A política de segurança da informação, exigida pela cláusula 5.2, tem como objetivo principal fornecer uma estrutura (framework) para o estabelecimento dos objetivos de segurança da informação e demonstrar o comprometimento com o atendimento aos requisitos aplicáveis e com a melhoria contínua do SGSI. Ela é, portanto, o documento de mais alto nível que orienta toda a gestão de riscos e conformidade.", "analisa": "- A) Definir papéis e responsabilidades — definir papéis e responsabilidades é objeto específico da cláusula 5.3, não o propósito central da política de segurança da informação em si.\n- C) Estabelecer metas mensuráveis — estabelecer metas mensuráveis é função dos objetivos de segurança da informação (cláusula 6.2), que devem ser consistentes com a política, mas não é o propósito principal da própria política.", "dica": "", "resumo": "A política de SI (5.2) dá a estrutura/direção; os objetivos (6.2) é que trazem as metas mensuráveis."}, "173": {"resposta_correta": "B) Para todos os que afetam o ISMS", "justificativa": "A cláusula 7.3 (Conscientização) exige que todas as pessoas que realizam trabalho sob o controle da organização — e não apenas gestores — estejam cientes da política de segurança da informação, de sua contribuição para a eficácia do SGSI e das implicações de não conformidade com os requisitos do SGSI. Isso inclui colaboradores, terceirizados e prestadores de serviço que tenham acesso a ativos de informação.", "analisa": "- A) Apenas para gerentes — restringir a conscientização apenas a gerentes contraria diretamente o texto da cláusula 7.3, que se aplica a todas as pessoas que afetam o SGSI.\n- C) Somente em treinamentos anuais — a norma não limita a conscientização a 'treinamentos anuais'; ela deve ser contínua e apropriada às funções, podendo (e devendo) ocorrer com frequência maior que anual conforme o risco e a rotatividade de pessoal.", "dica": "", "resumo": "Conscientização (7.3) é para todos que afetam o SGSI, não só para gestores."}, "174": {"resposta_correta": "B) Escopo do ISMS", "justificativa": "Embora a ISO/IEC 27001:2022 não exija mais uma lista fixa de 'procedimentos documentados obrigatórios' como na versão 2005, a cláusula 4.3 exige explicitamente que o escopo do SGSI esteja disponível como informação documentada. O escopo, portanto, é um exemplo claro e obrigatório de informação documentada exigida pela própria norma.", "analisa": "- A) Atas de reuniões informais da equipe de TI, sem necessidade de retenção formal — uma ata classificada como \"informal\" e sem exigência de retenção não constitui informação documentada controlada; a cláusula 7.5 trata justamente de documentos que precisam ser identificados, controlados e retidos
