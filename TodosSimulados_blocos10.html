<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISO/IEC 27001 Lead Implementer Simulator — Todos os Simulados</title>
    <style>
      :root{
        --bg:#eef1f5; --card:#ffffff; --ink:#1f2937; --muted:#6b7280;
        --border:#e2e5eb; --primary:#2b3a8f; --primary-2:#3b4db8;
        --good:#15803d; --good-bg:#dcfce7; --bad:#b91c1c; --bad-bg:#fee2e2;
        --accent:#2b3a8f; --submit:#1a8a4a; --submit-2:#157a40;
      }
      *{box-sizing:border-box}
      body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
      .shell{max-width:1080px;margin:0 auto;padding:16px 16px 60px}
      .topbar{background:#fff;border:1px solid var(--border);border-radius:12px 12px 0 0;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
      .topbar .examname{font-weight:700}
      .topbar .examname span{color:var(--primary)}
      .loggedas{background:#fde68a;padding:3px 10px;border-radius:6px;font-size:.82rem;font-weight:700}
      .toolbar{background:#fff;border-left:1px solid var(--border);border-right:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
      .navbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center}
      .navbtn:disabled{opacity:.4;cursor:not-allowed}
      .qcounter{font-weight:700;font-size:1.02rem;margin-right:6px}
      .bookmarkbtn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 14px;font-size:.88rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
      .bookmarkbtn.active{background:#fef3c7;border-color:#f59e0b;color:#92400e}
      .spacer{flex:1}
      .timer{font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:6px}
      .timer.low{color:var(--bad)}
      .timer.ok{color:#374151}
      .pausebtn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:9px 14px;font-size:.88rem;font-weight:600;cursor:pointer}
      .submitbtn{background:var(--submit);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:.9rem;font-weight:700;cursor:pointer}
      .submitbtn:hover{background:var(--submit-2)}
      .filterbar{background:#fff;border-left:1px solid var(--border);border-right:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:16px;font-size:.9rem}
      .filterbar label{display:flex;align-items:center;gap:5px;cursor:pointer}
      .gridwrap{background:#fff;border-left:1px solid var(--border);border-right:1px solid var(--border);padding:14px 20px;max-height:150px;overflow-y:auto}
      .grid{display:flex;flex-wrap:wrap;gap:8px}
      .gridnum{width:42px;height:34px;border-radius:6px;border:1px solid var(--border);background:#fff;font-size:.85rem;font-weight:700;cursor:pointer;color:var(--ink);position:relative}
      .gridnum.current{background:var(--primary);color:#fff;border-color:var(--primary)}
      .gridnum.answered:not(.current){background:#e7ebfd;border-color:#c7d0f5}
      .gridnum.locked{opacity:.35;cursor:not-allowed;background:#f3f4f6}
      .gridnum.bookmarked::after{content:'';position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:#f59e0b}
      .main{background:#fff;border:1px solid var(--border);border-top:none;border-radius:0 0 12px 12px;padding:24px 20px 20px}
      .qtext{font-weight:700;font-size:1.05rem;margin-bottom:18px}
      .opt{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px;cursor:pointer}
      .opt:hover{border-color:var(--accent)}
      .opt.answered{background:#eef1ff;border-color:var(--primary)}
      .opt input{margin-top:3px;flex-shrink:0}
      .footer-actions{margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
      .btn{display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:12px 22px;font-size:1rem;font-weight:600;cursor:pointer}
      .btn:hover{background:var(--primary-2)}
      .btn:disabled{background:#9ca3af;cursor:not-allowed}
      .btn.secondary{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
      .btn.secondary:hover{background:#eef2f7}
      .btn.gray{background:#f3f4f6;color:#374151;border:1px solid var(--border)}
      .btn.gray:hover{background:#e5e7eb}
      .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
      h1{font-size:1.4rem;margin:0 0 4px}
      .sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
      .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0 22px}
      .stat-box{border:1px solid var(--border);border-radius:12px;padding:16px}
      .stat-box .num{font-size:1.8rem;font-weight:700}
      .stat-box .label{color:var(--muted);font-size:.85rem}
      .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:700}
      .pill.good{background:var(--good-bg);color:var(--good)}
      .pill.bad{background:var(--bad-bg);color:var(--bad)}
      .review-list{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
      .review-chip{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:#fff}
      .review-chip.ok{background:var(--good)}
      .review-chip.no{background:var(--bad)}
      .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
      .bar-label{width:250px;flex-shrink:0;font-size:.85rem;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .bar-track{flex:1;height:16px;background:var(--border);border-radius:999px;overflow:hidden}
      .bar-fill{height:100%;border-radius:999px}
      .bar-pct{width:110px;flex-shrink:0;font-size:.82rem;color:var(--muted);text-align:right}
      .section-title{font-size:.95rem;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.03em;margin:22px 0 10px}
      ul.plain{margin:0;padding-left:0;list-style:none}
      ul.plain li{padding:8px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;font-size:.92rem}
      ul.plain li:last-child{border-bottom:none}
      .overlay-note{background:#eef1ff;border:1px solid #c7d0f5;color:#2b3a8f;border-radius:10px;padding:10px 14px;font-size:.85rem;margin-bottom:18px}
    </style>
  </head>
  <body>
    <div class="shell">
      <div id="app"></div>
    </div>
    <script type="application/json" id="questions-data">[{"id": 1, "text": "1. Qual é a primeira ação que a InovaTech deve tomar para entender seu contexto, de acordo com a ISO 27001:2022?", "options": [{"id": "a", "text": "a) Realizar uma auditoria interna completa dos sistemas de TI."}, {"id": "b", "text": "b) Determinar as questões internas e externas relevantes para seu propósito e que afetam sua capacidade de alcançar os resultados pretendidos do SGSI."}, {"id": "c", "text": "c) Contratar um profissional de segurança da informação sênior para gerenciar todos os aspectos."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 2, "text": "2. Além de clientes e funcionários, quais outros grupos a DataSecure Corp deve considerar ao determinar as necessidades e expectativas das partes interessadas, conforme a norma?", "options": [{"id": "a", "text": "a) Apenas acionistas e concorrentes diretos."}, {"id": "b", "text": "b) Apenas fornecedores e reguladores."}, {"id": "c", "text": "c) Qualquer parte que possa ser afetada ou que possa afetar o SGSI, incluindo requisitos legais e regulamentares."}], "correct_option": "c", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 3, "text": "3. Ao determinar o escopo do SGSI, o que a GlobalConnect deve considerar, de acordo com a ISO 27001:2022?", "options": [{"id": "a", "text": "a) Apenas as tecnologias de segurança da informação que serão implementadas."}, {"id": "b", "text": "b) As questões internas e externas, os requisitos das partes interessadas, e as interfaces e dependências entre as atividades."}, {"id": "c", "text": "c) Somente o custo de implementação e os benefícios financeiros esperados."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 4, "text": "4. Qual é uma das responsabilidades cruciais da Alta Direção da AlphaBank em relação ao SGSI, conforme a ISO 27001:2022?", "options": [{"id": "a", "text": "a) Apenas fornecer o orçamento para a equipe de TI."}, {"id": "b", "text": "b) Assegurar que a política de segurança da informação e os objetivos sejam estabelecidos e compatíveis com a direção estratégica da organização."}, {"id": "c", "text": "c) Realizar todas as avaliações de risco pessoalmente."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 5, "text": "5. O que a política de segurança da informação da TechSolutions deve incluir para estar em conformidade com a ISO 27001:2022?", "options": [{"id": "a", "text": "a) Apenas uma lista de softwares de segurança a serem utilizados."}, {"id": "b", "text": "b) Os objetivos de segurança da informação ou a estrutura para estabelecê-los, e o comprometimento com a melhoria contínua."}, {"id": "c", "text": "c) Uma descrição detalhada de cada incidente de segurança ocorrido nos últimos cinco anos."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 6, "text": "6. O que a Alta Direção da SecureLogistics deve fazer em relação aos papéis, responsabilidades e autoridades organizacionais para a segurança da informação?", "options": [{"id": "a", "text": "a) Manter as responsabilidades em segredo para evitar sobrecarga de informações."}, {"id": "b", "text": "b) Assegurar que as responsabilidades e autoridades dos papéis relevantes para a segurança da informação sejam atribuídas e comunicadas dentro da organização."}, {"id": "c", "text": "c) Contratar consultores externos para assumir todas as responsabilidades."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 7, "text": "7. Ao planejar ações para abordar riscos e oportunidades, qual é o objetivo da CyberDefenders, de acordo com a ISO 27001:2022?", "options": [{"id": "a", "text": "a) Apenas cumprir os requisitos legais mínimos."}, {"id": "b", "text": "b) Assegurar que o SGSI possa alcançar seus resultados pretendidos, prevenir ou reduzir efeitos indesejados, e alcançar a melhoria contínua."}, {"id": "c", "text": "c) Eliminar completamente todos os riscos de segurança da informação."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 8, "text": "8. O que a InfoGuard deve estabelecer e manter como parte de seu processo de avaliação de riscos de segurança da informação?", "options": [{"id": "a", "text": "a) Apenas uma lista de ferramentas de avaliação de risco."}, {"id": "b", "text": "b) Uma lista de controles de segurança que já estão implementados."}, {"id": "c", "text": "c) Critérios de risco de segurança da informação, incluindo critérios de aceitação do risco."}], "correct_option": "c", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 9, "text": "9. Como a NetProtect deve abordar o tratamento de riscos da segurança da informação, conforme a ISO 27001:2022?", "options": [{"id": "a", "text": "a) Selecionar aleatoriamente controles do Anexo A."}, {"id": "b", "text": "b) Selecionar, de forma apropriada, as opções de tratamento de riscos e determinar todos os controles necessários, comparando-os com o Anexo A."}, {"id": "c", "text": "c) Implementar apenas os controles que não exigem investimento financeiro."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 10, "text": "10. Quais são as características que os objetivos de segurança da informação da SecureData devem ter, de acordo com a ISO 27001:2022?", "options": [{"id": "a", "text": "a) Ser secretos e imutáveis."}, {"id": "b", "text": "b) Ser consistentes com a política, mensuráveis (quando aplicável), levar em conta os requisitos aplicáveis, ser monitorados, comunicados e atualizados."}, {"id": "c", "text": "c) Ser vagos para permitir flexibilidade."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 11, "text": "11. O que a DigitalFortress deve fazer ao determinar a necessidade de mudanças em seu SGSI?", "options": [{"id": "a", "text": "a) Implementar as mudanças imediatamente, sem planejamento formal."}, {"id": "b", "text": "b) Conduzir as mudanças de uma forma planejada."}, {"id": "c", "text": "c) Adiar as mudanças indefinidamente para evitar interrupções."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 12, "text": "12. O que a CyberCorp deve determinar e prover para seu SGSI, de acordo com a ISO 27001:2022?", "options": [{"id": "a", "text": "a) Apenas documentos e registros."}, {"id": "b", "text": "b) Os recursos necessários para estabelecer, implementar, manter e melhorar continuamente o SGSI."}, {"id": "c", "text": "c) Unicamente a política de segurança da informação."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 13, "text": "13. Em relação à competência, o que a SafeSystems deve assegurar para as pessoas que realizam trabalho sob seu controle que afete o desempenho da segurança da informação?", "options": [{"id": "a", "text": "a) Que todos os funcionários sejam especialistas em segurança cibernética."}, {"id": "b", "text": "b) Que essas pessoas são competentes, com base em educação, treinamento ou experiência apropriados, e reter informação documentada como evidência."}, {"id": "c", "text": "c) Apenas que assinem um termo de responsabilidade."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 14, "text": "14. O que a InfoProtect Solutions deve garantir em relação à conscientização das pessoas que realizam trabalho sob o controle da organização?", "options": [{"id": "a", "text": "a) Que apenas a alta direção esteja ciente da política."}, {"id": "b", "text": "b) Que as pessoas estejam cientes da política de segurança da informação, suas contribuições para a eficácia do SGSI e as implicações da não conformidade."}, {"id": "c", "text": "c) Que a conscientização seja um evento anual sem acompanhamento."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 15, "text": "15. O que a SecureComm deve determinar em relação às comunicações internas e externas relevantes para o SGSI?", "options": [{"id": "a", "text": "a) Apenas com quem comunicar."}, {"id": "b", "text": "b) O que, quando, com quem e como comunicar."}, {"id": "c", "text": "c) Apenas que a comunicação seja feita por e-mail."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 16, "text": "16. Ao criar e atualizar a informação documentada, o que a DocuSecure deve assegurar, de acordo com a ISO 27001:2022?", "options": [{"id": "a", "text": "a) Apenas que a informação documentada seja impressa."}, {"id": "b", "text": "b) Identificação e descrição, formato e meio, e análise crítica e aprovação para pertinência e adequação."}, {"id": "c", "text": "c) Que a informação documentada seja acessível apenas por uma pessoa."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 17, "text": "17. O que a ArchivSafe deve fazer para controlar a informação documentada requerida pelo SGSI e pela norma?", "options": [{"id": "a", "text": "a) Apenas arquivar tudo em formato digital sem backups."}, {"id": "b", "text": "b) Assegurar que esteja disponível, adequada para o uso, protegida adequadamente, e considerar atividades como distribuição, armazenamento, controle de mudanças e retenção."}, {"id": "c", "text": "c) Descartar informações antigas sem registro."}], "correct_option": "b", "domain": "Simulado 1", "theme": "tecnologico"}, {"id": 18, "text": "18. O que a ProcesSafe deve fazer ao planejar, implementar e controlar os processos necessários para atender aos requisitos e implementar as ações determinadas na Seção 6?", "options": [{"id": "a", "text": "a) Ignorar os critérios estabelecidos para os processos."}, {"id": "b", "text": "b) Estabelecer critérios para os processos e implementar controles dos processos de acordo com os critérios, disponibilizando informação documentada."}, {"id": "c", "text": "c) Apenas focar na documentação dos procedimentos."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 19, "text": "19. Quando a RiskFlow deve realizar avaliações de riscos da segurança da informação?", "options": [{"id": "a", "text": "a) Apenas uma vez por ano, independentemente das mudanças."}, {"id": "b", "text": "b) A intervalos planejados, ou quando mudanças significativas forem propostas ou ocorrerem, levando em conta os critérios estabelecidos."}, {"id": "c", "text": "c) Somente após a ocorrência de um incidente de segurança."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 20, "text": "20. O que a ActionSecure deve fazer após a elaboração do plano de tratamento de riscos da segurança da informação?", "options": [{"id": "a", "text": "a) Arquivar o plano e esperar por uma auditoria."}, {"id": "b", "text": "b) Implementar o plano de tratamento de riscos da segurança da informação e reter informação documentada dos resultados."}, {"id": "c", "text": "c) Delegar a implementação para uma equipe não envolvida na elaboração do plano."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 21, "text": "21. O que a MeasureUp deve determinar para o monitoramento, medição, análise e avaliação do SGSI?", "options": [{"id": "a", "text": "a) Apenas quem deve monitorar."}, {"id": "b", "text": "b) O que precisa ser monitorado e medido (incluindo controles e processos), os métodos, quando, quem e quando analisar e avaliar os resultados."}, {"id": "c", "text": "c) Métodos de medição baseados em suposições, sem evidências."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 22, "text": "22. O que a AuditGuard deve fazer em relação às auditorias internas, de acordo com a ISO 27001:2022?", "options": [{"id": "a", "text": "a) Conduzir auditorias apenas quando houver não conformidades graves."}, {"id": "b", "text": "b) Planejar, estabelecer, implementar e manter programa(s) de auditoria, incluindo frequência, métodos, responsabilidades, requisitos de planejamento e relato."}, {"id": "c", "text": "c) Contratar auditorias externas para substituir as auditorias internas."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 23, "text": "23. O que a análise crítica pela Direção da ReviewPro deve incluir como entradas, conforme a ISO 27001:2022?", "options": [{"id": "a", "text": "a) Apenas os resultados das auditorias internas bem-sucedidas."}, {"id": "b", "text": "b) A situação das ações de análises críticas anteriores, mudanças nas questões internas/externas, feedback sobre o desempenho da segurança da informação, resultados da avaliação de riscos, e oportunidades para melhoria contínua."}, {"id": "c", "text": "c) Somente informações sobre novas tecnologias no mercado."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 24, "text": "24. O que os resultados da análise crítica pela Direção da ImprovePath devem incluir e como devem ser tratados?", "options": [{"id": "a", "text": "a) Apenas uma lista de problemas identificados."}, {"id": "b", "text": "b) Decisões relativas às oportunidades para melhoria contínua e necessidades de mudanças do SGSI, e devem ser disponibilizadas como informação documentada."}, {"id": "c", "text": "c) Recomendações que não precisam ser documentadas."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 25, "text": "25. O que a ContinuousFlow deve fazer em relação à melhoria de seu SGSI?", "options": [{"id": "a", "text": "a) Considerar o SGSI como um projeto de conclusão única."}, {"id": "b", "text": "b) Melhorar continuamente a pertinência, a adequação e a eficácia do SGSI."}, {"id": "c", "text": "c) Apenas corrigir falhas quando elas ocorrerem."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 26, "text": "26. Quando uma não conformidade ocorre, o que a CorrectiveAction deve fazer, de acordo com a ISO 27001:2022?", "options": [{"id": "a", "text": "a) Apenas documentar a não conformidade e ignorá-la."}, {"id": "b", "text": "b) Reagir à não conformidade, tomar ações para controlá-la e corrigi-la, lidar com as consequências e avaliar a necessidade de ações para eliminar as causas."}, {"id": "c", "text": "c) Atribuir a culpa a um indivíduo."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 27, "text": "27. Em relação às políticas de segurança da informação (Controle A.5.1), o que a PolicyGuard deve fazer?", "options": [{"id": "a", "text": "a) Apenas criar um rascunho da política e armazená-lo."}, {"id": "b", "text": "b) Definir, aprovar pela direção, publicar, comunicar, e analisar criticamente em intervalos planejados e quando ocorrerem mudanças significativas."}, {"id": "c", "text": "c) Delegar a aprovação da política a um estagiário."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 28, "text": "28. O que a RoleClarity deve fazer em relação aos papéis e responsabilidades pela segurança da informação (Controle A.5.2)?", "options": [{"id": "a", "text": "a) Evitar definir papéis específicos para manter a flexibilidade."}, {"id": "b", "text": "b) Definir e alocar papéis e responsabilidades pela segurança da informação de acordo com as necessidades da organização."}, {"id": "c", "text": "c) Permitir que cada funcionário defina suas próprias responsabilidades de segurança."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 29, "text": "29. Para evitar esse risco, o que a FunctionSegregation deve implementar (Controle A.5.3)?", "options": [{"id": "a", "text": "a) Mais treinamento para o funcionário."}, {"id": "b", "text": "b) Segregação de funções, onde funções conflitantes e áreas de responsabilidade devem ser segregadas."}, {"id": "c", "text": "c) Uma auditoria anual focada apenas nos sistemas."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 30, "text": "30. O que a direção da LeadershipCommitment deve fazer para demonstrar sua responsabilidade (Controle A.5.4)?", "options": [{"id": "a", "text": "a) Ignorar o comportamento dos funcionários, pois a segurança é responsabilidade da equipe de TI."}, {"id": "b", "text": "b) Requerer que todo o pessoal aplique a segurança da informação de acordo com a política e os procedimentos da organização."}, {"id": "c", "text": "c) Apenas distribuir a política por e-mail e não cobrar a leitura."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 31, "text": "31. Qual controle organizacional (Controle A.5.5) a AuthorityConnect precisa implementar?", "options": [{"id": "a", "text": "a) Fortalecer os controles internos de firewall."}, {"id": "b", "text": "b) Estabelecer e manter contato com as autoridades relevantes."}, {"id": "c", "text": "c) Aumentar o número de reuniões internas."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 32, "text": "32. Qual é a recomendação da ISO 27001:2022 (Controle A.5.6) para a CommunityEngage?", "options": [{"id": "a", "text": "a) Limitar o contato externo para proteger informações confidenciais."}, {"id": "b", "text": "b) Estabelecer e manter contato com grupos de interesse especial ou com outros fóruns de especialistas em segurança e associações profissionais."}, {"id": "c", "text": "c) Contratar mais consultores externos para todas as necessidades de segurança."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 33, "text": "33. Qual controle a ThreatIntel Corp deve implementar para melhorar sua postura de segurança (Controle A.5.7)?", "options": [{"id": "a", "text": "a) Instalar um antivírus em todas as máquinas."}, {"id": "b", "text": "b) Coletar e analisar informações relacionadas a ameaças à segurança da informação para produzir inteligência de ameaças."}, {"id": "c", "text": "c) Treinar os funcionários para identificar e-mails de phishing."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 34, "text": "34. O que a ProjectSecure deveria ter feito, de acordo com a ISO 27001:2022 (Controle A.5.8)?", "options": [{"id": "a", "text": "a) Adicionar a segurança como uma etapa final do projeto."}, {"id": "b", "text": "b) Integrar a segurança da informação ao gerenciamento de projetos."}, {"id": "c", "text": "c) Contratar uma equipe de testes de penetração apenas no final do ciclo de desenvolvimento."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 35, "text": "35. Qual controle a AssetInventory deve implementar para resolver essa questão (Controle A.5.9)?", "options": [{"id": "a", "text": "a) Comprar mais ativos de TI."}, {"id": "b", "text": "b) Desenvolver e manter um inventário de informações e outros ativos associados, incluindo proprietários."}, {"id": "c", "text": "c) Contar com a memória dos funcionários para saber onde os ativos estão."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 36, "text": "36. O que a AcceptableUse precisa estabelecer para controlar o uso de informações e ativos (Controle A.5.10)?", "options": [{"id": "a", "text": "a) Bloquear todos os sites da internet."}, {"id": "b", "text": "b) Identificar, documentar e implementar regras para o uso aceitável e procedimentos para o manuseio de informações e outros ativos associados."}, {"id": "c", "text": "c) Implementar um sistema de monitoramento constante sem notificar os funcionários."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 37, "text": "37. Qual é a exigência da norma (Controle A.5.11) para a AssetReturn neste caso?", "options": [{"id": "a", "text": "a) Apenas confiar na boa-fé do ex-funcionário."}, {"id": "b", "text": "b) Que o pessoal e outras partes interessadas, conforme apropriado, devolvam todos os ativos da organização em sua posse após a mudança ou o encerramento da contratação ou acordo."}, {"id": "c", "text": "c) Enviar um lembrete por e-mail após um mês."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 38, "text": "38. O que a DataClassification deve fazer em relação às suas informações (Controle A.5.12)?", "options": [{"id": "a", "text": "a) Tratar todas as informações como altamente confidenciais."}, {"id": "b", "text": "b) Classificar as informações de acordo com as necessidades de segurança da informação da organização, com base na confidencialidade, integridade, disponibilidade e requisitos das partes interessadas relevantes."}, {"id": "c", "text": "c) Apenas criptografar todos os dados, independentemente de sua sensibilidade."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 39, "text": "39. O que a LabelingPro deve desenvolver e implementar para suas informações (Controle A.5.13)?", "options": [{"id": "a", "text": "a) Um sistema de controle de acesso complexo."}, {"id": "b", "text": "b) Um conjunto adequado de procedimentos para rotulagem de informações de acordo com o esquema de classificação de informações adotado."}, {"id": "c", "text": "c) Um sistema de auditoria externa para verificar a classificação."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 40, "text": "40. O que a TransferSecure deve implementar para gerenciar a transferência de informações (Controle A.5.14)?", "options": [{"id": "a", "text": "a) Apenas usar e-mail criptografado para todas as transferências."}, {"id": "b", "text": "b) Regras, procedimentos ou acordos de transferência de informações para todos os tipos de recursos de transferência dentro da organização e entre a organização e outras partes."}, {"id": "c", "text": "c) Permitir que cada departamento use seu próprio método de transferência."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 41, "text": "41. O que a AccessControl Corp deve fazer em relação ao controle de acesso (Controle A.5.15)?", "options": [{"id": "a", "text": "a) Remover todos os controles de acesso para facilitar o trabalho."}, {"id": "b", "text": "b) Estabelecer e implementar regras para controlar o acesso físico e lógico às informações e a outros ativos associados com base nos requisitos de segurança da informação e de negócios."}, {"id": "c", "text": "c) Contratar seguranças para monitorar o acesso físico apenas."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 42, "text": "42. O que a IdentityManage deve gerenciar para garantir a segurança (Controle A.5.16)?", "options": [{"id": "a", "text": "a) Apenas a criação de novas identidades."}, {"id": "b", "text": "b) O ciclo de vida completo das identidades."}, {"id": "c", "text": "c) O número total de identidades ativas."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 43, "text": "43. O que a AuthInfo deve controlar em relação às informações de autenticação (Controle A.5.17)?", "options": [{"id": "a", "text": "a) Apenas a complexidade das senhas."}, {"id": "b", "text": "b) A alocação e a gestão de informações de autenticação por uma gestão de processo, incluindo aconselhar o pessoal sobre o manuseio adequado."}, {"id": "c", "text": "c) A frequência de redefinição de senhas para cada funcionário."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 44, "text": "44. O que a RightsAccess deve fazer em relação aos direitos de acesso (Controle A.5.18)?", "options": [{"id": "a", "text": "a) Apenas revogar todos os direitos de acesso anualmente."}, {"id": "b", "text": "b) Provisionar, analisar criticamente, modificar e remover direitos de acesso às informações e a outros ativos associados de acordo com a política e as regras da organização para o controle de acesso."}, {"id": "c", "text": "c) Permitir que os usuários solicitem seus próprios direitos de acesso."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 45, "text": "45. O que a SupplierSecure deve definir e implementar em relação aos fornecedores (Controle A.5.19)?", "options": [{"id": "a", "text": "a) Apenas um contrato padrão para todos os fornecedores."}, {"id": "b", "text": "b) Processos e procedimentos para gerenciar a segurança da informação e os riscos associados com o uso dos produtos ou serviços dos fornecedores."}, {"id": "c", "text": "c) Um processo de auditoria de fornecedores somente após um incidente."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 46, "text": "46. O que a ContractSecure deve fazer em relação aos contratos de fornecedores (Controle A.5.20)?", "options": [{"id": "a", "text": "a) Assumir que os fornecedores já têm seus próprios controles de segurança."}, {"id": "b", "text": "b) Estabelecer e acordar requisitos relevantes de segurança da informação com cada fornecedor, com base no tipo de relacionamento."}, {"id": "c", "text": "c) Apenas incluir uma cláusula genérica de conformidade com a lei."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 47, "text": "47. O que a SupplyChainProtect deve definir e implementar para gerenciar esses riscos (Controle A.5.21)?", "options": [{"id": "a", "text": "a) Um sistema de inventário de hardware."}, {"id": "b", "text": "b) Processos e procedimentos para gerenciar os riscos da segurança da informação associados à cadeia de fornecimento de produtos e serviços de TIC."}, {"id": "c", "text": "c) Limitar o número de fornecedores de TIC."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 48, "text": "48. O que a VendorMonitor deve fazer em relação aos serviços de fornecedores (Controle A.5.22)?", "options": [{"id": "a", "text": "a) Confiar que os fornecedores manterão altos padrões de segurança por conta própria."}, {"id": "b", "text": "b) Monitorar, analisar criticamente, avaliar e gerenciar regularmente a mudança nas práticas da segurança da informação dos fornecedores e na prestação de serviços."}, {"id": "c", "text": "c) Apenas realizar uma avaliação inicial do fornecedor."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 49, "text": "49. O que a CloudSecure deve estabelecer em relação ao uso de serviços em nuvem (Controle A.5.23)?", "options": [{"id": "a", "text": "a) Apenas os custos e benefícios financeiros da migração."}, {"id": "b", "text": "b) Processos de aquisição, uso, gestão e saída de serviços em nuvem de acordo com os requisitos da segurança da informação da organização."}, {"id": "c", "text": "c) Apenas selecionar os maiores provedores de nuvem."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 50, "text": "50. O que a IncidentReady deve fazer para se preparar para incidentes de segurança da informação (Controle A.5.24)?", "options": [{"id": "a", "text": "a) Apenas reagir aos incidentes quando eles ocorrerem."}, {"id": "b", "text": "b) Planejar e se preparar para gerenciar incidentes da segurança da informação, definindo, estabelecendo e comunicando processos, papéis e responsabilidades."}, {"id": "c", "text": "c) Contratar um profissional de resposta a incidentes apenas após um ataque."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 51, "text": "51. O que a EventEvaluate deve fazer em relação aos eventos de segurança da informação (Controle A.5.25)?", "options": [{"id": "a", "text": "a) Considerar todos os eventos como incidentes de segurança."}, {"id": "b", "text": "b) Avaliar os eventos da segurança da informação e decidir se categoriza como incidentes da segurança da informação."}, {"id": "c", "text": "c) Ignorar eventos menores."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 52, "text": "52. Como a ResponseAction deve responder a incidentes da segurança da informação (Controle A.5.26)?", "options": [{"id": "a", "text": "a) De forma ad-hoc, dependendo da situação."}, {"id": "b", "text": "b) De acordo com os procedimentos documentados."}, {"id": "c", "text": "c) Apenas com base na experiência individual dos membros da equipe."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 53, "text": "53. Qual controle (A.5.27) a LessonLearn deve implementar após incidentes de segurança da informação?", "options": [{"id": "a", "text": "a) Apenas documentar o incidente."}, {"id": "b", "text": "b) Usar o conhecimento adquirido com incidentes de segurança da informação para fortalecer e melhorar os controles da segurança da informação."}, {"id": "c", "text": "c) Esquecer o incidente e seguir em frente."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 54, "text": "54. O que a EvidenceCollect deve estabelecer e implementar para lidar com eventos de segurança da informação (Controle A.5.28)?", "options": [{"id": "a", "text": "a) Um sistema de monitoramento de câmeras de segurança."}, {"id": "b", "text": "b) Procedimentos para identificação, coleta, aquisição e preservação de evidências relacionadas a eventos da segurança da informação."}, {"id": "c", "text": "c) Apenas confiar em logs de sistema."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 55, "text": "55. O que a DisruptionSecure deve planejar (Controle A.5.29) para garantir a segurança durante a disrupção?", "options": [{"id": "a", "text": "a) Apenas focar na recuperação de dados."}, {"id": "b", "text": "b) Como manter a segurança da informação em um nível apropriado durante a disrupção."}, {"id": "c", "text": "c) Desligar todos os sistemas para evitar danos adicionais."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 56, "text": "56. O que a TIContReady deve fazer em relação à prontidão de TIC para continuidade de negócios (Controle A.5.30)?", "options": [{"id": "a", "text": "a) Apenas ter um backup de dados."}, {"id": "b", "text": "b) Planejar, implementar, manter e testar a prontidão de TIC com base nos objetivos de continuidade de negócios e nos requisitos de continuidade da TIC."}, {"id": "c", "text": "c) Assumir que o plano de continuidade de negócios funcionará sem testes."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 57, "text": "57. O que a ComplianceCheck deve fazer em relação a esses requisitos (Controle A.5.31)?", "options": [{"id": "a", "text": "a) Apenas cumprir as leis mais óbvias."}, {"id": "b", "text": "b) Identificar, documentar e atualizar os requisitos legais, estatutários, regulamentares e contratuais pertinentes à segurança da informação e à abordagem da organização para atender a esses requisitos."}, {"id": "c", "text": "c) Contratar advogados apenas quando surgir um problema legal."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 58, "text": "58. O que a IPProtect deve implementar (Controle A.5.32) para proteger seus direitos de propriedade intelectual?", "options": [{"id": "a", "text": "a) Apenas registrar patentes."}, {"id": "b", "text": "b) Procedimentos adequados para proteger os direitos de propriedade intelectual."}, {"id": "c", "text": "c) Compartilhar a propriedade intelectual livremente para promover a inovação."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 59, "text": "59. Como a RecordSafe deve proteger seus registros (Controle A.5.33)?", "options": [{"id": "a", "text": "a) Apenas fazer cópias de segurança de todos os registros."}, {"id": "b", "text": "b) Proteger os registros contra perdas, destruição, falsificação, acesso não autorizado e liberação não autorizada."}, {"id": "c", "text": "c) Armazenar todos os registros em papel para evitar ataques cibernéticos."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 60, "text": "60. O que a PrivacyProtect deve fazer em relação à privacidade e proteção de DP (Dados Pessoais) (Controle A.5.34)?", "options": [{"id": "a", "text": "a) Apenas obter o consentimento dos indivíduos."}, {"id": "b", "text": "b) Identificar e atender aos requisitos relativos à preservação da privacidade e à proteção de DP, de acordo com as leis e os regulamentos aplicáveis e requisitos contratuais."}, {"id": "c", "text": "c) Minimizar a coleta de dados pessoais sempre que possível."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 61, "text": "61. O que a ReviewIndep deve fazer em relação à análise crítica independente da segurança da informação (Controle A.5.35)?", "options": [{"id": "a", "text": "a) Apenas realizar auditorias internas."}, {"id": "b", "text": "b) Analisar criticamente, de forma independente, a abordagem da organização para gerenciar a segurança da informação e sua implementação, a intervalos planejados ou quando ocorrerem mudanças significativas."}, {"id": "c", "text": "c) Deixar a análise crítica para a equipe de segurança."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 62, "text": "62. O que a PolicyCompliance deve fazer em relação ao compliance com políticas, regras e normas para segurança da informação (Controle A.5.36)?", "options": [{"id": "a", "text": "a) Assumir que as políticas serão seguidas."}, {"id": "b", "text": "b) Analisar criticamente o compliance da política de segurança da informação da organização, políticas, regras e normas de temas específicos a intervalos regulares."}, {"id": "c", "text": "c) Apenas informar os funcionários sobre as políticas."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 63, "text": "63. O que a DocuProcedures deve fazer para seus procedimentos de operação (Controle A.5.37)?", "options": [{"id": "a", "text": "a) Apenas treinar os funcionários verbalmente."}, {"id": "b", "text": "b) Documentar os procedimentos de operação dos recursos de tratamento da informação e disponibilizá-los para o pessoal que necessite deles."}, {"id": "c", "text": "c) Criar procedimentos apenas para novas funcionalidades."}], "correct_option": "b", "domain": "Simulado 1", "theme": "organizacional"}, {"id": 64, "text": "64. O que a RecruitSecure deve fazer em relação à seleção de pessoal (Controle A.6.1)?", "options": [{"id": "a", "text": "a) Apenas verificar o currículo dos candidatos."}, {"id": "b", "text": "b) Realizar verificações de antecedentes de todos os candidatos a serem contratados antes de ingressarem na organização e de modo contínuo, de acordo com as leis, os regulamentos e a ética aplicáveis."}, {"id": "c", "text": "c) Contratar com base apenas na experiência profissional."}], "correct_option": "b", "domain": "Simulado 1", "theme": "pessoas"}, {"id": 65, "text": "65. O que a ContractTerms deve fazer em relação aos termos e condições de contratação (Controle A.6.2)?", "options": [{"id": "a", "text": "a) Apenas ter um contrato de trabalho genérico."}, {"id": "b", "text": "b) Declarar as responsabilidades do pessoal e da organização para a segurança da informação nos contratos trabalhistas."}, {"id": "c", "text": "c) Confiar em acordos verbais com os funcionários."}], "correct_option": "b", "domain": "Simulado 1", "theme": "pessoas"}, {"id": 66, "text": "66. O que a AwarenessTrain deve garantir em relação à conscientização, educação e treinamento em segurança da informação (Controle A.6.3)?", "options": [{"id": "a", "text": "a) Que o treinamento seja opcional."}, {"id": "b", "text": "b) Que o pessoal da organização e partes interessadas relevantes recebam treinamento, educação e conscientização apropriados e atualizações regulares da política e dos procedimentos, pertinentes para suas funções."}, {"id": "c", "text": "c) Apenas que a equipe de TI participe de treinamentos avançados."}], "correct_option": "b", "domain": "Simulado 1", "theme": "pessoas"}, {"id": 67, "text": "67. O que a DisciplineProcess deve fazer em relação ao processo disciplinar (Controle A.6.4)?", "options": [{"id": "a", "text": "a) Demitir o funcionário imediatamente sem processo."}, {"id": "b", "text": "b) Formalizar e comunicar um processo disciplinar para tomar ações contra pessoal e outras partes interessadas relevantes que tenham cometido uma violação da política da segurança da informação."}, {"id": "c", "text": "c) Ignorar a violação para evitar conflitos."}], "correct_option": "b", "domain": "Simulado 1", "theme": "pessoas"}, {"id": 68, "text": "68. O que a PostEmployment deve definir e comunicar em relação às responsabilidades após encerramento ou mudança da contratação (Controle A.6.5)?", "options": [{"id": "a", "text": "a) Apenas desconectar o acesso do funcionário."}, {"id": "b", "text": "b) As responsabilidades e funções de segurança da informação que permaneçam válidas após o encerramento ou a mudança da contratação devem ser definidas, aplicadas e comunicadas ao pessoal e a outras partes interessadas pertinentes."}, {"id": "c", "text": "c) Deixar para o departamento jurídico lidar com quaisquer problemas futuros."}], "correct_option": "b", "domain": "Simulado 1", "theme": "pessoas"}, {"id": 69, "text": "69. O que a NDAImplement deve fazer em relação aos acordos de confidencialidade ou não divulgação (Controle A.6.6)?", "options": [{"id": "a", "text": "a) Apenas confiar na palavra das partes envolvidas."}, {"id": "b", "text": "b) Identificar, documentar, analisar criticamente em intervalos regulares e assinar acordos de confidencialidade ou não divulgação que reflitam as necessidades da organização para a proteção das informações."}, {"id": "c", "text": "c) Usar NDAs apenas para informações altamente secretas."}], "correct_option": "b", "domain": "Simulado 1", "theme": "pessoas"}, {"id": 70, "text": "70. O que a RemoteWorkSecure deve implementar para o trabalho remoto (Controle A.6.7)?", "options": [{"id": "a", "text": "a) Apenas fornecer laptops corporativos."}, {"id": "b", "text": "b) Medidas de segurança para proteger as informações acessadas, tratadas ou armazenadas fora das instalações da organização."}, {"id": "c", "text": "c) Deixar a segurança do ambiente remoto a cargo do funcionário."}], "correct_option": "b", "domain": "Simulado 1", "theme": "pessoas"}, {"id": 71, "text": "71. O que a EventReport deve fornecer (Controle A.6.8) para o relato de eventos de segurança da informação?", "options": [{"id": "a", "text": "a) Um canal de comunicação apenas para a alta direção."}, {"id": "b", "text": "b) Um mecanismo para que as pessoas relatem eventos da segurança da informação observados ou suspeitos por meio de canais apropriados em tempo hábil."}, {"id": "c", "text": "c) Um sistema de recompensa por relatar incidentes."}], "correct_option": "b", "domain": "Simulado 1", "theme": "pessoas"}, {"id": 72, "text": "72. O que a PhysicalPerimeters deve fazer em relação aos perímetros de segurança física (Controle A.7.1)?", "options": [{"id": "a", "text": "a) Apenas instalar câmeras de segurança na entrada principal."}, {"id": "b", "text": "b) Definir e usar perímetros de segurança para proteger áreas que contenham informações e outros ativos associados."}, {"id": "c", "text": "c) Permitir acesso irrestrito para facilitar a movimentação."}], "correct_option": "b", "domain": "Simulado 1", "theme": "fisico"}, {"id": 73, "text": "73. O que a EntryControl deve fazer em relação à entrada física (Controle A.7.2)?", "options": [{"id": "a", "text": "a) Apenas usar crachás de identificação sem controle de acesso."}, {"id": "b", "text": "b) Proteger as áreas seguras por controles de entrada e pontos de acesso apropriados."}, {"id": "c", "text": "c) Contar com a vigilância manual de seguranças."}], "correct_option": "b", "domain": "Simulado 1", "theme": "fisico"}, {"id": 74, "text": "74. O que a OfficeSecurity deve fazer em relação à segurança de escritórios, salas e instalações (Controle A.7.3)?", "options": [{"id": "a", "text": "a) Apenas trancar as portas ao final do dia."}, {"id": "b", "text": "b) Projetar e implementar segurança física para escritórios, salas e instalações."}, {"id": "c", "text": "c) Instalar alarmes sem um sistema de resposta."}], "correct_option": "b", "domain": "Simulado 1", "theme": "fisico"}, {"id": 75, "text": "75. O que a PhysicalMonitor deve fazer (Controle A.7.4) para proteger suas instalações?", "options": [{"id": "a", "text": "a) Apenas realizar inspeções aleatórias."}, {"id": "b", "text": "b) Monitorar continuamente as instalações para acesso físico não autorizado."}, {"id": "c", "text": "c) Apenas confiar em fechaduras nas portas."}], "correct_option": "b", "domain": "Simulado 1", "theme": "fisico"}, {"id": 76, "text": "76. O que a ThreatProtect deve fazer em relação à proteção contra ameaças físicas e ambientais (Controle A.7.5)?", "options": [{"id": "a", "text": "a) Apenas ter um seguro contra desastres."}, {"id": "b", "text": "b) Projetar e implementar proteção contra ameaças físicas e ambientais, como desastres naturais e outras ameaças físicas intencionais ou não intencionais à infraestrutura."}, {"id": "c", "text": "c) Armazenar os equipamentos em áreas sem proteção especial."}], "correct_option": "b", "domain": "Simulado 1", "theme": "fisico"}, {"id": 77, "text": "77. O que a SecureAreasWork deve fazer em relação ao trabalho em áreas seguras (Controle A.7.6)?", "options": [{"id": "a", "text": "a) Restringir o acesso a essas áreas."}, {"id": "b", "text": "b) Projetar e implementar medidas de segurança para trabalhar em áreas seguras."}, {"id": "c", "text": "c) Apenas confiar na integridade dos funcionários."}], "correct_option": "b", "domain": "Simulado 1", "theme": "fisico"}, {"id": 78, "text": "78. O que a CleanDesk deve definir e aplicar (Controle A.7.7) para evitar isso?", "options": [{"id": "a", "text": "a) Políticas de trabalho remoto."}, {"id": "b", "text": "b) Regras de mesa limpa para documentos impressos e mídia de armazenamento removível e regras de tela limpa para os recursos de tratamento das informações."}, {"id": "c", "text": "c) Um sistema de armários para guardar itens pessoais."}], "correct_option": "b", "domain": "Simulado 1", "theme": "fisico"}, {"id": 79, "text": "79. O que a EquipLocate deve garantir em relação à localização e proteção de equipamentos (Controle A.7.8)?", "options": [{"id": "a", "text": "a) Apenas etiquetar todos os equipamentos."}, {"id": "b", "text": "b) Posicionar os equipamentos com segurança e proteção."}, {"id": "c", "text": "c) Deixar os equipamentos visíveis para facilitar a manutenção."}], "correct_option": "b", "domain": "Simulado 1", "theme": "fisico"}, {"id": 80, "text": "80. A empresa \"OutsideEquip\" descobre que colaboradores levam laptops corporativos para casa sem qualquer orientação ou controle de segurança.", "options": [{"id": "a", "text": "a) Proibir completamente o uso de equipamentos fora das instalações."}, {"id": "b", "text": "b) Aplicar segurança a equipamentos utilizados fora das instalações, como proteção física, criptografia e política de uso aceitável (Controle A.7.9)."}, {"id": "c", "text": "c) Confiar que os colaboradores adotarão boas práticas por conta própria."}], "correct_option": "b", "domain": "Simulado 1", "theme": "fisico"}, {"id": 81, "text": "81. Qual é a definição mais abrangente de \"segurança da informação\" no contexto da ISO 27001:2022, considerando seus pilares fundamentais?", "options": [{"id": "a", "text": "a) A proteção de ativos de hardware e software contra ataques cibernéticos e falhas."}, {"id": "b", "text": "b) A preservação da confidencialidade, integridade e disponibilidade da informação."}, {"id": "c", "text": "c) O cumprimento de todas as leis de privacidade de dados em nível internacional."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 1: A empresa \"TechSolution\", especializada em desenvolvimento de software, está começando a entender a ISO 27001 para proteger suas propriedades intelectuais e dados de clientes.", "theme": "organizacional"}, {"id": 82, "text": "82. Para a TechSolution, a \"confidencialidade\" é essencial para proteger seus algoritmos proprietários. Qual é a essência deste princípio?", "options": [{"id": "a", "text": "a) Garantir que a informação seja acessível e utilizável por pessoas autorizadas quando necessário."}, {"id": "b", "text": "b) Assegurar que a informação esteja completa e não tenha sido alterada ou destruída indevidamente."}, {"id": "c", "text": "c) Proteger a informação contra divulgação não autorizada."}], "correct_option": "c", "domain": "Simulado 2 — Cenário 1: A empresa \"TechSolution\", especializada em desenvolvimento de software, está começando a entender a ISO 27001 para proteger suas propriedades intelectuais e dados de clientes.", "theme": "organizacional"}, {"id": 83, "text": "83. Um dos gerentes da TechSolution questiona a necessidade de um SGSI, achando que basta comprar um bom antivírus. Conforme a ABNT NBR ISO/IEC 27001:2022 (Introdução, 0.1), o SGSI baseia-se primariamente em qual processo?", "options": [{"id": "a", "text": "a) A implementação de tecnologias de segurança de ponta."}, {"id": "b", "text": "b) Um processo de gestão de riscos contínuo para a informação."}, {"id": "c", "text": "c) A contratação de especialistas externos em cibersegurança."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 1: A empresa \"TechSolution\", especializada em desenvolvimento de software, está começando a entender a ISO 27001 para proteger suas propriedades intelectuais e dados de clientes.", "theme": "organizacional"}, {"id": 84, "text": "84. A ABNT NBR ISO/IEC 27001:2022 estabelece que a adoção de um SGSI é uma \"decisão estratégica\". O que essa característica implica para a HealthData Corp.?", "options": [{"id": "a", "text": "a) A decisão pode ser tomada pelo departamento de TI independentemente da direção estratégica da empresa."}, {"id": "b", "text": "b) A implementação do SGSI deve ser alinhada aos objetivos de negócio da empresa e integrada à sua estrutura de administração."}, {"id": "c", "text": "c) A certificação ISO 27001 é um diferencial de marketing, mas não afeta a operação diária."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 2: A \"HealthData Corp.\" gerencia um grande volume de prontuários eletrônicos e está explorando a ISO 27001 para fortalecer a proteção dos dados dos pacientes.", "theme": "organizacional"}, {"id": 85, "text": "85. A \"integridade\" dos dados de prontuários é crítica para a HealthData Corp. O que garante a integridade?", "options": [{"id": "a", "text": "a) A não divulgação da informação a pessoas não autorizadas."}, {"id": "b", "text": "b) A propriedade de que a informação é completa, precisa e protegida contra modificações indevidas."}, {"id": "c", "text": "c) O acesso contínuo à informação por parte dos médicos autorizados."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 2: A \"HealthData Corp.\" gerencia um grande volume de prontuários eletrônicos e está explorando a ISO 27001 para fortalecer a proteção dos dados dos pacientes.", "theme": "pessoas"}, {"id": 86, "text": "86. Para a HealthData Corp., garantir que os médicos autorizados tenham acesso aos prontuários dos pacientes a qualquer momento é um exemplo de qual pilar da segurança da informação?", "options": [{"id": "a", "text": "a) Confidencialidade."}, {"id": "b", "text": "b) Integridade."}, {"id": "c", "text": "c) Disponibilidade."}], "correct_option": "c", "domain": "Simulado 2 — Cenário 2: A \"HealthData Corp.\" gerencia um grande volume de prontuários eletrônicos e está explorando a ISO 27001 para fortalecer a proteção dos dados dos pacientes.", "theme": "organizacional"}, {"id": 87, "text": "87. A ABNT NBR ISO/IEC 27001:2022, em sua introdução (0.2), menciona a compatibilidade com outras normas de sistemas de gestão por meio do \"Anexo SL\". Qual o benefício disso para a Educação Online Global, que já possui um SGQ ISO 9001?", "options": [{"id": "a", "text": "a) A ISO 9001 cobre automaticamente todos os requisitos da ISO 27001, eliminando a necessidade de nova implementação."}, {"id": "b", "text": "b) Facilita a integração de processos e a gestão de múltiplos sistemas em uma única estrutura, otimizando recursos."}, {"id": "c", "text": "c) Permite que a organização escolha quais requisitos da ISO 27001 ela deseja implementar, sem impacto na certificação."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 3: A \"Educação Online Global\" está implementando a ISO 27001 para proteger dados de estudantes e garantir a continuidade de seus serviços de plataforma.", "theme": "organizacional"}, {"id": 88, "text": "88. O Anexo A da ABNT NBR ISO/IEC 27001:2022 é considerado normativo. Qual é o papel prático deste anexo?", "options": [{"id": "a", "text": "a) Ele fornece um conjunto de requisitos obrigatórios que a organização deve seguir ao pé da letra."}, {"id": "b", "text": "b) Ele oferece uma referência de controles de segurança da informação que devem ser considerados e tratados na Declaração de Aplicabilidade."}, {"id": "c", "text": "c) Ele define a metodologia para a avaliação de riscos, sem apresentar exemplos de controles."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 3: A \"Educação Online Global\" está implementando a ISO 27001 para proteger dados de estudantes e garantir a continuidade de seus serviços de plataforma.", "theme": "organizacional"}, {"id": 89, "text": "89. A \"Educação Online Global\" deve \"reter informação documentada\" dos objetivos da segurança da informação (ABNT NBR ISO/IEC 27001:2022, 6.2 g)). O que isso implica?", "options": [{"id": "a", "text": "a) Que os objetivos devem ser memorizados pela alta direção."}, {"id": "b", "text": "b) Que os objetivos devem ser registrados em um formato controlável para evidência e rastreamento."}, {"id": "c", "text": "c) Que apenas os auditores externos precisam ter acesso a esses objetivos."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 3: A \"Educação Online Global\" está implementando a ISO 27001 para proteger dados de estudantes e garantir a continuidade de seus serviços de plataforma.", "theme": "organizacional"}, {"id": 90, "text": "90. A ABNT NBR ISO/IEC 27001:2022 (Introdução, 0.1) enfatiza que a segurança da informação deve ser considerada no projeto de processos, sistemas e controles. Este conceito é conhecido como:", "options": [{"id": "a", "text": "a) Segurança reativa."}, {"id": "b", "text": "b) Segurança por design."}, {"id": "c", "text": "c) Segurança por compliance."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 4: A \"FinTech Solutions\" está desenvolvendo um novo aplicativo de pagamentos e busca integrar a segurança desde as primeiras fases do projeto.", "theme": "organizacional"}, {"id": 91, "text": "91. A ABNT NBR ISO/IEC 27000 é uma norma de referência crucial para a \"FinTech Solutions\". Qual sua principal função para a compreensão da ISO 27001?", "options": [{"id": "a", "text": "a) Fornecer uma lista detalhada de todas as vulnerabilidades de segurança existentes."}, {"id": "b", "text": "b) Estabelecer os requisitos técnicos para a implementação de firewalls e sistemas de detecção de intrusão."}, {"id": "c", "text": "c) Descrever a visão geral e o vocabulário do sistema de gestão da segurança da informação."}], "correct_option": "c", "domain": "Simulado 2 — Cenário 4: A \"FinTech Solutions\" está desenvolvendo um novo aplicativo de pagamentos e busca integrar a segurança desde as primeiras fases do projeto.", "theme": "organizacional"}, {"id": 92, "text": "92. No contexto de um SGSI para a \"FinTech Solutions\", o que representa um \"risco de segurança da informação\"?", "options": [{"id": "a", "text": "a) Um evento que já ocorreu e resultou em perda financeira."}, {"id": "b", "text": "b) O efeito da incerteza nos objetivos da segurança da informação."}, {"id": "c", "text": "c) Uma fraqueza em um sistema ou processo que pode ser explorada."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 4: A \"FinTech Solutions\" está desenvolvendo um novo aplicativo de pagamentos e busca integrar a segurança desde as primeiras fases do projeto.", "theme": "organizacional"}, {"id": 93, "text": "93. A Seção 1 da ABNT NBR ISO/IEC 27001:2022 especifica que a norma se aplica a todas as organizações, \"independentemente do tipo, tamanho ou natureza\". O que esta afirmação significa?", "options": [{"id": "a", "text": "a) A norma deve ser aplicada igualmente a qualquer organização sem qualquer adaptação."}, {"id": "b", "text": "b) A norma é universalmente adaptável, mas a forma de implementação deve ser adequada ao contexto específico de cada organização."}, {"id": "c", "text": "c) Organizações de pequeno porte podem obter isenção de alguns requisitos da norma."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 5: A \"Logística Inteligente\" é uma empresa de transporte e armazenamento, implementando a ISO 27001 para proteger seus dados de carga e logística.", "theme": "organizacional"}, {"id": 94, "text": "94. A \"Logística Inteligente\" precisa determinar as \"necessidades e expectativas das partes interessadas\" (ABNT NBR ISO/IEC 27001:2022, 4.2). Quais são os requisitos que podem ser considerados neste contexto?", "options": [{"id": "a", "text": "a) Apenas os requisitos internos definidos pela alta direção da empresa."}, {"id": "b", "text": "b) Somente os requisitos técnicos relacionados à infraestrutura de TI da organização."}, {"id": "c", "text": "c) Requisitos legais, regulamentares, contratuais e as expectativas de segurança dos stakeholders."}], "correct_option": "c", "domain": "Simulado 2 — Cenário 5: A \"Logística Inteligente\" é uma empresa de transporte e armazenamento, implementando a ISO 27001 para proteger seus dados de carga e logística.", "theme": "organizacional"}, {"id": 95, "text": "95. Conforme a ISO 27001:2022 (Seção 6.1.3 c), a \"Logística Inteligente\" deve comparar os controles que ela determinou com os do Anexo A. Qual o propósito dessa comparação?", "options": [{"id": "a", "text": "a) Para garantir que todos os controles do Anexo A sejam implementados, mesmo que não sejam relevantes."}, {"id": "b", "text": "b) Para verificar se nenhum controle necessário foi omitido."}, {"id": "c", "text": "c) Para substituir todos os controles internos pelos controles do Anexo A."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 5: A \"Logística Inteligente\" é uma empresa de transporte e armazenamento, implementando a ISO 27001 para proteger seus dados de carga e logística.", "theme": "organizacional"}, {"id": 96, "text": "96. A ABNT NBR ISO/IEC 27001:2022 (Seção 4.4) exige que a \"SmartCity Solutions\" estabeleça, implemente, mantenha e **melhore continuamente** um SGSI. O que significa \"manter\" o SGSI?", "options": [{"id": "a", "text": "a) Fazer alterações no SGSI apenas em resposta a incidentes."}, {"id": "b", "text": "b) Assegurar que o SGSI continue a operar de forma eficaz e que seus controles e processos estejam atualizados e funcionando."}, {"id": "c", "text": "c) Guardar toda a documentação do SGSI em um local seguro."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 6: A \"SmartCity Solutions\" está implementando um SGSI para gerenciar a segurança de sua infraestrutura urbana inteligente.", "theme": "organizacional"}, {"id": 97, "text": "97. A Alta Direção da \"SmartCity Solutions\" deve demonstrar seu comprometimento (Seção 5.1). Qual é um exemplo prático desse comprometimento?", "options": [{"id": "a", "text": "a) Deixar todas as decisões de segurança para os especialistas de TI."}, {"id": "b", "text": "b) Assegurar que os recursos necessários para o SGSI estejam disponíveis."}, {"id": "c", "text": "c) Participar apenas da reunião inicial de kickoff do projeto."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 6: A \"SmartCity Solutions\" está implementando um SGSI para gerenciar a segurança de sua infraestrutura urbana inteligente.", "theme": "organizacional"}, {"id": 98, "text": "98. Ao determinar o escopo do SGSI (Seção 4.3), a \"DataGuardians Inc.\" deve considerar as \"questões internas e externas\" referenciadas na Seção 4.1. Qual o propósito dessa consideração?", "options": [{"id": "a", "text": "a) Limitar o escopo do SGSI apenas às questões financeiras da organização."}, {"id": "b", "text": "b) Assegurar que o SGSI seja relevante e eficaz para o contexto operacional e estratégico da organização."}, {"id": "c", "text": "c) Ignorar as questões externas, focando apenas nos controles internos."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 7: A \"DataGuardians Inc.\" está definindo o escopo de seu SGSI, que inclui diferentes departamentos e serviços.", "theme": "organizacional"}, {"id": 99, "text": "99. O escopo do SGSI da \"DataGuardians Inc.\" deve estar disponível como \"informação documentada\" (Seção 4.3). Por que isso é importante?", "options": [{"id": "a", "text": "a) Apenas para satisfazer uma formalidade regulatória."}, {"id": "b", "text": "b) Para fornecer clareza e transparência sobre os limites e a aplicabilidade do SGSI, tanto interna quanto externamente."}, {"id": "c", "text": "c) Para que a organização possa alterá-lo secretamente a qualquer momento."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 7: A \"DataGuardians Inc.\" está definindo o escopo de seu SGSI, que inclui diferentes departamentos e serviços.", "theme": "organizacional"}, {"id": 100, "text": "100. A política de segurança da informação da \"CloudSecure Providers\" (Seção 5.2) deve:", "options": [{"id": "a", "text": "a) Ser um documento longo e detalhado que especifica todas as configurações de segurança."}, {"id": "b", "text": "b) Ser apropriada ao propósito da organização e incluir o comprometimento com a melhoria contínua do SGSI."}, {"id": "c", "text": "c) Ser acessível apenas aos membros da equipe de gestão de segurança."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 8: A \"CloudSecure Providers\" está elaborando sua política de segurança da informação e definindo objetivos.", "theme": "organizacional"}, {"id": 101, "text": "101. Os objetivos da segurança da informação da \"CloudSecure Providers\" (Seção 6.2) devem ser \"consistentes com a política da segurança da informação\". Qual a razão disso?", "options": [{"id": "a", "text": "a) Para garantir que os objetivos sejam difíceis de atingir e, assim, motivar a equipe."}, {"id": "b", "text": "b) Para assegurar que os objetivos estratégicos de segurança estejam alinhados às diretrizes e princípios estabelecidos na política."}, {"id": "c", "text": "c) Para que a política seja apenas uma formalidade, sem impacto nos objetivos."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 8: A \"CloudSecure Providers\" está elaborando sua política de segurança da informação e definindo objetivos.", "theme": "organizacional"}, {"id": 102, "text": "102. A ABNT NBR ISO/IEC 27001:2022 (0.1) destaca que \"É importante que um sistema de gestão da segurança da informação seja parte de, e esteja integrado com, os processos da organização\". Qual a implicação disso para a \"Analytics Insights Corp.\"?", "options": [{"id": "a", "text": "a) A segurança da informação deve ser tratada como um processo separado, com sua própria equipe e budget."}, {"id": "b", "text": "b) A segurança da informação não pode ser uma iniciativa isolada, mas deve ser incorporada aos processos de negócio e à governança da empresa."}, {"id": "c", "text": "c) A integração é opcional e depende da maturidade da organização em segurança."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 9: A \"Analytics Insights Corp.\" está revisando seus processos para integrar melhor a segurança da informação.", "theme": "organizacional"}, {"id": 103, "text": "103. A \"Analytics Insights Corp.\" deve determinar as necessidades e expectativas das partes interessadas (Seção 4.2). O que significa a nota que os \"requisitos das partes interessadas podem incluir requisitos legais e regulamentares, bem como obrigações contratuais\"?", "options": [{"id": "a", "text": "a) Que a organização só precisa considerar os requisitos que já estão em vigor."}, {"id": "b", "text": "b) Que esses requisitos são mandatórios e devem ser endereçados pelo SGSI para garantir a conformidade."}, {"id": "c", "text": "c) Que a organização pode escolher quais requisitos legais ou contratuais ela deseja atender."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 9: A \"Analytics Insights Corp.\" está revisando seus processos para integrar melhor a segurança da informação.", "theme": "organizacional"}, {"id": 104, "text": "104. A ABNT NBR ISO/IEC 27001:2022 (Seção 1) afirma que a exclusão de quaisquer requisitos das Seções 4 a 10 não é aceitável para a conformidade. O que isso significa para a \"ConnectIT\"?", "options": [{"id": "a", "text": "a) A ConnectIT pode decidir quais requisitos são relevantes para ela e excluir os demais."}, {"id": "b", "text": "b) Todos os requisitos das Seções 4 a 10 devem ser abordados e implementados para alcançar a certificação, sem exceção."}, {"id": "c", "text": "c) A ConnectIT deve justificar apenas as exclusões de controles do Anexo A."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 10: Uma startup recém-criada, \"ConnectIT\", pretende implementar a ISO 27001.", "theme": "organizacional"}, {"id": 105, "text": "105. A \"ConnectIT\" precisa estabelecer um SGSI (Seção 4.4). O que essa seção exige em relação aos processos dentro do SGSI?", "options": [{"id": "a", "text": "a) Apenas que os processos de segurança da informação sejam criados, independentemente de outros processos organizacionais."}, {"id": "b", "text": "b) Que o SGSI inclua os processos necessários e suas interações, de acordo com os requisitos da norma."}, {"id": "c", "text": "c) Que a documentação dos processos seja mínima para garantir agilidade na startup."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 10: Uma startup recém-criada, \"ConnectIT\", pretende implementar a ISO 27001.", "theme": "organizacional"}, {"id": 106, "text": "106. Para demonstrar liderança e comprometimento (Seção 5.1), a Alta Direção da TechGrow deve:", "options": [{"id": "a", "text": "a) Apenas aprovar os documentos finais do SGSI."}, {"id": "b", "text": "b) Orientar e apoiar pessoas a contribuir para a eficácia do sistema de gestão da segurança da informação."}, {"id": "c", "text": "c) Delegar completamente a gestão da segurança a um gerente de TI."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 11: A empresa \"TechGrow\" está na fase de planejamento de seu SGSI e a Alta Direção está definindo os papéis e responsabilidades.", "theme": "organizacional"}, {"id": 107, "text": "107. A política de segurança da informação da TechGrow (Seção 5.2) deve incluir o \"comprometimento de satisfazer os requisitos aplicáveis, relacionados com a segurança da informação\". Isso significa:", "options": [{"id": "a", "text": "a) Que a política deve listar todos os requisitos legais e regulamentares em vigor."}, {"id": "b", "text": "b) Que a política deve expressar a intenção da organização em cumprir com as obrigações pertinentes à segurança da informação."}, {"id": "c", "text": "c) Que a organização pode escolher quais requisitos aplicar."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 11: A empresa \"TechGrow\" está na fase de planejamento de seu SGSI e a Alta Direção está definindo os papéis e responsabilidades.", "theme": "organizacional"}, {"id": 108, "text": "108. Ao planejar as ações para abordar riscos e oportunidades (Seção 6.1.1), a \"DataSafe Analytics\" deve considerar principalmente qual objetivo?", "options": [{"id": "a", "text": "a) Reduzir os custos de implementação de controles de segurança."}, {"id": "b", "text": "b) Assegurar que o SGSI possa alcançar seus resultados pretendidos, prevenir ou reduzir efeitos indesejados e alcançar a melhoria contínua."}, {"id": "c", "text": "c) Identificar apenas as ameaças externas que a organização enfrenta."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 12: A \"DataSafe Analytics\" está avaliando riscos e oportunidades para seu SGSI.", "theme": "organizacional"}, {"id": 109, "text": "109. A \"DataSafe Analytics\" deve \"estabelecer e manter critérios para realizar as avaliações de riscos de segurança da informação\" (Seção 6.1.2 a) 2)). Qual a importância disso?", "options": [{"id": "a", "text": "a) Para garantir que as avaliações de risco sejam feitas de forma rápida e informal."}, {"id": "b", "text": "b) Para assegurar que as avaliações de riscos produzam resultados comparáveis, válidos e consistentes."}, {"id": "c", "text": "c) Para que a organização não precise documentar o processo de avaliação de riscos."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 12: A \"DataSafe Analytics\" está avaliando riscos e oportunidades para seu SGSI.", "theme": "organizacional"}, {"id": 110, "text": "110. A Declaração de Aplicabilidade (SoA) da \"HealthCloud Services\" (Seção 6.1.3 d)) deve conter, entre outros, \"se os controles necessários são implementados ou não\". O que isso indica?", "options": [{"id": "a", "text": "a) Apenas uma lista de controles que a organização pretende implementar no futuro."}, {"id": "b", "text": "b) O status atual de implementação de cada controle selecionado."}, {"id": "c", "text": "c) Uma lista de controles que a organização decidiu não implementar."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 13: A \"HealthCloud Services\" está elaborando sua Declaração de Aplicabilidade (SoA).", "theme": "organizacional"}, {"id": 111, "text": "111. A Alta Direção da \"HealthCloud Services\" precisa aprovar o plano de tratamento de riscos da segurança da informação e a aceitação dos riscos residuais (Seção 6.1.3 f)). Qual o propósito dessa aprovação?", "options": [{"id": "a", "text": "a) Apenas para que a alta direção seja informada, sem responsabilidade."}, {"id": "b", "text": "b) Garante que os riscos residuais sejam aceitos e que o plano de tratamento seja endossado pelos proprietários dos riscos e pela alta direção."}, {"id": "c", "text": "c) Para que a organização possa evitar a responsabilidade por incidentes futuros."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 13: A \"HealthCloud Services\" está elaborando sua Declaração de Aplicabilidade (SoA).", "theme": "organizacional"}, {"id": 112, "text": "112. Quando a \"Sistemas Digitais\" determinar a necessidade de mudanças no SGSI, como essas mudanças devem ser conduzidas, conforme a Seção 6.3?", "options": [{"id": "a", "text": "a) De forma urgente e sem planejamento detalhado."}, {"id": "b", "text": "b) De uma forma planejada, com controle e consideração de impactos."}, {"id": "c", "text": "c) Por meio de discussões informais entre os funcionários impactados."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 14: A \"Sistemas Digitais\" está planejando as mudanças em seu SGSI.", "theme": "organizacional"}, {"id": 113, "text": "113. A política de segurança da informação da \"Sistemas Digitais\" (Seção 5.2) deve \"fornecer a estrutura para estabelecer os objetivos de segurança da informação\". O que isso significa?", "options": [{"id": "a", "text": "a) A política deve definir os objetivos de segurança da informação de forma explícita."}, {"id": "b", "text": "b) A política deve estabelecer as diretrizes e os princípios a partir dos quais os objetivos de segurança serão desenvolvidos."}, {"id": "c", "text": "c) Os objetivos de segurança da informação são independentes da política."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 14: A \"Sistemas Digitais\" está planejando as mudanças em seu SGSI.", "theme": "organizacional"}, {"id": 114, "text": "114. A \"InfraSecure Tech\" deve determinar e prover os recursos necessários (Seção 7.1) para estabelecer, implementar, manter e melhorar continuamente o SGSI. Quais são os recursos essenciais?", "options": [{"id": "a", "text": "a) Apenas o software de segurança e o hardware de rede."}, {"id": "b", "text": "b) Pessoal competente, infraestrutura, ambiente, tecnologia e recursos financeiros."}, {"id": "c", "text": "c) Um programa de treinamento anual para todos os funcionários."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 15: A \"InfraSecure Tech\" está implementando seu SGSI e focando nos recursos e na competência do pessoal.", "theme": "organizacional"}, {"id": 115, "text": "115. Para garantir a \"competência\" do pessoal (Seção 7.2), a \"InfraSecure Tech\" deve:", "options": [{"id": "a", "text": "a) Contratar apenas funcionários com certificações de segurança da informação."}, {"id": "b", "text": "b) Assegurar que as pessoas são competentes com base em educação, treinamento ou experiência, e tomar ações para adquirir essa competência."}, {"id": "c", "text": "c) Realizar testes de QI para todos os novos contratados."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 15: A \"InfraSecure Tech\" está implementando seu SGSI e focando nos recursos e na competência do pessoal.", "theme": "organizacional"}, {"id": 116, "text": "116. Ao criar e atualizar a informação documentada (Seção 7.5.2), a \"Documenta Fácil Ltda.\" deve assegurar, de forma apropriada:", "options": [{"id": "a", "text": "a) Que todos os documentos sejam impressos em papel timbrado da empresa."}, {"id": "b", "text": "b) Identificação e descrição (título, data, autor), formato e meio, e análise crítica e aprovação para pertinência e adequação."}, {"id": "c", "text": "c) Que a informação documentada seja acessível apenas à alta direção, em formato digital."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 16: A \"Documenta Fácil Ltda.\" está implementando seu SGSI, com foco na gestão da informação documentada.", "theme": "organizacional"}, {"id": 117, "text": "117. O controle da informação documentada (Seção 7.5.3) para a \"Documenta Fácil Ltda.\" deve assegurar que ela esteja:", "options": [{"id": "a", "text": "a) Guardada em um cofre, com acesso limitado a poucos indivíduos."}, {"id": "b", "text": "b) Disponível e adequada para o uso, onde e quando necessário, e protegida adequadamente."}, {"id": "c", "text": "c) Publicada em um portal interno sem controle de versão ou acesso."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 16: A \"Documenta Fácil Ltda.\" está implementando seu SGSI, com foco na gestão da informação documentada.", "theme": "organizacional"}, {"id": 118, "text": "118. O Controle 5.9 do Anexo A exige um \"Inventário de informações e outros ativos associados\". Qual o objetivo deste inventário para a \"Gestão de Ativos Digitais\"?", "options": [{"id": "a", "text": "a) Apenas para fins contábeis e fiscais da empresa."}, {"id": "b", "text": "b) Desenvolver e manter um inventário completo de informações e ativos, incluindo seus proprietários."}, {"id": "c", "text": "c) Registrar apenas os ativos de hardware, ignorando informações."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 17: A \"Gestão de Ativos Digitais\" está implementando controles organizacionais do Anexo A.", "theme": "organizacional"}, {"id": 119, "text": "119. O Controle 5.10 do Anexo A aborda o \"Uso aceitável de informações e outros ativos associados\". O que a \"Gestão de Ativos Digitais\" deve implementar?", "options": [{"id": "a", "text": "a) Uma política flexível que permite qualquer uso, desde que não haja dano intencional."}, {"id": "b", "text": "b) Regras e procedimentos para o uso aceitável e manuseio de informações e ativos."}, {"id": "c", "text": "c) Uma proibição total de uso de ativos pessoais para fins de trabalho."}], "correct_option": "b", "domain": "Simulado 2 — Cenário 17: A \"Gestão de Ativos Digitais\" está implementando controles organizacionais do Anexo A.", "theme": "organizacional"}, {"id": 120, "text": "120. O Controle 5.12 do Anexo A exige a \"Classificação das informações\". Como a \"Gestão de Ativos Digitais\" deve classificar suas informações?",
