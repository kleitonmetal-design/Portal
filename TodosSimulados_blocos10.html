, o que não é o caso aqui.\n- C) Registros de auditorias internas — registros de auditorias internas são, de fato, informação documentada exigida pela cláusula 9.2 (como evidência do programa de auditoria e de seus resultados), mas o enunciado pede um exemplo citado na cláusula de 'suporte'/contexto de escopo — o escopo do SGSI (4.3) é a opção mais direta e frequentemente citada quando se fala em documentação obrigatória básica do SGSI.\n\n🔧 **Nota:** a alternativa A foi reconstruída neste gabarito porque seu texto estava ausente/corrompido na base de dados original do simulado. As alternativas B e C e a resposta correta são as originais do arquivo-fonte.", "dica": "", "resumo": "O escopo do SGSI é sempre informação documentada obrigatória (cláusula 4.3).\n---"}, "175": {"resposta_correta": "B) Plano de tratamento de riscos", "justificativa": "Ao planejar ações para tratar riscos e oportunidades (cláusula 6.1), a organização deve, especificamente para os riscos de segurança da informação identificados na avaliação de riscos, elaborar um plano de tratamento de riscos (cláusula 6.1.3), que formaliza quais opções de tratamento (mitigar, transferir, evitar, aceitar) e quais controles serão aplicados a cada risco, com responsáveis e prazos definidos.", "analisa": "- A) Plano de contingência — um plano de contingência é um artefato de continuidade de negócios/recuperação de desastres (pode estar relacionado ao controle A.5.29/A.5.30), mas não é o plano central e obrigatório exigido pela cláusula de planejamento de riscos e oportunidades do SGSI.\n- C) Plano de treinamento — um plano de treinamento é um artefato de apoio à competência (cláusula 7.2), não o documento central de resposta a riscos e oportunidades identificados no planejamento do SGSI.", "dica": "", "resumo": "Riscos e oportunidades → Plano de Tratamento de Riscos é o documento central da cláusula 6.1."}, "176": {"resposta_correta": "C) Avaliação de impacto na segurança", "justificativa": "A cláusula 8.1 (versão 2022) reforça que a organização deve planejar, implementar e controlar os processos necessários para atender requisitos de segurança da informação, mantendo controle sobre mudanças planejadas e analisando as consequências de mudanças não intencionais, tomando ações para mitigar quaisquer efeitos adversos. Diante de uma mudança não planejada, o controle prioritário é justamente avaliar o impacto/consequências dessa mudança na segurança da informação, para então decidir e agir sobre eventuais efeitos adversos.", "analisa": "- A) Aprovação orçamentária adicional para realizar a mudança — orçamento é uma questão de recursos (cláusula 7.1), não o controle técnico prioritário diante de uma mudança não planejada que já ocorreu ou está em curso.\n- B) Comunicação da mudança à equipe somente após sua conclusão — comunicar só depois que a mudança já foi concluída inverte a lógica de controle da cláusula 8.1, que exige avaliar e mitigar impactos antes que efeitos adversos se consolidem, não apenas informar retroativamente.\n\n🔧 **Nota:** as alternativas A e B foram reconstruídas neste gabarito porque seu texto estava ausente/corrompido na base de dados original do simulado. Como o gabarito original marcava a letra A como correta sem que seu conteúdo estivesse disponível, a resposta correta foi ajustada aqui para C, que é a alternativa cujo texto sempre esteve presente e que está tecnicamente alinhada à cláusula 8.1:2022.", "dica": "", "resumo": "Mudança não planejada → avaliar/mitigar o impacto na segurança da informação (cláusula 8.1, versão 2022).\n---"}, "177": {"resposta_correta": "B) Equipe de TI", "justificativa": "Embora a cláusula 7.4 (Comunicação) determine que a organização deve estabelecer o quê, quando, com quem, como e quem comunica, ela não atribui essa responsabilidade a um cargo específico — cabe à própria organização decidir. Na prática das implementações, essa definição normalmente é conduzida pela função/equipe responsável pela segurança da informação (frequentemente alocada ou apoiada pela área de TI em organizações menores), que estrutura o plano de comunicação do SGSI para aprovação da Alta Direção.", "analisa": "- A) Topo da gestão — embora a Alta Direção deva aprovar e apoiar a comunicação estratégica (cláusula 5.1), a cláusula 7.4 não atribui a ela a definição operacional detalhada de quê/quando/com quem/como comunicar — essa é uma atividade operacional, tipicamente delegada.\n- C) Auditor externo — um auditor externo não tem qualquer papel na definição dos processos de comunicação interna do SGSI; seu papel é avaliar a conformidade do sistema, não operá-lo.", "dica": "", "resumo": "Cláusula 7.4: a norma não nomeia o responsável — apenas exige que 'o quê, quando, com quem e como' sejam definidos pela organização."}, "178": {"resposta_correta": "B) Anexo A.15", "justificativa": "O controle relativo à segurança da informação em relações com fornecedores/terceirização — que garante que confidencialidade, integridade e disponibilidade sejam mantidas quando processos são externalizados — corresponde, na estrutura de 2013 do Anexo A, à cláusula A.15 (Relacionamento com fornecedores). Na ISO/IEC 27001:2022, esse mesmo conjunto de exigências foi reorganizado no tema Organizacional, sob os controles A.5.19 a A.5.23 (Segurança da informação nas relações com fornecedores, monitoramento, gestão de mudanças e uso de serviços em nuvem).", "analisa": "- A) Anexo A.12 – Segurança das operações — o Anexo A.12 (numeração 2013) tratava de segurança das operações (gestão de mudanças técnicas, backups, logs, gestão de vulnerabilidades), um tema diferente do relacionamento com fornecedores/terceirização.\n- C) Anexo A.5 — o Anexo A.5 (na numeração 2013) tratava de 'Políticas de segurança da informação', um tema distinto de relacionamento com fornecedores/terceirização.\n\n🔧 **Nota:** a alternativa A foi reconstruída neste gabarito porque seu texto estava ausente/corrompido na base de dados original do simulado. As alternativas B e C e a resposta correta são as originais do arquivo-fonte.\n\n⚠️ **Nota técnica:** esta questão utiliza a numeração do Anexo A da ISO/IEC 27001:2013 ('A.15'), que foi substituída na versão 2022 pelos controles A.5.19 a A.5.23 (tema Organizacional). Vale memorizar a equivalência, pois provas desatualizadas ou de transição podem citar a numeração antiga.", "dica": "", "resumo": "Fornecedores/terceirização: A.15 (Anexo A 2013) ≈ A.5.19–A.5.23 (Anexo A 2022).\n---"}, "179": {"resposta_correta": "B) Diagrama de Ishikawa", "justificativa": "A cláusula 4.1 exige que a organização determine as questões internas e externas relevantes para seu propósito e que afetam sua capacidade de alcançar os resultados pretendidos do SGSI. Ferramentas de análise estratégica como SWOT (forças, fraquezas, oportunidades, ameaças) e PESTLE (fatores políticos, econômicos, sociais, tecnológicos, legais e ambientais) são comumente utilizadas na prática para estruturar essa análise de contexto de forma sistemática.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa B (Diagrama de Ishikawa) como correta, mas essa afirmação está tecnicamente incorreta: o Ishikawa é ferramenta de análise de causa raiz (usada na cláusula 10.2, tratamento de não conformidades), e não uma ferramenta de análise de contexto organizacional (cláusula 4.1). A resposta tecnicamente correta, segundo a ISO/IEC 27001:2022 e a prática de mercado, é a alternativa A (Análise SWOT ou PESTLE). Recomenda-se estudar esta questão com a resposta correta sendo A, e não B.", "analisa": "- A) Análise SWOT ou PESTLE — esta é, na verdade, a alternativa tecnicamente correta (ver nota técnica abaixo) — SWOT e PESTLE são as ferramentas efetivamente usadas para estruturar a análise de contexto organizacional exigida pela cláusula 4.1.\n- C) Matriz de Eisenhower — a Matriz de Eisenhower é uma ferramenta de priorização de tarefas por urgência/importância (gestão pessoal de tempo), sem relação com a análise de contexto organizacional exigida pela cláusula 4.1.", "dica": "", "resumo": "Contexto da organização (4.1) → SWOT/PESTLE, não Ishikawa."}, "180": {"resposta_correta": "A) Ignorado, pois requisitos de fornecedores não são obrigatórios no SGSI", "justificativa": "Requisitos impostos por um fornecedor de serviços em nuvem — como a exigência contratual de cláusulas de SLA de segurança — configuram um requisito de parte interessada relevante, conforme a cláusula 4.2. Uma vez identificados, esses requisitos devem ser documentados e considerados na definição do escopo (4.3) e no planejamento do SGSI, podendo inclusive gerar riscos e controles específicos a serem tratados (6.1.2/6.1.3), e não apenas constar de forma isolada em um contrato comercial.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa A ('Ignorado, pois requisitos de fornecedores não são obrigatórios no SGSI') como correta, mas essa afirmação contraria diretamente a cláusula 4.2 da ISO/IEC 27001:2022, que exige que a organização determine as partes interessadas relevantes e seus requisitos, considerando-os no SGSI. A resposta tecnicamente correta é a alternativa B ('Documentado como um requisito de parte interessada e tratado no escopo do SGSI'). Recomenda-se estudar esta questão com a resposta correta sendo B, e não A.", "analisa": "- B) Documentado como um requisito de parte interessada e tratado no escopo do SGSI — esta é, na verdade, a alternativa tecnicamente correta (ver nota técnica abaixo) — requisitos de partes interessadas relevantes, como fornecedores críticos, devem sim ser documentados e tratados dentro do escopo/gestão de riscos do SGSI, e não ignorados.\n- C) Incluído apenas no contrato comercial, sem impacto no SGSI — restringir o requisito apenas ao contrato comercial, sem refletir no SGSI, contraria a cláusula 4.2: requisitos de partes interessadas relevantes devem ser considerados na definição do escopo e no tratamento de riscos do sistema de gestão, não apenas registrados comercialmente.", "dica": "", "resumo": "Requisito de parte interessada relevante (mesmo de fornecedor) deve ser documentado e tratado no escopo do SGSI — nunca ignorado."}, "181": {"resposta_correta": "A) O escopo pode excluir unidades de negócio desde que não processem informações críticas", "justificativa": "A cláusula 4.3 exige que, ao determinar o escopo do SGSI, a organização considere as interfaces e dependências entre as atividades realizadas por ela e as atividades realizadas por outras organizações (por exemplo, fornecedores, prestadores de serviço, parceiros). Isso garante que o escopo não seja definido de forma isolada, ignorando pontos de contato que possam introduzir riscos de segurança da informação ao SGSI.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa A como correta, mas o texto de A é uma afirmação problemática e não corresponde ao texto da cláusula 4.3. A alternativa tecnicamente correta, que reproduz literalmente um requisito da cláusula 4.3, é a alternativa B ('O escopo deve considerar interfaces e dependências com atividades externas à organização'). Recomenda-se estudar esta questão com a resposta correta sendo B.", "analisa": "- B) O escopo deve considerar interfaces e dependências com atividades externas à organização — esta é, na verdade, a alternativa tecnicamente correta (ver nota técnica abaixo) — o texto de B reproduz literalmente um requisito da cláusula 4.3 (considerar interfaces e dependências com atividades externas à organização).\n- C) O escopo é determinado exclusivamente pelo departamento de TI — o escopo do SGSI é uma decisão da Alta Direção/organização como um todo, com base no contexto (4.1) e nas partes interessadas (4.2) — não pode ser determinado exclusivamente pelo departamento de TI, já que envolve processos de negócio, pessoas e informação além da infraestrutura tecnológica.", "dica": "", "resumo": "Escopo do SGSI (4.3) sempre considera interfaces e dependências com atividades externas à organização."}, "182": {"resposta_correta": "B) Assegurar que os objetivos do SGSI estejam integrados aos processos de negócio da organização", "justificativa": "O comprometimento da Alta Direção (cláusula 5.1) vai além de aprovações formais: ele se demonstra de forma mais efetiva quando os objetivos de segurança da informação são integrados aos processos de negócio da organização, garantindo que a segurança da informação seja tratada como parte da estratégia e das operações, e não como uma atividade isolada de TI.", "analisa": "- A) Delegar toda a responsabilidade do SGSI ao gerente de TI — delegar toda a responsabilidade ao gerente de TI contraria a cláusula 5.1, que exige que a Alta Direção demonstre liderança e comprometimento ativo, mantendo a responsabilidade final pela eficácia do SGSI — segurança da informação não pode ser 'terceirizada' internamente sem envolvimento da liderança.\n- C) Aprovar o orçamento de TI anualmente sem monitoramento específico do SGSI — aprovar orçamento anualmente sem qualquer monitoramento específico do SGSI é uma demonstração passiva e insuficiente de comprometimento; a cláusula 5.1 exige envolvimento ativo, incluindo assegurar que recursos sejam adequados e que resultados sejam avaliados.", "dica": "", "resumo": "Liderança eficaz (5.1) = integrar segurança da informação aos processos de negócio, não apenas aprovar orçamento ou delegar tudo."}, "183": {"resposta_correta": "B) Disponível como informação documentada e comunicada dentro da organização e a partes interessadas relevantes", "justificativa": "A política de segurança da informação (cláusula 5.2) deve estar disponível como informação documentada, ser comunicada dentro da organização e estar disponível para as partes interessadas, conforme apropriado (cláusula 5.2 d, e). Isso não significa divulgação pública irrestrita, mas sim garantir que quem precisa conhecê-la — colaboradores, terceiros relevantes, partes interessadas pertinentes — tenha acesso a ela.", "analisa": "- A) Apenas internamente, mantida em sigilo para evitar análise por concorrentes — manter a política em sigilo absoluto, sem comunicação interna estruturada, contraria diretamente a cláusula 5.2, que exige comunicação e disponibilização apropriada da política dentro da organização.\n- C) Publicada somente no site da empresa sem distribuição interna formal — publicar a política apenas externamente (no site), sem qualquer distribuição interna formal, também descumpre a exigência de que a política seja comunicada dentro da organização — a comunicação interna é obrigatória, a externa é 'conforme apropriado'.", "dica": "", "resumo": "Política de SI: documentada, comunicada internamente e disponível a partes interessadas relevantes conforme apropriado — nunca mantida em sigilo total."}, "184": {"resposta_correta": "B) Todos os controles do Anexo A e seus respectivos objetivos de controle", "justificativa": "A cláusula 7.3 estabelece que as pessoas que trabalham sob o controle da organização devem estar cientes, no mínimo: (a) da política de segurança da informação; (b) de sua contribuição para a eficácia do SGSI, incluindo os benefícios da melhoria do desempenho da segurança da informação; e (c) das implicações de não estar em conformidade com os requisitos do SGSI. Não há exigência de conhecimento detalhado de todos os controles técnicos do Anexo A.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa B como correta, mas essa afirmação extrapola o requisito real da cláusula 7.3, que não exige conhecimento de todos os controles do Anexo A. A resposta tecnicamente correta, que reproduz o texto da cláusula 7.3, é a alternativa A. Recomenda-se estudar esta questão com a resposta correta sendo A.", "analisa": "- A) A política de segurança da informação, sua contribuição para o SGSI e as implicações da não conformidade — esta é, na verdade, a alternativa tecnicamente correta (ver nota técnica abaixo) — reproduz literalmente o conteúdo mínimo exigido pela cláusula 7.3 (política, contribuição para o SGSI e implicações da não conformidade).\n- C) Os resultados das últimas três auditorias internas realizadas — conhecer os resultados das últimas três auditorias internas não é um requisito de conscientização geral definido pela cláusula 7.3; auditorias internas (9.2) têm público e finalidade distintos.", "dica": "", "resumo": "Conscientização mínima (7.3): política + contribuição pessoal para o SGSI + implicações da não conformidade — nada além disso é exigido como mínimo."}, "185": {"resposta_correta": "B) O que, quando, com quem, como comunicar e quem deve comunicar", "justificativa": "A cláusula 7.4 (Comunicação) exige que a organização determine a necessidade de comunicações internas e externas relevantes ao SGSI, incluindo: o que comunicar, quando comunicar, com quem comunicar, como comunicar e quem comunica. Esses cinco elementos formam o conjunto completo exigido pela norma para um plano de comunicação estruturado.", "analisa": "- A) Apenas o canal de comunicação a ser utilizado — restringir a exigência apenas ao 'canal de comunicação' ignora os demais elementos obrigatórios da cláusula 7.4 (o quê, quando, com quem e quem comunica), que vão muito além da escolha do canal.\n- C) Somente as comunicações externas com reguladores e auditores — a cláusula 7.4 não se restringe a comunicações externas com reguladores/auditores — ela cobre de forma ampla comunicações internas e externas relevantes ao SGSI, incluindo comunicação interna a colaboradores.", "dica": "", "resumo": "Comunicação (7.4) = o quê + quando + com quem + como + quem comunica — os 5 elementos obrigatórios."}, "186": {"resposta_correta": "C) Que apenas a equipe de segurança tenha acesso à documentação do SGSI", "justificativa": "A cláusula 7.5.3 (Controle de informação documentada) exige que a informação documentada exigida pelo SGSI seja controlada para assegurar que esteja disponível e adequada para uso, onde e quando for necessária, e que esteja adequadamente protegida (por exemplo, contra perda de confidencialidade, uso impróprio ou perda de integridade). Isso envolve controles de distribuição, acesso, recuperação, uso, armazenamento, preservação, controle de alterações e retenção/disposição.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa C como correta, mas essa afirmação (acesso restrito apenas à equipe de segurança) contraria o texto da cláusula 7.5.3, que exige que a informação documentada esteja 'disponível e adequada para uso, onde e quando necessária' — ou seja, acessível a quem precisa dela, não restrita a um único grupo. A resposta tecnicamente correta é a alternativa B. Recomenda-se estudar esta questão com a resposta correta sendo B.", "analisa": "- A) Que toda documentação seja mantida em papel e assinada fisicamente — a norma não exige que a documentação seja mantida em papel e assinada fisicamente — a informação documentada pode estar em qualquer meio (eletrônico, físico), desde que seja controlada e adequadamente protegida.\n- B) Que a informação documentada esteja disponível, adequada para uso e protegida apropriadamente — esta é, na verdade, a afirmação tecnicamente correta segundo a cláusula 7.5.3 (ver nota técnica abaixo) — o controle exige exatamente disponibilidade, adequação para uso e proteção apropriada da informação documentada.", "dica": "", "resumo": "Controle de informação documentada (7.5.3) = disponível, adequada para uso e protegida — não é 'papel assinado' nem 'acesso restrito só à equipe de segurança'."}, "187": {"resposta_correta": "A) Transferir toda a responsabilidade de segurança ao fornecedor terceirizado", "justificativa": "A cláusula 8.1 estabelece que, quando processos são terceirizados, a organização deve assegurar que esses processos externalizados sejam determinados e controlados, mesmo sendo executados por terceiros. A responsabilidade final pela segurança da informação (accountability) permanece com a organização contratante — ela não pode transferir essa responsabilidade integralmente ao fornecedor, apenas delegar a execução operacional.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa A ('Transferir toda a responsabilidade de segurança ao fornecedor terceirizado') como correta, mas essa afirmação contraria um princípio central da gestão de fornecedores na ISO/IEC 27001: a accountability pela segurança da informação não pode ser transferida a terceiros. A resposta tecnicamente correta é a alternativa B. Recomenda-se estudar esta questão com a resposta correta sendo B.", "analisa": "- B) Assegurar que esses processos sejam controlados, mesmo quando executados por terceiros — esta é, na verdade, a afirmação tecnicamente correta (ver nota técnica abaixo) — a cláusula 8.1 exige que a organização assegure controle sobre processos terceirizados, mantendo a responsabilidade final, mesmo quando a execução é de terceiros.\n- C) Exigir apenas que o fornecedor possua certificação ISO 27001 vigente — exigir apenas que o fornecedor possua certificação ISO/IEC 27001 vigente é insuficiente: a organização ainda precisa definir e controlar requisitos específicos, monitorar o desempenho e gerenciar o relacionamento (controles A.5.19 a A.5.23), não bastando uma certificação de terceiros como garantia automática de controle adequado.", "dica": "", "resumo": "Terceirização (8.1) transfere execução, nunca a responsabilidade final pela segurança da informação."}, "188": {"resposta_correta": "B) Cláusula 9.3 – Análise crítica pela Direção", "justificativa": "A cláusula 6.3 ('Planejamento de mudanças'), incluída na revisão de 2022, exige que, quando a organização determina a necessidade de mudanças no SGSI (por exemplo, decorrentes de novas exigências regulatórias), essas mudanças sejam realizadas de forma planejada. É essa cláusula que trata diretamente da necessidade de mudanças planejadas no SGSI diante de fatores como alterações no contexto regulatório.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa B (cláusula 9.3 – Análise crítica pela Direção) como correta, mas a cláusula que trata diretamente do planejamento de mudanças no SGSI é a 6.3, adicionada especificamente na revisão de 2022. A análise crítica pela Direção (9.3) é uma atividade de avaliação periódica de desempenho, e pode gerar a necessidade de mudanças, mas não é ela mesma a cláusula que 'aborda diretamente' o planejamento das mudanças. A resposta tecnicamente correta é a alternativa A. Recomenda-se estudar esta questão com a resposta correta sendo A.", "analisa": "- A) Cláusula 6.3 – Planejamento de mudanças — esta é, na verdade, a alternativa tecnicamente correta (ver nota técnica abaixo) — a cláusula 6.3, nova na versão 2022, é exatamente o requisito que trata do planejamento de mudanças no SGSI.\n- C) Cláusula 10.2 – Não conformidade e ação corretiva — a cláusula 10.2 trata do tratamento de não conformidades e ações corretivas identificadas (por exemplo, em auditorias), não do planejamento proativo de mudanças decorrentes de novos requisitos regulatórios.", "dica": "", "resumo": "Necessidade de mudança planejada no SGSI → cláusula 6.3 (novidade da versão 2022)."}, "189": {"resposta_correta": "B) Definir critérios de aceitação de riscos", "justificativa": "Conforme a cláusula 6.1.2 a), antes mesmo de identificar riscos específicos, a organização deve estabelecer e manter critérios de risco de segurança da informação, incluindo critérios de aceitação de risco e critérios para realizar avaliações de risco. Definir esses critérios é o passo estrutural inicial que garante que as avaliações de risco produzam resultados consistentes, válidos e comparáveis ao longo do tempo — antes de partir para identificação de ameaças/vulnerabilidades ou avaliação de impactos específicos.", "analisa": "- A) Identificar ameaças e vulnerabilidades — identificar ameaças e vulnerabilidades é uma etapa de identificação de riscos, que ocorre depois de definidos os critérios de risco — sem critérios definidos, não há parâmetro para avaliar a relevância dos riscos identificados.\n- C) Avaliar impactos potenciais — avaliar impactos potenciais é parte da análise/avaliação de riscos, etapa posterior à identificação, e que também depende de critérios previamente definidos para ser realizada de forma consistente.", "dica": "", "resumo": "Antes de identificar ameaças/impactos, a norma exige definir os critérios de risco (6.1.2 a)."}, "190": {"resposta_correta": "B) Listar controles selecionados e justificativas", "justificativa": "A Declaração de Aplicabilidade (Statement of Applicability – SoA) é o documento, exigido pela cláusula 6.1.3 d), que relaciona os controles necessários (resultantes do tratamento de riscos e da comparação com o Anexo A), justifica sua inclusão, indica se estão implementados ou não, e justifica a exclusão de quaisquer controles do Anexo A considerados não aplicáveis. Seu propósito central é, portanto, listar os controles selecionados com as respectivas justificativas.", "analisa": "- A) Definir escopo — definir o escopo é objeto da cláusula 4.3, um documento anterior e distinto do SoA — o escopo delimita as fronteiras do SGSI, enquanto o SoA lista os controles aplicáveis dentro desse escopo.\n- C) Estabelecer política — estabelecer a política é objeto da cláusula 5.2, também um documento distinto — a política expressa o compromisso e a direção estratégica, não a lista de controles selecionados.", "dica": "", "resumo": "SoA = lista de controles selecionados, com justificativas de inclusão/exclusão e status de implementação."}, "191": {"resposta_correta": "A) Preferências pessoais de cada colaborador sobre o local de trabalho", "justificativa": "Ao definir o escopo do SGSI (cláusula 4.3), a organização deve considerar as questões internas/externas (4.1), os requisitos de partes interessadas (4.2) e as interfaces e dependências entre suas atividades e as de outras organizações. Preferências pessoais individuais de colaboradores sobre local de trabalho não fazem parte de nenhum desses critérios — é um fator organizacional/de RH que não influencia a definição técnica do escopo do SGSI, sendo, portanto, o fator corretamente excluído dessa análise.", "analisa": "- B) Interfaces e dependências com atividades realizadas por outras organizações — esta é exatamente um dos fatores que a cláusula 4.3 exige que seja considerado ao definir o escopo, portanto não é um fator excluído.\n- C) Localização geográfica irrelevante — afirmar que a localização geográfica é 'irrelevante' para o escopo do SGSI está incorreto: ela é, na prática, um dos critérios comumente usados para delimitar fisicamente o escopo (por exemplo, escopo limitado a um datacenter ou site específico), sendo, portanto, normalmente considerada, e não excluída.\n\n🔧 **Nota:** as alternativas A e B foram reconstruídas neste gabarito porque seu texto estava ausente/corrompido na base de dados original do simulado. A resposta correta foi ajustada aqui para A, que é tecnicamente o fator que não integra os critérios de definição de escopo da cláusula 4.3 — diferente da alternativa C, cuja premissa ('localização é irrelevante') é, na verdade, questionável.", "dica": "", "resumo": "Escopo do SGSI considera contexto, partes interessadas e interfaces com terceiros — preferências pessoais de colaboradores não entram nessa conta.\n---"}, "192": {"resposta_correta": "B) Ambígua", "justificativa": "Os objetivos de segurança da informação (cláusula 6.2) devem seguir, sempre que possível, o critério SMART: Específicos (Specific), Mensuráveis (Measurable), Atingíveis/Alcançáveis (Achievable), Relevantes (Relevant) e com prazo definido (Time-bound). 'Ambígua' é justamente o oposto de 'Específica' — um objetivo ambíguo não permite avaliação clara de seu alcance, contrariando a própria lógica SMART.", "analisa": "- A) Específica — 'Específica' é, de fato, um dos critérios SMART (o 'S'), portanto não é a resposta correta para 'o que NÃO é um critério SMART'.\n- C) Mensurável — 'Mensurável' é, de fato, um dos critérios SMART (o 'M'), portanto também não é a resposta correta para o que se pede.", "dica": "", "resumo": "SMART = Específico, Mensurável, Atingível, Relevante, Temporal — 'Ambíguo' é o oposto disso."}, "193": {"resposta_correta": "B) Transferir", "justificativa": "Entre as opções clássicas de tratamento de risco (aceitar, evitar, transferir/compartilhar e modificar/mitigar), a opção 'transferir' é a que tipicamente envolve mecanismos como contratação de seguros, terceirização com transferência contratual de responsabilidade financeira, ou cláusulas contratuais que repassam parte do risco a terceiros (ex.: seguradoras ou fornecedores).", "analisa": "- A) Aceitar — 'aceitar' significa que a organização decide conviver com o risco residual dentro dos critérios de aceitação definidos, sem necessidade de contratar seguro ou aplicar controles adicionais.\n- C) Reduzir — 'reduzir' (modificar/mitigar) envolve a implementação de controles para diminuir a probabilidade ou o impacto do risco, e não a contratação de seguro, que é característica da transferência.", "dica": "", "resumo": "Seguro = transferência de risco. Simples assim."}, "194": {"resposta_correta": "C) Plano de projeto com marcos", "justificativa": "No planejamento da implementação do SGSI, uma ferramenta amplamente recomendada para acompanhar cronograma, recursos e entregas é o plano de projeto com marcos (milestones), que permite visualizar prazos, dependências entre atividades e pontos de controle intermediários, facilitando o monitoramento do progresso da implementação frente ao planejado.", "analisa": "- A) Planilha de horas trabalhadas sem vínculo com entregas do projeto — registrar apenas horas trabalhadas, sem relacioná-las a entregas ou marcos do projeto, não permite avaliar se o cronograma e os objetivos de implementação estão sendo cumpridos.\n- B) Apenas reuniões informais semanais, sem registro formal de progresso — reuniões sem registro formal não constituem uma ferramenta de monitoramento estruturada; sem evidência documentada, não é possível rastrear o progresso real frente ao planejado ao longo do tempo.\n\n🔧 **Nota:** as alternativas A e B foram reconstruídas neste gabarito porque seu texto estava ausente/corrompido na base de dados original do simulado. A resposta correta foi ajustada aqui para C, que é a alternativa cujo texto sempre esteve presente e que representa a prática de mercado tecnicamente adequada para o tema.", "dica": "", "resumo": "Planejamento da implementação = cronograma + recursos + marcos de controle do projeto, monitorados de forma estruturada.\n---"}, "195": {"resposta_correta": "B) Cláusula 5.2", "justificativa": "A aprovação da Declaração de Aplicabilidade (SoA) e a autorização para operar o SGSI, incluindo a aceitação dos riscos residuais, são exigências da cláusula 6.1.3 (Tratamento de riscos de segurança da informação), especificamente nos itens d) e e), que tratam de produzir a SoA e obter aprovação dos proprietários dos riscos para o plano de tratamento e para os riscos residuais.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa B (Cláusula 5.2) como correta, mas essa cláusula trata da política de segurança da informação, não da aprovação do SoA. A cláusula que efetivamente sustenta a produção, aprovação e uso do SoA no processo de tratamento de riscos é a 6.1.3. A resposta tecnicamente correta é a alternativa A. Recomenda-se estudar esta questão com a resposta correta sendo A.", "analisa": "- A) Cláusula 6.1.3 — esta é, na verdade, a alternativa tecnicamente correta (ver nota técnica abaixo) — é a cláusula 6.1.3, e não a 5.2, que sustenta a produção e a aprovação do SoA e a aceitação dos riscos residuais.\n- C) Cláusula 7.5 — a cláusula 7.5 trata de informação documentada em geral (criação, controle, atualização de documentos), e não especificamente da aprovação do SoA como parte do processo de tratamento de riscos.", "dica": "", "resumo": "Aprovação do SoA e dos riscos residuais → cláusula 6.1.3 (não 5.2, que é a política)."}, "196": {"resposta_correta": "B) Definir o escopo e iniciar o processo de avaliação de riscos", "justificativa": "Após concluir a análise do contexto da organização (cláusula 4), a sequência lógica da norma segue para a definição do escopo do SGSI (4.3) e, em seguida, para o planejamento (cláusula 6), que inclui o processo de avaliação de riscos (6.1.2). Não é correto avançar diretamente para a implementação de controles do Anexo A sem antes definir escopo e avaliar riscos, pois é a avaliação de riscos que determina quais controles são de fato necessários.", "analisa": "- A) Implementar imediatamente os controles do Anexo A — implementar controles do Anexo A antes de definir escopo e avaliar riscos inverte a lógica do PDCA aplicado ao SGSI — controles devem ser selecionados com base em riscos identificados, não escolhidos previamente 'no escuro'.\n- C) Obter a certificação provisória do SGSI — não existe 'certificação provisória' prevista pela ISO/IEC 27001 — a certificação (por organismo acreditado) só ocorre após o SGSI estar implementado, operando e tendo passado por auditoria externa formal.", "dica": "", "resumo": "Depois do contexto vem escopo + avaliação de riscos — nunca 'pular direto' para implementar controles do Anexo A."}, "197": {"resposta_correta": "B) Ser responsável por autorizar o plano de tratamento e aceitar os riscos residuais", "justificativa": "O proprietário do risco (risk owner), exigido pela cláusula 6.1.2 c) 2), é a pessoa ou entidade com a responsabilidade e a autoridade para gerenciar um risco específico — cabendo a ele aprovar o plano de tratamento de riscos referente a esse risco e aceitar formalmente o nível de risco residual após a aplicação dos controles selecionados.", "analisa": "- A) Executar todos os controles relacionados ao risco identificado — o proprietário do risco não precisa necessariamente executar operacionalmente todos os controles relacionados — sua função é de responsabilidade e decisão sobre o risco, podendo delegar a execução técnica dos controles a outras equipes.\n- C) Reportar todos os riscos identificados diretamente ao auditor externo — não há exigência de que o proprietário do risco reporte diretamente a um auditor externo; a comunicação de riscos segue os canais internos definidos pela organização (cláusula 7.4), e auditores externos avaliam o SGSI periodicamente, não recebem relatórios operacionais diretos de proprietários de risco.", "dica": "", "resumo": "Proprietário do risco = autoridade para aprovar o tratamento e aceitar o risco residual."}, "198": {"resposta_correta": "B) O nível de risco que a organização está disposta a aceitar ou tolerar", "justificativa": "Os critérios de aceitação de risco, exigidos pela cláusula 6.1.2 a) 2), definem o nível de risco que a organização está disposta a aceitar ou tolerar em relação aos seus objetivos de segurança da informação. Esses critérios servem de referência para decidir, na etapa de avaliação de riscos, quais riscos exigem tratamento e quais podem ser aceitos sem ação adicional.", "analisa": "- A) O valor monetário máximo de perda aceito pela organização — restringir o critério de aceitação a um 'valor monetário máximo de perda' é uma abordagem excessivamente simplista — a norma não exige que o critério seja necessariamente financeiro; pode envolver escalas qualitativas ou combinadas (probabilidade x impacto), e não apenas valor monetário.\n- C) A lista de riscos que serão automaticamente transferidos para seguradoras — definir previamente uma 'lista de riscos automaticamente transferidos para seguradoras' inverte a lógica do processo — a decisão sobre qual opção de tratamento aplicar (aceitar, transferir, mitigar, evitar) vem depois da avaliação do risco frente aos critérios definidos, e não como uma lista pré-definida e automática.", "dica": "", "resumo": "Critério de aceitação de risco = o nível de risco que a organização tolera — referência para decidir quando tratar ou aceitar."}, "199": {"resposta_correta": "A) Apenas os controles selecionados para implementação", "justificativa": "Conforme a cláusula 6.1.3 d), a Declaração de Aplicabilidade (SoA) deve conter, obrigatoriamente: os controles necessários (com base no resultado do tratamento de riscos e na comparação com o Anexo A), a justificativa para sua inclusão, se estão implementados ou não, e a justificativa para exclusão de quaisquer controles do Anexo A considerados não aplicáveis. Um SoA que apenas liste controles, sem justificativas e status, não atende a esse requisito.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa A ('Apenas os controles selecionados para implementação') como correta, mas essa afirmação é incompleta frente ao texto da cláusula 6.1.3 d), que exige também a justificativa de inclusão/exclusão e o status de implementação. A resposta tecnicamente correta e completa é a alternativa B. Recomenda-se estudar esta questão com a resposta correta sendo B.", "analisa": "- B) Os controles necessários, a justificativa para inclusão ou exclusão e o status de implementação — esta é, na verdade, a alternativa tecnicamente correta e completa (ver nota técnica abaixo) — reúne os três elementos obrigatórios exigidos pela cláusula 6.1.3 d) (controles necessários, justificativa de inclusão/exclusão e status de implementação).\n- C) O resultado detalhado de todas as avaliações de risco realizadas — o SoA não precisa conter o resultado detalhado de todas as avaliações de risco realizadas — esse detalhamento fica registrado no relatório/matriz de avaliação de riscos (6.1.2), um documento distinto e complementar ao SoA.", "dica": "", "resumo": "SoA obrigatório = controles necessários + justificativa de inclusão/exclusão + status de implementação (os três juntos, não apenas um)."}, "200": {"resposta_correta": "B) Implementar controles para reduzir a probabilidade ou impacto do risco", "justificativa": "A opção de tratamento de risco 'modificar' (também chamada de mitigar) consiste em implementar controles adicionais ou reforçar controles existentes para reduzir a probabilidade de ocorrência do risco e/ou o impacto caso ele se materialize, trazendo o risco a um nível aceitável conforme os critérios definidos pela organização (cláusula 6.1.2 a).", "analisa": "- A) Encerrar a atividade que deu origem ao risco — encerrar a atividade que originou o risco descreve a opção 'evitar', não 'modificar/mitigar' — evitar elimina a fonte do risco, enquanto modificar reduz sua probabilidade/impacto mantendo a atividade.\n- C) Transferir o risco para um terceiro via contrato de seguro — transferir o risco via contrato de seguro descreve a opção 'transferir/compartilhar', não 'modificar' — são opções de tratamento distintas dentro do mesmo processo de tratamento de riscos.", "dica": "", "resumo": "Modificar/Mitigar = implementar controles para reduzir probabilidade ou impacto do risco."}, "201": {"resposta_correta": "C) Serem comunicados e disponíveis como informação documentada", "justificativa": "A cláusula 6.2 exige que os objetivos de segurança da informação sejam, entre outras características, consistentes com a política de SI, mensuráveis (se praticável), monitorados, comunicados e disponibilizados como informação documentada, além de atualizados conforme apropriado. Manter os objetivos 'secretos' para proteger a estratégia de segurança não é uma característica exigida pela norma — pelo contrário, ela exige comunicação e disponibilização.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa C ('Serem comunicados e disponíveis como informação documentada') como a característica NÃO exigida, mas essa é justamente uma exigência explícita da cláusula 6.2. A característica que, de fato, NÃO é exigida pela norma é a alternativa B ('Serem secretos para proteger a estratégia de segurança'). Recomenda-se estudar esta questão com a resposta correta sendo B.", "analisa": "- A) Serem monitorados e atualizados — 'serem monitorados e atualizados' é, de fato, uma exigência explícita da cláusula 6.2 — portanto não é a resposta correta para 'o que NÃO é exigido'.\n- B) Serem secretos para proteger a estratégia de segurança — esta é, na verdade, a alternativa tecnicamente correta para a pergunta feita (ver nota técnica abaixo) — 'serem secretos para proteger a estratégia de segurança' é justamente a característica que a norma NÃO exige (ao contrário, a 6.2 pede comunicação e disponibilização).", "dica": "", "resumo": "Objetivos de SI (6.2) devem ser comunicados e documentados — 'mantê-los em segredo' NÃO é exigência da norma."}, "202": {"resposta_correta": "B) Verificar se nenhum controle necessário foi omitido inadvertidamente", "justificativa": "Ao selecionar controles para o tratamento de riscos, a cláusula 6.1.3 c) exige que a organização compare os controles determinados como necessários com os do Anexo A e verifique se nenhum controle necessário foi omitido. Esse é um mecanismo de checagem cruzada (cross-check), não uma exigência de implementar todos os 93 controles — a norma permite exclusões justificadas.", "analisa": "- A) Garantir que todos os 93 controles do Anexo A sejam implementados sem exceção — não é exigido implementar todos os 93 controles do Anexo A sem exceção; a seleção de controles deve ser baseada em risco, e controles não aplicáveis podem (e devem) ser excluídos com justificativa no SoA.\n- C) Confirmar que os controles selecionados estão aprovados pela alta direção — a confirmação de aprovação pela Alta Direção é parte do processo de aprovação do plano de tratamento de riscos e do SoA (6.1.3 e), mas não é o objetivo específico da comparação com o Anexo A, que é evitar omissões de controles necessários.", "dica": "", "resumo": "Comparação com o Anexo A = checagem de completude, não obrigação de implementar os 93 controles."}, "203": {"resposta_correta": "B) O escopo deve ser claramente documentado descrevendo os limites, interfaces e dependências", "justificativa": "A cláusula 4.3 exige que o escopo do SGSI seja documentado de forma clara, considerando os limites e a aplicabilidade do sistema, bem como interfaces e dependências. Uma implementação por fases, começando pela área de TI, é perfeitamente válida, desde que o escopo documentado descreva claramente esses limites, interfaces e dependências com as demais áreas da organização não incluídas inicialmente.", "analisa": "- A) O escopo deve sempre cobrir toda a organização para ser válido — não é verdade que o escopo deva sempre cobrir toda a organização — a norma permite escopos parciais (por exemplo, uma unidade de negócio, um serviço ou uma área específica), desde que devidamente documentados e delimitados.\n- C) O escopo parcial inviabiliza a certificação ISO 27001 — um escopo parcial não inviabiliza a certificação ISO/IEC 27001; certificações com escopo restrito (por exemplo, 'gestão de segurança da informação para os serviços de TI da unidade X') são comuns e válidas, desde que corretamente documentadas e comunicadas.", "dica": "", "resumo": "Escopo parcial é válido, desde que bem documentado com limites, interfaces e dependências claras."}, "204": {"resposta_correta": "C) Pelo auditor interno antes de qualquer implementação", "justificativa": "Conforme a cláusula 6.1.3 e), o plano de tratamento de riscos deve ser formulado e, então, deve ser obtida a aprovação dos proprietários de riscos (risk owners) para o plano de tratamento e para a aceitação dos riscos residuais. Além disso, a Alta Direção, no exercício de sua liderança (cláusula 5.1), assegura que os recursos necessários para a implementação desse plano sejam disponibilizados e endossa formalmente o SGSI.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa C ('Pelo auditor interno antes de qualquer implementação') como correta, mas essa afirmação contraria o papel do auditor interno, que é avaliar de forma independente a conformidade do SGSI (cláusula 9.2), e não aprovar planos de tratamento de risco — isso comprometeria sua independência. A resposta tecnicamente correta, alinhada à cláusula 6.1.3 e), é a alternativa B. Recomenda-se estudar esta questão com a resposta correta sendo B.", "analisa": "- A) Apenas pelo gerente de segurança da informação — restringir a aprovação apenas ao gerente de segurança da informação não atende à exigência de que os proprietários de riscos aceitem formalmente os riscos residuais — a aprovação não é uma decisão unilateral de um único gestor técnico.\n- B) Pelos proprietários de riscos e pela Alta Direção — esta é, na verdade, a alternativa tecnicamente correta segundo a cláusula 6.1.3 e) (ver nota técnica abaixo) — a aprovação cabe aos proprietários de riscos (para aceitar o risco residual) e à Alta Direção (para apoiar e viabilizar a execução do plano).", "dica": "", "resumo": "Plano de tratamento de riscos: aprovado pelos proprietários dos riscos e pela Alta Direção — nunca pelo auditor interno."}, "205": {"resposta_correta": "A) Infraestrutura de hardware para os sistemas de segurança", "justificativa": "A cláusula 7.1 exige que a organização determine e forneça os recursos necessários para estabelecer, implementar, manter e melhorar continuamente o SGSI. Na prática de implementação, a competência humana — incluindo o tempo, o treinamento e, eventualmente, a contratação de especialistas em segurança da informação — é frequentemente subestimada em relação a investimentos mais visíveis como hardware e software, apesar de ser essencial para operar e manter o sistema de forma eficaz.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa A ('Infraestrutura de hardware') como correta, mas a prática de implementação de SGSI (e a literatura de referência PECB) aponta a competência humana como o recurso mais frequentemente subestimado, não a infraestrutura de hardware, que costuma ser mais visível e orçada com antecedência. A resposta tecnicamente mais defensável é a alternativa B. Recomenda-se considerar essa nuance ao revisar esta questão.", "analisa": "- B) Competência humana, incluindo treinamentos e contratação de especialistas — esta é, na verdade, a alternativa tecnicamente correta (ver nota técnica abaixo) — recursos de competência/pessoas costumam ser mais frequentemente subestimados do que os investimentos em infraestrutura, que tendem a ser mais visíveis e fáceis de orçar.\n- C) Software de gestão de vulnerabilidades e SIEM — softwares de gestão de vulnerabilidades e SIEM, embora representem investimentos significativos, costumam ser mais facilmente identificados e orçados no planejamento tecnológico do que os recursos de competência humana continuada (treinamento, retenção de especialistas), que exigem investimento recorrente e são mais difíceis de quantificar antecipadamente.", "dica": "", "resumo": "O recurso mais subestimado na implementação de um SGSI costuma ser a competência humana, não a infraestrutura tecnológica."}, "206": {"resposta_correta": "B) Senha + biometria", "justificativa": "O controle de acesso lógico busca assegurar que apenas usuários autorizados e devidamente autenticados acessem sistemas e informações. Um método comum de autenticação forte é a autenticação multifator (MFA), combinando algo que o usuário sabe (senha) com algo que o usuário é (biometria) — reduzindo significativamente o risco de comprometimento de credenciais em comparação com um único fator.", "analisa": "- A) Apenas senha — usar apenas senha é um único fator de autenticação, mais vulnerável a ataques como força bruta, phishing e reutilização de credenciais — não caracteriza autenticação forte.\n- C) Token sem expiração — um token sem expiração é uma prática de segurança fraca, pois credenciais/tokens sem prazo de validade aumentam o risco de uso indevido prolongado em caso de comprometimento, contrariando boas práticas de gestão de acesso.", "dica": "", "resumo": "Autenticação forte = múltiplos fatores (ex.: senha + biometria), nunca senha isolada ou token perpétuo."}, "207": {"resposta_correta": "B) Lista de participantes", "justificativa": "Para demonstrar competência (cláusula 7.2) e a eficácia das ações de treinamento, a organização deve manter evidências não apenas de que as pessoas participaram de um treinamento, mas também de que esse treinamento foi eficaz — por exemplo, por meio de avaliações pós-treinamento, testes práticos (como simulações de phishing) ou indicadores de melhoria de comportamento. Registros de participação isolados não comprovam eficácia.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa B ('Lista de participantes') como correta, mas essa evidência, isoladamente, é insuficiente frente à cláusula 7.2, que exige evidência de competência (o que inclui, na prática, avaliar a eficácia das ações de treinamento tomadas). A alternativa mais completa e tecnicamente correta é a A ('Registros de participação e eficácia'). Recomenda-se estudar esta questão com a resposta correta sendo A.", "analisa": "- A) Registros de participação e eficácia — não se aplica aqui, pois 'Registros de participação e eficácia' é justamente a alternativa tecnicamente mais completa e correta para o que a cláusula 7.2 exige.\n- C) Certificados genéricos — certificados genéricos, sem vínculo com o conteúdo específico e sem evidência de avaliação de eficácia, não atendem plenamente ao requisito de demonstrar competência de forma objetiva conforme a cláusula 7.2.", "dica": "", "resumo": "Evidência de treinamento eficaz = participação + comprovação de eficácia, não apenas lista de presença."}, "208": {"resposta_correta": "A) Identificação, registro e classificação inicial do incidente", "justificativa": "A gestão de incidentes de segurança da informação (controles A.5.24 a A.5.28 na numeração 2022, equivalentes ao antigo A.16 de 2013) segue um ciclo que começa pela detecção e identificação/relato do incidente (registro do evento e classificação inicial), etapa que precede a contenção, a erradicação e a recuperação. Sem essa etapa inicial de identificação e registro, não é possível sequer iniciar a resposta ao incidente.", "analisa": "- B) Divulgação pública do incidente a todas as partes interessadas — divulgar publicamente um incidente antes mesmo de identificá-lo, registrá-lo e classificá-lo corretamente pode gerar pânico desnecessário, informações incorretas e, em muitos casos, contraria políticas de comunicação de crise e obrigações legais que exigem análise prévia antes da divulgação.\n- C) Contenção e erradicação — contenção e erradicação são etapas importantes do processo de resposta a incidentes, mas ocorrem depois da identificação/detecção e do registro inicial do evento — não são o 'primeiro passo' do processo.\n\n🔧 **Nota:** as alternativas A e B foram reconstruídas neste gabarito porque seu texto estava ausente/corrompido na base de dados original do simulado. A resposta correta foi ajustada aqui para A, coerente com o ciclo padrão de gestão de incidentes (identificação antes de contenção/erradicação).", "dica": "", "resumo": "Antes de conter e erradicar um incidente, é preciso identificá-lo e registrá-lo — essa é sempre a primeira etapa.\n---"}, "209": {"resposta_correta": "B) Cláusula 8.1.4", "justificativa": "O controle de segurança da informação nas relações com fornecedores está previsto, na estrutura de 2022, nos controles A.5.19 a A.5.23 (tema Organizacional), que exigem que os acordos com fornecedores especifiquem os requisitos de segurança da informação aplicáveis, incluindo responsabilidades de cada parte. Já no corpo principal da norma, é a cláusula 8.1 (Planejamento e controle operacional) que exige que processos terceirizados sejam determinados e controlados.\n\n⚠️ **Nota técnica:** A numeração '8.1.4' citada na alternativa B não corresponde a nenhuma subcláusula real da ISO/IEC 27001:2022 (a estrutura oficial não subdivide a cláusula 8.1 dessa forma). A explicação acima trata do conceito correto — controle de processos terceirizados via cláusula 8.1 e controles A.5.19 a A.5.23 do Anexo A — em vez de validar um número de cláusula que não existe na norma.", "analisa": "- A) Cláusula 7.1.2 — não existe, na estrutura da ISO/IEC 27001:2022, uma subcláusula numerada '7.1.2' que trate especificamente de acordos com fornecedores — a cláusula 7.1 trata de recursos de forma geral.\n- C) Cláusula 9.1 — a cláusula 9.1 trata de monitoramento, medição, análise e avaliação de desempenho do SGSI, e não da definição de responsabilidades contratuais de segurança da informação com fornecedores.", "dica": "", "resumo": "Fornecedores/terceirização: cláusula 8.1 (controle operacional) + controles A.5.19–A.5.23 (Anexo A) — não existe cláusula '8.1.4' na norma."}, "210": {"resposta_correta": "B) DES", "justificativa": "Entre os algoritmos citados, o AES-256 (Advanced Encryption Standard, com chave de 256 bits) é atualmente reconhecido como um algoritmo de criptografia simétrica robusto e amplamente aceito por padrões de segurança da informação (incluindo diretrizes que apoiam o controle A.8.24 – Uso de criptografia), sendo adequado para proteger dados em trânsito e em repouso.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa B (DES) como correta, mas essa afirmação está tecnicamente incorreta: o DES é um algoritmo obsoleto e inseguro, não aprovado para uso atual. A resposta tecnicamente correta é a alternativa A (AES-256). Recomenda-se estudar esta questão com a resposta correta sendo A.", "analisa": "- A) AES-256 — esta é, na verdade, a alternativa tecnicamente correta (ver nota técnica abaixo) — o AES-256 é o algoritmo robusto e atualmente recomendado, ao contrário do DES, que é obsoleto e inseguro.\n- C) MD5 — o MD5 não é sequer um algoritmo de criptografia (cifragem) — é uma função de hash, e além disso é considerada criptograficamente quebrada (vulnerável a colisões), não sendo apropriada para proteger a confidencialidade de dados em trânsito.", "dica": "", "resumo": "DES e MD5 são obsoletos/inseguros; AES-256 é o algoritmo robusto e atualmente recomendado."}, "211": {"resposta_correta": "C) Aprovação separada de pagamentos", "justificativa": "A segregação de funções (segregation of duties) é um controle preventivo clássico contra fraude e erro, que consiste em dividir tarefas e responsabilidades conflitantes entre diferentes pessoas, de modo que nenhuma pessoa sozinha consiga executar e ocultar uma ação fraudulenta de ponta a ponta. A separação entre quem solicita/executa um pagamento e quem o aprova (aprovação separada de pagamentos) é um exemplo clássico e frequentemente citado desse controle.", "analisa": "- A) Uma mesma pessoa solicitar, aprovar e executar o pagamento — este é exatamente o cenário oposto à segregação de funções: concentrar todas as etapas em uma única pessoa é o que a segregação de funções busca evitar, pois facilita a ocultação de fraudes.\n- B) Compartilhar as mesmas credenciais de acesso entre toda a equipe financeira — compartilhar credenciais elimina a rastreabilidade individual das ações e vai na direção contrária da segregação de funções, dificultando inclusive a auditoria de quem realmente executou cada transação.\n\n🔧 **Nota:** as alternativas A e B foram reconstruídas neste gabarito porque seu texto estava ausente/corrompido na base de dados original do simulado. A resposta correta foi ajustada aqui para C, que é a alternativa cujo texto sempre esteve presente e que já é, por si só, um exemplo tecnicamente correto e clássico de segregação de funções.", "dica": "", "resumo": "Segregação de funções = separar quem executa de quem aprova/valida — reduz risco de fraude não detectada.\n---"}, "212": {"resposta_correta": "A) Auditoria interna", "justificativa": "Mudanças que afetam o SGSI durante a implementação devem ser controladas de forma estruturada. A cláusula 8.1 (corpo da norma) exige o planejamento e controle operacional dos processos, e o controle A.8.32 do Anexo A (tema Tecnológico) trata especificamente de gestão de mudanças, exigindo que mudanças em recursos de processamento e sistemas de informação sejam sujeitas a procedimentos de controle de mudanças.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa A ('Auditoria interna') como correta, mas auditoria interna é um processo de avaliação de conformidade, não de controle de mudanças. A resposta tecnicamente correta é a alternativa B ('Controle de mudanças'). Vale notar também que a numeração '8.1.3' citada na alternativa B não corresponde a uma subcláusula oficial da ISO/IEC 27001:2022 (o controle de mudanças, no Anexo A 2022, está no controle A.8.32); ainda assim, o conceito descrito por essa alternativa (controle de mudanças) é o tecnicamente correto para a pergunta. Recomenda-se estudar esta questão com a resposta correta sendo B.", "analisa": "- B) Controle de mudanças (8.1.3) — esta é, na verdade, a alternativa tecnicamente correta (ver nota técnica abaixo) — controle de mudanças é o processo operacional (cláusula 8.1/controle A.8.32) que efetivamente gerencia alterações técnicas ou organizacionais durante a implementação/operação.\n- C) Revisão de gestão — revisão de gestão (análise crítica pela Direção, cláusula 9.3) é uma atividade periódica de avaliação estratégica de desempenho do SGSI pela Alta Direção, e não o processo operacional que controla mudanças técnicas ou organizacionais no dia a dia.", "dica": "", "resumo": "Controle de mudanças é processo operacional contínuo (8.1/A.8.32) — diferente de auditoria interna e de análise crítica pela Direção."}, "213": {"resposta_correta": "B) Princípio do menor privilégio – acesso apenas ao necessário para executar funções", "justificativa": "O controle A.5.15 (Controle de acesso) exige que regras para controlar o acesso físico e lógico à informação e a outros ativos associados sejam estabelecidas e implementadas com base nos requisitos de negócio e de segurança da informação. O princípio fundamental que deve orientar essas regras é o do menor privilégio (least privilege): conceder a cada usuário apenas o acesso estritamente necessário para desempenhar suas funções, nada além disso.", "analisa": "- A) Acesso máximo para garantir produtividade dos usuários — conceder acesso máximo para 'garantir produtividade' contraria diretamente o princípio de segurança de minimizar a superfície de exposição — quanto mais acesso desnecessário, maior o risco de uso indevido, vazamento ou movimentação lateral em caso de comprometimento.\n- C) Acesso baseado exclusivamente no cargo hierárquico do usuário — basear o acesso exclusivamente no cargo hierárquico, sem considerar a real necessidade funcional da tarefa, pode conceder acessos desnecessários a cargos de alto nível e negar acessos necessários a funções operacionais específicas — não reflete o princípio do menor privilégio nem uma análise baseada em necessidade real.", "dica": "", "resumo": "Controle de acesso (A.5.15) = princípio do menor privilégio: só o acesso necessário para a função."}, "214": {"resposta_correta": "B) Implementar controles de detecção, prevenção e recuperação combinados com conscientização dos usuários", "justificativa": "O controle A.8.7 (Proteção contra malware) recomenda uma abordagem em camadas: implementar controles de detecção, prevenção e recuperação, combinados com adequada conscientização dos usuários, para proteger a organização contra códigos maliciosos de forma abrangente, e não depender de uma única medida técnica isolada.", "analisa": "- A) Instalar antivírus apenas em servidores críticos de produção — instalar antivírus apenas em servidores críticos deixa desprotegidos outros pontos de entrada comuns para malware (estações de trabalho, notebooks, dispositivos móveis), sendo uma abordagem incompleta frente ao controle A.8.7.\n- C) Bloquear todos os dispositivos externos sem exceção — bloquear todos os dispositivos externos sem exceção é uma medida excessivamente restritiva que pode não ser proporcional ao risco nem viável operacionalmente, além de a norma recomendar uma combinação equilibrada de controles técnicos e comportamentais, não apenas bloqueios absolutos.", "dica": "", "resumo": "A.8.7 (antimalware) = combinação de detecção, prevenção, recuperação e conscientização — nunca uma única medida isolada."}, "215": {"resposta_correta": "B) Abordagem para uso de criptografia, incluindo gestão de chaves criptográficas", "justificativa": "O controle A.8.24 (Uso de criptografia) exige que uma política sobre o uso de criptografia seja desenvolvida e implementada, definindo a abordagem da organização para uso de controles criptográficos, incluindo princípios gerais, requisitos legais/regulatórios aplicáveis e, de forma essencial, a gestão do ciclo de vida das chaves criptográficas (geração, distribuição, armazenamento, rotação e revogação).", "analisa": "- A) Apenas os algoritmos de criptografia aprovados pelo departamento de TI — restringir a política apenas aos 'algoritmos aprovados pelo departamento de TI' é insuficiente — a política de criptografia precisa abordar de forma mais ampla o uso apropriado da criptografia e, criticamente, a gestão das chaves criptográficas, não apenas uma lista de algoritmos permitidos.\n- C) A lista de dados que NÃO precisam ser criptografados — definir 'o que NÃO precisa ser criptografado' não é o foco da política exigida pelo controle A.8.24 — a política deve estabelecer a abordagem positiva para uso apropriado de criptografia com base em riscos e requisitos, não uma lista de exceções.", "dica": "", "resumo": "A.8.24: política de criptografia deve incluir, obrigatoriamente, a gestão do ciclo de vida das chaves criptográficas."}, "216": {"resposta_correta": "B) Processos, papéis, responsabilidades e procedimentos de comunicação para resposta a incidentes", "justificativa": "O controle A.5.24 (Planejamento e preparação para gestão de incidentes de segurança da informação) exige que a organização defina e comunique processos, papéis e responsabilidades para uma resposta consistente e eficaz a incidentes, incluindo procedimentos de comunicação para relatar eventos e gerenciar incidentes ao longo de todo o seu ciclo de vida.", "analisa": "- A) Apenas o contato do fornecedor de suporte técnico para situações emergenciais — restringir o planejamento apenas ao 'contato do fornecedor de suporte técnico' é claramente insuficiente diante da abrangência exigida pelo controle A.5.24, que trata de toda a estrutura de resposta a incidentes (processos, papéis, responsabilidades e comunicação), não apenas de um contato pontual.\n- C) Somente os valores de RTO e RPO para sistemas críticos — os valores de RTO (Recovery Time Objective) e RPO (Recovery Point Objective) são métricas típicas de continuidade de negócios (relacionadas a controles como A.5.29/A.5.30), e não o foco central do planejamento de gestão de incidentes tratado pelo A.5.24.", "dica": "", "resumo": "A.5.24 = estrutura de governança da resposta a incidentes: processos, papéis, responsabilidades e comunicação."}, "217": {"resposta_correta": "A) Apenas o valor de mercado dos ativos físicos", "justificativa": "O controle A.5.9 (Inventário de ativos de informação e outros ativos associados) exige que os ativos sejam identificados e que um inventário adequado seja desenvolvido e mantido. As informações essenciais desse inventário incluem a identificação clara do ativo, seu proprietário (owner), sua classificação (conforme o esquema de classificação da informação, controle A.5.12) e sua localização — dados que permitem gerenciar e proteger o ativo de forma consistente.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa A ('Apenas o valor de mercado dos ativos físicos') como correta, mas essa informação é insuficiente e não atende à finalidade de segurança da informação do inventário de ativos. A resposta tecnicamente correta é a alternativa B. Recomenda-se estudar esta questão com a resposta correta sendo B.", "analisa": "- B) Identificação do ativo, proprietário, classificação e localização — esta é, na verdade, a alternativa tecnicamente correta (ver nota técnica abaixo) — identificação, proprietário, classificação e localização são as informações essenciais recomendadas para um inventário de ativos eficaz conforme o A.5.9.\n- C) Data de compra e número de série de equipamentos de hardware — data de compra e número de série são informações úteis para gestão patrimonial/financeira de ativos físicos, mas não são as informações centrais exigidas para fins de segurança da informação, que priorizam proprietário, classificação e localização para fins de proteção e responsabilização.", "dica": "", "resumo": "Inventário de ativos (A.5.9): identificação, proprietário, classificação e localização — não apenas valor de mercado ou dados patrimoniais."}, "218": {"resposta_correta": "C) Aplicação automática de todos os patches sem avaliação prévia de impacto", "justificativa": "O controle A.8.8 (Gestão de vulnerabilidades técnicas) exige que a organização obtenha informações sobre vulnerabilidades técnicas de sistemas de informação em uso, avalie a exposição da organização a essas vulnerabilidades e tome medidas apropriadas e tempestivas para tratá-las — ou seja, um processo contínuo de identificação, avaliação e tratamento (correção priorizada com base em risco), e não aplicação cega de todos os patches sem qualquer avaliação prévia de impacto.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa C ('Aplicação automática de todos os patches sem avaliação prévia de impacto') como correta, mas essa prática é, na verdade, contrária às boas práticas de gestão de vulnerabilidades e de mudanças, podendo causar indisponibilidades. A resposta tecnicamente correta, alinhada ao texto do controle A.8.8, é a alternativa B. Recomenda-se estudar esta questão com a resposta correta sendo B.", "analisa": "- A) Varredura de vulnerabilidades apenas após incidentes confirmados — realizar varreduras de vulnerabilidades apenas após incidentes confirmados caracteriza uma abordagem reativa e insuficiente — o controle A.8.8 exige um processo proativo e contínuo de identificação de vulnerabilidades, não apenas em resposta a incidentes já ocorridos.\n- B) Identificação, avaliação e tratamento tempestivo de vulnerabilidades técnicas nos sistemas — esta é, na verdade, a alternativa tecnicamente correta (ver nota técnica abaixo) — descreve exatamente o processo equilibrado exigido pelo A.8.8: identificação, avaliação e tratamento tempestivo com base em risco.", "dica": "", "resumo": "Gestão de vulnerabilidades (A.8.8) = identificar + avaliar + tratar tempestivamente — nunca reativo apenas ou automático sem avaliação."}, "219": {"resposta_correta": "B) A.8.15 – Log", "justificativa": "O controle A.8.25 (Ciclo de vida de desenvolvimento seguro) exige que regras para o desenvolvimento seguro de software e sistemas sejam estabelecidas e aplicadas, cobrindo todo o ciclo de vida do desenvolvimento — desde requisitos de segurança, arquitetura, codificação segura, testes de segurança, até a implantação — sendo o controle específico do Anexo A que trata diretamente do tema de desenvolvimento seguro de software mencionado na questão.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa B (A.8.15 – Log) como correta, mas esse controle trata de registro de eventos (logs), sem relação direta com desenvolvimento seguro de software. A resposta tecnicamente correta é a alternativa A (A.8.25 – Ciclo de vida de desenvolvimento seguro). Recomenda-se estudar esta questão com a resposta correta sendo A.", "analisa": "- A) A.8.25 – Ciclo de vida de desenvolvimento seguro — esta é, na verdade, a alternativa tecnicamente correta (ver nota técnica abaixo) — o A.8.25 é o controle específico do Anexo A que trata do ciclo de vida de desenvolvimento seguro de software.\n- C) A.5.31 – Requisitos legais, estatutários, regulamentares e contratuais — o controle A.5.31 trata da identificação de requisitos legais, estatutários, regulamentares e contratuais relevantes para a segurança da informação, um tema de conformidade jurídica, não de desenvolvimento seguro de software.", "dica": "", "resumo": "Segurança no ciclo de desenvolvimento de software → controle A.8.25 (não A.8.15, que é logging)."}, "220": {"resposta_correta": "A) Usar barreiras únicas de alta tecnologia para reduzir custos", "justificativa": "Os controles físicos do tema Físico (A.7.x) recomendam o uso de perímetros de segurança física organizados em múltiplas camadas (defesa em profundidade) — por exemplo, cerca externa, controle de acesso na portaria, catracas internas, salas restritas e, por fim, gabinetes/racks trancados no datacenter — de modo que a falha ou superação de uma única barreira não comprometa todo o ambiente protegido.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa A ('Usar barreiras únicas de alta tecnologia para reduzir custos') como correta, mas essa abordagem contraria o princípio de defesa em profundidade recomendado pelos controles físicos do Anexo A — depender de uma única barreira, por mais avançada que seja, cria um ponto único de falha. A resposta tecnicamente correta é a alternativa B. Recomenda-se estudar esta questão com a resposta correta sendo B.", "analisa": "- B) Implementar múltiplas camadas de segurança física (defesa em profundidade) — esta é, na verdade, a alternativa tecnicamente correta (ver nota técnica abaixo) — múltiplas camadas de segurança física (defesa em profundidade) são o princípio recomendado pelos controles A.7.x para proteção de perímetros físicos.\n- C) Restringir acesso físico apenas durante horário comercial — restringir o acesso físico apenas durante o horário comercial deixa o ambiente potencialmente vulnerável fora desse período (por exemplo, à noite ou em fins de semana) e não trata do princípio de desenho de perímetros de segurança, mas sim de controle temporal de acesso, um aspecto complementar e insuficiente isoladamente.", "dica": "", "resumo": "Segurança física eficaz = múltiplas camadas de proteção (defesa em profundidade), nunca uma única barreira isolada."}, "221": {"resposta_correta": "C) Apenas quando houver mudanças significativas na política de segurança", "justificativa": "O controle A.6.3 (Conscientização, educação e treinamento em segurança da informação) exige que colaboradores e partes interessadas relevantes recebam conscientização, educação e treinamento apropriados, com atualizações regulares e periódicas das políticas e procedimentos organizacionais relevantes para sua função — não apenas de forma pontual ou reativa a mudanças ou apenas para novos contratados.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa C ('Apenas quando houver mudanças significativas na política de segurança') como correta, mas essa frequência é insuficiente frente ao texto do controle A.6.3, que exige regularidade e abrangência contínua. A resposta tecnicamente correta é a alternativa B. Recomenda-se estudar esta questão com a resposta correta sendo B.", "analisa": "- A) Anualmente, apenas para novos funcionários admitidos no período — restringir o treinamento a 'novos funcionários admitidos no período' ignora a necessidade de reforço contínuo para todo o pessoal já existente, algo explicitamente exigido pelo controle A.6.3 (regularidade e abrangência a todo o pessoal e partes interessadas relevantes).\n- B) Regularmente para todo o pessoal e partes interessadas relevantes, com conteúdo atualizado pertinente às funções — esta é, na verdade, a alternativa tecnicamente correta segundo o controle A.6.3 (ver nota técnica abaixo) — o treinamento deve ser regular, abranger todo o pessoal e partes interessadas relevantes, com conteúdo atualizado e pertinente às funções de cada um.", "dica": "", "resumo": "A.6.3 = treinamento regular e contínuo para todo o pessoal relevante, não apenas eventos pontuais."}, "222": {"resposta_correta": "B) Regras, procedimentos ou acordos para transferência de informações em todos os tipos de instalações", "justificativa": "O controle A.5.14 (Transferência de informações) exige que regras, procedimentos ou acordos de transferência de informações sejam estabelecidos para todos os tipos de instalações de transferência dentro da organização e entre a organização e partes externas — incluindo transferência eletrônica, física e verbal — e não apenas para um canal específico como o e-mail.", "analisa": "- A) Apenas a política de uso de e-mail corporativo criptografado — restringir o controle apenas à 'política de uso de e-mail corporativo criptografado' ignora outros meios de transferência de informação (mídias físicas, APIs, transferência verbal, aplicações de mensagens, etc.) que também precisam de regras e acordos conforme o A.5.14.\n- C) Lista de destinatários aprovados para receber informações confidenciais — uma simples lista de destinatários aprovados é uma medida de controle de acesso pontual, mas não substitui a necessidade de regras, procedimentos e acordos formais que cubram todos os tipos de instalações e cenários de transferência de informação exigidos pelo controle.", "dica": "", "resumo": "A.5.14 = regras/acordos de transferência de informação cobrindo todos os tipos de instalações, não só e-mail."}, "223": {"resposta_correta": "B) Pesquisas de satisfação", "justificativa": "A cláusula 9.1 permite que a organização utilize diferentes métodos para monitorar a percepção e a satisfação das partes interessadas com o desempenho do SGSI, sendo as pesquisas de satisfação um instrumento direto para captar essa percepção junto a colaboradores, clientes ou outras partes interessadas relevantes, complementando outras fontes objetivas de desempenho do sistema.", "analisa": "- A) Auditorias internas — auditorias internas (cláusula 9.2) são, de fato, um mecanismo essencial de avaliação de conformidade e desempenho do SGSI — mas medem principalmente aderência a requisitos, enquanto a pergunta, no contexto desta questão, busca destacar um método complementar de medição de eficácia percebida.\n- C) Contagem de incidentes — a contagem de incidentes é um indicador quantitativo útil (KPI) sobre a exposição a eventos de segurança, mas não mede diretamente a 'eficácia' percebida do SGSI como um todo, sendo apenas uma das várias métricas possíveis dentro de um programa de medição mais amplo.", "dica": "", "resumo": "Eficácia do SGSI pode ser medida por múltiplas fontes (auditorias, KPIs, pesquisas) — não existe um único método 'correto' isoladamente."}, "224": {"resposta_correta": "B) Registros de revisões legais", "justificativa": "A conformidade com requisitos legais e regulatórios de segurança da informação exige monitoramento contínuo, já que a legislação e as obrigações contratuais podem mudar ao longo do tempo. Registros de revisões legais periódicas — evidenciando quando e como a organização avaliou sua conformidade frente a requisitos legais aplicáveis (relacionado ao controle A.5.31 e à cláusula 9.1) — são a evidência apropriada desse monitoramento contínuo.", "analisa": "- A) Declaração única — uma declaração única, feita uma vez, não caracteriza monitoramento contínuo — a conformidade legal deve ser reavaliada periodicamente, à medida que mudam as leis e o contexto da organização.\n- C) Relatório anual — um relatório anual isolado, sem registros de revisões intermediárias, também não caracteriza 'monitoramento contínuo' no sentido exigido pela norma, que pressupõe acompanhamento sistemático ao longo do tempo, não apenas um evento anual pontual.", "dica": "", "resumo": "Conformidade legal exige registros de revisões periódicas — não uma declaração única nem só um relatório anual."}, "225": {"resposta_correta": "C) Métricas de tempo médio de resolução (MTTR)", "justificativa": "Na análise de dados de desempenho relacionados a incidentes (cláusula 9.1), métricas de tempo médio de resolução (MTTR – Mean Time To Resolve/Repair) são amplamente utilizadas para avaliar a eficiência e a eficácia do processo de resposta a incidentes, permitindo identificar tendências de melhoria ou de deterioração ao longo do tempo.", "analisa": "- A) Apenas o número total de incidentes registrados, sem qualquer classificação — uma contagem bruta, sem classificação por severidade, tipo ou tempo de resposta, oferece pouca informação útil para avaliar o desempenho do processo de gestão de incidentes.\n- B) Planilha de satisfação do cliente, sem relação com os incidentes — uma métrica sem qualquer vínculo com os dados reais de incidentes não serve como ferramenta de análise desse processo específico, por mais relevante que a satisfação do cliente seja em outros contextos.\n\n🔧 **Nota:** as alternativas A e B foram reconstruídas neste gabarito porque seu texto estava ausente/corrompido na base de dados original do simulado. A resposta correta foi ajustada aqui para C, que é a alternativa cujo texto sempre esteve presente e que é tecnicamente a ferramenta mais adequada para o tema.", "dica": "", "resumo": "MTTR (tempo médio de resolução) é uma métrica-padrão para avaliar a eficiência da resposta a incidentes.\n---"}, "226": {"resposta_correta": "B) Equipe de SI", "justificativa": "A cláusula 9.1 exige que a organização determine os métodos de monitoramento, medição, análise e avaliação necessários para assegurar resultados válidos. Embora a norma não atribua essa responsabilidade a um cargo específico, na prática de implementação essa definição normalmente é conduzida pela equipe responsável pela segurança da informação, que possui o conhecimento técnico necessário para desenhar indicadores e métodos de medição relevantes, submetendo-os posteriormente à validação da Alta Direção.", "analisa": "- A) Topo da gestão — embora a Alta Direção deva assegurar que o desempenho do SGSI seja avaliado (cláusula 9.3) e aprove o programa de medição em nível estratégico, a definição operacional detalhada dos métodos de monitoramento e medição normalmente é tarefa técnica, não estratégica.\n- C) Consultor externo — um consultor externo pode apoiar o desenho de indicadores, mas não é ele quem, segundo a norma, tem a responsabilidade de determinar os métodos de monitoramento — essa responsabilidade é da própria organização, tipicamente exercida por sua equipe de segurança da informação.", "dica": "", "resumo": "Cláusula 9.1: a norma não nomeia o responsável — na prática, cabe à equipe de segurança da informação definir métodos, com aval da Alta Direção."}, "227": {"resposta_correta": "B) Taxa de conformidade com SoA", "justificativa": "Um indicador de eficácia dos controles relacionado à conformidade e cobertura da implementação é a taxa de conformidade com a Declaração de Aplicabilidade (SoA), que mostra o percentual de controles listados como aplicáveis no SoA que já foram efetivamente implementados e estão operando conforme planejado — uma métrica direta de progresso e maturidade da implementação.", "analisa": "- A) Número de funcionários — o número de funcionários é um dado organizacional geral, sem relação direta com a conformidade ou eficácia dos controles de segurança da informação implementados.\n- C) Orçamento de TI — o orçamento de TI é um indicador de investimento/recurso, mas não mede, por si só, a conformidade ou a eficácia dos controles de segurança implementados — orçamento alto não garante controles eficazes, e vice-versa.", "dica": "", "resumo": "Taxa de conformidade com o SoA é um indicador direto de eficácia/cobertura de controles."}, "228": {"resposta_correta": "C) Anual ou após mudanças", "justificativa": "O monitoramento da satisfação de partes interessadas por meio de pesquisas costuma ser realizado com frequência anual, ou de forma adicional sempre que ocorrem mudanças significativas relevantes (por exemplo, mudanças de escopo, incidentes de grande impacto ou alterações regulatórias), garantindo que a percepção das partes interessadas seja capturada de forma periódica e também reativa a eventos relevantes.", "analisa": "- A) A cada cinco anos, independentemente de mudanças no contexto — um intervalo tão longo, e insensível a mudanças relevantes no cont
