e proativo dos requisitos aplicáveis.", "dica": "A.5.31 costuma ser materializado num \"registro de requisitos legais e regulatórios\" — documento clássico pedido em auditorias e usado como evidência deste controle.", "resumo": "Conformidade legal exige identificação, documentação e atualização contínua — nunca reação de última hora."}, "58": {"resposta_correta": "b) Procedimentos adequados para proteger os direitos de propriedade intelectual.", "justificativa": "O controle A.5.32 (Direitos de propriedade intelectual) exige que a organização implemente procedimentos adequados para proteger os direitos de propriedade intelectual, o que inclui não apenas patentes, mas também direitos autorais, marcas registradas, segredos comerciais e conformidade com licenças de software.", "analisa": "- a) Registrar patentes é apenas uma forma específica de proteção de propriedade intelectual; o controle exige uma abordagem mais ampla, incluindo, por exemplo, conformidade com licenciamento de software de terceiros.\n- c) Compartilhar propriedade intelectual livremente é exatamente o oposto do propósito do controle, que visa proteger, e não expor, os ativos intangíveis da organização.", "dica": "Cuidado: propriedade intelectual não é só sobre o que a organização cria e protege, mas também sobre respeitar direitos de terceiros (ex.: uso de software licenciado corretamente) — ambos os lados são cobrados pelo A.5.32.", "resumo": "Propriedade intelectual vai além de patente: inclui direitos autorais, marcas e conformidade com licenças de terceiros."}, "59": {"resposta_correta": "b) Proteger os registros contra perdas, destruição, falsificação, acesso não autorizado e liberação não autorizada.", "justificativa": "O controle A.5.33 (Proteção de registros) exige que os registros sejam protegidos contra perda, destruição, falsificação, acesso não autorizado e liberação não autorizada, considerando também os requisitos legais, regulatórios, contratuais e de negócio relacionados à retenção e disposição de registros.", "analisa": "- a) Backup trata apenas do risco de perda/destruição; não protege contra falsificação nem contra acesso ou liberação não autorizados, ambos exigidos pelo controle.\n- c) Migrar tudo para papel é impraticável em escala e não elimina riscos como falsificação, extravio físico ou acesso não autorizado — não é a solução proposta pela norma, que é agnóstica quanto ao meio, desde que devidamente protegido.", "dica": "A.5.33 tem uma lista de cinco ameaças aos registros (perda, destruição, falsificação, acesso não autorizado, liberação não autorizada) — decore essas cinco dimensões, pois alternativas parciais (como \"apenas backup\") costumam ser a pegadinha.", "resumo": "Registro protegido é aquele blindado contra perda, adulteração e acesso/divulgação indevidos — não só contra perda."}, "60": {"resposta_correta": "b) Identificar e atender aos requisitos relativos à preservação da privacidade e à proteção de DP, de acordo com as leis e os regulamentos aplicáveis e requisitos contratuais.", "justificativa": "O controle A.5.34 (Privacidade e proteção de dados pessoais - DP/PII) exige que a organização identifique e atenda aos requisitos relativos à preservação da privacidade e à proteção de dados pessoais, conforme leis, regulamentos aplicáveis (como LGPD/GDPR) e requisitos contratuais, o que pode envolver a designação de responsável (ex.: DPO/Encarregado) e políticas específicas de tratamento de DP.", "analisa": "- a) Consentimento é apenas uma das bases legais possíveis para tratamento de dados pessoais e um item específico de conformidade; o controle exige uma abordagem completa a todos os requisitos legais e contratuais aplicáveis, não apenas o consentimento.\n- c) Minimização de dados é uma boa prática e um princípio de privacidade (data minimization), mas isoladamente não cumpre toda a exigência do controle, que é identificar e atender ao conjunto de requisitos aplicáveis de privacidade e proteção de DP.", "dica": "A.5.34 conecta a ISO 27001 a legislações de proteção de dados (LGPD, GDPR) — é comum a prova cruzar este controle com cenários de vazamento de dados pessoais ou exercício de direitos do titular.", "resumo": "Proteção de dados pessoais exige atender ao conjunto de exigências legais/contratuais, não só pedir consentimento."}, "61": {"resposta_correta": "b) Analisar criticamente, de forma independente, a abordagem da organização para gerenciar a segurança da informação e sua implementação, a intervalos planejados ou quando ocorrerem mudanças significativas.", "justificativa": "O controle A.5.35 (Análise crítica independente da segurança da informação) exige que a abordagem da organização para gerenciar a segurança da informação e sua implementação (incluindo pessoas, processos e tecnologias) seja analisada criticamente de forma independente, a intervalos planejados ou quando ocorrerem mudanças significativas — a independência é o elemento central, geralmente exigindo alguém sem responsabilidade direta pela área avaliada.", "analisa": "- a) Restringir a apenas \"realizar auditorias internas\" ignora o requisito específico de independência de quem realiza a análise em relação à abordagem geral de gestão de segurança, que pode envolver revisores distintos da função de auditoria interna padrão.\n- c) Deixar a análise crítica a cargo da própria equipe de segurança contraria diretamente o requisito de independência, já que essa equipe é parte interessada direta na gestão avaliada (haveria conflito de interesse/autoavaliação).", "dica": "A.5.35 exige \"independência\" no sentido de quem revisa não pode ser quem implementa/gerencia diretamente o que está sendo revisado — não confundir com a auditoria interna do capítulo 9.2, embora possam se complementar.", "resumo": "Quem implementa a segurança não deve ser quem avalia de forma independente sua própria implementação."}, "62": {"resposta_correta": "b) Analisar criticamente o compliance da política de segurança da informação da organização, políticas, regras e normas de temas específicos a intervalos regulares.", "justificativa": "O controle A.5.36 (Compliance com políticas, regras e normas para segurança da informação) exige que a organização analise criticamente, a intervalos regulares, o compliance do tratamento da informação e dos procedimentos em sua área de responsabilidade com a política de segurança da informação, políticas de temas específicos, regras e normas aplicáveis, verificando de fato se o que está definido é praticado.", "analisa": "- a) Assumir compliance sem verificação contraria o próprio propósito do controle, que é justamente checar, de forma ativa, se as políticas estão sendo seguidas.\n- c) Apenas informar sobre as políticas é uma ação de comunicação/conscientização (mais próxima de 7.3/A.6.3), não a verificação de conformidade exigida pelo A.5.36.", "dica": "Não confunda A.5.35 (análise crítica independente de toda a abordagem de gestão de segurança) com A.5.36 (compliance específico com políticas/regras/normas) — o primeiro é mais estratégico/amplo, o segundo é mais operacional/pontual.", "resumo": "Ter política não basta: é preciso verificar regularmente se ela está sendo cumprida na prática."}, "63": {"resposta_correta": "b) Documentar os procedimentos de operação dos recursos de tratamento da informação e disponibilizá-los para o pessoal que necessite deles.", "justificativa": "O controle A.5.37 (Procedimentos documentados de operação) exige que os procedimentos de operação dos recursos de tratamento da informação sejam documentados e disponibilizados ao pessoal que deles necessite, garantindo consistência e reduzindo a dependência de conhecimento tácito de indivíduos específicos.", "analisa": "- a) Treinamento apenas verbal, sem documentação formal, não garante consistência nem rastreabilidade, e o conhecimento se perde facilmente com rotatividade de pessoal.\n- c) Restringir a documentação apenas a novas funcionalidades deixa desatualizados ou inexistentes os procedimentos de operações já existentes, que também precisam estar documentados e disponíveis.", "dica": "A.5.37 fecha o bloco organizacional (5.1 a 5.37) — costuma aparecer em cenários de \"conhecimento na cabeça de uma única pessoa\" (bus factor), que é exatamente o risco que este controle mitiga.", "resumo": "Procedimento operacional deve estar escrito e acessível a quem precisa, não apenas na cabeça de alguém."}, "64": {"resposta_correta": "b) Realizar verificações de antecedentes de todos os candidatos a serem contratados antes de ingressarem na organização e de modo contínuo, de acordo com as leis, os regulamentos e a ética aplicáveis.", "justificativa": "O controle A.6.1 (Seleção), primeiro controle do tema Pessoas do Anexo A, exige que verificações de antecedentes de todos os candidatos a serem contratados sejam realizadas antes de seu ingresso na organização e de forma contínua, levando em conta as leis, os regulamentos e a ética aplicáveis, e proporcionais aos requisitos de negócio, à classificação das informações a serem acessadas e aos riscos percebidos.", "analisa": "- a) Verificar apenas o currículo (autodeclarado pelo candidato) não constitui uma checagem independente de antecedentes, que é o que o controle exige.\n- c) Selecionar apenas com base em experiência profissional ignora completamente os aspectos de idoneidade e conformidade legal que a checagem de antecedentes visa cobrir.", "dica": "A.6.1 exige checagem tanto na admissão quanto \"de modo contínuo\" — muitas provas cobram justamente esse aspecto contínuo, que vai além da checagem única no momento da contratação.", "resumo": "Seleção segura é checagem de antecedentes contínua e proporcional ao risco, não apenas leitura de currículo."}, "65": {"resposta_correta": "b) Declarar as responsabilidades do pessoal e da organização para a segurança da informação nos contratos trabalhistas.", "justificativa": "O controle A.6.2 (Termos e condições de contratação) exige que os acordos contratuais de trabalho declarem as responsabilidades do pessoal e da organização em relação à segurança da informação, formalizando expectativas e obrigações desde o início do vínculo empregatício.", "analisa": "- a) Um contrato genérico, sem cláusulas específicas de segurança da informação, não atende à exigência de declarar explicitamente as responsabilidades de ambas as partes nesse tema.\n- c) Acordos verbais não têm força formal nem rastreabilidade, sendo incompatíveis com o requisito de que essas responsabilidades sejam formalmente estabelecidas nos termos contratuais.", "dica": "A.6.2 é o ponto de entrada formal das obrigações de segurança da informação na relação de trabalho — geralmente evidenciado por cláusulas específicas no contrato de trabalho ou em anexo/termo assinado.", "resumo": "Responsabilidades de segurança da informação devem estar escritas no contrato de trabalho, não em combinado verbal."}, "66": {"resposta_correta": "b) Que o pessoal da organização e partes interessadas relevantes recebam treinamento, educação e conscientização apropriados e atualizações regulares da política e dos procedimentos, pertinentes para suas funções.", "justificativa": "O controle A.6.3 (Conscientização, educação e treinamento em segurança da informação) exige que o pessoal da organização e as partes interessadas relevantes recebam treinamento, educação e conscientização apropriados em segurança da informação, além de atualizações regulares da política de segurança da informação, políticas de temas específicos e procedimentos, relevantes para suas funções.", "analisa": "- a) Tornar o treinamento opcional contraria diretamente a natureza obrigatória do controle, que visa garantir um nível mínimo e uniforme de conscientização em toda a organização.\n- c) Restringir o treinamento à equipe de TI ignora que todo o pessoal, e não apenas a área técnica, lida com informações e riscos de segurança em suas atividades diárias.", "dica": "A.6.3 é o controle \"irmão\" da cláusula 7.3 (Conscientização) do corpo da norma — a cláusula estabelece o requisito geral, o controle detalha a prática (treinamento contínuo e atualizado, adaptado à função).", "resumo": "Conscientização e treinamento são para todos, contínuos e ajustados à função de cada um — nunca opcionais ou restritos à TI."}, "67": {"resposta_correta": "b) Formalizar e comunicar um processo disciplinar para tomar ações contra pessoal e outras partes interessadas relevantes que tenham cometido uma violação da política da segurança da informação.", "justificativa": "O controle A.6.4 (Processo disciplinar) exige que um processo disciplinar seja formalizado e comunicado para tomar ações contra pessoal e outras partes interessadas relevantes que tenham cometido uma violação da política de segurança da informação, assegurando tratamento justo, proporcional e consistente das infrações.", "analisa": "- a) Demissão sumária sem processo formal desrespeita o requisito de um processo estruturado (que geralmente inclui apuração, direito de defesa e proporcionalidade), além de expor a organização a riscos trabalhistas.\n- c) Ignorar violações mina a eficácia de toda a política de segurança da informação e contraria diretamente a exigência de que ações sejam tomadas diante de infrações comprovadas.", "dica": "O processo disciplinar (A.6.4) deve ser formal, comunicado previamente (as pessoas precisam saber que ele existe) e aplicado de forma consistente — não é sobre punir na hora nem sobre \"deixar barato\".", "resumo": "Violação de política de segurança gera processo disciplinar formal, nem punição sumária nem impunidade."}, "68": {"resposta_correta": "b) As responsabilidades e funções de segurança da informação que permaneçam válidas após o encerramento ou a mudança da contratação devem ser definidas, aplicadas e comunicadas ao pessoal e a outras partes interessadas pertinentes.", "justificativa": "O controle A.6.5 (Responsabilidades após encerramento ou mudança da contratação) exige que as responsabilidades e obrigações de segurança da informação que permanecem válidas após o término ou a mudança da relação de trabalho (ex.: obrigações de confidencialidade contínua) sejam definidas, aplicadas e comunicadas de forma clara ao pessoal e a outras partes interessadas pertinentes.", "analisa": "- a) Apenas revogar o acesso trata do aspecto técnico de offboarding (relacionado ao A.5.18), mas não cobre a comunicação formal das obrigações que continuam vigentes após o desligamento, como confidencialidade pós-contratual.\n- c) Delegar o tema inteiramente ao jurídico, de forma reativa e apenas se surgir problema, contraria a exigência de que essas obrigações sejam comunicadas proativamente no momento do desligamento ou mudança.", "dica": "A.6.5 lembra que segurança da informação \"não acaba no último dia de trabalho\" — obrigações como sigilo podem continuar válidas por tempo determinado após o desligamento.", "resumo": "Algumas obrigações de segurança sobrevivem ao fim do contrato; elas devem ser comunicadas claramente no desligamento."}, "69": {"resposta_correta": "b) Identificar, documentar, analisar criticamente em intervalos regulares e assinar acordos de confidencialidade ou não divulgação que reflitam as necessidades da organização para a proteção das informações.", "justificativa": "O controle A.6.6 (Acordos de confidencialidade ou não divulgação) exige que acordos de confidencialidade ou não divulgação (NDAs) que reflitam as necessidades da organização para a proteção da informação sejam identificados, documentados, analisados criticamente em intervalos regulares e assinados pelo pessoal e demais partes interessadas relevantes.", "analisa": "- a) Confiar apenas na palavra das partes não oferece nenhuma proteção legal formal, o que contraria diretamente a exigência de formalização por escrito exigida pelo controle.\n- c) Restringir o uso de NDAs apenas para informações \"altamente secretas\" ignora que o controle recomenda que esses acordos reflitam as necessidades reais de proteção da organização, que podem envolver diferentes níveis de sensibilidade, não apenas o mais alto.", "dica": "Repare que o controle exige análise crítica periódica dos NDAs, não apenas a assinatura única no início do relacionamento — os acordos devem ser revisados conforme mudam as necessidades da organização.", "resumo": "NDA não é assinado uma vez e esquecido: deve ser revisado periodicamente e refletir as reais necessidades de proteção."}, "70": {"resposta_correta": "b) Medidas de segurança para proteger as informações acessadas, tratadas ou armazenadas fora das instalações da organização.", "justificativa": "O controle A.6.7 (Trabalho remoto) exige que medidas de segurança sejam implementadas quando o pessoal trabalha remotamente, para proteger as informações acessadas, tratadas ou armazenadas fora das instalações da organização — considerando aspectos como segurança física do ambiente doméstico, conexões seguras, uso de dispositivos e política de trabalho remoto.", "analisa": "- a) Fornecer apenas o equipamento (laptop) não garante, por si só, que as informações estejam protegidas — faltam medidas complementares como VPN, criptografia, política de uso e conscientização.\n- c) Deixar a segurança inteiramente a cargo do funcionário, sem diretrizes e controles organizacionais, contraria a exigência de que a organização implemente e assegure medidas de segurança formais para o trabalho remoto.", "dica": "A.6.7 ganhou grande relevância após a popularização do home office/trabalho híbrido — é um controle frequentemente cobrado em cenários pós-pandemia nas provas de certificação.", "resumo": "Trabalho remoto seguro exige medidas organizacionais formais, não apenas entregar um laptop e torcer."}, "71": {"resposta_correta": "b) Um mecanismo para que as pessoas relatem eventos da segurança da informação observados ou suspeitos por meio de canais apropriados em tempo hábil.", "justificativa": "O controle A.6.8 (Relato de eventos de segurança da informação) exige que a organização forneça um mecanismo para que o pessoal relate eventos de segurança da informação observados ou suspeitos por meio de canais apropriados em tempo hábil, o que é essencial para que a fase de avaliação/decisão (A.5.25) e resposta a incidentes (A.5.26) funcione de forma eficaz.", "analisa": "- a) Restringir o canal de relato apenas à alta direção cria um gargalo e desestimula relatos rápidos por parte de quem primeiro observa o evento, geralmente pessoal operacional.\n- c) Um sistema de recompensa não é o mecanismo central exigido pelo controle; o foco é garantir a existência de um canal claro, acessível e ágil para relato, independentemente de incentivos financeiros.", "dica": "A.6.8 é a \"porta de entrada\" de todo o processo de gestão de incidentes do Anexo A — sem um bom mecanismo de relato, os controles A.5.24 a A.5.28 não têm insumo para funcionar.", "resumo": "Sem canal simples e rápido de relato, ninguém avisa a tempo sobre um evento de segurança."}, "72": {"resposta_correta": "b) Definir e usar perímetros de segurança para proteger áreas que contenham informações e outros ativos associados.", "justificativa": "O controle A.7.1 (Perímetros de segurança física), primeiro controle do tema Físico do Anexo A, exige que perímetros de segurança sejam definidos e usados para proteger áreas que contenham informações e outros ativos associados — como paredes, portões controlados ou balcões de recepção com controle de acesso, formando camadas de proteção física (defesa em profundidade).", "analisa": "- a) Câmeras na entrada são apenas um elemento de vigilância (mais relacionado ao A.7.4, monitoramento), não a definição estrutural do perímetro físico em si, que envolve barreiras e limites de área.\n- c) Permitir acesso irrestrito contraria diretamente o propósito do controle, que é justamente delimitar e restringir o acesso físico a áreas que contêm ativos de informação.", "dica": "Pense em perímetros de segurança física como \"camadas de cebola\": quanto mais crítico o ativo, mais camadas de perímetro devem protegê-lo (defesa em profundidade).", "resumo": "Antes de controlar quem entra, é preciso definir onde estão os limites (perímetros) das áreas protegidas."}, "73": {"resposta_correta": "b) Proteger as áreas seguras por controles de entrada e pontos de acesso apropriados.", "justificativa": "O controle A.7.2 (Entrada física) exige que áreas seguras sejam protegidas por controles de entrada e pontos de acesso apropriados, garantindo que somente pessoal autorizado tenha acesso, através de mecanismos como catracas, leitores de crachá, biometria ou outros meios de controle de entrada.", "analisa": "- a) Um crachá que serve apenas como identificação visual, sem um mecanismo efetivo de controle de acesso (como leitura eletrônica com liberação condicionada), não impede fisicamente a entrada não autorizada.\n- c) Depender exclusivamente de vigilância manual, sem controles de entrada sistemáticos (eletrônicos ou mecânicos), é uma medida isolada e sujeita a falhas humanas, insuficiente como controle único.", "dica": "A.7.1 define os limites (perímetro); A.7.2 controla quem atravessa esses limites (entrada) — os dois controles são complementares e sequenciais.", "resumo": "Não basta ter um perímetro; é preciso controlar ativamente quem entra por ele."}, "74": {"resposta_correta": "b) Projetar e implementar segurança física para escritórios, salas e instalações.", "justificativa": "O controle A.7.3 (Segurança de escritórios, salas e instalações) exige que a segurança física para escritórios, salas e instalações seja projetada e implementada de forma planejada, considerando a criticidade e sensibilidade das atividades e ativos ali localizados — não uma medida isolada e pontual.", "analisa": "- a) Apenas trancar portas ao final do expediente é uma medida isolada e limitada a um horário específico, não uma proteção física projetada e contínua conforme exige o controle.\n- c) Instalar alarmes sem um sistema de resposta associado torna a detecção inútil na prática, pois um alarme disparado sem ação subsequente não impede nem mitiga o incidente.", "dica": "A.7.3 exige que a segurança física seja \"projetada\", ou seja, planejada previamente com base em análise de risco do ambiente — não improvisada ou parcial.", "resumo": "Segurança de escritório é projeto pensado, não apenas trancar a porta à noite."}, "75": {"resposta_correta": "b) Monitorar continuamente as instalações para acesso físico não autorizado.", "justificativa": "O controle A.7.4 (Monitoramento de segurança física), novo na versão 2022, exige que as instalações sejam monitoradas continuamente quanto a acesso físico não autorizado, por meio de mecanismos como CFTV, sistemas de detecção de intrusão, guardas ou alarmes integrados a um centro de monitoramento.", "analisa": "- a) Inspeções aleatórias e pontuais deixam lacunas temporais significativas de vigilância, não atendendo à exigência de monitoramento contínuo do controle.\n- c) Fechaduras são um controle preventivo/passivo (mais relacionado a A.7.2/A.7.3), mas não constituem monitoramento ativo e contínuo do ambiente, que é o foco específico do A.7.4.", "dica": "A.7.4 é um dos 11 controles novos de 2022 — decore que ele fala especificamente de monitoramento contínuo (detecção ativa), diferente dos controles de perímetro/entrada que são preventivos.", "resumo": "Não basta trancar a porta: é preciso monitorar continuamente se alguém tenta ou consegue burlar essa proteção."}, "76": {"resposta_correta": "b) Projetar e implementar proteção contra ameaças físicas e ambientais, como desastres naturais e outras ameaças físicas intencionais ou não intencionais à infraestrutura.", "justificativa": "O controle A.7.5 (Proteção contra ameaças físicas e ambientais) exige que proteção contra ameaças físicas e ambientais — como incêndio, enchente, terremoto, sobrecarga elétrica e ameaças físicas intencionais ou não intencionais — seja projetada e implementada na infraestrutura da organização, com base em avaliação de risco do ambiente onde os ativos estão localizados.", "analisa": "- a) Um seguro contra desastres transfere o impacto financeiro do risco, mas não é uma medida de proteção física/preventiva propriamente dita, que é o que o controle exige (ex.: detecção de incêndio, sistemas de climatização, proteção contra enchentes).\n- c) Armazenar equipamentos sem qualquer proteção especial contraria diretamente o propósito do controle, que é justamente proteger a infraestrutura contra esse tipo de ameaça.", "dica": "Cuidado com a diferença entre \"transferir risco\" (seguro) e \"mitigar risco\" (proteção física real, como sistemas de supressão de incêndio) — a norma, no A.7.5, exige a mitigação física, não apenas a transferência financeira.", "resumo": "Seguro cobre prejuízo financeiro depois do desastre; o controle A.7.5 exige prevenir/mitigar o desastre antes."}, "77": {"resposta_correta": "b) Projetar e implementar medidas de segurança para trabalhar em áreas seguras.", "justificativa": "O controle A.7.6 (Trabalho em áreas seguras) exige que medidas de segurança para o trabalho em áreas seguras sejam projetadas e implementadas — como supervisão de visitantes, restrição de dispositivos móveis/fotográficos, e procedimentos específicos de conduta dentro dessas áreas — indo além do simples controle de quem entra.", "analisa": "- a) Restringir o acesso é o objetivo do controle A.7.2 (Entrada física); o A.7.6 trata especificamente das medidas de segurança durante a permanência e execução de trabalho dentro da área já segura, não apenas de quem pode entrar.\n- c) Confiar apenas na integridade dos funcionários, sem medidas formais de segurança, não constitui um controle verificável nem atende à exigência de medidas projetadas e implementadas.", "dica": "Diferencie A.7.2 (quem entra na área) de A.7.6 (o que se faz e como se comporta dentro da área) — são momentos distintos do fluxo de segurança física.", "resumo": "Estar dentro da área segura exige regras próprias de conduta, além do simples controle de entrada."}, "78": {"resposta_correta": "b) Regras de mesa limpa para documentos impressos e mídia de armazenamento removível e regras de tela limpa para os recursos de tratamento das informações.", "justificativa": "O controle A.7.7 (Mesa limpa e tela limpa) exige que sejam definidas e adequadamente aplicadas regras de mesa limpa para documentos em papel e mídias de armazenamento removíveis, e regras de tela limpa para os recursos de tratamento da informação (como bloqueio automático de tela), reduzindo o risco de exposição de informações a pessoas não autorizadas.", "analisa": "- a) Política de trabalho remoto é o escopo do controle A.6.7, tema completamente diferente do controle A.7.7, que trata de exposição física de informações no ambiente de trabalho.\n- c) Um sistema de armários pode até apoiar a organização, mas não é o controle em si; o foco do A.7.7 são as regras de conduta quanto a documentos expostos e telas desbloqueadas, não o mobiliário de guarda de pertences pessoais.", "dica": "A.7.7 é o clássico \"mesa limpa e tela limpa\" — muito cobrado em cenários de escritório aberto (open space) e visitantes circulando perto de estações de trabalho.", "resumo": "Nada de papel sensível à vista nem tela desbloqueada: mesa limpa e tela limpa sempre."}, "79": {"resposta_correta": "b) Posicionar os equipamentos com segurança e proteção.", "justificativa": "O controle A.7.8 (Localização e proteção de equipamentos) exige que os equipamentos sejam posicionados com segurança e proteção, reduzindo riscos de ameaças ambientais e perigos, além de oportunidades de acesso não autorizado — por exemplo, evitando posicionar telas voltadas para janelas ou áreas de grande circulação de pessoas não autorizadas.", "analisa": "- a) Etiquetar equipamentos é uma prática de gestão de ativos (relacionada ao inventário, A.5.9), mas não trata do posicionamento físico seguro exigido especificamente pelo controle A.7.8.\n- c) Deixar equipamentos deliberadamente visíveis e acessíveis, mesmo que para facilitar manutenção, aumenta a exposição a acesso não autorizado, furto ou observação indevida de informações (shoulder surfing), contrariando o propósito do controle.", "dica": "A.7.8 é sobre onde e como o equipamento fica fisicamente posicionado — pense em servidores fora de áreas de trânsito, monitores não voltados para janelas ou corredores públicos.", "resumo": "Equipamento bem posicionado é aquele protegido de olhares, acidentes e acessos indevidos, não o mais visível ou acessível."}, "80": {"resposta_correta": "b) Aplicar segurança a equipamentos utilizados fora das instalações, como proteção física, criptografia e política de uso aceitável (Controle A.7.9).", "justificativa": "O controle A.7.9 (Segurança de ativos fora das instalações) exige que segurança seja aplicada a ativos que operam fora das instalações da organização, considerando os diferentes riscos de trabalhar fora do ambiente controlado — o que inclui medidas como proteção física do dispositivo, criptografia de disco, VPN e uma política clara de uso aceitável para equipamentos levados para fora.", "analisa": "- a) Proibir completamente o uso externo é uma medida desproporcional que pode inviabilizar a operação do negócio (ex.: trabalho remoto ou viagens corporativas); a norma não exige proibição, e sim gestão adequada do risco.\n- c) Confiar que os colaboradores adotarão boas práticas por conta própria, sem orientação formal, contraria diretamente o cenário descrito (ausência de qualquer orientação ou controle) e o requisito do controle de aplicar medidas de segurança formais.", "dica": "A.7.9 fecha a família de controles físicos e é frequentemente citado junto com A.6.7 (trabalho remoto) em cenários de \"levar equipamento para casa\" — a diferença é que A.7.9 foca no ativo em si (proteção física, criptografia), enquanto A.6.7 foca nas condições do trabalho remoto como um todo.", "resumo": "Equipamento fora da empresa não é \"terra sem lei\": precisa de proteção física, criptografia e regras claras de uso."}, "81": {"resposta_correta": "b) A preservação da confidencialidade, integridade e disponibilidade da informação.", "justificativa": "A ISO/IEC 27000 (norma de vocabulário do conjunto 27k, referenciada normativamente pela ISO/IEC 27001:2022) define segurança da informação exatamente como a preservação da confidencialidade, integridade e disponibilidade da informação (o tradicional \"CID\" ou \"CIA triad\"), podendo ainda envolver outras propriedades como autenticidade, responsabilidade, não repúdio e confiabilidade. Esses três pilares são a base conceitual sobre a qual todo o SGSI (Sistema de Gestão da Segurança da Informação) é construído, independentemente da tecnologia usada.", "analisa": "- a) Restringe segurança da informação a hardware/software e a ataques cibernéticos, ignorando que a norma trata da informação em qualquer suporte (papel, conhecimento tácito, nuvem) e de qualquer ameaça (não só ataques, mas erros humanos, falhas de processo, desastres naturais etc.).\n- c) Conformidade legal (privacidade, LGPD, GDPR etc.) pode ser uma das entradas do SGSI, mas não é a definição de segurança da informação — é apenas um dos requisitos de partes interessadas que o SGSI pode precisar atender.", "dica": "Sempre que a questão perguntar \"o que é segurança da informação\", a resposta-âncora é CID (confidencialidade, integridade, disponibilidade). Cuidado com alternativas que citam apenas tecnologia ou apenas compliance — a norma é agnóstica de tecnologia e mais ampla que apenas leis.", "resumo": "Segurança da informação = CID: Confidencialidade + Integridade + Disponibilidade."}, "82": {"resposta_correta": "c) Proteger a informação contra divulgação não autorizada.", "justificativa": "Confidencialidade, na ISO/IEC 27000, é a \"propriedade de que a informação não esteja disponível ou revelada a indivíduos, entidades ou processos não autorizados\". Para a TechSolution, isso significa impedir que algoritmos proprietários e código-fonte cheguem a concorrentes ou pessoas sem necessidade de acesso — a essência é o controle de quem pode ver a informação.", "analisa": "- a) Essa é a definição de disponibilidade, não de confidencialidade — foca em acesso quando necessário, não em restrição de acesso.\n- b) Essa é a definição de integridade — trata de exatidão e completude da informação, não de sigilo.", "dica": "A prova adora trocar as definições dos três pilares entre si. Decore a palavra-chave de cada um: Confidencialidade → sigilo/não divulgação; Integridade → exatidão/não alteração; Disponibilidade → acesso quando necessário.", "resumo": "Confidencialidade é sobre \"quem pode ver\", não sobre \"quando pode acessar\" ou \"se está correto\"."}, "83": {"resposta_correta": "b) Um processo de gestão de riscos contínuo para a informação.", "justificativa": "A Introdução da norma deixa claro que o SGSI compreende políticas, procedimentos, diretrizes e recursos associados, geridos coletivamente por uma organização, na busca por proteger seus ativos de informação, e que essa proteção é alcançada através de um processo de gestão de riscos contínuo. A tecnologia (como antivírus) é apenas um dos controles possíveis resultantes desse processo — não o fundamento do sistema de gestão.", "analisa": "- a) Tecnologia é um meio de tratamento de risco, não o fundamento do SGSI; um SGSI eficaz pode incluir controles organizacionais, físicos e de pessoas, não apenas tecnológicos.\n- c) Consultoria externa pode apoiar a implementação, mas a norma não estabelece a contratação de terceiros como base do sistema — a responsabilidade e o processo de gestão de riscos são da própria organização.", "dica": "Toda vez que a prova apresentar um \"mito\" (basta comprar ferramenta X), lembre que a ISO 27001 é, no núcleo, uma abordagem baseada em risco e em gestão (pessoas, processos e tecnologia), não uma lista de produtos de segurança.", "resumo": "Antivírus não é SGSI: SGSI é gestão de risco contínua, sistemática e documentada."}, "84": {"resposta_correta": "b) A implementação do SGSI deve ser alinhada aos objetivos de negócio da empresa e integrada à sua estrutura de administração.", "justificativa": "A cláusula 4.4, combinada com a Introdução (0.1), trata a adoção de um SGSI como decisão estratégica para a organização, o que significa que ela deve nascer do nível de liderança (Alta Direção), estar alinhada aos objetivos de negócio e ficar integrada aos processos e à estrutura de gestão já existentes — não é um projeto isolado de TI.", "analisa": "- a) Contradiz diretamente o conceito de \"decisão estratégica\": decisões estratégicas são de responsabilidade da Alta Direção, não de um departamento isoladamente, e devem estar conectadas à direção da empresa como um todo (cláusula 5.1).\n- c) Subestima o impacto do SGSI: a norma exige que a segurança da informação seja incorporada aos processos de negócio (0.1), afetando a operação diária, e não apenas a imagem/marketing da organização.", "dica": "Questões que citam \"decisão estratégica\", \"liderança\", \"integração aos processos de negócio\" apontam sempre para envolvimento da Alta Direção (cláusula 5) e alinhamento com o contexto/objetivos organizacionais (cláusula 4), nunca para decisões isoladas de TI.", "resumo": "SGSI não é projeto de TI: é decisão estratégica da Alta Direção, integrada ao negócio."}, "85": {"resposta_correta": "b) A propriedade de que a informação é completa, precisa e protegida contra modificações indevidas.", "justificativa": "Integridade, conforme a ISO/IEC 27000, é a propriedade de exatidão (accuracy) e completude da informação. Para prontuários eletrônicos, isso significa que os dados clínicos não podem ser alterados, corrompidos ou destruídos de forma não autorizada ou acidental — um requisito vital, já que uma alteração indevida em um prontuário pode colocar a vida do paciente em risco.", "analisa": "- a) Descreve confidencialidade, não integridade.\n- c) Descreve disponibilidade, não integridade.", "dica": "Em cenários de saúde (HealthData, hospitais), a banca costuma explorar a integridade porque um erro em um dado clínico é tão grave quanto um vazamento. Não caia na armadilha de associar \"saúde\" automaticamente à confidencialidade.", "resumo": "Integridade = dado certo, completo e sem alteração indevida."}, "86": {"resposta_correta": "c) Disponibilidade.", "justificativa": "Disponibilidade é a propriedade de a informação estar acessível e utilizável sob demanda por uma entidade autorizada. Em um contexto hospitalar, isso significa que o sistema de prontuário eletrônico precisa estar operacional e acessível aos médicos autorizados sempre que necessário, inclusive em situações de emergência.", "analisa": "- a) Confidencialidade trataria de impedir acesso de pessoas não autorizadas, não de garantir acesso a quem é autorizado.\n- b) Integridade trataria da exatidão do conteúdo do prontuário, não da capacidade de acessá-lo a qualquer momento.", "dica": "Palavras-chave como \"a qualquer momento\", \"quando necessário\", \"sistema no ar\", \"continuidade de acesso\" apontam quase sempre para disponibilidade.", "resumo": "Disponibilidade = acesso garantido a quem tem direito, no momento em que precisa."}, "87": {"resposta_correta": "b) Facilita a integração de processos e a gestão de múltiplos sistemas em uma única estrutura, otimizando recursos.", "justificativa": "O Anexo SL (também chamado de \"High Level Structure\" ou Estrutura de Alto Nível) padroniza a estrutura de cláusulas (seções 4 a 10), termos e definições comuns entre as normas ISO de sistemas de gestão (9001, 14001, 27001, 22301 etc.). Isso permite que uma organização como a Educação Online Global integre seus sistemas de gestão (por exemplo, em um Sistema de Gestão Integrado), reaproveitando processos comuns como auditoria interna, análise crítica pela Direção, controle de documentos e gestão de não conformidades, otimizando recursos e reduzindo esforço duplicado.", "analisa": "- a) Ter a ISO 9001 não substitui nem dispensa a implementação dos requisitos específicos de segurança da informação (avaliação de riscos, Anexo A, SoA etc.) — a estrutura comum facilita a integração, mas não elimina requisitos próprios de cada norma.\n- c) A compatibilidade estrutural entre normas não permite \"escolher\" requisitos da ISO 27001 a implementar; a Seção 1 da norma deixa claro que nenhum requisito das cláusulas 4 a 10 pode ser excluído para fins de certificação.", "dica": "Sempre que aparecer \"Anexo SL\" ou \"estrutura de alto nível\", a resposta correta fala em integração/compatibilidade estrutural entre sistemas de gestão — nunca em substituição de requisitos ou \"escolha à la carte\".", "resumo": "Anexo SL = mesmo \"esqueleto\" para todas as normas de gestão, facilitando integração — mas cada norma mantém seus requisitos específicos."}, "88": {"resposta_correta": "b) Ele oferece uma referência de controles de segurança da informação que devem ser considerados e tratados na Declaração de Aplicabilidade.", "justificativa": "O Anexo A é normativo porque o processo de comparação com ele (cláusula 6.1.3 c) é obrigatório: a organização deve verificar se nenhum controle necessário foi omitido. Porém, os controles listados não são todos de implementação obrigatória — cada um deve ser avaliado quanto à sua aplicabilidade e justificado (incluído ou excluído) na Declaração de Aplicabilidade (SoA), com base no resultado da avaliação e do tratamento de riscos.", "analisa": "- a) Errado dizer que todos os controles do Anexo A devem ser seguidos \"ao pé da letra\" — a norma exige apenas que sejam considerados; a implementação depende da análise de riscos de cada organização.\n- c) O Anexo A não define metodologia de avaliação de riscos (isso é tratado na cláusula 6.1.2, cuja metodologia é definida pela própria organização); o Anexo A é justamente uma lista de referência de controles.", "dica": "Decore: Anexo A é normativo quanto ao processo de comparação/verificação, mas não é uma lista de implementação obrigatória e universal — é referência de controle a ser justificada no SoA.", "resumo": "Anexo A = catálogo de referência de controles; SoA = onde se justifica o que foi incluído/excluído."}, "89": {"resposta_correta": "b) Que os objetivos devem ser registrados em um formato controlável para evidência e rastreamento.", "justificativa": "\"Reter informação documentada\" é uma exigência recorrente na norma (cláusula 7.5) que significa manter um registro formal, controlado (com identificação, versão, proteção e disponibilidade adequadas), capaz de servir como evidência objetiva de que um requisito foi cumprido. No caso dos objetivos de segurança da informação (6.2), isso garante rastreabilidade de metas, prazos e responsáveis, permitindo auditoria e análise crítica posteriores.", "analisa": "- a) A norma exige registro formal, não memorização — \"informação documentada\" é, por definição, informação que precisa ser controlada e mantida, e memória não atende a esse requisito nem gera evidência auditável.\n- c) O acesso à informação documentada deve ser definido conforme a necessidade organizacional (inclusive das partes interessadas internas relevantes), não restrito apenas a auditores externos; isso limitaria indevidamente a gestão interna do próprio SGSI.", "dica": "Toda vez que a norma disser \"reter informação documentada\" ou \"manter informação documentada\", pense em evidência objetiva, controlada e rastreável — é a linguagem-padrão de sistemas de gestão (Anexo SL) para \"isso precisa estar registrado e disponível\".", "resumo": "Se não está documentado e controlado, para efeitos de auditoria, não aconteceu."}, "90": {"resposta_correta": "b) Segurança por design.", "justificativa": "A Introdução da norma destaca que é importante que a segurança da informação seja considerada no projeto (design) de processos, sistemas de informação e controles — ou seja, incorporada desde a concepção, e não adicionada posteriormente como \"remendo\". Esse conceito é conhecido no mercado como \"security by design\" (segurança desde a concepção), análogo ao conceito de \"privacy by design\" da LGPD/GDPR.", "analisa": "- a) Segurança reativa é o oposto do que a norma preconiza: agir somente depois que um incidente ocorre, em vez de prevenir desde o início do projeto.\n- c) Segurança por compliance foca apenas em atender exigências legais/regulatórias formalmente, o que não é a mesma coisa que incorporar segurança na arquitetura e no design de processos e sistemas desde o início.", "dica": "Fixe o termo \"security by design\" (ou \"segurança desde a concepção\") — é um conceito frequentemente cobrado em provas de Lead Implementer, especialmente em cenários de desenvolvimento de software e novos produtos (como fintechs e apps).", "resumo": "Segurança entra no projeto desde o dia zero — não é um adesivo colado depois de pronto."}, "91": {"resposta_correta": "c) Descrever a visão geral e o vocabulário do sistema de gestão da segurança da informação.", "justificativa": "A ISO/IEC 27000 é a norma \"guarda-chuva\" da família 27k: apresenta uma visão geral dos SGSI e define os termos e conceitos usados em todas as demais normas da família (incluindo a 27001), como \"risco\", \"ativo\", \"confidencialidade\", \"parte interessada\" etc. É referência normativa explícita na cláusula 3 (Termos e definições) da ISO/IEC 27001:2022, que remete o leitor à 27000 para o vocabulário.", "analisa": "- a) A 27000 não é uma lista de vulnerabilidades — bases de vulnerabilidades são mantidas por outras fontes (como CVE), fora do escopo da família 27k.\n- b) Requisitos técnicos detalhados de firewalls e IDS/IPS não são tratados na 27000 nem na 27001; controles técnicos de rede aparecem de forma genérica no Anexo A (ex.: 8.20, 8.21) e orientações mais detalhadas estão em normas complementares como a ISO/IEC 27033.", "dica": "Toda vez que a prova perguntar sobre \"vocabulário\" ou \"visão geral\" do conjunto de normas 27k, a resposta é ISO/IEC 27000. Não confunda com a 27002 (guia de implementação de controles) nem com a 27005 (gestão de riscos).", "resumo": "ISO/IEC 27000 = dicionário e mapa da família 27k."}, "92": {"resposta_correta": "b) O efeito da incerteza nos objetivos da segurança da informação.", "justificativa": "A ISO/IEC 27000 define risco (alinhado à ISO 31000) como o \"efeito da incerteza nos objetivos\", e risco de segurança da informação como associado ao potencial de ameaças explorarem vulnerabilidades de um ativo de informação, causando dano à organização. É um conceito prospectivo e probabilístico, não um evento já concretizado.", "analisa": "- a) Um evento que já ocorreu e causou dano é um incidente de segurança da informação, não um risco — risco é sobre possibilidade futura, incidente é sobre fato consumado.\n- c) Isso descreve uma vulnerabilidade, que é apenas um dos componentes do risco (junto com ameaça e impacto), não o risco em si.", "dica": "A prova adora confundir os três conceitos: vulnerabilidade (fraqueza), ameaça (potencial causador de dano) e risco (combinação de probabilidade e impacto de uma ameaça explorar uma vulnerabilidade). Risco ≠ vulnerabilidade ≠ incidente.", "resumo": "Risco é o \"e se\" (futuro/incerto); incidente é o \"aconteceu\" (passado/fato)."}, "93": {"resposta_correta": "b) A norma é universalmente adaptável, mas a forma de implementação deve ser adequada ao contexto específico de cada organização.", "justificativa": "A Seção 1 (Escopo) afirma que os requisitos são genéricos e aplicáveis a qualquer organização, independentemente de tipo, tamanho e natureza. Isso não significa uniformidade de implementação: a cláusula 4.1 (contexto) e o próprio espírito da norma exigem que cada organização adapte a extensão e a profundidade dos controles ao seu próprio contexto, riscos e complexidade — uma pequena transportadora e uma multinacional terão SGSIs de porte e sofisticação diferentes, mas ambos igualmente válidos e certificáveis.", "analisa": "- a) Aplicar \"sem qualquer adaptação\" contraria o princípio de que o SGSI deve ser dimensionado ao contexto de cada organização — não existe um SGSI de \"tamanho único\".\n- c) A norma não prevê isenções de requisitos por porte da empresa: a Seção 1 explicitamente proíbe a exclusão de qualquer requisito das cláusulas 4 a 10 para fins de certificação, independentemente do tamanho da organização.", "dica": "\"Aplicável a qualquer organização\" é frequentemente mal interpretado como \"implementação idêntica para todos\". Lembre-se: os requisitos (cláusulas 4-10) são fixos e não podem ser excluídos, mas a forma/profundidade de atendê-los é escalável ao contexto.", "resumo": "Requisitos são universais e não excludíveis; a implementação é sempre sob medida."}, "94": {"resposta_correta": "c) Requisitos legais, regulamentares, contratuais e as expectativas de segurança dos stakeholders.", "justificativa": "A cláusula 4.2 exige que a organização determine as partes interessadas relevantes para o SGSI e seus requisitos pertinentes. A própria norma traz uma nota esclarecendo que esses requisitos podem incluir requisitos legais e regulamentares e obrigações contratuais — além das expectativas de clientes, fornecedores, reguladores, acionistas e demais stakeholders relacionados à segurança da informação.", "analisa": "- a) Restringir a apenas requisitos internos da alta direção ignora a essência da cláusula 4.2, que é justamente identificar requisitos externos (legais, contratuais, de clientes) além dos internos.\n- b) A cláusula 4.2 não se limita a requisitos técnicos de TI — trata de partes interessadas em sentido amplo (jurídico, comercial, regulatório, social), muito além da infraestrutura tecnológica.", "dica": "Sempre que aparecer \"partes interessadas\" (cláusula 4.2), lembre da tríade: requisitos legais/regulamentares + obrigações contratuais + expectativas/necessidades das partes interessadas relevantes. Essa cláusula alimenta diretamente o escopo (4.3) e os riscos (6.1).", "resumo": "Partes interessadas trazem de tudo: lei, contrato e expectativa — nunca é só \"TI\" ou só \"chefia\"."}, "95": {"resposta_correta": "b) Para verificar se nenhum controle necessário foi omitido.", "justificativa": "A cláusula 6.1.3 c) exige que a organização compare os controles determinados no tratamento de riscos com os do Anexo A, com o único propósito de verificar se nenhum controle necessário foi negligenciado ou omitido — funcionando como uma \"checklist de sanidade\" (gap check) sobre o processo de tratamento de riscos conduzido pela organização, e não como uma imposição de controles não relacionados aos riscos identificados.", "analisa": "- a) A comparação não obriga a implementação de todos os controles do Anexo A independentemente da relevância — cada controle deve ser justificado com base no risco, podendo ser legitimamente excluído no SoA se não for aplicável.\n- c) O Anexo A não substitui controles internos: ele serve como referência de verificação; controles próprios da organização (não listados no Anexo A) também podem e devem ser incluídos no tratamento de riscos, se necessários.", "dica": "A frase \"nenhum controle necessário foi omitido\" é praticamente literal da norma (6.1.3 c) — decore-a, pois é frequentemente cobrada ipsis litteris ou parafraseada.", "resumo": "Anexo A funciona como checklist de conferência, não como lista de compras obrigatória."}, "96": {"resposta_correta": "b) Assegurar que o SGSI continue a operar de forma eficaz e que seus controles e processos estejam atualizados e funcionando.", "justificativa": "A cláusula 4.4 estabelece quatro verbos-chave: estabelecer, implementar, manter e melhorar continuamente. \"Manter\" significa preservar a operação eficaz do sistema ao longo do tempo — atualizar controles, revisar processos, garantir que o que foi implementado continue funcionando e sendo pertinente, e não apenas ser criado uma vez e esquecido. É a garantia de sustentabilidade operacional do SGSI no dia a dia.", "analisa": "- a) Reduzir a manutenção a \"reagir a incidentes\" é uma postura reativa, incompatível com a natureza contínua e proativa da manutenção de um SGSI, que deve ser monitorado e ajustado independentemente de haver incidentes.\n- c) Guardar documentação é parte do controle da informação documentada (cláusula 7.5.3), mas não é a definição de \"manter o SGSI\" — manter envolve a operação viva do sistema, não apenas o arquivamento de papéis.", "dica": "Lembre dos quatro verbos da cláusula 4.4 (estabelecer, implementar, manter, melhorar continuamente) — a prova gosta de testar se você sabe diferenciar cada um: estabelecer = criar; implementar = colocar em prática; manter = sustentar a operação; melhorar = evoluir o sistema (cláusula 10).", "resumo": "Manter é manter vivo e funcionando — não é guardar na gaveta."}, "97": {"resposta_correta": "b) Assegurar que os recursos necessários para o SGSI estejam disponíveis.", "justificativa": "A cláusula 5.1 lista diversas evidências de liderança e comprometimento da Alta Direção, entre elas: assegurar que a política e os objetivos de segurança da informação sejam estabelecidos e compatíveis com a direção estratégica; assegurar a integração dos requisitos do SGSI aos processos de negócio; e, de forma explícita, assegurar que os recursos necessários para o SGSI estejam disponíveis (pessoas, orçamento, infraestrutura, tempo). Sem recursos, o SGSI não sai do papel.", "analisa": "- a) Delegar totalmente as decisões de segurança à TI contraria o requisito de liderança ativa: a Alta Direção deve se engajar, orientar e prestar contas pela eficácia do SGSI, não apenas transferir a responsabilidade.\n- c) Uma participação pontual (apenas no kickoff) não configura comprometimento contínuo; a norma exige envolvimento sustentado, incluindo a análise crítica periódica (cláusula 9.3) e o apoio constante às funções relevantes.", "dica": "A cláusula 5.1 é uma das mais cobradas em provas de Lead Implementer/Auditor: memorize que ela lista responsabilidades específicas e não delegáveis da Alta Direção (política, objetivos, recursos, integração ao negócio, comunicação da importância, apoio a funções, promoção da melhoria contínua).", "resumo": "Sem recursos garantidos pela Alta Direção, não existe comprometimento real — só discurso."}, "98": {"resposta_correta": "b) Assegurar que o SGSI seja relevante e eficaz para o contexto operacional e estratégico da organização.", "justificativa": "A cláusula 4.3 exige que, ao determinar o escopo, a organização considere as questões internas e externas referidas em 4.1 e os requisitos referidos em 4.2, além das interfaces e dependências entre as atividades realizadas pela organização e as realizadas por outras organizações. Isso garante que o escopo não seja definido arbitrariamente, mas reflita o contexto real (mercado, regulação, cultura, tecnologia, partes interessadas) em que a organização opera, tornando o SGSI pertinente e eficaz.", "analisa": "- a) Restringir o escopo apenas a questões financeiras ignora a amplitude da cláusula 4.1, que trata de questões internas e externas de qualquer natureza (estratégica, legal, tecnológica, cultural, competitiva), não somente financeira.\n- c) Ignorar questões externas contraria diretamente a exigência da cláusula 4.1, que trata questões internas e externas como igualmente relevantes para o contexto da organização.", "dica": "Lembre da cadeia lógica: 4.1 (contexto interno/externo) + 4.2 (partes interessadas) + interfaces e dependências → alimentam 4.3 (escopo). Isso é testado com frequência em formato de \"qual cláusula alimenta qual\".", "resumo": "O escopo nasce do contexto — não pode ser definido no vácuo, ignorando o ambiente da organização."}, "99": {"resposta_correta": "b) Para fornecer clareza e transparência sobre os limites e a aplicabilidade do SGSI, tanto interna quanto externamente.", "justificativa": "A cláusula 4.3 exige que o escopo esteja disponível como informação documentada. Isso é essencial porque o escopo define os limites e a aplicabilidade do SGSI: quais unidades de negócio, processos, localidades e ativos estão dentro (ou fora) da certificação. Documentar e comunicar isso com clareza evita ambiguidades para auditores, clientes, parceiros e para o próprio time interno — todos precisam saber exatamente o que está \"coberto\" pelo SGSI certificado.", "analisa": "- a) Reduzir a exigência a \"mera formalidade\" ignora o propósito prático de transparência e gestão que a documentação do escopo cumpre, inclusive para evitar declarações enganosas sobre o que está certificado.\n- c) A ideia de alteração \"secreta\" contraria o princípio de controle da informação documentada (cláusula 7.5.3), que exige rastreabilidade, versionamento e comunicação adequada de mudanças, especialmente em algo tão sensível quanto o escopo do SGSI.", "dica": "Cuidado com alternativas que usam palavras como \"secretamente\", \"apenas para cumprir tabela\" ou \"sem impacto real\" — normalmente são pegadinhas que subestimam o propósito prático dos requisitos de documentação.", "resumo": "Escopo documentado = transparência sobre o que está (e o que não está) dentro do SGSI certificado."}, "100": {"resposta_correta": "b) Ser apropriada ao propósito da organização e incluir o comprometimento com a melhoria contínua do SGSI.", "justificativa": "A cláusula 5.2 exige que a política de segurança da informação seja apropriada ao propósito da organização, inclua os objetivos de segurança da informação (ou forneça a estrutura para estabelecê-los), inclua o comprometimento em satisfazer os requisitos aplicáveis e o comprometimento com a melhoria contínua do SGSI. É um documento estratégico e de alto nível, não um manual técnico detalhado.", "analisa": "- a) A política não deve ser um documento longo cheio de configurações técnicas — esse nível de detalhe pertence a procedimentos e normas técnicas específicas, não à política, que é declaratória e de alto nível.\n- c) A cláusula 5.2 exige que a política esteja disponível como informação documentada, seja comunicada dentro da organização e disponível para as partes interessadas, conforme apropriado — restringi-la apenas à equipe de segurança contraria essa exigência de comunicação ampla.", "dica": "Não confunda política (alto nível, estratégica, cláusula 5.2) com procedimentos e normas técnicas (nível operacional, controles do Anexo A). A política é curta, principiológica e amplamente comunicada.", "resumo": "Política é a \"declaração de intenções\" da organização — não um manual técnico."}, "101": {"resposta_correta": "b) Para assegurar que os objetivos estratégicos de segurança estejam alinhados às diretrizes e princípios estabelecidos na política.", "justificativa": "A cláusula 6.2 exige que os objetivos de segurança da informação sejam consistentes com a política, mensuráveis (se possível), levem em conta requisitos aplicáveis, resultados de avaliação e tratamento de riscos, sejam comunicados e atualizados. A consistência com a política garante coerência vertical no SGSI: a política define o \"porquê\" e as diretrizes gerais, e os objetivos traduzem isso em metas concretas alinhadas ao mesmo propósito.", "analisa": "- a) A norma não exige objetivos \"difíceis\" propositalmente — pelo contrário, objetivos costumam seguir a lógica SMART (específicos, mensuráveis, alcançáveis, relevantes e com prazo), o que exclui metas inatingíveis por design.\n- c) Tratar a política como \"mera formalidade\" contraria a essência da cláusula 5.2, que exige uma política com comprometimento real e efeito prático sobre toda a estrutura do SGSI, incluindo os objetivos.", "dica": "Política (5.2) e objetivos (6.2) sempre andam juntos nas provas: política = diretrizes gerais; objetivos = metas específicas derivadas dessas diretrizes. Um não pode contradizer o outro.", "resumo": "Objetivos são o desdobramento prático da política — nunca podem contradizê-la."}, "102": {"resposta_correta": "b) A segurança da informação não pode ser uma iniciativa isolada, mas deve ser incorporada aos processos de negócio e à governança da empresa.", "justificativa": "A Introdução (0.1) é enfática ao afirmar que o SGSI deve ser parte de e estar integrado aos processos e à estrutura de gestão geral da organização, e que a segurança da informação deve ser considerada no projeto de processos, sistemas de informação e controles. Isso reforça que segurança não é um \"silo\" isolado, mas uma dimensão transversal da governança corporativa.", "analisa": "- a) Tratar segurança como processo totalmente separado (com equipe e budget isolados, sem integração aos demais processos) contraria diretamente o texto da Introdução, que pede integração, não isolamento.\n- c) A integração não é apresentada como opcional ou condicionada à maturidade — é um princípio estrutural do SGSI, válido desde o primeiro estágio de implementação, ainda que a profundidade da integração possa evoluir com o tempo.", "dica": "\"Integração ao negócio\" é tema recorrente na Introdução da norma e é frequentemente contrastado com a ideia (errada) de segurança como \"departamento isolado de TI\". Fique atento a esse contraste nas alternativas.", "resumo": "Segurança da informação é fio condutor da governança, não um departamento à parte."}, "103": {"resposta_correta": "b) Que esses requisitos são mandatórios e devem ser endereçados pelo SGSI para garantir a conformidade.", "justificativa": "A nota da cláusula 4.2 esclarece que os requisitos das partes interessadas podem incluir requisitos legais, regulamentares e obrigações contratuais. Por sua própria natureza, requisitos legais e contratuais não são opcionais: uma vez identificados como aplicáveis, devem ser endereçados pelo SGSI (frequentemente por meio de controles do tema \"conformidade\" no Anexo A, como o controle 5.31 — requisitos legais, estatutários, regulamentares e contratuais) para que a organização evite sanções, litígios e não conformidades.", "analisa": "- a) Limitar-se ao \"já vigente\" ignora que a cláusula 4.2 e o contexto (4.1) exigem monitoramento contínuo de mudanças, incluindo novas leis e regulamentos que possam vir a se aplicar.\n- c) Requisitos legais e obrigações contratuais não são \"opções de menu\" — uma vez que se aplicam à organização, seu atendimento é obrigatório; a discricionariedade da organização está em como atendê-los (controles), não em se vai atendê-los.", "dica": "Quando a prova mencionar \"requisitos legais, regulamentares e contratuais\", pense sempre em caráter obrigatório de atendimento — é diferente das \"expectativas\" de partes interessadas, que podem ter caráter mais voluntário/estratégico.", "resumo": "Lei e contrato não se \"escolhe seguir\" — se aplicam, o SGSI tem que endereçar."}, "104": {"resposta_correta": "b) Todos os requisitos das Seções 4 a 10 devem ser abordados e implementados para alcançar a certificação, sem exceção.", "justificativa": "A Seção 1 (Escopo) da norma estabelece expressamente que, quando uma organização reivindica conformidade com a ISO/IEC 27001, nenhum dos requisitos especificados nas Seções 4 a 10 pode ser excluído. Isso é diferente do Anexo A, cujos controles podem ser excluídos (com justificativa no SoA) se não forem aplicáveis com base na avaliação de riscos — a flexibilidade de exclusão existe apenas para os controles do Anexo A, nunca para as cláusulas do \"corpo\" da norma (o sistema de gestão em si).", "analisa": "- a) Contraria diretamente o texto da Seção 1: não há discricionariedade para excluir cláusulas de gestão (4 a 10) por decisão própria da organização.\n- c) Inverte o conceito: a possibilidade de exclusão mediante justificativa existe para os controles do Anexo A (via SoA, cláusula 6.1.3), não para as cláusulas do corpo normativo (4 a 10), que são todas obrigatórias.", "dica": "Grave essa distinção fundamental: cláusulas 4-10 = requisitos de gestão, TODOS obrigatórios, sem exclusão. Anexo A = controles de referência, PODEM ser excluídos com justificativa técnica no SoA baseada em risco.", "resumo": "Cláusulas 4 a 10 não se negociam; controles do Anexo A, sim (com justificativa)."}, "105": {"resposta_correta": "b) Que o SGSI inclua os processos necessários e suas interações, de acordo com os requisitos da norma.", "justificativa": "A cláusula 4.4 determina que a organização deve estabelecer, implementar, manter e melhorar continuamente um SGSI, incluindo os processos necessários e suas interações, de acordo com os requisitos desta norma. Essa visão de \"processos e interações\" reflete a abordagem por processos (process approach), típica das normas de sistema de gestão baseadas no Anexo SL, reconhecendo que os processos do SGSI não existem isoladamente, mas se conectam entre si (por exemplo, avaliação de riscos alimenta o tratamento de riscos, que alimenta o SoA).", "analisa": "- a) Criar processos de segurança \"independentemente de outros processos organizacionais\" contraria o princípio de integração destacado na Introdução (0.1) e o conceito de interação de processos da própria cláusula 4.4.\n- c) A norma não define um nível \"mínimo\" de documentação em função do porte ou agilidade desejada pela empresa — o nível de documentação necessário decorre da complexidade dos processos e dos riscos envolvidos, não de uma meta de enxugamento burocrático pré-definida.", "dica": "Startups e pequenas empresas aparecem com frequência em provas para testar se você sabe que a norma não abre exceções de \"menos documentação por ser pequena\" — o que existe é proporcionalidade ao contexto, não uma regra fixa de simplificação.", "resumo": "SGSI é um sistema de processos interligados, não uma coleção de iniciativas soltas."}, "106": {"resposta_correta": "b) Orientar e apoiar pessoas a contribuir para a eficácia do sistema de gestão da segurança da informação.", "justificativa": "Entre as diversas responsabilidades listadas na cláusula 5.1, está a de a Alta Direção dirigir e apoiar pessoas a contribuir para a eficácia do SGSI, além de promover a melhoria contínua e apoiar outras funções gerenciais relevantes a demonstrar sua liderança nas áreas sob sua responsabilidade. Isso caracteriza um papel ativo de patrocínio (sponsorship) e engajamento das pessoas, não apenas assinatura formal de documentos.", "analisa": "- a) Reduzir a liderança a \"aprovar documentos finais\" é uma visão passiva e burocrática, incompatível com o conjunto de responsabilidades ativas listadas na cláusula 5.1 (comunicação, garantia de recursos, integração ao negócio, promoção da melhoria contínua etc.).\n- c) Delegação total ao gerente de TI descaracteriza a liderança da Alta Direção exigida pela norma — a responsabilidade final pelo SGSI é da Alta Direção, que pode distribuir tarefas operacionais, mas não pode se eximir do papel de liderança e prestação de contas.", "dica": "\"Apoiar\", \"orientar\", \"assegurar\", \"promover\", \"comunicar a importância\" são os verbos típicos da cláusula 5.1 — associe-os sempre a ações ativas da Alta Direção, nunca a delegação passiva total.", "resumo": "Liderança é engajamento ativo, não apenas assinatura de papel."}, "107": {"resposta_correta": "b) Que a política deve expressar a intenção da organização em cumprir com as obrigações pertinentes à segurança da informação.", "justificativa": "A cláusula 5.2 b) exige que a política inclua o comprometimento em satisfazer os requisitos aplicáveis relacionados com a segurança da informação. Trata-se de uma declaração de intenção e compromisso de alto nível — a política expressa a postura da organização perante suas obrigações (legais, regulatórias, contratuais, de partes interessadas), sem precisar listar cada requisito individualmente, o que seria função de registros e controles operacionais específicos (por exemplo, um inventário de requisitos legais, ligado ao controle 5.31 do Anexo A).", "analisa": "- a) Listar exaustivamente todos os requisitos legais e regulamentares não é papel da política (documento de alto nível e conciso), mas de registros de conformidade específicos mantidos separadamente.\n- c) A ideia de \"escolher quais requisitos aplicar\" contraria a própria noção de \"requisitos aplicáveis\" — a aplicabilidade decorre da natureza legal/contratual/regulatória do requisito, não de uma escolha discricionária da organização.", "dica": "A política declara compromisso; ela não é o lugar de listas operacionais detalhadas. Fique atento a alternativas que tentam transformar a política em um documento operacional extenso.", "resumo": "A política diz \"nos comprometemos a cumprir\" — os registros específicos dizem \"o quê\", exatamente."}, "108": {"resposta_correta": "b) Assegurar que o SGSI possa alcançar seus resultados pretendidos, prevenir ou reduzir efeitos indesejados e alcançar a melhoria contínua.", "justificativa": "A cláusula 6.1.1 estabelece que, ao planejar o SGSI, a organização deve considerar as questões referidas em 4.1 e os requisitos referidos em 4.2, e determinar os riscos e oportunidades que precisam ser abordados para: assegurar que o SGSI possa alcançar seu(s) resultado(s) pretendido(s); prevenir ou reduzir efeitos indesejados; e alcançar a melhoria contínua. Esse é o propósito central do planejamento baseado em risco em toda a estrutura de Anexo SL.", "analisa": "- a) Redução de custos pode ser uma consequência de um bom planejamento, mas não é o objetivo estabelecido pela cláusula 6.1.1 — o foco da norma é a eficácia do SGSI e a gestão de riscos, não a economia financeira em si.\n- c) A cláusula 6.1.1 trata de riscos e oportunidades de forma ampla (não apenas ameaças) e não se limita a fatores externos — inclui também questões internas (4.1) que podem gerar riscos ou oportunidades.", "dica": "Grave a tríade de objetivos da cláusula 6.1.1: (1) alcançar resultados pretendidos do SGSI; (2) prevenir/reduzir efeitos indesejados; (3) alcançar melhoria contínua. É clássica em provas de certificação.", "resumo": "6.1.1 não é só sobre ameaças — é sobre garantir que o SGSI funcione, evite problemas e sempre melhore."}, "109": {"resposta_correta": "b) Para assegurar que as avaliações de riscos produzam resultados comparáveis, válidos e consistentes.", "justificativa": "A cláusula 6.1.2 exige que a organização defina e aplique um processo de avaliação de riscos que estabeleça e mantenha critérios de risco (incluindo critérios de aceitação de risco e critérios para realizar avaliações), e assegure que avaliações de riscos repetidas produzam resultados consistentes, válidos e comparáveis. Sem critérios claros e estáveis, cada avaliação poderia ser feita de forma subjetiva e não comparável ao longo do tempo, comprometendo a gestão de riscos como um processo confiável e contínuo.", "analisa": "- a) A definição de critérios não visa tornar o processo \"rápido e informal\" — pelo contrário, visa dar rigor e consistência metodológica, o que normalmente exige formalização (não informalidade).\n- c) A norma exige justamente o oposto: reter informação documentada sobre o processo de avaliação de riscos (cláusula 6.1.2, alimentando o 7.5) como evidência de que ele foi executado de forma sistemática.", "dica": "Associe \"critérios de risco\" a consistência, comparabilidade e repetibilidade — são as palavras-chave literais da cláusula 6.1.2 a) 2), muito cobradas em prova.", "resumo": "Sem critérios fixos, não há como comparar riscos de um ano para o outro — critério dá consistência à avaliação."}, "110": {"resposta_correta": "b) O status atual de implementação de cada controle selecionado.", "justificativa": "A cláusula 6.1.3 d) exige que o SoA contenha os controles necessários (determinados em 6.1.3 b e c), a justificativa para sua inclusão, se estão implementados ou não, e a justificativa para exclusões de controles do Anexo A. A indicação \"implementado ou não\" retrata o status real e atual da implementação de cada controle selecionado, funcionando como uma fotografia do estado do SGSI em um dado momento — essencial para auditorias e para o próprio planejamento de implementação.", "analisa": "- a) O SoA não é apenas uma lista de intenções futuras — ele reflete tanto controles já implementados quanto os planejados, com status claro para cada um, não uma lista genérica de planos.\n- c) A lista de exclusões com justificativa é apenas uma parte do SoA; o documento completo abrange todos os controles considerados (incluídos e excluídos), com status de implementação para os incluídos — não é restrito apenas ao que foi excluído.", "dica": "Memorize os quatro elementos obrigatórios do SoA (6.1.3 d): (1) controles necessários; (2) justificativa de inclusão; (3) se estão implementados ou não; (4) justificativa de exclusão de controles do Anexo A.", "resumo": "SoA é retrato completo: o que foi escolhido, por quê, se já está implementado, e o que ficou de fora e por quê."}, "111": {"resposta_correta": "b) Garante que os riscos residuais sejam aceitos e que o plano de tratamento seja endossado pelos proprietários dos riscos e pela alta direção.", "justificativa": "A cláusula 6.1.3 exige que a organização obtenha a aprovação dos proprietários dos riscos quanto ao plano de tratamento de riscos e a aceitação dos riscos residuais de segurança da informação. Isso formaliza uma decisão consciente e com responsabilidade sobre riscos que permanecerão após a aplicação dos controles (risco residual) — não se trata de simples \"informe\", mas de uma aprovação com peso decisório e accountability real dos proprietários dos riscos e, no nível estratégico, da Alta Direção.", "analisa": "- a) A aprovação não é passiva (\"apenas informar sem responsabilidade\") — pelo contrário, ela atribui responsabilidade formal pela aceitação do risco residual a quem aprova.\n- c) A aprovação formal do risco residual não serve para \"evitar responsabilidade por incidentes futuros\" — ao contrário, ela documenta e reforça a responsabilidade dos proprietários do risco pela decisão tomada, o que pode inclusive ser usado para prestação de contas em caso de incidente.", "dica": "Associe sempre \"proprietário do risco\" (risk owner) a responsabilidade e autoridade para aceitar riscos residuais — esse é um conceito central da cláusula 6.1.2/6.1.3 e aparece com frequência disfarçado em diferentes questões.", "resumo": "Aprovar risco residual é assumir responsabilidade por ele — não é \"dar ciência\" apenas."}, "112": {"resposta_correta": "b) De uma forma planejada, com controle e consideração de impactos.", "justificativa": "A cláusula 6.3 (Planejamento de mudanças), introduzida como novidade na versão 2022 da norma, exige que, quando a organização determinar a necessidade de mudanças no SGSI, essas mudanças sejam realizadas de maneira planejada. Isso implica avaliar propósito e possíveis consequências das mudanças, integridade do SGSI, disponibilidade de recursos e alocação/realocação de responsabilidades e autoridades antes de implementá-las — um processo controlado de gestão de mudanças (change management), evitando impactos negativos não avaliados.", "analisa": "- a) Mudanças \"urgentes e sem planejamento\" contrariam diretamente o texto da cláusula 6.3, que exige justamente que as mudanças sejam conduzidas de forma planejada.\n- c) Discussões informais entre funcionários impactados não substituem um processo formal e controlado de gestão de mudanças, que deve considerar impactos sistêmicos no SGSI, recursos e responsabilidades — não apenas percepções informais das pessoas diretamente envolvidas.", "dica": "A cláusula 6.3 é uma das principais novidades da versão 2022 em relação à versão 2013 — provas atualizadas adoram testá-la. Decore que ela trata de mudanças planejadas no SGSI, com atenção a propósito, consequências, integridade do sistema, recursos e responsabilidades.", "resumo": "Mudança no SGSI não é \"no improviso\" — 6.3 exige planejamento formal, novidade da versão 2022."}, "113": {"resposta_correta": "b) A política deve estabelecer as diretrizes e os princípios a partir dos quais os objetivos de segurança serão desenvolvidos.", "justificativa": "A cláusula 5.2 a) prevê duas possibilidades alternativas: a política pode incluir os objetivos de segurança da informação diretamente, OU fornecer a estrutura (framework) para o estabelecimento desses objetivos. Quando a segunda opção é adotada, a política funciona como um guia principiológico — estabelece diretrizes gerais que orientarão a definição posterior de objetivos específicos, mensuráveis e alinhados ao contexto (cláusula 6.2), sem necessariamente listar os objetivos em si dentro do próprio texto da política.", "analisa": "- a) A norma não exige que a política defina os objetivos de forma explícita e obrigatória — essa é apenas uma das duas alternativas previstas (a outra sendo fornecer a estrutura, que é justamente a opção descrita no enunciado).\n- c) Objetivos e política nunca são independentes: a cláusula 6.2 exige explicitamente que os objetivos sejam consistentes com a política, mesmo quando ela apenas fornece a \"estrutura\" (framework) e não os objetivos propriamente ditos.", "dica": "Fique atento à dualidade da cláusula 5.2 a): política pode \"incluir objetivos\" OU \"fornecer estrutura para estabelecê-los\" — são dois caminhos válidos, e a prova gosta de testar se você reconhece essa segunda opção sem confundi-la com ausência de relação.", "resumo": "A política pode ser o \"guarda-chuva\" de princípios sob o qual os objetivos específicos nascem."}, "114": {"resposta_correta": "b) Pessoal competente, infraestrutura, ambiente, tecnologia e recursos financeiros.", "justificativa": "A cláusula 7.1 exige que a organização determine e proveja os recursos necessários para o SGSI de forma ampla — a norma não restringe o conceito de \"recursos\" a um único tipo. Na prática (e conforme orientações complementares de implementação), isso abrange pessoas competentes, infraestrutura física e tecnológica, ambiente de trabalho adequado e recursos financeiros/orçamentários, todos necessários para sustentar o ciclo completo de estabelecer, implementar, manter e melhorar o sistema.", "analisa": "- a) Restringir recursos a \"software e hardware\" é uma visão estritamente tecnológica, incompatível com a amplitude da cláusula 7.1, que trata de recursos organizacionais em sentido pleno (incluindo pessoas e orçamento).\n- c) Um programa de treinamento é um exemplo pontual de ação de competência (cláusula 7.2), não a definição abrangente de \"recursos\" exigida na cláusula 7.1 — é apenas uma manifestação específica, entre muitas outras, do provimento de recursos.", "dica": "A cláusula 7.1 (Recursos) é propositalmente genérica e ampla — desconfie de alternativas que a reduzem a apenas um tipo de recurso (só tecnológico, só treinamento, só financeiro).", "resumo": "Recursos = pessoas + infraestrutura + tecnologia + ambiente + dinheiro, tudo junto, não uma coisa só."}, "115": {"resposta_correta": "b) Assegurar que as pessoas são competentes com base em educação, treinamento ou experiência, e tomar ações para adquirir essa competência.", "justificativa": "A cláusula 7.2 exige que a organização determine a competência necessária das pessoas que realizam trabalho sob seu controle e que afeta o desempenho da segurança da informação, assegure que essas pessoas são competentes com base em educação, treinamento ou experiência apropriados, e, quando aplicável, tome ações para adquirir a competência necessária e avalie a eficácia dessas ações, retendo informação documentada como evidência.", "analisa": "- a) Exigir certificações formais de segurança da informação para todos é mais restritivo do que a norma pede — a cláusula 7.2 aceita educação, treinamento OU experiência, sem exigir certificações específicas como único caminho válido.\n- c) Testes de QI não são um critério previsto pela norma para avaliar competência — a cláusula foca em competência técnica e funcional relacionada às tarefas de segurança da informação, não em aptidão intelectual geral.", "dica": "Decore o \"tripé\" da competência na cláusula 7.2: educação, treinamento ou experiência (não é preciso ter os três — basta uma base apropriada), seguido de ações corretivas quando há lacuna e avaliação da eficácia dessas ações.", "resumo": "Competência vem de educação, treinamento OU experiência — e precisa de evidência documentada."}, "116": {"resposta_correta": "b) Identificação e descrição (título, data, autor), formato e meio, e análise crítica e aprovação para pertinência e adequação.", "justificativa": "A cláusula 7.5.2 estabelece que, ao criar e atualizar a informação documentada, a organização deve assegurar identificação e descrição apropriadas (por exemplo, um título, data, autor ou número de referência), formato apropriado (idioma, versão de software, gráficos) e meio (papel, eletrônico), e análise crítica e aprovação quanto à pertinência (adequação ao propósito) e adequação (suficiência de detalhe). Esses são os três pilares formais de controle na criação/atualização documental.", "analisa": "- a) A norma é agnóstica de meio/formato — não exige papel timbrado nem qualquer suporte físico específico; documentos eletrônicos são plenamente aceitos e, na prática, predominantes.\n- c) Restringir acesso apenas à Alta Direção contraria o próprio propósito da informação documentada, que deve estar disponível a quem precisa dela para operar o SGSI (cláusula 7.5.3), respeitando controles de confidencialidade apropriados, não uma restrição indiscriminada a um único grupo.", "dica": "Diferencie 7.5.2 (criar/atualizar: identificação, formato, análise crítica/aprovação) de 7.5.3 (controle: disponibilidade, proteção, distribuição, retenção, disposição). São etapas complementares do ciclo de vida documental.", "resumo": "Criar/atualizar documento = identificar bem, formatar direito e ser revisado/aprovado antes de valer."}, "117": {"resposta_correta": "b) Disponível e adequada para o uso, onde e quando necessário, e protegida adequadamente.", "justificativa": "A cláusula 7.5.3 exige que a informação documentada requerida pelo SGSI e pela norma seja c
