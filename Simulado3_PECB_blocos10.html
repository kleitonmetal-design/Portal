a norma não nomeia o responsável — na prática, cabe à equipe de segurança da informação definir métodos, com aval da Alta Direção."},"67":{"resposta_correta":"B) Taxa de conformidade com SoA","justificativa":"Um indicador de eficácia dos controles relacionado à conformidade e cobertura da implementação é a taxa de conformidade com a Declaração de Aplicabilidade (SoA), que mostra o percentual de controles listados como aplicáveis no SoA que já foram efetivamente implementados e estão operando conforme planejado — uma métrica direta de progresso e maturidade da implementação.","analisa":"- A) Número de funcionários — o número de funcionários é um dado organizacional geral, sem relação direta com a conformidade ou eficácia dos controles de segurança da informação implementados.\n- C) Orçamento de TI — o orçamento de TI é um indicador de investimento/recurso, mas não mede, por si só, a conformidade ou a eficácia dos controles de segurança implementados — orçamento alto não garante controles eficazes, e vice-versa.","dica":"","resumo":"Taxa de conformidade com o SoA é um indicador direto de eficácia/cobertura de controles."},"68":{"resposta_correta":"C) Anual ou após mudanças","justificativa":"O monitoramento da satisfação de partes interessadas por meio de pesquisas costuma ser realizado com frequência anual, ou de forma adicional sempre que ocorrem mudanças significativas relevantes (por exemplo, mudanças de escopo, incidentes de grande impacto ou alterações regulatórias), garantindo que a percepção das partes interessadas seja capturada de forma periódica e também reativa a eventos relevantes.","analisa":"- A) A cada cinco anos, independentemente de mudanças no contexto — um intervalo tão longo, e insensível a mudanças relevantes no contexto, não permite à organização perceber a tempo alterações na percepção das partes interessadas nem eventos que exijam reavaliação.\n- B) Apenas uma vez, durante a implementação inicial do SGSI — a satisfação de partes interessadas deve ser monitorada de forma contínua ao longo do ciclo de vida do SGSI (alinhado à melhoria contínua da cláusula 10), e não apenas em um único momento inicial.\n\n🔧 **Nota:** as alternativas A e B foram reconstruídas neste gabarito porque seu texto estava ausente/corrompido na base de dados original do simulado. A resposta correta foi ajustada aqui para C, que é a alternativa cujo texto sempre esteve presente e que representa a prática de mercado tecnicamente adequada para o tema.","dica":"","resumo":"Pesquisas de satisfação de partes interessadas: frequência típica anual, ou após mudanças significativas.\n---"},"69":{"resposta_correta":"B) 9.1.3","justificativa":"A cláusula 9.1 exige que a organização retenha informação documentada apropriada como evidência dos resultados de monitoramento, medição, análise e avaliação. Embora a numeração de subitem citada na alternativa ('9.1.3') não corresponda a uma subdivisão oficial da cláusula 9.1 na estrutura da ISO/IEC 27001:2022 (que apresenta a cláusula 9.1 como uma lista de itens a-f, sem numeração adicional de subcláusulas), o conceito correto é que a retenção de registros de monitoramento está prevista, sim, dentro da cláusula 9.1.\n\n⚠️ **Nota técnica:** A numeração '9.1.3' citada na alternativa B não corresponde a uma subcláusula oficial da ISO/IEC 27001:2022 (a cláusula 9.1 não é subdividida dessa forma na norma). O conceito correto — retenção de registros de monitoramento e medição — está, de fato, dentro da cláusula 9.1 em sua totalidade, o que torna a alternativa B a mais próxima da correta entre as três, apesar do número de subcláusula ser impreciso.","analisa":"- A) 7.5.3 — a cláusula 7.5.3 trata do controle de informação documentada em geral (regras de disponibilidade, proteção, distribuição), sendo uma cláusula 'de apoio' aplicável a toda documentação do SGSI, mas não é a cláusula que especificamente exige a retenção de registros de monitoramento e medição.\n- C) 10.2 — a cláusula 10.2 trata do tratamento de não conformidades e ações corretivas, um processo distinto da retenção de registros de monitoramento/medição de desempenho, que é tratada na cláusula 9.1.","dica":"","resumo":"Registros de monitoramento e medição são retidos como informação documentada dentro da cláusula 9.1."},"70":{"resposta_correta":"C) 8.2","justificativa":"A cláusula 8.2 (Avaliação de riscos de segurança da informação) exige que a organização realize avaliações de risco em intervalos planejados ou quando mudanças significativas forem propostas ou ocorrerem, considerando os critérios estabelecidos em 6.1.2. Testes de penetração são uma técnica prática de avaliação de riscos/vulnerabilidades técnicas que podem alimentar esse processo periódico de reavaliação de riscos.","analisa":"- A) 6.1.2 — a cláusula 6.1.2 trata do processo (metodologia) de avaliação de riscos definido inicialmente no planejamento do SGSI, e não da execução periódica e contínua de avaliações operacionais, que é tratada pela cláusula 8.2.\n- B) 9.2.1 (auditoria interna) — a cláusula 9.2.1 trata do programa de auditoria interna, cujo foco é avaliar a conformidade e a implementação eficaz do SGSI como um todo, e não especificamente a execução de testes técnicos como testes de penetração, que se relacionam mais diretamente com a reavaliação periódica de riscos (8.2) e com controles técnicos específicos (ex.: A.8.8).","dica":"","resumo":"Testes de penetração alimentam a avaliação periódica de riscos (cláusula 8.2), distinta da auditoria interna do SGSI (9.2)."},"71":{"resposta_correta":"A) Número de licenças de software de segurança adquiridas","justificativa":"Para medir a eficácia de um controle de conscientização (como campanhas de sensibilização contra phishing), o indicador mais adequado é uma métrica de resultado comportamental direto, como o percentual de funcionários que identificaram corretamente e-mails de phishing em testes simulados. Esse tipo de indicador mede o efeito real do controle sobre o comportamento das pessoas, e não apenas o esforço ou o investimento realizado.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa A ('Número de licenças de software de segurança adquiridas') como correta, mas esse indicador não mede a eficácia de um controle de conscientização, e sim um investimento tecnológico não relacionado ao comportamento humano. A resposta tecnicamente correta é a alternativa B. Recomenda-se estudar esta questão com a resposta correta sendo B.","analisa":"- B) Percentual de funcionários que identificaram corretamente e-mails de phishing em testes simulados — esta é, na verdade, a alternativa tecnicamente correta (ver nota técnica abaixo) — o percentual de acerto em simulações de phishing é um indicador de resultado comportamental direto, adequado para medir a eficácia de um controle de conscientização.\n- C) Valor do orçamento investido em treinamentos de segurança — o valor do orçamento investido em treinamentos é um indicador de insumo (input), medindo o esforço financeiro dedicado, mas não o resultado (outcome) efetivo do treinamento sobre o comportamento das pessoas — orçamento alto não garante, por si só, conscientização eficaz.","dica":"","resumo":"Eficácia de conscientização = medir comportamento real (ex.: acerto em simulação de phishing), não insumos como orçamento ou licenças."},"72":{"resposta_correta":"B) A importância dos processos, resultados de auditorias anteriores e mudanças que afetam a organização","justificativa":"A cláusula 9.2.2 exige que o(s) programa(s) de auditoria interna sejam planejados considerando a importância dos processos envolvidos, os resultados de auditorias anteriores e as mudanças que afetam a organização, além de outros fatores como requisitos legais e contratuais. Esse planejamento baseado em risco permite priorizar recursos de auditoria onde são mais necessários.","analisa":"- A) Apenas a disponibilidade dos auditores internos e o calendário da organização — considerar apenas a disponibilidade dos auditores e o calendário organizacional, sem levar em conta risco, importância dos processos ou resultados anteriores, é uma abordagem insuficiente e contraria a exigência de planejamento baseado em critérios de risco e relevância definida pela cláusula 9.2.\n- C) Somente os requisitos definidos pelo organismo certificador externo — o programa de auditoria interna não deve se basear apenas em requisitos do organismo certificador externo — ele é uma ferramenta de gestão interna do próprio SGSI, com periodicidade e critérios definidos pela organização, ainda que a auditoria externa também avalie esse programa.","dica":"","resumo":"Programa de auditoria interna (9.2) é planejado com base em importância dos processos, mudanças e auditorias anteriores — abordagem baseada em risco."},"73":{"resposta_correta":"C) Oportunidade de melhoria, pois a norma recomenda mas não exige esse item","justificativa":"A cláusula 9.3.2 a) exige explicitamente que a análise crítica pela Direção considere, como entrada, a situação de ações provenientes de análises críticas anteriores. Quando essa entrada obrigatória é omitida da análise crítica, trata-se de uma não conformidade, pois um requisito explícito da norma deixou de ser atendido — e não apenas uma sugestão de boa prática ou uma melhoria opcional.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa C ('Oportunidade de melhoria, pois a norma recomenda mas não exige esse item') como correta, mas essa afirmação está tecnicamente incorreta: a cláusula 9.3.2 a) exige, de forma obrigatória, que a situação de ações de análises críticas anteriores seja uma entrada da análise crítica pela Direção. Sua omissão constitui, portanto, uma não conformidade, e a resposta tecnicamente correta é a alternativa B — que, inclusive, é a única alternativa cujo próprio texto já apresenta o argumento tecnicamente correto. Recomenda-se estudar esta questão com a resposta correta sendo B.","analisa":"- A) Observação, pois não compromete a eficácia do SGSI — classificar a constatação como 'observação' minimiza indevidamente o problema: como a cláusula 9.3.2 a) exige esse item de forma explícita ('shall'), sua ausência é uma falha de conformidade com um requisito normativo, não uma simples observação sem relevância para a eficácia do SGSI.\n- B) Não conformidade, pois a cláusula 9.3.2 a) exige explicitamente esse item como entrada — esta é, na verdade, a alternativa tecnicamente correta (ver nota técnica abaixo) — a cláusula 9.3.2 a) exige explicitamente ('the management review shall include consideration of...') que a situação de ações de análises críticas anteriores seja considerada, tornando sua omissão uma não conformidade.","dica":"","resumo":"Entrada obrigatória da análise crítica omitida (9.3.2 a) = não conformidade, nunca apenas observação ou oportunidade de melhoria."},"74":{"resposta_correta":"A) Apenas decisões sobre o orçamento do próximo exercício fiscal","justificativa":"Os resultados da análise crítica pela Direção (cláusula 9.3.3) devem incluir decisões relacionadas a oportunidades de melhoria contínua e a quaisquer necessidades de mudança no SGSI, incluindo mudanças em recursos, objetivos ou processos, com base na avaliação do desempenho, adequação e eficácia do sistema realizada durante a análise crítica.\n\n⚠️ **Nota técnica:** O gabarito do simulado marca a alternativa A ('Apenas decisões sobre o orçamento do próximo exercício fiscal') como correta, mas essa afirmação restringe indevidamente o escopo da cláusula 9.3.3, que trata de melhoria contínua e necessidades de mudança no SGSI de forma ampla, não apenas orçamentária. A resposta tecnicamente correta é a alternativa B. Recomenda-se estudar esta questão com a resposta correta sendo B.","analisa":"- B) Decisões sobre oportunidades de melhoria contínua e necessidades de mudanças no SGSI — esta é, na verdade, a alternativa tecnicamente correta (ver nota técnica abaixo) — os resultados da análise crítica pela Direção (9.3.3) devem incluir decisões sobre melhoria contínua e necessidades de mudança no SGSI, não apenas questões orçamentárias.\n- C) Exclusivamente ações corretivas para não conformidades identificadas em auditorias — restringir os resultados 'exclusivamente' a ações corretivas de auditorias também é incompleto — a análise crítica pela Direção tem um escopo mais amplo, avaliando desempenho geral do SGSI, e não apenas tratando não conformidades específicas de auditoria.","dica":"","resumo":"Análise crítica pela Direção (9.3.3): decisões sobre melhoria contínua e necessidades de mudança no SGSI — nunca restrita apenas a orçamento ou apenas a ações corretivas."},"75":{"resposta_correta":"B) O que monitorar, os métodos de análise, quando realizar e quem deve analisar e avaliar os resultados","justificativa":"Ao definir o que monitorar e medir (cláusula 9.1), a organização deve determinar: o que precisa ser monitorado e medido, incluindo processos e controles de segurança da informação; os métodos de monitoramento, medição, análise e avaliação necessários para assegurar resultados válidos; quando o monitoramento e a medição devem ser realizados; quem deve monitorar e medir; quando os resultados devem ser analisados e avaliados; e quem deve analisar e avaliar esses resultados.","analisa":"- A) Apenas os resultados financeiros impactados por incidentes de segurança — restringir a determinação apenas aos 'resultados financeiros impactados por incidentes' ignora o escopo muito mais amplo da cláusula 9.1, que trata do desempenho de processos e controles de segurança da informação de forma geral, não apenas do impacto financeiro de incidentes.\n- C) Somente os indicadores exigidos pelo organismo de certificação contratado — a cláusula 9.1 não se limita aos indicadores exigidos por um organismo de certificação externo — a organização deve definir seus próprios métodos e indicadores de monitoramento com base em suas necessidades e riscos, independentemente de exigências externas de certificação.","dica":"","resumo":"Cláusula 9.1: definir o quê, métodos, quando, quem mede e quem analisa/avalia — não apenas impacto financeiro ou exigências do certificador."},"76":{"resposta_correta":"B) A pertinência, adequação e eficácia do SGSI","justificativa":"A cláusula 10.1 exige que a organização melhore continuamente a pertinência (adequação ao propósito), a adequação (suficiência dos recursos e processos) e a eficácia (capacidade de produzir os resultados pretendidos) do SGSI como um todo. Essa melhoria contínua vai além dos controles técnicos isoladamente ou de processos com não conformidades específicas — abrange o sistema de gestão de forma holística.","analisa":"- A) Apenas a eficiência operacional dos controles técnicos implementados — restringir a melhoria contínua apenas à 'eficiência operacional dos controles técnicos' ignora as dimensões de pertinência e adequação, e limita indevidamente o escopo da melhoria contínua aos aspectos puramente técnicos, quando a norma trata do SGSI como um todo.\n- C) Somente os processos com não conformidades identificadas em auditorias — limitar a melhoria contínua 'somente aos processos com não conformidades identificadas' contraria o espírito proativo da cláusula 10.1 — melhoria contínua deve ocorrer mesmo em processos sem não conformidades registradas, buscando aprimoramento constante e não apenas correção reativa de falhas.","dica":"","resumo":"Melhoria contínua (10.1) = pertinência + adequação + eficácia do SGSI como um todo."},"77":{"resposta_correta":"B) Avaliar a necessidade de ações para eliminar as causas e evitar recorrência","justificativa":"Ao tratar uma não conformidade (cláusula 10.2), a organização primeiro reage a ela — controlando e corrigindo a não conformidade e lidando com suas consequências (10.2 a). Em seguida, deve avaliar a necessidade de ação para eliminar a(s) causa(s) raiz da não conformidade, de modo a evitar que ela se repita ou ocorra em outro lugar (10.2 b) — essa avaliação de causa raiz é o que diferencia uma simples correção pontual de uma verdadeira ação corretiva.","analisa":"- A) Notificar imediatamente o organismo certificador sobre a ocorrência — não há exigência genérica de notificar imediatamente o organismo certificador sobre toda não conformidade interna identificada — a comunicação com o organismo certificador segue regras contratuais específicas (geralmente relacionadas a não conformidades que afetem a validade da certificação), e não é o próximo passo padrão exigido pela cláusula 10.2.\n- C) Arquivar a documentação e encerrar o registro da não conformidade — arquivar e encerrar o registro antes de avaliar a necessidade de ações para eliminar causas raiz e verificar a eficácia das ações tomadas contraria a sequência exigida pela cláusula 10.2, que só prevê o encerramento após a análise de causa, implementação de ações e revisão de eficácia.","dica":"","resumo":"Após corrigir a não conformidade, o próximo passo é avaliar a necessidade de eliminar suas causas raiz — não arquivar nem notificar o certificador automaticamente."},"78":{"resposta_correta":"B) Diagrama de Ishikawa (espinha de peixe) ou metodologia dos 5 Porquês","justificativa":"Para realizar a análise de causa raiz de uma não conformidade, ferramentas estruturadas como o Diagrama de Ishikawa (também chamado de diagrama de espinha de peixe ou causa-e-efeito) e a metodologia dos 5 Porquês (5 Whys) são amplamente recomendadas e utilizadas na prática de gestão da qualidade e segurança da informação, pois ajudam a investigar sistematicamente as causas subjacentes de um problema, e não apenas seus sintomas.","analisa":"- A) Apenas análise de custo-benefício dos controles envolvidos — a análise de custo-benefício é uma ferramenta de avaliação de viabilidade financeira de controles, útil em outras etapas (como seleção de tratamento de riscos), mas não é a ferramenta indicada especificamente para investigar causas raiz de não conformidades.\n- C) Exclusivamente testes de penetração técnicos — testes de penetração são uma técnica de avaliação de vulnerabilidades técnicas, mas não são uma ferramenta de análise de causa raiz de não conformidades em geral, que podem ter origem processual, humana ou organizacional, e não apenas técnica.","dica":"","resumo":"Análise de causa raiz de não conformidades = Diagrama de Ishikawa ou 5 Porquês."},"79":{"resposta_correta":"B) Evidenciar o aprendizado organizacional e a eficácia das ações tomadas para eliminar causas","justificativa":"A retenção de informação documentada sobre a natureza das não conformidades, as ações tomadas e os resultados de qualquer ação corretiva (cláusula 10.2 f e g) serve, principalmente, para evidenciar o aprendizado organizacional obtido com o tratamento do problema e a eficácia das ações implementadas para eliminar suas causas — permitindo, inclusive, identificar padrões e prevenir recorrências futuras.","analisa":"- A) Comprovar ao organismo certificador que a organização seguiu todos os requisitos formais — embora essa documentação também possa ser usada como evidência de conformidade formal perante o organismo certificador, esse não é o propósito principal exigido pela norma — o foco central da cláusula 10.2 f-g está no aprendizado organizacional e na eficácia das ações, não em uma finalidade meramente burocrática de auditoria externa.\n- C) Calcular o custo total das não conformidades para reporte à Alta Direção — calcular o custo total de não conformidades pode ser um subproduto útil da análise de dados, mas não é o propósito principal que a cláusula 10.2 atribui à retenção dessa informação documentada, que está centrado em aprendizado e eficácia das ações corretivas.","dica":"","resumo":"Registros de não conformidade e ação corretiva (10.2 f-g) existem para evidenciar aprendizado organizacional e a eficácia das ações tomadas."},"80":{"resposta_correta":"B) Relatórios de vendas do departamento comercial","justificativa":"A melhoria contínua do SGSI (cláusula 10.1) é tipicamente impulsionada por fontes diretamente ligadas ao desempenho de segurança da informação, como resultados de auditorias internas e externas, lições aprendidas de incidentes de segurança, resultados de análises críticas pela Direção e mudanças no contexto de riscos. Relatórios de vendas do departamento comercial não têm relação direta com o desempenho ou a eficácia do SGSI, não sendo, portanto, uma fonte típica de oportunidades de melhoria para a segurança da informação.","analisa":"- A) Resultados de auditorias internas e externas — resultados de auditorias internas e externas são, de fato, uma fonte típica e frequentemente citada de oportunidades de melhoria do SGSI, portanto não é a resposta correta para 'o que NÃO é uma fonte típica'.\n- C) Lições aprendidas de incidentes de segurança — lições aprendidas de incidentes de segurança são, de fato, uma fonte típica e valiosa de oportunidades de melhoria (alimentando inclusive a cláusula 10.2), portanto também não é a resposta correta para 'o que NÃO é uma fonte típica'.","dica":"","resumo":"Relatórios de vendas não alimentam a melhoria contínua do SGSI — auditorias e lições de incidentes, sim."}};

      function renderExplicacao(numeroQuestao) {

              <h3 style="color: #15803d; margin-bottom: 10px;">✅ Resposta Correta</h3>

      }
