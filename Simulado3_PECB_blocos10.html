<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISO/IEC 27001 Lead Implementer Simulator — Simulado 3 (PECB)</title>
    <style>
      :root{
        --bg:#eef1f5; --card:#ffffff; --ink:#1f2937; --muted:#6b7280;
        --border:#e2e5eb; --primary:#2b3a8f; --primary-2:#3b4db8;
        --good:#15803d; --good-bg:#dcfce7; --bad:#b91c1c; --bad-bg:#fee2e2;
        --accent:#2b3a8f; --submit:#1a8a4a; --submit-2:#157a40;
      }
      *{box-sizing:border-box}
      body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
      .shell{max-width:1080px;margin:0 auto;padding:16px 16px 60px}
      .topbar{background:#fff;border:1px solid var(--border);border-radius:12px 12px 0 0;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
      .topbar .examname{font-weight:700}
      .topbar .examname span{color:var(--primary)}
      .loggedas{background:#fde68a;padding:3px 10px;border-radius:6px;font-size:.82rem;font-weight:700}
      .toolbar{background:#fff;border-left:1px solid var(--border);border-right:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
      .navbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center}
      .navbtn:disabled{opacity:.4;cursor:not-allowed}
      .qcounter{font-weight:700;font-size:1.02rem;margin-right:6px}
      .bookmarkbtn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 14px;font-size:.88rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
      .bookmarkbtn.active{background:#fef3c7;border-color:#f59e0b;color:#92400e}
      .spacer{flex:1}
      .timer{font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:6px}
      .timer.low{color:var(--bad)}
      .timer.ok{color:#374151}
      .pausebtn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:9px 14px;font-size:.88rem;font-weight:600;cursor:pointer}
      .submitbtn{background:var(--submit);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:.9rem;font-weight:700;cursor:pointer}
      .submitbtn:hover{background:var(--submit-2)}
      .filterbar{background:#fff;border-left:1px solid var(--border);border-right:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:16px;font-size:.9rem}
      .filterbar label{display:flex;align-items:center;gap:5px;cursor:pointer}
      .gridwrap{background:#fff;border-left:1px solid var(--border);border-right:1px solid var(--border);padding:14px 20px;max-height:150px;overflow-y:auto}
      .grid{display:flex;flex-wrap:wrap;gap:8px}
      .gridnum{width:42px;height:34px;border-radius:6px;border:1px solid var(--border);background:#fff;font-size:.85rem;font-weight:700;cursor:pointer;color:var(--ink);position:relative}
      .gridnum.current{background:var(--primary);color:#fff;border-color:var(--primary)}
      .gridnum.answered:not(.current){background:#e7ebfd;border-color:#c7d0f5}
      .gridnum.locked{opacity:.35;cursor:not-allowed;background:#f3f4f6}
      .gridnum.bookmarked::after{content:'';position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:#f59e0b}
      .main{background:#fff;border:1px solid var(--border);border-top:none;border-radius:0 0 12px 12px;padding:24px 20px 20px}
      .qtext{font-weight:700;font-size:1.05rem;margin-bottom:18px}
      .opt{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px;cursor:pointer}
      .opt:hover{border-color:var(--accent)}
      .opt.answered{background:#eef1ff;border-color:var(--primary)}
      .opt input{margin-top:3px;flex-shrink:0}
      .footer-actions{margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
      .btn{display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:12px 22px;font-size:1rem;font-weight:600;cursor:pointer}
      .btn:hover{background:var(--primary-2)}
      .btn:disabled{background:#9ca3af;cursor:not-allowed}
      .btn.secondary{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
      .btn.secondary:hover{background:#eef2f7}
      .btn.gray{background:#f3f4f6;color:#374151;border:1px solid var(--border)}
      .btn.gray:hover{background:#e5e7eb}
      .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
      h1{font-size:1.4rem;margin:0 0 4px}
      .sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
      .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0 22px}
      .stat-box{border:1px solid var(--border);border-radius:12px;padding:16px}
      .stat-box .num{font-size:1.8rem;font-weight:700}
      .stat-box .label{color:var(--muted);font-size:.85rem}
      .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:700}
      .pill.good{background:var(--good-bg);color:var(--good)}
      .pill.bad{background:var(--bad-bg);color:var(--bad)}
      .review-list{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
      .review-chip{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:#fff}
      .review-chip.ok{background:var(--good)}
      .review-chip.no{background:var(--bad)}
      .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
      .bar-label{width:250px;flex-shrink:0;font-size:.85rem;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .bar-track{flex:1;height:16px;background:var(--border);border-radius:999px;overflow:hidden}
      .bar-fill{height:100%;border-radius:999px}
      .bar-pct{width:110px;flex-shrink:0;font-size:.82rem;color:var(--muted);text-align:right}
      .section-title{font-size:.95rem;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.03em;margin:22px 0 10px}
      ul.plain{margin:0;padding-left:0;list-style:none}
      ul.plain li{padding:8px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;font-size:.92rem}
      ul.plain li:last-child{border-bottom:none}
      .overlay-note{background:#eef1ff;border:1px solid #c7d0f5;color:#2b3a8f;border-radius:10px;padding:10px 14px;font-size:.85rem;margin-bottom:18px}
    </style>
  </head>
  <body>
    <div class="shell">
      <div id="app"></div>
    </div>
    <script type="application/json" id="questions-data">[{"id": 1, "text": "1. Uma organização deseja iniciar a implementação da ISO/IEC 27001. Qual é o principal objetivo desta norma?", "options": [{"id": "a", "text": "A) Certificar profissionais de segurança da informação"}, {"id": "b", "text": "B) Estabelecer requisitos para implementar, manter e melhorar continuamente um SGSI"}, {"id": "c", "text": "C) Definir controles técnicos obrigatórios para proteção de redes corporativas"}], "correct_option": "b", "domain": "Domínio 1: Fundamentos e conceitos de segurança da informação e ISO/IEC 27001", "theme": "organizacional"}, {"id": 2, "text": "2. A tríade CIA é central para a segurança da informação. O que significa 'disponibilidade' neste contexto?", "options": [{"id": "a", "text": "A) Garantia de que a informação não é divulgada a pessoas não autorizadas"}, {"id": "b", "text": "B) Propriedade de que a informação é completa e não foi modificada indevidamente"}, {"id": "c", "text": "C) Garantia de que a informação é acessível quando necessária por entidades autorizadas"}], "correct_option": "c", "domain": "Domínio 1: Fundamentos e conceitos de segurança da informação e ISO/IEC 27001", "theme": "organizacional"}, {"id": 3, "text": "3. Qual norma da família ISO/IEC 27000 fornece o vocabulário e os conceitos fundamentais utilizados no SGSI?", "options": [{"id": "a", "text": "A) ISO/IEC 27000"}, {"id": "b", "text": "B) ISO/IEC 27002"}, {"id": "c", "text": "C) ISO/IEC 27005"}], "correct_option": "a", "domain": "Domínio 1: Fundamentos e conceitos de segurança da informação e ISO/IEC 27001", "theme": "organizacional"}, {"id": 4, "text": "4. Uma empresa financeira processa dados de clientes. Qual princípio da segurança da informação é violado quando transações são alteradas sem autorização?", "options": [{"id": "a", "text": "A) Disponibilidade"}, {"id": "b", "text": "B) Integridade"}, {"id": "c", "text": "C) Autenticidade"}], "correct_option": "b", "domain": "Domínio 1: Fundamentos e conceitos de segurança da informação e ISO/IEC 27001", "theme": "organizacional"}, {"id": 5, "text": "5. O Ciclo PDCA (Plan-Do-Check-Act) é subjacente à ISO/IEC 27001. Qual fase corresponde à realização de auditorias internas?", "options": [{"id": "a", "text": "A) Plan"}, {"id": "b", "text": "B) Do"}, {"id": "c", "text": "C) Check"}], "correct_option": "c", "domain": "Domínio 1: Fundamentos e conceitos de segurança da informação e ISO/IEC 27001", "theme": "organizacional"}, {"id": 6, "text": "6. A ISO/IEC 27001:2022 adota a estrutura HLS (High Level Structure). Qual é o principal benefício desta estrutura para organizações com múltiplos sistemas de gestão?", "options": [{"id": "a", "text": "A) Reduz o número de controles obrigatórios a serem implementados"}, {"id": "b", "text": "B) Facilita a integração com outras normas ISO que adotam a mesma estrutura, como ISO 9001 e ISO 22301"}, {"id": "c", "text": "C) Elimina a necessidade de auditorias externas para certificação"}], "correct_option": "b", "domain": "Domínio 1: Fundamentos e conceitos de segurança da informação e ISO/IEC 27001", "theme": "organizacional"}, {"id": 7, "text": "7. Um ativo de informação é definido como algo que possui valor para a organização. Qual dos exemplos abaixo representa um ativo de informação intangível?", "options": [{"id": "a", "text": "A) Servidor de banco de dados"}, {"id": "b", "text": "B) Conhecimento técnico especializado de um colaborador"}, {"id": "c", "text": "C) Cabo de rede do datacenter"}], "correct_option": "b", "domain": "Domínio 1: Fundamentos e conceitos de segurança da informação e ISO/IEC 27001", "theme": "organizacional"}, {"id": 8, "text": "8. A ISO/IEC 27001 especifica que a certificação é válida por quanto tempo, sujeita a auditorias de manutenção?", "options": [{"id": "a", "text": "A) 1 ano"}, {"id": "b", "text": "B) 2 anos"}, {"id": "c", "text": "C) 3 anos"}], "correct_option": "c", "domain": "Domínio 1: Fundamentos e conceitos de segurança da informação e ISO/IEC 27001", "theme": "organizacional"}, {"id": 9, "text": "9. Uma vulnerabilidade é explorada por uma ameaça, resultando em um incidente. Como se define 'risco' neste contexto?", "options": [{"id": "a", "text": "A) A probabilidade de uma ameaça se materializar independentemente de controles"}, {"id": "b", "text": "B) O efeito da incerteza sobre os objetivos da segurança da informação"}, {"id": "c", "text": "C) O impacto financeiro direto de um incidente de segurança"}], "correct_option": "b", "domain": "Domínio 1: Fundamentos e conceitos de segurança da informação e ISO/IEC 27001", "theme": "organizacional"}, {"id": 10, "text": "10. A não repudiação é um conceito importante em transações eletrônicas. O que ela garante?", "options": [{"id": "a", "text": "A) Que a informação não pode ser interceptada em trânsito"}, {"id": "b", "text": "B) Que uma entidade não pode negar ter realizado uma ação ou transação específica"}, {"id": "c", "text": "C) Que apenas usuários autenticados podem acessar sistemas críticos"}], "correct_option": "b", "domain": "Domínio 1: Fundamentos e conceitos de segurança da informação e ISO/IEC 27001", "theme": "organizacional"}, {"id": 11, "text": "11. Qual cláusula da ISO/IEC 27001 aborda o contexto da organização, incluindo partes interessadas internas e externas?", "options": [{"id": "a", "text": "A) Cláusula 4"}, {"id": "b", "text": "B) Cláusula 6"}, {"id": "c", "text": "C) Cláusula 9"}], "correct_option": "a", "domain": "Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 12, "text": "12. No ISMS, a liderança deve demonstrar compromisso estabelecendo a política de segurança da informação. Qual é o principal objetivo dessa política?", "options": [{"id": "a", "text": "A) Definir papéis e responsabilidades"}, {"id": "b", "text": "B) Fornecer estrutura para riscos e conformidade"}, {"id": "c", "text": "C) Estabelecer metas mensuráveis"}], "correct_option": "b", "domain": "Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 13, "text": "13. Os recursos necessários para o ISMS incluem competências. Como a norma trata a conscientização em segurança da informação?", "options": [{"id": "a", "text": "A) Apenas para gerentes"}, {"id": "b", "text": "B) Para todos os que afetam o ISMS"}, {"id": "c", "text": "C) Somente em treinamentos anuais"}], "correct_option": "b", "domain": "Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 14, "text": "14. Na cláusula de suporte, a documentação do ISMS deve incluir informações documentadas. Qual é um exemplo obrigatório?", "options": [{"id": "a", "text": "A)"}, {"id": "b", "text": "B) Escopo do ISMS"}, {"id": "c", "text": "C) Registros de auditorias internas"}], "correct_option": "b", "domain": "Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 15, "text": "15. O planejamento de ações para abordar riscos e oportunidades no ISMS deve ser integrado ao processo de mudança. Qual plano é essencial?", "options": [{"id": "a", "text": "A) Plano de contingência"}, {"id": "b", "text": "B) Plano de tratamento de riscos"}, {"id": "c", "text": "C) Plano de treinamento"}], "correct_option": "b", "domain": "Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 16, "text": "16. Na operação do ISMS, o controle de mudanças não planejadas deve ser gerenciado. Qual controle é priorizado?", "options": [{"id": "a", "text": "A)"}, {"id": "b", "text": "B)"}, {"id": "c", "text": "C) Avaliação de impacto na segurança"}], "correct_option": "a", "domain": "Domínio 2: Information Security Management System", "theme": "tecnologico"}, {"id": 17, "text": "17. A cláusula de suporte exige comunicação relevante. Quem define o que, quando, com quem e como comunicar?", "options": [{"id": "a", "text": "A) Topo da gestão"}, {"id": "b", "text": "B) Equipe de TI"}, {"id": "c", "text": "C) Auditor externo"}], "correct_option": "b", "domain": "Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 18, "text": "18. No ISMS, a externalização de processos deve manter a confidencialidade, integridade e disponibilidade. Qual anexo é referenciado?", "options": [{"id": "a", "text": "A)"}, {"id": "b", "text": "B) Anexo A.15"}, {"id": "c", "text": "C) Anexo A.5"}], "correct_option": "b", "domain": "Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 19, "text": "19. A cláusula 4.1 da ISO/IEC 27001:2022 exige que a organização determine questões internas e externas. Qual ferramenta é comumente usada para estruturar essa análise?", "options": [{"id": "a", "text": "A) Análise SWOT ou PESTLE"}, {"id": "b", "text": "B) Diagrama de Ishikawa"}, {"id": "c", "text": "C) Matriz de Eisenhower"}], "correct_option": "b", "domain": "Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 20, "text": "20. A cláusula 4.2 exige identificar partes interessadas e seus requisitos. Um fornecedor de serviços em nuvem exige que contratos incluam cláusulas de SLA de segurança. Como isso deve ser tratado?", "options": [{"id": "a", "text": "A) Ignorado, pois requisitos de fornecedores não são obrigatórios no SGSI"}, {"id": "b", "text": "B) Documentado como um requisito de parte interessada e tratado no escopo do SGSI"}, {"id": "c", "text": "C) Incluído apenas no contrato comercial, sem impacto no SGSI"}], "correct_option": "a", "domain": "Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 21, "text": "21. O escopo do SGSI deve ser documentado. Qual afirmação está correta sobre a definição do escopo conforme a cláusula 4.3?", "options": [{"id": "a", "text": "A) O escopo pode excluir unidades de negócio desde que não processem informações críticas"}, {"id": "b", "text": "B) O escopo deve considerar interfaces e dependências com atividades externas à organização"}, {"id": "c", "text": "C) O escopo é determinado exclusivamente pelo departamento de TI"}], "correct_option": "a", "domain": "Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 22, "text": "22. A cláusula 5.1 exige comprometimento da Alta Direção com o SGSI. Qual ação demonstra esse comprometimento de forma mais efetiva?", "options": [{"id": "a", "text": "A) Delegar toda a responsabilidade do SGSI ao gerente de TI"}, {"id": "b", "text": "B) Assegurar que os objetivos do SGSI estejam integrados aos processos de negócio da organização"}, {"id": "c", "text": "C) Aprovar o orçamento de TI anualmente sem monitoramento específico do SGSI"}], "correct_option": "b", "domain": "Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 23, "text": "23. A política de segurança da informação (cláusula 5.2) deve conter comprometimento com a melhoria contínua. Como ela deve ser disponibilizada?", "options": [{"id": "a", "text": "A) Apenas internamente, mantida em sigilo para evitar análise por concorrentes"}, {"id": "b", "text": "B) Disponível como informação documentada e comunicada dentro da organização e a partes interessadas relevantes"}, {"id": "c", "text": "C) Publicada somente no site da empresa sem distribuição interna formal"}], "correct_option": "b", "domain": "Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 24, "text": "24. A cláusula 7.3 trata de conscientização. Qual é o mínimo que as pessoas devem conhecer conforme a norma?", "options": [{"id": "a", "text": "A) A política de segurança da informação, sua contribuição para o SGSI e as implicações da não conformidade"}, {"id": "b", "text": "B) Todos os controles do Anexo A e seus respectivos objetivos de controle"}, {"id": "c", "text": "C) Os resultados das últimas três auditorias internas realizadas"}], "correct_option": "b", "domain": "Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 25, "text": "25. A cláusula 7.4 exige determinação das comunicações relevantes para o SGSI. Quais aspectos devem ser definidos?", "options": [{"id": "a", "text": "A) Apenas o canal de comunicação a ser utilizado"}, {"id": "b", "text": "B) O que, quando, com quem, como comunicar e quem deve comunicar"}, {"id": "c", "text": "C) Somente as comunicações externas com reguladores e auditores"}], "correct_option": "b", "domain": "Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 26, "text": "26. Informação documentada exigida pelo SGSI deve ser controlada. O que a cláusula 7.5.3 exige em relação ao controle?", "options": [{"id": "a", "text": "A) Que toda documentação seja mantida em papel e assinada fisicamente"}, {"id": "b", "text": "B) Que a informação documentada esteja disponível, adequada para uso e protegida apropriadamente"}, {"id": "c", "text": "C) Que apenas a equipe de segurança tenha acesso à documentação do SGSI"}], "correct_option": "c", "domain": "Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 27, "text": "27. Processos terceirizados que afetam o SGSI devem ser controlados (cláusula 8.1). Qual é a responsabilidade da organização nesse caso?", "options": [{"id": "a", "text": "A) Transferir toda a responsabilidade de segurança ao fornecedor terceirizado"}, {"id": "b", "text": "B) Assegurar que esses processos sejam controlados, mesmo quando executados por terceiros"}, {"id": "c", "text": "C) Exigir apenas que o fornecedor possua certificação ISO 27001 vigente"}], "correct_option": "a", "domain": "Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 28, "text": "28. Uma organização identificou que seu SGSI não está mais alinhado com mudanças regulatórias recentes. Qual cláusula aborda diretamente a necessidade de mudanças planejadas no SGSI?", "options": [{"id": "a", "text": "A) Cláusula 6.3 – Planejamento de mudanças"}, {"id": "b", "text": "B) Cláusula 9.3 – Análise crítica pela Direção"}, {"id": "c", "text": "C) Cláusula 10.2 – Não conformidade e ação corretiva"}], "correct_option": "b", "domain": "Domínio 2: Information Security Management System", "theme": "organizacional"}, {"id": 29, "text": "29. No planejamento da implementação, a análise de riscos deve identificar ativos de informação. Qual é o primeiro passo?", "options": [{"id": "a", "text": "A) Identificar ameaças e vulnerabilidades"}, {"id": "b", "text": "B) Definir critérios de aceitação de riscos"}, {"id": "c", "text": "C) Avaliar impactos potenciais"}], "correct_option": "b", "domain": "Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 30, "text": "30. O Statement of Applicability (SoA) é gerado após a avaliação de riscos. Qual seu propósito principal?", "options": [{"id": "a", "text": "A) Definir escopo"}, {"id": "b", "text": "B) Listar controles selecionados e justificativas"}, {"id": "c", "text": "C) Estabelecer política"}], "correct_option": "b", "domain": "Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 31, "text": "31. Para planejar a implementação, o escopo do ISMS deve considerar interfaces e dependências. Qual fator é excluído?", "options": [{"id": "a", "text": "A)"}, {"id": "b", "text": "B)"}, {"id": "c", "text": "C) Localização geográfica irrelevante"}], "correct_option": "b", "domain": "Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 32, "text": "32. No planejamento, metas de segurança da informação devem ser SMART. Qual não é um critério SMART?", "options": [{"id": "a", "text": "A) Específica"}, {"id": "b", "text": "B) Ambígua"}, {"id": "c", "text": "C) Mensurável"}], "correct_option": "b", "domain": "Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 33, "text": "33. A implementação do plano de tratamento de riscos inclui opções como evitar, mitigar ou transferir. Qual exige seguro?", "options": [{"id": "a", "text": "A) Aceitar"}, {"id": "b", "text": "B) Transferir"}, {"id": "c", "text": "C) Reduzir"}], "correct_option": "b", "domain": "Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 34, "text": "34. O planejamento deve incluir cronograma e recursos. Qual ferramenta é recomendada para monitoramento?", "options": [{"id": "a", "text": "A)"}, {"id": "b", "text": "B)"}, {"id": "c", "text": "C) Plano de projeto com marcos"}], "correct_option": "b", "domain": "Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 35, "text": "35. Antes da implementação, a aprovação do SoA deve ser dada pela gestão. Qual cláusula suporta isso?", "options": [{"id": "a", "text": "A) Cláusula 6.1.3"}, {"id": "b", "text": "B) Cláusula 5.2"}, {"id": "c", "text": "C) Cláusula 7.5"}], "correct_option": "b", "domain": "Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 36, "text": "36. Durante o planejamento da implementação do SGSI, a análise do contexto é concluída. Qual é o próximo passo lógico conforme a sequência da norma?", "options": [{"id": "a", "text": "A) Implementar imediatamente os controles do Anexo A"}, {"id": "b", "text": "B) Definir o escopo e iniciar o processo de avaliação de riscos"}, {"id": "c", "text": "C) Obter a certificação provisória do SGSI"}], "correct_option": "b", "domain": "Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 37, "text": "37. O processo de avaliação de riscos (cláusula 6.1.2) exige a identificação de proprietários de riscos. Qual é a função do proprietário do risco?", "options": [{"id": "a", "text": "A) Executar todos os controles relacionados ao risco identificado"}, {"id": "b", "text": "B) Ser responsável por autorizar o plano de tratamento e aceitar os riscos residuais"}, {"id": "c", "text": "C) Reportar todos os riscos identificados diretamente ao auditor externo"}], "correct_option": "b", "domain": "Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 38, "text": "38. A cláusula 6.1.2 exige que os critérios de avaliação de riscos sejam estabelecidos. O que deve ser definido como critério de aceitação de risco?", "options": [{"id": "a", "text": "A) O valor monetário máximo de perda aceito pela organização"}, {"id": "b", "text": "B) O nível de risco que a organização está disposta a aceitar ou tolerar"}, {"id": "c", "text": "C) A lista de riscos que serão automaticamente transferidos para seguradoras"}], "correct_option": "b", "domain": "Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 39, "text": "39. A Declaração de Aplicabilidade (SoA) é um documento fundamental na ISO/IEC 27001. O que ela DEVE conter obrigatoriamente?", "options": [{"id": "a", "text": "A) Apenas os controles selecionados para implementação"}, {"id": "b", "text": "B) Os controles necessários, a justificativa para inclusão ou exclusão e o status de implementação"}, {"id": "c", "text": "C) O resultado detalhado de todas as avaliações de risco realizadas"}], "correct_option": "a", "domain": "Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 40, "text": "40. A opção de tratamento de risco 'modificar' (mitigar) implica qual ação?", "options": [{"id": "a", "text": "A) Encerrar a atividade que deu origem ao risco"}, {"id": "b", "text": "B) Implementar controles para reduzir a probabilidade ou impacto do risco"}, {"id": "c", "text": "C) Transferir o risco para um terceiro via contrato de seguro"}], "correct_option": "b", "domain": "Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 41, "text": "41. Os objetivos de segurança da informação (cláusula 6.2) devem ser SMART. Qual característica NÃO é exigida pela norma para esses objetivos?", "options": [{"id": "a", "text": "A) Serem monitorados e atualizados"}, {"id": "b", "text": "B) Serem secretos para proteger a estratégia de segurança"}, {"id": "c", "text": "C) Serem comunicados e disponíveis como informação documentada"}], "correct_option": "c", "domain": "Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 42, "text": "42. Na fase de planejamento, ao selecionar controles para tratamento de risco, a organização deve comparar sua seleção com o Anexo A. Qual é o objetivo dessa comparação?", "options": [{"id": "a", "text": "A) Garantir que todos os 93 controles do Anexo A sejam implementados sem exceção"}, {"id": "b", "text": "B) Verificar se nenhum controle necessário foi omitido inadvertidamente"}, {"id": "c", "text": "C) Confirmar que os controles selecionados estão aprovados pela alta direção"}], "correct_option": "b", "domain": "Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 43, "text": "43. Uma empresa está planejando implementar o SGSI em fases. A fase inicial cobre apenas a área de TI. Como deve ser documentado o escopo?", "options": [{"id": "a", "text": "A) O escopo deve sempre cobrir toda a organização para ser válido"}, {"id": "b", "text": "B) O escopo deve ser claramente documentado descrevendo os limites, interfaces e dependências"}, {"id": "c", "text": "C) O escopo parcial inviabiliza a certificação ISO 27001"}], "correct_option": "b", "domain": "Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 44, "text": "44. O plano de tratamento de riscos deve ser aprovado por quem, conforme a cláusula 6.1.3?", "options": [{"id": "a", "text": "A) Apenas pelo gerente de segurança da informação"}, {"id": "b", "text": "B) Pelos proprietários de riscos e pela Alta Direção"}, {"id": "c", "text": "C) Pelo auditor interno antes de qualquer implementação"}], "correct_option": "c", "domain": "Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 45, "text": "45. Ao planejar a implementação, a organização deve determinar recursos necessários (cláusula 7.1). Qual categoria de recurso é frequentemente subestimada?", "options": [{"id": "a", "text": "A) Infraestrutura de hardware para os sistemas de segurança"}, {"id": "b", "text": "B) Competência humana, incluindo treinamentos e contratação de especialistas"}, {"id": "c", "text": "C) Software de gestão de vulnerabilidades e SIEM"}], "correct_option": "a", "domain": "Domínio 3: Planning an ISMS implementation based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 46, "text": "46. Na implementação, o controle de acesso lógico (A.9) exige autenticação forte. Qual é um método comum?", "options": [{"id": "a", "text": "A) Apenas senha"}, {"id": "b", "text": "B) Senha + biometria"}, {"id": "c", "text": "C) Token sem expiração"}], "correct_option": "b", "domain": "Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "tecnologico"}, {"id": 47, "text": "47. Para implementar suporte, treinamentos devem ser planejados. Qual evidência é necessária?", "options": [{"id": "a", "text": "A) Registros de participação e eficácia"}, {"id": "b", "text": "B) Lista de participantes"}, {"id": "c", "text": "C) Certificados genéricos"}], "correct_option": "b", "domain": "Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 48, "text": "48. A implementação operacional inclui gerenciamento de incidentes (A.16). Qual é o primeiro passo em um incidente?", "options": [{"id": "a", "text": "A)"}, {"id": "b", "text": "B)"}, {"id": "c", "text": "C) Contenção e erradicação"}], "correct_option": "b", "domain": "Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 49, "text": "49. No controle de fornecedores (A.15), acordos devem especificar responsabilidades de SI. Qual cláusula guia?", "options": [{"id": "a", "text": "A) Cláusula 7.1.2"}, {"id": "b", "text": "B) Cláusula 8.1.4"}, {"id": "c", "text": "C) Cláusula 9.1"}], "correct_option": "b", "domain": "Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 50, "text": "50. Implementar criptografia (A.10) protege dados em trânsito. Qual algoritmo é aprovado pela ISO?", "options": [{"id": "a", "text": "A) AES-256"}, {"id": "b", "text": "B) DES"}, {"id": "c", "text": "C) MD5"}], "correct_option": "b", "domain": "Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "tecnologico"}, {"id": 51, "text": "51. A segregação de funções é implementada para prevenir fraudes. Qual exemplo?", "options": [{"id": "a", "text": "A)"}, {"id": "b", "text": "B)"}, {"id": "c", "text": "C) Aprovação separada de pagamentos"}], "correct_option": "b", "domain": "Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 52, "text": "52. Durante a implementação, mudanças devem ser controladas. Qual processo ISO?", "options": [{"id": "a", "text": "A) Auditoria interna"}, {"id": "b", "text": "B) Controle de mudanças (8.1.3)"}, {"id": "c", "text": "C) Revisão de gestão"}], "correct_option": "a", "domain": "Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 53, "text": "53. O controle A.5.15 trata de controle de acesso. Qual é o princípio fundamental que deve orientar as regras de controle de acesso?", "options": [{"id": "a", "text": "A) Acesso máximo para garantir produtividade dos usuários"}, {"id": "b", "text": "B) Princípio do menor privilégio – acesso apenas ao necessário para executar funções"}, {"id": "c", "text": "C) Acesso baseado exclusivamente no cargo hierárquico do usuário"}], "correct_option": "b", "domain": "Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 54, "text": "54. Durante a implementação do controle A.8.7 (proteção contra malware), qual abordagem é mais alinhada à norma?", "options": [{"id": "a", "text": "A) Instalar antivírus apenas em servidores críticos de produção"}, {"id": "b", "text": "B) Implementar controles de detecção, prevenção e recuperação combinados com conscientização dos usuários"}, {"id": "c", "text": "C) Bloquear todos os dispositivos externos sem exceção"}], "correct_option": "b", "domain": "Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "tecnologico"}, {"id": 55, "text": "55. A implementação de criptografia (controle A.8.24) deve seguir uma política. O que essa política deve estabelecer?", "options": [{"id": "a", "text": "A) Apenas os algoritmos de criptografia aprovados pelo departamento de TI"}, {"id": "b", "text": "B) Abordagem para uso de criptografia, incluindo gestão de chaves criptográficas"}, {"id": "c", "text": "C) A lista de dados que NÃO precisam ser criptografados"}], "correct_option": "b", "domain": "Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "tecnologico"}, {"id": 56, "text": "56. O controle A.5.24 exige planejamento para gestão de incidentes. O que deve ser definido durante a implementação?", "options": [{"id": "a", "text": "A) Apenas o contato do fornecedor de suporte técnico para situações emergenciais"}, {"id": "b", "text": "B) Processos, papéis, responsabilidades e procedimentos de comunicação para resposta a incidentes"}, {"id": "c", "text": "C) Somente os valores de RTO e RPO para sistemas críticos"}], "correct_option": "b", "domain": "Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 57, "text": "57. Um Lead Implementer está implementando o controle A.5.9 (inventário de ativos). Qual informação é essencial no inventário?", "options": [{"id": "a", "text": "A) Apenas o valor de mercado dos ativos físicos"}, {"id": "b", "text": "B) Identificação do ativo, proprietário, classificação e localização"}, {"id": "c", "text": "C) Data de compra e número de série de equipamentos de hardware"}], "correct_option": "a", "domain": "Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 58, "text": "58. O controle A.8.8 trata de gestão de vulnerabilidades técnicas. Qual processo deve ser implementado?", "options": [{"id": "a", "text": "A) Varredura de vulnerabilidades apenas após incidentes confirmados"}, {"id": "b", "text": "B) Identificação, avaliação e tratamento tempestivo de vulnerabilidades técnicas nos sistemas"}, {"id": "c", "text": "C) Aplicação automática de todos os patches sem avaliação prévia de impacto"}], "correct_option": "c", "domain": "Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "tecnologico"}, {"id": 59, "text": "59. Durante a implementação, a organização deseja garantir a segurança no desenvolvimento de software. Qual controle do Anexo A aborda esse tema?", "options": [{"id": "a", "text": "A) A.8.25 – Ciclo de vida de desenvolvimento seguro"}, {"id": "b", "text": "B) A.8.15 – Log"}, {"id": "c", "text": "C) A.5.31 – Requisitos legais, estatutários, regulamentares e contratuais"}], "correct_option": "b", "domain": "Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "tecnologico"}, {"id": 60, "text": "60. A implementação de segurança física é regida pelos controles A.7.x. Qual princípio orienta a criação de perímetros de segurança?", "options": [{"id": "a", "text": "A) Usar barreiras únicas de alta tecnologia para reduzir custos"}, {"id": "b", "text": "B) Implementar múltiplas camadas de segurança física (defesa em profundidade)"}, {"id": "c", "text": "C) Restringir acesso físico apenas durante horário comercial"}], "correct_option": "a", "domain": "Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "fisico"}, {"id": 61, "text": "61. O controle A.6.3 exige treinamento em segurança da informação. Com qual frequência e abrangência ele deve ser realizado?", "options": [{"id": "a", "text": "A) Anualmente, apenas para novos funcionários admitidos no período"}, {"id": "b", "text": "B) Regularmente para todo o pessoal e partes interessadas relevantes, com conteúdo atualizado pertinente às funções"}, {"id": "c", "text": "C) Apenas quando houver mudanças significativas na política de segurança"}], "correct_option": "c", "domain": "Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "pessoas"}, {"id": 62, "text": "62. Ao implementar o controle A.5.14 sobre transferência de informações, o que deve ser estabelecido?", "options": [{"id": "a", "text": "A) Apenas a política de uso de e-mail corporativo criptografado"}, {"id": "b", "text": "B) Regras, procedimentos ou acordos para transferência de informações em todos os tipos de instalações"}, {"id": "c", "text": "C) Lista de destinatários aprovados para receber informações confidenciais"}], "correct_option": "b", "domain": "Domínio 4: Implementing an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 63, "text": "63. O monitoramento inclui KPIs. Qual método para medir eficácia do ISMS?", "options": [{"id": "a", "text": "A) Auditorias internas"}, {"id": "b", "text": "B) Pesquisas de satisfação"}, {"id": "c", "text": "C) Contagem de incidentes"}], "correct_option": "b", "domain": "Domínio 5: Monitoring and measurement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 64, "text": "64. A medição de conformidade legal exige monitoramento contínuo. Qual evidência?", "options": [{"id": "a", "text": "A) Declaração única"}, {"id": "b", "text": "B) Registros de revisões legais"}, {"id": "c", "text": "C) Relatório anual"}], "correct_option": "b", "domain": "Domínio 5: Monitoring and measurement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 65, "text": "65. No desempenho, a análise de dados de incidentes deve ser feita. Qual ferramenta?", "options": [{"id": "a", "text": "A)"}, {"id": "b", "text": "B)"}, {"id": "c", "text": "C) Métricas de tempo médio de resolução (MTTR)"}], "correct_option": "b", "domain": "Domínio 5: Monitoring and measurement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 66, "text": "66. A cláusula 9.1 exige monitoramento, medição, análise e avaliação. Quem define métodos?", "options": [{"id": "a", "text": "A) Topo da gestão"}, {"id": "b", "text": "B) Equipe de SI"}, {"id": "c", "text": "C) Consultor externo"}], "correct_option": "b", "domain": "Domínio 5: Monitoring and measurement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 67, "text": "67. Para medir eficácia dos controles, use conformidade e cobertura. Qual é um indicador?", "options": [{"id": "a", "text": "A) Número de funcionários"}, {"id": "b", "text": "B) Taxa de conformidade com SoA"}, {"id": "c", "text": "C) Orçamento de TI"}], "correct_option": "b", "domain": "Domínio 5: Monitoring and measurement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 68, "text": "68. A satisfação das partes interessadas é monitorada por pesquisas. Qual frequência típica?", "options": [{"id": "a", "text": "A)"}, {"id": "b", "text": "B)"}, {"id": "c", "text": "C) Anual ou após mudanças"}], "correct_option": "a", "domain": "Domínio 5: Monitoring and measurement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 69, "text": "69. Registros de monitoramento devem ser retidos. Qual cláusula?", "options": [{"id": "a", "text": "A) 7.5.3"}, {"id": "b", "text": "B) 9.1.3"}, {"id": "c", "text": "C) 10.2"}], "correct_option": "b", "domain": "Domínio 5: Monitoring and measurement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 70, "text": "70. A avaliação de conformidade inclui testes de penetração. Qual cláusula suporta?", "options": [{"id": "a", "text": "A) 6.1.2"}, {"id": "b", "text": "B) 9.2.1 (auditoria interna)"}, {"id": "c", "text": "C) 8.2"}], "correct_option": "c", "domain": "Domínio 5: Monitoring and measurement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 71, "text": "71. A cláusula 9.1 exige que a organização avalie o desempenho do SGSI. Qual dos indicadores abaixo é mais adequado para medir a eficácia de um controle de conscientização?", "options": [{"id": "a", "text": "A) Número de licenças de software de segurança adquiridas"}, {"id": "b", "text": "B) Percentual de funcionários que identificaram corretamente e-mails de phishing em testes simulados"}, {"id": "c", "text": "C) Valor do orçamento investido em treinamentos de segurança"}], "correct_option": "a", "domain": "Domínio 5: Monitoring and measurement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 72, "text": "72. O programa de auditoria interna (cláusula 9.2) deve ser planejado considerando quais fatores?", "options": [{"id": "a", "text": "A) Apenas a disponibilidade dos auditores internos e o calendário da organização"}, {"id": "b", "text": "B) A importância dos processos, resultados de auditorias anteriores e mudanças que afetam a organização"}, {"id": "c", "text": "C) Somente os requisitos definidos pelo organismo certificador externo"}], "correct_option": "b", "domain": "Domínio 5: Monitoring and measurement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 73, "text": "73. Um auditor interno encontrou evidências de que a análise crítica pela Direção (cláusula 9.3) não incluiu a situação de ações de análises críticas anteriores. Qual é a classificação correta dessa constatação?", "options": [{"id": "a", "text": "A) Observação, pois não compromete a eficácia do SGSI"}, {"id": "b", "text": "B) Não conformidade, pois a cláusula 9.3.2 a) exige explicitamente esse item como entrada"}, {"id": "c", "text": "C) Oportunidade de melhoria, pois a norma recomenda mas não exige esse item"}], "correct_option": "c", "domain": "Domínio 5: Monitoring and measurement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 74, "text": "74. Os resultados da análise crítica pela Direção devem incluir quais tipos de decisões?", "options": [{"id": "a", "text": "A) Apenas decisões sobre o orçamento do próximo exercício fiscal"}, {"id": "b", "text": "B) Decisões sobre oportunidades de melhoria contínua e necessidades de mudanças no SGSI"}, {"id": "c", "text": "C) Exclusivamente ações corretivas para não conformidades identificadas em auditorias"}], "correct_option": "a", "domain": "Domínio 5: Monitoring and measurement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 75, "text": "75. Ao definir o que monitorar e medir no SGSI (cláusula 9.1), qual informação deve ser determinada?", "options": [{"id": "a", "text": "A) Apenas os resultados financeiros impactados por incidentes de segurança"}, {"id": "b", "text": "B) O que monitorar, os métodos de análise, quando realizar e quem deve analisar e avaliar os resultados"}, {"id": "c", "text": "C) Somente os indicadores exigidos pelo organismo de certificação contratado"}], "correct_option": "b", "domain": "Domínio 5: Monitoring and measurement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 76, "text": "76. A cláusula 10.1 exige melhoria contínua do SGSI. Quais são as dimensões que devem ser aprimoradas continuamente?", "options": [{"id": "a", "text": "A) Apenas a eficiência operacional dos controles técnicos implementados"}, {"id": "b", "text": "B) A pertinência, adequação e eficácia do SGSI"}, {"id": "c", "text": "C) Somente os processos com não conformidades identificadas em auditorias"}], "correct_option": "b", "domain": "Domínio 6: Continual improvement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 77, "text": "77. Ao tratar uma não conformidade (cláusula 10.2), qual passo é realizado APÓS controlar e corrigir a não conformidade?", "options": [{"id": "a", "text": "A) Notificar imediatamente o organismo certificador sobre a ocorrência"}, {"id": "b", "text": "B) Avaliar a necessidade de ações para eliminar as causas e evitar recorrência"}, {"id": "c", "text": "C) Arquivar a documentação e encerrar o registro da não conformidade"}], "correct_option": "b", "domain": "Domínio 6: Continual improvement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 78, "text": "78. A análise de causa raiz é realizada no contexto do tratamento de não conformidades. Qual ferramenta é adequada para essa análise?", "options": [{"id": "a", "text": "A) Apenas análise de custo-benefício dos controles envolvidos"}, {"id": "b", "text": "B) Diagrama de Ishikawa (espinha de peixe) ou metodologia dos 5 Porquês"}, {"id": "c", "text": "C) Exclusivamente testes de penetração técnicos"}], "correct_option": "b", "domain": "Domínio 6: Continual improvement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 79, "text": "79. A informação documentada retida sobre não conformidades e ações corretivas (cláusula 10.2 f-g) serve a qual propósito principal?", "options": [{"id": "a", "text": "A) Comprovar ao organismo certificador que a organização seguiu todos os requisitos formais"}, {"id": "b", "text": "B) Evidenciar o aprendizado organizacional e a eficácia das ações tomadas para eliminar causas"}, {"id": "c", "text": "C) Calcular o custo total das não conformidades para reporte à Alta Direção"}], "correct_option": "b", "domain": "Domínio 6: Continual improvement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}, {"id": 80, "text": "80. A melhoria contínua do SGSI pode ser impulsionada por diversas fontes de informação. Qual das seguintes NÃO é uma fonte típica de oportunidades de melhoria?", "options": [{"id": "a", "text": "A) Resultados de auditorias internas e externas"}, {"id": "b", "text": "B) Relatórios de vendas do departamento comercial"}, {"id": "c", "text": "C) Lições aprendidas de incidentes de segurança"}], "correct_option": "b", "domain": "Domínio 6: Continual improvement of an ISMS based on ISO/IEC 27001", "theme": "organizacional"}]</script>
    <script>
      const ALL_QUESTIONS = JSON.parse(document.getElementById('questions-data').textContent);
      const CONFIG = {"examTitle": "ISO/IEC 27001 Lead Implementer Simulator — Simulado 3 (PECB)", "examSubtitle": "Formato em blocos de 10 questões, com pausa e acompanhamento de desempenho.", "totalSeconds": 10800};
      const BLOCK_SIZE = 10;
      const TOTAL = ALL_QUESTIONS.length;
      const TOTAL_BLOCKS = Math.ceil(TOTAL / BLOCK_SIZE);
      const TOTAL_SECONDS = CONFIG.totalSeconds;

      const state = {
        view: 'intro', // intro | exam | pause | confirmSubmit | manualPause | final
        current: 1, // 1-indexed question number
        maxUnlocked: BLOCK_SIZE,
        answers: {}, // qid -> letter
        bookmarks: new Set(),
        filter: 'all', // all | bookmarked | unanswered
        secondsLeft: TOTAL_SECONDS,
        timerId: null,
        pauseBlockIndex: null, // which block the pause screen refers to (0-indexed)
      };

      const byId = (i) => ALL_QUESTIONS[i - 1];

      const THEME_META = {
        organizacional: { label: '📁 Controles Organizacionais', controls: 37, order: 1 },
        pessoas:        { label: '👥 Controles de Pessoas',       controls: 8,  order: 2 },
        fisico:         { label: '🏢 Controles Físicos',          controls: 14, order: 3 },
        tecnologico:    { label: '💻 Controles Tecnológicos',     controls: 34, order: 4 },
      };
      const THEME_ORDER = ['organizacional', 'pessoas', 'fisico', 'tecnologico'];

      function computeStatsForQuestions(qs) {
        let correct = 0;
        const perQuestion = [];
        qs.forEach(q => {
          const chosen = state.answers[q.id];
          const isCorrect = chosen === q.correct_option;
          if (isCorrect) correct++;
          perQuestion.push({ id: q.id, correct: isCorrect, answered: chosen !== undefined });
        });
        return { correct, total: qs.length, perQuestion };
      }

      function computeDomainBreakdown(qs) {
        const byTheme = {};
        THEME_ORDER.forEach(k => { byTheme[k] = { correct: 0, total: 0 }; });
        qs.forEach(q => {
          const key = THEME_META[q.theme] ? q.theme : 'organizacional';
          byTheme[key].total++;
          if (state.answers[q.id] === q.correct_option) byTheme[key].correct++;
        });
        return byTheme;
      }

      function barChartHTML(byDomain) {
        return THEME_ORDER.map(k => {
          const meta = THEME_META[k];
          const d = byDomain[k] || { correct: 0, total: 0 };
          const pct = d.total ? Math.round((d.correct / d.total) * 100) : 0;
          const color = d.total === 0 ? '#cbd5e1' : (pct >= 70 ? '#15803d' : (pct >= 50 ? '#d97706' : '#b91c1c'));
          const countLabel = d.total ? `${d.correct}/${d.total} (${pct}%)` : 'sem dados ainda';
          return `
            <div class="bar-row">
              <div class="bar-label" title="${escapeHtml(meta.label)} · ${meta.controls} controles">${escapeHtml(meta.label)}</div>
              <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
              <div class="bar-pct">${countLabel}</div>
            </div>`;
        }).join('');
      }

      function escapeHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      function fmtTime(totalSec) {
        const s = Math.max(0, totalSec);
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const sec = Math.floor(s % 60);
        const pad = (n) => String(n).padStart(2, '0');
        return `${pad(h)}:${pad(m)}:${pad(sec)}`;
      }

      function startTimer() {
        if (state.timerId) return;
        state.timerId = setInterval(() => {
          if (state.view !== 'exam') return; // ticks only while actively answering
          state.secondsLeft--;
          if (state.secondsLeft <= 0) {
            state.secondsLeft = 0;
            clearInterval(state.timerId);
            state.timerId = null;
            state.view = 'final';
            render();
            return;
          }
          const el = document.getElementById('timer-display');
          if (el) el.textContent = fmtTime(state.secondsLeft);
        }, 1000);
      }

      function render() {
        const app = document.getElementById('app');
        if (state.view === 'intro') app.innerHTML = renderIntro();
        else if (state.view === 'exam') app.innerHTML = renderExamChrome() + renderExamBody();
        else if (state.view === 'pause') app.innerHTML = renderExamChrome(true) + renderPause();
        else if (state.view === 'confirmSubmit') app.innerHTML = renderExamChrome(true) + renderConfirmSubmit();
        else if (state.view === 'manualPause') app.innerHTML = renderExamChrome(true) + renderManualPause();
        else if (state.view === 'final') app.innerHTML = renderFinal();
        attachHandlers();
        window.scrollTo(0, 0);
      }

      function renderIntro() {
        return `
          <div class="card">
            <h1>${escapeHtml(CONFIG.examTitle)}</h1>
            <p class="sub">${escapeHtml(CONFIG.examSubtitle)}</p>
            <ul class="plain">
              <li><span>Total de questões</span><strong>${TOTAL}</strong></li>
              <li><span>Tempo total</span><strong>${fmtTime(TOTAL_SECONDS)}</strong></li>
              <li><span>Nota de aprovação</span><strong>70%</strong></li>
              <li><span>Pausas</span><strong>a cada ${BLOCK_SIZE} questões, com resultado parcial</strong></li>
            </ul>
            <div class="footer-actions" style="justify-content:flex-end">
              <button class="btn" id="start-btn">Iniciar Simulado</button>
            </div>
          </div>`;
      }

      function renderExamChrome(disabled) {
        const pct = TOTAL_SECONDS ? state.secondsLeft / TOTAL_SECONDS : 1;
        const timerCls = pct < 0.1 ? 'timer low' : 'timer ok';
        return `
          <div class="topbar">
            <div class="examname">Exam: <span>${escapeHtml(CONFIG.examTitle)}</span></div>
            <div class="loggedas">Logged in as: Student</div>
          </div>
          <div class="toolbar">
            <button class="navbtn" id="prev-q-btn" ${disabled || state.current <= 1 ? 'disabled' : ''}>&lsaquo;</button>
            <span class="qcounter">Question ${state.current} of ${TOTAL}</span>
            <button class="navbtn" id="next-q-btn-top" ${disabled || state.current >= state.maxUnlocked ? 'disabled' : ''}>&rsaquo;</button>
            <button class="bookmarkbtn ${state.bookmarks.has(state.current) ? 'active' : ''}" id="bookmark-btn" ${disabled ? 'disabled' : ''}>🔖 Bookmark</button>
            <div class="spacer"></div>
            <div class="${timerCls}">🕐 <span id="timer-display">${fmtTime(state.secondsLeft)}</span></div>
            <button class="pausebtn" id="manual-pause-btn" ${disabled ? 'disabled' : ''}>⏸ Pause Exam</button>
            <button class="submitbtn" id="submit-exam-btn" ${disabled ? 'disabled' : ''}>✓ SUBMIT EXAM</button>
          </div>
          <div class="filterbar">
            Show:
            <label><input type="radio" name="filter" value="all" ${state.filter==='all'?'checked':''} ${disabled?'disabled':''}> All</label>
            <label><input type="radio" name="filter" value="bookmarked" ${state.filter==='bookmarked'?'checked':''} ${disabled?'disabled':''}> Bookmarked</label>
            <label><input type="radio" name="filter" value="unanswered" ${state.filter==='unanswered'?'checked':''} ${disabled?'disabled':''}> Unanswered</label>
          </div>
          <div class="gridwrap">
            <div class="grid">${renderGrid(disabled)}</div>
          </div>`;
      }

      function renderGrid(disabled) {
        let nums = [];
        for (let i = 1; i <= TOTAL; i++) nums.push(i);
        if (state.filter === 'bookmarked') nums = nums.filter(i => state.bookmarks.has(i));
        if (state.filter === 'unanswered') nums = nums.filter(i => i <= state.maxUnlocked && state.answers[byId(i).id] === undefined);
        if (nums.length === 0) return `<span class="sub">Nenhuma questão nesse filtro.</span>`;
        return nums.map(i => {
          const locked = i > state.maxUnlocked;
          const answered = state.answers[byId(i).id] !== undefined;
          let cls = 'gridnum';
          if (i === state.current) cls += ' current';
          else if (answered) cls += ' answered';
          if (locked) cls += ' locked';
          if (state.bookmarks.has(i)) cls += ' bookmarked';
          return `<button type="button" class="${cls}" data-goto="${i}" ${locked || disabled ? 'disabled' : ''} title="${locked ? 'Bloqueada até concluir o bloco anterior' : ''}">${i}</button>`;
        }).join('');
      }

      function renderExamBody() {
        const q = byId(state.current);
        const isLastGlobal = state.current === TOTAL;
        const optionsHtml = q.options.map(opt => {
          const checked = state.answers[q.id] === opt.id ? 'checked' : '';
          const cls = state.answers[q.id] === opt.id ? 'opt answered' : 'opt';
          return `
            <label class="${cls}">
              <input type="radio" name="q_${q.id}" value="${opt.id}" ${checked} data-qid="${q.id}" data-opt="${opt.id}">
              <span>${escapeHtml(opt.text)}</span>
            </label>`;
        }).join('');

        const nextControls = isLastGlobal
          ? `<span class="sub" style="margin:0">Última questão — use SUBMIT EXAM para finalizar.</span>`
          : `<button class="btn gray" id="skip-q-btn">Skip Question &rsaquo;</button>
             <button class="btn" id="next-q-btn">Go To Next Question &rsaquo;</button>`;

        return `
          <div class="main">
            <div class="qtext">${escapeHtml(q.text)}</div>
            ${optionsHtml}
            <div class="footer-actions">
              <span></span>
              <div style="display:flex;gap:10px">${nextControls}</div>
            </div>
          </div>`;
      }

      function renderPause() {
        const blockIndex = state.pauseBlockIndex;
        const start = blockIndex * BLOCK_SIZE;
        const qs = ALL_QUESTIONS.slice(start, start + BLOCK_SIZE);
        const blockStats = computeStatsForQuestions(qs);
        const answeredSoFar = ALL_QUESTIONS.slice(0, start + BLOCK_SIZE);
        const cumStats = computeStatsForQuestions(answeredSoFar);
        const cumPct = Math.round((cumStats.correct / cumStats.total) * 100);
        const byDomain = computeDomainBreakdown(answeredSoFar);
        const isLastBlock = (start + BLOCK_SIZE) >= TOTAL;

        const reviewChips = blockStats.perQuestion.map((p, i) => {
          const num = start + i + 1;
          return `<div class="review-chip ${p.correct ? 'ok' : 'no'}" title="Questão ${num}">${num}</div>`;
        }).join('');

        return `
          <div class="main">
            <h1>Exame Pausado</h1>
            <p class="sub">Bloco ${blockIndex + 1} de ${TOTAL_BLOCKS} concluído (questões ${start+1}–${start+qs.length}).</p>

            <div class="section-title">Resultado provisório · últimas ${qs.length} perguntas</div>
            <div class="stat-grid">
              <div class="stat-box">
                <div class="num">${blockStats.correct}/${blockStats.total}</div>
                <div class="label">Acertos neste bloco</div>
              </div>
              <div class="stat-box">
                <div class="num">${Math.round((blockStats.correct/blockStats.total)*100)}%</div>
                <div class="label">Aproveitamento do bloco</div>
              </div>
            </div>
            <div class="review-list">${reviewChips}</div>

            <div class="section-title">Resultado acumulado · ${cumStats.total} respondidas</div>
            <div class="stat-grid">
              <div class="stat-box">
                <div class="num">${cumStats.correct}/${cumStats.total}</div>
                <div class="label">Acertos no total</div>
              </div>
              <div class="stat-box">
                <div class="num">${cumPct}% <span class="pill ${cumPct>=70?'good':'bad'}">${cumPct>=70?'No caminho da aprovação':'Abaixo de 70%'}</span></div>
                <div class="label">Aproveitamento acumulado</div>
              </div>
            </div>

            <div class="section-title">Acertos por domínio (acumulado)</div>
            ${barChartHTML(byDomain)}

            <div class="footer-actions">
              <span></span>
              ${isLastBlock
                ? `<button class="btn" id="final-btn">Ver Resultado Final</button>`
                : `<button class="btn" id="continue-btn">Continuar (próximas ${Math.min(BLOCK_SIZE, TOTAL - (start+BLOCK_SIZE))} perguntas)</button>`}
            </div>
          </div>`;
      }

      function renderConfirmSubmit() {
        return `
          <div class="main">
            <h1>Finalizar o simulado?</h1>
            <p class="sub">Você respondeu ${Object.keys(state.answers).length} de ${TOTAL} questões. Questões não respondidas contam como erradas no resultado final.</p>
            <div class="footer-actions">
              <button class="btn gray" id="cancel-submit-btn">Voltar ao exame</button>
              <button class="btn" id="confirm-submit-btn">Confirmar e Ver Resultado</button>
            </div>
          </div>`;
      }

      function renderManualPause() {
        return `
          <div class="main">
            <h1>Exame Pausado Manualmente</h1>
            <p class="sub">O cronômetro está parado. Clique em retomar para continuar de onde parou.</p>
            <div class="footer-actions">
              <span></span>
              <button class="btn" id="resume-btn">Retomar Exame</button>
            </div>
          </div>`;
      }

      function renderFinal() {
        const all = ALL_QUESTIONS;
        const stats = computeStatsForQuestions(all.filter(q => state.answers[q.id] !== undefined || true));
        const pct = Math.round((stats.correct / stats.total) * 100);
        const approved = pct >= 70;
        const byDomain = computeDomainBreakdown(all);

        return `
          <div class="card">
            <h1>Resultado Final</h1>
            <p class="sub">${escapeHtml(CONFIG.examTitle)}</p>
            <div class="stat-grid">
              <div class="stat-box">
                <div class="num">${stats.correct}/${stats.total}</div>
                <div class="label">Acertos totais</div>
              </div>
              <div class="stat-box">
                <div class="num">${pct}% <span class="pill ${approved?'good':'bad'}">${approved?'APROVADO':'NÃO APROVADO'}</span></div>
                <div class="label">Nota final (corte: 70%)</div>
              </div>
            </div>

            <div class="section-title">Acertos por domínio</div>
            ${barChartHTML(byDomain)}

            <div class="footer-actions">
              <span></span>
              <button class="btn secondary" id="retake-btn">Refazer Simulado</button>
            </div>
          </div>`;
      }

      function advance() {
        // called from Next/Skip: moves from state.current forward by 1, triggering pause at 10-boundaries
        const leaving = state.current;
        if (leaving % BLOCK_SIZE === 0 && leaving < TOTAL) {
          state.pauseBlockIndex = (leaving / BLOCK_SIZE) - 1;
          state.view = 'pause';
          render();
          return;
        }
        if (leaving < TOTAL) {
          state.current = leaving + 1;
          render();
        }
      }

      function attachHandlers() {
        const startBtn = document.getElementById('start-btn');
        if (startBtn) startBtn.onclick = () => {
          state.view = 'exam'; state.current = 1; state.maxUnlocked = BLOCK_SIZE;
          render(); startTimer();
        };

        document.querySelectorAll('input[type=radio][name^="q_"]').forEach(input => {
          input.onchange = (e) => {
            const qid = Number(e.target.dataset.qid);
            state.answers[qid] = e.target.dataset.opt;
            render();
          };
        });

        document.querySelectorAll('input[type=radio][name="filter"]').forEach(input => {
          input.onchange = (e) => { state.filter = e.target.value; render(); };
        });

        document.querySelectorAll('.gridnum').forEach(btn => {
          btn.onclick = (e) => {
            const n = Number(e.currentTarget.dataset.goto);
            if (n > state.maxUnlocked) return;
            state.current = n;
            render();
          };
        });

        const prevBtn = document.getElementById('prev-q-btn');
        if (prevBtn) prevBtn.onclick = () => { if (state.current > 1) { state.current--; render(); } };

        const nextTopBtn = document.getElementById('next-q-btn-top');
        if (nextTopBtn) nextTopBtn.onclick = () => { if (state.current < state.maxUnlocked) { state.current++; render(); } };

        const nextBtn = document.getElementById('next-q-btn');
        if (nextBtn) nextBtn.onclick = advance;
        const skipBtn = document.getElementById('skip-q-btn');
        if (skipBtn) skipBtn.onclick = advance;

        const bookmarkBtn = document.getElementById('bookmark-btn');
        if (bookmarkBtn) bookmarkBtn.onclick = () => {
          if (state.bookmarks.has(state.current)) state.bookmarks.delete(state.current);
          else state.bookmarks.add(state.current);
          render();
        };

        const manualPauseBtn = document.getElementById('manual-pause-btn');
        if (manualPauseBtn) manualPauseBtn.onclick = () => { state.view = 'manualPause'; render(); };
        const resumeBtn = document.getElementById('resume-btn');
        if (resumeBtn) resumeBtn.onclick = () => { state.view = 'exam'; render(); };

        const submitBtn = document.getElementById('submit-exam-btn');
        if (submitBtn) submitBtn.onclick = () => { state.view = 'confirmSubmit'; render(); };
        const cancelSubmitBtn = document.getElementById('cancel-submit-btn');
        if (cancelSubmitBtn) cancelSubmitBtn.onclick = () => { state.view = 'exam'; render(); };
        const confirmSubmitBtn = document.getElementById('confirm-submit-btn');
        if (confirmSubmitBtn) confirmSubmitBtn.onclick = () => { state.view = 'final'; render(); };

        const continueBtn = document.getElementById('continue-btn');
        if (continueBtn) continueBtn.onclick = () => {
          state.maxUnlocked = Math.min(TOTAL, state.maxUnlocked + BLOCK_SIZE);
          state.current = state.current + 1 > TOTAL ? TOTAL : (state.pauseBlockIndex + 1) * BLOCK_SIZE + 1;
          state.view = 'exam';
          render();
        };

        const finalBtn = document.getElementById('final-btn');
        if (finalBtn) finalBtn.onclick = () => { state.view = 'final'; render(); };

        const retakeBtn = document.getElementById('retake-btn');
        if (retakeBtn) retakeBtn.onclick = () => {
          state.view = 'intro'; state.current = 1; state.maxUnlocked = BLOCK_SIZE;
          state.answers = {}; state.bookmarks = new Set(); state.filter = 'all';
          state.secondsLeft = TOTAL_SECONDS;
          render();
        };
      }

      render();
    </script>
  </body>
</html>
