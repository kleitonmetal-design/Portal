<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Visual dos Controles ISO/IEC 27001:2022</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    .quiz-page-wrapper {
      --font-stack: 'Lexend', sans-serif;
      --bg-body: #f4ecd8;
      --bg-surface: #fbf0d9;
      --bg-card: #fdf6e2;
      --text-main: #2d2b28;
      --text-muted: #57534e;
      --border-color: #d6c7a1;
      --accent: #0284c7;

      --theme-org: #15803d;
      --theme-org-bg: #f0fdf4;
      --theme-pessoas: #0284c7;
      --theme-pessoas-bg: #f0f9ff;
      --theme-fisico: #b45309;
      --theme-fisico-bg: #fffbeb;
      --theme-tec: #b91c1c;
      --theme-tec-bg: #fef2f2;

      font-family: var(--font-stack);
      font-size: var(--font-size-base, 18px);
      line-height: 1.6;
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 80px;
      transition: background-color 0.3s, color 0.3s;
    }

    .quiz-page-wrapper[data-theme="sepia"] {
      --bg-body: #f4ecd8;
      --bg-surface: #fbf0d9;
      --bg-card: #fdf6e2;
      --text-main: #2d2b28;
      --text-muted: #57534e;
      --border-color: #d6c7a1;
      --accent: #0284c7;
    }

    .quiz-page-wrapper[data-theme="cream"] {
      --bg-body: #f7f5ee;
      --bg-surface: #ffffff;
      --bg-card: #faf8f5;
      --text-main: #1f2937;
      --text-muted: #4b5563;
      --border-color: #e2ded4;
      --accent: #2563eb;
    }

    .quiz-page-wrapper[data-theme="dark-soft"] {
      --bg-body: #1e2022;
      --bg-surface: #272a2d;
      --bg-card: #2d3135;
      --text-main: #e2e4e7;
      --text-muted: #9ba1a6;
      --border-color: #3f4448;
      --accent: #38bdf8;
    }

    .quiz-page-wrapper[data-font="opendyslexic"] {
      --font-stack: 'Comic Sans MS', 'Lexend', sans-serif;
    }

    /* Header */
    header.sticky-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background-color: var(--bg-surface);
      border-bottom: 2px solid var(--border-color);
      padding: 12px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .header-container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .back-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
    }

    .header-title {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .btn-tool {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Main Container */
    main.main-content {
      max-width: 800px;
      margin: 32px auto 0;
      padding: 0 20px;
    }

    /* Scoreboard */
    .scoreboard {
      background: var(--bg-surface);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .score-item {
      text-align: center;
    }

    .score-val {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent);
    }

    .score-lbl {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Filter Bar */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .filter-btn {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-main);
      cursor: pointer;
    }

    .filter-btn.active {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    /* Card Question */
    .question-card {
      background: var(--bg-surface);
      border: 3px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      position: relative;
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .badge-org { background: var(--theme-org-bg); color: var(--theme-org); border: 1px solid var(--theme-org); }
    .badge-pessoas { background: var(--theme-pessoas-bg); color: var(--theme-pessoas); border: 1px solid var(--theme-pessoas); }
    .badge-fisico { background: var(--theme-fisico-bg); color: var(--theme-fisico); border: 1px solid var(--theme-fisico); }
    .badge-tec { background: var(--theme-tec-bg); color: var(--theme-tec); border: 1px solid var(--theme-tec); }

    .visual-illustration {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }

    .illustration-icon {
      font-size: 3.5rem;
      margin-bottom: 8px;
    }

    .illustration-title {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .question-text {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    /* Options */
    .options-grid {
      display: grid;
      gap: 12px;
    }

    .option-btn {
      text-align: left;
      background: var(--bg-card);
      color: var(--text-main);
      border: 2px solid var(--border-color);
      padding: 14px 18px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
    }

    .option-btn:hover {
      border-color: var(--accent);
    }

    .option-btn.correct {
      background: #dcfce7;
      border-color: #22c55e;
      color: #14532d;
    }

    .option-btn.wrong {
      background: #fee2e2;
      border-color: #ef4444;
      color: #7f1d1d;
    }

    /* Feedback Box */
    .feedback-box {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      font-size: 0.95rem;
    }

    .feedback-box.show {
      display: block;
    }

    .feedback-box.correct-bg {
      background: #dcfce7;
      border: 1px solid #86efac;
      color: #14532d;
    }

    .feedback-box.wrong-bg {
      background: #fee2e2;
      border: 1px solid #fca5a5;
      color: #7f1d1d;
    }

    .next-btn {
      margin-top: 16px;
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="quiz-app" class="quiz-page-wrapper" data-theme="sepia" data-font="lexend">
    
    <header class="sticky-header">
      <div class="header-container">
        <div style="display:flex; align-items:center; gap:12px;">
          <a href="./simulados.html" class="back-link">← Voltar</a>
          <h1 class="header-title">🧩 Quiz Visual - Controles ISO 27001:2022</h1>
        </div>
        <div>
          <button class="btn-tool" onclick="toggleTheme()">🎨 Tema</button>
          <button class="btn-tool" onclick="toggleFont()">🔤 Fonte</button>
        </div>
      </div>
    </header>

    <main class="main-content">
      <!-- Placar -->
      <div class="scoreboard">
        <div class="score-item">
          <div id="val-score" class="score-val">0</div>
          <div class="score-lbl">Pontos</div>
        </div>
        <div class="score-item">
          <div id="val-streak" class="score-val">🔥 0</div>
          <div class="score-lbl">Sequência</div>
        </div>
        <div class="score-item">
          <div id="val-progress" class="score-val">1/10</div>
          <div class="score-lbl">Progresso</div>
        </div>
      </div>

      <!-- Filtros de Tema da ISO -->
      <div class="filter-bar">
        <button class="filter-btn active" onclick="setFilter('all')">Todos os 4 Temas</button>
        <button class="filter-btn" onclick="setFilter('org')">🟩 Organizacional (A.5)</button>
        <button class="filter-btn" onclick="setFilter('pessoas')">🟦 Pessoas (A.6)</button>
        <button class="filter-btn" onclick="setFilter('fisico')">🟨 Físico (A.7)</button>
        <button class="filter-btn" onclick="setFilter('tec')">🟥 Tecnológico (A.8)</button>
      </div>

      <!-- Card da Pergunta Visual -->
      <div class="question-card" id="q-card">
        <div id="q-badge" class="category-badge badge-org">🟩 A.5 Organizacional</div>
        
        <div class="visual-illustration">
          <div id="q-icon" class="illustration-icon">📋</div>
          <div id="q-scenario" class="illustration-title">Cenário Prático de Segurança</div>
        </div>

        <div id="q-question" class="question-text">Qual controle do Anexo A aborda este cenário?</div>

        <div id="q-options" class="options-grid"></div>

        <div id="q-feedback" class="feedback-box"></div>
        <button id="btn-next" class="next-btn" style="display:none;" onclick="nextQuestion()">Próximo Controle ➔</button>
      </div>
    </main>
  </div>

  <script>
    const quizData = [
      {
        id: 1,
        theme: 'org',
        themeLabel: '🟩 A.5 Organizacional',
        badgeClass: 'badge-org',
        icon: '📋',
        scenario: 'Definição de Papéis e Responsabilidades',
        question: 'A empresa precisa garantir que todos os colaboradores saibam quem é responsável por aprovar acessos e proteger os ativos. Qual controle exige isso?',
        options: [
          { text: 'A.5.2 Papéis e responsabilidades de segurança da informação', correct: true },
          { text: 'A.7.1 Perímetros físicos de segurança', correct: false },
          { text: 'A.8.7 Proteção contra malware', correct: false }
        ],
        explanation: 'O controle A.5.2 estabelece que os papéis e as responsabilidades de segurança devem ser formalmente definidos e atribuídos.'
      },
      {
        id: 2,
        theme: 'pessoas',
        themeLabel: '🟦 A.6 Pessoas',
        badgeClass: 'badge-pessoas',
        icon: '🎓',
        scenario: 'Conscientização e Treinamento de Funcionários',
        question: 'Realizar simulações periódicas de phishing e treinamentos com novos contratados é exigência de qual controle?',
        options: [
          { text: 'A.6.3 Conscientização, educação e treinamento em segurança', correct: true },
          { text: 'A.5.1 Policiamento de segurança', correct: false },
          { text: 'A.8.12 Prevenção contra vazamento de dados', correct: false }
        ],
        explanation: 'O controle A.6.3 exige que pessoal da organização receba conscientização e treinamento adequados regularmente.'
      },
      {
        id: 3,
        theme: 'fisico',
        themeLabel: '🟨 A.7 Físico',
        badgeClass: 'badge-fisico',
        icon: '🏢',
        scenario: 'Perímetro de Segurança do Data Center',
        question: 'Instalação de catracas, crachás biométricos e paredes reforçadas para proteger o Data Center atende a qual controle?',
        options: [
          { text: 'A.7.1 Perímetros físicos de segurança', correct: true },
          { text: 'A.8.2 Acesso privilegiado', correct: false },
          { text: 'A.5.8 Segurança na gestão de projetos', correct: false }
        ],
        explanation: 'O controle A.7.1 define a criação e proteção de perímetros físicos de segurança para proteger instalações de informação.'
      },
      {
        id: 4,
        theme: 'tec',
        themeLabel: '🟥 A.8 Tecnológico',
        badgeClass: 'badge-tec',
        icon: '🔑',
        scenario: 'Múltiplo Fator de Autenticação (MFA)',
        question: 'Exigir senha forte + token no celular para login dos administradores de sistema reflete qual controle?',
        options: [
          { text: 'A.8.5 Autenticação segura', correct: true },
          { text: 'A.7.4 Monitoramento de segurança física', correct: false },
          { text: 'A.6.5 Termos de confidencialidade', correct: false }
        ],
        explanation: 'O controle A.8.5 exige práticas de autenticação seguras baseadas em tecnologias adequadas (como MFA).'
      },
      {
        id: 5,
        theme: 'tec',
        themeLabel: '🟥 A.8 Tecnológico',
        badgeClass: 'badge-tec',
        icon: '🔒',
        scenario: 'Criptografia em Repouso e em Trânsito',
        question: 'Proteger banco de dados com AES-256 e conexões web com TLS 1.3 garante qual controle?',
        options: [
          { text: 'A.8.24 Uso de criptografia', correct: true },
          { text: 'A.5.15 Controle de acesso', correct: false },
          { text: 'A.7.8 Mesa limpa e tela limpa', correct: false }
        ],
        explanation: 'O controle A.8.24 define regras para o uso de criptografia e gerenciamento de chaves para proteger a informação.'
      },
      {
        id: 6,
        theme: 'org',
        themeLabel: '🟩 A.5 Organizacional',
        badgeClass: 'badge-org',
        icon: '🏷️',
        scenario: 'Classificação e Rotulagem da Informação',
        question: 'Marcar documentos como "Confidencial", "Restrito" ou "Público" atende a qual controle?',
        options: [
          { text: 'A.5.12 Classificação da informação', correct: true },
          { text: 'A.8.16 Monitoramento de atividades (Logs)', correct: false },
          { text: 'A.6.2 Termos de contratação', correct: false }
        ],
        explanation: 'O controle A.5.12 exige que a informação seja classificada de acordo com a necessidade de proteção da organização.'
      },
      {
        id: 7,
        theme: 'fisico',
        themeLabel: '🟨 A.7 Físico',
        badgeClass: 'badge-fisico',
        icon: '🧹',
        scenario: 'Política de Mesa Limpa e Tela Limpa',
        question: 'Bloquear a tela ao se ausentar e não deixar papéis confidenciais na mesa reflete qual controle?',
        options: [
          { text: 'A.7.7 Política de mesa limpa e tela limpa', correct: true },
          { text: 'A.8.9 Gestão de configurações', correct: false },
          { text: 'A.5.3 Segregação de funções', correct: false }
        ],
        explanation: 'O controle A.7.7 estabelece regras de mesa limpa para papéis e mídias e tela limpa para equipamentos.'
      },
      {
        id: 8,
        theme: 'tec',
        themeLabel: '🟥 A.8 Tecnológico',
        badgeClass: 'badge-tec',
        icon: '📜',
        scenario: 'Registros de Eventos (Logs) e SIEM',
        question: 'Coletar e auditar logs de acessos para identificar tentativas de invasão é requisito de qual controle?',
        options: [
          { text: 'A.8.15 Registros de eventos (Logging)', correct: true },
          { text: 'A.6.8 Notificação de eventos de segurança', correct: false },
          { text: 'A.7.9 Manutenção de equipamentos', correct: false }
        ],
        explanation: 'O controle A.8.15 exige a geração, armazenamento e análise de registros de eventos (logs).'
      }
    ];

    let currentQuestions = [...quizData];
    let currentIdx = 0;
    let score = 0;
    let streak = 0;
    let answered = false;

    const themes = ['sepia', 'cream', 'dark-soft'];
    let themeIdx = 0;
    let fontIdx = 0;

    function toggleTheme() {
      themeIdx = (themeIdx + 1) % themes.length;
      document.getElementById('quiz-app').setAttribute('data-theme', themes[themeIdx]);
    }

    function toggleFont() {
      fontIdx = (fontIdx + 1) % 2;
      document.getElementById('quiz-app').setAttribute('data-font', fontIdx === 1 ? 'opendyslexic' : 'lexend');
    }

    function setFilter(theme) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if (theme === 'all') {
        currentQuestions = [...quizData];
      } else {
        currentQuestions = quizData.filter(q => q.theme === theme);
      }
      currentIdx = 0;
      renderQuestion();
    }

    function renderQuestion() {
      if (currentQuestions.length === 0) return;
      answered = false;
      const q = currentQuestions[currentIdx];

      document.getElementById('val-progress').textContent = `${currentIdx + 1}/${currentQuestions.length}`;
      document.getElementById('q-badge').className = `category-badge ${q.badgeClass}`;
      document.getElementById('q-badge').textContent = q.themeLabel;
      document.getElementById('q-icon').textContent = q.icon;
      document.getElementById('q-scenario').textContent = q.scenario;
      document.getElementById('q-question').textContent = q.question;

      const optsContainer = document.getElementById('q-options');
      optsContainer.innerHTML = q.options.map((opt, i) => `
        <button class="option-btn" onclick="selectOption(${i})">
          <span>${String.fromCharCode(65 + i)})</span>
          <span>${opt.text}</span>
        </button>
      `).join('');

      const fb = document.getElementById('q-feedback');
      fb.className = 'feedback-box';
      fb.style.display = 'none';
      document.getElementById('btn-next').style.display = 'none';
    }

    function selectOption(optIdx) {
      if (answered) return;
      answered = true;

      const q = currentQuestions[currentIdx];
      const selected = q.options[optIdx];
      const buttons = document.querySelectorAll('.option-btn');

      buttons.forEach((btn, i) => {
        if (q.options[i].correct) {
          btn.classList.add('correct');
        } else if (i === optIdx) {
          btn.classList.add('wrong');
        }
      });

      const fb = document.getElementById('q-feedback');
      fb.style.display = 'block';

      if (selected.correct) {
        score += 10;
        streak += 1;
        fb.className = 'feedback-box correct-bg show';
        fb.innerHTML = `<strong>✨ Correto!</strong> ${q.explanation}`;
      } else {
        streak = 0;
        fb.className = 'feedback-box wrong-bg show';
        fb.innerHTML = `<strong>❌ Incorreto.</strong> ${q.explanation}`;
      }

      document.getElementById('val-score').textContent = score;
      document.getElementById('val-streak').textContent = `🔥 ${streak}`;
      document.getElementById('btn-next').style.display = 'block';
    }

    function nextQuestion() {
      currentIdx = (currentIdx + 1) % currentQuestions.length;
      renderQuestion();
    }

    renderQuestion();
  </script>
</body>
</html>
