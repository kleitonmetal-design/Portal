<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Visual dos Controles ISO/IEC 27001:2022</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    .quiz-page-wrapper {
      --font-stack: 'Lexend', sans-serif;
      --bg-body: #f4ecd8;
      --bg-surface: #fbf0d9;
      --bg-card: #fdf6e2;
      --text-main: #2d2b28;
      --text-muted: #57534e;
      --border-color: #d6c7a1;
      --accent: #0284c7;

      --theme-org: #15803d;
      --theme-org-bg: #f0fdf4;
      --theme-pessoas: #0284c7;
      --theme-pessoas-bg: #f0f9ff;
      --theme-fisico: #b45309;
      --theme-fisico-bg: #fffbeb;
      --theme-tec: #b91c1c;
      --theme-tec-bg: #fef2f2;

      font-family: var(--font-stack);
      font-size: var(--font-size-base, 18px);
      line-height: 1.6;
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 80px;
      transition: background-color 0.3s, color 0.3s;
    }

    .quiz-page-wrapper[data-theme="sepia"] {
      --bg-body: #f4ecd8;
      --bg-surface: #fbf0d9;
      --bg-card: #fdf6e2;
      --text-main: #2d2b28;
      --text-muted: #57534e;
      --border-color: #d6c7a1;
      --accent: #0284c7;
    }

    .quiz-page-wrapper[data-theme="cream"] {
      --bg-body: #f7f5ee;
      --bg-surface: #ffffff;
      --bg-card: #faf8f5;
      --text-main: #1f2937;
      --text-muted: #4b5563;
      --border-color: #e2ded4;
      --accent: #2563eb;
    }

    .quiz-page-wrapper[data-theme="dark-soft"] {
      --bg-body: #1e2022;
      --bg-surface: #272a2d;
      --bg-card: #2d3135;
      --text-main: #e2e4e7;
      --text-muted: #9ba1a6;
      --border-color: #3f4448;
      --accent: #38bdf8;
    }

    .quiz-page-wrapper[data-font="opendyslexic"] {
      --font-stack: 'Comic Sans MS', 'Lexend', sans-serif;
    }

    /* Header */
    header.sticky-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background-color: var(--bg-surface);
      border-bottom: 2px solid var(--border-color);
      padding: 12px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .header-container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .back-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
    }

    .header-title {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .btn-tool {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Main Container */
    main.main-content {
      max-width: 800px;
      margin: 32px auto 0;
      padding: 0 20px;
    }

    /* Scoreboard */
    .scoreboard {
      background: var(--bg-surface);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .score-item {
      text-align: center;
    }

    .score-val {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent);
    }

    .score-lbl {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Filter Bar */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .filter-btn {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-main);
      cursor: pointer;
    }

    .filter-btn.active {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    /* Card Question */
    .question-card {
      background: var(--bg-surface);
      border: 3px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      position: relative;
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .badge-org { background: var(--theme-org-bg); color: var(--theme-org); border: 1px solid var(--theme-org); }
    .badge-pessoas { background: var(--theme-pessoas-bg); color: var(--theme-pessoas); border: 1px solid var(--theme-pessoas); }
    .badge-fisico { background: var(--theme-fisico-bg); color: var(--theme-fisico); border: 1px solid var(--theme-fisico); }
    .badge-tec { background: var(--theme-tec-bg); color: var(--theme-tec); border: 1px solid var(--theme-tec); }

    .visual-illustration {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }

    .illustration-icon {
      font-size: 3.5rem;
      margin-bottom: 8px;
    }

    .illustration-title {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .question-text {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    /* Options */
    .options-grid {
      display: grid;
      gap: 12px;
    }

    .option-btn {
      text-align: left;
      background: var(--bg-card);
      color: var(--text-main);
      border: 2px solid var(--border-color);
      padding: 14px 18px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.2s;
    }

    .option-btn:hover {
      border-color: var(--accent);
    }

    .option-btn.correct {
      background: #dcfce7 !important;
      border-color: #22c55e !important;
      color: #14532d !important;
    }

    .option-btn.wrong {
      background: #fee2e2 !important;
      border-color: #ef4444 !important;
      color: #7f1d1d !important;
    }

    /* Feedback Box */
    .feedback-box {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      font-size: 0.95rem;
    }

    .feedback-box.show {
      display: block;
    }

    .feedback-box.correct-bg {
      background: #dcfce7;
      border: 1px solid #86efac;
      color: #14532d;
    }

    .feedback-box.wrong-bg {
      background: #fee2e2;
      border: 1px solid #fca5a5;
      color: #7f1d1d;
    }

    .next-btn {
      margin-top: 16px;
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="quiz-app" class="quiz-page-wrapper" data-theme="sepia" data-font="lexend">
    
    <header class="sticky-header">
      <div class="header-container">
        <div style="display:flex; align-items:center; gap:12px;">
          <a href="./simulados.html" class="back-link">← Voltar</a>
          <h1 class="header-title">🧩 Quiz Visual - Controles ISO 27001:2022</h1>
        </div>
        <div>
          <button class="btn-tool" onclick="toggleTheme()">🎨 Tema</button>
          <button class="btn-tool" onclick="toggleFont()">🔤 Fonte</button>
        </div>
      </div>
    </header>

    <main class="main-content">
      <!-- Placar -->
      <div class="scoreboard">
        <div class="score-item">
          <div id="val-score" class="score-val">0</div>
          <div class="score-lbl">Pontos</div>
        </div>
        <div class="score-item">
          <div id="val-streak" class="score-val">🔥 0</div>
          <div class="score-lbl">Sequência</div>
        </div>
        <div class="score-item">
          <div id="val-progress" class="score-val">1/12</div>
          <div class="score-lbl">Progresso</div>
        </div>
      </div>

      <!-- Filtros de Tema da ISO -->
      <div class="filter-bar">
        <button class="filter-btn active" onclick="setFilter('all')">Todos os 4 Temas</button>
        <button class="filter-btn" onclick="setFilter('org')">🟩 Organizacional (A.5)</button>
        <button class="filter-btn" onclick="setFilter('pessoas')">🟦 Pessoas (A.6)</button>
        <button class="filter-btn" onclick="setFilter('fisico')">🟨 Físico (A.7)</button>
        <button class="filter-btn" onclick="setFilter('tec')">🟥 Tecnológico (A.8)</button>
      </div>

      <!-- Card da Pergunta Visual -->
      <div class="question-card" id="q-card">
        <div id="q-badge" class="category-badge badge-org">🟩 A.5 Organizacional</div>
        
        <div class="visual-illustration">
          <div id="q-icon" class="illustration-icon">📋</div>
          <div id="q-scenario" class="illustration-title">Cenário Prático de Segurança</div>
        </div>

        <div id="q-question" class="question-text">Qual controle do Anexo A aborda este cenário?</div>

        <div id="q-options" class="options-grid"></div>

        <div id="q-feedback" class="feedback-box"></div>
        <button id="btn-next" class="next-btn" style="display:none;" onclick="nextQuestion()">Próximo Controle ➔</button>
      </div>
    </main>
  </div>

  <script>
    const rawQuizData = [
      {
        id: 1,
        theme: 'org',
        themeLabel: '🟩 A.5 Organizacional',
        badgeClass: 'badge-org',
        icon: '📋',
        scenario: 'Definição de Responsabilidades de Segurança',
        question: 'A diretoria precisa garantir que a aprovação de acessos e a proteção de dados críticos tenham proprietários identificados. Qual controle trata especificamente disso?',
        options: [
          { text: 'A.5.2 Papéis e responsabilidades de segurança da informação', correct: true },
          { text: 'A.5.1 Políticas de segurança da informação', correct: false },
          { text: 'A.5.3 Segregação de funções', correct: false },
          { text: 'A.5.15 Controle de acesso', correct: false }
        ],
        explanation: 'O controle A.5.2 exige que os papéis e as responsabilidades de segurança sejam formalmente definidos e atribuídos aos responsáveis.'
      },
      {
        id: 2,
        theme: 'pessoas',
        themeLabel: '🟦 A.6 Pessoas',
        badgeClass: 'badge-pessoas',
        icon: '🎓',
        scenario: 'Conscientização e Testes de Phishing',
        question: 'Campanhas periódicas contra engenharia social e treinamento obrigatório na integração de funcionários atendem a qual controle?',
        options: [
          { text: 'A.6.3 Conscientização, educação e treinamento em segurança', correct: true },
          { text: 'A.6.1 Triagem (Screening)', correct: false },
          { text: 'A.6.5 Termos de responsabilidade e confidencialidade', correct: false },
          { text: 'A.6.8 Relato de eventos de segurança da informação', correct: false }
        ],
        explanation: 'O controle A.6.3 exige treinamentos e atualizações frequentes de conscientização em segurança para o pessoal da organização.'
      },
      {
        id: 3,
        theme: 'fisico',
        themeLabel: '🟨 A.7 Físico',
        badgeClass: 'badge-fisico',
        icon: '🏢',
        scenario: 'Perímetro Físico do Data Center',
        question: 'A construção de salas de servidores isoladas com cartões biométricos e paredes resistentes a impacto refere-se a qual controle?',
        options: [
          { text: 'A.7.1 Perímetros físicos de segurança', correct: true },
          { text: 'A.7.2 Entrada física', correct: false },
          { text: 'A.7.4 Monitoramento de segurança física', correct: false },
          { text: 'A.7.10 Mídias de armazenamento', correct: false }
        ],
        explanation: 'O controle A.7.1 exige a definição de barreiras e perímetros físicos de segurança para proteger áreas onde estão dados críticos.'
      },
      {
        id: 4,
        theme: 'tec',
        themeLabel: '🟥 A.8 Tecnológico',
        badgeClass: 'badge-tec',
        icon: '🔑',
        scenario: 'Autenticação Multifator (MFA)',
        question: 'Exigir senha + token no aplicativo móvel para o acesso dos administradores de TI aos servidores cumpre qual controle?',
        options: [
          { text: 'A.8.5 Autenticação segura', correct: true },
          { text: 'A.8.2 Acesso privilegiado', correct: false },
          { text: 'A.8.15 Registros de eventos (Logging)', correct: false },
          { text: 'A.8.20 Segurança nos serviços de rede', correct: false }
        ],
        explanation: 'O controle A.8.5 exige o uso de tecnologias e métodos de autenticação forte (como MFA) baseados na criticidade.'
      },
      {
        id: 5,
        theme: 'tec',
        themeLabel: '🟥 A.8 Tecnológico',
        badgeClass: 'badge-tec',
        icon: '🔒',
        scenario: 'Proteção Criptográfica de Dados',
        question: 'Aplicar criptografia AES-256 no banco de dados e TLS 1.3 nas conexões web garante qual controle do Anexo A?',
        options: [
          { text: 'A.8.24 Uso de criptografia', correct: true },
          { text: 'A.8.12 Prevenção contra vazamento de dados (DLP)', correct: false },
          { text: 'A.8.7 Proteção contra malware', correct: false },
          { text: 'A.8.11 Mascaramento de dados', correct: false }
        ],
        explanation: 'O controle A.8.24 define a implementação de criptografia e a correta gestão de chaves para resguardar dados.'
      },
      {
        id: 6,
        theme: 'org',
        themeLabel: '🟩 A.5 Organizacional',
        badgeClass: 'badge-org',
        icon: '🏷️',
        scenario: 'Classificação da Informação',
        question: 'Categorizar dados como "Confidencial", "Restrito" ou "Público" de acordo com o impacto de vazamento atende a qual controle?',
        options: [
          { text: 'A.5.12 Classificação da informação', correct: true },
          { text: 'A.5.10 Uso aceitável da informação e ativos', correct: false },
          { text: 'A.5.13 Rotulagem da informação', correct: false },
          { text: 'A.5.9 Inventário de informação e outros ativos associados', correct: false }
        ],
        explanation: 'O controle A.5.12 orienta a classificação das informações segundo seu valor, requisitos legais e sensibilidade.'
      },
      {
        id: 7,
        theme: 'fisico',
        themeLabel: '🟨 A.7 Físico',
        badgeClass: 'badge-fisico',
        icon: '🧹',
        scenario: 'Mesa Limpa e Tela Limpa',
        question: 'Evitar papeis com dados confidenciais sobre as mesas e bloqueio automático de tela após inatividade cumprem qual controle?',
        options: [
          { text: 'A.7.7 Política de mesa limpa e tela limpa', correct: true },
          { text: 'A.7.8 Posicionamento e proteção dos equipamentos', correct: false },
          { text: 'A.7.9 Manutenção dos equipamentos', correct: false },
          { text: 'A.7.3 Proteção contra ameaças físicas e ambientais', correct: false }
        ],
        explanation: 'O controle A.7.7 formaliza a proteção física de mídias/documentos de mesa e o bloqueio de telas não supervisionadas.'
      },
      {
        id: 8,
        theme: 'tec',
        themeLabel: '🟥 A.8 Tecnológico',
        badgeClass: 'badge-tec',
        icon: '📜',
        scenario: 'Registros de Eventos (Logs) e SIEM',
        question: 'A coleta centralizada de registros de logs e monitoramento de atividades suspeitas em servidores refere-se a qual controle?',
        options: [
          { text: 'A.8.15 Registros de eventos (Logging)', correct: true },
          { text: 'A.8.16 Monitoramento de atividades', correct: false },
          { text: 'A.8.23 Filtragem de conteúdo web', correct: false },
          { text: 'A.8.8 Gestão de vulnerabilidades técnicas', correct: false }
        ],
        explanation: 'O controle A.8.15 obriga a produção, retenção e análise auditável de logs de eventos do sistema.'
      },
      {
        id: 9,
        theme: 'pessoas',
        themeLabel: '🟦 A.6 Pessoas',
        badgeClass: 'badge-pessoas',
        icon: '🕵️‍♂️',
        scenario: 'Verificação de Antecedentes (Screening)',
        question: 'Validar histórico acadêmico, referências e antecedentes criminais antes da contratação atende a qual controle?',
        options: [
          { text: 'A.6.1 Triagem (Screening)', correct: true },
          { text: 'A.6.2 Termos de contratação', correct: false },
          { text: 'A.6.4 Processo disciplinar', correct: false },
          { text: 'A.6.5 Responsabilidades pós-desligamento', correct: false }
        ],
        explanation: 'O controle A.6.1 determina que a triagem de candidatos seja conduzida proporcionalmente ao risco antes da admissão.'
      },
      {
        id: 10,
        theme: 'org',
        themeLabel: '🟩 A.5 Organizacional',
        badgeClass: 'badge-org',
        icon: '🔀',
        scenario: 'Segregação de Funções',
        question: 'Impedir que o mesmo desenvolvedor tenha permissão de aprovar e colocar seu próprio código em produção é exigência de qual controle?',
        options: [
          { text: 'A.5.3 Segregação de funções', correct: true },
          { text: 'A.5.15 Controle de acesso', correct: false },
          { text: 'A.5.17 Informações de autenticação', correct: false },
          { text: 'A.5.8 Segurança na gestão de projetos', correct: false }
        ],
        explanation: 'O controle A.5.3 exige separar responsabilidades conflitantes para reduzir riscos de erro, fraude ou modificações indevidas.'
      },
      {
        id: 11,
        theme: 'tec',
        themeLabel: '🟥 A.8 Tecnológico',
        badgeClass: 'badge-tec',
        icon: '💾',
        scenario: 'Cópias de Segurança (Backup)',
        question: 'Testar e armazenar cópias periódicas de segurança de dados em local geograficamente distinto atende a qual controle?',
        options: [
          { text: 'A.8.13 Cópias de segurança (Backup)', correct: true },
          { text: 'A.8.14 Redundância dos recursos de informação', correct: false },
          { text: 'A.8.24 Uso de criptografia', correct: false },
          { text: 'A.8.9 Gestão de configurações', correct: false }
        ],
        explanation: 'O controle A.8.13 trata especificamente da execução, manutenção e teste regular de backups das informações.'
      },
      {
        id: 12,
        theme: 'tec',
        themeLabel: '🟥 A.8 Tecnológico',
        badgeClass: 'badge-tec',
        icon: '🛡️',
        scenario: 'Prevenção Contra Vazamento de Dados (DLP)',
        question: 'Bloquear o envio não autorizado de números de cartão e CPF para e-mails pessoais via rede atende a qual controle?',
        options: [
          { text: 'A.8.12 Prevenção contra vazamento de dados', correct: true },
          { text: 'A.8.23 Filtragem de conteúdo web', correct: false },
          { text: 'A.8.20 Segurança nos serviços de rede', correct: false },
          { text: 'A.8.28 Códigos-fonte de sistemas', correct: false }
        ],
        explanation: 'O controle A.8.12 estabelece ferramentas e políticas de DLP para monitorar e impedir a exfiltração de dados sensíveis.'
      }
    ];

    let currentQuestions = [...rawQuizData];
    let currentIdx = 0;
    let score = 0;
    let streak = 0;
    let answered = false;
    let activeShuffledOptions = [];

    const themes = ['sepia', 'cream', 'dark-soft'];
    let themeIdx = 0;
    let fontIdx = 0;

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function toggleTheme() {
      themeIdx = (themeIdx + 1) % themes.length;
      document.getElementById('quiz-app').setAttribute('data-theme', themes[themeIdx]);
    }

    function toggleFont() {
      fontIdx = (fontIdx + 1) % 2;
      document.getElementById('quiz-app').setAttribute('data-font', fontIdx === 1 ? 'opendyslexic' : 'lexend');
    }

    function setFilter(theme) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if (theme === 'all') {
        currentQuestions = shuffleArray(rawQuizData);
      } else {
        currentQuestions = shuffleArray(rawQuizData.filter(q => q.theme === theme));
      }
      currentIdx = 0;
      renderQuestion();
    }

    function renderQuestion() {
      if (currentQuestions.length === 0) return;
      answered = false;
      const q = currentQuestions[currentIdx];

      // Embaralhar as opções dinamicamente a cada carregamento de pergunta
      activeShuffledOptions = shuffleArray(q.options);

      document.getElementById('val-progress').textContent = `${currentIdx + 1}/${currentQuestions.length}`;
      document.getElementById('q-badge').className = `category-badge ${q.badgeClass}`;
      document.getElementById('q-badge').textContent = q.themeLabel;
      document.getElementById('q-icon').textContent = q.icon;
      document.getElementById('q-scenario').textContent = q.scenario;
      document.getElementById('q-question').textContent = q.question;

      const optsContainer = document.getElementById('q-options');
      optsContainer.innerHTML = activeShuffledOptions.map((opt, i) => `
        <button class="option-btn" onclick="selectOption(${i})">
          <span style="font-weight:700;">${String.fromCharCode(65 + i)})</span>
          <span>${opt.text}</span>
        </button>
      `).join('');

      const fb = document.getElementById('q-feedback');
      fb.className = 'feedback-box';
      fb.style.display = 'none';
      document.getElementById('btn-next').style.display = 'none';
    }

    function selectOption(optIdx) {
      if (answered) return;
      answered = true;

      const q = currentQuestions[currentIdx];
      const selected = activeShuffledOptions[optIdx];
      const buttons = document.querySelectorAll('.option-btn');

      buttons.forEach((btn, i) => {
        if (activeShuffledOptions[i].correct) {
          btn.classList.add('correct');
        } else if (i === optIdx) {
          btn.classList.add('wrong');
        }
      });

      const fb = document.getElementById('q-feedback');
      fb.style.display = 'block';

      if (selected.correct) {
        score += 10;
        streak += 1;
        fb.className = 'feedback-box correct-bg show';
        fb.innerHTML = `<strong>✨ Correto!</strong> ${q.explanation}`;
      } else {
        streak = 0;
        fb.className = 'feedback-box wrong-bg show';
        fb.innerHTML = `<strong>❌ Incorreto.</strong> ${q.explanation}`;
      }

      document.getElementById('val-score').textContent = score;
      document.getElementById('val-streak').textContent = `🔥 ${streak}`;
      document.getElementById('btn-next').style.display = 'block';
    }

    function nextQuestion() {
      currentIdx = (currentIdx + 1) % currentQuestions.length;
      renderQuestion();
    }

    // Inicialização com perguntas e opções embaralhadas
    currentQuestions = shuffleArray(rawQuizData);
    renderQuestion();
  </script>
</body>
</html>
